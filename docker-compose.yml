x-unraid-icon: &unraid-icon
  net.unraid.docker.icon: "https://nanobot.wiki/assets/nanobot_icon.png"

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
  volumes:
    - .:/home/nanobot/src
    - ./.nanobot:/home/nanobot/.nanobot
    # SSH key 放 .nanobot/.ssh，挂载到标准路径供 git 使用
    - ./.nanobot/.ssh:/home/nanobot/.ssh
    - /mnt/cache/ssd/note:/home/nanobot/note
    - /mnt/cache/ssd:/nas/ssd
    - /mnt/cache/appdata:/nas/appdata
    - /mnt/user/hdd:/nas/hdd
    # Docker socket — 用于操作宿主机 Docker 容器
    - /var/run/docker.sock:/var/run/docker.sock
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    labels:
      <<: *unraid-icon
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    profiles:
      - api
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    labels:
      <<: *unraid-icon
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
    labels:
      <<: *unraid-icon
