x-unraid-icon: &unraid-icon
  net.unraid.docker.icon: "https://nanobot.wiki/assets/nanobot_icon.png"

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  user: "99:100"
  environment:
    PUID: "99"
    PGID: "100"
  volumes:
    - ./.nanobot:/home/nanobot/.nanobot
    - /mnt/cache/ssd/note:/home/nanobot/note
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 18790:18790
      - 8765:8765
    labels:
      <<: *unraid-icon
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    profiles:
      - api
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    labels:
      <<: *unraid-icon
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
    labels:
      <<: *unraid-icon
