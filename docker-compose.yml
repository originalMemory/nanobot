x-unraid-icon: &unraid-icon
  net.unraid.docker.icon: "https://nanobot.wiki/assets/nanobot_icon.png"

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  user: "99:100"
  environment:
    PUID: "99"
    PGID: "100"
    TZ: Asia/Shanghai
    HTTP_PROXY: "http://192.168.31.73:7890"
    HTTPS_PROXY: "http://192.168.31.73:7890"
    NO_PROXY: "localhost,127.0.0.1,nanobot-gateway,nanobot-api"
    OAUTH_CLI_KIT_TOKEN_PATH: "/home/nanobot/.nanobot/auth/codex.json"
  group_add:
    - "281"
  volumes:
    - .:/home/nanobot/src
    - ./.nanobot:/home/nanobot/.nanobot
    # SSH key 放 .nanobot/.ssh，挂载到标准路径供 git 使用
    - ./.nanobot/.ssh:/home/nanobot/.ssh
    - /mnt/cache/ssd/note:/home/nanobot/note
    - /mnt/cache/ssd:/nas/ssd
    - /mnt/cache/appdata:/nas/appdata
    - /mnt/cache/clouddrive:/clouddrive
    - /mnt/user/hdd:/nas/hdd
    # Docker socket — 用于操作宿主机 Docker 容器
    - /var/run/docker.sock:/var/run/docker.sock
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 18790:18790
      - 8765:8765
    labels:
      <<: *unraid-icon
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    profiles:
      - api
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    labels:
      <<: *unraid-icon
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
    labels:
      <<: *unraid-icon
