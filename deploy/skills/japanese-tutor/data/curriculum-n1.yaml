  grammar:
  - pattern: 敬体／简体的选择
    function_cn: 根据说话人与听话人的年龄、职务高低及内外公司关系选择敬体或简体；对上司用简体、对下级用敬体；对外公司人员即使对方年龄职务较低也使用敬体以示礼貌。
    formation: 敬体（です／ます）与简体（常体）的对立
    constraints:
    - 上下级、内外公司、年龄长幼等社会关系决定语体选择
    - 敬语除表现上下级关系外，还可表示社会性亲疏关系
    contrasts:
    - 自谦语与尊他语的使用对象不同：对己方客户多用自谦语和尊他语，对方则可能几乎不用
  - pattern: 指示词 これ／それ／あれ 与 この／その／あの
    function_cn: 除指示说话人与听话人现场都可见的具体人、物外，还可指示谈话现场看不到的人、物或事情（信息共享用法）。
    formation: 近指／中指／远指 三档指示词
    constraints:
    - 当双方共同拥有某信息（如共同知晓的某商品资料）时，用远指形式指代该共享信息
    contrasts:
    - 现场可见的具体指代 与 现场不可见的共享信息指代 的区分
  - pattern: 指示词“それ／その／そいつ”用于说话人与听话人仅一方知晓的事物（信息不明确时）
    function_cn: 指代对方未知、仅己方认识的人或事物，与双方共知的“あの／あいつ”区分
    formation: 信息不明确时用“ソ”系列指示词
    constraints:
    - 双方都知道时用“あの”，仅一方知道时用“その／そいつ”
    contrasts:
    - “あの／あいつ”用于双方共知对象
  - pattern: 名词、一类形容词前加“お”构成敬语（如お電話、お車、お忙しい）
    function_cn: 动词以外的敬语表达方式，表示对对方持有物品、动作或状态的尊敬
    formation: お＋名词／一类形容词
    constraints:
    - 二类形容词词干及汉字词一般加“ご”（ご出張、ご都合、ご立派、ご不便）
    - 常用汉字词如“電話”用“お”而非“ご”（お電話、お返事、お大事）
    contrasts:
    - “お”用于名词、一类形容词及部分常用汉字词；“ご”用于二类形容词词干及一般汉字词
  - pattern: “お＋动词ます形去掉‘ます’＋になる”构成动词敬语
    function_cn: 表示对方动作的尊敬（如お座りになる、お持ちになる）
    formation: お＋动词ます形去ます＋になる
    constraints:
    - 动词“越す”不能单独表示“来”，故“お越しになる”不算典型用例
    contrasts: []
  - pattern: 词干为汉字的“サ变动词”用“ご～になる”构成敬语
    function_cn: 表示对方动作的尊敬（如ご出発になる、ご到着になる）
    formation: ご＋汉字词干＋になる
    constraints:
    - “なる”可变为可能形式“なれる”（如ご利用になれます）
    - “サ变动词”指“する／～する”形式，其中“～”部分称词干
    contrasts:
    - 一般动词用“お～になる”，汉字词干サ变动词用“ご～になる”
  - pattern: お+动词ます形去掉‘ます’的形式+です
    function_cn: 尊他语，表示对他人动作的尊敬
    formation: 动词ます形去ます后接です
    constraints:
    - 用于描述对方（尊他对象）的动作状态
    contrasts: []
  - pattern: ～れる（一类动词）／～られる（二类动词）／～される（サ变动词）
    function_cn: 与被动同形的尊他语表达方式
    formation: 动词词干接れる／られる／される
    constraints:
    - 表达敬意程度低于‘お+动词ます形去ます+になる’及‘ご+サ变动词词干+になる’
    contrasts:
    - 与‘お+动词ます形去ます+になる’‘ご+サ变动词词干+になる’相比敬意程度较低
  - pattern: 表达尊敬意义的特殊动词（如召し上がる、いらっしゃる、なさる、ご覧になる等）
    function_cn: 动词在表达尊敬意义时使用特殊形式
    formation: 特定动词对应固定尊敬形式
    constraints:
    - 动词有特殊形式尊他语时，表达尊敬时一般要用特殊形式，尊敬程度较高
    - ‘おいでになる’‘お越しになる’中的动词‘いる’‘越す’只有采用‘お～になる’形式才能表示‘来る（来）’的意思，属表示尊敬意义的特殊动词
    contrasts:
    - 与‘いらっしゃる’‘来られる’可用于同样意思，但特殊形式敬意程度更高
  - pattern: ‘お+动词ます形去掉‘ます’+ください’及‘ご+サ变动词词干+ください’
    function_cn: 请对方做某事时的尊他语表达方式
    formation: お+动词ます形去ます+ください；ご+サ变动词词干+ください
    constraints:
    - 用于请求对方（尊他对象）执行某动作
    contrasts: []
  - pattern: 动词て形＋いただく
    function_cn: 自谦语，动作主体为对方、说话人为受益者，以自谦形式向对方表示敬意
    formation: 动词て形＋いただく
    constraints:
    - 用于对方某些动作使说话人感觉受益时
    contrasts: []
  - pattern: お＋动词ます形去『ます』＋いただく
    function_cn: 敬语表达方式
    formation: お＋动词ます形去掉『ます』＋いただく
    constraints: []
    contrasts: []
  - pattern: ご＋サ变动词词干＋いただく
    function_cn: 敬语表达方式
    formation: ご＋サ变动词词干＋いただく
    constraints: []
    contrasts: []
  - pattern: ご心配になる vs ご心配いただく
    function_cn: 二者均表示对对方担心，区别在于担心对象与说话人是否有关
    formation: —
    constraints:
    - ご心配になる：担心对象与说话人或说话人一方并无瓜葛
    - ご心配いただく：担心对象与说话人或说话人一方有关
    contrasts:
    - ご心配になる
    - ご心配いただく
  - pattern: 指示的表达方式（铺垫＋请求）
    function_cn: 发指示时先用『悪いんだけど』做铺垫，说明原因后再提出请求
    formation: —
    constraints:
    - 用于向武井、小张发指示的语境
    contrasts: []
  - pattern: ～てくれるかな / ～てくれないかな / ～てもらえるかな / ～てもらうかな 等自问自答形式
    function_cn: 以间接、委婉方式向对方传达请求或催促的意图，避免直接命令
    formation: 动词て形 + くれる/もらえる + かな/か/ないかな 等疑问或自问语气
    constraints:
    - 用于希望对方完成某事时，比直接命令式更柔和
    - 通过自问自答或疑问语气降低对对方的压迫感
    contrasts:
    - 与直接命令式（～てくれ、～て）相比语气更委婉
    - 与～てもらえるかな 程度相当，均表示说话人自身愿望的间接指示
  - pattern: 说半句话（省略式委婉表达）
    function_cn: 在请求或拒绝时不直接指明，用未说完的句子暗示意图，避免直通的尴尬
    formation: 陈述现状 + 语气助词/省略（如 ～んですが…、～ので…すみません）
    constraints:
    - 用于委婉提出请求或拒绝，缓和对方不快情绪
    - 比直言语速更显礼貌周全
    contrasts:
    - 与直接说明原因并拒绝相比，含蓄表达更得体
  - pattern: ～とか
    function_cn: 表示举例；也表示传闻（从别人处听到、说话人认为不确切的信息）
    formation: 小句（简体形式）＋とか；名词＋とか＋いう＋名词
    constraints:
    - 传闻用法多接说话人认为不确切的信息
    contrasts: []
  - pattern: ほぼう
    function_cn: 男性年长者使用的语言，用于表示佩服、惊讶
    formation: 独立感叹语，可单独使用或接句末
    constraints:
    - 语用/称呼限制：男性年长者使用
    contrasts: []
  - pattern: ～じゃないですか
    function_cn: 口语中常用的确认/疑问表达；其简体形式为～じゃないか，句尾可省略疑问助词为～じゃない
    formation: 名词、一类形容词、二类形容词及动词的简体形式；名词、二类形容词的现在肯定形式不加だ而直接接续
    constraints:
    - 语调区分：句尾读降调表示以感动心情或责难态度确认～部分；读升调表示疑问
    contrasts:
    - ～じゃないですか／～じゃないか／～じゃない 三种口语形式
  - pattern: ～じゃないですか／～じゃないか／～じゃない
    function_cn: 句尾读降调，表示以感动心情或责难态度确认“～”部分的内容；三种形式语体由郑重到随意，分别用于郑重场合、较亲近者、男性对亲近同辈或晚辈。
    formation: 名词、二类形容词的现在肯定以外的形式后接；前面加“ん”构成“～んじゃないですか”等读升调表疑问。
    constraints:
    - 句尾只能读降调
    - “～じゃないですか”属郑重，“～じゃないか”语气较随便
    contrasts:
    - 与升调疑问形式（加“ん”）区分
  - pattern: ～わりに（は）
    function_cn: 表示以它前面所给出的条件，实际所达到的程度低于或高于人们的推论。
    formation: 动词／一类形容词（简体形式）＋わりに；二类形容词＋な＋わりに；名词＋の＋わりに。
    constraints:
    - 前接动词等用接续名词时的形式
    contrasts: []
  - pattern: ～かねる
    function_cn: 意思是“即便想这么做也不能”，对对方的提问或要求不用“決められません”而用此形式回答，语气委婉郑重；否定形式“かねない”表示“有可能会发展为不好的事情”。
    formation: 动词ます形去掉“ます”＋かねる；也可用サ变动词词干加“できかねる”。
    constraints:
    - 用于委婉拒绝或表示不能决定
    contrasts:
    - 与“決められません”区分（后者较直接）
  pragmatics:
  - 社内上下関係の敬語（部長→部下：頼むよ／部下→部長：承知しました）
  - 電話・対面での依頼の婉曲表現（～てくれるかな、～てもらえないかな）
  - 敬語（です・ます調、謙譲・丁寧表現）
  - 電話・対面での名乗り（心身堂の張と申します）
  - 敬语体现年龄、职务、内外公司等社会关系
  - 对外公司人员使用敬语体现礼貌
  - 敬语选择依据对象与动作归属：陈述应表达敬意对象的动作或状态时用尊他语或自谦语
  - 敬语层级区分：特殊形式尊他语 > お+动词ます形去ます+になる/ご+サ变动词词干+になる > ～れる/～られる/～される 尊他语
  - 敬语中受益者视角（いただく）与自谦语用法
  - 指示前用『悪いんだけど』缓和语气
  - 通过自问自答形式间接传达说话人意图
  - 用省略式（说半句话）避免直接要求或拒绝带来的尴尬
  - ほぼう 限男性年长者使用
  - “～じゃないか”多由男性对亲近同辈或晚辈使用
  - “～かねる”比“決められません”更委婉郑重
