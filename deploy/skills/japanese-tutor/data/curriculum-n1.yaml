  grammar:
  - pattern: 动词て形＋読む／かける等
    function_cn: 表示动作的先后顺序或伴随方式，前一动作完成后进行后一动作
    formation: 动词て形＋后续动词
    constraints: []
    contrasts: []
  - pattern: 名词／动词た形＋ために
    function_cn: 表示目的或原因（为了…／因为…）
    formation: 名词＋ために；动词た形＋ために
    constraints:
    - 多用于书面或较正式说明原因、目的
    contrasts: []
  - pattern: 动词て形＋いく／来る
    function_cn: 表示动作的方向性移动（带着某动作离开／带着某动作过来）
    formation: 动词て形＋いく／来る
    constraints: []
    contrasts:
    - いく表离说话人而去，来る表向说话人而来
  - pattern: 动词ない形＋で＋动词
    function_cn: 表示未做前一动作而直接做后一动作（没…就…）
    formation: 动词ない形（去ない）＋で＋后续动词
    constraints: []
    contrasts:
    - 与肯定て形先后顺序相对，强调前一动作的缺失
  - pattern: 动词た形＋んです
    function_cn: 对原因或情况进行解释说明
    formation: 动词た形＋んです
    constraints: []
    contrasts: []
  - pattern: 小句1（动词て形 / 动词ない形＋で）＋小句2
    function_cn: 表示进行后句动作的主体处于前句所述状态（伴随状态）
    formation: 前句动词用て形或ない形＋で；ないで可替换为ずに（古日语残留，多用于书面语）
    constraints:
    - 前后小句主语必须一致
    contrasts:
    - 区别于表示动作相继发生、并列、原因/理由的て（这些用法前后主语可不一致）
  - pattern: 小句1（简体形）＋ために / 名词＋の＋ために
    function_cn: 表示原因、理由
    formation: 前句用简体形；二类形容词小句用「な＋ために」；前接名词用「名词＋の＋ために」
    constraints:
    - 前句表示非意志性事态或状态
    contrasts:
    - 与から、ので、て相比，ために更多用于表示不情愿事情的原因
    - 多用于书面语或比较郑重的场合
  - pattern: ～から／～ので／～んで／～て（结句用法）
    function_cn: 表示原因、理由，可用于结句；与～ために对比，～ために不能用于结句。
    formation: 接于小句后，可独立结句。
    constraints:
    - ～ために 不具备结句用法，仅用于句中表目的。
    contrasts:
    - ～から／～ので／～て 可结句，～ために 不可结句。
  - pattern: ～ために
    function_cn: 表示目的。
    formation: 前接意志性动词的基本形。
    constraints:
    - 前后两个小句的动作主体须相同。
    contrasts:
    - 与结句用的～から／～ので／～て 区分。
  - pattern: 動て形＋いきます／きます
    function_cn: 表示以说话人为起点的移动方向：～ていきます 表由近及远，～てきます 表由远及近。
    formation: 接在表示移动的动词（如帰る、歩く、走る、泳ぐ、飛ぶ、乗る等）的て形后。
    constraints:
    - 用于移动类动词后表示方向。
    contrasts:
    - いきます 与 きます 方向相反。
  - pattern: 動て形＋いきます／きます（独立动作）
    function_cn: 表示一种独立动作，て前面的动词也表示独立动作，两个动作相继发生。
    formation: 接在部分动词的て形后。
    constraints:
    - て前动词与て后动词均为独立动作。
    contrasts:
    - 与て前表示主体状况的用法区分。
  - pattern: 動て形＋いきます／きます（主体状况）
    function_cn: 表示一种独立动作，て前面的动词表示动作主体的状况。
    formation: 接在部分动词的て形后。
    constraints:
    - て前动词描述主体状态，而非独立动作。
    contrasts:
    - 与て前为独立动作的用法区分。
  - pattern: 動て形＋きます（循环性动作）
    function_cn: 表示循环性动作，描述去了某地后又回到原场所的情况，口语中常用。
    formation: 接在动词て形后。
    constraints:
    - 强调往返、回到原处。
    contrasts:
    - 与单纯移动方向的～てきます 区分。
  - pattern: も
    function_cn: 助词，用于数量词后表示数量超出事先预想或应有程度，带说话人主观感叹语气
    formation: 接在数量词（如「2度」「3リットル」）之后
    constraints:
    - 用于表达数量比预想多时的心理感受，非单纯并列
    contrasts: []
  - pattern: 遠く／近く
    function_cn: 由形容词词尾「い」变「く」构成的副词形，但此处例外，用作名词，分别表示“远处”“近处”
    formation: 形容词「遠い／近い」词尾「い」→「く」
    constraints:
    - 一般不用来修饰动词，而是作名词使用
    - 属于第31课所述「い→く」副词化规则的例外项
    contrasts:
    - 与一般「い→く」副词修饰动词的用法相区别
  - pattern: 絶対／絶対に
    function_cn: 副词，既可修饰肯定内容也可修饰否定内容，表示“绝对、千万”
    formation: 可直接修饰动词，或后接助词「に」构成「絶対に」，意思不变
    constraints:
    - 修饰肯定或否定均可
    contrasts: []
  - pattern: せっかく
    function_cn: 副词，译“特意”“好不容易”，表示对某种行为或事态的价值应充分利用
    formation: 一般修饰动词；也可用于「です」前，构成「せっかくですから」（接受好意）或「せっかくですが…」（婉拒）
    constraints:
    - 用于别人劝说做某事时，接受用「せっかくですから」，拒绝用「せっかくですが…」
    contrasts: []
  pragmatics:
  - 用「すみません」致歉并补充原因
  - 用「じゃあ、これもお願いします」追加委托
  - 「せっかくですから／せっかくですが…」用于回应他人劝诱时的接受与婉拒语用区分
  - 礼貌提议（～ましょうか／～ませんか）
  - 委婉推测（～と思いますが）
