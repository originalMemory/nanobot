  - 接受请求或指示（如请人做事、复印文件等场景的应答）
  grammar:
  - pattern: 小句（简体形式）＋そうです／ということでした／とのことでした；名词／二类形容词＋だそうです／だということでした／だとのことでした
    function_cn: 转述听到的信息（一般叙述句）
    formation: 接简体小句或名词／二类形容词（后者需加だ）
    constraints:
    - ～そうです 只用于一般叙述句，不使用过去时～そうでした
    - 不能把以前从听话人那里听来的事再转述给该听话人
    - 需明确信息来源时用～によれば／～によると／～の話では，不用“某人＋が”的形式，也可不指出来源
    contrasts:
    - ～ということでした／～とのことでした 除一般叙述句外，还可接表示请求或提议的过去形式（如“来てください”“行きましょう”的过去形）
    - 句尾用过去形式“た”可表示以前听说过的事情
    - ～ということでした 语感较弱，仅确认从别人那里听来的事情，很少用于转述一般知识
  - pattern: ～と言っていました（敬语：～とおっしゃっていました）
    function_cn: 直接引述听到的信息
    formation: 之前可以是任何句子；要求以主语形式写明信息来源（～が～と言っていた）
    constraints:
    - 可用于确认以前从对方那里听到的事情
    - ～と言いました 只用于自己说过的话等特殊场合
    - 传递现在的信息时用～と言っています
    contrasts:
    - 与～そうです／～ということでした 不同，～と言っていました 表示直接引述听到的信息
  - pattern: ～って
    function_cn: 表示传闻，用于与朋友、家人等关系亲密的人说话
    formation: 小句（简体形式）+ って
    constraints:
    - 仅限关系亲密对象，非正式场合
    contrasts:
    - 与较正式的传闻表达（～そうです 等）语体不同
  - pattern: ～そうです
    function_cn: 兼表传闻与样态（推测）
    formation: 表传闻时前接小句（简体形式）；表样态时动词接“ます形”去“ます”、一类形容词去词尾“い”后接“そうです”、二类形容词直接+“そうです”
    constraints:
    - 传闻与样态的接续规则不同，需区分
    contrasts:
    - 传闻接简体小句，样态接特定词形，二者不可混用
  - pattern: ～にですか
    function_cn: 在双方都清楚谈话内容的情况下，用「～です」的形式代替动词，省略动词部分构成疑问。
    formation: 动词/动词短语的省略 + に + ですか
    constraints:
    - 需建立在双方已了解上下文的前提下使用
    contrasts: []
  - pattern: ご都合
    function_cn: 「都合」意为情况、状况；谈及对方情况而非自己情况时，加敬语前缀「ご」构成「ご都合」，表示尊敬。
    formation: ご + 都合；常用搭配「ご都合がいい／悪い」
    constraints:
    - 用于询问或回答对方是否方便
    contrasts: []
  - pattern: ～ところ
    function_cn: 此处不表场所，意为「在那种情况下」，用于向对方添麻烦或提出为难请求时，对对方状况表示体谅。
    formation: 动词/名词 + ところ；可后接「を」构成「～ところを」
    constraints:
    - 该表达方式并不适用于所有动词，除作为寒暄语使用的情形外，其他场合基本不用
    contrasts: []
  - pattern: 実は
    function_cn: 用于句首，表示向听话人说明实情，相当于“说实话”“实际上”，常带令人意外或坦白语气
    formation: 置于句首，后接陈述句
    constraints: []
    contrasts: []
  - pattern: 思ったより
    function_cn: 表示超出作为基准事物的量或范围，即“比预想的/想象的……”
    formation: 动词“思う”后接“より”；动词需为“た形”或“～ていた”；名词直接“名词＋より”；可换用“予想”“想像”等词
    constraints:
    - 与“～以上に”相比，“～より”较不正式、比较程度较弱
    contrasts:
    - ～以上に（更正式、程度更强）
  - pattern: 突然ですが
    function_cn: 铺垫表达，用于接下来内容较重要、对方可能感到意外或吃惊时，出于对方着想而使用
    formation: 置于句首，后接请求或告知
    constraints: []
    contrasts:
    - 失礼ですが（同为铺垫表达）
  - pattern: ～てもらえませんか
    function_cn: 表示受益的委婉请求（复习项）
    formation: 动词“て形”＋もらえませんか
    constraints: []
    contrasts:
    - ～てもらいます／～てくれます（表示受益）
  - pattern: ～てもらう
    function_cn: 请求/请别人做某事，受益者（说话人）作主语；请求对方时常用「～てもらえますか」等可能形式疑问句
    formation: 动词て形＋もらう
    constraints:
    - 主语为动作的接受者/受益者
    - 请求对方时常省略「～に」部分
    - 疑问请求采用可能形式（～てもらえますか）
    contrasts:
    - 与「～てくれる」主语视角不同
  - pattern: ～てくれる
    function_cn: 表示别人为自己（受益者）做某事，施动者作主语；请求时用「～てくれますか」
    formation: 动词て形＋くれる
    constraints:
    - 主语为实施动作的人
    - 请求形式不用可能形式（～てくれますか）
    contrasts:
    - 与「～てもらう」主语视角不同
  - pattern: 省略（助词后谓语省略）
    function_cn: 日语中助词后面的谓语可在可类推范围内省略，使表达自然流畅
    formation: 助词＋（省略谓语）
    constraints:
    - 省略依赖助词功能与上下文可类推性
    - 过度省略或不省略都可能不自然
    contrasts:
    - 汉语省略频率低于日语
  - pattern: 事情
    function_cn: 名词，指社会文化背景或某事的原因/缘由（如『家庭的事情』表示家庭方面的缘由）。
    formation: 名词，常与『詳しい』『～で』等搭配。
    constraints: []
    contrasts: []
  - pattern: ～し、～し、～／～し、～から／～し、～ので
    function_cn: 将多个理由并列陈述，表示理由不止一个、还有其他未列出的理由；用于从多个理由中举出一两个加以说明。
    formation: 小句（简体形式）＋し，可连续并列，末尾可接『から』『ので』等。
    constraints:
    - 表示理由不穷尽，隐含还有其他理由。
    contrasts:
    - 需明确指出单一理由时用『～から』『～ので』。
  - pattern: 分かりました／承知しました／了解しました
    function_cn: 『分かりました』表示理解并同意、接受对方的建议、劝告或命令；『承知しました』为更正式、自谦的同意表达；『了解しました（明白了）』多用于电子邮件等书面语。
    formation: 动词『分かる』的过去式；『承知する』『了解する』的过去式。
    constraints:
    - 『承知しました』语感较正式。
    contrasts:
    - 区别于仅表示『理解』的『分かりました』，此处含同意/接受之意。
  - pattern: かつて
    function_cn: 副词，表过去，与“昔/以前”同义，多用于书面语，口语中可音变为“かつて”；常含“如今已不同”的语感。
    formation: 副词，置于句首或动词前。
    constraints:
    - 书面语色彩较强
    - 隐含与现在的对比
    contrasts: []
  - pattern: ～といえば
    function_cn: 把名词作为话题提出，进而叙述由此联想到的事情或对该话题做某种说明。
    formation: 名词 + といえば
    constraints: []
    contrasts: []
  - pattern: 当たり前
    function_cn: 名词，表示某事并不特别、很普通，即“是常有的事/理所当然”。
    formation: 名词，可作谓语或修饰成分。
    constraints:
    - 不能用于句首
    contrasts:
    - 与“当然”“もちろん”意思相近，但“当たり前”不能置于句首
  - pattern: 取り組み
    function_cn: 表示不是日常工作，而是初次尝试新事物或采取跟以前不同的做法等。
    formation: 动词“取り組む”去掉“ます”的名词形式。
    constraints: []
    contrasts: []
  - pattern: ～てきます
    function_cn: 表示某种变化或动作不断发展，或处于某种状态。
    formation: 动词て形 + きます
    constraints: []
    contrasts: []
  - pattern: 动词て形＋きました
    function_cn: 表示从过去一直持续到现在的变化或状态，含变化中、变化开始、以前状态持续等义
    formation: 动词て形＋きました
    constraints:
    - 强调起点在过去、延续至现在
    contrasts:
    - 与～ていきます（从现在开始持续下去）方向相反
  - pattern: ～ていきます／～てゆきます
    function_cn: 表示从现在开始变化将会持续下去
    formation: 动词て形＋いきます／ゆきます
    constraints:
    - 强调从当下向未来延续
    contrasts:
    - 与～てきました（过去至现在）方向相反
  - pattern: ～年代／～代
    function_cn: 表示某个时期（如1980年代指1980至1989年的十年）；用于年龄层时10代指10至19岁、20代指20至29岁
    formation: 数字＋年代／代
    constraints:
    - 用于年龄层时以10岁为一段
    contrasts: []
  - pattern: さらに
    function_cn: 在前述内容基础上并列补充新内容，相当于“而且、加之”
    formation: 连接词，接于句后
    constraints:
    - 具有在前述基础上补充新内容的功能
    contrasts:
    - また仅表单纯并列，无补充新内容功能
  - pattern: フレックスタイム制度
    function_cn: 自由勤務时间制度，flexible 的缩略，上下班时间由公司自行规定
    formation: 名词（制度名）
    constraints: []
    contrasts: []
  - pattern: バランスを取る／保つ
    function_cn: 表示保持均衡、平衡；消极义可用崩れる（平衡崩溃）、失う（失去平衡）等表达
    formation: 名词＋を＋取る／保つ
    constraints: []
    contrasts: []
  - pattern: これまで
    function_cn: 表示较大时间范围的过去，与「今まで」意思相同但「今まで」可表极短过去（如1秒钟前）
    formation: 副词用法，置于句首或动词前
    constraints:
    - 不用于表示极短暂近的过去
    contrasts:
    - 今まで
  - pattern: ほとんど
    function_cn: 表示大部分、几乎等同于全部；可作副词修饰动词，也可作名词用
    formation: 作名词时可接助词「が」「の」「を」「に」；可接「ほとんどが～」作主语
    constraints: []
    contrasts:
    - だいたい（大体、大概）
  - pattern: 出世
    function_cn: 名词，表身份/职位晋升（如科长升总经理、政治家升大臣）；可后接「する」作动词；「出世の妨げ」表阻碍晋升的因素。
    formation: 名词，可接「する」
    constraints:
    - 通常指事业上的身份提升
    contrasts: []
  - pattern: ～(の)ではないか
    function_cn: 表说话人不完全肯定的语气，虽自认为对但不确定判断是否准确；常用于以个人看法方式提出建议；用于书面语。
    formation: 简体形式：动词／一类形容词＋のではないか；一类形容词＋ではないか；名词＋ではないか
    constraints:
    - 用于书面语
    contrasts: []
  - pattern: 見られます
    function_cn: 「見ます」的可能形式，由“实际可以看到”派生，表示该现象多起来了或经常能够观察到；书面语中「思われます」「考えられます」等可能形式用于客观陈述，陈述重点集中于行为本身而非主语。
    formation: 动词ます形去ます＋られる（可能形式）
    constraints:
    - 表示即使实际看不见但通常能在不同场所见到，或已接近那样的状况
    contrasts:
    - 「見えます」指能够实际映入眼帘的状况，与「見られます」的“经常能观察到/现象增多”不同
  - pattern: これ / この
    function_cn: 指示前文内容中的某个要素本身（上下文指示功能），区别于眼前事物指示；以「あ」开头的指示词不具备此功能。
    formation: 用于替换前文已出现的某项内容（如制度、做法等名词性要素）。
    constraints:
    - 仅用于指代前文已陈述的内容，不指眼前实物。
    contrasts:
    - 与「あ」系指示词区分
  - pattern: このように
    function_cn: 作连词连接前后句子，指示前文内容，意为“如前文所述”；常承接长句甚至多个句子后作总结。
    formation: 置于句首，后接对前文的概括性陈述。
    constraints:
    - 在「このように」「そのような」「あのように」「どのように」中，仅「このように」具有连词功能。
    contrasts:
    - そのような / あのように / どのように（无连词功能）
  - pattern: これ（指示后述内容）
    function_cn: 提前指示后文内容，如先以「これ」引出，再在后文给出具体意见、预测或说明。
    formation: 「これは…ですが、…」等结构，后接被指示的具体内容。
    constraints:
    - 与指示前文内容的用法相对，此处「これ」指向尚未出现的后文。
    contrasts:
    - 指示前文内容的「これ」
  - pattern: 時間に追われる
    function_cn: 表达被时间追赶、受到烦扰与损害的感受；日语中此类说法习惯使用被动形式
    formation: 动词「追う」的被动形「追われる」
    constraints:
    - 含受扰、受害语感，故惯用被动而非主动
    contrasts: []
  - pattern: 生活を送る
    function_cn: 书面语，带有时间流逝的语感
    formation: 名词「生活」+「を」+「送る」
    constraints:
    - 口语中更常用「暮らしする」
    contrasts:
    - 「生活を送る」偏书面 vs 「暮らしする」偏口语
  - pattern: 都会から田舎に引っ越す
    function_cn: 表达从都市迁居乡下的居住变动
    formation: 「都会から」+「田舎に」+「引っ越す」
    constraints:
    - 涉及 Uターン现象（调头现象，曾离乡后返回）与 Iターン现象（单行现象，单向迁居地方）的区分
    contrasts:
    - Uターン：往返/返回型 vs Iターン：单向型
  pragmatics:
  - ～そうです 用于转述传闻或自己听到的一般性知识
  - ～と言っていました 之前需以主语形式写明信息来源
  - 接电话转达时可用“我一定传达”类应答表达
  - 「ご」为敬语前缀，用于指代对方相关事物以示尊敬
  - 「～ところ」多用于寒暄语，表达歉意与体谅
  - 実は 用于句首坦白，常含意外或歉意语气
  - 突然ですが 体现对听话人感受的考虑，属礼貌铺垫
  - 请求对方时省略「～に」部分更自然
  - 「～てもらう」请求用可能形式，「～てくれる」请求不用可能形式
  - 『承知しました』用于对上级或正式场合的应答，体现自谦与正式感。
