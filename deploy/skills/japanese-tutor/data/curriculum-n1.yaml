  - 形容词（热情）
  - 惯用表达（それはもう／気になる）
  - 称呼/人际关系（先輩、後輩）
  - 午餐/饮食（お昼、お昼ご飯）
  - 仕事熱心、勉強熱心、面倒を見る 等表达性词语
  - 股票/价格
  - 戏剧/演技
  - 流行/打扮
  - 医疗/痊愈
  - 赞成/议论
  - 节日/庙会
  - 食文化・はし（箸）
  - 餐具与饮食（餐叉、西餐、日式饭菜、汤匙、碗、筷子、茶杯、大盘子、公筷）
  - 材料/材质（材料、竹子、玉、金属、不锈钢、漆）
