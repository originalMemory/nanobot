  grammar:
  - pattern: これは／それは／あれは ～です。
    function_cn: 用「です」对近处、远处或第三人称相关的事物作判断/介绍。
    formation: 指示词（これ/それ/あれ）+ は + 名词 + です。
    constraints:
    - 「は」为提示助词，标记主题。
    - 「です」为礼貌体判断谓语。
    contrasts:
    - 指示词按说话者与对象距离区分：これ（近）、それ（中）、あれ（远）。
  - pattern: それは 何ですか。
    function_cn: 询问所指事物的名称/种类。
    formation: 指示词 + は + 何 + ですか。
    constraints:
    - 「何」为疑问代词，置于「です」前。
    contrasts: []
  - pattern: あれは だれの 傘ですか。
    function_cn: 询问事物的所属者（是谁的）。
    formation: 指示词 + は + だれの + 名词 + ですか。
    constraints:
    - 「だれの」为疑问属格，后接名词。
    contrasts: []
  - pattern: この カメラは スミスさんののです。
    function_cn: 表示所属关系（是某人的）。
    formation: 指示词 + 名词 + は + 人 + の + です。
    constraints:
    - 「の」连接所属者与被所属物。
    - 人名后接敬称「さん」。
    contrasts:
    - 「この/その/あの」为连体形，直接修饰名词；「これ/それ/あれ」为独立指示词。
  - pattern: これ／それ／あれ は 名 です
    function_cn: 用指示代词指称事物并加以说明，相当于汉语“这/那是……”。
    formation: 指示代词（これ・それ・あれ）+ は + 名词 + です
    constraints:
    - 日语分三种指示词，比汉语“这/那”多一档，需按说话人与听话人的相对位置区分。
    - 面对面时：これ指说话人近处，それ指听话人近处，あれ指双方都远处。
    - 同位置同方向时：これ指较近，それ指较远，あれ指更远。
    contrasts:
    - 汉语只有“这/那”两档，日语为三档，易混。
  - pattern: だれですか／何ですか
    function_cn: 询问“是谁”“是什么”，分别对应汉语“谁”“什么”。
    formation: 指示词/名词 + は + だれ／何 + ですか
    constraints:
    - 句尾须加疑问助词 か，一般读升调。
    - 与汉语不同：汉语含“谁/什么”时句尾不用“吗”，日语即便含 だれ／何 仍须用 か。
    contrasts:
    - だれ 较礼貌说法为 どなた；对尊长或地位高者用 どなた 询问。
  - pattern: 名 の 名
    function_cn: 助词「の」连接两个名词，表示所属关系
    formation: 名词 + の + 名词
    constraints: []
    contrasts: []
  - pattern: この／その／あの 名
    function_cn: 指示词修饰名词，表示近中远的位置关系，与「これ／それ／あれ」的位置关系一致
    formation: この／その／あの + 名词
    constraints:
    - 修饰名词时必须用「この／その／あの」，不能直接用「これ／それ／あれ」
    - 句中重复出现的名词一般可省略，仅保留指示词与所属结构
    contrasts:
    - 「この／その／あの」修饰名词，「これ／それ／あれ」单独使用
  - pattern: どれ／どの 名
    function_cn: 在三个以上事物中不能确定是哪一个时使用的疑问词
    formation: 「どれ」单独使用；「どの」修饰名词
    constraints:
    - 用于三个以上事物的疑问
    contrasts:
    - 「どれ」单独使用，「どの」修饰名词
  - pattern: 100 以下の数字
    function_cn: 0 至 100 的数字读法表，含小数与分数读法
    formation: 数字表（0-100、0.1、2/3 等）
    constraints:
    - 部分数字存在两种读法（如 4、7、9 及 14、17、19 等）
    contrasts: []
  - pattern: この／その／あの 人 → この／その／あの 方
    function_cn: 对长辈、上司、初次见面或交往不多的人，以及公开场合，用「方」替代「人」构成礼貌称呼
    formation: 指示词（この／その／あの）+ 方
    constraints:
    - 用于应尊敬对象或正式公开场合
    - 询问公司、国籍等身份时，用「JC企画の方ですか」「日本の方ですか」比直接用「人ですか」更礼貌
    contrasts:
    - 「人ですか」直接询问显得不尊敬，「方ですか」较礼貌
  - pattern: 何歳ですか／おいくつですか
    function_cn: 礼貌询问年龄，不论对方年龄大小均可使用
    formation: 疑问词 + ですか
    constraints:
    - 与汉语不同，日语不区分「几岁／多大／您高寿」
    - 直接询问孩子年龄时一般用「いくつ？」或「何歳？」，不用「おいくつですか」「何歳ですか」
    contrasts:
    - 「おいくつですか」较礼貌，「何歳ですか」通用
  - pattern: どうぞ
    function_cn: 用于给对方物品或劝对方进餐
    formation: 独立寒暄语
    constraints:
    - 常与「ありがとうございます」搭配回应
    contrasts: []
  - pattern: えっ
    function_cn: 对对方话语感到意外、吃惊，或没听懂/没明白时的反问
    formation: 独立叹词
    constraints:
    - 重复使用会显得不礼貌
    contrasts: []
  - pattern: わあ
    function_cn: 感动或吃惊时发出的声音
    formation: 独立叹词
    constraints:
    - 课文中用于看到真丝手绢而心情激动
    contrasts: []
  - pattern: はい / ええ
    function_cn: 肯定应答；“ええ”为“はい”的较随便说法，仅用于肯定对方提问；被叫到名字应答时必须用“はい”，不能用“ええ”。
    formation: 独立应答词
    constraints:
    - 应答他人呼唤时禁用“ええ”
    contrasts:
    - はい（正式/应答） vs ええ（较随便，仅肯定提问）
  - pattern: 外来語（外来词）
    function_cn: 日语中从外语引进的词，用片假名书写，多来自欧美语言；古时从中国引进的词称“漢語（汉字词）”，不计入外来词；别国地名、人名也用片假名书写。
    formation: 片假名书写的外来词
    constraints:
    - 汉字词（漢語）不属于外来词范畴
    contrasts:
    - 外来語（片假名，欧美来源） vs 漢語（汉字，中国来源）
  - pattern: どうも（加强谢意）
    function_cn: 用于加强“ありがとう ございます”的谢意；略示谢意时可省略“ありがとう ございます”而单用“どうも”。
    formation: 寒暄语，可独立使用
    constraints:
    - 单用“どうも”表示略示谢意
    contrasts:
    - どうも（略示/加强） vs ありがとう ございます（完整致谢）
  - pattern: 亲属称谓（谦称/敬称）
    function_cn: 谈及自己的亲属用谦称，谈及别人的亲属用敬称。
    formation: 称谓词对
    constraints:
    - 直接称呼自己亲属时可用多种称谓（如お父さん、パパ等）
    - 称呼弟弟或妹妹时一般直呼其名
    contrasts:
    - 自己的亲属（祖父/祖母/両親/父/母/息子/娘/兄弟/兄/姉/弟/妹/おじ/おば） vs 别人的亲属（おじいさん/おばあさん/ご両親/お父さん/お母さん/息子さん/娘さん・お嬢さん/ご兄弟/お兄さん/お姉さん/弟さん/妹さん/おじさん/おばさん）
  pragmatics:
  - 礼貌体「です／ます」用于日常交际。
  - 否定回答用「～ではありません」并补充正确信息。
  - 指示代词的空间参照规则
  - 疑问句尾助词か的强制使用
  - だれ 与 どなた 的礼貌层级
  - 对尊敬对象及公开场合使用礼貌语言
  - 询问身份时用「方」避免不敬
  - 询问孩子年龄避免使用「おいくつですか」
  - 叹词「えっ」重复使用不礼貌
  - 应答他人呼唤须用“はい”
  - 略示谢意可单用“どうも”
  - 称呼弟妹一般直呼其名
  - 使用「方」「どなた」对他人亲属表示尊敬
  - 赠送物品用「どうぞ」，受赠用「どうもありがとうございます」
