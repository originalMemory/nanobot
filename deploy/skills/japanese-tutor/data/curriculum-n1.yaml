  similar_contrasts:
  - どうですか（一般近况）vs どうしたんですか（关切异常）
  - 鼓励对方 vs 对鼓励者致谢（ありがとう）
  - ～です（少省略）vs ～ます（常省略）
  - 本义（沉/降低）vs 引申义（情绪低沉）
  - 与「は」在话题提示来源（当场听来 vs 前文已提）上的区别
  - 升调（否定疑问）与降调（强调）的语用区别
  - 「心配事」（担心、挂念某事）不能与「する」搭配，须说「心配事がある」
  - 「今のところ」表示目前、眼下，多用于可能有某种变化发生但尚未发生的情况
  - 「～ばかり」表示同样的事情连续不断，未必是坏事；表示某物沾满全身的意思时不能使用「～ばかり」
