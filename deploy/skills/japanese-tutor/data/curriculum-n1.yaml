  grammar:
  - pattern: お＋動詞ます形（去ます）＋する／～いたします
    function_cn: 谦让语，表示以谦逊态度执行某动作（如持、做、送、出）
    formation: お＋动词ます形去ます＋する／いたします
    constraints:
    - 用于降低自身动作以示对对方尊敬
    - 常与第一人称或为对方服务的语境搭配
    contrasts:
    - 与尊敬语（いらっしゃる／なさる）方向相反，前者降己、后者敬人
  - pattern: ～ていただく／～ていただけますか
    function_cn: 表达接受对方恩惠或礼貌请求对方做某事
    formation: 动词て形＋いただく／いただけますか
    constraints:
    - 用于请求或感谢对方为自己做某事
    contrasts:
    - 与「～てもらう」相比更礼貌
  - pattern: いらっしゃる／なさる／参る／伺う
    function_cn: 尊敬语与谦让语动词，分别表示对方的来/在/做与自己的去/拜访
    formation: 固定敬语动词
    constraints:
    - 「参る」表自己来（谦让），「伺う」表自己去/拜访（谦让），「いらっしゃる」表对方来/在（尊敬）
    contrasts:
    - 来/去动作需按主语是己方还是对方选择谦让或尊敬形式
  - pattern: 承知いたしました／少々お待ちください／失礼いたします／お邪魔いたしました
    function_cn: 敬语寒暄与应答，用于确认、请等待、告辞、致歉
    formation: 固定敬语表达
    constraints:
    - 用于正式或礼貌场合的对话应答
    contrasts: []
  - pattern: 自谦语（定义与语用）
    function_cn: 通过压低说话人自身或说话人一方的形式表示敬意；谈及自己家人或自己公司的上级时也使用自谦语。
    formation: 无固定接续，属语用规则。
    constraints: []
    contrasts: []
  - pattern: お＋一类动词／二类动词（ます形去ます）＋します
    function_cn: 自谦语常用构成之一，用于一类、二类动词。
    formation: お＋动词ます形去掉「ます」＋します。
    constraints:
    - 一类／二类动词去掉「ます」后只剩一个音节的动词不能用于此形式。
    contrasts: []
  - pattern: ご＋三类动词的汉字部分＋します
    function_cn: 自谦语常用构成之一，用于三类动词。
    formation: ご＋三类动词汉字部分＋します。
    constraints:
    - 三类动词「来ます」和「します」不能用于此形式。
    contrasts: []
  - pattern: 自谦语的特殊形式（个别动词对应）
    function_cn: 部分动词的自谦语有固定特殊形式，与尊他语类似。
    formation: 基本形→自谦语基本形／自谦语ます形 的对应关系。
    constraints:
    - 看→拝見する／拝見します
    - 吃、喝→いただく／いただきます
    - 去、来→参る／伺う／参ります／伺います
    - 问→伺う／伺います
    - 做→いたす／いたします
    - 说→申す／申します
    - 给→差し上げる／差し上げます
    - 得→いただく／いただきます
    - 知道→存じている／存じています
    - ～てあげる→～て差し上げる／～て差し上げます
    - ～てもらう→～ていただく／～ていただきます
    contrasts: []
  - pattern: 動ていただけますか
    function_cn: 请求对方为自己做某事的礼貌疑问形式，由“～ていただけます”变为疑问；其更礼貌形式为“～ていただけませんか”。
    formation: 动词て形＋いただけますか／いただけませんか
    constraints:
    - 用于请求对方为自己做某事
    - “～ていただけませんか”比“～ていただけますか”更礼貌
    contrasts:
    - 与“～ていただけます”的陈述/可能形式区分
  - pattern: 動(さ)せていただきます
    function_cn: 自谦表达，自谦程度高于“お／ご～します”；用于请求对方允许自己做某事。
    formation: 动词使役形式（～させる／～させる的て形）＋いただきます
    constraints:
    - 使用频率较高
    - 请求允许自己做某事可用“～(さ)せていただけますか”和“～(さ)せていただけませんか”两种形式
    contrasts:
    - 自谦程度高于“お／ご～します”
  - pattern: ございます／名でございます
    function_cn: 更为礼貌的存在/判断表达。
    formation: “あります”的更礼貌说法为“ございます”；“～です”的更礼貌说法为“～でございます”。
    constraints:
    - 用于比“あります／です”更礼貌的场合
    contrasts:
    - 与“あります”“です”的礼貌度对比
  - pattern: 名词/形容词的尊他语前缀
    function_cn: 在名词和形容词前加“お”或“ご”表示尊敬；日语固有词前一般加“お”，汉字词前一般加“ご”；“様”亦含尊敬义。
    formation: お＋固有词（如 食事、手紙、荷物、お客様）；ご＋汉字词（如 利用、家族）；形容词加 お（如 お忙しい、お若い、お元気、お暇）。
    constraints:
    - 仅用于尊他语，区别于动词的自谦/尊他形式
    - 固有词与汉字词的前缀选择不同
    contrasts:
    - 与第47课动词尊他形式区分：此处针对非动词词类
  - pattern: 自谦语对应词
    function_cn: 用自谦表达替代普通说法，降低自身或己方相关名词以示谦逊。
    formation: わたし→私；わたしたち→私ども；会社→社；人→者。
    constraints:
    - 用于指代自己、己方公司或己方人员
    contrasts:
    - 普通说法与自谦语一一对应，不可混用
  - pattern: “明日”“昨日”的郑重读法层级
    function_cn: 同一时间词存在多种读法，郑重程度不同，商业用语中常与敬语呼应。
    formation: 明日：あした（最随便）＜あす（较郑重）＜みょうにち（最郑重）；昨日：きのう＜さくじつ（较郑重）。
    constraints:
    - 读法选择需匹配语体与场合
    contrasts:
    - あした 与 みょうにち 的语体差异
  - pattern: 何のお構いもできませんで
    function_cn: 寒暄语，客人离开或再次见面时表示招待不周、请原谅的谦辞
    formation: 固定寒暄表达，可替换为「何のお構いもできませんで」
    constraints: []
    contrasts: []
  - pattern: 右も左も分かりません
    function_cn: 表示新到一个地方、对周围情况或工作环境一点儿也不了解、不熟悉
    formation: 惯用表达，常与「～ばかりで」「まだ」等连用
    constraints: []
    contrasts: []
  - pattern: おります／～ております
    function_cn: 「います」的更谦和说法；「～ています」的更为谦和说法，用于表示自身或相关方的状态/存在
    formation: 动词「おる」的连用形＋ます；动词て形＋おります
    constraints:
    - 谦让语，多用于描述自己或己方相关者
    contrasts:
    - 与「います」「～ています」相比语体更谦和
  pragmatics:
  - 通过「お～する／～いたします」降低自身以示对对方尊敬
  - 通过「いらっしゃる／なさる」抬高对方
  - 通过「～ていただく」表达接受恩惠或礼貌请求
  - 自谦语用于压低自身或己方以示敬意，亦用于提及己方上级或家人时。
  - 页面顶部延续上一节的自谦语表达（如“伺います”“参りました”“いたします”“拝見いたしました”等），并附参考：‘知れません’的自谦语为‘存じません’。
  - 尊他语用于抬高对方相关事物，自谦语用于压低己方相关事物
  - 时间词读法体现语体郑重程度
  - 寒暄语⑨的语用场景：客人要走时、再次见到曾拜访过的人时
  - 谦让语「おります」用于对上级或外人的礼貌表达
  - 敬语与谦让表达（お世話になります、失礼いたしました、承知いたしました）
  - 商务电话开场与身份说明
