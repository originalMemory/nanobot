  similar_contrasts:
  - 自谦语（申す/いたす/おる/伺う）与尊敬语（お～になる/～される）的区分
  - そうなんですか（说明/确认理由）
  - そうですか（应答/确认新信息）
  - 明日帰る予定です
  - 明日帰ることになっています（意思相同）
  - 表示未来时间名词+助词“は”提示时用“时间名词+には”，含“最迟”义
  - 与「～てもらう」相对，后者为普通表达，前者为自谦/敬语
  - 与「それから」用法大致相同
  - 与「～が、～」相比更正式；与「～つつ」功能相近但接续与语体有别。
  - 与「～ながら」功能相同（同时进行＋转折），但语体更正式。
  - 与单纯表同时进行的用法相比，此处强调前后项的转折关系。
  - 『～がある』→『～の』『～だ』的同类转换（如『人気がある』→『人気の』）
  - 与『～どおりに』意思相同但语体更正式
  - 与『～抜きで』意思相近
  - 与“～になりました”语体差异
  - 与汉语“搭载”语义差异
  - 与“～だけでは（は）なく～も”语体差异
  - ～たびに
  - ～ごとに
  - ～いつも
  - ～時はいつも
  - 名词＋次第で（随……变化/取决于……） vs 动词ます形去ます＋次第で（一……就……）
  - 外来词（ボディ/シーン/モード/スタイリッシュ） vs 原有日语表达（本体/場面/様式/格好がいい）
