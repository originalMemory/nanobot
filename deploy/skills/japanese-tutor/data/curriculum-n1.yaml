  - 第3問の読解質問は本ページにない课文内容に依存し、本文が不在のため内容確認不可。
  - 第5問は録音に依存し、音声なしでは正誤判断不可。
  - 第4問の選択肢ボックス内の語（登場する・公開する・つかむ・なる・信じる・高まる・獲得する）は画像から読み取ったが、個別字形の確定は要確認。
  - 第(5)题为上一题（第5题组）的延续句，其完整题干需参考前一页
  - Challenge 部分要求用「昔とは比べものにならないほど」「10年前とは比べものにならないほど」完成(1)~(3)句，具体答案需结合上下文判断
