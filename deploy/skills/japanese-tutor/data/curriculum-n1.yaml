  similar_contrasts:
  - 与「あげる」视角相反：あげる是『我给他人』，くれる是『他人给我』。
  - 与「くれる」视角相反。
  - 与「くれる」主语视角不同：くれる主语=施事者，もらう主语=受益者。
  - 「あげます」：说话人一方给他人。
  - 「もらいます」：说话人一方从他人处得到。
  - 「くれます」：他人给说话人一方。
  - 与单纯「あげます」（给予物品）区分：此处为“为别人做某事”。
  - 与第8课「もらいます」表示得到物品的用法相区别，此处强调“请别人做某事/承受恩惠”。
  - 委托别人帮自己做某事时，否定形式「～てくれませんか」比「～てくれますか」更客气、礼貌。
  - 「～てあげる」与「～てあげる」对尊长场合的「～ましょうか」征求形式在敬语层级上的区别。
  - 行き先（目的地）、旅行先（旅行目的地）、出張先（出差地）、就職先（就业单位）、送り先（邮件接收人和地点）等派生词在语义指向上的区别。
  - 与第25课「～あたり」表周边意思相同，但「辺」需带指示词，「あたり」可直接接名词
