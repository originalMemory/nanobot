  - 空港・到着
  - 市内観光
  - 遺跡見学
  - 旅行/观光
  - 机场与交通
  - 日期与历法
  - 问候语（多语种）
  - 拟态词/拟声词（表情、心理）
  - 敬语动词
  - 状态/感受拟态词
  - 名词（物品、身体、场所）
  - 动词（终了、相通、目立つ等）
  - 形容词（黄色い、うらやましい等）
  - 专有名词（金沢、東洋医学）
  - 旅行/交通（経由・到着・出発）
  - 情绪表达（緊張・元気 等惯用形）
  - 旅行行程（东京、名古屋、金泽、北京）
  - 公司/新入社员生活
  similar_contrasts:
  - 「よろしければ」「よかったら」「よければ」意思相近但礼貌层级不同
  - 他动词＋てある 与 自动词＋ている 在状态描述上可对应，但语用焦点不同
  - 两者意思相近，区别在于是否强调有意实施与是否表示结果状态
  - に：存在/移动目的地
  - で：无方向性动作发生场所
  - 先ほど（相反义）
  - 泊まれている（另一种尊他语形式，较“お泊まりの”冗长）
  - 请求许可表达按礼貌程度由高到低：よろしいでしょうか／よろしいですか／いいでしょうか／いいですか。
  - 与口语助词「で」功能重叠，但语体更正式
  - 与完整动词句相比更简练
  - 与过去形式的报告体相比更易体会作者当时心情
  - 与“～ている”表示状态意义相当
  - 瞬间 vs 持续心理状态的区别
  - 与「西洋」相对
  - ～だろうか：单纯疑问
  - ～だけ
  - やっぱり
