  jlpt_estimate:
    status: unverified
  communication_functions:
  - 传递信息：说明情况、陈述事由、解释原因
  - 询问理由（なぜ／どうして 等）
  - 引出/回引话题
  - 提示主题、重新提起话题
  - 表达吃惊/惊讶
  - 根据关系亲疏选择简体或敬体
  - 表达吃惊（先说疑问内容）
  - 对命令/邀请的同意与不同意应答
  - 随声应答与点头表示
  - 对新信息的吃惊应答
  - 寻求对方肯定确认
  - 确认对方陈述并表达赞同（句尾‘ね’）
  - 并列陈述理由
  - 朋友间商量午餐内容
  - 用中止形省略后文地说明理由
  grammar:
  - pattern: 〜のです / 〜んです
    function_cn: 说明情况、陈述事由、解释原因；口语中多用「〜んです」。
    formation: 接在动词/形容词/名词谓语后（名词后加「な」或「の」），构成说明性句尾。
    constraints:
    - 在「なぜ」「どうして」等询问理由的疑问句中常用「〜のですか / 〜んですか」，有时也用「〜のですか」形式。
    - 回答时除「〜のです / 〜んです」外，还可用「〜からです」；前者说明情况语气较强，后者明确解释原因。
    - 说明自己的情况时一般不以「〜の」结句，而以「〜のだ」或「〜のです」形式结句。
    - 对原因、方法等修饰成分加否定时，使用「〜のではありません」的形式。
    - 就原因、方法等修饰成分提问时，使用「〜のですか」的形式。
    - 描述心理活动的词（如「〜たい」「ほしい」「うれしい」「悲しい」等）不能以第二或第三人称作主语，但可用「〜のです」说明第二或第三人称的情况。
    contrasts:
    - 「〜のです / 〜んです」与「〜からです」：前者语气较强、偏说明情况，后者明确解释原因。
    - 「〜のではありません」用于否定原因/方法等修饰成分，区别于普通否定。
  - pattern: 〜のですか / 〜のことですが / 〜なのですか
    function_cn: 引出话题的表达方式：将对方知道的事情重新提出作为话题谈论时作铺垫。
    formation: 接在已知信息后，作为开启或回引话题的铺垫句。
    constraints:
    - 用于把对方已知事项重新提出为话题；新提出的话题则不适用此铺垫。
    contrasts: []
  - pattern: ～んだけど
    function_cn: 提示主题/引出话题，带转折或补充语气，用于关系较近的对象
    formation: 动词た形/名词＋んだけど
    constraints:
    - 口语体，用于关系密切者或下级、晚辈
    contrasts:
    - ～んですが（更礼貌的提示主题）
  - pattern: ～んですが（なんですけど）
    function_cn: 提示主题、引出话题，较礼貌
    formation: 名词/动词た形＋んですが
    constraints:
    - 用于关系不够密切或较正式场合
    contrasts:
    - ～んだけど（更随意）
  - pattern: ～は / ～って
    function_cn: 提示主题、重新提起刚提到的话题
    formation: 名词＋は / 名词＋って
    constraints:
    - 用于提示主题时经常使用
    contrasts: []
  - pattern: 简体（～だ／～る）与敬体（～です／～ます）
    function_cn: 语用/称呼规则：简体给人亲近感，敬体给人疏远感
    formation: 动词/形容词的简体与敬体对应
    constraints:
    - 对关系不够密切者用简体会显得过分亲昵或傲慢无礼
    - 对关系密切者用敬体会显得疏远冷淡
    contrasts: []
  - pattern: なんと
    function_cn: 表示吃惊、感动或非常惊讶的心情
    formation: 副词，置于句首或句中
    constraints:
    - 常与感叹语境搭配
    contrasts: []
  - pattern: 先輩
    function_cn: 词汇/称呼：指比自己年长或先入团体的前辈
    formation: 名词，可加对方名字（如「佐藤先輩」）或单独使用
    constraints:
    - 反义词为「後輩」
    - 工作场合有头衔时一般称头衔而非「先輩」
    contrasts:
    - 後輩
  - pattern: 指示上下文内容（あの／あの＋名词）
    function_cn: 用于指示自己与听话人都熟知的人或事物；提及对方不知道的人时不能用「あの」
    formation: あの＋名词；强调主语时用助词「が」
    constraints:
    - 「あの」仅用于双方共知对象
    - 先说疑问内容（如「先輩？」）再补主语，可表达吃惊语气
    contrasts:
    - 与「那」类指示词区分
    - 主语强调用「が」
  - pattern: 应答表达方式（同意／否认／吃惊／保留意见）
    function_cn: 对命令或邀请表示同意或不同意；区分前句内容是否为应答者已知晓
    formation: 同意：はい／ええ／うん；否认：いいえ／いえ；吃惊：ふうん／へえ／本当！；保留意见：さ…／まあ
    constraints:
    - 吃惊类一般语调上升或将「と」音调抬高
    - 随声应答常用「はい」「ええ」，重复两次「はい」显得亲昵，对关系不亲近者不够礼貌
    - 对名词句回答且同意对方内容时用「そう」「そうです」
    - 听到不了解内容时不能用「そう」「そうそう」
    - 对新信息无论是否感兴趣可用「ふうん」「へえ」，感兴趣时句尾语调上升表示吃惊
    contrasts:
    - 同意 vs 否认 vs 吃惊 vs 保留意见 的语用区分
  - pattern: 「ね」与「ねえ」
    function_cn: 估计听话人会给予肯定时使用助词「ね」表达确认语气；希望得到对方肯定回答
    formation: 「ね」语调高而短促；确认语气较弱时「ね」语调不升高、拉长尾音读作「ねえ」
    constraints:
    - 「ね」用于寻求肯定确认
    - 「ねえ」用于语气较弱的确认
    contrasts:
    - 「ね」高短促 vs 「ねえ」拉长尾音
  - pattern: ～し、～しね
    function_cn: 并列两个类似事物或并列陈述理由；也可单独使用，暗示除此之外还有其他理由；句尾加“ね”表示与对方有同样看法、表示赞同。
    formation: 动词/形容词等 + し、…し（ね）
    constraints:
    - 用于并列理由或同类事物
    - 单独使用时含‘还有其他理由’的暗示
    - 句尾常加表示赞同的‘ね’
    contrasts:
    - 与‘～から’区别：‘～から’是明确说明理由时才使用，‘～し’可并列或暗示未尽理由
  - pattern: お昼
    function_cn: 表示午餐，有时省略自‘お昼ご飯’；朋友之间问‘お昼何にする？’是与对方商量午餐吃什么。
    formation: 名词（午餐）
    constraints:
    - 用于朋友间商量午餐内容的语境
    contrasts: []
  - pattern: ～ちゃって
    function_cn: 是‘～てしまって’的缩略形式，简体会话中常用；表示动作完成并带有遗憾/意外等语气，可中止句子省略后文。
    formation: 动词て形 + ちゃって（= てしまって）
    constraints:
    - 口语/简体会话常用
    - 可作中止形，省略后续内容
    - 存在基本形/て形/た形/命令形/意志形等活用对应（如 食べてしまう→食べちゃう、食べてしまって→食べちゃって 等）
    contrasts:
    - 与‘～てしまう’正式形对应，‘～ちゃって’为其缩略口语形
  - pattern: 助詞の省略（は／をの省略）
    function_cn: 口语中省略助词「は」「を」以缓和强烈提示或强调的语感；「から」「より」不可省略；小句内助词一般不省略。
    formation: 体言＋（は／を）＋述語，省略助词后直接连接。
    constraints:
    - 「から」「より」不能省略
    - 小句中的助词一般不省略
    - 省略用于避免「は」「が」带来的强烈提示或强调语感
    contrasts:
    - 省略 vs 保留助词：保留「は」「が」会产生强调/对比语感
  - pattern: ～のこと
    function_cn: 表示有关某人或某物的各种事情；与传达信息的动词（伝える、話す等）连用，在名词后添加「のこと」构成信息内容。
    formation: 体言＋のこと＋（伝える／話す等）
    constraints:
    - 人名或物名本身不含信息内容，需加「のこと」构成信息内容
    - 心理状态词（好き、嫌い、心配する、気になる）前既可用「～のこと」也可用「～が」
    - 「好き」「嫌い」前凡表示人以外的词都不能用「～のこと」，须用「～が」
    contrasts:
    - 「～のこと」 vs 「～が」：非人名词接好き/嫌い时只能用「が」
  - pattern: 仕事熱心／勉強熱心
    function_cn: 表示倾注热情努力工作或努力学习；「熱心」为二类形容词，修饰动词时用「熱心に」形式。
    formation: 仕事／勉強＋熱心（な）；动词前用「熱心に」。
    constraints:
    - 「熱心」为二类（な）形容词
    contrasts: []
  - pattern: 面倒を見る
    function_cn: 表示「照顾、照看」的意思。
    formation: 体言＋の＋面倒を＋見る
    constraints: []
    contrasts: []
  - pattern: まさに
    function_cn: 副词，表强调，相当于“真正是／确实是／正是／简直是”，书面语，用于谈话中可加强说话人语气。
    formation: 接于名词或动词过去式等前作强调。
    constraints: []
    contrasts: []
  - pattern: 気になる
    function_cn: 表示某事时刻留在脑海、不断挂念、在意。
    formation: 名词＋が＋気になる。
    constraints: []
    contrasts: []
  - pattern: ～かもね／～かもよ
    function_cn: 句尾表达方式，表推测、不确定，相当于“也许／说不定”；可与“そうかもね”“そうかもしれないね”互换。
    formation: 动词／形容词等＋かも＋ね／よ 等助词构成。
    constraints:
    - 既可单独使用，也可后续助词构成多种形式。
    contrasts:
    - 与初级第26课“そうかもしれないね”意思相同。
  - pattern: ～による／～によって
    function_cn: 表示“不同情况”；名词+による/によって，可修饰谓语或名词，常后接違う、変わる、いろいろだ等表达差异或变化
    formation: 名词 + による／によって
    constraints:
    - 用于表示因对象、条件不同而产生差异或变化
    - 既可修饰谓语也可修饰名词
    contrasts: []
  - pattern: “和”与“洋”
    function_cn: 用～和表示日式/日本式/日本风，用～洋表示西式/西洋式/西洋风，构成和食/洋食、和室/洋室、和服/洋服、和菓子/洋菓子、和式/洋式、和風/洋風等
    formation: 名词 + 和／洋
    constraints:
    - 用于区分日式与西式风格或物品
    contrasts:
    - 和 vs 洋
  - pattern: “れんげ”与“おわん”“茶わん”
    function_cn: 区分汤匙（れんげ，散りれんげ的简称）、碗（おわん，盛汤汁的圆形深容器）、饭碗/茶杯（茶わん，多为陶瓷）等餐具词汇
    formation: 词汇辨析
    constraints:
    - 按形状、材质与用途区分
    contrasts:
    - れんげ vs おわん vs 茶わん
  - pattern: ～といっても
    function_cn: 表示转折关系，意为虽然大体上能够那样认定，但其实质不一样
    formation: 小句（简体形式）+ といっても／名词 + といっても
    constraints:
    - 用于让步转折，承认前提但指出例外或差异
    contrasts: []
  - pattern: ～ほか、～も
    function_cn: 表示“除……之外”，用于补充说明其他并列事项
    formation: 小句（简体形式）+ほか；名词+の+ほか；后接～も
    constraints:
    - 用于补充说明时可用～のほか、～も的表达方式
    contrasts: []
  - pattern: やや
    function_cn: 副词，表示“略微”“一点儿”
    formation: 修饰形容词或动词
    constraints:
    - 用于书面语，口语中不使用
    contrasts: []
  - pattern: ～をしている
    function_cn: 表示状态（形状、颜色等）
    formation: ～+名词+を+している；名词部分可用“形”“色”等，其前需有修饰语
    constraints:
    - 表示颜色、形状时使用～色をしている的形式
    - ～的部分使用表示颜色或形状的形容词或“名词+の”形式
    contrasts:
    - 与“形が～”“～形だ”等意思相同
  - pattern: ～とされる
    function_cn: 表示“被认为是……”，指某事得到认同、被当作一般常识；用于书面语。
    formation: 小句（简体形式）＋とされる
    constraints:
    - 用于书面语
    - 与“～とされている”意思基本相同，但“～とされる”含“一般而言”的语气
    - 有特定信息来源时一般使用“～とされている”
    - 叙述当前被认同的事实而自己持有不同意见时多用“～とされている”
    contrasts:
    - ～とされている
  - pattern: 実に
    function_cn: 表示“完全”“非常”等程度高的意思，含吃惊心情的表达方式；多直接用在被修饰词之前。
    formation: 副词，置于被修饰词前
    constraints:
    - 略正式、郑重的说法
    - 口语中多用“本当に”
    contrasts:
    - 本当に
    - 実は（形态近似但意思完全不同，注意不要混淆）
  pragmatics:
  - 「〜のです / 〜んです」说明情况语气较强，「〜からです」明确解释原因
  - 心理活动词不能以第二/第三人称作主语，但可用「〜のです」说明他人情况
  - 简体与敬体的语用差异及适用对象
  - 「先輩」的称呼规则与头衔优先原则
  - 重复「はい」显得亲昵，对不亲近者失礼
  - 「そう」「そうそう」用于不了解内容时不礼貌
  - 「ね」与「ねえ」语调差异体现确认强弱
  - 日语避免限定，故‘～し’单独使用暗示未尽理由的用法常见
  - 对晚来情况确认后用‘～ちゃって’中止形说明理由，区别于明确理由的‘～から’
  - 助词省略用于口语中弱化提示/强调语气，属语用层面的省略规则。
