  themes:
  - 12 最終日
  - 语法与表达
  - 邀请
  - 接受邀请
  - 拒绝邀请
  - いよいよ
  - ～ないと
  - “というと？”与“～というのは”
  jlpt_estimate:
    status: unverified
  communication_functions:
  - 邀请——接受
  - 邀请——拒绝
  - 邀请被拒绝时的回应（表示遗憾或约定下次再邀请）
  - 接受邀请后的感谢与确认
  - 惊讶/感叹/难为情的语气表达
  - 方言感谢与拒绝的语用规则
  - 被动感知（听/看）的表达
  - 对话中察觉与附和
  - 表达模糊方向/方位
  - 归因于负面原因或责任
  - 归因于正面原因或好处来源
  - 突然想起某事时的口语提醒
  - 礼貌地转折或让步（～ですけど）
  - 柔和地补充理由（～ので）
  - 拒绝后提出替代方案（その代わり）
  - 用填充语缓和难以启齿或犹豫的表达
  - 用自谦语表达需对方许可/施恩的动作
  - 用自谦语表达对对方有礼貌的动作
  - 请求（スピーチの依頼）
  - 拜访人家（恩師）
  - 餐馆用语（同級生）
  - 祝福、致辞（結婚披露宴）
  grammar:
  - pattern: ～ませんか
    function_cn: 邀请／请求对方一起做某事
    formation: 动词ます形去ます＋ませんか
    constraints:
    - 用于向听话人提议共同行动或请求对方做某事
    contrasts: []
  - pattern: ～てください
    function_cn: 请求对方做某事（语气较强）
    formation: 动词て形＋ください
    constraints:
    - 强烈要求对方时使用
    contrasts: []
  - pattern: ～が／～けれど
    function_cn: 委婉说明情况，只说一半以减轻对方负担
    formation: 句尾接续，后接省略或停顿
    constraints:
    - 用于要求的行为会给对方造成负担时
    contrasts: []
  - pattern: ～が、いかがですか／～けど、どうですか
    function_cn: 通过询问对方意向来发出邀请
    formation: 说明情况＋が／けど＋询问意向
    constraints:
    - 委婉邀请，征询对方意见
    contrasts: []
  - pattern: いいんですか／ありがとうございます／喜んで…
    function_cn: 接受邀请：再次确认对方意思或表达感谢
    formation: 寒暄／确认句式
    constraints:
    - 被邀请事项对自己有益时使用
    contrasts: []
  - pattern: 分かりました／喜んで
    function_cn: 被邀请事项是负担但同意接受时的回应
    formation: 简短应答
    constraints: []
    contrasts: []
  - pattern: ごめんなさい／すみません／また今度
    function_cn: 拒绝邀请：先致歉并说明原因，或委婉表示这次不行
    formation: 道歉＋理由说明／委婉推辞
    constraints:
    - 采用间接拒绝较有礼貌
    - 明确拒绝仅用于对方纠缠不休等情况，一般避免
    contrasts: []
  - pattern: いよいよ
    function_cn: 副词，表示计划好或事先推测的事情即将发生，传达说话人感觉时间正在迫近的心情。
    formation: 副词，修饰动词/形容词。
    constraints: []
    contrasts: []
  - pattern: ～ないと
    function_cn: 条件表达“～と”的否定形式，用“Aないと，Bない”的形式，表示没有条件A则B也不能成立（即“来了才知道”一类含义）。
    formation: 动词ない形＋と；后接否定结果。
    constraints:
    - 后项通常为否定形式（Bない）。
    contrasts:
    - 与肯定条件“～と”相对，为否定条件形式。
  - pattern: “というと？” / “～というのは”
    function_cn: “というと？”用于不理解对方所说时反问“你这么说是什么意思？”（省略后半句）；礼貌说法为“とおっしゃいますと？”。“～というのは”用于对方对自己所说的话表现出惊讶或难以理解的神情时，开头说明内容或做解释。
    formation: “～というと？”为反问；“～というのは”后接说明/解释内容。
    constraints:
    - 此用法的“～というと”不能改换成“～といえば”。
    contrasts:
    - “～といえば”与“～というのは”用法不同，不可互换。
  - pattern: いやあ
    function_cn: 叹词，用于面对与预想相反状况时的惊讶、感叹，亦表害羞或难为情
    formation: 独立感叹语，句首使用
    constraints: []
    contrasts: []
  - pattern: おおきに
    function_cn: 大阪方言，表感谢，为「おおきにありがとうございました」省略后半的旧式说法
    formation: 方言独立语
    constraints:
    - 年长者、商业买卖场景使用较多，年轻人基本不用
    contrasts: []
  - pattern: あかん
    function_cn: 大阪方言，表禁止或拒绝（不行、不可以）
    formation: 方言独立语
    constraints:
    - 礼貌说法为「あきません」
    contrasts:
    - あきません（礼貌形）
  - pattern: 耳にする
    function_cn: 表听到、了解到某种信息，强调被动传入耳中而非有意识去听
    formation: 名词「耳」+ に + する
    constraints:
    - 与「聞く」（有意识听）不同
    contrasts:
    - 聞く
    - 目にする（被动进入视野）
  - pattern: そういうば、そうですね
    function_cn: 表通过对方话语察觉到此前未意识到的事情，作附和/确认
    formation: 固定接续回应
    constraints: []
    contrasts: []
  - pattern: ～の方
    function_cn: 表示方位或方向，指大概的方向或区域，非特定实际场所，作模糊表达使用。
    formation: 名词＋の方
    constraints: []
    contrasts: []
  - pattern: ～せい／～せいで／～せいか
    function_cn: 陈述出现令人不快或不满意事情的原因或理由；原因不明时用～せいか；用于句尾时用～は～のせいです的形式。
    formation: 小句（简体形式）＋せい；二类形容词＋なせい；名词＋のせい
    constraints:
    - 用于负面原因或责任所在
    contrasts:
    - 与～おかげで相对，后者用于正面原因
  - pattern: ～おかげで／～おかげか
    function_cn: 表示出现令人高兴事情的原因或获得好处的来源；原因或好处来源不明时用～おかげか；用于句尾时用～は～のおかげです的形式。
    formation: 小句（简体形式）＋おかげで；二类形容词＋なおかげで；名词＋のおかげで
    constraints:
    - 陈述中性原因或理由时不使用～せいで或～おかげで，而使用～から、～ので或～ために等
    contrasts:
    - 与～せいで相对，本形式用于正面原因或好处来源
  - pattern: あっ、そうだ
    function_cn: 突然想起或想到某事时使用的口语表达方式；因是对自己说的话，即便同辈长交谈也可用；そうそう同样适用。
    formation: 独立感叹/口语表达
    constraints:
    - 口语表达，用于自我提醒或突然想起
    contrasts: []
  - pattern: ～ですけど
    function_cn: 口语中的转折/让步，是「～けど」的礼貌说法，使语气柔和
    formation: 接在句末，替代「～けど」
    constraints:
    - 口语使用
    - 比「～だけけど／～だけど」礼貌程度高
    contrasts:
    - ～だけけど／～だけど（简体，礼貌低，不用于尊长）
    - ～たが（意义相同但仅书面语）
  - pattern: ～ですけども
    function_cn: 与「～ですけど」意思相同，语气稍客气
    formation: 「～ですけど」末尾加「も」
    constraints:
    - 口语
    contrasts:
    - ～ですけど
  - pattern: ～ですけど／～ですが
    function_cn: 礼貌程度低于「～ですけど／～ですけども」，因使用「です」可用于长辈或不熟悉者
    formation: 接在句末
    constraints:
    - 可用于长辈或不熟悉的人
    contrasts:
    - ～だけけど／～だけど（简体形式「だ」，礼貌较低，不用于尊长）
  - pattern: ～ので
    function_cn: 说明自己情况、补充理由时语气比「～から」更柔和
    formation: 接在原因/理由后
    constraints:
    - 用于说明自身情况时更自然
    contrasts:
    - ～から（即「～ですから」，语气较直接）
  - pattern: その代わり
    function_cn: 「それに代えて（代替那个）」，在不能同意/答应某提议时提出替代方案
    formation: 独立表达，后接替代提议
    constraints:
    - 用于交际中提出替代方案
    contrasts: []
  - pattern: あのう
    function_cn: 表示支吾、犹豫的填充语；在交谈开始或中途，向对方传达难以启齿的内容或苦于选择词句时使用，使说话留有间隔时间，听者可据此领会对方在寻找合适词句，从而避免交流中断。
    formation: 独立感叹/填充语，常与「…、実は…」等接续。
    constraints: []
    contrasts: []
  - pattern: 披露宴
    function_cn: 词汇项：指结婚仪式结束后为向亲朋好友公布结婚事实而举办的婚宴；通常于仪式结束后立刻举行，地点多为仪式会场或饭店。
    formation: 名词，源自「披露する」（宣布、公布）。
    constraints: []
    contrasts: []
  - pattern: ～させていただく
    function_cn: 自谦表达方式，表示自己实施的动作需要得到对方的许可或施恩，比直接「～ます」包含更多敬意；因表示从对方得到好处，故不能用于给对方添麻烦的事。
    formation: 动词ます形去ます＋させていただく。
    constraints:
    - 不能用于给对方添麻烦的语境（如不能用于「ご迷惑をかけさせていただく」）。
    contrasts:
    - 与「～いたす」「お/ご～する」相比更为礼貌；「～いたす」是「～する」的自谦语，只能用于三类动词，而「～させていただく」还可用于其他类型动词。
  - pattern: お/ご～する
    function_cn: 自谦表达方式，用于表示对对方有礼貌的动作。
    formation: お/ご＋动词连用形＋する。
    constraints:
    - 只能用于存在动作接受人的动词（如「送る」「連絡する」）；若动作没有接受人则不能使用（如「帰る」「変更する」不能说成「お帰りする」「ご変更する」）。
    contrasts:
    - 与「～させていただく」相比，后者适用范围更广且更礼貌。
  - pattern: 異なる vs 違う
    function_cn: 表示两个以上事物各自不同；语体与含义差异辨析
    formation: 形容词/动词性表达，可接「～ている」「～ります」等
    constraints:
    - 「異なる」语气郑重、正式，多用于书面语，不含“不正确”义
    - 「違う」广泛用于书面与口语，可含“错误、不正确”义
    - 应答中常用「違う」（如否定对方说法）
    contrasts:
    - 異なる（正式、无错误义）
    - 違う（通用、可表错误）
  - pattern: それぞれ
    function_cn: 名词/副词，表“各自”；三种句法功能
    formation: ①后接助词「が」充当主语；②后接助词「の」修饰名词；③作副词直接修饰动词、形容词
    constraints:
    - 作主语时与复数主体搭配，强调各主体分别执行动作
    - 修饰名词时表“各自的”
    - 作副词时修饰谓语，表“各自地”
    contrasts: []
  - pattern: 程度/数量/个别/全体类副词名词（如かなり）
    function_cn: 既可作名词也可作副词，表程度、数量、个别、全体等
    formation: 可后接助词「の」修饰名词，也可直接修饰动词、形容词
    constraints:
    - 作名词时表“相当程度/数量”等抽象量
    - 作副词时直接修饰谓语表程度
    contrasts: []
  - pattern: ～においても
    function_cn: 表示“对于～”“在～方面”“就～而言”
    formation: 名词 + においても；后续助词可用「も」或「は」
    constraints: []
    contrasts: []
  - pattern: たくさん
    function_cn: 表示数量（很多）
    formation: 修饰名词
    constraints:
    - 不能修饰形容词
    - 一般不作为名词使用
    contrasts: []
  - pattern: だいたい
    function_cn: 表示“大致、大概、基本上”
    formation: 副词性用法，修饰动词或形容词
    constraints: []
    contrasts: []
  - pattern: ～（ということになる
    function_cn: 表示逻辑推理的结果，或自然得出某种结论/结果
    formation: 动词基本形＋（という）ことになる；名词＋（という）ことになる
    constraints: []
    contrasts: []
  - pattern: 复合动词（动词＋动词/助动词性要素）
    function_cn: 用一个动词不足以充分表达意思时，用复合动词表达更复杂、丰富的意思
    formation: 如 投げ＋返す、聞く＋間違える、書く＋間違える、言う＋間違える、言う＋返す、聞く＋返す、思い＋返す 等；其中一部分表示具体动作，另一部分（如返す）表示动作方向，属辅助要素
    constraints: []
    contrasts: []
  - pattern: 怒る
    function_cn: 生气、发火；近义词 しかる、注意する
    formation: 他动用法，可接对象（人を怒る）
    constraints: []
    contrasts:
    - 怒る：指明发火对象时，描述将怒气向对象直接表现，伴随大声吼叫或动手打对方等动作
    - しかる：面对做错事的人，指出其错误并予以纠正，不一定含强烈情感表现
    - 被动形式时，怒る 与 しかる 基本上没有区别
  - pattern: しかる
    function_cn: 责备、纠正对方错误；不含感情因素，既指出具体行为中的错误，也指依规则或规范所犯的错误
    formation: 动词，可构成被动形「しかられる」
    constraints:
    - 用于纠正对方错误，区别于带感情色彩的训斥
    contrasts:
    - 与「注意する」意思相近，但しかる侧重纠正错误，注意する侧重提醒、警告
  - pattern: 注意する
    function_cn: 提醒、警告对方注意某事
    formation: 动词，可构成被动形「注意される」
    constraints:
    - 用于提醒对方注意规则或危险
    contrasts:
    - 与「しかる」意思相近，但注意する侧重提醒而非纠正
  - pattern: スピーチの依頼（请求/请求发言）
    function_cn: 请求对方发表演讲/致辞
    formation: 请求类表达
    constraints: []
    contrasts: []
  - pattern: 恩師への訪問（拜访恩师）
    function_cn: 拜访长辈/恩师时的寒暄与用语
    formation: 敬语/拜访用语
    constraints: []
    contrasts: []
  - pattern: 同級生との飲食（与同级生用餐）
    function_cn: 餐馆点餐/用餐场景用语
    formation: 餐馆服务用语
    constraints: []
    contrasts: []
  - pattern: 結婚披露宴での祝辞・挨拶（婚礼祝福与致辞）
    function_cn: 婚礼场合的祝福、致辞表达
    formation: 祝贺/致辞用语
    constraints: []
    contrasts: []
  pragmatics:
  - 邀请时根据语气强弱选择～ませんか或～てください
  - 给对方造成负担时用～が／～けれど委婉表达
  - 拒绝时优先使用间接表达与致歉，避免直接明确拒绝
  - 拒绝邀请时由委婉到明确的程度差异（如仅说明有事 vs 明确拒绝）
  - おおきに 属稍陈旧方言，使用者年龄与场景受限
  - あかん 的礼貌替代为 あきません
  - あっ、そうだ为对自己说的话，同辈长交谈时也可使用
  - 礼貌层级：～だけけど/～だけど < ～ですけど/～ですが < ～ですけども
  - 「～たが」仅限书面语，不可用于口语
  - 「あのう」用于避免交流中断、给听者领会对方斟酌词句的余地
  - 「～させていただく」体现从对方得到好处的敬意，不可用于给对方添麻烦
  - 「異なる」与「違う」在应答场景中的语用选择（否定对方时用「違う」）
  - 对恩师/长辈的拜访用语
  - 婚礼场合的祝福与致辞语用
  vocabulary_domains:
  - 方言・地方话
  - 婚礼・披露宴相关词汇
  - 大阪方言寒暄与应答
  - 大阪方言
  - 叹词/感叹语
  - 大阪地名文化（ミナミ/南、キタ/北）
  - 披露宴（婚宴/结婚相关）
  - 出行与日程（出発、会議、準備、新幹線、渋滞）
  - 饮食与场所（居酒屋、寿司、飲み）
