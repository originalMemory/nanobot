  grammar:
  - pattern: ～にあげる／～にもらう
    function_cn: 给予与接受：间接对象（人）用「に」标记，直接对象用「を」
    formation: 动词「あげる／もらう」前接「に」表示对象
    constraints:
    - 「あげる」主语为给予者，「もらう」主语为接受者，二者视角相反
    contrasts:
    - 与「送る」区别：送る强调寄送动作，あげる强调当面给予
  - pattern: ～で送る
    function_cn: 表示寄送/传递所使用的手段或方式
    formation: 名词（手段）＋「で」＋「送る」
    constraints:
    - 「で」标记手段而非对象
    contrasts:
    - 与「に」标记对象区分
  - pattern: ～に会う
    function_cn: 见面：见面的对象用「に」标记
    formation: 名词（人）＋「に」＋「会う」
    constraints:
    - 「会う」的对象必须用「に」，不能用「を」
    contrasts:
    - 与「あげる／もらう」的「に」功能相同但动词不同
  - pattern: 名[工具]で 動詞
    function_cn: 助词「で」表示动作所使用的手段、工具或原材料（区别于表示交通工具的「で」）。
    formation: 名词（工具/材料）+ で + 动词
    constraints:
    - 用于表示动作凭借的工具、手段或制作所用的原材料。
    contrasts:
    - 与表示交通工具的「で」区分：此处强调手段与材料。
  - pattern: 名1[人]は 名2[人]に 名3[物]を あげます
    function_cn: 「あげます」表示“给”，物品由第一人称→第二人称→第三人称，或第三人称→第三人称方向移动。
    formation: 给予者（は）+ 接受者（に）+ 物品（を）+ あげます
    constraints:
    - 物品用助词「を」标记，接受者用助词「に」标记。
    - 当第三人称中之一是说话人的亲戚时，按说话人立场处理（如弟、母作为给予者）。
    contrasts:
    - 与「もらいます」方向相反：「あげます」为向外给予。
  - pattern: 名1[人]は 名2[人]に 名3[物]を もらいます
    function_cn: 「もらいます」表示“得到”“接受”，物品由第三人称→第二人称→第一人称，或第三人称→第三人称方向移动。
    formation: 接受者（は）+ 赠送者（に/から）+ 物品（を）+ もらいます
    constraints:
    - 物品用助词「を」标记，赠送者用助词「に」标记。
    - 赠送者也可视为物品移动的起点，用助词「から」表示。
    contrasts:
    - 与「あげます」方向相反：「もらいます」为向内接受。
  - pattern: もらう
    function_cn: 从某人那里得到某物（对方给予）
    formation: 给予者用助词「に」或「から」，所得物用「を」，主语为接受者
    constraints:
    - 第三人称叙述中，若给予者或接受者之一是说话人的亲戚，则按说话人立场选择「に／から」
    contrasts:
    - 与「あげる・くれる」的给予方向相反
  - pattern: 名[人]に 会う
    function_cn: 见某人（会面）
    formation: 所见的对象用助词「に」表示
    constraints: []
    contrasts: []
  - pattern: よ
    function_cn: 提醒对方注意其不知道、不了解的事情；可表告知、提醒、轻微警告
    formation: 句末助词，读升调
    constraints:
    - 依使用场景不同，语用功能在告知／提醒／警告间变化
    contrasts: []
  - pattern: もう
    function_cn: 表示动作已完成，相当于汉语“已经”
    formation: 用于完成体（如「～ました」）前
    constraints:
    - 本页为「もう ①」，后续可能还有其他用法
    contrasts: []
  - pattern: ～から もらいます
    function_cn: 表示从某人/某组织那里接受物品
    formation: 人/组织 + に／から + もらいます
    constraints:
    - 给予方为个人时多用「に」，也可用「から」
    - 给予方为会社、学校等组织或团体时用「から」
    contrasts:
    - 「に」与「から」在给予方为个人时均可，组织团体倾向「から」
  - pattern: あげます 的语用替代
    function_cn: 送别人东西时的礼貌表达
    formation: 用「どうぞ」或「どうですか」替代直接说「あげます」
    constraints:
    - 直接说「あげます」易给人单方面强加于人的印象
    contrasts:
    - 「あげます」直陈 vs 「どうぞ／どうですか」更得体
  - pattern: さっき ／ たった今
    function_cn: 表示离现在很近的过去
    formation: さっき／たった今 + 动词过去式
    constraints:
    - 后续动词必须用过去形式
    - 「たった今」指刚刚，「さっき」指稍前一点
    - 二者均为较随便的说法，多用于日常会话
    contrasts:
    - 「たった今（刚刚）」比「さっき（刚才）」时间更近
  - pattern: 電話／ファックス／メール／手紙を もらいます
    function_cn: 表示收到通讯信息
    formation: 通讯手段名词 + を + もらいます
    constraints:
    - 发出信息时：電話を かける／電話する；ファックス／メール／手紙を 送る；手紙を 出す
    - メール 也称 電子メール 或 Ｅメール
    contrasts:
    - 接收用「もらう」，发出用「かける／送る／出す」
  - pattern: ～の件
    function_cn: 表示“～一事”，较郑重的表达
    formation: 名词 + の + 件
    constraints:
    - 多用于正式场合，如公司办公室、传真或邮件
    contrasts:
    - 「～の件」较郑重 vs 普通名词直接表述
  - pattern: 名词＋（を）お願いします
    function_cn: 请求对方做某事（打电话请人接电话、窗口请人办手续等场景）
    formation: 名词后可接助词「を」，也可用指示词等作宾语
    constraints: []
    contrasts: []
  - pattern: 分かりました
    function_cn: 表示理解对方说明，也可用于对对方话语表示承诺或应答
    formation: 动词「分かる」的过去礼貌体
    constraints: []
    contrasts:
    - 与汉语“明白了”相比，日语还可用于承诺/应答
  - pattern: 名词＋も
    function_cn: 助词「も」表示“也/都”，用于多项并列（如传真与邮件都收到）
    formation: 接名词后
    constraints: []
    contrasts:
    - 汉语一般说“……和……都……”，不逐项加“也”
  - pattern: 前(に)
    function_cn: 表示过去时间，相当于“以前”；区别于表示位置的用法
    formation: 接时间名词后，助词「に」有时可省略
    constraints: []
    contrasts:
    - 与第4课表示位置的「前」用法区分
  - pattern: 箱根
    function_cn: 文化词汇：神奈川县地名，著名观光地（箱根山、芦之湖、温泉、富士山、美术馆/博物馆等）
    formation: 专有名词
    constraints: []
    contrasts: []
  pragmatics:
  - 「すみません」用于请求/询问前的礼貌铺垫
  - 「もう」表示动作已完成（已经）
  - 「もらう」在第三人称叙述中涉及说话人亲戚时，需按说话人立场处理助词选择
  - 给予方为组织时用「から」
  - 送东西避免直说「あげます」
  - 「さっき／たった今」为随意说法
  - 「～の件」用于正式书面或办公语境
  - 「お願いします」用于电话转接与窗口办事等礼貌请求场景
  - 使用敬体（～ました／～ですか）进行职场沟通
  - 礼貌请求与致谢（ありがとうございます）
  - 使用敬体（です/ます）进行车站问询
  - 使用 お願いします 表达礼貌请求
  - 使用 すみません 作为搭话/致歉开场
