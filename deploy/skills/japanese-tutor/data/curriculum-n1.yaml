  - 转述他人所说的命令/指示内容（何と言いましたか／～と言いました）
  - 询问标识/符号的读法与含义（何と読みますか／～という意味です）
  - 询问事物名称并回答（名前を知っていますか／～という花です）
  - 命令/指示
  - 提出（较客气的）要求
  - 命令与禁止的语用限制说明
  - 义务表达的省略形式说明
  - 要求/邀请对方唱歌
  - 指出对年长者用命令形失礼并道歉
  - 讨论命令形在日语与中文中的语用差异
  grammar:
  - pattern: 动词命令形（～ろ／～せ）
    function_cn: 对下级或亲近者发出命令、指示
    formation: 动词连用形/词干接命令助动词，如「消せ」「提出しろ」
    constraints:
    - 语用较强硬，多用于上级对下级、长辈对晚辈或紧急场合
    contrasts:
    - 与「～なさい」的礼貌命令区分
  - pattern: 动词禁止形（～な）
    function_cn: 禁止、劝阻对方做某事
    formation: 动词辞书形（ます形词干）＋な，如「止めるな」「吸うな」
    constraints:
    - 用于禁止行为，常见于标识语（如「立入禁止」对应「ここに入るな」）
    contrasts:
    - 与「～ないで」的委婉劝阻区分
  - pattern: 「～なさい」
    function_cn: 长辈对晚辈的劝告、命令
    formation: 动词ます形词干＋なさい
    constraints:
    - 语用较命令形缓和，含关心语气
    contrasts:
    - 与「～ろ」的强硬命令区分
  - pattern: 动词的命令形
    function_cn: 说话人对听话人下命令时使用的表达形式
    formation: 一类动词：基本形最后一个音变为相应“え”段上的音；二类动词：基本形的“る”变为“ろ”；三类动词：“来る”变“来い”、“する”变“しろ”
    constraints:
    - 按动词类别（一类/二类/三类）分别套用不同变位规则
    contrasts:
    - 与“～なさい”相比语气更直接、命令性更强
  - pattern: 动词 なさい
    function_cn: 比动词命令形稍微客气一些，多用于老师对学生或父母对孩子提出要求
    formation: 动词“ます形”去掉“ます”加“なさい”
    constraints:
    - 语用层级高于命令形，适用于长辈对晚辈或上位者对下位者的要求
    contrasts:
    - 与动词命令形相比更客气
  - pattern: 动（基本形）+ な
    function_cn: 禁止，用于禁止听话人做某事
    formation: 动词基本形后接「な」
    constraints: []
    contrasts: []
  - pattern: 动て / 动ないで
    function_cn: 表示祈使，日常生活中常用，不论男性女性都经常使用，一般用于关系亲密的人之间
    formation: 动词て形，或动词ない形+で
    constraints:
    - 与命令形「～なさい」「～な」相比使用范围有限，一般限于上下、尊卑关系非常明确的非正式场合
    - 紧急情况下对上级或尊长也可用命令形（如快逃）
    - 要求对方救助、帮助自己时不能用命令形而用动词て形（如救命）
    contrasts:
    - 命令形「～なさい」「～な」使用范围更受限
  - pattern: 名1 + という + 名2
    function_cn: 提供对方不知道的新信息时，在表示新信息的词语后加「という」，可表示花名、地名、人名等
    formation: 名词1 + という + 名词2
    constraints: []
    contrasts: []
  - pattern: 名1 は 名/小句 + という + 名2 です
    function_cn: 用于给名词1下定义或对名词1做解释，名词2多为「意味（意思）」等词语
    formation: 名词1 は +（名词/小句）+ という + 名词2 です；小句可为命令形、简体形或简体形+な
    constraints: []
    contrasts: []
  - pattern: 命令形 / 禁止形（动词原形命令、动词ない形＋な）
    function_cn: 命令、禁止
    formation: 动词辞书形表命令；动词ない形去ない加な表禁止
    constraints:
    - 语感粗鲁，使用场合受限
    - 可用于紧急场合、男性为主的职场上下级与同辈、关系亲密的男性朋友之间、观看体育比赛、直接引用含委托/要求/祈使意义的话语或解释词语
    - 女性一般不用命令形，紧急时用动词て形，禁止时用ないで
    - 年龄相差悬殊时对年长者一般不使用
    contrasts:
    - 与礼貌请求/禁止表达（如て形、ないで）在语用亲疏与性别使用上区分
  - pattern: 「～ないといけません」「～なければなりません」的省略形式
    function_cn: 表示义务、必须（省略后段）
    formation: 在不影响理解时省略「いけません」「なりません」等后段，如「～ないといけ」「～なければ」
    constraints:
    - 省略需以不影响理解为前提
    contrasts:
    - 完整形与省略形在口语/书面语正式度上的差异
  - pattern: ～方をする（动词＋方＋をします）
    function_cn: 表示以某种方式/方法进行动作，强调动作的方式或做法，而非动作内容本身
    formation: 动词＋方＋を＋します
    constraints:
    - 与「言います」区分：「言います」侧重所说的内容，「言い方をする」侧重说的方法（怎么说的）
    - 用于描述用某种方式进行动作时的表达
    contrasts:
    - 言います（内容） vs 言い方をする（方法）
  pragmatics:
  - 命令、禁止、劝告三类表达在敬语层级与亲疏关系上的差异
  - 命令形用于直接下达命令
  - ～なさい用于老师对学生、父母对孩子等上下位关系中的要求
  - 命令形「～なさい」「～な」与「～て/～ないで」相比使用范围有限，限于上下、尊卑关系明确的非正式场合
  - 紧急情况下对上级或尊长也可用命令形；但要求对方救助、帮助自己时不能用命令形而用动词て形
  - 命令/禁止形与说话人身份、性别、亲疏、场合的关系
  - 对年上者应用「～てください」而非命令形
  - 亲近对象间可省略「ください」直接说命令形（中日类似）
