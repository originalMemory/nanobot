  similar_contrasts:
  - 「どういう＋名词」与「どんな＋名词」有时可互换，但具体内容限定用「どういう」
  - 「〜ということですね」用于向对方确认，「〜ということですか」用于向自己/对方求证
  - 与～ね相比，多用于对方未必清楚或意见可能不一致的情形
  - 与～よ相比，～じゃないですか更偏向迫使对方重新确认
  - 与～じゃないですか相比，～よ更直接表达主张
  - “～ですか”用于反问确认，“～だって？”用于表示意外
  - 参考にする＝作为依据（主动）
  - 参考になる＝具有参考价值（自动）
  - 与要求回答「はい（是）／いいえ（不是）」的疑问句回答不同
  - 与「～だったら～」可互换
  - 「～ですかね／～ますかね」 vs 「～ですか／～ますか」：前者更亲切、语气拉长。
  - 与～ね 同义但语用色彩不同（～わね 偏年长女性）
  - 肯定句三者皆可
  - 否定句『まで』不适用
  - 最低条件义中『さえ』可表想象事物
  - ～など
  - ～たほうがいい
  - 与初级第35课出现的动词た形＋たらいい同型
  - 与～たびに在“每次”义上可互换
  - 口语 vs 书面语
  - 旧时说法 vs 现代说法
  - 非正式说法 vs 正式说法
  - 意思相近但搭配对象不同的近义词（如清洁/美丽、发放/散发）
