  grammar:
  - pattern: 人物小传/简介中用名词（或名词短语）结尾构成简洁句
    function_cn: 在个人简介、人物小传中，用名词结尾（如入学、リリース）可形成简洁、有节奏的表达；但不可过度使用。
    formation: 以名词/名词短语收束句子，省略动词谓语
    constraints:
    - 适用于人物小传、简介类文体
    - 过度使用会显得不自然
    contrasts:
    - 与完整动词结句（如入学した、リリースした）相比更简洁
  - pattern: 外来词（片假名）的使用与限制
    function_cn: 明治以后从欧美语言吸收的外来词可用片假名书写；能给人时髦、专业、先进印象，但过度使用片假名名词会让非专业人士难以理解。
    formation: 片假名书写的外来词 vs. 和语/汉字词对应表达
    constraints:
    - 企业等场合滥用片假名外来词会造成理解障碍
    - 部分词（如旅館/ホテル）含义侧重不同，不能一概而论
    contrasts:
    - 片假名外来词 vs. 汉字词/和语对应词（如コラボレーション/共同作業、ドリンク/飲み物）
  - pattern: 专业领域外来词的来源
    function_cn: 片假名外来词常集中取自某一特定语言：医学词汇多来自德语，音乐词汇多来自意大利语和法语等。
    formation: 按专业范围对应来源语言
    constraints:
    - 医学、物理·科学等示例来源为德语
    contrasts: []
  - pattern: ～た後、～
    function_cn: 表示前项事件之后又发生了后项的动作、事态，与“～た後で、～”用法相同。
    formation: 动词た形＋後、＋后项
    constraints:
    - “後”既可读“あと”也可读“のち”，其中“のち”为更书面语的读法，课文例句一般读“のち”。
    - 在“～た後で～”中，“後”只读“あと”。
    contrasts:
    - 与“～た後で、～”用法相同，但“～た後で～”的“後”固定读“あと”。
  - pattern: ～た後で～／～てから～
    function_cn: 表示两件事连续发生，多数情况可互换；当后接持续状态或时间过程起点（如“今日までずっと…”）时只能用“～てから～”；前后事件时间间隔很短时“～てから～”更常用。
    formation: 动词た形＋後で／动词て形＋から
    constraints:
    - 表示其后持续状态或时间过程起点时不可用“～た後で～”
    - “～てから”后不可加“今まで”（在持续状态例句中）
    - 间隔很短时优先用“～てから～”
    contrasts:
    - ～た後で～
  - pattern: ～にとどまらず
    function_cn: 表示不限定对象，递进（不仅限于…还…），与“～だけでなく”同义。
    formation: 名词／动词等＋にとどまらず
    constraints: []
    contrasts:
    - ～だけでなく
  - pattern: ～ばかりでなく／～だけでなく／～だけじゃなくて
    function_cn: 递进关系，先指程度较轻事项再叙述程度更高事项（不仅…还…）。
    formation: 名1＋ばかりでなく＋名2＋も／小句1（简体）＋ばかりでなく＋小句2；口语用“～だけじゃなくて”
    constraints:
    - “～だけでなく”使用范围更广，除书面语“～だけでなく”外口语用“～だけじゃなくて”
    contrasts:
    - ～ばかりでなく
    - ～だけじゃなくて
  - pattern: ～ばかりか
    function_cn: 表示“不仅……”，较正式书面语，用法与“～ばかりでなく”相同
    formation: 名1＋ばかりか＋名2＋も／小句1（简体）＋ばかりか＋小句2＋も
    constraints:
    - 书面语，较正式
    contrasts:
    - ～ばかりでなく
  - pattern: ～のみならず
    function_cn: 表示“不仅……”，书面语程度较高
    formation: 名1＋のみならず＋名2＋も／小句1（简体）＋のみならず＋小句2
    constraints:
    - 书面语程度较高
    contrasts: []
  - pattern: ～に限らず
    function_cn: 表示“不仅……”
    formation: 名＋に限らず
    constraints: []
    contrasts: []
  - pattern: ～に乗せて
    function_cn: 用……来表达
    formation: ～に乗せて
    constraints:
    - “～”处多用与音乐相关的词，如音色、歌、音楽、メロディ
    contrasts: []
  - pattern: ～に応じて
    function_cn: 采取外界所期待、要求的行动
    formation: ～に応じて
    constraints:
    - 多与“期待”等搭配
    contrasts: []
  - pattern: 似ている
    function_cn: 表示相似、相像；位于句尾时用“似ている”形式。同类表示状态的动词（如“とがる”“そびえる”）多用“～ている”形式，叙述的往往不是动作本身而是某种状态。
    formation: 动词/形容词 + 似ている；～ている（状态）
    constraints:
    - 句尾用“似ている”形式
    - “とがる”“そびえる”等用“～ている”表示状态
    contrasts: []
  - pattern: ～を誘う
    function_cn: 表示被某种事物触发，成为某种心情或状态（如“物悲しさを誘う”“涙を誘う”“眠りを誘う”）。
    formation: 名词（心情/状态）+ を誘う
    constraints: []
    contrasts: []
  - pattern: ～といわれる／～といわれている
    function_cn: 表示“人们都那样说”；“一般认为”用“～と考えられている”。这些表达方式中往往不明确指出动作主体。
    formation: 小句 + といわれる／といわれている／と考えられている
    constraints:
    - 常不明确指出主体
    contrasts:
    - “～といわれる”＝人们都那样说
    - “～と考えられている”＝一般认为
  - pattern: ～こともあって
    function_cn: 表示只举出其中之一加以叙述，暗含还有其他原因；“ことも”的“も”有暗示除此之外还存在的意思。
    formation: 小句（简体形式）+ こともあって
    constraints:
    - 前接小句简体形式
    contrasts: []
  - pattern: 生（なま）
    function_cn: 表示“未经加工的素材”之意，可作前缀/形容词修饰名词，构成生演奏、生放送、生ビール、生魚等复合词，强调现场、直播、未热处理、未加工等含义。
    formation: 生 + 名词/动词名词形
    constraints:
    - 用于强调“未加工/现场/直播”等语义，与加工、录播、热处理等相对。
    contrasts:
    - 生演奏 vs CD 播放；生放送 vs 录播；生魚 vs 加工鱼
  - pattern: そして
    function_cn: 表示时序关系的连词，用于句子之间的连接；也可连接语义跳跃较大的副词或形容词（如ゆったりと、そして情熱的に）；当状态并非同时发生而是时间错开时也可用其并列；使用后会形成停顿，使各并列项独立，产生强调“附加特征”的效果。
    formation: 句/副词/形容词 + そして + 句/副词/形容词
    constraints:
    - 不能连接3个以上的词。
    contrasts:
    - 与单纯并列连词不同，且带有停顿与强调附加特征的作用。
  - pattern: 心を打たれる
    function_cn: 为“心を打つ（打动心灵）”的被动形式，表示“感动”。
    formation: 心を打つ 的被动形
    constraints:
    - 属于使用身体部位词语的惯用表达一类。
    contrasts: []
  - pattern: 身体部位惯用表达（目に浮かぶ／肩を持つ／肝が据わる／首を長くする／手に汗握る／胸を打つ／首を傾げる／足を棒にする／腰を上げる 等）
    function_cn: 以身体部位为核心的惯用表达，分别表示历历在目、袒护、有胆量、翘首盼望、捏把汗、感动、不解、腿累直了、动起来等含义。
    formation: 身体部位名词 + 动词/形容词构成的惯用句
    constraints:
    - 属固定搭配，需整体记忆其引申义。
    contrasts: []
  - pattern: ～にも増して
    function_cn: 表示“比……更加”
    formation: 与表示时间的名词搭配使用（如“これまでにも増して”“以前にも増して”）
    constraints: []
    contrasts: []
  - pattern: ～きる
    function_cn: ①表示某种状态程度很高（完全……、极其……）；②表示将某种行为进行到底（把……做完）
    formation: 动词ます形去掉“ます”＋“きる”；做谓语时用“～きっている”，修饰名词时用“～きった＋名词”
    constraints:
    - ①可搭配的动词很有限
    - ②可与很多动词搭配
    contrasts: []
  - pattern: 堪能する／堪能な
    function_cn: “堪能する”以“～を堪能する”表示“充分享受……”；“堪能な”以“～に堪能だ”表示“在……方面有着出色的技能”，现主要用于表示外语能力出众
    formation: 动词“堪能する”与二类形容词“堪能な”两种用法
    constraints: []
    contrasts:
    - 动词“堪能する”与形容词“堪能な”意思不同，需区分
