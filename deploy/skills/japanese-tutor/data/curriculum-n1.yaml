  similar_contrasts:
  - 「ともに」与「～とも」用法不同：前者表共同/双方，后者表全部
  - 「～ます」侧重动作本身、含立即执行的语气；「～ておく」侧重事先预备、之后生效
  - 与『～から～ない』区分：本式否定理由与结果的关系，后者给出做出否定判断的理由
  - 与『～からといって～とは限らない』区分：本组强调理由与结果关系是否成立，而非单纯部分否定
  - する
  - 実施する
  - 与「～一方、～」在前后主语相同时语义不同（后者表“同时做某事”）
  - 与「～のに対して（て）」在前后主语相同时语义不同
  - 注释性添加 vs 限定修饰
  - 与“～たち”“～がた”意义相同
  - “～がた”含敬意
  - “～たち”比“～ら”更礼貌
  - 正确惯用形式 vs 错误替换/否定/语序变化（如 気に食わない 不可改为 気に食う／気に食べない）
