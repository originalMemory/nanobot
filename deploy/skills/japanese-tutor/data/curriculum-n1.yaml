  similar_contrasts:
  - 本质否定 vs 理所当然否定的形式差异
  - 与「こちらに案内してください」等具体动词请求的区别在于省略动作、依赖上下文
  - 对外提及 vs 当面称呼：前者去头衔、后者加「さん」
  - 与“より”比较：语气强弱差异；起点用法不可加“も”。
  - 与“～て、～”：先后顺序叙述 vs 同时/修饰关系。
  - ～ほうがいいです
  - ～かどうか
  - 年（口语/构成词） vs 歳（与数字表年龄）
  - いくら～ても vs いかに～ても（语体正式度差异）
  - 自动词「こもる」与他动词「こめる」的用法区别
