  grammar:
  - pattern: よくしてくれる
    function_cn: 表示受到对方各种盛情款待或照顾；一般不单独用「よくする」，常与「よくしてくれる」「よくしてもらう」等授受表达共同使用，特别是多与「くれる」「もらう」等自身受益的表达方式共用。
    formation: よくする／よくしてくれる／よくしてもらう 等授受表达
    constraints: []
    contrasts: []
  - pattern: 何かと
    function_cn: 相当于汉语“多方，想方设法”；既用于好事（如帮忙、仰仗），也用于坏事（如想方设法找借口）。
    formation: 修饰动词、一类形容词和二类形容词
    constraints: []
    contrasts: []
  - pattern: 頼りにする
    function_cn: 相当于汉语“以……为依靠”。
    formation: 多用「～を頼りにする」的形式
    constraints: []
    contrasts: []
  - pattern: けど（口语连接词在书面/半公文中的语用）
    function_cn: 课文为半公文性质的分公司通讯，但使用原本多用于口语的「けど」，使行文带有写给亲友的“私信”语气；文体与表达方式需根据传达内容而定。
    formation: 口语连接词「けど」用于书面/半公文
    constraints:
    - 文体选择取决于传达内容与收信人关系（敬体/简体）
    contrasts: []
  - pattern: なじみ
    function_cn: 表示熟识、熟悉；用于多次前往或交流的场所与人，多就餐饮业而言；常见组合形式如“幼なじみ”“顔なじみ”。
    formation: 动词“なじむ”的“ます形”去掉“ます”的名词形式。
    constraints:
    - 多用于场所和人（如“なじみの店”），一般不用于“銀行”“学校”等。
    contrasts: []
  - pattern: せめて
    function_cn: 在自己希望的事情难以实现时，用以提出最底线的条件。
    formation: 多与表示限定条件的“～ぐらい”“～だけでも”等搭配；句尾多用表示要求或愿望的“～たい”“～てほしい”、表示必须的“～べきだ”“～が必要だ”或请求等表达方式。
    constraints:
    - 用于提出底线/最低限度条件。
    contrasts: []
  - pattern: ～たところ
    function_cn: 承上启下的接续表达，表示以某件事情的发生为契机，或某件事情发生的同时又发生了另一件事情。
    formation: 与“～と”“～たら”具有同样意思，但略为正式一些；叙述过去的事情时一般后面多用过去形式。
    constraints:
    - 课文中“支社便り”设定为正在描述某事，所以即便是过去的话题也用了现在形式。
    contrasts:
    - 与“～と”“～たら”意思相同但语体略正式。
  - pattern: ～にしてみたら
    function_cn: 按照该人的想法或站在其角度，后续成分为该人的感受或想法；多用来表示若按该人想法或站在该人角度看问题会有很大不同。
    formation: 名词（人）＋にしてみたら
    constraints:
    - 可替换为「～の立場から言えば」（从某人的角度看）。
    contrasts: []
  - pattern: ～に限ったことではない
    function_cn: 表示“不限于……”，由此引申为“……之外还有”。
    formation: 名词／动词连体形＋に限ったことではない
    constraints:
    - 有时可替换为「～だけではない」。
    - 不说「～に限ることではない」。
    - 与「～だけではない」相比，「～だけではない」语气更随意一些。
    contrasts:
    - 「～だけではない」语气较随意。
  - pattern: ということは
    function_cn: 用于以对方的话或某种信息为基础，经过自己思考引出推断。
    formation: 前句（信息／对方话语）＋ということは
    constraints:
    - 除可用在前句最后以承接后句之外，还可以用在句子的开头。
    contrasts: []
  - pattern: ～つもりで
    function_cn: 表示打算要做某事的意图；或表示说话人自己的想法（多用于本人与周围人想法不一致时）
    formation: 接在动词基本形及“ない形”之后表意图；接在“动词た形”“～ている”及表示状态的动词基本形之后表想法
    constraints:
    - 用于表达主观意图或与他人不同的想法
    contrasts: []
  - pattern: ～ていく／～てくる
    function_cn: 接在表示移动的动词“て形”后，表示空间移动的方向；“～てくる”还用于表示语言行为的动词后，表示言语针对说话人本身或关系较近的人
    formation: 移动动词“て形”＋いく／くる；语言行为动词＋てくる，对象用助词“～に”表示
    constraints:
    - ～てくる 用于言语行为时，对象为说话人或关系较近者
    contrasts:
    - ～ていく 与 ～てくる 的方向/对象差异
  - pattern: ～だの～だの
    function_cn: 举出两个同类例子，多见于表示否定或消极意义的句子
    formation: “名词1＋だの＋名词2＋だの”或“小句1(简体形)＋だの＋小句2(简体形)＋だの”
    constraints:
    - 不能单用，需成对出现
    - 多用于否定或消极语境
    contrasts: []
  - pattern: ～やら～やら
    function_cn: 举出两个或两个以上同类例子，或用于无法确定哪一种情形更合适
    formation: 名词1＋やら＋名词2＋やら；小句1（简体形式）＋やら＋小句2（简体形式）＋やら
    constraints:
    - 不能单独使用
    contrasts: []
  - pattern: ～なり～なり
    function_cn: 举出同类事物的例子，并要求对方在所举的例子中或其他同类事物中选择一个或数个
    formation: 名词1＋なり＋名词2＋なり；小句1（简体形式）＋なり＋小句2（简体形式）＋なり
    constraints:
    - 不能单用
    contrasts: []
  - pattern: ～とか
    function_cn: 用于口语，表示举出多个例子
    formation: 名词1＋とか＋名词2＋とか；小句1（简体形式）＋とか＋小句2（简体形式）＋とか
    constraints:
    - 可单用一个“とか”
    - 另有“～とか～”“～とか～など”的用法
    contrasts: []
  - pattern: 傾向にある / 傾向がある
    function_cn: 表示事态向某一方向倾斜；「傾向にある」含变化、发展的动态感，「傾向がある」偏向陈述状态
    formation: 名词＋傾向にある／傾向がある；亦可用「～という傾向がある」
    constraints:
    - 不说「傾向である」
    contrasts:
    - 「傾向にある」与「傾向がある」的动态/静态区别
  - pattern: ～には当たらない
    function_cn: 表示“与……不相当”
    formation: 一类/二类动词基本形＋には当たらない；名词＋には当たらない
    constraints: []
    contrasts: []
  - pattern: 気持ちのいいものではない
    function_cn: 委婉表达“不舒适/不舒服”，用于对某事物的感情
    formation: （あまり）気持ちのいいものではない
    constraints:
    - 用于感情时一般不直接用「気持ちが悪い」，而用较委婉的「気持ちのいいものではない」
    contrasts:
    - 「気持ちがいい」（身体感觉，如凉风）与用于感情的委婉否定式
