  similar_contrasts:
  - 〜みたい（です）
  - 〜らしいです
  - 〜ようです
  - 与「～ようです」基本相同，但语体更随意
  - ～ようです 与 ～らしいです 在发话对象上的语用限制
  - 一类型形容词＋さ 与 二类型形容词＋さ 的普遍程度差异
  - 与「なかなか」相近，但「なかなか」仅用于不能量化的程度（如いい、おいしい），「けっこう」还可用于可量化程度（如長い、高い）
