  - 理解促销与施工提示（セール、工事中）
  grammar:
  - pattern: 一类形容词基本形（感叹）
    function_cn: 对令人惊叹之事直接以基本形表感叹，可搭配叹词「わあ」「うわあ」
    formation: 形容词基本形 + 感叹
    constraints:
    - 用于惊讶、赞叹场合
    contrasts: []
  - pattern: 二类形容词感叹 + 「まあ」
    function_cn: 以二类形容词表感叹，属女性说法，常与叹词「まあ」并用
    formation: 二类形容词 + まあ
    constraints:
    - 语用偏女性用语
    contrasts: []
  - pattern: 句尾「～じゃないか」「～なぁ」「～ですねぇ」
    function_cn: 句尾感叹表达；「～じゃないか」含再次确认初次意识到的事、可面对听话人；「～なぁ」反复回味已有感觉，可加「本当に」；对敬语对象用「～ですねぇ」
    formation: 小句 + 句尾感叹形
    constraints:
    - 「～なぁ」多用于自言自语或同伴
    - 敬语对象改用「～ですねぇ」
    contrasts:
    - 「～じゃないか」与「～なぁ」语感不同
  - pattern: 「なんて～」加强感叹
    function_cn: 加强感叹程度，常用「なんて + 形容词 + んだろ」句型
    formation: なんて + 形容词 + んだろ
    constraints: []
    contrasts: []
  - pattern: 小句（简体）+ ものだ
    function_cn: 以「小句简体 + ものだ」表感叹
    formation: 小句简体 + ものだ
    constraints: []
    contrasts: []
  - pattern: なんて＋一类形容词＋んだろう／なんて＋二类形容词・名词＋なんだろう
    function_cn: 表示感叹程度之深；自言自语时男性用「～なんだ」、女性用「～なの」
    formation: なんて＋形容词/名词＋んだろう；可前置名词（主语）＋は＋なんて＋形容词＋んだろう
    constraints:
    - 「なんて」是「どういう」的口语说法，本为程度太深不知如何表达的疑问说法
    - 因非向对方询问而是说自己的想法，故末尾多接「～んだろう」
    contrasts: []
  - pattern: そう言われてみると、そうですね
    function_cn: 与「そういえば、そうですね」相同，用于听到某种信息并同意其内容，常用于对方指出自己未意识到的意外事实
    formation: そう言われてみると、＋そうですね
    constraints: []
    contrasts: []
  - pattern: ～ないものでしょうか／～ないでしょうか
    function_cn: 均为希望某事得以实现的否定疑问句；「～ないものでしょうか」尤其迫切地表示某事物非常必要现在却没有，含特定意义且语气强烈
    formation: 动词ない形＋ものでしょうか／ないでしょうか
    constraints:
    - 「～ないでしょうか」也可用于单纯询问是否存在某事物
    - 「～ないものでしょうか」不可用于单纯询问存在
    contrasts:
    - 「～ないものでしょうか」语气更强烈、含特定意义；「～ないでしょうか」用途更广
  - pattern: ～ないものでしょうか
    function_cn: 提出否定疑问、委婉请求或建议
    formation: 与「何か」「どこかに」等搭配；语气不客气时改用「～ないかなぁ」
    constraints:
    - 用于一般否定疑问句时不可写成「～ないものでしょうか」的误用形式（教材以×标注错误接续）
    contrasts: []
  - pattern: 外す
    function_cn: 把人或物从某个集团、圈子、范围中剔除；惯用表达「～を外すわけにはいかない」表示不能除外
    formation: 动词，多种意思，此处取“剔除”义
    constraints: []
    contrasts: []
  - pattern: ぴったり
    function_cn: 副词，表示非常吻合、刚刚好
    formation: 可修饰动词（如ぴったり合う、ぴったり当てはまる）或名词（ぴったりな～）
    constraints: []
    contrasts: []
  - pattern: 一切
    function_cn: 副词，后接否定，表示“一点儿都没有”“完全（没有）”，强调丝毫不剩、全部
    formation: 后接否定词语
    constraints: []
    contrasts:
    - 与「全然」「全く」相比，「一切」更强调程度上的丝毫不剩、全部
  - pattern: 迷惑な／迷惑する／迷惑をかける
    function_cn: 表示因某人行为导致他人或组织利益受损或感到不快；区分‘迷惑な行為’（旁人因该行为不快）、‘迷惑する’（本人不快）与‘迷惑をかける’（给他人添麻烦）
    formation: 形容词‘迷惑な’修饰名词；动词‘迷惑する’；他动用法‘迷惑をかける’
    constraints:
    - ‘迷惑な行為’指周围人因该行为感到不快，如公共场所打电话、耳机音量大、吃东西、化妆、坐卧在路上等
    contrasts:
    - ‘迷惑な’侧重旁人视角的不快，‘迷惑する’侧重本人感到不快
  - pattern: ～がちだ
    function_cn: 表示有某种倾向，一般不用于褒义
    formation: 动词‘ます形’去掉‘ます’＋がち；形容词去词尾＋がち；接名词时用‘～がちだ’
    constraints:
    - 接名词时用‘～がちだ’形式
    - 也可接特定名词表示倾向，如‘遠慮がち’（老爱客气）、‘病気がち’（容易生病）、‘曇りがち’（经常阴天）、‘便秘がち’（容易便秘）
    contrasts: []
  - pattern: ～たりする
    function_cn: 列举数个有代表性事例，暗示还有其他事例；当只举出一个有代表性事例、暗示还有其他时采用此形式
    formation: 动词た形＋りする（与‘～たり～たりする’列举用法相对）
    constraints:
    - 用于只举一个代表性事例而暗示存在其他事例的场合
    contrasts:
    - 与‘～たり～たりする’（列举多个代表性事例）相对
  - pattern: ～のも無理はない
    function_cn: 表示某事具有必然性，多用于说明理由或情况；“無理はない”意为“并非不合理”
    formation: 动词（简体形式）／一类形容词＋のも無理はない；二类形容词＋なのも無理はない；“～としても無理はない”表达同义
    constraints: []
    contrasts: []
  - pattern: したがって
    function_cn: 连词，表示后句为前句理所当然的结果
    formation: 连接前后句
    constraints:
    - 书面语，语气比较正式
    contrasts:
    - 与“それだから（所以、因此）”意思大致相同，但“したがって”为书面语、语气较正式
  - pattern: ～こそ
    function_cn: 在诸多事物中特别强调“こそ”前面的内容，意为就是这个而不是其他
    formation: 名词＋こそ；形式可为“～こそが～”“～こそ、～”
    constraints: []
    contrasts:
    - “こちらこそ”为寒暄语，听到他人感谢或道歉、感到自己更应该感谢或道歉时使用，意为“应该是我谢谢你／应该是我道歉”
  - pattern: そうはいっても
    function_cn: 表示虽承认某种程度但实际并非如此，构成转折关系；「そう」指代前文内容，起连词作用，置于句首。
    formation: 小句（简体形式）+ といっても
    constraints: []
    contrasts: []
  - pattern: ～以上（は）
    function_cn: 认定某种事态为事实，并以此为理由。
    formation: 动词（简体形式）+ 以上（は）
    constraints: []
    contrasts:
    - 与「～からは」意义相同
  - pattern: ～からは
    function_cn: 以现实为起点叙述理由，与「～以上（は）」同义。
    formation: 动词（简体形式）+ からは
    constraints: []
    contrasts:
    - 与「～以上（は）」同义
  - pattern: あの手この手を使って
    function_cn: 惯用表达，意为采用各种各样的方法和手段；「手」表手段、方法。
    formation: 惯用句
    constraints: []
    contrasts: []
  - pattern: ～(た)がる
    function_cn: 动态表现外显的感情，表示想做某动作的愿望；带从外部观察的含义
    formation: 动词「ます形」去掉「ます」+「がる」；一类形容词去掉「い」+「がる」；一类形容词+「がる」
    constraints:
    - 后续「がる」的动词为一类动词
    - 不用于第一人称的主语
    contrasts: []
  - pattern: ～わけだ
    function_cn: 表示合乎逻辑的结果
    formation: 常以「～というわけだ」的形式使用
    constraints:
    - 否定形式「～わけではない」是对依据某种情况推导出来的结果的否定
    - 与「みんな」「全部」同时使用时表示部分否定
    contrasts:
    - 与「～ことになる」表示相同意思，但「～ことになる」是书面语，语气比较正式
  - pattern: 知らず知らずのうちに
    function_cn: 惯用表达，意思是“没意识到”“无意中”
    formation: 也可只用「知らず知らず」的形式
    constraints: []
    contrasts: []
  - pattern: しばしば
    function_cn: 表示频度的副词，频度介于「よく」与「時々」之间；与「たびたび」相比，「たびたび」带有重复相同事情的含义。
    formation: 副词，修饰动词。
    constraints:
    - 同义频度副词还包括「いつも」「よく」「時々」「たまに」「あまり」「全然」等。
    contrasts:
    - よく
    - 時々
    - たびたび
  - pattern: わずか～足らず
    function_cn: 表示数量比较小、不足、不够；「足らず」即「足りない」之意。
    formation: 数量表达 + 足らず；前面可加表示数量小的副词「わずか」「たった」。
    constraints:
    - 用于强调时间、人数、年龄等数量未达到某一标准。
    contrasts: []
  - pattern: 莫大な
    function_cn: 表示程度的二类形容词，意为“非常大/非常多”，主要用于书面语，强调时也可用于口语。
    formation: 二类形容词，后接名词。
    constraints:
    - 多与「費用」「借金」「財産」等表示金钱的词语，或可换算成金钱的「損害」「損失」「被害」等搭配。
    contrasts: []
  - pattern: 日常公共标识与招牌用语（营业状态、禁止事项、优先/专用设施、促销等）
    function_cn: 识别街头招牌、标志中常见的状态提示与规则表达
    formation: 名词/动词连用形+中（準備中、営業中、工事中）；～禁止（喫煙禁止、携帯電話使用禁止）；～専用（女性専用車）；优先席、セール等固定标识词
    constraints: []
    contrasts: []
  pragmatics:
  - 二类形容词感叹与「まあ」属女性用语
  - 「～なぁ」用于自言自语或同伴，敬语对象用「～ですねぇ」
  - 感叹句的性别差异：男性「～なんだ」、女性「～なの」
  - 「～ないものでしょうか」语气强烈，含特定意义
  - 「～ないものでしょうか」语气较客气，不客气场合用「～ないかなぁ」
  - “こちらこそ”用于回应他人的感谢或道歉，表达自己更应致谢或致歉
