  similar_contrasts:
  - 谦让语（お～になる／～ていらっしゃる 用于降低自己一方）
  - 尊敬语
  - 区别于被动用法（参见第41课）
  - 「～（ら）れます」表示较轻微敬意，其余两种表示较深敬意
  - 有特殊尊他形式的动词一般不用「お～になります」形式
  - 「食べる」「飲む」既可用特殊形式「召し上がります」也可用「お～になります」，特殊形式敬意更深
  - 「知っています」的尊他语为「ご存じです」
  - 「ああ，そうですか」的较随便说法
  - 与「ね」语义相近但语气更强
  - 「～ています」的敬语对应
  - 「～てくれて」的礼貌/感谢对应
  - 「～てくださいました」强调感激；「～てくれました」中性陈述
