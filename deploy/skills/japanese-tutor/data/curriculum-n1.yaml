  jlpt_estimate:
    status: unverified
  communication_functions:
  - 询问对方情况
  - 鼓励情绪低落者
  - 对鼓励自己的人致谢
  - 根据对方表情推测情绪低落并询问原因（如「沈んだ顔」相关表达）
  - 表达可惜、价值未被利用的心情
  - 希望对方充分利用机会
  - 转述确认与表达意外
  - 没听清时的反问
  grammar:
  - pattern: どうですか／どうしたんですか
    function_cn: 询问对方近况；当对方似有事或状态异常时用后者表示关切
    formation: どう＋ですか／どうした＋んですか
    constraints:
    - 普通问候用前者，察觉异常时用后者
    contrasts:
    - どうですか（一般近况）vs どうしたんですか（关切异常）
  - pattern: 鼓励类表达（大丈夫／頑張ってください／元気を出してください／わたしのできることがあれば何でも言ってください）
    function_cn: 对情绪低落者表示理解、安慰、提出帮助与鼓励
    formation: 固定寒暄/鼓励句式
    constraints:
    - “頑張ってください”仅表鼓励，不含强烈劝勉义
    contrasts:
    - 鼓励对方 vs 对鼓励者致谢（ありがとう）
  - pattern: 疑问句“か”的省略
    function_cn: 疑问句尾省略助词か，句尾读升调，语气略亲切
    formation: 句尾～です时少省略，～ます时多省略
    constraints:
    - 省略后需靠升调标示疑问
    contrasts:
    - ～です（少省略）vs ～ます（常省略）
  - pattern: 沈んだ顔
    function_cn: “沈む”由“沉入水中/降低”引申为因心情或气氛沉重而无精打采
    formation: 动词沈む的引申义＋顔
    constraints: []
    contrasts:
    - 本义（沉/降低）vs 引申义（情绪低沉）
  - pattern: ～なら
    function_cn: 把从对方那里听来的事直接作为话题时使用；与「は」的区别在于「は」给人前面已提到该件事的印象，「なら」则是把当场听来的事情直接提示出来回应对方的话题；有时用于提出代替方案；后面接否定意义的表达方式时一般不用「なら」而用「は」。
    formation: 名词＋なら
    constraints:
    - 用于将对方话语中的信息直接作为话题
    - 提出代替方案时可用
    - 后接否定意义时一般改用「は」
    contrasts:
    - 与「は」在话题提示来源（当场听来 vs 前文已提）上的区别
  - pattern: ～じゃないか
    function_cn: 用「名词＋じゃないか」时根据语调不同有两种意思：「か」读升调表示否定疑问（认为是日本人，但不十分确定）；句尾读降调表示强调（认为是日本人，强调自己的判断或向对方强调自己的主张）。当谓语是动词或一类形容词时，用「～んじゃないか」表示否定疑问，需要强调时则直接使用「～じゃないか」。
    formation: 名词＋じゃないか；动词/一类形容词＋んじゃないか
    constraints:
    - 语调（升调/降调）决定否定疑问或强调两种功能
    - 谓语为动词或一类形容词时否定疑问用「～んじゃないか」
    contrasts:
    - 升调（否定疑问）与降调（强调）的语用区别
  - pattern: ～んじゃないか / ～んじゃないですか
    function_cn: 否定疑问与强调的语用区分
    formation: 动词/形容词否定形 + じゃないか／じゃないですか
    constraints:
    - 作否定疑问时句尾读升调，表示认为可能但不确定
    - 作强调时句尾读降调，表示进行断定、强调自己的看法
    - 当「～んじゃないですか」作为被引用的成分时，不读升调
    contrasts: []
  - pattern: 考え事をする
    function_cn: 在头脑中思考解决某一问题的方案
    formation: 名词「考え事」+ する
    constraints: []
    contrasts:
    - 「心配事」（担心、挂念某事）不能与「する」搭配，须说「心配事がある」
  - pattern: このところ
    function_cn: 表示最近、近来，在时间推移中把握时间
    formation: 副词性短语，置于句首
    constraints: []
    contrasts:
    - 「今のところ」表示目前、眼下，多用于可能有某种变化发生但尚未发生的情况
  - pattern: ～だらけ
    function_cn: 表示很多、满是、沾满
    formation: 名词 + だらけ
    constraints:
    - 名词部分通常使用不好的事物
    contrasts:
    - 「～ばかり」表示同样的事情连续不断，未必是坏事；表示某物沾满全身的意思时不能使用「～ばかり」
  - pattern: ばかりだ
    function_cn: 表示最近尽是某事（烦恼事或好事等），带主观评价；与「だらけだ」区分：后者多用于具体事物满身/满处。
    formation: 名词/动词等＋ばかりだ
    constraints:
    - 用于抽象评价或状态，不用于具体附着物（具体附着用だらけだ）
    contrasts:
    - だらけだ
  - pattern: やっと
    function_cn: 副词，两种用法：①花费很长时间或克服重重困难后最终实现某事；②勉强、紧巴巴、没有余地。
    formation: 副词，修饰动词/形容词
    constraints:
    - 强调实现的过程或困难，而非单纯结果
    contrasts:
    - とうとう（好不容易）
    - ついに（终于）
  - pattern: 契約が取れる
    function_cn: 「契約」与不同动词组合表达不同含义：取る＝争取到合同；結ぶ＝缔结契约；する＝订立合同。
    formation: 契約＋取る/結ぶ/する
    constraints:
    - 动词搭配决定语义，不可混用
    contrasts:
    - 契約をする
    - 契約を結ぶ
  - pattern: ～と思ったら、～
    function_cn: 表示动作一发生，紧接着就发生了意外/出乎意料的事情。
    formation: 动词た形＋と思ったら
    constraints:
    - 后项多为意外、突然发生的结果
    contrasts: []
  - pattern: クレーム
    function_cn: 源自英语 claim，日语即「苦情」，指遭受损害或不利时表达的不满情绪。
    formation: クレーム＋つける（申诉不满、诉苦）；クレーム＋出る/来る（被人抱怨、出现不满）
    constraints:
    - 主动抱怨用つける，被动/出现用出る・来る
    contrasts: []
  - pattern: せっかく～のに
    function_cn: 表示某种行为或状态具有充分利用的价值却未被好好利用，表达可惜的心情；也可接动词简体形+のだ/だから，表示希望对方充分利用机会。
    formation: せっかく+小句(简体形式)+のに／けれど；せっかく+动词(简体形式)+のだ/だから
    constraints:
    - 小句需用简体形式
    contrasts: []
  - pattern: ニュースを持ってくる
    function_cn: 此处指“有想让您听到的消息”，而非本意“拿过来、带过来”。
    formation: 持ってくる（动词）
    constraints:
    - 语境义与字面义不同
    contrasts: []
  - pattern: キャラクター
    function_cn: 源自英语 character，本意为个性、性格；转指作品中的角色，本课指企业广告或宣传画聘用的模特演员；イメージキャラクター指公司或产品形象代言人。
    formation: 名词
    constraints: []
    contrasts: []
  - pattern: ～ですって
    function_cn: 礼貌表达，用于对内容进行确认，含对所听到内容感到意外而不能立即接受的意思；也可用于没听清对方话语时的反问。
    formation: 小句+だって 的礼貌形式 ～ですって
    constraints:
    - 除单纯询问外还含意外、惊讶语用色彩
    contrasts:
    - 何ですって／何だって 用于确认或没听清
  - pattern: だれもが
    function_cn: 作为名词使用，与助词「が」结合作主语，多用于书面语；疑问词「何」进行同类组合时用「何かもが」，不能说「何かが」。
    formation: 名词/疑问词 + も + が
    constraints:
    - 用于书面语
    - 与「が」搭配作主语
    contrasts:
    - 「何かもが」 vs 「何かが」
  - pattern: つまり
    function_cn: 副词，对前面的话语内容进行总结并追加说明，或用别的说法替代前面的说法。
    formation: 副词，独立使用
    constraints: []
    contrasts: []
  - pattern: ～に向いた
    function_cn: 由动词「向く（朝向）」派生，表示某物或事情比较适合某个对象；对象用助词「に」表示。
    formation: 名词 + に + 向いた
    constraints:
    - 对象需以「に」引出
    contrasts: []
  - pattern: 高く評価されていて（省略主语）
    function_cn: 省略主语的用法，当前后文比较容易判断主语时可省略不写。
    formation: 动词被动/状态 + 省略主语
    constraints:
    - 需依赖上下文可推断主语
    contrasts: []
  - pattern: 見かける
    function_cn: 表示偶然看到某种东西，伴随具体动作；与「見られる」意思相近但用于具体动作而非抽象事件
    formation: 动词「見る」的有意性含义对比项
    constraints:
    - 用于偶然看到，非有意识观看
    - 伴随具体动作，区别于可表抽象事件的「見られる」
    contrasts:
    - 見られる
  - pattern: 一般に
    function_cn: 名词，表示“很多的普通人／整个社会”；与“一般的”意思和用法不同
    formation: 名词用法
    constraints:
    - 本课用于“普通大众”义，非“一般地”副词义
    contrasts:
    - 一般的に
  - pattern: ～というより（も）
    function_cn: 用更确切的说法表达主张或替换自己的表达
    formation: 小句（简体形式）＋というより（も）；可用「は」替换「も」成「～というよりは」
    constraints:
    - 可与「～というより」「～というよりは」互换，意思基本相同
    - 可后续副词「むしろ」或「～というほうが適切だ」
    contrasts:
    - ～というよりは
    - ～というより
  - pattern: ～ばかりで（は）なく～
    function_cn: 表示不仅仅是这一内容（页面底部起始，讲解未完）
    formation: 小句（简体形式）＋ばかりで（は）なく／名词＋ばかりで（は）なく
    constraints:
    - 页面仅给出接续开头，完整说明需参考后续页
    contrasts: []
  - pattern: ～ばかりでなく／だけで（は）なく
    function_cn: 表示“不仅……而且……”的递进关系，常与“は”搭配使用
    formation: 接在名词或动词后，后接另一并列成分
    constraints:
    - 实际使用中“ばかりではなく”“だけで＋はなく”加“は”的形式居多
    contrasts:
    - 与“～ばかり”“だけ”等单纯限定表达区分
  - pattern: ストレスを解消する
    function_cn: 表示“消除精神紧张、压抑”，可用其汉字部分与“ストレス”组合成名词“ストレス解消”
    formation: 动词“解消する”接宾语“ストレス”
    constraints: []
    contrasts: []
  - pattern: ～を趣味にしている
    function_cn: 说明爱好，本课中带有“保持健康”的特定目的，强调积极活动
    formation: 名词＋を＋趣味にしている
    constraints:
    - 与“趣味は～です”“趣味は～することです”不同，此处为动作性描写
    contrasts:
    - 趣味は～です（爱好是……）
    - 趣味は～することです（爱好是做什么事）
  - pattern: ～ほどだ
    function_cn: 表示程度很高，多用于比较极端的事件
    formation: 动词简体形＋ほど；接名词时为“～ほどの～”；位于句尾时为“～ほどだ”
    constraints:
    - 前面可加“さえ”“まで”“でも”等强调极端
    contrasts: []
  - pattern: ～が進む
    function_cn: 表示某种状态或变化不断发展、加剧（如老龄化、少子化、地球温暖化等）
    formation: 名词/名词性短语 + が進む
    constraints: []
    contrasts: []
  - pattern: 数々
    function_cn: 表示数量多，或众多物体中的每一件；可承接前文表示经过多方努力取得成果
    formation: 数々 + の + 名词
    constraints: []
    contrasts: []
  - pattern: 実を結ぶ
    function_cn: 表示经过努力取得好的成果，将结果比作果实
    formation: 名词（努力/研究等）+ が実を結ぶ
    constraints: []
    contrasts: []
  - pattern: ～に関わる
    function_cn: 表示[名词2]与[名词1]联系在一起；也可表示影响到……；比「関係する」更正式
    formation: 名词1 + に関わる + 名词2
    constraints:
    - 书面语，较正式
    contrasts:
    - 関係する（意思基本相同，但较不正式）
  - pattern: ～に関する
    function_cn: 表示“与……有关系”；不表示“影响到……”，且不能用于句尾。
    formation: 名词 + に関する
    constraints:
    - 不可置于句尾
    - 不表影响/波及
    contrasts:
    - ～に関する（关系） vs 影响类表达
  - pattern: 効用
    function_cn: 一般指药品或温泉的“作用、功效”；本课中加引号表示太极拳显示的作用或用途。
    formation: 名词
    constraints:
    - 表示健身效果时一般不用此词，故加引号
    contrasts: []
  - pattern: 役目を果たす
    function_cn: “役目（职责）”指必须做的工作、承担的职责或发挥的作用；与“果たす”连用表示“发挥作用或功能”。
    formation: 名词（役目） + を果たす
    constraints:
    - 一般与动词果たす搭配
    contrasts: []
  - pattern: 本家
    function_cn: 本意为亲族关系中的直系、嫡系；引申为某项工作或事业的创始者/发源地。
    formation: 名词
    constraints:
    - 本课取“发源地/创始者”义
    contrasts:
    - 直系嫡系义 vs 事业创始者义
  - pattern: ～を境に
    function_cn: 以某件事为分水岭，前后状况变化很大；A 项一般为相当于事情的名词，B 项为表示变化内容的小句或谓语成分。
    formation: 名词（A） + を境に + 变化内容（B）
    constraints:
    - A 为名词性成分
    - B 为变化内容小句/谓语
    contrasts: []
  - pattern: 心を一つにする
    function_cn: 表示把相关人们的意志或情感凝聚、团结、协作；用于规模较大、有一定难度的事件，而非日常平常小事。
    formation: 「心を一つにする」固定表达，常与「～を境に」「～によって」等搭配。
    constraints:
    - 对象须为较大、较难的事件，不用于琐碎日常。
    contrasts: []
  - pattern: 夢ではない
    function_cn: 以否定形式表达原本看似难以实现的‘梦’其实有可能实现，用于描述可实现的理想未来。
    formation: 「夢ではない」否定表达，常接「～のではないだろうか」等推测/设想句式。
    constraints:
    - 前提为‘本来以实现不了为前提’，通过否定转为‘可实现’。
    contrasts: []
