  grammar:
  - pattern: ～れば
    function_cn: 表示条件，'如果……就……'
    formation: 动词连用形（ます形去ます）＋れば；い形容词词干＋ければ；な形容词/名词＋であれば
    constraints:
    - 用于假设条件，常与可能形、意志形等搭配
    contrasts:
    - 与～たら、～なら的条件用法区分
  - pattern: ～ても
    function_cn: 表示让步或委婉提议，'……也可以吗'
    formation: 动词て形＋も；名词＋でも
    constraints:
    - 用于提出建议或询问是否可行
    contrasts:
    - 与～てもいい（允许）区分
  - pattern: ～とか～とか
    function_cn: 列举部分事物，'……啦……啦'
    formation: 名词＋とか＋名词＋とか
    constraints:
    - 表示非穷尽列举
    contrasts:
    - 与～や～や、～など区分
  - pattern: ～なら
    function_cn: 以对方所说或已知事项为前提的条件，'如果是……的话'
    formation: 名词/代词＋なら
    constraints:
    - 多接名词性成分
    - 用于以对方意志/愿望为前提的建议场景
    contrasts:
    - 与～ば、～たら区分
    - 此用法～たら、～ば、～と都不具备
  - pattern: ～たら
    function_cn: 表示条件或提议，'如果……的话，……怎么样'
    formation: 动词た形＋ら；名词＋だったら
    constraints:
    - 可用于建议、劝诱
    - 使用条件没有限制，后句可接意志、请求等形式
    contrasts:
    - 与～ば、～なら区分
    - 与～ば相比，～たら可用于后句为过去形式的'发现某种情况'用法
  - pattern: ば形（假定条件）
    function_cn: 表示假定条件，后句以前句事态的发生为成立条件。
    formation: 动词与一类形容词各有其“ば形”：一类动词将基本形末音变为相应“え”段音后加“ば”；二类动词将“る”变为“れば”；三类动词“来る”变“来れば”、“する”变“すれば”；一类形容词将词尾“い”变为“ければ”。
    constraints:
    - 使用“～ば”的句子，原则上后句不能使用表示意志、希望、命令、请求的表达方式。
    - 若前句谓语为状态性谓语，或前后两句主语不同时，则不受上述限制。
    contrasts: []
  - pattern: 小句1（简体形）なら、小句2
    function_cn: 根据对方言谈或交谈时的现场情况陈述自己的意见或想法，或向对方提出请求、忠告；小句2为判断、命令、提议等表示说话者主观立场的内容
    formation: 小句1为二类形容词小句和名词小句时，把其简体形的“だ”换成“なら”
    constraints:
    - 小句2须为判断、命令、提议等主观立场表达
    contrasts: []
  - pattern: 名 でも
    function_cn: 用于举出几个选项中有代表性的一项
    formation: 名词 + でも
    constraints:
    - 一般不用于表示过去时态的句子
    contrasts:
    - 区别于第17课表示全面肯定的“～でも”
    - 区别于第35课表示极端例子的“～でも”
  - pattern: 名1 とか 名2 とか / 小句1 とか 小句2 とか
    function_cn: 用于列举同样性质的几个例子
    formation: 名词+とか+名词+とか，或小句+とか+小句+とか
    constraints:
    - “～とか～”只用于口语
    contrasts:
    - “名词+とか+名词+とか”与“名词+や+名词+など”意思基本相同
    - “～とか～”既可连接名词又可连接小句，而“～や～”只能连接名词
    - “～とか～”只用于口语，而“～や～”既用于口语也用于书面语
  - pattern: ～ば
    function_cn: 表示假定条件（如果～、要是～）
    formation: 动词ば形、形容词/形容动词/名词的假定条件接续
    constraints:
    - 当前句表示动作或变化时，后句不能用～たいです、～てください等表示意志、请求的形式
    - 没有'后接过去形式表示发现某种情况'的用法
    contrasts:
    - 与～たら相比，～ば在后句接意志/请求时受限
  - pattern: ～と
    function_cn: 用于前项一旦成立后项必然成为现实的复句；也可表示发现某种情况（后句用过去形式）
    formation: 动词辞书形、形容词/形容动词/名词的假定条件接续
    constraints:
    - 后句不能使用表示意志或请求的表达方式
    - 表示必然结果时比～たら更自然
    contrasts:
    - 与～たら相比，～と强调必然性且后句不能接意志/请求
  - pattern: ～ちゃった
    function_cn: 表已然或意外结果，是「～てしまった」的口语形式，语义相同但令人不愉快的语气较弱。
    formation: 动词た形 + ちゃった
    constraints:
    - 口语体
    - 语气比「～てしまった」弱
    contrasts:
    - ～てしまった
  - pattern: ～ちょっと
    function_cn: 表示数量或时间“稍多、多一点”。
    formation: 时间词或数量词 + ちょっと
    constraints:
    - 常用于口语
    - 可接时间词或各种数量词后
    contrasts: []
  - pattern: さすが
    function_cn: 表示受到高度评价的人或物名符其实，确实如别人所评价的那样（不愧是…）。
    formation: 副词，置于句首或主语后
    constraints:
    - 用于肯定对方/事物符合高评价
    contrasts: []
  - pattern: ～なら / ～たら
    function_cn: 当前项非对方意志或愿望、而只是某种兴趣或嗜好时，二者可通用。
    formation: 动词/形容词条件形 + なら / たら
    constraints:
    - 用于兴趣、嗜好等条件
    contrasts:
    - ～だど（用于此语境为错误用法）
  pragmatics:
  - 用「～のですが」委婉表达困难
  - 用「～ですが…」委婉拒绝或保留
  - 「～ちゃった」比「～てしまった」语气更弱、更口语
  - 「さすが」用于称赞对方或事物符合其高评价身份
