  communication_functions:
  - 表达感谢与接受他人帮助（如收到礼物、被帮忙搬家、被翻译、被送茶）。
  - 回应感谢的谦让表达（如『どういたしまして』）。
  - 请求/委托他人做某事
  - 表达因他人动作而受益
  - 为对方提供帮助时的礼貌表达（对等 vs 尊长）
  - 累加补充信息
  - 表达移动/归属地点
  - 询问大致地点/搬迁地址
  - 询问某物（家具、入场券等）的购入或取得方式
  - 询问对方是否已决定住处
  - 汇报搬家进展与新房位置
  - 提出为对方介绍附近房源
  - 确认搬家日期与家具、家电安排
  - 询问/说明希望租住的房子条件（交通方便、房租不贵）
  - 介绍房屋特点（新公寓、抗震结构、安全）
  - 询问到车站所需时间及公交班次
  - 询问是否可看其他房子、表达犹豫与请求
  grammar:
  - pattern: くれる / ～てくれる
    function_cn: 表示他人（或动物）为说话人/己方做某事，受益者为第一人称或己方；第三人称受益时多用「～てくれる」描述。
    formation: 动词ます形去ます＋くれる；或动词て形＋くれる。
    constraints:
    - 受益者须为说话人一方，不可用于『我给他人』的视角。
    - 主语为施事者（做动作的人），受益者用「に」提示。
    contrasts:
    - 与「あげる」视角相反：あげる是『我给他人』，くれる是『他人给我』。
  - pattern: あげる / ～てあげる
    function_cn: 表示说话人（或己方）为他人做某事，受益者为他人。
    formation: 动词ます形去ます＋あげる；或动词て形＋あげる。
    constraints:
    - 受益者须为说话人以外的人，不可用于『我给自己』。
    - 主语为施事者，受益者用「に」提示。
    contrasts:
    - 与「くれる」视角相反。
  - pattern: もらう / ～てもらう
    function_cn: 表示说话人得到他人做某事（请求/接受他人服务），主语为受益者（第一人称）。
    formation: 动词ます形去ます＋もらう；或动词て形＋もらう。
    constraints:
    - 主语须为受益者（我/我们），施事者用「に」提示。
    - 与「くれる」相比，もらう强调主语是受益者，くれる强调主语是施事者。
    contrasts:
    - 与「くれる」主语视角不同：くれる主语=施事者，もらう主语=受益者。
  - pattern: 名1[人] は 名2[人] に 名3[物] をくれます
    function_cn: 表示别人给说话人或说话人一方的人某物；与「あげます」「もらいます」均译作“给”，但表达角度不同（给予方向相对于说话人一方）。
    formation: 主语为给予者（第三人称或对方），用「は」；接受者用「に」；所给之物用「を」；动词「くれます」可接疑问形「くれますか」。
    constraints:
    - 接受者须为说话人或说话人一方的人（如「わたし」「妹」）。
    - 日语叙述常以说话人为主语，故多用「わたしは～に～をもらいました」而非「～がわたしに～をくれました」。
    contrasts:
    - 「あげます」：说话人一方给他人。
    - 「もらいます」：说话人一方从他人处得到。
    - 「くれます」：他人给说话人一方。
  - pattern: 動て形 ＋ あげます
    function_cn: 表示说话人或说话人一方的人为别人做某事（动作的恩惠指向对方）。
    formation: 动词て形接「あげます」；受益者用助词「に」表示，但通常省略不出现。
    constraints:
    - 受益者（“别人”）一般不出现在句子里。
    contrasts:
    - 与单纯「あげます」（给予物品）区分：此处为“为别人做某事”。
  - pattern: 动词て形＋もらいます
    function_cn: 表示说话人或说话人一方的人请别人做某事；或表示说话人承受了由于别人的动作而带来的恩惠。
    formation: 动词て形＋もらいます
    constraints:
    - 动作的施事者（“别人”）用助词「に」表示。
    contrasts:
    - 与第8课「もらいます」表示得到物品的用法相区别，此处强调“请别人做某事/承受恩惠”。
  - pattern: 动词て形＋くれます
    function_cn: 表示说话人以外的主语为说话人或说话人一方的人做某事；疑问形式可用于委托关系亲密的人为自己做某事。
    formation: 动词て形＋くれます
    constraints:
    - 主语须为说话人以外的人。
    contrasts:
    - 委托别人帮自己做某事时，否定形式「～てくれませんか」比「～てくれますか」更客气、礼貌。
  - pattern: ～てあげる
    function_cn: 表示说话人或说话人一方的当事人为对方做某事；含赐恩于对方的语用色彩，不宜直接对尊长使用。
    formation: 动词て形＋あげる
    constraints:
    - 对等关系（甲与动作接受者乙地位相当）时可直接使用。
    - 对尊长或上级时，改用征求对方意见的「～ましょうか」形式更为礼貌。
    contrasts:
    - 「～てあげる」与「～てあげる」对尊长场合的「～ましょうか」征求形式在敬语层级上的区别。
  - pattern: それに
    function_cn: 连接前后句，表示内容的累加（而且、此外）。
    formation: 接续于句末，独立连接词
    constraints:
    - 多见于口语。
    contrasts: []
  - pattern: ～先
    function_cn: 表示移动性动作的到达地点或归属（如搬迁后的居住地、出差地、邮寄接收地等）。
    formation: 名词/动词连用形＋先
    constraints:
    - 常与移动、归属类动词搭配，如引っ越し先、出張先、行き先、旅行先、就職先、送り先。
    contrasts:
    - 行き先（目的地）、旅行先（旅行目的地）、出張先（出差地）、就職先（就业单位）、送り先（邮件接收人和地点）等派生词在语义指向上的区别。
  - pattern: どの辺
    function_cn: 询问大致场所；回答可用「～の近くです」或仅答地名
    formation: 「どの」+「辺」
    constraints:
    - 「辺」须与「この/その/あの/どの」等指示词连用（この辺/その辺/あの辺/どの辺）
    - 不能加在表示具体场所的名词后面（如「駅の辺」不成立，应用「駅あたり」）
    contrasts:
    - 与第25课「～あたり」表周边意思相同，但「辺」需带指示词，「あたり」可直接接名词
  - pattern: どうしたんですか
    function_cn: 用于不同场面表示多种意思；本课用于询问某物的购入/取得方式
    formation: 动词过去式/状态 + 「どうしたんですか」
    constraints: []
    contrasts: []
  pragmatics:
  - 授受动词的选择取决于说话人视角（受益者是否为第一人称）与受益者/施事者的人称关系。
  - 日语中一般采用以说话人做主语进行叙述的说法。
  - 「てあげる」方向性：用于前辈对晚辈（页面顶部残留例句所示）。
  - 委托时优先使用否定疑问「～てくれませんか」以体现礼貌。
  - 「～てあげる」含赐恩意味，对尊长直接使用时显得不够礼貌，应改用「～ましょうか」征求形式。
  - 职场上下级与同事间的礼貌表达（です／ます体）
  - 对他人帮助表示感谢（ありがとうございます）
  - 房产商与租客之间的租房咨询场景用语
  - 使用礼貌体（です/ます）进行商务/服务对话
