  communication_functions: []
  grammar:
  - pattern: 宪法及法律条文类课文的文体与结构特点
    function_cn: 说明日本国宪法的整体框架（序言加11章103条，涵盖天皇、放弃战争、国民的权利与义务、国会、内阁、司法、财政、地方自治、修改、最高法规、补充规定等章）以及法律条文（以著作权法补偿金条款为例）区别于一般文章的表述特征
    formation: 条文以章、节、条、项层级组织，使用规定性、义务性表述
    constraints:
    - 课文仅选取宪法第4章至第6章（第41条至第82条）等极少部分介绍
    - 法律条文引用示例取自著作权法第2章第9节补偿金等条款
    contrasts:
    - 法律条文文体与一般文章在结构层级与措辞上的差异
  - pattern: 法律文体特征（书面语对应词）
    function_cn: 法律条文用书面语替代口语表达，如用「準用」「確認」「当該」「係る」「有する」等法律术语；「係る」可表“有关系”或“…所…的B”的古式用法
    formation: 名词/动词词干 + に係るB
    constraints:
    - 「係る」的“…所…的B”用法较古老，现少用
    contrasts: []
  - pattern: 逻辑连接词
    function_cn: 用「又は」「並びに」「若しくは」「ただし」等增强条文逻辑性
    formation: 并列/转折连接
    constraints: []
    contrasts: []
  - pattern: 否定·义务·目的句式
    function_cn: 除「含む」「除く」等基本形外，多用「～でない」「～なければならない」「～てはならない」「～ものとする」「～こととする」等
    formation: 动词/形容词 + ない / なければならない / てはならない / ものとする / こととする
    constraints: []
    contrasts: []
  - pattern: 指人形式
    function_cn: 指人时用「～する者」「～した者」「～すべき者」，不指特定的人
    formation: 动词 + する者 / した者 / すべき者
    constraints: []
    contrasts: []
  - pattern: 长句与修饰连接
    function_cn: 句子较长、修饰语复杂；后续句子不用「～て」中止，而用动词ます形去掉「ます」的形式连接（如「支払い、～」「拒み、～」）
    formation: 动词ます形去ます + 逗号连接
    constraints: []
    contrasts: []
  - pattern: 指示词
    function_cn: 多用「その者」「その旨」等指示词
    formation: 指示代词 + 名词
    constraints: []
    contrasts: []
  - pattern: ～過ぎる／～過ぎ
    function_cn: 表示动作超过正常程度；「行き過ぎ」为名词形式，意为“行为过度”；另有「言い過ぎ」「やり過ぎ」「寝過ぎ」「笑い過ぎ」等；一般用「～過ぎだ」「～過ぎの～」
    formation: 动词ます形去ます + 過ぎる / 過ぎ
    constraints: []
    contrasts: []
  - pattern: ～により～
    function_cn: 书面语表达，与～によって～同义但书面色彩更强；可表被动句的施动者、不同状况、手段、原因，以及“基于……”的含义
    formation: 名词＋により～
    constraints:
    - 书面语
    - 可与～によって～互换，但语体更正式
    contrasts:
    - ～によって～
  - pattern: なぜ～かというと～からだ／なぜかというと～からだ
    function_cn: 陈述与某事项相关的理由，先以なぜ～かというと引出，后接表示理由的～から／～からである，使句子简短结束并强调理由
    formation: なぜ＋～＋かというと＋～＋からだ／からである
    constraints:
    - なぜ属书面语，可替换为どうして
    - なぜ位置可用だれ・いつ・どこ等疑问词替换，形成中途改疑问的强调说法
    contrasts:
    - どうして
  - pattern: ～によらず
    function_cn: 表示“与……无关”
    formation: 名词＋によらず
    constraints: []
    contrasts: []
  - pattern: ～ば / ～さえすれば
    function_cn: 表示最低条件；“～さえすれば”比“～ば”强调条件的语感更强烈
    formation: 他动词“満たす”的ば形；或“満たす”的ます形去“ます”后加“さえ”和“すれば”
    constraints: []
    contrasts:
    - “～ば”与“～さえすれば”语感强弱对比
  - pattern: ～であれば / ～なら
    function_cn: 表示假定条件，意为“以……为条件”
    formation: 表达断定的“～である”后接表示假定条件的“ば”
    constraints: []
    contrasts:
    - “～であれば”比“～なら”书面语色彩稍重
  - pattern: ～に限り
    function_cn: 把范围仅仅限定于……；表示后项状态/适用仅在先项条件下成立
    formation: 名词/名词短语 + に限り，＋主句（B）
    constraints:
    - 限定范围，强调仅在A条件下B成立
    contrasts:
    - ～に限らず（不仅……，还……）
    - ～は～に限られる（……仅限于……）
  pragmatics: []
