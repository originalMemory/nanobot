  grammar:
  - pattern: ～たことがある
    function_cn: 表示曾经有过某种经历（经验）
    formation: 动词た形＋ことがある；否定用～たことがない
    constraints:
    - 主语通常为第一人称或他人，表示说话时点前已完成的经历
    contrasts:
    - 与～たことがある（经历）区别于单纯过去式叙述
  - pattern: ～たあとで
    function_cn: 表示在前一动作完成之后再做后一动作
    formation: 动词た形＋あとで
    constraints:
    - 强调前后动作的先后顺序，前项动作已完成
    contrasts:
    - 与～ながら（同时）不同，此处为先后关系
  - pattern: ～たほうがいい
    function_cn: 建议、劝告，最好做某事
    formation: 动词た形＋ほうがいい；否定建议用～ないほうがいい
    constraints:
    - 用于对他人提出建议或劝告
    contrasts:
    - 语气比～べき softer，偏向建议而非义务
  - pattern: ～ましょうか
    function_cn: 向对方提议或询问是否需要做某事
    formation: 动词ます形（去ます）＋ましょうか
    constraints:
    - 用于主动提议或征求对方同意
    contrasts:
    - 与～ましょう（共同提议）相比，～ましょうか更偏向询问对方意愿
  - pattern: 动词た形
    function_cn: 动词过去/完成形态，由て形将“て”换为“た”、将“で”换为“だ”构成；分一类、二类、三类动词分别变化。
    formation: 一类动词：ます形去ます加た（如 書きます→書いた）；二类动词：ます形去ます加た（如 食べます→食べた）；三类动词：来ます→きた、します→した。
    constraints: []
    contrasts: []
  - pattern: 动(た形) ことが あります
    function_cn: 表示过去的经历，相当于汉语“（曾经）～过”；可用于叙述经历的时间、次数，也可只谈某种经历。
    formation: 动词た形 + ことが あります；否定为 動詞た形 + ことが ありません；强调完全没有时加“一度も”；疑问为 動詞た形 + ことが ありますか。
    constraints:
    - 通常用于至少半年以前发生的事情；叙述“昨天”等离现在很近的以前经历时不使用本句型。
    - 疑问句一般只问有无某种经历；回答可重复问句部分词语，或只说“はい、あります／いいえ、ありません”，不能说“はい、ことが あります／いいえ、ことが ありません”。
    contrasts: []
  - pattern: 动(た形)＋後で、～
    function_cn: 表示一个动作在另一个动作之后发生；也可用“名词＋の＋後で”的形式。
    formation: 动词た形＋後で；名词＋の＋後で
    constraints:
    - “～後で”前面的动词形式必须是“た形”，后面必须接“で”。
    - 与“～前に”对比：～前に后接“に”、前接动词基本形；～後で后接“で”、前接动词た形。
    contrasts:
    - ～前に
  - pattern: 动(た形)＋ほうが いいです
    function_cn: 用于在两种事物中进行选择；当建议对方做理想的动作、行为时，句尾多加“よ”。
    formation: 动词た形＋ほうが いいです；否定形式为“动词ない形＋ほうが いいです”。
    constraints:
    - 否定表达形式为“动词ない形＋ほうが いいです”。
    contrasts: []
  - pattern: 动ましょうか
    function_cn: 提议对方和自己一起做某事，或向对方提议自己为对方做某事；含向对方确认自己提议是否可行的意思，翻译时一般加“好吗？”使语调和缓。
    formation: 动词ます形去ます＋ましょうか
    constraints:
    - 与“～ませんか”“～ましょう”区别：后两者只表示提议双方一起做某事，而“～ましょうか”另有确认提议是否可行之意。
    - 回答：提议为对方做事时用“お願いします”；提议双方一起做时用“はい、そうしましょう”或“いいですね”；反对或拒绝时用“～ないで ください”或“いいえ、ちょっと…”。
    contrasts:
    - ～ませんか
    - ～ましょう
  - pattern: その ほうが いいです
    function_cn: 表示比较、选择，或接受对方建议
    formation: 动词た形／ない形 + ほうが いいです；名词／これ／それ／あれ + の + ほうが いいです；この／その／あの + ほうが いいです
    constraints:
    - 名词及指示代词需加「の」再接「ほうが いいです」
    - 口语中谈到对方事情时用「その ほうが いいです」表示接受对方建议
    contrasts:
    - 与「どちらがいいですか」等选择疑问搭配使用
  - pattern: 何度か
    function_cn: 疑问词「何度」后接「か」表示不确定的次数（几次）
    formation: 疑问词 + か（不确定语义形式，承接第20课语法解释5）
    constraints:
    - 与「いつか」「どこか」「何か」同属疑问词+か的不确定表达
    contrasts: []
  - pattern: 疑问词 + か（何度か／何人か／何冊か）
    function_cn: 表示不定的数量或次数
    formation: 疑问词后必须加「か」
    constraints:
    - 用于表示不定数量时，疑问词后须加「か」
    contrasts: []
  - pattern: ～過ぎ
    function_cn: 表示超过某一时间点或年龄（刚过、出头）
    formation: 时间：数词＋時/分＋過ぎ；年龄：数词＋過ぎ
    constraints:
    - 用于年龄时中间不加「歳」
    contrasts: []
  pragmatics:
  - “～ましょうか”比“～ましょう”多一层征求对方同意、确认可行性的语用色彩，语气更柔和。
  - 「その ほうが いいです」用于口语中接受对方建议时，指代对方所提方案
  - 同事间较礼貌的商量语气（～ましょうか／～ほうがよい）
  - 对上级（课长）表达感谢
