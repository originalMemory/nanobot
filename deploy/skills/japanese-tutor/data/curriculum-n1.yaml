  jlpt_estimate:
    status: unverified
  communication_functions:
  - 詢問/回答某人的能力（會說某語言、能吃某物、能穿某衣）
  - 說明為達成某目的所做的準備或習慣
  - 请求/确认道路是否可通行（通り抜けられますか）
  - 提醒对方注意（写真を撮らないようにしてください／火傷しないように気をつけてください）
  - 表达喜好（大好きです）
  - 表达遗憾/感慨（残念ですね）
  grammar:
  - pattern: 動詞連用形＋られる／る（可能態）
    function_cn: 表示能力、可能性（会、能够、可以）
    formation: 一段動詞連用形＋られる；五段動詞 u→る 音便＋れる；サ変動詞 する→できる
    constraints:
    - 主語為能力持有者，対象用「が」提示
    - 与「～られる」被動態形同，需依語義區分能動可能與被動
    contrasts:
    - 可能態「～られる」 vs 被動態「～られる」
  - pattern: 動詞辞書形／た形＋ようにする
    function_cn: 有意使某狀態持續、養成習慣（有意為之）
    formation: 動詞辞書形／た形＋ようにする
    constraints:
    - 主語為有意調整行為者
    contrasts:
    - 「～ようにする」（有意維持） vs 「～ようになる」（變化結果）
  - pattern: 動詞辞書形／た形＋ようになる
    function_cn: 變化後達到某種狀態或能力（變得～）
    formation: 動詞辞書形／た形＋ようになる
    constraints:
    - 多表自然變化或結果，非主觀刻意
    contrasts:
    - 「～ようにする」（有意維持） vs 「～ようになる」（變化結果）
  - pattern: 可能形式（可能形）
    function_cn: 表示能够进行某动作，与「～ことができます」意义相同
    formation: 一类动词：基本形末音变相应「え」段音再加「る」；二类动词：基本形「る」变「られる」；三类动词：「来る」变「来られる」、「する」变「できる」
    constraints:
    - 可能形式的活用方式与二类动词相同
    - 使用可能形式时，动词前面的助词「を」常常变成「が」（与「～ことができます」中助词不变形成对比）
    contrasts:
    - 「～ことができます」与可能形式在助词选择上的差异
  - pattern: 小句(基本形／ない形) ように，小句
    function_cn: 表示“为了使某种状态成立”
    formation: 「ように」前接非意志性动词的「基本形」「ない形」，或意志性动词的可能形式的「基本形」「ない形」
    constraints:
    - 前接动词的意志性决定所接形式（非意志性接基本形/ない形，意志性接可能形式的基本形/ない形）
    contrasts: []
  - pattern: ～ように
    function_cn: 表示目的、意图，译作“为～／为了～”；前接非意志性的变化或状态，常接可能形式的基本形或ない形。
    formation: 动词可能形基本形／ない形 ＋ ように
    constraints:
    - 与「～ために」不可互换：ために表示意志性动作的目的，前接动词基本形。
    - 「～ように」前后主语可不一致；「～ために」前后主语必须一致。
    contrasts:
    - ～ために
  - pattern: 小句（基本形／ない形）ようになります
    function_cn: 表示能力、状况、习惯等变成了某种状态。
    formation: 非意志性动词基本形／ない形，或意志性动词可能形式的基本形／ない形 ＋ ようになります
    constraints: []
    contrasts: []
  - pattern: 小句（基本形／ない形）ようにします
    function_cn: 表示努力使某种行为、状况变成现实；描述平时留心做已成为习惯的行为时用「～ようにしています」。
    formation: 意志性动词基本形／ない形 ＋ ようにします
    constraints: []
    contrasts: []
  - pattern: 入り組んでいます
    function_cn: 表示事物之间相互交织、极其复杂的样子，常用于形容迷宫般的胡同道路或复杂的谈话内容。
    formation: 形容词/状态表达，接「～ています」表示持续状态。
    constraints: []
    contrasts: []
  - pattern: なんだか
    function_cn: 表示理由不明确的感觉或判断，多用于描述说话者的心理活动。
    formation: 接在形容词、动词或名词前，作副词性修饰。
    constraints: []
    contrasts: []
  - pattern: 見えます / 見られます
    function_cn: 「見えます」表示因眼力、空间距离等客观因素而能看到；「見られます」表示因人为、人工条件而能看到。
    formation: 动词「見る」的可能形两种来源。
    constraints: []
    contrasts:
    - 与「聞こえます／聞こえます」的客观/人为区别相同。
  - pattern: ら抜き言葉（无ら形式）
    function_cn: 日常会话中把二类动词可能形及「来られます」等省略应有的「ら」形成的非标准形式，如「起きれます」。
    formation: 省略可能形中的「ら」。
    constraints:
    - 本不正确，曾被视为年轻人语言特征受非议，近年使用者增加。
    contrasts: []
