  - 初次见面谈话内容的禁忌（个人问题回避）
  - 避免给对方不快感受的语用意识
  - 询问对方是否结婚、工资、年龄等（普通不直接问）
  - 确认是否已买机票、预订房间
  - 表达让步关系（无论…都…）
  - 书面标题的简洁表达
  - 理由说明
  - 命令/请求语气
  grammar:
  - pattern: 久未见面者的开场寒暄
    function_cn: 以长时间未见面的说法作开场白，可前置礼貌语、后置问候语构成扩展形式
    formation: 核心寒暄语 + 可选前置敬语 + 可选问候句
    constraints:
    - 用于对象为久未见面的人
    contrasts: []
  - pattern: 最近见过面者的感谢寒暄
    function_cn: 提及上次见面时的情境并再次致谢（如收到馈赠、受招待、受款待等），表示未忘记上次恩情
    formation: 时间副词 + 致谢/感谢句
    constraints:
    - 用于对象为最近刚见过面的人
    - 忘记此类寒暄会被视为失礼
    contrasts: []
  - pattern: 初次见面问候
    function_cn: 在聚会等场合与陌生人打招呼时用作问候语，随后做简单自我介绍
    formation: 固定问候语 + 自我介绍
    constraints:
    - 用于对象为初次见面的人
    contrasts: []
  - pattern: 简单寒暄
    function_cn: 与曾见过面且关系密切者交谈时仅以简短致意或点头示意，随即进入近况等话题
    formation: 简短问候语
    constraints:
    - 用于关系密切的熟识者
    contrasts: []
  - pattern: 打断对方交谈的致歉
    function_cn: 想与对方交谈而对方正与他人说话或忙于他事时，用‘～中，失礼します’类表达致歉，可加缓和语
    formation: 场景名词 + 中 + 致歉句；可前置缓和词
    constraints:
    - 用于对方正忙着其他事情
    contrasts: []
  - pattern: 结束交谈的告别语
    function_cn: 打算结束谈话时常用告别语，含口语形式及省略说法，可加时间词限定
    formation: 连接词 + 告别/失礼句；可前置时间词
    constraints:
    - 用于结束交谈
    contrasts: []
  - pattern: ～ぶり
    function_cn: 接时间段名词，含感叹语气，表示离再次发生同样事情的时间较长；修饰动词用「～ぶりに＋动词」，修饰名词用「～ぶり＋の＋名词」
    formation: 时间段名词＋ぶり；动词连用形＋ぶりに；名词＋の＋ぶり
    constraints:
    - 不能用于比「日」更短的单位（如「秒」「分」「時間」）
    - 「日」只能用于两天以上，不说「×1日ぶり」
    - 时间较长时可用「久しぶり」
    contrasts: []
  - pattern: ～ものです
    function_cn: 表示说话人感叹；对事物性质或变化吃惊；与「よく」连用表对平常不会发生之事的惊讶；接「～ほしい／～たい」时强调愿望
    formation: 小句（简体形式）＋ものです；二类形容词＋なものだ／ものです
    constraints:
    - 小句部分为二类形容词时形式为「二类形容词＋な＋ものです」
    - 本质义的否定用「～ない＋ものです」
    - 理所当然义的否定用「～ものではありません」
    - 口语中可用「～もんじゃありません」
    contrasts:
    - 本质否定 vs 理所当然否定的形式差异
  - pattern: その節
    function_cn: 提到前不久发生的事并表示致谢的场合使用
    formation: その節は＋お世話になりました／ありがとうございました 等
    constraints:
    - 一般限于致谢语境
    - 没有「あの節」「この節」的用法
    contrasts: []
  - pattern: いらっしゃいました
    function_cn: 对来宾使用尊敬的表达方式，为「来ます」的尊敬语
    formation: 「来ます」的尊敬表达有「いらっしゃいます」「来られます」等
    constraints:
    - 「いらっしゃいます」比「来られます」尊敬程度更高，故多用前者
    contrasts: []
  - pattern: こちらにお願います / お願いいたします
    function_cn: 请求对方帮忙做事的礼貌用语；当对方已清楚请求内容时可省略具体动作动词，用其替代具体动词
    formation: 可在前面加「こちら（の方）に」或「よく」等以避免误解；常与各种词语搭配
    constraints:
    - 仅用「お願いいたします」时意思不够明确，需加限定词
    - 常用于初次见面寒暄或希望协作的场合
    contrasts:
    - 与「こちらに案内してください」等具体动词请求的区别在于省略动作、依赖上下文
  - pattern: 今度
    function_cn: 表示“下次/下次”“这回/这次”，有时表示“最近”
    formation: 作时间副词或修饰名词（如「今度のプロジェクト」）
    constraints: []
    contrasts: []
  - pattern: 介绍某人的顺序与称呼规则
    function_cn: 工作场合介绍某人时的顺序与称呼规范
    formation: 本公司人员介绍给外人：先上级后下级；外人介绍给本公司人员：同样先上级后下级
    constraints:
    - 介绍时无论对本公司人员还是外人都用「こちら（这/这位）」，不用「これ」或「この人」
    contrasts: []
  - pattern: 公司内部人员称谓规则（语用/称呼规则）
    function_cn: 说明在公司内部及对外提及本公司人员时的称呼规范：对上级用头衔（如社長、部長、課長）；同级或晚辈在姓氏后加「さん」，男性之间可用「君」；多个同职务者加姓氏以示区分；对外人提及本公司人员时仅称姓氏、不加头衔，而当面称呼时加「さん」。
    formation: 姓氏＋头衔（对上级/对外提及）；姓氏＋さん（同级、晚辈、当面称呼）；姓氏＋君（男性之间）
    constraints:
    - 对外人提及本公司内部人员时只称姓氏，不加头衔
    - 当面称呼佐藤时要加「さん」，即「佐藤さん」，而向他人介绍时只称「佐藤」
    - 向外国公司的人提及山田部长时用「山田は…」，在公司内向其打招呼时用「山田部長／山田さん」
    contrasts:
    - 对外提及 vs 当面称呼：前者去头衔、后者加「さん」
  - pattern: ～よりも
    function_cn: 表示比较，语气比单纯用“より”更强；助词“より”后接助词“も”。
    formation: 名词/动词等 + より + も
    constraints:
    - 表示比较时可与“より”互换，但语气更强。
    - 另有表示起点/基准的用法（如从某时刻开始），该用法后不能接“も”。
    contrasts:
    - 与“より”比较：语气强弱差异；起点用法不可加“も”。
  - pattern: ～から～まで
    function_cn: 表示时间或场所的范围，意为“从～到～”；也可表示事物的范围。
    formation: 名词/动词等 + から + 名词/动词等 + まで
    constraints:
    - 用于修饰表示程度/范围的名词（如“もの”）时，前后成分结构较复杂，需注意搭配。
    contrasts: []
  - pattern: お辞儀をし、～（动词ます形去ます + 、+ 动词）
    function_cn: 按事件发生的先后顺序叙述动作；书面语中用动词“ます形”去掉“ます”的形式连接，一般不用“～て、～”。
    formation: 动词ます形（去ます） + 、 + 动词
    constraints:
    - 口语中按先后顺序叙述常用“～て、～”形式。
    - 当前后动作几乎同时发生，或前一动词修饰后一动词时，通常用“～て～”，一般不能改为“ます形去ます”连接。
    contrasts:
    - 与“～て、～”：先后顺序叙述 vs 同时/修饰关系。
  - pattern: ～ほうが～です
    function_cn: 表示比较，除名词比较外还用于小句及动词的比较
    formation: 小句(简体形式)+より+小句(简体形式)+ほうが+形容词です；动词可用基本形或た形
    constraints:
    - 使用た形表示建议语气较强，使用基本形表示一般性看法
    - 动词ない形时不能使用～なかったほうが～的形式
    contrasts: []
  - pattern: 仕事の場
    function_cn: 表示场所，比场所稍陈旧生硬，含将要特别进行某事的场所或时间的语气
    formation: 将活动内容用名词表示并置于场之前
    constraints: []
    contrasts: []
  - pattern: ～ほうがいいでしょう
    function_cn: 向对方提出某种建议，含不那样做会导致不好结果的语气
    formation: 动词た形+ほうがいい+でしょう
    constraints:
    - でしょう语气比～ほうがいいです柔和，属委婉提出建议的说法
    contrasts:
    - ～ほうがいいです
  - pattern: ～か、～か、～
    function_cn: 句尾带疑问助词か的疑问句作为小句或分句，用作句子的一部分
    formation: 不含疑问词的疑问句一般用～かどうか；并列几项时用～か；含疑问词的疑问句用疑问词+か
    constraints: []
    contrasts:
    - ～かどうか
  - pattern: 年／歳（年齢の表し方）
    function_cn: 口语中一般称“年齢”为“年”，汉字写作“歳”；与数字一起表示年龄时用“歳”；“年”还可构成“年を取ります（上年纪）”“年寄り（老年人）”等表达。
    formation: 数字＋歳；年を取ります；年寄り
    constraints:
    - 表示年龄时与数字搭配用“歳”而非“年”
    - 手写时可用汉字“才”代替“歳”
    contrasts:
    - 年（口语/构成词） vs 歳（与数字表年龄）
  - pattern: いくら～ても～
    function_cn: 无论如何努力做A，但即使那样还是B（让步/转折）。
    formation: いくら＋动词て形／形容词＋く／な＋も
    constraints:
    - 后续动词用“て形”加“も”
    - 同义表达：いかに～ても（较正式，多用于书面语）、どんなに～ても、どれだけ～ても
    contrasts:
    - いくら～ても vs いかに～ても（语体正式度差异）
  - pattern: 表情形容詞＋顔をする
    function_cn: 表示面部表情的表达方式；“顔をする”还可与表示情感的词搭配。
    formation: 表情形容詞＋顔をする
    constraints: []
    contrasts: []
  - pattern: ～ては／～では
    function_cn: 表示出现不良情况A就会出现B的消极结果或状态，B使用消极评价内容
    formation: 动词て形＋は；形容词て形＋は；名词＋では
    constraints:
    - B须为消极评价内容
    - 会话中「ては」可说成「ちゃ（あ）」，「では」可说成「じゃ（あ）」
    contrasts: []
  - pattern: 気持ちがこもっています
    function_cn: 表示充满某物（心情、情感）而不外露
    formation: 名词（気持ち／思い／真心等）＋がこもっています
    constraints:
    - 「こもる」为自动词
    - 另有他动词「こめる」表达，如気持ちをこめる、思いをこめる
    contrasts:
    - 自动词「こもる」与他动词「こめる」的用法区别
  - pattern: ～以上に
    function_cn: 具有比较意义，表示超出了作为基准事物的量或范围
    formation: 动词基本形／た形＋以上に；名词＋以上に
    constraints:
    - 常用于书面语，属比较正式的表达方式
    - 前接动词基本形时主句有使用限制（页面截断，未完整）
    - 本页仅延续上一页例句，规则说明在前页
    - 可与“予想/想定”等搭配表示超出预期
    contrasts: []
  - pattern: ～ものです（拓展：感慨/回顾）
    function_cn: 表示说话人感慨（小句简体＋ものです）；表示回顾过去（た形＋ものです）。
    formation: 小句简体形＋ものです / 动词た形＋ものです
    constraints:
    - 具体用法（感慨/本质/理所当然/回顾）需依上下文判断
    contrasts: []
  - pattern: 汉字组合表达（名词性短语）
    function_cn: 用汉字组合构成简洁表达，基本语序仍遵循日语句子结构
    formation: 汉字词直接组合，可加助词或省略助动词
    constraints:
    - 多用于报纸标题等书面语
    - 标题中常省略助动词，按意思补全
    contrasts: []
  - pattern: 前缀/后缀 急・再・未・無・～中・～前
    function_cn: 表示动作状态、否定含义或时间关系
    formation: 接在动词或名词前/后构成复合词
    constraints:
    - 急～/再～表动作状态
    - 未～/無～表否定
    - ～中/～前表时间关系
    contrasts: []
  - pattern: ～につき／～により
    function_cn: 简洁地表达理由
    formation: 接在名词或名词短语后
    constraints: []
    contrasts: []
  - pattern: 助词 へ（事态方向）
    function_cn: 表示事态未来发展的方向
    formation: 接在表示变化/合作等名词短语后
    constraints: []
    contrasts: []
  - pattern: 交通标语命令语气（省略助动词）
    function_cn: 以命令/请求语气表达，如左右確認、一時停止、踏切注意
    formation: 省略「してください／しろ」等助动词
    constraints:
    - 常见于交通标语
    contrasts: []
  pragmatics:
  - 敬语与谦让表达（お待たせしました／ごぶさたしています／こちらこそ／よろしくお願いします）
  - 久别重逢的寒暄（4年ぶりです）
  - 向第三方介绍新负责人并致意
  - 寒暄语的选择取决于对象与己方的关系（久未见/最近见过/初次/熟识）
  - 对最近见过面者需再次致谢上次馈赠或招待，否则被视为失礼
  - 打断对方需用‘～中，失礼します’类表达并可视情况加缓和词
  - 「～ぶり」含感叹语气，强调时间之长
  - 「～ものです」可表惊讶或愿望强调
  - 「その節」用于致谢寒暄
  - 「いらっしゃいます」尊敬程度高于「来られます」
  - 请求时省略具体动词依赖双方对内容的共识
  - 介绍顺序体现上下级礼仪
  - 头衔（社長、部長、課長）用于对上级或对外提及
  - 「さん」「君」用于同级、晚辈或男性之间
  - 对外提及本公司人员时省略头衔以示谦称/客观指称
  - 鞠躬角度区分：軽い（会釈）／普通（敬礼）／丁寧（最敬礼）
  - 对上级先递名片并深鞠躬，再鞠躬接受对方名片
  - 递接名片宜用双手
  - 涉及对方私事（婚姻、收入、年龄）的提问通常被视为不礼貌
  - 标题语体省略助动词
  - 标语命令语气
