  similar_contrasts:
  - 与「～たり～たりする」强调部分列举，区别于「～たりも～たりも」等强调形式
  - 可与“动词基本形 + か + 否定形（ない形）+ 知りません／分かりません”互换，含义相同
  - 与“～か どうか”结构在名词／二类形容词后的接续规则一致
