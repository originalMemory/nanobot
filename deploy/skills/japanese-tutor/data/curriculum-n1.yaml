  communication_functions:
  - 邀请对方做某事并说明拒绝理由
  - 询问过去事件（考试）的感受并回应
  - 就物品特征（领带是否花哨）交换看法
  - 询问并告知电话号码
  - 在口语中根据亲疏关系切换敬体与简体表达
  - 询问对方经历/感受（如考试如何）
  - 确认事物属性（如是否花哨、是否安静）
  - 确认日期/天气等名词谓语信息
  - 用转折/铺垫连接两个小句表达让步或前提
  - 用简体会话表达愿望、陈述事件
  - 用简体疑问确认物品产地、状态
  - 用“かな”“の”进行推测或要求说明
  - 询问/告知电话号码
  - 用终助词表达语气与态度
  - 电话应答与自报姓名
  - 询问近况与消息（最近…連絡あった？）
  - 转述他人计划（…だって）
  - 确认时间、地点、期间
  - 约定后续联系（また連絡するよ）
  grammar:
  - pattern: い形容词过去式（～かった）
    function_cn: 描述过去某一时间点的状态或感受
    formation: い形容词词干 + かった
    constraints:
    - 用于过去时叙述，与「昨日」等时间词搭配
    contrasts:
    - 与现在时「～い」相对
  - pattern: な形容词/名词否定（～ではない）
    function_cn: 对性质、状态进行否定判断
    formation: な形容词/名词 + では ない
    constraints:
    - 书面/较正式否定，区别于「～じゃない」
    contrasts:
    - 与口语否定「～じゃない」语体不同
  - pattern: 提议/邀请疑问（～ない？）
    function_cn: 向对方发出邀请或提议
    formation: 动词否定形 + ない？
    constraints:
    - 用于熟人之间，语气较随意
    contrasts:
    - 与「～ましょうか」的礼貌提议不同
  - pattern: 原因表达（～から）
    function_cn: 说明拒绝或陈述的理由
    formation: 名词/动词/形容词 + が/は ～から
    constraints:
    - 可单独使用，常以省略号结尾表示委婉
    contrasts:
    - 与「ので」相比语气更直接
  - pattern: 程度副词（ちょっと、まあまあ）
    function_cn: 修饰形容词或动词，表示程度
    formation: 副词 + 形容词/动词
    constraints:
    - 「ちょっと」表轻微程度，「まあまあ」表中等/尚可
    contrasts:
    - 与「とても」程度方向相反
  - pattern: 否定强调（～じゃない）
    function_cn: 否定对方判断并强调相反事实
    formation: 名词/な形容词 + じゃない
    constraints:
    - 口语中用于反驳或纠正
    contrasts:
    - 与「～ではない」语体不同
  - pattern: 敬体形 vs 简体形（语体区分）
    function_cn: 根据说话人与听话人的上下关系、亲疏关系选择谓语形式：对长辈或关系不亲密者用敬体形（含ます/です），对同辈、晚辈或关系密切者用简体形（不用ます/です）。
    formation: 动词本身具有敬体与简体两套形式；一类形容词、二类形容词和名词本身无敬体/简体之分，仅在作谓语时其谓语形式才区分敬体与简体。
    constraints:
    - 敬体形对应此前所学的～ます／～ません／～ました／～ませんでした四种礼貌形式
    - 简体形对应动词基本形、ない形、た形、なかった形
    contrasts:
    - 动词与形容词/名词在敬体/简体区分上的差异
  - pattern: 动词简体形（现在将来/过去 × 肯定/否定）
    function_cn: 用简体形表达动词的现在、将来、过去肯定与否定。
    formation: 肯定现在＝基本形；否定现在＝ない形；肯定过去＝た形；否定过去＝なかった形。
    constraints:
    - ある 的简体形为：ある／ない／あった／なかった
    - 「ありません」的简体形是「ない」
    contrasts:
    - 敬体 ます/ません/ました/ませんでした 与 简体 基本形/ない形/た形/なかった形 的对应
  - pattern: 一类形容词谓语简体形
    function_cn: 用简体形表达一类形容词的现在肯定、现在否定、过去肯定、过去否定。
    formation: 肯定现在＝い形；否定现在＝く＋ない；肯定过去＝かった；否定过去＝く＋なかった。
    constraints:
    - 对应敬体形：いです／くないです／かったです／くなかったです
    contrasts:
    - 一类形容词敬体 いです/くないです/かったです/くなかったです 与 简体 い/くない/かった/くなかった 的对应
  - pattern: 二类形容词（な形容词）谓语简体形
    function_cn: 现在/过去、肯定/否定的简体（非敬体）表达
    formation: 肯定简体加「だ」；否定简体「ではない」；过去肯定「だった」；过去否定「ではなかった」
    constraints:
    - 现在将来肯定疑问句需去掉简体形中的「だ」
    contrasts:
    - 与一类形容词不同，二类形容词简体肯定形可加「だ」
  - pattern: 名词谓语简体形
    function_cn: 现在/过去、肯定/否定的简体（非敬体）表达
    formation: 肯定简体加「だ」；否定简体「ではない」；过去肯定「だった」；过去否定「ではなかった」
    constraints:
    - 现在将来肯定疑问句去掉「だ」
    contrasts:
    - 名词与二类形容词简体形规则一致，均可加「だ」
  - pattern: 小句 けど 小句
    function_cn: 连接两个小句，表示转折或铺垫，用于口语
    formation: 前接小句，后接小句
    constraints:
    - 口语体接续词
    contrasts:
    - 既可表转折，也可表铺垫（不表转折）
  - pattern: 一类形容词简体形限制
    function_cn: 易混项提示
    formation: 一类形容词简体形后不能加「だ」
    constraints:
    - 与二类形容词及名词不同
    contrasts:
    - 二类形容词、名词简体肯定形可加「だ」，一类形容词不可
  - pattern: 敬体／简体（文体的选择）
    function_cn: 区分正式与随意语体：正式场合、书信用敬体；与家人朋友交谈、法律文章、报纸、商业文件等用简体。
    formation: 敬体形与简体形对应替换。
    constraints:
    - 语体选择取决于场合与对象，而非句法本身。
    contrasts:
    - 敬体 vs 简体
  - pattern: 简体疑问
    function_cn: 用简体表示疑问。
    formation: 名词句、形容词句省略敬体的“～ですか”；动词句将敬体形变为简体形并去掉疑问助词“か”；句尾读升调，书写时加“？”。
    constraints:
    - 疑问语气靠升调与问号体现，而非助词“か”。
    contrasts:
    - 敬体疑问（～ですか／～ますか）vs 简体疑问
  - pattern: “うん”／“ううん”
    function_cn: 简体会话中对“はい”“いいえ”的随意替代。
    formation: “はい”→“うん”；“いいえ”→“ううん”。
    constraints:
    - 语调较特殊，需听录音模仿。
    contrasts:
    - “はい／いいえ” vs “うん／ううん”
  - pattern: 助词“かな”
    function_cn: 表示自言自语的推测；有听话人在场时，通过自问自答向对方提供不太确实的信息。
    formation: 接在简体形后面。
    constraints:
    - 只能接简体形。
    contrasts:
    - “かな” vs “の”（后者用于要求说明或确认）
  - pattern: 助词“の”
    function_cn: 用于要求说明或确认某事。
    formation: 接在简体形后面。
    constraints:
    - 只能接简体形。
    contrasts:
    - “の” vs “かな”
  - pattern: ～って（传闻）
    function_cn: 表示传闻（听说……）。
    formation: 在简体形后面加“って”构成。
    constraints:
    - 本页仅给出“传闻”义（①），后续用法可能跨页。
    contrasts: []
  - pattern: 动词ます形去「ます」+「方」
    function_cn: 表示“～的做法/方法”
    formation: ます形词干+方（如 話し→話し方、読み→読み方、作り→作り方、やり→やり方、使い→使い方）
    constraints:
    - 并非所有动词都可这样构成
    contrasts: []
  - pattern: 简体句省略
    function_cn: 口语中简体句部分音省略
    formation: て形「ている」的「い」可省；宾语助词「を」可省
    constraints:
    - 限于口语
    contrasts: []
  - pattern: 终助词「わ」「よ」
    function_cn: 句末语气/强调
    formation: 接简体句或敬体句后
    constraints:
    - 「わ」传统上多为女性使用，「よ」男性常用；近年性别差异缩小
    - 二类形容词+よ、名词+よ 的形式主要为女性使用
    contrasts:
    - 「わ」与「よ」的性别语用差异
  - pattern: 电话号码读法
    function_cn: 逐位读数字以便听清
    formation: 数字一位一位读；局号与个人号间可加「の」
    constraints: []
    contrasts: []
  pragmatics:
  - 「ごめん」用于熟人间的道歉
  - 「ううん」表否定回应，「うん」表肯定回应
  - 简体会话中常省略助词
  - 简体形用于非敬体/口语场合
  - 「けど」用于口语，可表转折或铺垫
  - 敬体用于正式场合与书信，简体用于家人朋友及特定文体（法律文章、报纸、商业文件）
  - “かな”在有人在场时承担向对方传递不确定信息的语用功能
  - 「わ」「よ」的性别语用差异
  - 口语简体句省略现象
  - 朋友间非正式电话用语（～だよ／～かな／～よ）
  - 通话结束后的礼貌确认（分かりました？）
