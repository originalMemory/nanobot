  grammar:
  - pattern: 〜ようです
    function_cn: 表示推测或传闻（较书面/中性）
    formation: 动词辞书形／形容词・な形容词词干／名词＋の＋ようです
    constraints:
    - 用于说话人根据迹象推测或转述他人说法
    - 与「〜らしいです」同表传闻但语感不同
    contrasts:
    - 〜みたい（です）
    - 〜らしいです
  - pattern: 〜みたい（です）
    function_cn: 表示推测或传闻（口语）
    formation: 动词辞书形／形容词・な形容词词干／名词＋みたい（です）
    constraints:
    - 口语色彩较强
    - 可表推测、传闻、比喻
    contrasts:
    - 〜ようです
    - 〜らしいです
  - pattern: 〜らしいです
    function_cn: 表示传闻（听说、据称）
    formation: 动词辞书形／形容词・な形容词词干／名词＋らしいです
    constraints:
    - 强调信息来源为传闻而非亲眼所见
    contrasts:
    - 〜ようです
    - 〜みたい（です）
  - pattern: 〜すぎ（ます）
    function_cn: 表示程度过头、超出适当范围
    formation: 动词ます形去ます／形容词・な形容词词干／名词＋の＋すぎ（ます）
    constraints:
    - 多含负面或遗憾语感
    contrasts: []
  - pattern: 小句(简体形)＋ようです／名詞＋の＋ようです
    function_cn: 根据说话人感知到的某种情况进行推测
    formation: 接小句简体形；接名词时用「名词＋の＋ようです」；二类形容词小句把简体「だ」换成「な」后用「な＋ようです」
    constraints:
    - 表示推测，语气较书面/中性
    contrasts: []
  - pattern: 小句(简体形)＋みたいです
    function_cn: 根据说话人感知到的某种情况进行推测，较随便的说法，不用于书面语
    formation: 接小句简体形；二类形容词小句和名词小句把简体「だ」换成「みたいです」
    constraints:
    - 口语化，不用于书面语
    contrasts:
    - 与「～ようです」基本相同，但语体更随意
  - pattern: 小句(简体形)＋らしいです
    function_cn: 既可表示根据观察到的情况进行推测，也可婉转叙述听来的信息（传闻）
    formation: 接小句简体形；二类形容词小句和名词小句把简体「だ」换成「らしいです」
    constraints:
    - 兼具推测与传闻两种功能
    contrasts: []
  - pattern: ～ようです／～らしいです
    function_cn: 表示推测；第三者客观叙述推测结论时两者皆可，直接对被观察、被推测的人发话时只能用～ようです
    formation: 接续动词た形等后接ようです／らしいです
    constraints:
    - 对推测对象本人发话时禁用～らしいです
    contrasts:
    - ～ようです 与 ～らしいです 在发话对象上的语用限制
  - pattern: 动词／一类型／二类型 過ぎます
    function_cn: 表示某种动作或事物的性质等超过了正常的量或程度
    formation: 动词ます形去ます加過ぎます；一类型形容词词尾い换過ぎます；二类型形容词后接過ぎます
    constraints:
    - 過ぎます 的活用方式与二类动词相同
    contrasts: []
  - pattern: 一类型＋さ
    function_cn: 构成表示某种状态的名词；部分一类型形容词＋さ表示大小、长短、轻重、高度、面积、厚度、深度、粗度、速度等
    formation: 一类型形容词词尾い换さ
    constraints:
    - 某些二类型形容词也可后接さ（如便利さ、複雑さ），但不如一类型普遍
    - 不说きれいさ、暇さ
    contrasts:
    - 一类型形容词＋さ 与 二类型形容词＋さ 的普遍程度差异
  - pattern: 試験に合格する／不合格する
    function_cn: 助词「に」表示成功或失败的对象（如考试考中/考砸）。
    formation: 名词＋に＋合格する／不合格する
    constraints: []
    contrasts: []
  - pattern: おかげさまで
    function_cn: 用于对对方的关心、惦念表示感谢；可单独成句，也可后接其他句子。
    formation: 独立使用，或＋句子
    constraints:
    - 语用：致谢对方带来的好结果
    contrasts: []
  - pattern: けっこう
    function_cn: 表示程度的副词（口语），表示受欢迎/程度比预想更高；可修饰可量化与不可量化形容词。
    formation: けっこう＋い形容词／な形容词
    constraints:
    - 口语形式，多种含义
    contrasts:
    - 与「なかなか」相近，但「なかなか」仅用于不能量化的程度（如いい、おいしい），「けっこう」还可用于可量化程度（如長い、高い）
  - pattern: 何と言っても
    function_cn: 表示从多种因素中着重选择一种；原意为“不管别人怎么说”。
    formation: 何と言っても＋句子
    constraints: []
    contrasts: []
  - pattern: しゃれていて（～ています 形式）
    function_cn: 表示产品设计新颖/别致；日语动词用来表示某种性质时需用「～ています」形式。
    formation: 动词て形＋いて／～ています
    constraints:
    - 表示性质/状态时不能只用ます形
    contrasts: []
  - pattern: 受ける
    function_cn: 表示受到别人赞赏或欢迎；表演戏剧、单口相声等博得观众笑声、掌声时也用此表达。
    formation: 动词，他动用法，常与「～が受ける／～を受ける」搭配。
    constraints: []
    contrasts: []
  - pattern: パワー
    function_cn: 源自英语 power，本意体力，现多指意志、干劲、能量等综合形成的力量；课文中用于形容公司的干劲与能量。
    formation: 名词，可作「すごいパワー」等修饰结构。
    constraints: []
    contrasts: []
  - pattern: 控えめ
    function_cn: 两种含义：一是分量少（如甜度适中），二是做事有节制；用于态度或性格时表谨慎、拘谨，符合日本文化重谦虚的语用倾向。
    formation: 名词/形容动词性，可作「～が控えめ」「控えめな態度／性格」等。
    constraints: []
    contrasts: []
  - pattern: ビアガーデン
    function_cn: 指夏天在高楼屋顶或屋外开设、以啤酒为主并提供酒菜、电视观赛或舞台表演的庭院式啤酒店。
    formation: 名词（外来语）。
    constraints: []
    contrasts: []
  - pattern: 社員旅行
    function_cn: 指公司为加深职员相互了解、谋求和睦而组织的集体旅游活动，费用全部或部分由公司负担，通常要求全员参加。
    formation: 名词。
    constraints: []
    contrasts: []
  pragmatics:
  - ～ようです／～らしいです 在发话对象（第三者 vs 本人）上的语用限制
  - 「おかげさまで」用于致谢对方带来的好结果，可独立或接续使用
  - 「けっこう」为口语程度副词，与「なかなか」在可量化性上区分
  - 「控えめな態度／性格」在日本文化语境中往往得到正面评价，体现谦虚语用倾向。
  - 职场同事间关于市场调研与广告业务的会话
  - 使用「～ようです」「～らしいです」等传闻/推测表达转述市场评价
  - 职场称呼与寒暄（呉さん／鈴木さん／佐々木）
  - 对久等致歉与「いいえ、大丈夫です」的礼貌回应
