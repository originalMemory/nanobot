  grammar:
  - pattern: ～て、すみません
    function_cn: 因某事（如迟到）向对方道歉
    formation: 动词て形 + して/て + すみません
    constraints: []
    contrasts: []
  - pattern: ～に使う
    function_cn: 表示某物的用途、用于某目的
    formation: 名词 + に + 使う
    constraints: []
    contrasts: []
  - pattern: ～てばかりいる
    function_cn: 反复做某事、总是做某事，常含不满或批评语气
    formation: 动词て形 + ばかりいる
    constraints: []
    contrasts: []
  - pattern: ～ているのが見える
    function_cn: 看到某人/某物正在做某事（视觉感知）
    formation: 动词ている + のが + 見える
    constraints: []
    contrasts:
    - 与「聞こえる」区分：前者视觉、后者听觉
  - pattern: ～ことができる
    function_cn: 表示能力或可能性（能够做某事）
    formation: 动词辞书形 + ことができる
    constraints: []
    contrasts: []
  - pattern: ～て、～ので
    function_cn: 并列原因或说明理由（轻、便携，所以便于携带）
    formation: 形容词/动词て形 + ので
    constraints: []
    contrasts: []
  - pattern: ～ているのが聞こえる
    function_cn: 听到某人/某物正在做某事（听觉感知）
    formation: 动词ている + のが + 聞こえる
    constraints: []
    contrasts:
    - 与「見える」区分：前者听觉、后者视觉
  - pattern: ～ませんでした
    function_cn: 过去时否定（未能听到、没有做）
    formation: 动词ます形去ます + ませんでした
    constraints: []
    contrasts: []
  - pattern: 小句1て／小句1で，小句2
    function_cn: 表示原因、理由（小句1是小句2的原因）
    formation: 小句1以て或で接续小句2
    constraints:
    - 小句2不可以是祈使句
    contrasts: []
  - pattern: 名词＋に
    function_cn: 表示用途或基准
    formation: 用途：前接说明用途的名词，后接「使います」等动词；基准：前接基准名词，后接评价性形容词
    constraints: []
    contrasts: []
  - pattern: 动词基本形＋の＋に
    function_cn: 表示用途或基准
    formation: 与「名词＋に」相同，后接「使います」等动词或评价性形容词
    constraints: []
    contrasts:
    - 与「名词＋に」功能相同，前项为动词基本形＋の
  - pattern: 名＋ばかり
    function_cn: 表示所列举的事物全部相同（限定范围）
    formation: 名词后接ばかり
    constraints:
    - 不能用于限定数字
    - 不能与否定形式呼应
    - 含反复进行同一动作及“不太理想”的语感
    contrasts:
    - 与～だけ相比，～だけ可限定数字、可与否定呼应、仅表无例外
  - pattern: 动词て形＋ばかりいます
    function_cn: 表示总是发生同样的事情或总是进行同样的动作
    formation: 动词て形后接ばかりいます
    constraints:
    - 强调动作的反复与持续
    contrasts:
    - 与～だけ相比，～だけ仅表无例外，不含反复与负面语感
  - pattern: 小句(动词简体形)＋のが＋見えます／聞こえます
    function_cn: 表示看到或听到某一动作、状态
    formation: 动词简体形小句后接のが，再接見えます／聞こえます
    constraints:
    - 谓语为一类形容词时用‘＋の’形式
    - 谓语为二类形容词时用‘＋な＋の’形式
    contrasts: []
  - pattern: ほんと
    function_cn: “本当”的口语缩略形式，表强调/确实
    formation: 口语缩略
    constraints: []
    contrasts: []
  - pattern: とにかく
    function_cn: 事情多但不一一罗列、优先陈述某事时使用
    formation: 副词性表达
    constraints: []
    contrasts: []
  - pattern: 擬音語・擬態語
    function_cn: 模仿声音或描述样态，功能一般相当于副词
    formation: 拟声词/拟态词
    constraints: []
    contrasts: []
