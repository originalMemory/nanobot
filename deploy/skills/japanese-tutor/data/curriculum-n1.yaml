  - 与“あります”“です”的礼貌度对比
  - 与第47课动词尊他形式区分：此处针对非动词词类
  - 普通说法与自谦语一一对应，不可混用
  - あした 与 みょうにち 的语体差异
  - 与「います」「～ています」相比语体更谦和
