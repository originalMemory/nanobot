  grammar:
  - pattern: ～と 思う
    function_cn: 表示说话人的主观想法、推测或判断
    formation: 动词辞书形／形容词／名词＋と＋思う
    constraints: []
    contrasts: []
  - pattern: ～と 言う
    function_cn: 转述他人所说的内容（间接引语）
    formation: 动词辞书形／形容词／名词＋と＋言う
    constraints: []
    contrasts: []
  - pattern: ～んです
    function_cn: 解释原因、说明状态或强调
    formation: 动词连体形／名词＋なんです／んです
    constraints: []
    contrasts: []
  - pattern: どうやって
    function_cn: 询问方式、方法
    formation: どう＋やって
    constraints: []
    contrasts: []
  - pattern: 小句(简体形)＋と 思います
    function_cn: 表示说话人自己的思考、看法或推测内容
    formation: 「と」前的小句谓语必须使用简体形（动词/形容词/形容动词简体）
    constraints:
    - 「～と 思います」仅能表示说话人本人的思考内容
    - 改为「～と 思いました」或「～と 思っています」时，既可表示说话人思考，也可表示他人（说话人以外）的思考内容
    contrasts:
    - 与「～と 思いました／思っています」在转述他人想法时的语用差异
  - pattern: 名[人]＋は＋小句(简体形)＋と 言いました
    function_cn: 向第三者转述他人所说的话（间接引语）
    formation: 在所说内容（简体形小句）后加「～と 言いました」；若需指明是对谁说的，在句中加「名词＋に」
    constraints:
    - 转述某人反复说起的事情时，用「～と 言っています」表示
    contrasts:
    - 「～と 言いました」与「～と 言っています」在一次性转述与反复/持续转述上的区别
  - pattern: ～のです／んです
    function_cn: 表示所讲内容与前句或前项内容有关联，用于说明状况或解释原因
    formation: 页面底部被截断，接续与例句未完整显示
    constraints: []
    contrasts: []
  - pattern: ～のです／～んです
    function_cn: 说明原因、理由；～んです为～のです的口语形式
    formation: 前接简体形；名词与二类形容词的现在将来肯定形中“だ”需换成“な”
    constraints:
    - 多用于书面语（～のです）与口语（～んです）的区分
    contrasts: []
  - pattern: どうして ～のですか／んですか
    function_cn: 询问理由的更完整形式，回答时同样使用～のです／～んです
    formation: どうして＋简体形＋のですか／んですか
    constraints:
    - 与第11课“どうしてですか”为同一询问理由功能的扩展形式
    contrasts: []
  - pattern: 小句が，小句
    function_cn: 助词“が”表示铺垫，提示接下来要说的内容
    formation: 小句＋が＋小句
    constraints:
    - 多用于书面语
    contrasts:
    - 与表示铺垫的“けど”相比，“が”更偏书面
  - pattern: ～と 思います
    function_cn: 向别人陈述自己的想法；即使确信某观点，也避免绝对性说法，用以缓和语气
    formation: 句子后接「と 思います」
    constraints: []
    contrasts: []
  - pattern: どうやって～
    function_cn: 询问方法（怎么做）
    formation: 疑问词「どう」与动词「やる」的て形「やって」结合；询问理由时用「どうして」（「どう」+「する」的て形「して」）
    constraints:
    - 询问方法用どうやって，询问理由用どうして
    contrasts:
    - どうやって（方法） vs どうして（理由）
  - pattern: ～に ついて
    function_cn: 相当于汉语“关于～”，表示思考对象
    formation: 一般后续「考えます」「思います」「研究します」等表示思维活动的词语；用作标题时可省略后面动词
    constraints:
    - 后续多为思考类动词
    contrasts: []
  - pattern: とうとう
    function_cn: 副词，相当于“终于”“结局”“到底”；表示不论结果好坏，想到的事态经过一定阶段终于实现
    formation: 副词，修饰动词
    constraints: []
    contrasts: []
  - pattern: お世話に なりました
    function_cn: 分别的寒暄语；受到别人照顾和帮助，分手时所说的表示感谢的话
    formation: 寒暄语⑥
    constraints: []
    contrasts: []
  - pattern: お世話になります／お世話になりました
    function_cn: 感谢对方关照／请求对方今后关照
    formation: 固定寒暄表达，过去式表已受关照，非过去式表今后将受关照
    constraints: []
    contrasts: []
  - pattern: ～に よろしく お伝え ください
    function_cn: 请向～问好／带个口信
    formation: 「よろしく 伝えて ください」的敬语形式；可前置「どうぞ」加强语气
    constraints:
    - 关系亲密、无需特别客套时可省略为「～に よろしく」
    contrasts: []
  - pattern: お元気で／お気を つけて／お大事に
    function_cn: 分别时祝愿对方（请多保重／路上小心／请多保重[病中]）
    formation: 固定分别用语；三者前均可加「どうぞ」加强语气
    constraints:
    - 「お元気で」用于时间较长的分离，对象须为健康状况良好者
    - 「お大事に」仅用于生病或受伤者
    - 「お気を つけて」用于一般性分别，祝对方路途平安
    contrasts:
    - お元気で vs お大事に：按对方健康状态区分
  - pattern: ～中（ちゅう）
    function_cn: 表示某个动作正在进行
    formation: 一类、二类动词用「ます形」去掉「ます」；三类动词用「ます形」去掉「します」
    constraints:
    - 三类动词「来ます」不能后续「中」
    - 并非所有一类、二类动词都可后续「中」
    contrasts: []
  pragmatics:
  - 「～と 思います」与「～と 思いました／思っています」在指称说话人本人或他人思考时的语用区分
  - 转述时是否用「名词＋に」明确听话对象
  - ～のです/～んです 与 ～んです 的书面/口语语体区分
  - “が”铺垫用法偏书面语
  - 日本人向别人陈述时尽量避免绝对性说法，用「～と 思います」缓和语气
  - 敬语与亲密语体的切换（よろしく お伝え ください vs ～に よろしく）
