  similar_contrasts:
  - それ系与あれ系在指代方向（后文 vs 上下文）上的区别
  - 意思相同的表达：～に先立ち（动词形）、～に先立つ（修饰名词）
  - 与主动句相比，被动句可使多小句的动作主体归一
  - 同义表达：～を通じて、～を通じた
  - 与表示时间段的 ～通して、～通じて 用法不同，需注意区分
  - 起きる 与 発生する 意思相同，可互换
  - 「合う」复合动词表示相互动作
  - 类似说法「～とともに～」
  - 与「～にしたがって」近义
  - 与“～といっても”比较：后者表示转折关系，意思是尽管在一定程度上可以认定，但实质是不同的。
  - 与表示列举的 ～にしろ 用法不同
