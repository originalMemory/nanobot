  communication_functions:
  - 比喻关系不合、努力落空、被拉开差距、场面安静、扫兴、套话引诱等惯用表达的功能说明
  grammar:
  - pattern: ～に恵まれた～
    function_cn: 表示幸运地获得很好的机会、才干、环境等（恵まれる为“恵む”的被动形式，含褒义）。
    formation: 句尾用“～に恵まれている”；名词前用“～に恵まれた～”。
    constraints: []
    contrasts: []
  - pattern: 湯水のように使う
    function_cn: 比喻毫不吝惜地挥霍，多与金钱搭配，相当于“挥金如土”。
    formation: 惯用句，常以“金銭を湯水のように使う”形式出现。
    constraints:
    - 基于日本水资源丰富、无干旱地带的前提。
    contrasts: []
  - pattern: 水に流す
    function_cn: 过去在人际关系方面产生的问题双方不再追究，相当于“既往不咎”。
    formation: 惯用句。
    constraints: []
    contrasts: []
  - pattern: ～にも～
    function_cn: 前接含疑问词的动词小句，表示疑问词所包含的所有场合后续部分都成立。
    formation: “にも”前的动词用基本形；也可在“にも”前加“の”构成同义形式。
    constraints: []
    contrasts: []
  - pattern: ～には～が必要だ
    function_cn: 表示目的，动词基本形后接「には」，句尾常与「～なければならない」「～たほうがいい」「～が必要だ」等表必要性的表达搭配；也可用「～のに」「～のには」形式（动词基本形后加「の」）。
    formation: 动词基本形＋には／のには＋必要・必要だ等
    constraints:
    - 「に」后不接「は」时，动词后的「の」不可省略
    - 「に」后接「は」时，动词后的「の」可省略
    contrasts:
    - 「～には」（无「は」）与「～のには」（有「は」）中「の」的省略规则不同
  - pattern: いかに～か
    function_cn: 书面语，相当于「如何に」，义为①如何②多么；表程度时与形容词或有形容词含义的表达搭配；作句中成分时用「いかに～か」形式。
    formation: いかに＋形容词/形容动词等＋か
    constraints:
    - 用于书面语
    contrasts: []
  - pattern: 先に述べた
    function_cn: 书面语，指代文章前文某部分，「述べる」意为叙述、陈述；同义可用「上に」「上で」「上述」「前述」；指代后文可用相应表达。
    formation: 先に＋述べる（た）
    constraints:
    - 用于书面语
    contrasts:
    - 指前文：先に／上に／上で／上述／前述
    - 指后文：另有对应表达
  - pattern: 仮に～とする
    function_cn: 表示假设、假定；句尾可用「頼んだとしよう」号召读者一起提出假设并思考
    formation: 动词た形＋とする；前多接动词た形
    constraints:
    - 有时可只用「～とする」
    - 本课句子可改成「仮に、…頼んだとする」
    contrasts: []
  - pattern: ～所以だ／～所以である
    function_cn: 书面语，表示理由；先陈述结果再说明理由
    formation: 小句（简体形式）＋所以は，～；或「～所以だ」「～所以である」
    constraints:
    - 最初为「これが～所以だ／である」的形式，但「これが」常被省略
    contrasts: []
  - pattern: 後に／先に述べた
    function_cn: 表示后面的陈述内容；口语中「先に述べた」要说成「先ほど言いました」「先ほど申しました」
    formation: 「述べる」主要用于书面语
    constraints:
    - 「述べる」一词主要用于书面语
    contrasts: []
  - pattern: ～を除くと、～
    function_cn: 表示“除去、排除”，多用于书面语，可直接连接名词
    formation: 名词 + を除くと
    constraints:
    - 书面语倾向
    - 与‘～を除く～’形式可互换连接名词
    contrasts: []
  - pattern: すなわち
    function_cn: 将名词替换为其他说法，相当于“即”“换言之”，较近书面语
    formation: 名词/句子 + すなわち + 同义替换
    constraints:
    - 书面语倾向
    contrasts:
    - 与‘つまり’相比更书面；‘つまり’可表‘总之’，‘すなわち’无此用法
  - pattern: 気を配る
    function_cn: 惯用语，对某方面加以“注意”“留心”
    formation: 気を配る / 気を配る + こと
    constraints:
    - 惯用表达
    contrasts: []
  - pattern: ～は言うに及ばず
    function_cn: 表示“不用说……”“慢说是……”，强调某事理所当然，进而引出更进一步的内容；可替换为“～は言うまでもなく”“～はもちろんのこと”“～はもちろん”等，其中“～は言うに及ばず”为最书面化的表达。
    formation: 名词／动词等＋は言うに及ばず
    constraints:
    - 书面语色彩较强
    contrasts:
    - ～は言うまでもなく
    - ～はもちろんのこと
    - ～はもちろん
  - pattern: ～てはならない
    function_cn: 表示禁止，可与“～てはいけない”互换，但“～てはならない”为书面语。
    formation: 动词て形＋はならない
    constraints:
    - 书面语
    contrasts:
    - ～てはいけない
  - pattern: 「水」を用いた慣用表現（関連語彙）
    function_cn: 以「水」为核心的惯用表达，用于比喻性格/关系完全相斥、努力或成果落空、被竞争对手拉开差距、场面骤然安静、扫兴泼冷水、用话套话引诱等交际功能。
    formation: 惯用短语，含「水臭い」「水と油」「水の泡」「水をあける」「水を打ったよう」「水を差す」「水を向ける」等固定搭配。
    constraints: []
    contrasts: []
