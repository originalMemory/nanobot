  communication_functions:
  - 转述听到的信息
  - 确认从对方那里听来的事情
  - 转达他人要求或问候（如代传问候、转达来访请求）
  - 询问对方是否方便（ご都合）
  - 向对方致歉/体谅其忙碌或劳累（～ところ）
  - 向对方坦白实情或令人意外的信息
  - 表达实际程度超出预期
  - 以铺垫方式提出请求或告知决定
  - 委婉请求对方做某事
  - 请对方做某事（请求）
