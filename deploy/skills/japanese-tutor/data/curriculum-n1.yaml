  - 电话中向对方汇报社长到访及次日返东京的行程
  grammar:
  - pattern: 尊敬语（敬语动词／お～になる／～ていらっしゃる／～ください／～ますか）
    function_cn: 对长辈、上级或客人表示尊敬，描述对方的动作或提出礼貌请求
    formation: 动词敬语形、お＋动词连用形＋になる／いらっしゃる、动词ます形＋ください／ますか
    constraints:
    - 用于抬高对方（周先生、お客様、先生、木村部长等）
    - 与谦让语区分，不可混用
    contrasts:
    - 谦让语（お～になる／～ていらっしゃる 用于降低自己一方）
  - pattern: 谦让语（お～になる／～ていらっしゃる）
    function_cn: 降低自己一方以表示对听话人的敬意
    formation: お＋动词连用形＋になる／いらっしゃる
    constraints:
    - 用于描述己方或己方相关者的动作
    contrasts:
    - 尊敬语
  - pattern: 敬语三分法
    function_cn: 对会话中涉及的人物或听话人表示敬意
    formation: 尊他语（抬高对方）、自谦语（压低己方）、礼貌语（～です／～ます）
    constraints: []
    contrasts: []
  - pattern: 尊他语使用对象
    function_cn: 对长辈或上级表示敬意
    formation: 语用规则：关系十分亲密时不用（如家人、向其他公司提及己方上级）；关系疏远时需用
    constraints:
    - 不用于自己家人
    - 向外部提及本公司上级时不用
    contrasts: []
  - pattern: 动词（ら）れます
    function_cn: 尊他语的一种，表对方动作
    formation: 将原句动词改为～（ら）れます，不改变句子成分位置及助词
    constraints:
    - 与被动句不同，仅替换动词形式
    contrasts:
    - 区别于被动用法（参见第41课）
  - pattern: お＋动词ます形去ます＋になります
    function_cn: 尊他语，表对方动作/状态
    formation: お＋一类动／二类动ます形去ます＋になります
    constraints:
    - 去ます后仅一个音节的词不可用（如見ます・寝ます・います）
    - 三类动词不可用
    contrasts: []
  - pattern: お＋动词ます形去ます＋ください／ご＋三类动汉字部分＋ください
    function_cn: 劝说听话人做有益于对方或公共利益的事
    formation: お＋一类动／二类动ます去ます＋ください；ご＋三类动汉字部分＋ください
    constraints:
    - 去ます后仅一个音节的动词不可用
    - 三类动词来ます・します不可用
    contrasts: []
  - pattern: お＋动词ます形（去ます）＋ください
    function_cn: 敬语请求（请对方做某事），用于一类、二类动词
    formation: ます形去掉「ます」后接「ください」，前加「お」
    constraints:
    - 适用于一类动词与二类动词
    contrasts: []
  - pattern: ご＋汉字动词连用形＋ください
    function_cn: 敬语请求，用于三类（サ变动词）动词
    formation: 取汉字部分（连用形）接「ください」，前加「ご」
    constraints:
    - 适用于三类动词
    contrasts: []
  - pattern: 尊他语特殊形式（見る→ご覧になる／食べる・飲む→召し上がる／行く・来る→いらっしゃる・おいでになる／する→なさる／言う→おっしゃる／くれる→くださる／～ている→～ていらっしゃる／～てくれる→～てくださる）
    function_cn: 表示对尊他动作的特殊敬语形式，含基本形、ます形、命令形三种
    formation: 每个基本动词对应固定的尊他表达，ます形与命令形按各自规则变化
    constraints:
    - 具有特殊形式的动词在表示尊他时优先使用特殊形式
    - 「いらっしゃる」「なさる」「おっしゃる」「くださる」的ます形与命令形变换方式特殊，需单独记忆
    contrasts:
    - 「～（ら）れます」表示较轻微敬意，其余两种表示较深敬意
    - 有特殊尊他形式的动词一般不用「お～になります」形式
    - 「食べる」「飲む」既可用特殊形式「召し上がります」也可用「お～になります」，特殊形式敬意更深
    - 「知っています」的尊他语为「ご存じです」
  - pattern: あっ，そう
    function_cn: 表示“原来如此/是吗”的随意应答，相当于「ああ，そうですか」的口语化说法
    formation: 独立寒暄/应答语
    constraints:
    - 仅限同辈之间，或对地位、年龄、身份比自己低的人使用
    contrasts:
    - 「ああ，そうですか」的较随便说法
  - pattern: ～じゃないか
    function_cn: 表确认、感叹或提议，语气比「ね」强烈
    formation: 接在形容词/动词/名词谓语句后
    constraints:
    - 多为男性上级对下级使用
    - 用降调，不能用升调
    contrasts:
    - 与「ね」语义相近但语气更强
  - pattern: ～ていらっしゃる
    function_cn: 「～ている」的尊敬语形式，亦为「～ていく」「～てくる」的尊敬形式
    formation: 动词て形＋いらっしゃる
    constraints:
    - 用于尊敬地描述对方的持续状态或移动
    contrasts:
    - 「～ています」的敬语对应
  - pattern: ～てくださって
    function_cn: 「～てくれて」的礼貌说法，含对对方施恩/欣赏表示感谢的含义
    formation: 动词て形＋くださって
    constraints:
    - 「～てくれます」「～てくださいます」须在受过对方恩惠并想致谢的语境下使用，否则不自然
    contrasts:
    - 「～てくれて」的礼貌/感谢对应
  - pattern: ～てくださいました / ～てくれました
    function_cn: 表达他人动作的语用区别：前者含感谢、感动语气，用于对方特别为自己做了本不必做的事；后者仅陈述对方为自己做了事，用于理所当然、无需特别感谢的场合（如朋友间互相招呼）。
    formation: 动词て形 + くださいました / てくれました
    constraints:
    - 语用选择取决于说话人是否感到对方行为超出预期、值得感谢
    - 对理所当然的互助行为使用「～てくれました」会显得不自然
    contrasts:
    - 「～てくださいました」强调感激；「～てくれました」中性陈述
  pragmatics:
  - 服务场景中对顾客的敬语使用
  - 职场中对上级（部长）的敬语转述
  - 尊他语用于关系疏远或对方为长辈上级
  - 亲密关系（家人、己方上级对外）避免使用尊他语
  - 敬语层级区分：请求敬语（お～ください／ご～ください）与尊他语（特殊形式）的敬意深浅不同
  - 对长辈、上司、客人等使用尊他特殊形式以示尊重
  - 「あっ，そう」与「～じゃないか」均受说话人与听话人地位/年龄/身份关系限制
  - 「～てくださって」类表达依赖“受过恩惠并致谢”的语用前提
  - 职场上下级与同辈之间打招呼/致谢的语用分寸
  - 商务接待中对社长使用尊敬语，对客户/同事使用礼貌体
  - 通过「～ましょうか」「～ましょうか」等委婉提议体现礼貌
