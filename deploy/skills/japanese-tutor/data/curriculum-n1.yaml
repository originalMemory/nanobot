  grammar:
  - pattern: 一向に～ない
    function_cn: 与否定形式一起使用，表示“完全（不）……”
    formation: 接在动词/形容词否定形式前
    constraints: []
    contrasts: []
  - pattern: 正直
    function_cn: 二类形容词，此处作副词使用，相当于“老实说”
    formation: 副词用法
    constraints: []
    contrasts: []
  - pattern: 頭が痛い
    function_cn: 除表示“头痛”外，惯用表示“因担心某事而烦恼”
    formation: 惯用形式
    constraints: []
    contrasts: []
  - pattern: 身体部位名词＋が＋形容词（惯用表达）
    function_cn: 用身体部位名词搭配形容词构成比喻性惯用表达，描述人的性格、能力、状态或事物的性质
    formation: 頭/顔/口/耳/鼻/腹/足 等名词 ＋ が ＋ 形容词（痛い・固い・低い・古い・広い・うまい・重い・軽い・早い・高い・大きい・黒い）
    constraints:
    - 为固定惯用搭配，不可随意替换部位名词或形容词
    - 部分表达兼有字面义与比喻义（如耳が痛い、足が早い）
    contrasts:
    - 口が重い（话少、不吐露心声）与 口が軽い（嘴快、易泄密）意义相反
    - 足が重い（行动不便、踌躇）与 足が早い（易变馊、行动快）语义方向不同
  - pattern: お＋名词（敬语前缀）
    function_cn: 用于名词前表示敬意
    formation: お ＋ 名词（如 お宅）
    constraints:
    - お宅 有两个义项：①尊称对方的家或家庭；②尊称对方所属的公司或组织
    contrasts:
    - 需根据语境区分指家庭还是指公司/组织
  - pattern: ～ならまだしも
    function_cn: 表示“前面的事项还能应付，后面的事项就难对付了”；用于列举递进、强调后项更难接受。
    formation: 名词＋ならまだしも／动词基本形＋ならまだしも
    constraints:
    - “なら”表示假定条件
    - 后项通常为否定或困难、不便的表达
    contrasts: []
  - pattern: と思うんです／～と思うんですが…
    function_cn: 表达自己的见解、想法或意见；比直接断言更委婉，避免给对方咄咄逼人的印象。
    formation: 动词／形容词等＋と思うんです；句尾可加“が”构成说半句话的形式
    constraints:
    - 多与表示理由或说明语气的“のです／んです”一起使用
    - 口语用“～と思うんです”的形式
    - 句尾加“が”时采用说半句话形式，语气更委婉
    contrasts:
    - 与断言形式“～と思います”“～と思うんです”相比，加“が”更委婉
  - pattern: この分だと、～／この分なら、～／この分では、～
    function_cn: 表示“这样下去的话……”的推测
    formation: 接于「この分」之后，后接结果句
    constraints:
    - 「この分だと」后接满意或不满意的结果均可
    - 「この分なら」后接好结果
    - 「この分では」后接不好结果
    contrasts:
    - 三个变体在结果褒贬上的限制不同
  - pattern: 敬体对话中混用简体
    function_cn: 表达自身判断或自言自语式内容时，敬体对话中可用简体而不失礼
    formation: 用于表达说话人自己判断的短句
    constraints:
    - 简体本用于自言自语，非针对对方；用于自身判断时可在敬体对话中出现
    contrasts: []
  - pattern: ひんやりする／ざらざらす（表示状态的拟态词）
    function_cn: 表示样子、状态：凉冰冰／表面不光滑
    formation: 用做动词的形式；表示物品状态可用「ざらざらだ」
    constraints:
    - 「ひんやり」类拟态词可用「ひんやりした」，但不能用「ひんやりだ」形式
    contrasts:
    - 「ざらざら」与「ひんやり」在「～だ」形式上的可用性差异
  - pattern: じっくり／たっぷり／びっしり
    function_cn: 副词，分别表示“踏踏实实、不慌不忙”“充分、满满当当”“密密麻麻、满满地”，用于修饰动作或状态的程度/方式。
    formation: 副词，直接修饰动词或形容词。
    constraints: []
    contrasts: []
  - pattern: なんだ
    function_cn: 用于事情超出自己的预想或期待时，表达意外或失望的感觉。
    formation: 感叹/语气表达，常独立使用或接在句末。
    constraints: []
    contrasts: []
  - pattern: ～っぱなしにする／～っぱなしだ
    function_cn: 表示动作结束后维持在该状态（含“维持原样不好”之意）；～っぱなしだ 还可表示该动作继续进行。
    formation: 动词ます形去掉“ます”＋っぱなしにする／っぱなしだ。
    constraints:
    - ～っぱなしにする 含“维持原样不好”的语感
    - ～っぱなしだ 除维持状态外还表示动作继续进行
    contrasts:
    - ～っぱなしにする（维持状态，多含负面）与 ～っぱなしだ（可表动作持续）的语义差别
  - pattern: ～ごと（容器ごと）
    function_cn: 接在名词后，表示“与该物一起”，强调两个对象为一体感较强的物品（如容器与其中所装之物）。
    formation: 名词＋ごと。
    constraints:
    - 一起的两个对象多为一体感较强的物品
    contrasts: []
  - pattern: ～まま
    function_cn: 表示某状态保持不变
    formation: 一类形容词＋まま；二类形容词＋な＋まま；动词た形／ない形＋まま；名词＋の＋まま
    constraints:
    - 与「～っぱなし」都表示动作结束后维持原样，但「～まま」不含『维持原样不好』的负面含义
    - 与「～たきり」在动作结束后保持该状态方面类似，但「～たきり」重点在于事件以该动作结束
    - 另有「～ままにする」「～ままになる」「～まま、～」「～ままで、～」「～ままだ」等形式
    contrasts:
    - ～っぱなし
    - ～たきり
  - pattern: べちゃっとした
    function_cn: 表示进水后软塌塌的状态
    formation: 拟态词「べちゃ」＋表示状态的「と」；也可说「べちゃべちゃした」；「べちゃ」可用「べちゃべちゃだ」作谓语
    constraints: []
    contrasts: []
  pragmatics:
  - 敬体/简体的选择取决于说话人与听话人的上下级关系及是否属于同一组织内部。
  - お宅 用于尊称对方，体现敬语语用规则
  - 用“～と思うんですが…”说半句话以避免咄咄逼人
  - 用“～ならまだしも”表达递进式的不满或困难
  - 敬体对话中表达自身判断时混用简体不失礼
