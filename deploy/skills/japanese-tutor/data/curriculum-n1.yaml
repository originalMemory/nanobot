  - 日常活动（吃饭、看电视、毕业、上班、打扫、洗车、看富士山、游泳、户外烧烤）
  - 交通与路线（バス、駅前、電車、道、公園）
  - 办公与学习（パソコン、雑誌、図書館、本）
