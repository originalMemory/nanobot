  jlpt_estimate:
    status: unverified
  communication_functions:
  - 自己紹介
  - 所属・役職の表明
  - 相手の日本語能力への称賛
  - 出身・留学経験の話題
  - 对初次见面的人做自我介绍的完整流程：寒暄→介绍工作单位与姓名→补充说明（职责、年资、姓名用字、来源）→结尾寒暄
  - 礼貌请求/拜托（自谦语层级区分）
  grammar:
  - pattern: はじめまして
    function_cn: 初次见面寒暄
    formation: 独立寒暄语
    constraints: []
    contrasts: []
  - pattern: ～と申します
    function_cn: 礼貌地报上姓名（自我介绍）
    formation: 名词（姓名）＋と申します
    constraints:
    - 是「～といいます」的礼貌说法
    - 不可说成「～と申し上げます」
    contrasts:
    - ～といいます（较普通）
    - ～と申し上げます（误用）
  - pattern: ～を担当させていただけます／～を担当しております
    function_cn: 谦让表达说明自己负责的工作内容
    formation: 动词ます形去ます＋させていただけます／＋しております
    constraints:
    - 用于自我介绍时说明职责的自谦表达
    contrasts: []
  - pattern: ～年目です／～年経ちました／～年になります
    function_cn: 表达入职/在籍年资
    formation: 数字＋年目です／数字＋年経ちました／数字＋年になります
    constraints:
    - 不说「～年間経ちました」
    contrasts:
    - ～年間経ちました（误用）
  - pattern: ～と読んでください
    function_cn: 请对方以某字/某方式称呼自己（说明汉字写法或称呼）
    formation: 汉字/称呼＋と読んでください
    constraints:
    - 用于名字用汉字书写时说明用字，或请求特定称呼
    contrasts: []
  - pattern: よろしくお願いします／これからお世話になります
    function_cn: 自我介绍结尾的寒暄（请多关照/往后请多费心）
    formation: 独立寒暄语
    constraints: []
    contrasts: []
  - pattern: ～を含めて
    function_cn: 表示“包括～在内＋数量词”；与「～ほか」相对，前者含本数、后者另加本数。
    formation: 名词＋を含めて＋数量词
    constraints:
    - 用于人数/物数等可数量化对象
    - 注意与「ほか」的含/加区别
    contrasts:
    - ～を含めて（含）
    - ～ほか（另加）
  - pattern: ～名
    function_cn: 表示人数的量词，与「人」同义同功能，但语体较庄重，多用于正式场合（书面/口语皆可）。
    formation: 数量词＋名
    constraints:
    - 仅用于人
    - 语体正式
    contrasts:
    - 人（普通）
    - 名（庄重）
  - pattern: 主に / 主な / 主として
    function_cn: 二类形容词，意为“主要（的）”；动词前用「主に」，名词前用「主な」；「主として」表“主要”但不能接名词。
    formation: 动词前：主に；名词前：主な；「主として」后接动词
    constraints:
    - 「主として」不可修饰名词
    - 「主として」读作「おもにとして」，不读「もととして」
    contrasts:
    - 主に（接动词）
    - 主な（接名词）
    - 主として（接动词，不可接名词）
  - pattern: よろしくお願いいたします
    function_cn: 比「よろしくお願いします」更礼貌的自谦说法；「いたします」为「します」的自谦语。
    formation: 名词＋を＋お願いいたします
    constraints:
    - 语体比「よろしくお願いします」更郑重
    - 更礼貌变体：「お願い申し上げます」
    contrasts:
    - よろしくお願いします（较普通）
    - よろしくお願いいたします（更礼貌）
    - お願い申し上げます（最礼貌）
  - pattern: ～にとって、～
    function_cn: 接表示人或国家/组织的名词后，表示“从～立场来看，～”。
    formation: 名词（人/国家/组织）＋にとって＋句子
    constraints:
    - 前接表示立场主体的名词
    contrasts: []
  - pattern: ～として
    function_cn: 站在同一角度，表示“处于～的立场”“属于～范畴”；可用于人以外的事物；用于与人有关的场合时主要接在表示职务、工作、性别等名词后面；后续名词时需要加“の”。
    formation: 名词＋として
    constraints:
    - 用于人时多接职务/工作/性别类名词
    - 后接名词时需加「の」
    contrasts:
    - 与表示观点的「～にとって」不同
  - pattern: ～としては
    function_cn: 前接表示人物或组织的名词，表示“从该角度考虑”；用「わたしとしては」代替「わたしは」时强调自己的立场、态度，表示“作为我来说”的意思。
    formation: 名词（人物/组织）＋としては
    constraints:
    - 前接人物或组织名词
    contrasts:
    - 「わたしとしては」强调立场，区别于「わたしは」
  - pattern: ～にしたら／～にしてみれば／～にすれば
    function_cn: 前接表示人的名词，表示“对于该人來說”的意思，即表示从那人的角度考虑，结果会有所不同。
    formation: 名词（人）＋にしたら／にしてみれば／にすれば
    constraints:
    - 前接人的名词
    contrasts: []
  - pattern: ～が、～／～けど、～
    function_cn: 不仅表转折，也可作无转折义的单纯铺垫；～けど 仅用于口语，不用于书面语。
    formation: 接续于句末，后接另一分句。
    constraints:
    - ～けど 限于口语
    contrasts:
    - 与表转折的用法区分：本条强调无转折义的铺垫用法
  - pattern: 今でも
    function_cn: 表示过去发生的事情现在仍然存在，一般接 ～ます；可表即时性情形，不表某期间。
    formation: 今でも＋～ます
    constraints:
    - 不表示某个期间
    contrasts:
    - 今も 与 今でも 同义，但 今も 稍正式
  - pattern: 現在でも／現在も
    function_cn: 与 今でも、今も 意思相同，但属书面语。
    formation: 現在でも／現在も＋～
    constraints:
    - 书面语
    contrasts:
    - 与 今でも、今も 的语体差异
  - pattern: 今まで～
    function_cn: 表示从过去到“现在”为止的期间，常接 ～ました 提及过去的事情；与“今も～ています”对应时，含“现在已经不再～”之意。
    formation: 今まで＋～ました
    constraints:
    - 通常与过去式 ～ました 搭配
    contrasts:
    - 与 今も～ています 的语义差异（是否包含“现已停止”）
  - pattern: 多くの（一类形容词「多い」修饰人）
    function_cn: 表示人多时，须用「多くの」修饰名词，不可用「多い人」；同类词尾「い」变「く」加「の」（如「遠い→遠くの」「近い→近くの」），「少ない」保持原形，其余一类形容词直接接名词。
    formation: 一类形容词词干/词尾变化 + の + 名词
    constraints:
    - 「多い」修饰人时禁用「多い人」，应用「多くの」
    - 「少ない」不变为「少く」，直接接「の」
    contrasts: []
  - pattern: ～場合（は）
    function_cn: 表示状况、情况或事态，接小句末起连接前后句功能；「～場合（は）」可表假定条件，语义同「～ば、～」，属较正式表达；「場合」亦可作名词单独使用（如「場合によっては～」）。
    formation: 名词+の場合 / 二类形容词+な場合 / 小句（简体形式）+場合
    constraints:
    - 接小句时小句用简体形式
    - 表假定条件时语气较正式
    contrasts:
    - 与「～ば、～」语义相同但更正式
  - pattern: ～わけにはいきません
    function_cn: 表示依据社会常识或经验来看是不可能的事情，强调该行为非自己所能选择；否定形式同理。
    formation: 动词（基本形／ない形）+ わけにはいきません
    constraints:
    - 强调主观上不能选择、不应做，而非能力缺失
    contrasts:
    - 与「～することができない」（没有……的能力）不同
  - pattern: ～ないわけにはいきません
    function_cn: 表示必然的义务、不能不做某事
    formation: 动词否定形（ない）＋わけにはいきません
    constraints:
    - 不能接过去式
    - 与～わけにもいきません相比，否定语气较强
    contrasts:
    - ～わけにもいきません：语气较弱，含‘可以考虑选择……但常识上那样做很困难’之意，同样不能接过去式
  - pattern: ～ためです / ～ため（倒装句）
    function_cn: 说明原因或理由，将原因部分置于谓语位置以强调原因
    formation: 原因小句＋ためです（倒装）；或 原因小句＋ため＋结果小句（正常语序）
    constraints:
    - 倒装句（～ためです）重点在原因；正常语序（～ため）重点在结果
    - 两种语序意思几乎相同，仅侧重点不同
    contrasts:
    - 倒装句 vs 正常语序：侧重点（原因 vs 结果）不同
  - pattern: ～といわれています / ～と考えられています
    function_cn: 陈述人们对某事普遍持有的看法或普遍常识，非说话人主观判断
    formation: 小句（简体形式）＋といわれています / 小句（简体形式）＋と考えられています
    constraints:
    - 前接小句简体形式
    - 表示普遍常识而非个人主观判断
    contrasts: []
  - pattern: 約～／ほぼ～／だいたい～／～程度／～ほど／～ぐらい
    function_cn: 概数表达，表示大约、左右
    formation: 「約～」「ほぼ～」「だいたい～」后接数量词；「～程度」「～ほど」「～ぐらい」前接数量词；可组合如「だいたい～ほど」
    constraints: []
    contrasts: []
  - pattern: ～以上／～以下
    function_cn: 表示大于（含）或小于（含）该数值的范围
    formation: 「～以上」含该数值；「～以下」含该数值
    constraints: []
    contrasts:
    - 「～以上」与「～以下」均含本数
  - pattern: ～近く／～を超える／～を上回る／～を下回る
    function_cn: 表示比基数或预想值大或小
    formation: 「～近く」表示未达但接近该数值；「～を超える」表示超过；「～を上回る」与「～を超える」同义；「～を下回る」与「～を超える」相反
    constraints: []
    contrasts:
    - 「～を上回る」≈「～を超える」
    - 「～を下回る」与「～を超える」相反
  - pattern: それでも
    function_cn: 连词，表示暂且认可前句内容后陈述与前句不相符的情况，相当于汉语「尽管如此」「即使那样」
    formation: 接于句末，后接转折性陈述
    constraints: []
    contrasts: []
  - pattern: 一方、～
    function_cn: 用于句首，表示所述内容与前述内容构成对立或对比关系
    formation: 置于句首，后接完整分句，与前后文形成对照
    constraints:
    - 用于句首
    - 前后内容需存在对立或对比关系
    contrasts: []
  pragmatics:
  - はじめての挨拶（はじめまして）
  - 丁寧語（いたします／お願いいたします／お願いいたします）
  - 自我介绍时常用自谦表达方式（参见初级第48课），如用「～と申します」代替「～といいます」，用「～を担当させていただけます」「～を担当しております」等谦让说法
  - 「名」与「人」的语体庄重度差异
  - 「いたします／申し上げます」的自谦层级
