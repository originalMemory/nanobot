  grammar:
  - pattern: ～てもいいですか／～てもよろしいですか
    function_cn: 用许可表达的疑问形式请求许可；更礼貌可用～てもよろしいでしょうか
    formation: 动词て形＋もいい／よろしい＋ですか／でしょうか
    constraints:
    - 表示请求许可的疑问形式
    contrasts: []
  - pattern: ～てもかまいませんか／～ても大丈夫ですか
    function_cn: 通过确认是否容许对方被打扰来表达请求许可
    formation: 动词て形＋もかまいませんか／大丈夫ですか
    constraints:
    - 用于向对方确认是否容许别人打扰
    contrasts: []
  - pattern: ～できますか／～られますか
    function_cn: 用动词可能形式表示请求许可，描述说话人行为，询问当时情况是否许可
    formation: 动词可能形＋ですか
    constraints:
    - 一般用于当时情况是否许可
    contrasts: []
  - pattern: ～たいのですが／～たいと思うのですが
    function_cn: 省略「いいですか」，以中断句子形式委婉请求许可，常用于难以开口的事
    formation: 动词たい形＋のですが／たいと思うのですが
    constraints:
    - 比较委婉的请求方式
    contrasts: []
  - pattern: 回应请求许可
    function_cn: 回应请求时不用「～てもいいです」，而用「どうぞ」「もちろん」等表达方式
    formation: 固定回应语
    constraints:
    - 避免用～てもいいです作肯定回应
    contrasts: []
  - pattern: ～てもいいですか／～てもいいでしょうか
    function_cn: 请求许可、征求对方同意
    formation: 动词て形＋も＋いい＋ですか／でしょうか
    constraints:
    - 用于向对方请求做某事的许可
    - 「～てもいいでしょうか」比「～てもいいですか」更委婉
    contrasts: []
  - pattern: 回绝请求的语用结构
    function_cn: 拒绝对方请求时先表示歉意（すみません／ごめんなさい），再陈述理由，委婉拒绝
    formation: 道歉语＋理由（～ので／～ので…）
    constraints:
    - 需先道歉后说明理由，避免直接否定
    contrasts: []
  - pattern: 落ち着く
    function_cn: 动词，意为“稳定”“变得平静”，本用于心情，也可描述事物
    formation: 动词，可接「～てきた」表示变化过程
    constraints:
    - 既可指心情安定，也可指事物（如地震摇晃）平息
    contrasts: []
  - pattern: お疲れ様です／ご苦労様です／お先に失礼します
    function_cn: 下班问候语与先走时的致意
    formation: 固定寒暄语
    constraints:
    - 「お疲れ様です」用于同事或地位较低者，对上级使用存在礼貌争议
    - 「ご苦労様です」对上级使用仍给人不礼貌感，最好避免
    - 「お先に失礼します」用于自己先下班时对仍留在公司的人
    contrasts:
    - 「お疲れ様です」与「ご苦労様です」在对上级使用时的礼貌度差异
  - pattern: どうしてここが…?
    function_cn: 表达惊讶、因惊讶而说不出完整话
    formation: 「どうしてここが分かったんですか」省略后半部分
    constraints:
    - 省略式比完整问句更突出惊讶情绪
    - 完整形式「どうしてここが分かったんですか」为普通询问理由
    contrasts:
    - 省略式（惊讶）与完整问句（普通询问理由）的语用差异
  - pattern: ～て仕方がない
    function_cn: 表示感情、感觉自然产生、无法控制，强调程度之甚
    formation: 动词/一类形容词（て形）+仕方がない；二类形容词+で仕方がない
    constraints:
    - 口语中可用～てしょうがない
    - 可重复前部以加强语气
    contrasts: []
  - pattern: ～ところではない
    function_cn: 表示强烈否定，或表示没有空余做某事
    formation: 动词（基本形）/一类形容词/二类形容词/名词+ところではない
    constraints:
    - 前接形容词时表强烈否定
    - 口语中用较随便的说法～ところじゃない
    contrasts: []
  - pattern: ～なりに
    function_cn: 表示“站在～的立场上”
    formation: 名词（表示人的名词）+なりに
    constraints:
    - 常用～は（も）～なりの表达方式
    contrasts: []
  - pattern: ～でしかない
    function_cn: 强调时间或数量极少，或强调不完全具备某种性质、几乎没有价值
    formation: 名词 + でしかない
    constraints:
    - 用于名词后，表示程度低、数量少或性质不完全具备
    contrasts: []
  - pattern: ～おそれがある
    function_cn: 表示不希望发生的事情、不好的事情有可能出现（客观推测）
    formation: 动词基本形＋おそれがある；名词＋のおそれがある
    constraints:
    - 修饰名词时助词「が」变为「の」
    - 与「～かもしれない」（主观推测）区分
    - 与「～かねない」对比：后者更明确表达情况会变糟的主观感受，且需有明确依据
    contrasts:
    - ～かもしれない
    - ～かねない
  - pattern: ～のみ
    function_cn: 表示限定，意思与「だけ」相同，但更多用于书面语
    formation: 小句（简体形式）＋のみ；名词＋のみ
    constraints:
    - 书面语倾向强于「だけ」
    contrasts:
    - ～だけ
  - pattern: ～に至る
    function_cn: 表示达到、到达某地点、时刻或状况，用于书面语
    formation: 小句（简体形式）＋に至る；名词＋に至る
    constraints:
    - 「名词＋に至る」中的名词只能是动作性名词（三类动词的汉字部分）
    - 用助词「に」表示到达的时刻或地点、状况
    - 与表示列举最后一项的「～に至るまで」用法不同
    contrasts:
    - ～に至るまで
  - pattern: ～かたわら
    function_cn: 表示主要活动与次要行为同时进行
    formation: 动词基本形＋かたわら；名词＋のかたわら
    constraints:
    - A 为职业或本职等主要活动，B 为次要行为
    contrasts: []
  - pattern: 募る
    function_cn: 募集、广泛征集，书面语，用于唤起大众善意以招募人力、财力
    formation: 他动词
    constraints:
    - 不能用于单纯地整理或收集物品
    contrasts:
    - 集める（单纯收集）
  - pattern: ～時点で
    function_cn: 以某一时间点将时间区间隔开，表示截取该时间点观察状况
    formation: 名词（时间）＋時点で
    constraints:
    - 强调以该点为界观察前后，区别于单纯表示某天的时间词
    contrasts:
    - 昨日（单纯表示今天之前的日子）
  - pattern: 試みる
    function_cn: 尝试做、试着做；较为郑重的说法，多用于书面语。
    formation: 动词性表达，可接在动作描述之后表示尝试。
    constraints:
    - 语体偏书面、郑重。
    contrasts: []
  - pattern: ～に終わる
    function_cn: 表示某事件的结果事与愿违、以某种消极结果告终；含猜测意味，暗示该失败或许并非执行者本意。
    formation: 助词「に」前接消极意义名词，如失败、破産、不調等。
    constraints:
    - 前接名词须为消极/负面结果义。
    contrasts:
    - 与「失敗した」意思相近，但「～に終わる」带推测、非本意的语感。
  - pattern: ～をもって
    function_cn: ①时间名词+をもって：表示成为事件分水岭的时间，常用于某种状态结束的时间；②也可表示事情的开始（同时含现在的工作/状态到该日结束之意）；③还可表示工具或手段。
    formation: 名词（时间名词或工具/手段名词）+ をもって。
    constraints:
    - 用于时间时强调分界/结束或开始；用于工具手段时表凭借。
    contrasts: []
  - pattern: 救いの手を差し伸べる
    function_cn: 惯用表达，表示向某人伸出援助之手、给予帮助
    formation: Aに＋救いの手を差し伸べる
    constraints: []
    contrasts: []
  - pattern: ～に際して
    function_cn: 表示某事的起始时刻或进行过程中的某时刻，书面语；感谢信、正式演讲等场合常用敬体形式～に際しまして
    formation: 动作性名词（三类动词的汉字部分）＋に際して
    constraints:
    - 书面语
    - 正式/感谢场合倾向用～に際しまして
    contrasts: []
