  grammar:
  - pattern: AはBです
    function_cn: 判断/断定：说明身份、国籍、职业等（肯定形式）
    formation: 名词/名词短语 + です
    constraints:
    - 用于礼貌体（です・ます体）
    - 主语由助词「は」提示
    contrasts:
    - 与否定形「ではありません」、疑问形「ですか」对应
  - pattern: AはBではありません
    function_cn: 否定判断：说明某人不属于某身份/类别
    formation: 名词 + ではありません
    constraints:
    - 礼貌体否定
    contrasts:
    - 与肯定「です」、疑问「ですか」对应
  - pattern: AはBですか
    function_cn: 疑问判断：询问身份、国籍、职业等
    formation: 名词 + ですか
    constraints:
    - 礼貌体疑问
    contrasts:
    - 应答可用「はい、そうです」或「いいえ、違います」
  - pattern: 所属/修饰：NのN
    function_cn: 用「の」连接表示所属或限定（如某公司的职员）
    formation: 名词 + の + 名词
    constraints:
    - 用于表达组织与成员关系等
    contrasts: []
  - pattern: 称呼：～さん
    function_cn: 对他人姓氏/名字加「さん」表示礼貌称呼
    formation: 姓名 + さん
    constraints:
    - 用于称呼对方或第三人
    contrasts: []
  - pattern: 应答：はい、そうです／いいえ、違います
    function_cn: 对判断疑问的肯定/否定应答，否定后可补充正确信息
    formation: 固定应答短语
    constraints:
    - 「そうです」表认同，「違います」表否定并常接更正
    contrasts: []
  - pattern: 名詞＋は＋名詞＋です
    function_cn: 判断句肯定形式，表示“～是～”；助词「は」提示主题，读作“わ”
    formation: 名词＋は＋名词＋です
    constraints:
    - 「は」用于提示主题
    - 「です」为谓语部分
    contrasts: []
  - pattern: 名詞＋は＋名詞＋ではありません
    function_cn: 判断句否定形式，表示“～不是～”
    formation: 名词＋は＋名词＋ではありません
    constraints:
    - 口语中「では」有时发成「じゃ」
    contrasts: []
  - pattern: 名詞＋は＋名詞＋ですか
    function_cn: 疑问句，表示“～是～吗？”；助词「か」接句尾表疑问，句尾不用问号；回答用「はい」或「いいえ」
    formation: 名词＋は＋名词＋ですか
    constraints:
    - 日语问句句尾不使用“?”
    - 应答可仅用「はい」「いいえ」，或在「はい」后加「そうです」、在「いいえ」后加「ちがいます」
    - 不知道时用「分かりません」
    contrasts: []
  - pattern: 名詞＋の＋名詞
    function_cn: 助词「の」连接两个名词，表示前面名词是后面名词从属的机构、国家或属性
    formation: 名词＋の＋名词
    constraints:
    - 用于表示从属机构、国家或属性关系
    contrasts: []
  - pattern: 人称代词「わたし」「あなた」「あの 人」
    function_cn: 第一、第二、第三人称指代；「あなた」使用受限，仅在不知对方姓名又必须招呼时使用，否则易显不礼貌
    formation: 独立代词，作主语或宾语
    constraints:
    - 「あなた」不宜随意用于称呼对方
    contrasts:
    - 「わたし」第一人称 / 「あなた」第二人称 / 「あの 人」第三人称
  - pattern: 敬称「～さん」
    function_cn: 称呼他人时的礼貌后缀；可用「姓＋さん」替代「あなた」；职业/职务称呼（如「課長」「店員さん」）
    formation: 接于他人姓名或职业/职务名词后
    constraints:
    - 只用于他人姓名后，不用于自己姓名后
    - 「先生」意为“老师”，不可代替「さん」
    contrasts:
    - 小孩名字后加「～ちゃん」
    - 同龄或较年轻男性可用「～君」
  - pattern: 第一、第二人称主语的省略
    function_cn: 日语常省略场景或上下文可推断的成分，使表达更自然、礼貌
    formation: 会话中第一、第二人称主语多省略
    constraints:
    - 省略成分与汉语不尽相同，需注意
    contrasts: []
  - pattern: あっ
    function_cn: 叹词，表示吃惊或有所感触时发出的声音；紧急情况下情不自禁发出，自言自语时也用
    formation: 独立感叹词，后接称呼或道歉语（如「すみません」）
    constraints: []
    contrasts: []
  - pattern: どうぞ よろしく お願いします
    function_cn: 寒暄语，自我介绍（姓名或公司名称）后使用，相当于汉语“请多关照”；对方一般以「こちらこそ」回应
    formation: 接在「はじめまして、～です」之后；可省略为「どうぞ よろしく」或「よろしく お願いします」；将「お願いします」换成「お願いいたします」更礼貌
    constraints:
    - 「どうぞ よろしく お願いします」为较礼貌说法
    contrasts:
    - 「お願いします」与「お願いいたします」的礼貌度差异
  - pattern: 会社員 / 社員
    function_cn: 词汇辨析：「会社員」表示职业“公司职员/在公司工作的人”；「社員」仅表示具体属于某一个公司的人，需在所属公司较明确的句中使用
    formation: 「社員」前常接公司名（如「ＪＣ企画の社員」）
    constraints:
    - 「社員」单独使用指代具体公司成员
    contrasts:
    - 「会社員」（职业）与「社員」（具体公司成员）的语义范围差异
  pragmatics:
  - 使用「です」体保持礼貌
  - 用「～さん」进行礼貌称呼
  - 否定应答时补充正确信息以澄清
  - 「は」提示主题
  - 口语中「では」→「じゃ」的音变
  - 「あなた」直呼易显不礼貌，宜用「姓＋さん」
  - 「さん」不用于自称
  - 「先生」与「さん」功能不同，不可混用
  - 寒暄语礼貌度层级（お願いします → お願いいたします）
  - 对方回应惯例「こちらこそ」
  - 称呼规则：使用对方姓氏+さん
  - 敬语层级：です/ます体
