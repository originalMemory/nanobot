  grammar:
  - pattern: 自动词和他动词的对应关系
    function_cn: 说明词形上成对的自、他动词的接续对应规律
    formation: 自动词词尾“aru”↔他动词词尾“eru”；自动词词尾“eru/ru”↔他动词词尾“su”；另有不规则对应及极少数完全同形
    constraints:
    - 两类主要对应：aru/eru 与 eru(·ru)/su
    - 存在不规则对应（如割/付类）
    - 极少数自他同形（如“关闭”义动词）
    contrasts:
    - 自动词表自身变化/状态，他动词表使动/施加动作
  - pattern: 自动词＋ています（结果状态）
    function_cn: 表示变化完成后所形成的结果存续状态
    formation: 表示变化的自动词＋て形＋います
    constraints:
    - 用于表示变化的自动词时表结果存续
    - 用于表示动作的自动词时表动作正在进行
    contrasts:
    - 与“自动词た形”对比：た形偏重变化完成，～ています偏重变化完成后的结果状态
  - pattern: 动词て形＋しまいます
    function_cn: 表示动作所产生的结果令人不愉快；有时仅表示动作的完成（此时动作一般为有意进行）
    formation: 动词て形＋しまいます
    constraints:
    - 用于不愉快结果时强调意外或遗憾
    - 用于完成义时动作多为有意进行
    contrasts: []
  - pattern: 动词／形容词そうです②
    function_cn: 描述说话人对事物样态的观感，或根据情形推测事态发展（样态／推测）
    formation: 动词ます形去ます加そうです；一类形容词去词尾い加そうです；二类形容词＋そうです
    constraints:
    - 否定：前接形容词用～そうではありません；前接动词用～そうにありません
    - 前接ない用なさそうです，前接いい用よさそうです
    - 用于名词前用～そうな，用于动词前用～そうに
    contrasts:
    - 与表示传闻的そうです（动词た形／形容词＋そうです）区分，本页为样态／推测用法
  - pattern: 自动词 vs 他动词（语用选择）
    function_cn: 根据是否关注动作主体或强调结果/状态变化来选择自动词或他动词；自动词侧重状态变化或既定结果，他动词侧重动作执行者。
    formation: 同一语义场存在自动词/他动词对（如 建つ/建てる、決まる/決める、始まる/始める）。
    constraints:
    - 仅描述客观状态变化或结果、不强调主体时用自动词
    - 强调动作执行者或自己主导决策时用他动词
    - 非主持/非主导场合误用他动词会显得以自我为中心、不恰当
    contrasts:
    - 自动词强调‘已经定下来/开始了’的结果，他动词促使听话人意识到决定/开始主体
  - pattern: ～かしら
    function_cn: 表示疑问的简体助词，语义近于～かな，多为女性使用；无听话人时为自言自语吐露内心疑问，有听话人时向对方发问。
    formation: 接在疑问句末尾（形容词/动词/名词疑问形式后）。
    constraints:
    - 语体偏女性、口语
    - 可作自言自语或向对方发问两种用法
    contrasts:
    - 与～かな语义相近，但～かしら多为女性使用
  - pattern: それにしても
    function_cn: 用于尽管认可作为前提的某种状况或事项，但说话人仍有另外感觉或认识，表让步后的感叹/转折。
    formation: 接在陈述句后，独立成句或连接后续感叹。
    constraints:
    - 前提状况被说话人认可，但后续仍表达超出预期的感受
    contrasts: []
  - pattern: お久しぶです
    function_cn: 寒暄语，重逢打招呼/应答
    formation: 由「久しぶりです」前加表礼貌的「お」构成
    constraints:
    - 比完整形「お久しぶりです」更随意，但因含「お」不显粗鲁，带亲切感
    - 用于熟人重逢时一方打招呼、另一方省略「です」的应答场景
    contrasts:
    - 与「お久しぶりです」相比语感更亲切、略随意
  - pattern: 相変わらずですね
    function_cn: 表示对方情况/样子没有变化
    formation: 短语「相変わらず」（情况没有变化）+「ですね」
    constraints:
    - 用于重逢时评价对方依旧如故
    contrasts: []
  - pattern: お元気そうで、何よりです
    function_cn: 寒暄语，称赞对方气色好、比什么都好
    formation: 「お元気そうです」（元気そうです的礼貌形）+「何よりです」（何よりいいことです的省略）
    constraints:
    - 内含一直惦记对方健康状况的语感
    - 用于朋友、熟人相隔一段时间后再会
    - 对初次见面的人不能使用
    contrasts: []
  pragmatics:
  - 自动词/他动词选择体现说话人对主体与结果的视角
  - ～かしら体现女性语体与自言自语/发问的语用区分
  - 礼貌前缀「お」使省略形不显粗鲁
  - 寒暄语的使用对象限制（熟人 vs 初次见面）
  - 使用「お久しぶりです」「相変わらずですね」等寒暄表达
  - 对迟到使用「すみません」「遅刻してしまいました」致歉
