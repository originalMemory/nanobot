  jlpt_estimate:
    status: unverified
  communication_functions: []
  grammar:
  - pattern: ～と題する
    function_cn: 以……为标题；标题为……的
    formation: サ变动词，惯用表达「～と題する」「～と題した」
    constraints:
    - サ变动词中多为双汉字名词词干，但「題する」为单汉字词
    contrasts:
    - 「達する」「察する」「適する」「接する」等同为单汉字サ变动词
  - pattern: ～を務める
    function_cn: 承担某项职务；担当某个角色
    formation: 多用「～を務める」的形式
    constraints: []
    contrasts: []
  - pattern: ～や（否や）
    function_cn: 表示“一……立刻”“与……同时”；“～と知るや”表示“知道……后立刻”
    formation: 多接动词基本形＋や（否や）
    constraints:
    - 与“～や否や”同义
    contrasts: []
  - pattern: なんの～も～
    function_cn: 强调否定，表示“毫无……”
    formation: なんの＋名词＋も＋ない（“なんの”亦写作“何の”）
    constraints: []
    contrasts: []
  - pattern: ～ほかない／～ほかはない
    function_cn: 表示“除了……没有别的办法”
    formation: 前接动词基本形
    constraints: []
    contrasts: []
  - pattern: 値が張る
    function_cn: 表示比一般价格高，本用于买东西；修饰名词时“が”可换“の”成为“値の張る”
    formation: 动词性表达，可作修饰语
    constraints: []
    contrasts:
    - “値段が高い”表示客观上金额高
  - pattern: 値が張る／値が張らない
    function_cn: 表示价格贵；不仅依据金额，也用于从个人价值观出发觉得贵的情形
    formation: 多用「値が張る」「値が張らない」形式
    constraints: []
    contrasts: []
  - pattern: 花の＋处所／花の＋机构
    function_cn: 「花の＋处所」为固定搭配，指繁华场所而非真正的花；「花の＋机构」指女性多的艳丽科室或才俊聚集而醒目的科室
    formation: 「花の」+ 名词（处所/机构）
    constraints: []
    contrasts:
    - 带「花」的相关表达：「花が咲く」「花も実もある（有名有实）」「花を持たせる（给某人脸上增光）」「花より団子（舍华求实）」
  - pattern: わりに
    function_cn: 副词，口语，表示程度稍微超过预想；与「わりと」同义；书面语用「比較的」
    formation: 「动词/一类形容词（简体形式）+わりに」「二类形容词+な+わりに」「名词+の+わりに」
    constraints:
    - 表示某事物具有某种性质，但却与预想相反
    - 此种情况下不用「～わりと」的形式
    contrasts:
    - 「わりと」同义
    - 书面语对应「比較的」
  - pattern: 客がある
    function_cn: 「ある」一般表示物体存在；表示人或动物时用「客がある」等表达（本页内容截断）
    formation: 名词（人/动物）+ がある
    constraints: []
    contrasts: []
  - pattern: こうして
    function_cn: 用于承接前项、叙述后项，多用于讲故事或回忆时作归纳。
    formation: 独立副词性用法，置于后句之前。
    constraints: []
    contrasts: []
  - pattern: ～ことか
    function_cn: 表示感动或感叹。
    formation: 小句（简体形式）＋ことか；多与“どんなに”搭配使用。
    constraints: []
    contrasts:
    - 同义表达方式“～ことでしょう”“～ことだろう”。
  - pattern: 気取る
    function_cn: 表示从周围的气氛察觉情况；主要用作书面语。
    formation: 读作“けとる”；一般多用被动形式“気取られる”。
    constraints:
    - “気取られぬ”是“気取られる”加表示否定的“ぬ”构成，可用“気取られない”替换。
    - “気取られぬよう”表示不被察觉的意思。
    contrasts: []
  - pattern: ～のゆえに
    function_cn: 表示理由、缘由（由于……/因为……），书面语
    formation: 名词/二类形容词＋のゆえに；动词/一类形容词（简体形式）＋ゆえに；动词/一类形容词（简体形式）＋がゆえに
    constraints:
    - 可与～ために互换，但～ゆえに较古典，多用于书面语
    contrasts:
    - ～ために
  - pattern: いや、そればかりではない
    function_cn: 先否定自己前面刚说的话，紧接着补充前面所讲的内容（不，不仅如此）
    formation: いや＋そればかりではない
    constraints: []
    contrasts: []
