  similar_contrasts:
  - 与现在时「～い」相对
  - 与口语否定「～じゃない」语体不同
  - 与「～ましょうか」的礼貌提议不同
  - 与「ので」相比语气更直接
  - 与「とても」程度方向相反
  - 与「～ではない」语体不同
  - 动词与形容词/名词在敬体/简体区分上的差异
  - 敬体 ます/ません/ました/ませんでした 与 简体 基本形/ない形/た形/なかった形 的对应
  - 一类形容词敬体 いです/くないです/かったです/くなかったです 与 简体 い/くない/かった/くなかった 的对应
  - 与一类形容词不同，二类形容词简体肯定形可加「だ」
  - 名词与二类形容词简体形规则一致，均可加「だ」
  - 既可表转折，也可表铺垫（不表转折）
  - 二类形容词、名词简体肯定形可加「だ」，一类形容词不可
  - 敬体 vs 简体
  - 敬体疑问（～ですか／～ますか）vs 简体疑问
  - “はい／いいえ” vs “うん／ううん”
  - “かな” vs “の”（后者用于要求说明或确认）
  - “の” vs “かな”
  - 「わ」与「よ」的性别语用差异
