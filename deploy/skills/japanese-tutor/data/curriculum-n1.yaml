  grammar:
  - pattern: ～はどこですか。／～は～ですか。
    function_cn: 询问地点或确认场所类型（如邮局、银行、百货商店）
    formation: 名词＋は＋どこ／名词＋ですか
    constraints: []
    contrasts: []
  - pattern: ～は～の～階です。
    function_cn: 说明某设施位于某建筑的某一层
    formation: 名词＋は＋名词＋の＋数字＋階＋です
    constraints: []
    contrasts: []
  - pattern: ～は～階ですか、～階ですか。
    function_cn: 在两个楼层选项之间进行确认提问
    formation: 名词＋は＋数字＋階＋ですか、数字＋階＋ですか
    constraints: []
    contrasts: []
  - pattern: これは／あれはいくらですか。
    function_cn: 询问商品价格
    formation: 指示词＋は＋いくら＋ですか
    constraints: []
    contrasts: []
  - pattern: ～は～円です。
    function_cn: 回答价格（日元金额）
    formation: 名词＋は＋数字＋円＋です
    constraints: []
    contrasts: []
  - pattern: ここ／そこ／あそこ は 名 です
    function_cn: 指示场所并说明该处是什么；指示词与说话人距离关系同 これ／それ／あれ。
    formation: 指示代词（ここ/そこ/あそこ）+ は + 名词 + です
    constraints:
    - 指示场所时使用，位置关系与指示代词一致
    contrasts: []
  - pattern: 名 は 名[場所] です
    function_cn: 表示某名词存在于某场所；です 含义比汉语“是”更宽，可表“在”。
    formation: 名词 + は + 名词[场所] + です
    constraints:
    - 不能将“名は場所です”译成“名是场所”
    contrasts:
    - 「トイレはここです」以厕所为话题＝厕所在这儿；「ここはトイレです」以这儿为话题＝这里是厕所
  - pattern: 名 は どこですか
    function_cn: 询问某物/某人存在的场所。
    formation: 名词 + は + どこ + ですか
    constraints: []
    contrasts: []
  - pattern: 名 も 名 です
    function_cn: 助词 も 相当于汉语“也”，表示追加同类。
    formation: 名词 + も + 名词 + です
    constraints: []
    contrasts: []
  - pattern: 名は名ですか，名ですか
    function_cn: 选择疑问：在多种可能中询问其中一种，重复使用「～ですか」；回答时不能用「はい」或「いいえ」，需直接指出是哪一个。
    formation: 名词＋は＋名词＋ですか，名词＋ですか。
    constraints:
    - 用于答案有多种可能、需从中选其一的场合
    - 否定/肯定式「はい／いいえ」不适用
    contrasts: []
  - pattern: 名はいくらですか
    function_cn: 询问价格/金额。
    formation: 名词（可带指示词「その」等）＋は＋いくら＋ですか。
    constraints: []
    contrasts: []
  - pattern: 100 以上数字读法
    function_cn: 百位用「ひゃく」、千位用「せん」，前面不加「1」；万位「まん」、千万「せんまん」、亿「おく」前面要加「1」（いちまん／いっせんまん／いちおく）。
    formation: 数字＋位词（ひゃく／せん／まん／おく）组合。
    constraints:
    - 如 530 须读作「ごひゃくさんじゅう」，若读成「ごひゃくさん」会被理解为 503
    contrasts: []
  - pattern: 数词＋量词「階」
    function_cn: 表示楼层；量词与数词搭配时存在多种发音读法
    formation: 数词后接量词「階」
    constraints:
    - 量词与前面数词搭配时发音可能变化，需参照数、量词搭配使用表
    contrasts: []
  - pattern: 谓语的省略（进一步询问）
    function_cn: 会话中进一步询问时省略已说过一遍的谓语部分（含疑问词）
    formation: 保留主语/指示词，省略与上句相同的谓语疑问部分
    constraints:
    - 被省略部分一般包含疑问词
    - 省略后句尾须读升调
    contrasts: []
  - pattern: こちら／そちら／あちら／どちら
    function_cn: 指示词の礼貌说法，对应 ここ／そこ／あそこ／どこ
    formation: 礼貌指示词＋です／ですか
    constraints:
    - 原本为表示方向的词语
    contrasts:
    - 一般说法（ここ/そこ/あそこ/どこ）与礼貌说法（こちら/そちら/あちら/どちら）
  - pattern: お＋名词（如 お国）
    function_cn: 在名词前加「お」使表达更礼貌（如询问国籍）
    formation: お＋名词＋は＋どちらですか
    constraints:
    - 并非所有名词前都可加「お」
    contrasts: []
  - pattern: 会社は どちらですか
    function_cn: 询问公司所在地或所属公司名称，含两种含义
    formation: 会社＋は＋どちらですか
    constraints:
    - 具体含义（所在地／公司名称）需依上下文判断
    contrasts: []
  - pattern: 缩略词
    function_cn: 将长词缩短形成的词（如 パソコン ← パーソナルコンピュータ）
    formation: 长词取部分音节缩短
    constraints: []
    contrasts: []
  - pattern: あのう
    function_cn: 用于向对方搭话、引起注意；也可用于难以启齿的话题、开启新话题或向他人提出请求时的缓冲语。
    formation: 独立感叹/招呼语，置于句首。
    constraints: []
    contrasts: []
  - pattern: ～ですか
    function_cn: 用于进一步确认对方所说的信息，句尾读升调；或在对方内容后重复并加「か」表示已理解对方所说，此时句尾读降调。
    formation: 接在名词或句子后，以「ですか」结尾。
    constraints:
    - 升调表确认提问，降调表理解性复述，二者语用不同。
    contrasts: []
  pragmatics:
  - 礼貌指示词与一般指示词的语用区别
  - 礼貌前缀「お」的使用限制
  - 向正在工作的上级搭话时使用缓冲语
  - 语调（升/降）区分确认与理解两种语用
  - 店员用「そちらです」指向对方身后位置，体现朝向指示语用
