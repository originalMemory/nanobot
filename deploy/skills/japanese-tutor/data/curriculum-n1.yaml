  grammar:
  - pattern: 动词辞书形／动词ている形 ＋ ところ
    function_cn: 表示动作即将开始（正要……）或正在进行（正在……）
    formation: 接在动词原形或动词ている形之后，构成「～るところです」
    constraints:
    - 接辞书形时多表示动作尚未开始、即将发生
    - 接ている形时多表示动作正在进行中
    contrasts:
    - 与「～たばかり」（刚刚完成）在时间轴上方向相反，前者指向未来起点，后者指向过去终点
  - pattern: 动词た形 ＋ ばかり
    function_cn: 表示动作刚刚完成（刚刚……）
    formation: 接在动词た形之后，构成「～たばかりです」
    constraints:
    - 强调动作完成不久、状态尚新
    contrasts:
    - 与「～るところ」（即将/正在）相对，前者表示刚结束，后者表示将开始或进行中
  - pattern: 動詞（基本形）＋ところです
    function_cn: 表示动作即将进行
    formation: 动词基本形＋ところです
    constraints: []
    contrasts: []
  - pattern: 動詞（ている）＋ところです
    function_cn: 表示动作的持续，含若干阶段的某事态目前的进展状况
    formation: 动词て形＋いる＋ところです
    constraints:
    - 一般不能前接非意志性动作
    contrasts: []
  - pattern: 動詞（た形）＋ところです
    function_cn: 表示动作或事件刚刚结束
    formation: 动词た形＋ところです
    constraints:
    - 一般用于表示动作行为结束后经过的时间极短的事态，特别是说话人所在的现场的情况
    contrasts:
    - 与「動詞た形＋ばかりです」相比，后者可表示动作行为结束后经过了较长时间的事态
  - pattern: 動詞（た形）＋ばかりです
    function_cn: 表示动作或事情刚刚结束
    formation: 动词た形＋ばかりです
    constraints:
    - 可以表示动作行为结束后经过了较长时间的事态
    contrasts:
    - 与「動詞た形＋ところです」用法基本相同，但时间跨度可较长
  - pattern: 動詞ます形（去ます）＋始めます／出します
    function_cn: 表示动作或变化的开始
    formation: 动词ます形去掉ます，加「始めます」或「出します」
    constraints:
    - 「～始めます」一般用于表示动作、变化开始
    - 「～出します」偏重于表示突然出现了某种情况
    contrasts:
    - 「～始めます」与「～出します」在‘开始’与‘突然出现’上的语用差别
  - pattern: 動詞ます形（去ます）＋続けます
    function_cn: 表示动作或状态的不间断持续
    formation: 动词ます形去掉ます，加「続けます」
    constraints:
    - 「降ります」不能后续「続けます」，须后续「続きます」
    contrasts:
    - 「～続けます」与「～続きます」的接续限制
  - pattern: 動詞ます形（去ます）＋終わります
    function_cn: 表示动作或行为的结束
    formation: 动词ます形去掉ます，加「終わります」
    constraints:
    - 用于该动作、行为具有一定的量，而且行将结束
    contrasts: []
  - pattern: ～たばかり／～たところ（辨析，标题见上一页）
    function_cn: 表示刚完成某事
    formation: 动词た形＋ばかり／ところ
    constraints:
    - 二者在肯定/否定及语境搭配上存在限制（如「準備ができたばかり」为误用，应用「ところ」）
    contrasts:
    - 「～たばかり」与「～たところ」的适用语境差别
  - pattern: お待たせしました
    function_cn: 让他人等待后所用的寒暄/道歉表达；约会迟到时常用「お待たせして、すみません」致歉，亦可倒装为「すみません。お待たせして。」；餐厅服务员上菜时亦用「お待たせしました。どうぞ。」
    formation: 动词「待つ」的使役谦让表达「お～せしました」
    constraints: []
    contrasts: []
  - pattern: チケット／切符／券
    function_cn: 三者汉语均译作“票”，但语用有别：外来词「チケット」多用于音乐会/电影/京剧等入场券，年轻人偏好，听感较高雅；固有词「切符」用于公共汽车/电车车票；汉语借词「券」多用于构成复合词（如入场券、招待券、回数券）
    formation: 外来词 vs 固有词 vs 汉语借词的语域与搭配差异
    constraints:
    - 「券」一般不单独使用，多作复合词后缀
    contrasts:
    - チケット 偏高雅/年轻人口语
    - 切符 偏交通票据
    - 券 偏复合词构成
  - pattern: 耳の奥
    function_cn: 表示“耳边/耳中（余韵）”，如「まだ耳の奥に音楽が残っています」
    formation: 名词「耳」+「の」+「奥」
    constraints:
    - 日语中此处只能用「耳の奥」，不能替换为「耳のそば」
    contrasts:
    - 与汉语“耳边”对应，但日语不可用「そば」表达
  pragmatics:
  - 「お待たせしました」为谦让寒暄，用于迟到或上菜场景
  - 「チケット」与「切符」存在个人/年龄偏好差异
  - 迟到致歉与回应（すみません／いいえ）
  - 请对方稍候（ここで待っていてください）
  - 师生/师生间礼貌体（です・ます）对话
  - 对老师使用敬语，学生回答亦用礼貌体
