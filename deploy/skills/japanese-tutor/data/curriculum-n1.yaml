  communication_functions:
  - 对接受采访表示感谢
  - 开始采访
  - 转换话题
  - 结束采访
  - 询问对方对某事的考虑
  - 陈述剩余时间或数量并鼓励
  - 表达难以实现的假设与愿望
  - 替对方把未说完的话说出口（察觉）
  - 口语中用通俗形式替代敬体
  - 采访/访谈（インタビュー）：致谢、询问近况与感受、转换话题、询问私人话题、询问未来抱负、再次致谢并表达期待
  grammar:
  - pattern: まず、～をお聞かせください
    function_cn: 开始采访时，在打算提出多个问题前引出第一个问题的常用表达
    formation: まず + ～をお聞かせください（敬体请求）
    constraints: []
    contrasts: []
  - pattern: ところで / では / ここからは
    function_cn: 转换话题时使用的铺垫语
    formation: 话题转换连接语 + 新话题内容
    constraints: []
    contrasts: []
  - pattern: 最後に
    function_cn: 采访结束时，提出视听众最想了解的问题或请被采访者向观众寄语
    formation: 最後に + 请求/寄语内容
    constraints: []
    contrasts: []
  - pattern: 敬体与简体的语用对应规则
    function_cn: 采访者使用敬体时，被采访者一般也用敬体回答；但年轻运动员或男性之间可使用较随意的表达（如「いいつよ」「ら抜き言葉」等丢掉形式），非普遍说法
    formation: 语用/称呼规则，非固定句型
    constraints:
    - 随意表达限于特定人群（年轻运动员、男性间）
    contrasts:
    - 敬体（普遍） vs 随意表达（特定场景）
  - pattern: メセナ（企业公益活动）
    function_cn: 企业对社会做贡献的重要方面，包括资助学术、艺术，有时也包括体育
    formation: 词汇/概念主题
    constraints: []
    contrasts: []
  - pattern: 残すところ～
    function_cn: 陈述剩余数量，含余下不多的语气，多用于剩余工作或日程
    formation: 残すところあと＋数量
    constraints:
    - 不能单独说成「残るところ」
    contrasts: []
  - pattern: ～なし
    function_cn: 表达「～は（が）ない」，意为没有；较传统，多用于强调
    formation: 名词＋なし；可用「～なし、～なし」构成并列
    constraints: []
    contrasts: []
  - pattern: そのあたり
    function_cn: 指代前述话语，意为「关于这事儿」，略带含混，用于提出模糊问题或提及前文
    formation: そのあたり＋どうですか／が～
    constraints: []
    contrasts: []
  - pattern: ～ものなら
    function_cn: 提出很难实现的假设，其后多为表示愿望的说法
    formation: 动词可能形式＋ものなら
    constraints: []
    contrasts: []
  - pattern: 察觉（替对方把话说出口）
    function_cn: 日常交谈或采访中，听者察觉对方想说的内容并替其说出口的情形；即使初次见面也常见
    formation: 交际/语用现象，非固定接续
    constraints: []
    contrasts: []
  - pattern: ～つす ［口语］
    function_cn: 把～です说成～つす、～ですよ说成～つすよ、～ですね说成～つすね；虽为敬体形式但用通俗表达，不算正式说法，多为年轻男性使用
    formation: ～です／～ですよ／～ですね 的口语替代
    constraints:
    - 非正式
    - 年轻男性常用
    contrasts: []
  - pattern: 答える（ら抜き言葉）
    function_cn: 可能形式去掉「ら」的派生形式，如「見える」「考えれる」，由一类动词可能形类推至二/一类动词；主要年轻人在非正式口语中使用。
    formation: 可能形「～られる」去掉「ら」变为「～れる」
    constraints:
    - 非正式口语为主，正式场合宜用完整「～られる」
    - 与被动、尊敬用法区分（如「見える」「止めれる」仅表可能）
    contrasts:
    - 与完整可能形「～られる」对比
  - pattern: かさ形式（させ入る言葉）
    function_cn: 使役形式中「させる」的派生用法，如「歩かさせる」「読ませる」，多被视为错误用法，最好避免。
    formation: 一类动词使役形后加「させる」，或二/一类动词使役形类推
    constraints:
    - 与「ら抜き言葉」相对，属使役侧的类推派生
    - 普遍被认为不规范
    contrasts:
    - 与规范使役形「～させる」对比
  - pattern: ～ではあるが
    function_cn: 转折表达，意义同「～だが」「～ですが」，但添加突出提示意义，强调语气较强。
    formation: 「～である」＋助词「は」＋转折助词「が」
    constraints:
    - 用于书面或较正式转折，带强调/让步语气
    contrasts:
    - 与「～だが」「～ですが」语气强度对比
  - pattern: ～てみせる
    function_cn: 表示把自己做的事展示给别人看；或表明自己的强烈意志、决心
    formation: 动词て形＋みせる
    constraints:
    - 表示意志/决心的用法多用于难以实现的行为，不能用于一般场合
    contrasts: []
  - pattern: ～に花が咲く
    function_cn: 比喻某个话题谈论热烈；并列举含植物名称的惯用语（如根も葉もない、実を結ぶ等）
    formation: 名词/话题＋に花が咲く
    constraints: []
    contrasts: []
  - pattern: ～っこない
    function_cn: 强烈否定，强调认为动词所表示的内容没有实现的可能性；口语中语气相当随便
    formation: 动词ます形去ます＋っこない
    constraints:
    - 用于口语
    - 可与～などということは等强调性质异常的表达搭配
    contrasts:
    - ～はずがない
    - ～わけがない
  - pattern: ～だって
    function_cn: 口语，用于提示某事物，言外之意暗示还存在其他类似的情况；语气比「～も」稍强
    formation: 前面只能使用名词
    constraints:
    - 与「～も」功能相近但语气稍强
    - 前接名词
    contrasts:
    - 与「～も」相比语气稍强
  - pattern: ～のなんのって
    function_cn: 表示程度高，表达说话人自身的强烈感觉、感情，非客观表达方式；多用于讲述自己的事情，用于他人行为时也表示说话人感到吃惊或为难的程度很高
    formation: 一类形容词＋の＋なんのって／动词形＋の＋なんのって
    constraints:
    - 主观表达，非客观
    contrasts: []
  - pattern: ～一辺倒
    function_cn: 表示“清一色……”“一味地……”“无例外”；有时用「～一辺倒では～ない」，含负面评价语气
    formation: 前接名词，该名词多表示主义、主张或依据
    constraints:
    - 前接名词
    contrasts: []
  - pattern: もう少しで～ところだった
    function_cn: 表示与现实相反的假设，意为“有输掉/失败的可能性但总算有惊无险地避免了”；动词基本形+とこだった，常与「もう少しで」「あやうく」搭配；在场景描写中也可表示“仅陈述就要进行某行为”
    formation: 动词基本形＋とこだった
    constraints:
    - 多与「もう少しで」「あやうく」等搭配使用
    - 「やられる」为「やる」的被动形式，此处意为“被打败”
    contrasts:
    - 与「～そうになる」的过去形式「～そうになった」意思相近，如「死にそうになった」与「死ぬとこだった」可表达相同意思
  - pattern: いける
    function_cn: 口语，意为“进展顺利”“令人满意”
    formation: 口语表达，常接「はずだ」等
    constraints:
    - 口语用法
    contrasts: []
  - pattern: ～やいい
    function_cn: 口语，「～ばいい」的非正式说法，意为“……就算好了”；否定形式为「～なきゃやいい」
    formation: 动词基本形（去い）＋やいい；否定形「～なきゃやいい」
    constraints:
    - 口语中有时将基本形最后一个音变为イ段音后接「や」，如「すりゃいい」「行きゃいい」「読みゃいい」
    - 基本形最后一个音为「う」的动词，省略掉「い」变成「買ゃいい」属方言说法
    contrasts:
    - 与「～ばいい」同义但更非正式
  - pattern: ～が大きい
    function_cn: 表示某事被认为是主要原因
    formation: 常以「～は～が大きい」的形式出现
    constraints: []
    contrasts: []
  pragmatics:
  - 采访场景中采访者与被采访者的敬体/简体对应关系
  - 「そのあたり」在采访等对话中常见，用于主动陈述后提出模糊问题
  - ～つす 属通俗表达，不能算正式说法
  - 「ら抜き言葉」语体偏非正式、年轻人口语
  - 「かさ形式」语用评价偏负面（多视为误用）
  - 「～ではあるが」含较强强调/让步语气
  - 使用礼貌体（です・ます）进行正式采访对话
  - 采访开场与结尾的致谢寒暄
