  - pattern: 真偽のほどは定かではない
    function_cn: 表示不知真伪；「定か」为二类形容词，一般与否定形式连用
    formation: 名词（真偽のほど）＋は＋定かではない
    constraints: []
    contrasts: []
  - pattern: ～を受けて、～
    function_cn: 听取针对自己的意见后，在此基础上经过研究采取行动
    formation: 动词连体形／名词＋を受けて、＋后续行动
    constraints: []
    contrasts: []
  - pattern: ～か否かで、～
    function_cn: 书面语，表示“是否……”；用此形式表达“以是否……为理由”
    formation: 动词连体形／动词た形＋か否かで、～
    constraints:
    - 书面语
    contrasts:
    - 与「～かどうか」相同，表示“是否……”
  - pattern: 丸っこい
    function_cn: 表示“具有圆的性质”；带「っこい」的词还有「油っこい」「すばしっこい」等
    formation: 名词＋っこい
    constraints: []
    contrasts: []
  - pattern: ～まみれ
    function_cn: 接在名词后，表示整体都沾满、弄脏或呈现不好状态；常用～まみれになる形式。
    formation: 名词＋まみれ（／まみれになる）
    constraints: []
    contrasts: []
  - pattern: ～弱
    function_cn: 接在表示数量的名词后，意为比该数字少；与“強（きょう）”相对，后者表示比该数字多。
    formation: 数量名词＋弱（じゃく）／強（きょう）
    constraints: []
    contrasts:
    - 強（きょう）：比该数字多
  - pattern: だが
    function_cn: 连词，表示转折，与しかし、けれども、だけど等同义；主要作书面语，口语中少用。
    formation: 句末／句间转折连接
    constraints:
    - 书面语为主，口语少用
    contrasts:
    - しかし
    - けれども
    - だけど
  - pattern: ～に満たない
    function_cn: 表示未达到该名词所示的基准或数值；前面名词为数值时可用「～未満である」替换；「に」后可加「も」以强调不足。
    formation: 名词＋に（も）満たない
    constraints:
    - 用于表达未达到某标准或数量
    - 数值语境下可换用「～未満である」
    contrasts:
    - 「～に満たない」与「～未満である」语义相近，后者更书面/数值化
  - pattern: ～ほど～はない
    function_cn: 表示所提及事物的程度为最高，相当于汉语“没有比……更……了”。
    formation: 名词／动词／形容词＋ほど＋～はない
    constraints:
    - 用于最高级否定比较
    contrasts:
    - 「ほど」有时可替换为「くらい」，意思相同但「くらい」更口语化
  - pattern: 手間がかかる
    function_cn: 相当于汉语“费事”，表示做某事所需的时间或精力；可作定语修饰名词（此时「が」变为「の」）。
    formation: 手間が＋かかる／かける／省く／省ける
    constraints:
    - 修饰名词时助词「が」变「の」
    contrasts:
    - 「手間がかかる」（费事）／「手間をかける」（费事）／「手間を省く」（省事）／「手間が省ける」（可省事）
  - pattern: 難儀する
    function_cn: 费周折、费劲、令人头疼
    formation: 名词+に難儀する／名词+で難儀する／动词て形+難儀する；亦可作二类形容词修饰名词（難儀な仕事）
    constraints:
    - 多与说明理由的表达搭配使用
    contrasts: []
  - pattern: ～たとしても
    function_cn: 即使……也……（让步）
    formation: 动词た形+としても
    constraints:
    - 有时与句首的「仮に」或「たとえ」搭配使用
    contrasts: []
  - pattern: ～（よ）うとしない
    function_cn: 不想……／不肯……
    formation: 动词意志形+としない
    constraints:
    - 肯定形式「动词意志形+とする」相当于“想要……”
    contrasts: []
  - pattern: 息をつく
    function_cn: 动词短语，两个义项：①大口喘气；②喘口气（放松）。常与否定搭配表示忙得无暇休息。
    formation: 息を＋つく
    constraints:
    - 义项②多用于否定或‘暇もない’等表达，表示没有喘息之机
    contrasts:
    - 义项①（喘气）与义项②（喘口气/放松）需依语境区分
  - pattern: 並大抵のことではない
    function_cn: 表示困难、辛苦、努力等程度很大，非一般可比。
    formation: 並大抵の＋こと／苦労／努力＋ではない（与否定形式搭配）
    constraints:
    - 必须与否定形式搭配使用
    - 可替换中心词为‘苦労’‘努力’等
    contrasts:
    - ‘並大抵’本身意为程度一般，靠否定构成‘非一般’的强调
  - pattern: 見世物にする／見世物になる
    function_cn: 两个义项：①收费表演珍奇技艺；②被许多人抱着好奇心理观看（成为供人寻开心的对象）。
    formation: 見世物＋にする／になる
    constraints:
    - 义项②多用‘見世物にする’‘見世物になる’等形式
    contrasts:
    - 义项①（表演技艺）与义项②（供人好奇观看）需依语境区分
