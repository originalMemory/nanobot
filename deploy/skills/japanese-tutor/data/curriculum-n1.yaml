  communication_functions:
  - 表达自身愿望（想做/想要）
  - 询问对方愿望
  - 邀请对方共同行动（购物、看电影、喝茶、听音乐会）
  - 表达愿望
  - 提议
  - 提议/邀请
  - 表达无条件的肯定或否定
  - 缓和语气、传达个人想法
  - 表达愿望与希望
