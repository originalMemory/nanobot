  - 强调时间或次数限制（～限り）
  - 表示赞同、理解对方（ごもっとも）
  - 强烈请求/恳请对方帮忙
  - 礼貌地提示话题或询问对方意向（如订货、结账、预约时间）
  grammar:
  - pattern: 道歉表达（按礼貌度/正式度区分）
    function_cn: 表示道歉，区分すみません（对不起）、申し訳ありません（抱歉）、申し訳ございません（实在抱歉）、ご迷惑をおかけしました（给您添麻烦了）等层级
    formation: 名词/动词连用形＋ません／ございません；过去道歉可用「～ませんでした／～ませんでしたでした」
    constraints:
    - 「申し訳ございません」最为郑重
    - 可在前面加「本当に」加强语气
    contrasts:
    - すみません（较轻） vs 申し訳ありません vs 申し訳ございません（最郑重）
  - pattern: 补救措施表达
    function_cn: 表示将采取处理、赔偿、修复等措施
    formation: 动词ます形去ます＋いたします；动词て形＋させていただきます；动词て形＋差し上げます
    constraints:
    - 用于对物品赔偿、修复等场景
    contrasts: []
  - pattern: 表示理解对方心情
    function_cn: 表示理解对方生气/不满是理所当然的
    formation: お怒りはごもっともです
    constraints: []
    contrasts: []
  - pattern: 道歉流程顺序
    function_cn: 商务道歉的推荐顺序：致歉→紧急处理→查明原因→防止再次发生→今后采取的措施→再次道歉
    formation: 交际流程（非单一句型）
    constraints:
    - 道歉要及时；当面比书信更礼貌，但紧急情况下先电话道歉
    - 下次见面需再次道歉（如「先日はご迷惑をおかけして、申し訳ありませんでした」）
    contrasts: []
  - pattern: ね（句中/停顿用）
    function_cn: 在名词+助词、副词之后等意思相对完整处插入，用停顿引起听人注意；与句末“ね”功能不同，正式场合少用，个人对话中显亲切。
    formation: 接于名词+助词、副词等成分之后，后接停顿。
    constraints:
    - 位置受限：可用“おいしい料理を＋ね”，但不用“おいしい＋ね＋料理を”的形式。
    - 发音一般稍高略轻，思考说话时可不刻意抬高，有时拉长为“ねえ”。
    - 正式场合很少使用。
    contrasts:
    - 与句末“ね”（中级第6课）用法不同。
  - pattern: お宅
    function_cn: 敬称，原指对方的家，本课用作对对方的称呼，含轻微敬意，意为“您”或“您的公司”。
    formation: 作称呼/主语，如“お宅では”。
    constraints:
    - 含轻微敬意，用于对对方（含其公司）的称呼。
    contrasts: []
  - pattern: どういったこと / どういうこと
    function_cn: 二者均为询问情况的疑问句。前者希望听人举出一个事例的询问方式；后者强烈要求听人对内容做出说明，含质问语气。
    formation: “どういったこと（でしょうか）” / “どういうことですか”。
    constraints:
    - 本课因说话人对事件内容不了解，希望听人说明且使语气温和，故用“どういったこと”的形式。
    contrasts:
    - “どういうことですか”语气更强、含质问（中级第7课）。
  - pattern: ～中、～
    function_cn: 前接名词，表示话题提及到的事物范围内或该事物的整体
    formation: 名词 + 中、+ 名词/句子
    constraints:
    - 只能前接量词等确定范围的词语
    - 与～のうち意思基本相同，但～のうち应用范围广泛，可用于表示抽象概念的范围
    contrasts:
    - ～のうち
  - pattern: ～にひびが入る
    function_cn: 表示陶瓷、玻璃、人骨等比较硬的物体上出现裂痕；也用于比喻人际关系方面出现不和谐
    formation: 名词 + に + ひびが入る
    constraints:
    - 对象用助词に表示
    contrasts: []
  - pattern: ～ようにしてください
    function_cn: 表示请求的表达方式，由～ようにします发展而来
    formation: 动词基本形 + ようにしてください
    constraints:
    - 与能由对方意志控制的动词一起使用时可改换成～てください的形式
    - 与对方意志不能控制的动作动词一起使用时不能改换成～てください
    - 否定形式为～ないようにしてください
    - 一般不用于暂时性的情况
    contrasts:
    - ～てください
    - ～ないようにしてください
  - pattern: ～次第
    function_cn: 表示一有某动作发生就立刻进行后一个动作，与～たら、すぐに含义相同；后一动作多为自己动作或向对方提出的请求。
    formation: 动词ます形去掉ます后接次第。
    constraints:
    - 后接动作多为说话人自身动作或请求对方动作
    contrasts:
    - 与～たら、すぐに意义相近
  - pattern: いいですよ
    function_cn: 除表示“好”外，还表示拒绝对方提议，属委婉礼貌的表达；与表示强烈主张的“よ”“なんで”连用时表现说话人的不满与愤怒。
    formation: 形容词/动词い形等后接ですよ。
    constraints:
    - 用于拒绝时不告知原因
    contrasts:
    - 与“よ”“なんで”连用语气转为不满、愤怒
  - pattern: ～限り
    function_cn: 前接表示时间的名词，强调仅限于该时间为止；也可用于强调只有一次。
    formation: 时间名词后接限り；可后接で构成～限りで終わる等。
    constraints:
    - 前接时间名词表示截止
    - 可表示一次性（如1回限り、今回限り）
    contrasts: []
  - pattern: ごもっとも
    function_cn: 表示对对方认为是理所当然的想法的尊重，用于接受对方言行或承认对方有道理；可表示理解对方心情并迎合对方。
    formation: 二类形容词もっとも前接尊敬语ご构成。
    constraints:
    - 用于接受对方言行或承认对方有道理的场景
    contrasts: []
  - pattern: 何とか
    function_cn: 副词，表示事情不简单、费了一番功夫；用于恳请对方帮忙时表示强烈要求；作动词使用时表示对难办的事想方设法解决。
    formation: 副词/动词用法，可接于请求句或叙述句中。
    constraints:
    - 用于请求时含'明知对方不易答应仍强烈要求'的语用色彩。
    contrasts: []
  - pattern: ～のほう
    function_cn: 借用表示方向的'ほう'，用于举出相关事件或提示话题；近世多用于商店、宾馆等接待场合表示礼貌。
    formation: 名词＋のほう。
    constraints:
    - 源于说话人想表示礼貌，过度使用被视为滥用。
    contrasts: []
  - pattern: かんかん
    function_cn: 拟声/拟态词，原形容敲击金属等物体发出的声音，引申形容人非常愤怒的样子或阳光强烈照射的状态。
    formation: 拟声拟态词，可作谓语或修饰成分。
    constraints: []
    contrasts: []
  - pattern: わざわざ
    function_cn: 副词，表示原本没有必要但仍特意去做；也可表示故意、有意
    formation: 接于动词连用形/辞书形前作副词修饰
    constraints:
    - 与「わざと（故意）」语义相近，但「わざと」多用于表示恶意或为谋取自身利益而做某事
    contrasts:
    - わざと
  - pattern: 代名词
    function_cn: 比喻用法，指某物的名称是同类或所属整体的一个代表
    formation: 名词性用法，常以「…の代名词」形式出现
    constraints: []
    contrasts: []
  - pattern: 苦情が寄せられる
    function_cn: 表达不满、发牢骚或投诉；除「苦情を言う」「苦情を述べる」外，通过信件、电话向某处投诉时用「苦情を寄せる」，属习惯表达；被动形表示收到投诉
    formation: 动词「寄せる」的被动形「寄せられる」
    constraints:
    - 「苦情を寄せる」用于向负责方投诉不满的习惯表达
    contrasts:
    - 与「苦情を言う」「苦情を述べる」并列，但「寄せる」强调通过信件/电话向某处投诉
  - pattern: ～つつある
    function_cn: 表示逐渐发生变化或动作朝着完成的方向发展，与表示进行/变化的「～ている」相似，但只表示动作正在进行中
    formation: 动词「ます形」去掉「ます」后接「つつある」
    constraints:
    - 只能跟在表示变化的动词后面，不能跟表示持续动作的动词一起使用
    contrasts:
    - 与「～ている」相比，「～つつある」只表示进行中，不表示变化结果的状态；与瞬间变化动词搭配时不能与「～ている」互换
  - pattern: 大手
    function_cn: 指同行业中规模较大、资金多、知名度高的企业或公司，无严格标准。
    formation: 名词，常作定语或宾语，如「大手の商社」。
    constraints: []
    contrasts: []
  - pattern: ～には～とある
    function_cn: 表示引用，指书或文章中记载着该引用内容，属书面表达方式。
    formation: 「～には，[引用内容]＋とある」；「には」前可用辞典、法律、規定、説明書、看板等名词。
    constraints:
    - 可用「書いてある」等形式代替动词「ある」。
    contrasts: []
  - pattern: ～と評判だ
    function_cn: 表示因获得好评而出名，仅用「評判」即可表示评价高。
    formation: 「～と評判だ」；另有「評判の店」等用法。
    constraints: []
    contrasts: []
  - pattern: ～ならびに～
    function_cn: 表示列举，基本用法与助词「と」相同，属书面语，一般用于正式文章。
    formation: 列举三个以上时用「A，B，C，…ならびにX」形式。
    constraints:
    - 不能连接性质不同的事物（如「天と地」）。
    contrasts:
    - 与助词「と」列举形式「AとBとCと…Xと」相区别。
  - pattern: ～に伴って～
    function_cn: 表示伴随某个重大事件连带发生了另外的事件；接名词时用『～に伴う＋名词』。
    formation: 动词（简体形式）＋のに伴って；名词＋に伴って
    constraints:
    - 用于重大事件引发的连带结果
    - 接名词时改用『に伴う』
    contrasts: []
  - pattern: ～のもと（で）
    function_cn: 表示位置幕下的部位，或支配关系、影响关系以及状况等。
    formation: 名词＋のもと（で）
    constraints:
    - 可接『命令』『指導』『旗』『法律』『責任』『状況』『条件』『天候』等名词
    contrasts: []
  - pattern: ～のもとになる～
    function_cn: 指成为原料的某种东西；比『～の原料になる』更通俗易懂、口语化。
    formation: 名词＋のもとになる
    constraints:
    - 用于表示作为原料/原材料
    contrasts:
    - 与『～の原料になる』相比更口语化
  - pattern: ～一方（で）、～
    function_cn: 表示有两个不同的动作同时进行。
    formation: 动词（基本形）＋一方（で）、～
    constraints:
    - 用于两个不同动作同时进行
    contrasts:
    - 与表示同时进行的『～ながら』等区别
  - pattern: ～ている一方で
    function_cn: 表示两个动作同时进行，且两者没有主次之分。
    formation: 动词て形＋いる一方で
    constraints:
    - 与「～ているながら～」不同：后者不表示两个动作同时进行。
    - 与表示对比的「小句（简体形式）＋一方で」用法不同。
    contrasts:
    - ～ているながら～（不表同时进行）
    - 小句（简体）＋一方で（表对比）
  - pattern: ～と同時に
    function_cn: 表示两个不同事件同时成立，前后两个主语即使不同也可使用。
    formation: 动词（简体形式）／一类形容词＋と同時に；二类形容词／名词＋であると同時に
    constraints:
    - 用于并列两个同时成立的状态或事件，而非动作的先后或伴随。
    contrasts: []
  pragmatics:
  - 電話での名乗り（私、上海PECホテルの黒田と申します）
  - 丁寧な謝罪（申し訳ございません）
  - 依頼（頼みますよ／してください）
  - 道歉礼貌度分级（すみません＜申し訳ありません＜申し訳ございません）
  - 当面道歉 vs 书信道歉 vs 电话道歉的语用差异
  - 紧急情况下先电话道歉的惯例
  - “ね”（句中）多用于个人间对话，正式场合少用。
  - “お宅”含轻微敬意，区别于普通称呼。
  - “どういったこと”比“どういうこと”语气更温和。
  - ～ようにしてください用于医生对患者等上下级或正式请求场景
  - いいですよ用于礼貌拒绝，避免直接说明原因
  - ごもっとも用于缓解客户不满、迎合对方的交际策略
  - ～のほう 的礼貌用法源于说话人想表示礼貌，部分人认为其过多使用属于滥用。
