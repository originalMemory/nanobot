  grammar:
  - pattern: ～に見舞われる
    function_cn: 表示遭受灾害、打击等不良影响（受害/被动用法），区别于“探望病人”的「見舞う」义项
    formation: 名词（灾害、暴雨、日照不足等）＋に見舞われる
    constraints:
    - 用于负面、受害语境，不用于中性或正面事件
    contrasts:
    - 「病人を見舞う（探望）」为主动义，与受害义不同
  - pattern: 行方／行き来
    function_cn: 「行方」为书面语，指去向、行踪；「行方不明者」指失去消息、不知是否平安者；「行き来」指来去、来往
    formation: 名词/复合词，可作「～の行方」「人の行き来」等
    constraints:
    - 「行方」主要用于书面语
    - 「行き来」既可读 ikiki 也可读 yukiki；「いく」偏口语、「ゆく」偏书面语
    - て形「行って」、た形「行った」分别读 itte/itta，不读 yutte/yutta
    contrasts:
    - 「いく」与「ゆく」均表“去”，但语体倾向不同
  - pattern: ～に達する／～に上る
    function_cn: 数值表达方式，表示说话人对该数值的评价：「～に達する」指数值达到一定地步或级别；「～に上る」指作为结果该数量是较大数值
    formation: 数值/数量词＋に達する／に上る
    constraints:
    - 「～」部分须使用表示数值或数量的词
    contrasts:
    - 与「～に及ぶ」（认为数值很大）同属高评价
    - 与「～にすぎない」「～にとどまる」「わずか～」（认为数值很小）相对
  - pattern: ～となる
    function_cn: 表示状态发生了改变；较书面语；不能接二类形容词
    formation: 名词＋となる
    constraints:
    - 不能接二类形容词
    - 与初级第18课『～になる』相同但更书面
    contrasts:
    - ～になる（初级第18课）
  - pattern: まるごと
    function_cn: 表示不做分割或部分删除，全部照原样
    formation: 副词性用法，接动词
    constraints: []
    contrasts: []
  - pattern: 押し寄せる
    function_cn: 表示动作集中于某一点；『水が押し寄せる』指水像推挤似地压迫过来
    formation: 动词ます形去掉『ます』＋寄せる；前接大幅度动作动词
    constraints:
    - 前接大幅度动作动词
    contrasts:
    - 打ち寄せる（冲过来，迫近）
    - 引き寄せる（拉近，吸引）
    - 手繰り寄せる（拉上来，拽上来）
  - pattern: ～ず
    function_cn: 书面语，意思与『～ないで』相同
    formation: 使用动词ない形去（接续说明在页面底部截断，未完整显示）
    constraints:
    - 书面语
    - 用于句子中间，不能用于句尾
    - 存在～ずに的变体形式
    contrasts:
    - ～ないで（初级第29课）
    - 与～ずに的用法区分
  - pattern: 駆け上がる
    function_cn: 由‘駆ける+上がる’构成，表‘跑着向上移动’；可比喻用于无生命物体作动作主体
    formation: 駆ける＋上がる
    constraints:
    - 通常为意志性动作，动作主体为人或动物；比喻用法可让无生命物体作主体
    contrasts: []
  - pattern: 原型をとどめない
    function_cn: ‘とどめる’表‘使运动着的东西停下来’或‘在后面留下痕迹’；此处取‘没有留下原貌的痕迹’，表剧烈变化至辨认不出原貌
    formation: 原型＋をとどめない
    constraints:
    - ‘とどめる’有两义，需依语境区分
    contrasts: []
  - pattern: 最大＋数值
    function_cn: 在数值前加‘最大’表示规模、高度等的上限（如‘最高达…’）
    formation: 最大＋数值＋单位
    constraints: []
    contrasts: []
  - pattern: いち早く
    function_cn: 表示“率先”“立刻”“先人一步”，用于强调在同类中最早采取某行动。
    formation: 副词性表达，修饰动词。
    constraints: []
    contrasts: []
  - pattern: 九死に一生を得る
    function_cn: 表示“身处绝境而奇迹般地脱险”，侧重强调最终幸存。
    formation: 惯用句，作谓语。
    constraints:
    - “九死に一生”不可单独使用，须接“を得る”。
    contrasts:
    - 与“一命を取り留める（保住了一条命）”相近，后者用于因事故或疾病有生命危险后经救治被挽救。
  - pattern: 目の当たりにする
    function_cn: 表示“直接看到”“亲眼目睹”某种事态发生在眼前。
    formation: “目の当たりにする”形式使用较多；“目の当たりに”表示事态发生在眼前。
    constraints:
    - 多用于人们较少能直接看到的事态。
    contrasts: []
  - pattern: 予測を超える／想像を絶する
    function_cn: 表示超出基准、极限或超乎想象、无法用语言形容，多含负面含义；前者前接具体数字或“予測”“限界”，后者常接“想像”“言語”构成惯用形式。
    formation: N（数字／予測／限界）＋を超える；想像を絶する／言語に絶する
    constraints:
    - “絶する”多表示负面含义
    contrasts:
    - “予測を超える”强调超过基准或数值，“想像を絶する”强调远超想象、难以形容
  - pattern: 生活を営む／生計を立てる
    function_cn: 表示维持生活、经营某业，或以某种职业/手段维持生计；“営む”可表不懈努力或经营店铺，“生計を立てる”以“～によって／～で”接表示职业或手段的名词。
    formation: N（生活／酒屋／理髪店／工務店）＋を営む；～によって／～で生計を立てる
    constraints:
    - “生計を立てる”的“～”处一般为表示职业或手段的名词（如漁業、農業、文筆業、運送業、アルバイト）
    contrasts:
    - “生活を営む”侧重维持生活或经营，“生計を立てる”侧重以某手段谋生
  - pattern: 海の恵み
    function_cn: 指从海洋捕捞的鱼类、贝类等水产资源，即“大海的馈赠”。
    formation: 海の恵み（海の幸）
    constraints: []
    contrasts: []
  - pattern: ～にしてい
    function_cn: 表示“在……”“以……”，前接特定名词起强调作用
    formation: 名词 + にしてい
    constraints:
    - 前接特定名词
    - 含强调语气（如强调年龄幼小、时间短暂等）
    contrasts:
    - 与单纯使用“～で”相比，加“にしてい”更强调该限定条件
  - pattern: ～ばかりは
    function_cn: 表示限定，“别的且不论，就只……”
    formation: 名词 + ばかりは
    constraints:
    - 前接名词
    - 表示强调的形式，说法较旧，书面语色彩浓厚
    contrasts: []
  - pattern: ～（よ）うがない
    function_cn: 表示“虽然想那样，但是做不到”；用于表达想做却无能为力的情形。
    formation: 动词ます形去掉「ます」＋（よ）うがない；サ变动词词干＋の＋しようがない。
    constraints:
    - 带助词「を」的动词（如「手をつける」「連絡をする」）需将「を」改为「の」再接「ようがない」。
    contrasts: []
  - pattern: ～ことは～ぐらいのものだ
    function_cn: 用于举出具体例子来说明其程度，限定某事所能做到的范围。
    formation: 「～ことは」＋「～ぐらいのものだ」。
    constraints:
    - 「～ぐらい」表示程度；「～ものだ」表示其性质。
    contrasts: []
  - pattern: なるべく
    function_cn: 副词，表示“如果可能的话希望那样做”“希望如此”。
    formation: 副词，修饰动词。
    constraints:
    - 口语中还有「なるべく」的用法。
    contrasts: []
  - pattern: 「～ず」形构成的固定副词/名词性表达
    function_cn: 由动词「ず」形派生的惯用表达，分作副词用与作名词（二类形容词）用两类，分别表示不知不觉、立刻、程度多、不顾一切、不离身、不得已、不怕死、不通世故、模棱两可等含义
    formation: 动词连用形＋ず 构成的复合惯用语
    constraints:
    - 作副词用时修饰动词，作名词/二类形容词用时可接「だ」「で困る」等
    contrasts:
    - 区分「～ず」作副词与作名词（二类形容词）的用法差异
