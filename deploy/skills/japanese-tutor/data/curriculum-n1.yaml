  - 办公/文书（提出、書類）
  - 日常起居（風呂、宿題）
  - 标识语（マーク、立入禁止）
  - 植物（フジ）
  - 自然灾害、事故、事件（地震、地盤沈下、雷、火事、台風、竜巻、干ばつ、洪水、墜落、沈没、爆発、交通事故、誘拐、強盗、殺人、ハイジャック）
  - 卡拉OK场景
  - 称呼与敬语（年上、親しい、丁寧）
  - 练习中出现的主题词：许可证、道歉、记住、速度、麻烦、逃学、爽约等
  - 时间/作息
  - 饮食/清洁
  - 健康/感冒
  - 人名/地名/作品名
  - 禁止标识（禁烟、立入禁止、駐車禁止、火気厳禁、横断禁止）
  - 工作场景（报告、加班、偷懒）
  - 日常行为（洗澡、睡觉、说话）
  - 交通与信号（限速、停车、禁止吸烟）
  - 日常名词（提问、场合、符号、标记、速度、许可证、计划书、棒球场、桌子、电视讲座、汉字、战争、警察、年长者）
  - 动词（遵守、回答、逃跑、救助、添加、记住、提交、射门、注意、停、变、拼命努力、道歉、逃学、爽约、拉）
  - 形容词（熟悉、粗暴、不礼貌、一样、危险）
  - 专有名词（周恩来、鲁迅、世田谷、富士）
  similar_contrasts:
  - 与「～なさい」的礼貌命令区分
  - 与「～ないで」的委婉劝阻区分
  - 与「～ろ」的强硬命令区分
  - 与“～なさい”相比语气更直接、命令性更强
  - 与动词命令形相比更客气
  - 命令形「～なさい」「～な」使用范围更受限
  - 与礼貌请求/禁止表达（如て形、ないで）在语用亲疏与性别使用上区分
  - 完整形与省略形在口语/书面语正式度上的差异
  - 言います（内容） vs 言い方をする（方法）
