  grammar:
  - pattern: 议论文的推测与观点表达
    function_cn: 议论文在列举事实同时阐述作者思考与感受，常用表示推测的「～かもしれない」、委婉推测的「～ではないだろうか」，以及把观点提交读者判断的「～ではないか」。
    formation: 动词/形容词/名词谓语句后接续
    constraints:
    - 「～かもしれない」表作者推测
    - 「～ではないだろうか」表委婉推测
    - 「～ではないか」表将观点交由读者判断
    contrasts:
    - 三者语气由推测到委婉再到征询判断，程度与立场不同
  - pattern: 「建立」与「造営」的用法区分
    function_cn: 「建立」专用于建造寺庙、佛堂、佛塔等宗教建筑，不能用于其他建筑物；其他建筑用「造営（兴建）」。
    formation: 名词，可作「～が建立される」被动形式
    constraints:
    - 「建立」限宗教建筑
    - 一般建筑用「造営」
    contrasts:
    - 建立 vs 造営
  - pattern: 重叠形式「～々」（如「品々」）
    function_cn: 表示各种各样的物品或状态；日语可用同形重叠造词，重叠部分可简写为「々」，后部第一个音一般浊音化。
    formation: 名词/形容词词干重叠 + 々
    constraints:
    - 重叠部分简写为「々」
    - 后部首音常浊音化
    contrasts: []
  - pattern: 列举3件以上的连接：まず／また／さらに／ほかにも
    function_cn: 列举3件以上物品或要点时，常用「まずA。またB。さらにC。ほかにもD、E、F…などがある」的递进列举说法。
    formation: まずA。またB。さらにC。ほかにもD…
    constraints:
    - 可用「例えば」代替「まず」
    - 可省略「さらにC」，改为「まずA。またB。ほかにもC、D、E…」
    contrasts:
    - 「例えば」可替代「まず」
    - 「さらに」可省略
  - pattern: ～に連なる
    function_cn: 表示排成一列没有间断；引申为属于某集体的一员、出席某会议
    formation: 名词＋に連なる
    constraints: []
    contrasts:
    - 与「～につながる」相比，「連なる」所连接的事物是多个独立的个体
  - pattern: ～につながる
    function_cn: 表示几个互相分开的事物聚集到一起、因某种关系联系到一起、几个事物连成一串的状态
    formation: 名词＋につながる
    constraints: []
    contrasts:
    - 与「～に連なる」相比，「つながる」表示整体连成一条线状
  - pattern: あながち～ではない
    function_cn: 与句尾否定形式相呼应，表示某主张或判断不能完全否定，带有反对硬下判断的含义
    formation: あながち＋否定形式
    constraints:
    - 需与句尾否定形式相呼应
    contrasts: []
  - pattern: ～を～として／～を～に
    function_cn: 把名1按照名2的性质来对待
    formation: 名1＋を＋名2＋として／に
    constraints:
    - “～を～として”书面语色彩较强
    - 省略“して”的“～を～に～”形式书面语色彩更浓
    contrasts:
    - “～を～として”与“～を～に”相比，前者更有书面语色彩
  - pattern: 乗り出す
    function_cn: 本义为乘船出发，引申为开始做某事或主动进入某个领域
    formation: 动词，可接“に”表示对象/领域
    constraints:
    - 课文中用本义（乘船出发）
    contrasts: []
  - pattern: 寄せる／抱く
    function_cn: 表示对人抱有感情或想法
    formation: 动词，接“に”表示对象
    constraints:
    - “寄せる”用于对人抱有积极意义感情（如好感、同情、期待），可拟人化
    - “抱く”仅表示某种想法或感情
    contrasts:
    - “寄せる”与“抱く”在感情色彩与拟人化用法上的区别
  - pattern: ～させられる（使役被动／使役受身）
    function_cn: 在使役表达基础上叠加被动，表示主语被他人强制做某事；动作主体用助词「に」表示。也可用于与思考相关的动词（如痛感する、気づく），表示自然产生某种想法。
    formation: 动词使役形式＋られる。一类动词使役有「～させる」与「～さす」两种，对应使役被动「～させられる」与「～さされる」，后者更常用；「～さす」由一类动词词干「ない」形去「ない」加「す」构成。二类动词「～させる」→「～させられる」。三类动词：来る→来させる→来させられる；する→させる→させられる。
    constraints:
    - 一类动词使役被动存在「～させられる」与「～さされる」两种形式，后者更常用
    - 强制行为中动作主体用「に」标记
    - 与思考相关动词表自然产生的感受，非他人强制
    contrasts:
    - 使役被动（～させられる）与单纯使役（～させる）的区别在于叠加被动，强调主语被强制
  - pattern: 倒装句②（引用内容后置）
    function_cn: 将引用部分与「と」一起后置，以强调引用内容；在「言う」「思う」「考える」等表示思维的动词句中常见，文学作品中尤多。
    formation: 引用内容（「～」）+ と，整体置于句末。
    constraints:
    - 用于强调引用部分，常规说法为引用内容直接接「と」置于动词后。
    contrasts: []
  - pattern: 使用自动词的表达
    function_cn: 日语倾向用自动词或被动态，避免以非生物作主语；但物品损坏等场合，即使说话人实际无责任，一般也用承担责任的他动词说法，避免用自动词推脱责任。
    formation: 他动词＋てしまう（承担责任） vs 自动词＋てしまう（推脱责任）。
    constraints:
    - 物品损坏时倾向用「壊してしまって」而非「壊れてしまって」。
    contrasts:
    - 汉语说「坏了」对应日语「壊れた」，但借来物品弄坏时易误用自动词留下推脱责任印象。
  - pattern: ～ではないか
    function_cn: 「～じゃないですか」的书面语形式，表推测或反问。
    formation: 名词、一类形容词、二类形容词、动词的简体形式 + ではないか。
    constraints:
    - 名词、二类形容词的现在肯定形式后不加「だ」。
    - 书面语中只读降调；与「～じゃないですか」升调时意思相同，降调时则需依上下文判断。
    - 与表示过去或现在事实的成分一起出现时，作用为让读者或听话人确认某种事实
    - 与表示个人感情、印象的成分一起使用时，表示该感情或印象并非说话人独有，而是认为读者、听者也有同感
    - 用在动词意志形后面时，表示提议
    contrasts:
    - 口语「～じゃないですか」接名词、二类形容词现在肯定形式后句尾有时读降调有时读升调；书面「～ではないか」只读降调。
    - 与单纯疑问句的区别在于带有确认、共鸣或提议的语用色彩
  - pattern: 物が分かる
    function_cn: 懂道理、懂事
    formation: 物＋が＋分かる
    constraints: []
    contrasts: []
  - pattern: 物ともしない／物もせず
    function_cn: 不当回事
    formation: 物＋ともしない／物＋もせず
    constraints: []
    contrasts: []
  - pattern: 物になる
    function_cn: 取得预期成果；成为响当当的人物
    formation: 物＋になる
    constraints: []
    contrasts: []
  - pattern: 物の弾みで
    function_cn: 在当时情景的影响下；一时兴起
    formation: 物＋の＋弾み＋で
    constraints: []
    contrasts: []
  - pattern: 物の見事に
    function_cn: 漂亮地、干净利落地
    formation: 物＋の＋見事＋に
    constraints: []
    contrasts: []
  - pattern: 物は言いよう
    function_cn: 话凭嘴说（说法不同效果不同）
    formation: 物＋は＋言いよう
    constraints: []
    contrasts: []
  - pattern: 物は考えよう
    function_cn: 要想得开；事情就看怎么想
    formation: 物＋は＋考えよう
    constraints: []
    contrasts: []
  - pattern: 物は相談だが
    function_cn: 请求别人帮忙时的固定说法
    formation: 物＋は＋相談＋だが
    constraints: []
    contrasts: []
  - pattern: 物は試し
    function_cn: 空发愁不如做做看
    formation: 物＋は＋試し
    constraints: []
    contrasts: []
  - pattern: 物を言わせる
    function_cn: 依靠某事物
    formation: 物＋を＋言わせる
    constraints: []
    contrasts: []
  pragmatics:
  - 物品损坏道歉时，用他动词表达承担责任，用自动词易给人推脱责任的不良印象。
  - 含吃惊语气
  - 寻求读者/听者认同
