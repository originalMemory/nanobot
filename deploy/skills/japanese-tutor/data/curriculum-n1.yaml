  grammar:
  - pattern: まず、しかし、そこで、そして
    function_cn: 演说中穿插使用的连词，用于向听众有序传达信息、转折或承接
    formation: 句间连接，置于分句开头
    constraints:
    - 用于发表时间较长的演说，使信息传达更清晰
    contrasts: []
  - pattern: まず、～、次に、～／第一に、第二に
    function_cn: 讲话内容较多时用于分项列举
    formation: 列举项前接序数表达
    constraints:
    - 适用于列举多个要点或利弊
    contrasts: []
  - pattern: これ、この、こう
    function_cn: 指示词，指代前面叙述过的内容
    formation: 指示代词/连体词/副词
    constraints:
    - 用于指示上下文内容
    contrasts: []
  - pattern: それ／その／そう／あれ／あの／ああ
    function_cn: 指代词用法区分：それ・その・そう指代后文将要叙述的内容；あれ・あの・ああ指代上下文内容
    formation: 指示代词，用于指示上下文或后文内容
    constraints:
    - それ・その・そう用于指代后面要叙述的内容
    - あれ・あの・ああ用于指示上下文内容
    contrasts:
    - それ系与あれ系在指代方向（后文 vs 上下文）上的区别
  - pattern: ～によれば／～によると
    function_cn: 引用表达，说明引用依据（据……）
    formation: 名词／句子＋によれば／によると
    constraints:
    - 用于引用调查、报告等来源时说明依据
    contrasts: []
  - pattern: 以上をまとめる／以上です／ご質問はありますか／～について質問させていただきます／補足として
    function_cn: 报告总结与问答的礼貌表达：综上所述、以上是报告、是否有提问、关于……请允许我提问、补充说明
    formation: 固定交际套语，用于演讲结尾与提问环节
    constraints:
    - 提问时使用～について質問させていただきます等较尊敬的表达
    contrasts: []
  - pattern: ～に先立って
    function_cn: 表示在A之前先进行B动作，用于B是为A做准备或练习的场合，正式表达
    formation: 名词＋に先立って
    constraints:
    - 用于B为A做准备或练习的场合
    - 属较正式的表达方式
    contrasts:
    - 意思相同的表达：～に先立ち（动词形）、～に先立つ（修饰名词）
  - pattern: 被动句（～られる／～される 等）
    function_cn: 当没有必要出现动作主体时使用被动句以省略动作主体；当句中含多个小句时，为使动作主体一致而使用被动句，使表述更自然。
    formation: 动词被动形（他动词→被动形，如 報告される、開催される、呼ばれて）
    constraints:
    - 用于省略或统一动作主体的语境
    contrasts:
    - 与主动句相比，被动句可使多小句的动作主体归一
  - pattern: ～を通した
    function_cn: 表示在进行 B 时把 A 作为手段或中介。
    formation: 名词 A ＋ を通した ＋ B（A 为名词）
    constraints:
    - A 必须为名词
    contrasts:
    - 同义表达：～を通じて、～を通じた
    - 与表示时间段的 ～通して、～通じて 用法不同，需注意区分
  - pattern: ～ということは，～ということです
    function_cn: 用于举出某种行为，然后对其本质或性质进行描述；前接小句时，也可表示针对某件事的发生，对其原因或逻辑结果加以阐述。
    formation: 小句／名词 ＋ ということは，～ということです
    constraints:
    - 前接小句时用于阐述原因或逻辑结果
    contrasts: []
  - pattern: 効果が上がる
    function_cn: 表示“效果显现出来（有效果）”，并非“效果提高”之意
    formation: 名词“効果”＋“が上がる”
    constraints: []
    contrasts: []
  - pattern: ～のかぎ
    function_cn: 表示“关键”，指对解决问题或理解事物起重要作用的事情
    formation: “の”前接须解决的问题或事情，后接“のかぎ”
    constraints: []
    contrasts: []
  - pattern: ～できなくはない
    function_cn: 表示某事具有实现的可能性，是一种可能形式的表达，多用于本身不好或实现可能性较低的事情
    formation: 三类动词汉字部分＋できなくはない；前接动词时用～ないことはない、～ないこともない、～なくはない等形式
    constraints: []
    contrasts: []
  - pattern: 起きる／発生する（同义动词替换）
    function_cn: 同义动词互换以避免重复，二者可互换使用
    formation: 动词，可互换
    constraints:
    - 用于避免同句重复，选用同义的两个词
    contrasts:
    - 起きる 与 発生する 意思相同，可互换
  - pattern: 押し寄せる（复合动词）
    function_cn: 表示大量东西蜂拥而至
    formation: 动词「押す」+「寄せる」构成的复合动词
    constraints: []
    contrasts: []
  - pattern: 甚大な
    function_cn: 表示程度很高，用于形容受害、恶劣影响等消极内容
    formation: 二类形容词（な形容词）
    constraints:
    - 用于正式书面语，不用于口语
    contrasts: []
  - pattern: 押し合う（复合动词）
    function_cn: 表示相互冲撞、推挤
    formation: 动词「押す」+「合う」构成的复合动词；「合う」类复合动词（如「話し合う」「打ち合う」）在表示具体动作的动词后加「合う」，添加“相互”意义
    constraints: []
    contrasts:
    - 「合う」复合动词表示相互动作
  - pattern: Aをかける
    function_cn: 表示做某事时花费 A；A 可为时间、金钱、工夫等名词
    formation: 名词（时间/金钱/工夫等）＋をかける
    constraints:
    - 可把动词「かける」变为自动词「かかる」，构成「Aがかかる」，意为“需要”
    - 惯用表达「年月をかける」表示经过很长时间
    contrasts: []
  - pattern: ～にしたがって
    function_cn: 表示随动作或状况的发展而发生变化
    formation: 动词（基本形）＋にしたがって／名词＋にしたがって
    constraints: []
    contrasts:
    - 类似说法「～とともに～」
  - pattern: ～について
    function_cn: 表示随着……逐渐……，与「～にしたがって」意思相近（拓展栏目）
    formation: 动词（基本形）＋について
    constraints: []
    contrasts:
    - 与「～にしたがって」近义
  - pattern: ～にすぎない
    function_cn: 限定行为、事件、数量等，表示“没什么大不了的”“只不过是……”，与“～ただけだ”意思相近。
    formation: 动词（简体形式）＋にすぎない；名词＋にすぎない。
    constraints: []
    contrasts: []
  - pattern: 位置している
    function_cn: 表示 A 处于 B 的位置，用于正式书面语，不用于口语。
    formation: AがBに位置している；另有“～に位置する”的表达方式。
    constraints:
    - 正式书面语，不用于口语
    contrasts: []
  - pattern: ～にほかならない
    function_cn: 表示强烈的断定，意思是“绝对是……”“除……以外难以考虑”。
    formation: 名词＋にほかならない。
    constraints: []
    contrasts: []
  - pattern: ～としても、～
    function_cn: 用于提出假定条件，表示即使在这种假定条件下，B 仍然成立。
    formation: 小句（简体形式）＋としても；二类形容词／名词＋だとしても。
    constraints: []
    contrasts:
    - 与“～といっても”比较：后者表示转折关系，意思是尽管在一定程度上可以认定，但实质是不同的。
  - pattern: たとえ～ても
    function_cn: 强调即使A变化B也不会变化；たとえ为副词，表示假设
    formation: たとえ + 小句 + ても
    constraints: []
    contrasts: []
  - pattern: ～にしても／～にしろ／～にせよ
    function_cn: 姑且认可某事为事实，在此基础上提出后项主张；非对不了解真相之事的假定
    formation: 小句（简体形式）+ にしても／にしろ／にせよ
    constraints:
    - ～にしろ／～にせよ 比 ～にしても 更古老，属书面语
    contrasts:
    - 与表示列举的 ～にしろ 用法不同
  pragmatics:
