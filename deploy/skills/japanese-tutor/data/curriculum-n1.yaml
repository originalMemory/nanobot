  themes:
  - 1. 动词的“て形”
  - 动て动 [相继发生①]
  - 动てから动 [相继发生②]
  - 动てください
  - 名[场所]を动 [经过][离开]
  - 5. ～て くださいませんか [请求 ②]
  - 6. もう ②
  - 7. *すみませんが、～ [搭话 ③]
  jlpt_estimate:
    status: unverified
  communication_functions:
  - 询问对方某时段打算做什么
  - 说明自己动作的先后安排
  - 请求寄送物品并选择运输方式
  - 询问交通工具是否经过某地
  - 请求对方做某事（动词て形＋ください）
  - 礼貌请求
  - 搭话/致歉式请求
  - 汇报稿件完成
  - 请求对方查看（見せてください／見てくださいませんか）
  - 说明已完成与将要做的事（整理して…見せました／帰ってから書きました／行って…選びます）
  - 请求寄信（手紙を出してください）
  grammar:
  - pattern: 动词て形 + 动词（中顿/动作先后）
    function_cn: 表示两个动作的先后顺序或并列，前项动作完成后进行后项动作
    formation: 动词ます形去ます加て（含一段、五段、サ变动词及する的て形变化）
    constraints:
    - 前项为动作性动词，后项为另一动作或状态
    - て形接续需按动词类型变化（如行→行って、書→書いて、送→送って）
    contrasts:
    - 与「～てから」区别：て形仅表先后，てから强调前项完成后才进行后项
  - pattern: 动词て形 + から
    function_cn: 表示前项动作完成后，再进行后项动作（先后顺序，强调完成）
    formation: 动词て形 + から + 下一动作
    constraints:
    - 前项须为可完成的动作
    contrasts:
    - 与单纯「～て」相比，「～てから」更强调时间上的先后与完成
  - pattern: 动词て形 + ください
    function_cn: 请求对方做某事
    formation: 动词て形 + ください
    constraints:
    - 用于礼貌请求
    contrasts: []
  - pattern: 名词 + を + 处所へ + 送って（ください）
    function_cn: 请求把某物寄送到某地
    formation: 宾语を + 目的地へ + 送る的て形 + ください
    constraints:
    - 送る的て形为送って
    contrasts: []
  - pattern: 名词（方式/手段）+ で + お願いします
    function_cn: 以某种方式/手段请求办理
    formation: 方式名词 + で + お願いします
    constraints:
    - で表示方式、手段
    contrasts: []
  - pattern: 处所 + を + 通ります
    function_cn: 表示经过、通过某处
    formation: 经过的处所 + を + 通る
    constraints:
    - 通る表示移动路线经过某点
    contrasts: []
  - pattern: 动词的“て形”
    function_cn: 用于各种表达方式（连接动作、表示先后/并列等），是动词形态变化中较复杂的一种，需反复练习记忆。
    formation: 按动词类别分别处理：一类动词为“ます形”去掉“ます”后加“て”，且末音发音有变化（き→いて、ぎ→いで、び・み・に→んで、ち・り・い→って、し→して）；二类动词与三类动词为“ます形”去掉“ます”后直接加“て”。
    constraints:
    - 动词按形态变化方式分为三类（一类、二类、三类）。
    - 位于“い段”的少数二类动词（如起きます、見ます）词形上与一类动词无异，但数量有限，需特别记忆。
    - “行きます”为例外，其“て形”为“行って”。
    contrasts:
    - 一类动词加“て”时末音发生音便变化，而二类、三类动词直接加“て”，二者接续规则不同。
  - pattern: 动词て形＋动词
    function_cn: 表示两个以上动作依照时间顺序相继发生
    formation: 前项动词て形＋后项动词
    constraints: []
    contrasts: []
  - pattern: 动词て形＋から＋动词
    function_cn: 表示两个以上动作依照时间顺序相继发生
    formation: 前项动词て形＋から＋后项动词
    constraints:
    - 语义与“动词て形＋动词”基本相同
    - “てから”不能在一个句子中反复使用两次以上
    contrasts:
    - 与“动词て形＋动词”语义基本相同，但“てから”有句中重复使用次数限制
  - pattern: 动词て形＋ください
    function_cn: 请求某人做某事
    formation: 动词て形＋ください
    constraints: []
    contrasts: []
  - pattern: 名词[场所]＋を＋动词
    function_cn: 表示经过的场所；与“出ます”“卒業します”等搭配时表示离开的场所
    formation: 场所名词＋を＋动词（如通ります、渡ります、過ぎます、出ます、卒業します等）
    constraints:
    - “を”与“出ます”“卒業します”等搭配时表离开场所
    contrasts: []
  - pattern: ～て
    function_cn: 连接相继发生的动作
    formation: 动词て形＋动词
    constraints:
    - 一般只连接两项或三项，连接过多难以理解
    - 需连接更多动作时改用 それから 衔接
    contrasts:
    - それか ら 用于在已用～て连接后追加更多动作
  - pattern: 汉字词／外来词＋します
    function_cn: 构成新的三类动词（サ变动词）
    formation: 汉字词或外来词＋します
    constraints:
    - 也可表达为 名词＋を＋します
    contrasts:
    - 与基本课文中 名词＋を＋します 同义
  - pattern: 駅前
    function_cn: 指车站周围的整个区域，不一定指车站正前方
    formation: 駅＋前
    constraints:
    - 需明确表示“车站前”时，在 駅 与 前 之间加 の，即 駅の 前
    contrasts:
    - 駅前（车站一带） vs 駅の 前（车站正前方）
  - pattern: なかなか
    function_cn: 表示程度的副词，后接肯定时表程度上乘，含实际比预想程度高的含义
    formation: 副词＋形容词／い形容词／名词＋です
    constraints:
    - 含评价对方含义，用于上级或长辈时给人不礼貌印象
    - 父母对孩子、上司对部下使用无问题
    - 一般用于说话人预想程度较低时
    contrasts: []
  - pattern: ～て くださいませんか
    function_cn: 请求的更礼貌形式，在一般请求「～てください」后加「ませんか」
    formation: 动词て形 + くださいませんか
    constraints: []
    contrasts: []
  - pattern: もう
    function_cn: 此处表示“马上/就要”，指事情即将发生而非已经结束
    formation: 副词，置于动词前
    constraints:
    - 句尾用「～ます」而非「～ました」
    contrasts:
    - 与第8课表示“已经”的「もう」区分
  - pattern: すみませんが、～
    function_cn: 请求前加歉意/麻烦语，表示因占用对方时间而不好意思（“麻烦你”）
    formation: 「すみません/すみませんが」+ 请求句
    constraints:
    - 家人或关系密切的朋友之间不使用
    contrasts:
    - 「すみません」本意为“对不起”，此处表“麻烦你”
  - pattern: そうして ください
    function_cn: 承接上文已说明的状态/动作，用指示词「そう」代替具体动词发出请求
    formation: そう + して ください
    constraints:
    - 用于指代前文已提及的动作或状态
    contrasts:
    - 与指示物品「これ/それ/あれ」区分，此处指动作/状态
  - pattern: お金を下ろします
    function_cn: 从银行或邮局账户中取出钱
    formation: 宾语 + を + 下ろします
    constraints: []
    contrasts:
    - 「下ろす」本义为将上面的东西取下来
  pragmatics:
  - 使用礼貌体（ます形/ください/お願いします）进行日常交际
  - なかなか 用于评价对方时需注意对象关系，对上级/长辈不礼貌
  - 「すみません」用于非亲密关系间的请求致歉
  - 对上级（課長）使用敬语与委婉请求（～ませんか）
  vocabulary_domains:
  - 购物与百货商店
  - 日常作息（起床、收听广播、就寝）
  - 外出与饮食
