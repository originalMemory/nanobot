  grammar:
  - pattern: AよりB（形容词/动词）
    function_cn: 比较级：A比B更……
    formation: 名词A＋より＋名词B＋形容词/动词
    constraints:
    - 用于两者比较
    - 形容词/动词用原形或否定形
    contrasts:
    - 与「AのほうがB」语义相近，后者强调B一方
  - pattern: AのほうがB
    function_cn: 比较级：A的一方更……
    formation: 名词A＋のほうが＋名词B＋形容词/动词
    constraints:
    - 用于两者比较
    - 「ほう」后接助词「が」
    contrasts:
    - 与「AよりB」可互换，语感侧重不同
  - pattern: Aほど～ではありません
    function_cn: 否定比较：不如A那样……
    formation: 名词A＋ほど＋形容词/动词否定形
    constraints:
    - 多用于否定比较
    - 肯定比较一般不用「ほど」
    contrasts:
    - 与「Aより～ない」语义接近
  - pattern: ～の中でいちばん
    function_cn: 最高级：在……中最……
    formation: 范围名词＋の中で＋いちばん＋形容词/动词
    constraints:
    - 用于三者及以上比较
    - 「いちばん」为副词
    contrasts:
    - 与「最も」近义
  - pattern: ずっと＋形容词
    function_cn: 程度副词：……得多（强调差距大）
    formation: ずっと＋形容词/动词
    constraints:
    - 修饰形容词或动词，表示程度差异大
    contrasts:
    - 与「かなり」「ずっと」程度副词区分
  - pattern: 名1 は 名2 より 一類形／二類形 です
    function_cn: 比较两个名词，表示名1比名2更具备形容词所表示的性质；程度差异较大时可用副词「ずっと」强调。
    formation: 名1 は ＋ 名2 より ＋ 形容词（一类形直接接续／二类形加です）
    constraints:
    - 用于肯定比较
    - 「より」接在比较基准名词后
    contrasts:
    - 与句型2「のほうが」相比，本句型直接以名1为主语陈述其更具备某性质
  - pattern: 名1 より 名2 の ほうが 一類形／二類形 です
    function_cn: 比较两个名词，表示与名1相比，名2更具备形容词所表示的性质。
    formation: 名1 より ＋ 名2 の ほうが ＋ 形容词（一类形／二类形加です）
    constraints:
    - 比较基准名1后接「より」
    - 被强调的名2后接「のほうが」作主语
    contrasts:
    - 与句型1相比，本句型以「のほうが」结构突出被比较对象
  - pattern: 名1 は 名2 ほど 一類形 く ないです／二類形 では ありません
    function_cn: 比较两个名词，表示名1不如名2具备形容词的性质；句尾必须使用否定形式。
    formation: 名1 は ＋ 名2 ほど ＋ 一类形词干＋くないです／二类形＋ではありません
    constraints:
    - 句尾强制否定
    - 「ほど」接在比较基准名词后
    contrasts:
    - 与肯定比较句型1、2相对，本句型表达程度不及
  - pattern: 名1 の 中で 名2 が いちばん 一類形／二類形 です
    function_cn: 在某一范围内表示名2最具备形容词的性质；名1为表示名2所属范围的名词。
    formation: 名1 の 中で ＋ 名2 が ＋ いちばん ＋ 形容词（一类形／二类形加です）
    constraints:
    - 用于三者及以上的最高级比较
    - 范围名词后接「の中で」
    contrasts:
    - 参考项：当名1表示场所或时间时，不用「の中で」，而用「名词[场所/时间] で いちばん 一類形／二類形 名2 は 名3 です」的句型
  - pattern: 名1と名2とどちらが 一類形／二類形ですか
    function_cn: 在两种事物中询问哪一种更具某形容词性质（二者选一）。
    formation: 两个名词用「と」并列，后接「どちらが」＋形容词（一類形／二類形）＋ですか。
    constraints:
    - 「どちら」用于二者选一；询问范围为三种以上时不可使用。
    - 回答倾向用「～のほうがが…」；两者程度相当时用「どちらも～です」。
    - 「どちら」在口语中有时说成「どっち」。
    contrasts:
    - 与语法点6（三者以上）相区别：本句型限定为两种事物。
  - pattern: どの 名／いつ／どれ／だれ／何が いちばん 一類形／二類形ですか
    function_cn: 在三个以上事物中询问哪一个最具某形容词性质（最高级疑问）。
    formation: 疑问词（どの＋名／いつ／どれ／だれ／何が）＋「いちばん」＋形容词（一類形／二類形）＋ですか。
    constraints:
    - 按询问对象选择疑问词：人用「だれが」，物用「どの～が」「どれが」或「何が」，时间用「いつが」。
    - 被选事物已见于上下文或存在于眼前时用「どの～が」或「どれが」，反之用「何が」。
    - 「いちばん」须有明确比较范围（如「～の中で」「～で」），与汉语“最”可无范围不同。
    contrasts:
    - 与语法点5相区别：本句型用于三者以上，疑问词随对象变化。
  - pattern: 最近（さいきん）
    function_cn: 表示从较近的过去到现在为止的一段时间；所指时长因说话人判断而异，不能表示将来的时间（与汉语“最近”不同）。
    formation: 时间副词，置于句首或谓语前。
    constraints:
    - 仅指过去到现在的期间，不可用于将来。
    contrasts:
    - 与汉语“最近”可表将来的用法不同。
  - pattern: ～が いいです
    function_cn: 根据上下文可表示选择（“…比较好”）或偏好（“我喜欢～”）等多种意思。
    formation: 名词＋が＋いいです。
    constraints:
    - 具体含义依赖上下文（选择 vs 喜好）。
    contrasts:
    - 与“～より…のほうが いいです”搭配可表比较偏好。
  - pattern: やっぱり
    function_cn: 较随便的说法，表示事态发展与自己预测一致（“果然”），或经过考虑最终确定某想法（“还是～”）。
    formation: 副词，置于句首或谓语前。
    constraints:
    - 用于日常谈话，语气较随便。
    contrasts:
    - 与较正式的“やはり”语体不同。
  - pattern: ～が…。
    function_cn: 说半句话时用接续助词“が”收尾，把后半句咽下；用于难以启齿或拒绝请求时，给对方委婉、含蓄的印象。
    formation: 句子成分＋が＋（省略后半句）。
    constraints:
    - 用于欲言又止、委婉拒绝或难以启齿的场合。
    contrasts: []
  - pattern: どちらが…
    function_cn: 在两者之间进行选择的疑问；当补充内容与前述内容有出入时也可用此结构引出。
    formation: 两者对象 + が + 形容词/动词
    constraints: []
    contrasts: []
  - pattern: どちらも…が…
    function_cn: 表示两者皆可/都好，并用「が」转折引出说话人个人的偏好。
    formation: どちらも + 肯定评价 + が + 个人偏好句
    constraints:
    - 「が」在此表轻微转折/让步
    contrasts: []
  pragmatics:
  - 「どちら」口语可替换为「どっち」
  - 「いちばん」必须搭配明确比较范围
  - “やっぱり”为较随便的日常说法
  - “～が…。”比把话说完更委婉含蓄
  - 场景为日式饭馆采访后边吃边聊，语体为礼貌体（です/ます）
  - 书信格式：称呼（小野さん）、正文、落款日期与署名（11月25日 李秀麗）
  - 使用自谦语（つまらない物、狭い庭、まだまだ）体现礼貌
  - 使用敬语/称赞语（お庭、お上手、ありがとうございます）
