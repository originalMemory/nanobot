  grammar:
  - pattern: い形容词肯定形（～いです）
    function_cn: 陈述事物性质或状态
    formation: 形容词词干 + いです
    constraints: []
    contrasts: []
  - pattern: い形容词否定形（～くないです）
    function_cn: 否定事物性质或状态
    formation: 形容词词干去い + くないです
    constraints: []
    contrasts: []
  - pattern: い形容词过去肯定（～かったです）
    function_cn: 陈述过去某时点的性质或感受
    formation: 形容词词干 + かったです
    constraints: []
    contrasts: []
  - pattern: い形容词过去否定（～くなかったです）
    function_cn: 否定过去某时点的性质或感受
    formation: 形容词词干去い + くなかったです
    constraints: []
    contrasts: []
  - pattern: 程度副词 とても
    function_cn: 表示程度高（非常）
    formation: とても + 形容词肯定形
    constraints:
    - 通常修饰肯定形式
    contrasts:
    - 与 あまり 的肯定/否定搭配相反
  - pattern: 程度副词 あまり
    function_cn: 表示程度低（不太）
    formation: あまり + 形容词否定形
    constraints:
    - 通常修饰否定形式
    contrasts:
    - 与 とても 的肯定/否定搭配相反
  - pattern: 名詞 は 一类形容词 です
    function_cn: 一类（い形容词）做谓语，词尾加です表示状态
    formation: 以い结尾的一类形容词直接接です
    constraints:
    - 仅用于一类形容词（い形容词）
    contrasts: []
  - pattern: 一类形容词 否定形式
    function_cn: 一类形容词做谓语时的否定
    formation: 词尾い变く，再加ないです或ありません
    constraints:
    - いい的否定为よくないです／よくありません
    contrasts: []
  - pattern: 一类形容词 过去形式
    function_cn: 一类形容词做谓语时的过去
    formation: 词尾い变かった，再加です；否定为く＋なかったです／く＋ありませんでした
    constraints:
    - 描述过去体验过的性质须用过去式
    - いい的过去为よかったです，过去否定为よくありませんでした
    contrasts: []
  - pattern: 一类形容词 ＋ 名词
    function_cn: 一类形容词直接修饰名词
    formation: 形容词直接接名词
    constraints:
    - 形容词与名词之间不能加の
    contrasts: []
  - pattern: を → は
    function_cn: 将宾语助词を前的名词转为话题，用于对比或强调
    formation: 把动词前的を替换为は
    constraints:
    - 用于话题化或对比语境
    contrasts: []
  - pattern: 助词「は」与「を」的替换限制
    function_cn: 用「は」构成肯定/疑问/否定句时，原「を」必须去掉，不可出现「×をは」的形式
    formation: N は Vます／Vますか／Vません
    constraints:
    - 与「を」互斥，不能叠加
    contrasts:
    - 话题用法 vs 对比用法
  - pattern: あまり＋否定
    function_cn: 表示程度不高（不太～）
    formation: 一类形容词词干＋くない／动词否定形，前接「あまり」
    constraints:
    - 必须与后文否定形式呼应
    contrasts:
    - 与「全然」程度更轻
  - pattern: 程度副词排序
    function_cn: 表示程度轻重：とても/たいへん ＞ 少し/ちょっと ＞ あまり～ません ＞ 全然～ません
    formation: 副词＋形容词/动词
    constraints:
    - 「あまり」「全然」须与否定呼应
    contrasts:
    - 汉语‘很’有时不表重，日语「とても」强调程度非常重
  - pattern: 多い／少ない
    function_cn: 数量形容词，不能直接修饰名词，需借助“たくさんの”等表达
    formation: 多い／少ない + たくさんの + 名词
    constraints:
    - 不同于其他一类形容词，不能单独修饰名词
    contrasts:
    - × 多い 本 → ○ たくさんの 本
  - pattern: ～用
    function_cn: 表示用途或使用者，相当于“～用的”
    formation: 使用者／用途名词 + 用
    constraints:
    - 前面一般为表示使用者或用途的词语
    contrasts: []
  - pattern: あら
    function_cn: 叹词，女性用于表达惊讶或疑惑不解
    formation: 独立使用
    constraints:
    - 由“あれ”变化而来
    contrasts: []
  - pattern: ～ないですか（否定疑问句）
    function_cn: 确认对方是否与自己持有相同看法的疑问句
    formation: 动词否定形 + ですか
    constraints:
    - 回答方式与汉语不同，‘はい’与‘いいえ’均可使用
    contrasts:
    - ‘はい’肯定对方否定形式的内容；‘いいえ’否定对方认为的肯定想法
  - pattern: ああ
    function_cn: 叹词，对提问或建议做肯定性回答或作为搭腔语
    formation: 独立使用
    constraints:
    - 搭腔语气比‘はい’或‘ええ’更重
    contrasts: []
  - pattern: ちょうど いい
    function_cn: 表示时间或分量等合适（正合适）
    formation: 副词+いい/いです
    constraints:
    - 用于时间、分量、温度、型号等‘恰好合适’的语境
    contrasts: []
  - pattern: お湯 / 水
    function_cn: 热水与凉水的词汇区分
    formation: 名词
    constraints:
    - お湯 指热水或开水，水 仅指凉水
    - 可说 熱いお湯、冷たい水，不能说 熱い水
    contrasts:
    - お湯（热） vs 水（凉）
  - pattern: 味道形容词
    function_cn: 甜/咸/酸/辣/苦的表达
    formation: 形容词：甘い、（塩）辛い、酸っぱい、辛い、苦い
    constraints:
    - 辛い 兼有‘咸’与‘辣’两义
    - 区分‘咸’可用 塩辛い 或 しょっぱい（しょっぱい 仅用于口语）
    contrasts:
    - 辛い（咸/辣） vs 塩辛い/しょっぱい（咸）
  - pattern: おいしい / まずい
    function_cn: 食物或饮料入口的整体味道感受（好吃/不好吃）
    formation: 形容词
    constraints:
    - 对象为食物或饮料（包括水）
    - 水也可说 おいしい水 / まずい水
    contrasts:
    - おいしい（好） vs まずい（不好）
  pragmatics:
  - ‘あら’为女性用语
  - 否定疑问句的‘はい’/‘いいえ’应答逻辑与汉语相反
  - ‘ああ’搭腔语气重于‘はい’/‘ええ’
  - お湯/水 的冷热语义限制
  - しょっぱい 的口语语域限制
  - 使用「どうぞ」礼貌地递物
  - 使用「ええ」「ああ」等应答词
