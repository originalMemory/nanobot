  grammar:
  - pattern: ～になる
    function_cn: 表示状态、身份、年龄、程度等的变化（自然变化或结果）
    formation: 形容词/名词 + に + なる（礼貌形 になります / 过去 になりました / 否定 になりません）
    constraints:
    - 用于描述主语自身发生的变化，非人为强制
    - 名词性变化需加 に（如 医者になる）
    contrasts:
    - 与 ～にする 区分：なる 偏自然/结果变化，する 偏人为使变化或决定
  - pattern: ～にする
    function_cn: 表示使某物/某状态变为某样，或主观决定做某事
    formation: 形容词/副词 + に + する（礼貌形 します / 请求 ～てください）
    constraints:
    - 强调人为施加或主观意愿
    - 可接请求形 ～てください
    contrasts:
    - 与 ～になる 区分：する 含人为/决定意味
  - pattern: 一类形容词 + くなります
    function_cn: 表示性质或状态的变化（自然变化，非意志性）
    formation: 一类形容词词尾「い」变为「く」，再加「なります」
    constraints:
    - 用于静止状态形容词表示变化
    - 与「くします」区分：本形式不强调主语意志性动作
    contrasts:
    - 与「一类形容词 + きます」对比：后者强调主语意志性动作引起变化
  - pattern: 一类形容词 + きます
    function_cn: 因主语意志性动作、作用而引起事物发生变化
    formation: 一类形容词词尾「い」变为「く」，再加「します」
    constraints:
    - 需有主语主动施加的动作或作用
    contrasts:
    - 与「くなります」对比：本形式强调意志性/主动性
  - pattern: 二类形容词／名词 + になります
    function_cn: 表示性质或状态的变化
    formation: 二类形容词或名词后接「に」，再加「なります」
    constraints:
    - 适用于二类形容词与名词
    contrasts:
    - 与一类形容词变化形式（く＋なります）接续不同
  - pattern: 二类形容词／名词 ＋ に します
    function_cn: 表示因主语意志性动作、作用等引起事物发生变化；也可用于点餐等场合，把已决定的事情告知对方。
    formation: 二类形容词原形或名词后接「に します」
    constraints:
    - 与同课语法解释2情况相同，强调主语意志性动作导致变化
    contrasts: []
  - pattern: 一类形容词 ＋ ほうが いです ／ 二类形容词 ＋ な ＋ ほうが いです
    function_cn: 比较两个以上事物的性质，认为其中一个较好时，表示自己的选择或向别人提议。
    formation: 一类形容词直接接「ほうが いです」；二类形容词加「な」后接「ほうが いです」
    constraints:
    - 用于比较两个以上事物并择其一为优
    contrasts: []
  - pattern: 自动词与他动词的对应
    function_cn: 他动词表示主语作用于宾语使其变化，宾语用「を」；自动词不带宾语，主语用「が」，表示自主动作或自然变化。部分自、他动词在词形上有对应关系。
    formation: 他动词＋宾语「を」；自动词＋主语「が」
    constraints:
    - 自动词表移动行为时，「を」表示经过点或起点，不表示宾语
    contrasts:
    - 「～なります」为自动词，「～します」为他动词
  - pattern: 声（こえ）／音（おと）
    function_cn: 区分人・动物发出的声音与物体发出的声音
    formation: 人・动物发声→声；物体发声→音
    constraints:
    - 与汉语“声音”统指不同，日语按发声主体区分
    contrasts:
    - 声 vs 音
  - pattern: まとめて
    function_cn: 把若干件汇总在一起（如一起买）
    formation: 动词连用形＋まとめて＋动词
    constraints:
    - 表示非单件而是数件合计处理
    contrasts: []
  - pattern: 3割引（さんわりびき）
    function_cn: 折扣表达，相当于汉语“七折”
    formation: 数字＋割引；百分比读作 パーセント
    constraints:
    - 日语用降价几成表示，与汉语用定价几成不同
    contrasts:
    - 割引 vs パーセント
  - pattern: 似合います（にあいます）
    function_cn: 相称、适合（自动词）
    formation: 人作话题：人は物が似合います；物作话题：物は人に似合います
    constraints:
    - 自动词，话题与助词搭配随主语是人或物而变化
    contrasts: []
  - pattern: 間もなく／もうすぐ
    function_cn: 表示“不久、一会儿”
    formation: 副词
    constraints:
    - 間もなく 较郑重、语气硬，可用于书面；もうすぐ 多用于口语
    contrasts:
    - 間もなく vs もうすぐ（语体/郑重度差异）
  - pattern: さらに / もっと
    function_cn: 表示“更加”的程度递进
    formation: 副词，修饰形容词或动词
    constraints:
    - さらに 语体较郑重
    - もっと 语体较随便
    contrasts:
    - さらに vs もっと 的语体差异
  - pattern: さあ
    function_cn: 向对方提出建议或促使对方做某事
    formation: 独立感叹/提示语，后接提议句
    constraints:
    - 仅用于口语
    contrasts: []
  pragmatics:
  - 称呼：息子（儿子）、お嬢さん（令爱）等敬称/谦称区分
  - 对顾客用郑重表达（間もなく），对亲近同事用口语（もうすぐ）
  - さらに 用于较郑重场合，もっと 用于较随便场合
  - 店员用麦克风招徕顾客的招呼语
  - 同伴间催促行动的提议（さあ、行きましょう）
