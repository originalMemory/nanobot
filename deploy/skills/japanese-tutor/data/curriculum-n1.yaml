  jlpt_estimate:
    status: unverified
  communication_functions:
  - 提问·征求意见
  - 礼貌地请求对方发表意见/赐教
  - 委婉提出不同意见（铺垫+转折）
  - 催促对方往下说：提出希望对方谈论的话题、等待对方开口、向对方提问等待回答
  - 用随声应答（はい／ええ／そうですね／なるほど）表示理解并促使对方继续说
  - 表达推测与确认的区别
  - 表达惊讶、恐惧、兴奋等情绪
  - 紧急时刻呼救与求助
  - 递进补充（不仅…而且…）
  - 附带补充参考信息（顺便）
  grammar:
  - pattern: ～はどうですか／～はいかがですか
    function_cn: 向对方询问某事、征求对方意见时的常用表达；前面需接具体问题内容，多用于会议、讨论、采访。
    formation: 名词/名词短语 + は + どう/いかが + ですか
    constraints:
    - 用于征询意见或询问状况
    - 需先说明所问的具体事项
    contrasts:
    - 比直接提问更礼貌、正式
  - pattern: ～はどう思いますか／～についてどのように思われますか
    function_cn: 征询对方对某事的看法、意见。
    formation: ～を/～は/～について + どう/どのように/何だと + 思いますか/思われますか/お考えですか
    constraints:
    - 用于征求看法
    - 思われますか/お考えですか 更敬
    contrasts:
    - 与 ～はどうですか 同属提问·征求意见功能
  - pattern: ～について／～に関して + ご意見を／お考えを + お願いします／お聞かせください
    function_cn: 更礼貌地请求对方发表意见或赐教。
    formation: 主题 + 关于 + 意见/考虑 + 请求动词
    constraints:
    - 敬语程度更高
    - 用于正式场合请求对方表态
    contrasts:
    - 比 ～はどう思いますか 更郑重
  - pattern: 提问前加铺垫性表达（表示理解/部分同意/赞赏对方意见）
    function_cn: 当提问中含有对对方意见的批评或保留时，先加缓冲性表达再提出不同看法，使语气委婉。
    formation: 先肯定/理解对方 + 转折 + 提出不同意见或询问
    constraints:
    - 用于含批评/异议的提问
    - 避免直接否定对方
    contrasts:
    - 与直接提问相比更顾及对方感受
  - pattern: ～に合う～
    function_cn: 表示适合、性质相符；修饰名词时用「～に合う」「～に合った」，二者意思无区别
    formation: 名词＋に合う／に合った
    constraints: []
    contrasts: []
  - pattern: 当初
    function_cn: 与「最初」「初め」同义但较正式；也可表示“刚……的时候”
    formation: 名词＋当初
    constraints: []
    contrasts:
    - 最初
    - 初め
  - pattern: これほど / これだけ
    function_cn: 作副词表示程度高，二者在例句中可互换且意思不变
    formation: 副词，修饰动词/形容词
    constraints:
    - 用于表示程度高
    contrasts:
    - これほど 与 これだけ 可互换
  - pattern: 引用部分谓语省略（～と / ～って）
    function_cn: 表示引用时，若能推测出谓语，可省略谓语直接接名词
    formation: 引用助词 ～と / ～って 后接名词
    constraints:
    - 需能由上下文推测出被省略的谓语
    contrasts: []
  - pattern: お＋[动词ます形去掉ます]＋です
    function_cn: 表示尊敬的敬语表达方式，多用于口语
    formation: お＋动词ます形去ます＋です
    constraints:
    - 能使用的动词有限，如 お帰りです／お持ちです／お考えです
    contrasts:
    - 与 お帰りになります／考えていらっしゃいます 等敬语表达相比更简洁
  - pattern: ものを見る
    function_cn: 含“实际运用视觉功能”与“观察事物”两层意思，もの 可指具体物品或事件等抽象事物
    formation: もの＋を＋見る
    constraints:
    - もの 不限于具体物品
    contrasts:
    - 类似用法：ものを言う（说话）、ものを考える（思考问题）
  - pattern: ポイント
    function_cn: 源自英语 point，意为“点”，多用于表示“要点、重点”
    formation: 名词
    constraints: []
    contrasts: []
  - pattern: チームを組む
    function_cn: 表示持有相同目的的人为做某事而组成一个团体；除与“チーム”搭配外，还可用于“バンドを組む”“漫才コンビを組む”等。
    formation: 名词（チーム／バンド／コンビ等）＋を組む
    constraints:
    - “組む”此处表示为共同目的组成团体，区别于一般组合。
    contrasts: []
  - pattern: ～ことで
    function_cn: 表示原因、理由、方法、手段等各种意思，实际含义由具体语境决定。
    formation: 动词（简体形式）＋こと＋で
    constraints:
    - 具体语义（原因／方法／手段等）需结合语境判断。
    contrasts:
    - 与“～ことによって”意思相近，但后者略书面化。
  - pattern: ～なしに（は）／～なしで（は）／～なくして
    function_cn: 表示 A 是实现 B 的必不可少的条件；A 处用表示动作的名词，B 处用表示不可能或否定的表达方式。
    formation: 名词（表示动作）＋なしに（は）／なしで（は）／なくして ＋ 否定／不可能表达
    constraints:
    - 可加入助词“も”构成“～もなしに”。
    - 没有“名词＋をなしにしては”的形式。
    contrasts: []
  - pattern: ～抜きに（は）／～抜きで（は）／～を抜きにしては
    function_cn: 表示某要素必不可少；句尾伴随否定，构成“～抜きに（は）／～抜きで（は）～できない”的表达方式。
    formation: 名词后接“抜きに（は）／抜きで（は）／を抜きにしては”，后接否定谓语。
    constraints:
    - 意思相近的表达还有“名词＋を抜きにしては”。
    contrasts: []
  - pattern: ～ないかぎり／～ないことには／～なくては
    function_cn: 表示不实现A的话，B就不会有所改变，即B会维持原有状态。
    formation: A部分为动词否定形（ないかぎり／ないことには／なくては），后接B。
    constraints:
    - B部分需要使用表示否定或困难等内容的词语。
    contrasts: []
  - pattern: ～えなかった
    function_cn: 表示可能（与“～することができた”同义），其否定过去形式“～えなかった”与“～することができなかった”意思相同。
    formation: 动词“ます形”去掉“ます”的形式＋える；前接“ある”“起こる”等动词可构成“ありえる”“起こりうる”等形式表示可能性。
    constraints:
    - 属较旧的表达方式，一般只用于书面语。
    - 有时“える”可替换为“うる”。
    - “ます形”、否定形式、过去形式等只能使用“～える”，即“～えます”“～えない”“～えた”等形式。
    - 否定形式（如“ありえない”“起こせない”）表示没有发生的可能性。
    contrasts:
    - 与“～することができた／～することができなかった”意义对应。
  - pattern: たしか
    function_cn: 副词，表示不能断定但推测大概是这样的情况
    formation: 接于句末或句中，表推测、记忆不确定
    constraints:
    - 与「確かに」易混：前者表不确定推测，后者表说话人认为非常明确、肯定
    contrasts:
    - たしか（推测/不确定） vs 確かに（确认/肯定）
  - pattern: 確かに
    function_cn: 副词，表示说话人认为非常明确、肯定
    formation: 接于句末或句中，表确认、强调事实
    constraints:
    - 与「たしか」易混：前者表肯定确认，后者表不确定推测
    contrasts:
    - 確かに（确认/肯定） vs たしか（推测/不确定）
  - pattern: キャー
    function_cn: 感叹词，小孩、女性惊讶时的高声喊叫；用于不知所措、恐惧，或非常高兴、兴奋时
    formation: 独立感叹语，后接说明情绪或状况的句子
    constraints:
    - 可表恐惧（如见鬼）、不知所措、兴奋（如见可爱事物）等多种情绪
    contrasts: []
  - pattern: 呼救表达（省略后半部分）
    function_cn: 紧急时刻呼救，省略完整请求句的后半部分，先说最重要词语
    formation: 如「だれか」（来自“だれか来てください”）、「救急車」（来自“救急車を呼んでください”）、「助けて」
    constraints:
    - 「だれか」用于询问是否有其他人在场，区别于「だれですか」「だれかいませんか」
    - 「救急車」因救护车本身即紧急所需，可单独使用表达清楚意思
    - 「助けて」用于自己面临危险时
    contrasts:
    - だれか（询问在场者） vs だれですか（问是谁） vs だれかいませんか（问是否有人）
  - pattern: 新闻报道文体（标题）
    function_cn: 标题用短小简练、一目了然的表达；助词、谓语常省略；常用倒装句或名词结句；过去事也用现在时；将来多用「～へ」；「～ても」等也常见。
    formation: 省略助词/谓语；倒装句；名词结句；「～へ」表将来
    constraints:
    - 新闻报道特有表现手法，不能用于论文、报告、商务书信等一般文章
    contrasts: []
  - pattern: 新闻报道句尾表达
    function_cn: 句尾基本用「～だ」「～である」；近来按报道性质也用「～です」「～ます」。
    formation: 「～だ」「～である」「～です」「～ます」
    constraints: []
    contrasts: []
  - pattern: 公历/数字书写方式
    function_cn: 竖排时有时用阿拉伯数字而非汉数字；用汉数字时“0”写作“〇”而非“零”；公历年份四位数常不写全（如1996年作“96年”、2007年作“07年”）。
    formation: 阿拉伯数字 / 汉数字（〇）/ 年份简写
    constraints: []
    contrasts: []
  - pattern: 気を揉む
    function_cn: 本意指夹在两手间使劲揉搓身体某部分；引申为形容如揉搓着心一样，表示担心这担心那、非常烦恼。
    formation: 「気を揉む」
    constraints: []
    contrasts: []
  - pattern: 万全の
    function_cn: “万无一失”之意；为名词，修饰名词时后接「の」。
    formation: 「万全の＋名词」
    constraints: []
    contrasts: []
  - pattern: ～をもとにする
    function_cn: 表示进行某种行为时的判断依据或判断素材
    formation: 名词＋をもとにする；作谓语时用～をもとにしている；接名词时用～をもとにした＋名词
    constraints: []
    contrasts: []
  - pattern: 相次ぐ
    function_cn: 表示陆续发生、接二连三发生，较郑重的书面语
    formation: 动词性用法，可作谓语或修饰
    constraints:
    - 书面语
    contrasts: []
  - pattern: ～まい
    function_cn: 文章用语，表否定推测或否定意志；～まいか表疑问/推测
    formation: 动词基本形＋まい；～まいか
    constraints:
    - 文章用语
    contrasts:
    - 否定推测义同～ないだろう
    - 否定意志义同～ないつもり
    - ～まいか同～ないだろうが，多用于说话人疑问
  - pattern: 2分（ぶ）
    function_cn: 表示整体的十分之一，用于描述比例/程度（如开花程度）；另有“五分五分”表示双方势均力敌、分不出优劣。
    formation: 数字＋分（ぶ）
    constraints:
    - 用于比例/程度的传统表达方式
    - “五分五分”特指双方均势
    contrasts: []
  - pattern: 飛び交う
    function_cn: 复合动词，比喻信息、谣言等交织流传、四处传播。
    formation: 飛ぶ＋交う（交错）构成的复合动词
    constraints:
    - 常与“情報（消息、信息）”“うわさ（谣言）”等语言活动相关词语搭配
    - 属比喻性表现手法
    contrasts: []
  - pattern: ～ずにはいられない
    function_cn: 表示出于自身欲望、情感等内在因素而不得不那样做，或自然而然成为那样情况。
    formation: 一类/二类动词ない形去ない＋ずにはいられない；三类动词する变せ＋ずにはいられない
    constraints:
    - 强调内在情感/欲望驱动
    contrasts:
    - 与“～ないわけにはいかない”区分：后者多表示外在因素/必然性义务
  - pattern: ～のみならず
    function_cn: 在A基础上补充B，表递进（不仅…而且…）
    formation: 可接名词（名词＋のみならず），也可接小句简体形（小句＋のみならず）；用于句首时变为「のみならず、～」
    constraints:
    - 最典型的书面表达方式
    - 可与「～だけでなく」「～ばかりでなく」互换，后两者口语书面皆可，「～ばかりでなく」稍书面化
    - 句首使用时对应「～だけでなく」变「それだけでなく」、「～ばかりでなく」变「そればかりでなく」
    contrasts:
    - ～だけでなく
    - ～ばかりでなく
  - pattern: ちなみに
    function_cn: 顺便、附带，用于补充与已陈述事情相关联的参考信息
    formation: 独立使用，引出补充说明
    constraints:
    - 非核心话题，说话人认为有必要补充说明时使用
    contrasts: []
  pragmatics:
  - 会议、讨论、采访等正式场合的提问用语
  - 敬语层级区分（思いますか / 思われますか / お考えですか / お聞かせください）
  - お＋动词ます形去ます＋です 为敬语表达，多用于口语
  - 呼救时省略完整句以快速传达关键信息
  - 根据语境选择「たしか」或「確かに」以准确传达确定程度
  - 「～のみならず」偏书面语，「～だけでなく」口语书面通用
