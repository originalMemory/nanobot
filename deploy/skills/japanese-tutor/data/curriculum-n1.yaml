  - 与「～といっても過言ではない」相同，用于阐述近乎言过其实的见解
  - 比「～といえる」委婉
  - 「～といってもいいのではないか」「～といってもいいのではないだろうか」更为委婉
  - ‘見える’（可以看到/看得见）与‘見られる’（条件性可见/自然现象）
  - ‘さまざま’与‘いろいろ’（语体差异）
  - 「いろいろ」与「さまざま」在副词用法上的差异
  - 可替换为「そんなに」「それほど」
  - 与汉语“一旦”用法不同，需注意区分两种含义
  - 与“～も～し，～も～”功能相同，可互换
  - 与真正的外来词相区别
