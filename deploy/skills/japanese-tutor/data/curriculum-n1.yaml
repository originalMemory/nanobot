  grammar:
  - pattern: ～ことができる
    function_cn: 表示能力或客观可能（会做某事／能做某事）
    formation: 动词辞书形＋ことができる
    constraints:
    - 用于表达说话人或他人具备某项技能或条件允许做某事
    - 与「～ます」礼貌体搭配，疑问句以「～ますか」结尾
    contrasts:
    - 与表示许可的「～てもいい」区分：前者表能力/可能，后者表允许
  - pattern: ～てもいいですか
    function_cn: 请求对方许可做某事
    formation: 动词て形＋もいいですか
    constraints:
    - 用于向对方确认某行为是否被允许
    contrasts:
    - 与「～ことができる」（能力/可能）区分
  - pattern: ～たいです
    function_cn: 表达说话人自身的愿望（想做某事）
    formation: 动词たい形＋です
    constraints:
    - 仅用于第一人称愿望，不用于描述他人
    contrasts: []
  - pattern: ～前に
    function_cn: 表示在某一动作发生之前（在…之前）
    formation: 动词辞书形＋前に
    constraints:
    - 后接主句动作，表示时间先后顺序
    contrasts: []
  - pattern: ～ことです
    function_cn: 说明某事的内容或爱好（是…）
    formation: 动词辞书形＋ことです
    constraints:
    - 用于陈述爱好、内容等
    contrasts: []
  - pattern: 动词基本形（辞書形）
    function_cn: 动词的基本形式，词典词条均用此形；由ます形去掉「ます」推导。
    formation: 一类动词：基本形末音为う段，ます形去ます后为い段；二类动词：基本形为ます形去ます后加「る」；三类动词：基本形为「来る」「する」，去ます后为「来」「し」。
    constraints:
    - 三类动词「来る」「する」为不规则对应，需单独记忆。
    contrasts:
    - 一类动词去ます后为い段，与基本形う段存在音便差异。
  - pattern: 名[人] は 動詞基本形 ことが できます
    function_cn: 表示能力（会做某事）。
    formation: 动词基本形 + ことが + できます。
    constraints:
    - 回答他人询问时，肯定可单用「できます」，否定可单用「できません」。
    contrasts: []
  - pattern: 名 は 動詞基本形 ことです
    function_cn: 当谓语部分的内容是一种动作、行为时使用该句型。
    formation: 动词基本形 + ことです。
    constraints: []
    contrasts: []
  - pattern: 动词基本形＋こと
    function_cn: 将动词名词化，起名词作用，可作主语、宾语等；可用名词或名词短语（如“名词＋の＋名词”结构）替代。
    formation: 动词基本形＋こと
    constraints:
    - 名词化后可被同义名词或名词短语替换，意义不变。
    contrasts: []
  - pattern: 动(基本形)前に、～
    function_cn: 表示某一动作在另一动作之前发生（“在……之前”）。
    formation: 动词基本形＋前に、＋主句；亦可用“名词＋の＋前に”形式。
    constraints:
    - 前项为先行动作，后项为后续动作。
    contrasts: []
  - pattern: 疑问词＋か
    function_cn: いつか／どこか／だれか／何か 等表示“某时／某地／某人／某物”，本身不表疑问，可用于陈述句。
    formation: 疑问词＋か
    constraints:
    - 与带强调助词的疑问形式（如 だれが）区分：前者表“某人/某物”不定指，后者表特指疑问。
    contrasts:
    - だれか（某人） vs だれが（是谁，特指疑问）
  - pattern: ～よね
    function_cn: 提出自己的意见、想法，以征求对方同意；语气比单独用ね更带主观推测。
    formation: 句末助词 ね＋よ 组合为 よね
    constraints:
    - 确信对方与自己意见完全相同时只用ね；对自己意见把握不足、需对方确认时用よね。
    contrasts:
    - ね（确信共识） vs よね（主观推测、求认同）
  - pattern: 动词基本形＋ことが できます
    function_cn: 基本表示可能；依上下文关系也可表示允许，否定形（できません）表示不允许
    formation: 动词基本形＋ことが できます／できません
    constraints:
    - 允许义需依赖上下文（如规章、条件等）
    contrasts: []
  - pattern: ～みんなで
    function_cn: 表示动作主体的样态/范围（如一个人、自己、全体人员）
    formation: 名词（主体）＋で
    constraints:
    - 此处「で」表示动作主体的样态
    contrasts: []
  - pattern: 趣味 与 興味 的区分
    function_cn: 「趣味」指爱好、喜好；「興味」指兴趣，二者不可混用
    formation: 名词，常与「は…です」「に 興味があります」搭配
    constraints:
    - 表示兴趣时用「興味」，表示爱好时用「趣味」
    contrasts:
    - 趣味＝爱好/喜好；興味＝兴趣
  - pattern: ごちそうします
    function_cn: 请别人吃饭（让对方品尝自己做的饭菜）
    formation: ごちそう（奢华高级菜肴）＋する 的礼貌形
    constraints:
    - 用于请客、招待用餐的语境
    contrasts: []
  pragmatics:
  - 肯定回答可省略主语与「ことが」，单用「できます」；否定可单用「できません」。
  - ね 与 よね 在确信度与主观性上的语用差异
  - 「ことが できます」的允许义依赖上下文（国家规章、宿舍条件等）
  - 使用敬体（です・ます）进行日常交际
  - 邀请与请求的礼貌表达
  - 使用敬体（ます形）进行邀请与点单
  - 用「ごちそうしますよ」表示请客
  - 用「～にします」表示点菜决定
  - 用「すみません」引起注意后追加订单
