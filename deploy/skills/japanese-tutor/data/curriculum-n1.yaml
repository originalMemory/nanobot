  grammar:
  - pattern: ～からなる
    function_cn: 表示“由……构成”，用于正式场合及书面语
    formation: 名词＋からなる
    constraints:
    - 书面语/正式语体
    contrasts: []
  - pattern: ～とみられる
    function_cn: 以观察到的事情、事实为基础进行推测
    formation: 动词简体形＋とみられる；名词＋とみられる
    constraints:
    - 有时也用～とみられている、～とみてよい的形式
    contrasts: []
  - pattern: 拟态词（だぶだぶ、ゆったりした）
    function_cn: 象声词/拟态词，描述状态或感觉
    formation: 拟声语（拟声词）与拟态语（拟态词）
    constraints:
    - 本课以拟态语为重点讲解
    contrasts: []
  - pattern: 拟声词/拟态词 + と
    function_cn: 以「～と」形式作副词修饰动词，表示声音或状态
    formation: 拟声词/拟态词后接助词「と」
    constraints:
    - 拟声词一般用片假名书写，拟态词可用平假名或片假名
    contrasts:
    - 拟声词直接模拟人/物/动物发出的声音；拟态词用类似拟声词的形式描摹状态、动作或感觉
  - pattern: 拟态词 + する
    function_cn: 以「～する」形式作动词使用
    formation: 拟态词后接「する」
    constraints:
    - 拟态词除直接作副词外，还可作名词、形容词或动词使用
    contrasts: []
  - pattern: 拟态词 + だ（名词化）
    function_cn: 加「だ」构成名词形式，如「だぶだぶだ」
    formation: 拟态词后接「だ」
    constraints:
    - 表示衣服过于肥大等样子，作名词使用
    contrasts: []
  - pattern: ゆったり + 名词 / 动词
    function_cn: 表示宽宽大、有富余，或不慌不忙、不紧不慢的样子；可修饰名词（前接き形式）或作副词
    formation: 「ゆったりした」修饰名词；「ゆったり」作副词
    constraints:
    - 两种语义：①宽宽大、有富余；②不慌不忙、不紧不慢
    contrasts: []
  - pattern: 象声词按词形分三类，接续与功能不同
    function_cn: 描述动作、状态、心理或形状
    formation: ①修饰固定动词（如～と/～ら+行く/歩く、～のろのろ+歩く/走る/進む、～じろじろ+見る、～がみがみ/ぶつぶつ+言う；本身已带～と形式的如～じっと+見る、～せかせと+働く、～さっさと+帰る/歩く）；②以～する形式作动词，分描述形状、描述动作样子、描述心理状态三类；③多以～だ/で或～の+名词形式使用（如ぴったり、だぼだぼ、ぶかぶか）
    constraints:
    - ①类所修饰动词较为固定，不可任意搭配
    - ③类可接名词构成修饰语（～の+名词）
    - 三类用法并非固定不变，①②用例中也有可改用③用法的
    contrasts:
    - ①与②的区别在于是否以～する作动词；③则用于形容词性/名词性修饰
  - pattern: 極めて
    function_cn: 副词，表示程度高，书面语
    formation: 接于形容词/形容动词/副词前，作程度修饰
    constraints:
    - 标注为书面语
    - 与「非常に」「たいへん」「とても」同属程度副词，但「極めて」程度更高且多用于书面语，「たいへん」「とても」主要用于口语
    contrasts:
    - 非常に
    - たいへん
    - とても
  - pattern: ～に見える／～に見られる
    function_cn: 表示名2的特征或状态显现于名1上
    formation: 名1＋に＋名2＋に見える／見られる
    constraints:
    - 助词「に」表示特征显现之处，与表场所的「に」用法相同
    - 多用被动形式「～に見られる」
    - 报纸标题等也常用「～に見える＋名词」形式
    contrasts: []
  - pattern: ～は～に限られる
    function_cn: 表示名1所做的事限定于名2
    formation: 名1＋は＋名2＋に限られる
    constraints:
    - 用于限定使用对象、场合或范围
    contrasts: []
  - pattern: 見直す
    function_cn: 动词，含多重含义
    formation: 他动词/自动词用法，接于「～を」或独立使用
    constraints:
    - 义项①：为了确认而重新审视
    - 义项②：对计划等再次研究
    - 义项③：承认迄今没（做）——页面底部截断，完整表述待核
    contrasts: []
  - pattern: ～というより（は），～ということだ
    function_cn: 对前句轻微否定，强调后句状态更强；名词或二类形容词接续用「～というより（は），～だ」
    formation: 小句1（简体）＋というより（は），小句2（简体）＋ということだ
    constraints:
    - 前句为名词或二类形容词时改用「～というより（は），～だ」
    contrasts: []
  - pattern: 一度～たら最後，二度と～ない
    function_cn: 表示一旦达到前状态后，后事绝不可能发生；「最後」强调造成前状态意义重大
    formation: 一度＋动词/形容词＋たら最後，二度と＋否定
    constraints:
    - 「たら」有时可用「だが」替代
    contrasts: []
  - pattern: ～ことのないように
    function_cn: 表示避免某事发生；由「～ことがある」（某事时有发生）的否定形式「～ことがない」派生
    formation: 动词基本形＋ことがない＋ように
    constraints: []
    contrasts:
    - 与「～ことがある」（初级第31课）相对
  - pattern: ～ことがないように / ～ことのないように
    function_cn: 表示“不要那样”，用于希望避免某事发生；两种形式可互换。
    formation: 动词连体形/名词 + ことがないように；～ことのないように
    constraints:
    - 用于表达避免、杜绝某事发生的愿望或要求。
    contrasts:
    - ～ことがないように 与 ～ことのないように 同义可替换。
  - pattern: ～たいものだ
    function_cn: 三种含义：①表示过去重复做的事；②表示理所当然；③表示感动。其中③还含“～たいものだ”表示说话人充满感慨、表达希望的用法。
    formation: 动词たい形 + ものだ
    constraints:
    - 用于表达感慨、愿望或感叹。
    contrasts:
    - 与 ～てほしいものだ 形式并列，均表感慨/希望。
  - pattern: ～てほしいものだ
    function_cn: 与 ～たいものだ 并列，表达说话人充满感慨、希望某事如此。
    formation: 动词て形 + ほしいものだ
    constraints:
    - 用于表达愿望、感慨。
    contrasts:
    - 与 ～たいものだ 同属感慨/希望用法。
  - pattern: ～た vs ～ていた
    function_cn: 表示过去动作/事件时，～た 可理解为时间轴上的某一点（单纯过去）；～ていた 则具有一定时间长度的“线”（持续状态）。
    formation: 动词た形；动词て形 + いた
    constraints:
    - ～ていた 为单句时仅表示动作行为持续有一定时间长度。
    - 用于文章中时，因前后文关系，有时句子会不合适，需结合上下文判断。
    contrasts:
    - ～た 强调动作/事件在时间轴上的某一点；～ていた 强调持续状态/一定时间长度。
  - pattern: 〜ていく / 〜てくる
    function_cn: 表示随时间推移而逐渐变化的状态或趋势；可结合过去、现在、未来等不同基准时间使用，不限于现在。
    formation: 动词て形＋いく／くる
    constraints:
    - 强调从某一基准时间点开始向某方向渐变的过程
    - 基准时间可为过去、现在或未来
    contrasts:
    - 与表示瞬间或一次性完成的点动作相区别
  - pattern: 〜ようになる
    function_cn: 表示经过某事或某段时间后，状态或习惯发生转变并持续；焦点放在转变后的持续状态。
    formation: 动词／形容词等＋ようになる
    constraints:
    - 强调转变之后状态仍在延续
    - 与仅表示过去某时点发生过一次的点动作表达相区别
    contrasts:
    - 与单纯过去式点动作表达对比：后者仅表示曾经发生，前者表示此后形成并持续的状态
  - pattern: 〜ていた（持续/进行）与点动作的衔接
    function_cn: 具有一定时间长度的动作与瞬时点动作在时间轴上的衔接处理。
    formation: 动词て形＋いた
    constraints:
    - 持续动作与点动作难以直接衔接时，可处理为时间轴上连续的两个点
    - 若点动作发生在持续动作的时间范围内，则衔接成立
    contrasts:
    - 与瞬时动作＋点动作的并列描述对比
  - pattern: 「～にする」の形の慣用表現
    function_cn: 以「～にする」构成的惯用表达，表示暴露、说出口、解雇、意见不同、获得/拥有、置于次要、撕毁约定、淘汰、无意中听到等特定动作或状态
    formation: 名词/动词词干 + にする（惯用搭配）
    constraints: []
    contrasts: []
  pragmatics: []
