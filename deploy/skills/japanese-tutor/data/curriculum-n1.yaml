  - 西長安街／留守にします
  similar_contrasts:
  - 与「～ながら」（边…边…，主动同时）不同，「～たまま」强调状态未被处理地延续。
  - 与「～だろう」（主观推测）相比，「はず」更依赖客观依据或常理。
  - 与「～が」「～けど」意思相近，但后两者前后小句独立性强，「小句1」句尾可用「～です」「～ます」「～でしょう」，且「小句2」可为命令句。
  - はずです（肯定推断）
  - が
  - のに
  - 「～ですから」语气较强
  - 简体「～だもの」带撒娇语感，多用于小孩与部分女性
  - 与“すぐ”语义相近，但“早速”带积极主动语感，不可用于客观描述。
