  grammar:
  - pattern: ～たまま
    function_cn: 表示保持前项动作或状态不变，继续做后项动作（常含疏忽、未处理的语感）。
    formation: 动词た形／形容词・形容动词连体形／名词＋のまま＋动词
    constraints:
    - 前项多为可被改变却未被改变的状态（如开着、放着、穿着等）。
    - 后项常与「しまう」「寝る」等搭配，强调状态延续下的结果。
    contrasts:
    - 与「～ながら」（边…边…，主动同时）不同，「～たまま」强调状态未被处理地延续。
  - pattern: ～はず／はずがない
    function_cn: 基于客观依据或常理进行推测；「はずがない」表示按道理不可能、理应不会。
    formation: 动词辞书形／形容词・形容动词连体形／名词＋はず（＋です）；否定推测用「～はずがない／はずはありません」。
    constraints:
    - 说话人依据已知事实或逻辑作出判断，语气较有把握。
    - 「はずがない」用于否定推测，强调按情理不应发生。
    contrasts:
    - 与「～だろう」（主观推测）相比，「はず」更依赖客观依据或常理。
  - pattern: 小句1（动词た形／ない形）＋まま，小句2；名词＋の＋まま，小句
    function_cn: 表示将理应改变的状态保持原样，进而进行另一动作（常含疏忽、未做应做之事）。
    formation: 「まま」前为肯定时用动词た形，否定时用动词ない形；前接名词时用「名词＋の＋まま」。
    constraints:
    - 「まま」前不能使用敬体形（如「つけましたまま」为误用）。
    contrasts: []
  - pattern: 小句1（简体形）＋のに，小句2
    function_cn: 表示在「小句1」情况下发生的「小句2」不符合常识常理，含转折、意外或不满语气。
    formation: 「のに」前用简体形；二形容词小句与名词小句需用「二形容词／名词＋な＋のに」。
    constraints:
    - 「のに」前一般不用敬体形（如「入れましたのに」为误用）。
    - 前后两个小句独立性弱，「小句1」句尾不可用「～です」「～ます」「～でしょう」等，「小句2」也不可为祈使、请求句式。
    contrasts:
    - 与「～が」「～けど」意思相近，但后两者前后小句独立性强，「小句1」句尾可用「～です」「～ます」「～でしょう」，且「小句2」可为命令句。
  - pattern: はずです
    function_cn: 根据某种理由做出肯定性推断，对所推测内容非常有把握；也可用于说话人自身经历过但记忆不十分准确，或实际情况与自己的考虑不一致。
    formation: 二类形容词小句：二类形容词+な+はずです；名词小句：名词+の+はずです；动词/一类形容词小句直接接はずです。
    constraints:
    - 需有明确理由/依据支撑推断
    - 把握程度高于 mere 推测
    contrasts: []
  - pattern: はずがありません（＝はずはないです）
    function_cn: 根据某种理由做出否定性推断，表示不可能/不应该。
    formation: 二类形容词小句：二类形容词+な+はずがありません；名词小句：名词+の+はずがありません；动词/一类形容词小句直接接はずがありません。
    constraints:
    - 是はずです的否定形式
    - 需有理由支撑否定推断
    contrasts:
    - はずです（肯定推断）
  - pattern: が vs のに（转折对比，本页顶部示例）
    function_cn: が 表客观/让步转折；のに 表主观不满、意外或责备。本页示例中请求开窗语境下用「寒いが」为正确，「寒いの に」被标为错误。
    formation: 形容词/动词后接が 或 のに 表转折。
    constraints:
    - 本页该对比为上一编号（2）的延续，标题未在本页出现
    contrasts:
    - が
    - のに
  - pattern: 目覚ましをかける
    function_cn: 设定闹钟（上闹钟）；「目覚まし」为「目覚まし時計」的省略说法，同义表达还有「目覚ましをセットする」「アラームをセットする」
    formation: 名词「目覚まし」+ を + かける/セットする
    constraints: []
    contrasts: []
  - pattern: ～んですもの（～ですもの）
    function_cn: 句尾形式，表示原因、理由；语气较「～ですから」弱，多用于关系密切者之间，常带申明自身行为正当的语感，使用者多为女性
    formation: 简体/普通形 + んですもの / ます形去ます + んですもの
    constraints:
    - 多用于与说话人自身相关的理由
    contrasts:
    - 「～ですから」语气较强
    - 简体「～だもの」带撒娇语感，多用于小孩与部分女性
  - pattern: せっかく～のに
    function_cn: 表示对自己或对方的付出未获相应回报、未达预期效果时的惋惜、遗憾心情
    formation: せっかく + 动词た形/名词 + のに
    constraints:
    - 需与「のに」呼应使用
    contrasts: []
  - pattern: こちらこそ
    function_cn: 应答/寒暄：对方致意、致谢或道歉时，表示“彼此彼此／是我这边才该如此”的回应。
    formation: 独立应答语，常与“いえ”连用（いえ、こちらこそ）。
    constraints:
    - 用于回应对方“どうぞよろしくお願いします”等致意语。
    - 用于回应对方道歉（如“すみませんでした”），表示“不值得道歉／是我这边失礼”。
    contrasts: []
  - pattern: 早速（さっそく）
    function_cn: 副词：表示迅速、立刻进行某种行为，强调说话人/听话人积极主动地开始行动。
    formation: 副词，修饰动词；书信中可作“早速ですが／早速のお返事”等惯用开头。
    constraints:
    - 倾向表达主观积极行动，不用于客观描写。
    - 书信习惯用法中不能用“すぐ”替代。
    contrasts:
    - 与“すぐ”语义相近，但“早速”带积极主动语感，不可用于客观描述。
  pragmatics:
  - 对他人疏忽行为表示关切与劝告（如「お大事に」）。
  - 以身份/职责为依据委婉指出对方行为不合常理。
  - 推断类表达可用于记忆模糊或实际与预期不符的情境
  - 「～ですもの」使用者多为女性，带申明正当性语感
  - 「～だもの」带撒娇语感
  - “こちらこそ”在道歉语境中省略了“すみませんでした”，表示己方失礼的歉意。
  - “早速”在书信中为固定习惯用法，体现礼貌与积极态度。
  - 商务电话中的敬语与寒暄
  - 「預かる（保管）」「留守にする」「外出中」等商务场景表达
