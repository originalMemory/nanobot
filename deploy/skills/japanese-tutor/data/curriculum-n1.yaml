  themes:
  - 18 売り込み
  - 语法与表达
  - 协调意见分歧
  - 注解式表达
  - 意见不同时的说法
  - 陈述意见时使用的连词
  - 1. 对顾客的用语
  - 2. とおっしゃいますと
  jlpt_estimate:
    status: unverified
  communication_functions:
  - 商品説明の締めくくり（「～以上です。いかがでしょうか。」）
  - 相手の懸念への同意と補足説明（「確かにおっしゃるとおりです。…でも、…」）
  - 自社製品・新商品の提案（「弊社では…をベースにした…もご用意しています。」）
  - 試飲・サンプルの提示（「サンプルをお持ちしました。」）
  - 相手の評価への感謝（「ありがとうございます。」）
  - 协调意见分歧
  - 注解式表达（对发言加解释）
  - 意见不同时委婉陈述
  - 客气地表示对自己措辞没信心（うまく言えませんが…）
  - 陈述意见时按关系选择连词（补充/部分认同/对立）
  - 对顾客使用商业敬语与客气询问
  - 确认对方真实意图或请求重复
  - 商务书信（手紙）的格式与寒暄：拝啓／敬具、新春问候、自我介绍、说明来意、请求会面与电话联络、结尾敬语
  - 书信格式与敬称规则
  - 季节问候寒暄
  - 书信结构：正文（书写想传达的内容）
  - 文末文（主要意图、祝愿健康等寒暄）
  - 结束语（与开头语「拝啓」对应「敬具」）
  - 署名（联名信从地位最高者开始依次书写）
  - 向对方公司提出请求或致歉时的敬语铺垫
  - 对对方公司、人物状态使用尊他语
  - 提出有负担的客气请求
  - 自谦表达（抬高对方/尊敬听话人）
  - 致歉（给他人添麻烦）
  - 自谦表达（告知、联系、送别等动作的谦让说法）
  - 时间指称（最近/这次）
  - 迅速着手/寄送某事（书信）
  - 补充说明事项
  - 礼貌地邀请对方询问不清楚之处
  - 客气地鼓励对方采取某行为（如顺道拜访）
  grammar:
  - pattern: 簡単に／正直に／率直に／分かりやすく／短く ＋ 言えば／言うと／言ったら／言って
    function_cn: 对发言内容加以解释、补充说明的注解式表达
    formation: 副词性修饰语（简单地／老实／坦率／平易／简短）接在「言う」的连用形或假定形前，构成「～て言えば／～て言うと」等
    constraints:
    - 「実際」「正直」等可后接「のところ」构成「実際のところ」「正直なところ」
    - 「実際」「正直」也可直接修饰句子
    contrasts: []
  - pattern: 先接受对方意见＋转折（～に基本的に賛成なのですが、～／～と思います。ですが、～）
    function_cn: 意见不同时有所顾虑地陈述意见，先铺垫再表达自己看法
    formation: 肯定对方意见的句式后接「ですが」等转折
    constraints:
    - 用于说话内容可能对对方不利或失礼时，为顾及对方感受做铺垫
    contrasts: []
  - pattern: 句尾省略／模糊处理（ちょっと（有点儿）等）
    function_cn: 省略部分句尾使语气委婉，降低否定或拒绝的强度
    formation: 在句尾用「ちょっと」等模糊表达，或省略「口に合わないかもしれない」之类内容
    constraints:
    - 当说话内容对对方不利时，用「少し」「あまり～ない」「ちょっと」等降低程度
    contrasts: []
  - pattern: それに／しかも／さらに
    function_cn: 补充同类内容（递进、追加）
    formation: 接续于陈述句后，表示在原有内容上追加同类信息
    constraints: []
    contrasts: []
  - pattern: ただ／ただし／もっとも
    function_cn: 陈述不同意见（部分认同对方观点后转折）
    formation: 用于先承认对方说法，再提出保留或不同看法
    constraints: []
    contrasts:
    - 与完全对立的连词区分
  - pattern: でも／けれども／しかし
    function_cn: 与对方所述观点对立（转折、让步）
    formation: 表示前后内容相反或对立
    constraints: []
    contrasts:
    - 与部分认同类（ただ／ただし／もっとも）区分
  - pattern: いかがですか／～でしょうか
    function_cn: 对顾客/对方的客气询问方式（商业敬语）
    formation: 疑问词不用「どうですか」，改用「いかがですか」；以「～でしょうか」代替「～ですか」以减弱强加感
    constraints:
    - 用于对顾客或需特别礼貌的场合
    contrasts:
    - どうですか（较随意）
    - ～ですか（较直接）
  - pattern: お気に召す／お持ちする
    function_cn: 将普通动词（好き／持ってくる）转换为敬语表达
    formation: 对顾客使用谦让/尊敬语替代日常说法
    constraints:
    - 商业敬语场合
    contrasts:
    - 好き（普通）
    - 持ってくる（普通）
  - pattern: とおっしゃいますと
    function_cn: 反问式确认：听清对方话但推测不出真正意思，请求澄清
    formation: 由「という」＋「おっしゃる」的尊敬语构成，省略「それはどういうことですか」后半句
    constraints:
    - 尊敬语表达；非敬语时直接说「という」
    contrasts:
    - という？（非敬语）
  - pattern: 何とおっしゃいましたか／もう一度ゆっくりおっしゃってくださいませんか
    function_cn: 没听清对方话时礼貌请求重复
    formation: 用「すみません」开头＋尊敬语请求
    constraints:
    - 礼貌请求对方再说一遍
    contrasts: []
  - pattern: 当＋名词
    function_cn: 直接修饰名词，表示“这个／那个／当前的／现在正谈到的”等意思，常用于比较郑重的场合；表示“自己所属的这个”时含有自谦的意思。
    formation: 当＋名词（如 当ホテル、当店、当劇場）
    constraints:
    - 用于郑重场合
    - 表所属时带自谦语感
    contrasts: []
  - pattern: 名词＋では
    function_cn: 名词后接表示场所的助词“で”，再接助词“は”构成的形式；“は”表示与别的事物做对比，强调对比场所。
    formation: 名词＋で（场所）＋は（对比）
    constraints:
    - “は”承担对比功能
    contrasts: []
  - pattern: ～てくる／～ていく 与 ～ている 等组合
    function_cn: “～てくる”“～ていく”可与“～ている”等一起构成“多くなる＋～てくる＋～ている”等形式；全部一起使用情况不多见，但多种表达形式搭配使用时排列顺序基本固定。
    formation: 按 Ⅰ 复合动词（し始める／し続ける等）→ Ⅱ ～てくる／～ていく → Ⅲ ～てしまう → Ⅳ ～ている／～つつある 的顺序排列
    constraints:
    - 排列顺序固定为 Ⅰ→Ⅱ→Ⅲ→Ⅳ
    - 表中同一行的表达形式不能一起使用
    contrasts: []
  - pattern: 好む／好まれる
    function_cn: 表示喜欢某物（好む）及受欢迎、受喜爱（好まれる，被动形式）
    formation: 好む：物＋を＋好む；好まれる：物＋は／が＋人＋に＋好まれる
    constraints:
    - 好む主要用于文章，属较正式表达
    - 好まれる为被动形式，表示受欢迎
    contrasts:
    - 好む（主动，喜欢某物）与好まれる（被动，受喜爱/受欢迎）的区别
  - pattern: ～とおりだ
    function_cn: 表示与前面提及的内容相同，如“希望とおり”
    formation: 动词（简体形式）＋とおり＋だ；亦可接动词敬体形式
    constraints:
    - 「とおり」为名词
    - 后续「に」修饰谓语，「の」修饰名词，「だ／です」充当谓语
    contrasts:
    - 与「名词＋どおり」意思相同
  - pattern: 弊社
    function_cn: 自谦表达，指自己公司，常用于商务活动场合
    formation: 后续组织名称
    constraints:
    - 同义用语还有「小社（敝公司）」
    contrasts: []
  - pattern: ～を～にした～／～を～とした～
    function_cn: 表示以 B 为原料、基础、中心、标准等，A 表示 B 的内容
    formation: AをBにした＋名词／AをBとした＋名词
    constraints:
    - B 使用「もと（原料、基础）」「中心（中心）」「基準（标准）」等表示来源、材料或基准等意义的名词
    contrasts: []
  - pattern: 新～
    function_cn: 接名词表示新出现的事物/概念（如新感觉、一年级新生）
    formation: 「新」+ 名词
    constraints: []
    contrasts: []
  - pattern: ～ほう
    function_cn: 选择性逐个提及，比较意味较浓；区别于表示比较的「～より～(の)ほうが～」
    formation: 名词/指示词 + の + ほう
    constraints:
    - 用于两种以上事物中挑选说明
    contrasts:
    - 「～より～(の)ほうが～」
  - pattern: こちら
    function_cn: 说明两种以上事物时含指示方向语感，对比意义更明显
    formation: 指示词
    constraints: []
    contrasts:
    - 「これ」
  - pattern: 置く
    function_cn: 动词，此处指作为商品摆放/销售（如バーに置く）
    formation: 动词
    constraints:
    - 区别于一般「放」「搁」义
    contrasts: []
  - pattern: 书信结构八要素
    function_cn: 书信的固定组成顺序：日期、收信人姓名+尊称、开头语、问候语、正文、末文、结束语、署名。
    formation: 按固定顺序排列各要素
    constraints:
    - 礼节性信件日期可用『○年○月吉日』『○年元旦』等不写具体日期的写法
    contrasts: []
  - pattern: 收信人尊称选择
    function_cn: 根据收信人身份选择敬称后缀。
    formation: 姓名/名称 + 様／殿／御中／先生
    constraints:
    - 一般用『様』
    - 公函用『殿』
    - 机关团体用『御中』
    - 恩师用『～先生』
    contrasts:
    - 様 vs 殿 vs 御中 vs 先生 的适用对象不同
  - pattern: 开头语『拝啓』
    function_cn: 注重格式的书信开头写『拝啓』，换行写问候语；有行数限制时可在开头语后空一两字接着写问候语。
    formation: 拝啓 + 换行 + 问候语
    constraints:
    - 受行数限制时可省略换行直接续写问候语
    contrasts: []
  - pattern: 季节寒暄语（问候语）
    function_cn: 问候语中写符合季节的寒暄语，每季节可用寒暄语固定；之后接『いかがお過ごしでしょうか』『お元気でお過ごしのことと存じます』等。
    formation: 『～の候』『～（の）季節となりました』等季节表达 + 近况问候
    constraints:
    - 寒暄语须与季节匹配（春：桜の美しい季節となりました／春暖の候；夏：暑い日が続きますが／青葉の候 等）
    contrasts:
    - 不同季节使用不同固定寒暄语，不可混用
  - pattern: ～におかれましては
    function_cn: 书信/函件中表达敬意的「～は」的礼貌说法，用于提及对方处境
    formation: 名词/名词短语 + におかれましては
    constraints:
    - 用于书信等书面敬语场合
    contrasts:
    - 口语/一般主语句用「～は」
  - pattern: ～ことと存じます
    function_cn: 「～と思います」的自谦/礼貌说法，表示推测、体谅对方心情，用于信件等书面表达
    formation: 一类形容词 + なことと存じます；名词 + のことと存じます
    constraints:
    - 「存じる」为「思う」的自谦语，通过降低自己表达尊敬
    - 用于信件等书面表达
    contrasts:
    - 「～と思います」的礼貌/自谦对应形式
  - pattern: 助词「で」（动作主体）
    function_cn: 表示动作主体时，指组织内成员在该组织内实施某种行为，由此表示该组织发挥的作用；可与「では」互换。
    formation: 名词（组织）+ で + 动词
    constraints:
    - 用于组织内成员实施行为、表示组织作用的情形
    contrasts:
    - 「で」与「では」在此用法中意思相同
  - pattern: 「御社」
    function_cn: 由表示公司的「社」加敬称「御」构成，意为“贵公司”，是尊称对方公司的尊他语，用于商业活动；有时也用「貴社」。
    formation: 「御」+「社」
    constraints:
    - 对方为银行时用「御行」或「貴行」，为学校时用「貴校」
    - 对自己所在的公司用自谦表达「当社」「弊社」
    contrasts:
    - 尊他「御社/貴社」与自谦「当社/弊社」相对
  - pattern: 「お詳しい」
    function_cn: 由形容词「詳しい」前接表示尊敬的「お」构成，对听话人或话题中谈及的人物状态表示尊敬。
    formation: 「お」+ 形容词「い」
    constraints:
    - 用于对听话人或话题人物的状态表尊敬
    contrasts:
    - 同类敬称形式如「お忙しい」「お美しい」
  - pattern: 「急なお願い」与「勝手なお願い」
    function_cn: 用于自己向对方提出请求时的铺垫；「急なお願い」表突然的请求，「勝手なお願い」表单方面的请求。
    formation: 「急な/勝手な」+「お願い」
    constraints:
    - 其后经常接「～で申し訳ございません」「～で迷惑をおかけいたしますが」等致歉或请求语
    contrasts:
    - 「急なお願い」（突然的请求）与「勝手なお願い」（单方面的请求）语用侧重不同
  - pattern: ～うちに
    function_cn: 表示在一定时间内发生了某动作；否定形式为～ないうちに。
    formation: 小句（简体形式）+うちに；二类形容词+なうちに；名词+のうちに（接名词时用时间名词）。
    constraints:
    - 当用于有起点和终点的时间段时，可与～間に互换。
    contrasts:
    - 与～うちは区分：～うちは表示某状态一直持续而没有发生变化的期间，并含有与这一段时间结束之后的状态做对比的语气。
  - pattern: 一度お目にかかる
    function_cn: ～にお目にかかる 是 ～に会う 的自谦语，抬高“见面”对方的表达方式。
    formation: 一般用[人]+にお目にかかる 的形式。
    constraints:
    - 另有形式相近的表达 お目にかける（给您看），意思是给对方看。
    contrasts: []
  - pattern: 後日
    function_cn: 表示当日实现不了、要到明天以后；是一种郑重的表达方式。
    formation: 用于书面语或商务活动等。
    constraints: []
    contrasts: []
  - pattern: ～の折(に)
    function_cn: 美化语，表“时/机会”，意义与用法同“時”；“折”含“机会”语气；“際”多用于未来或假定条件句；“節”前不接小句，常以“その節”形式出现。
    formation: 名词/动词连体形 + の折(に)
    constraints:
    - “節”之前不能接小句（句子）
    - “際”常用于表示未来或假定条件的句子
    contrasts:
    - 時
    - 際
    - 節
  - pattern: ～れば幸いです
    function_cn: 客气地向对方提出有负担的请求，表示“如果对方做了，自己将非常高兴”；常用于书面语。
    formation: 动词ば形 + 幸いです；三类动词用“ご/お + 汉字部分 + いただければ幸いです”
    constraints:
    - 接三类动词时常用“ご/お + 汉字部分 + いただければ幸いです”形式
    contrasts:
    - ～していただければ幸いです
    - 恐縮ですが、～
  - pattern: お／ご～いたす
    function_cn: 自谦表达，含抬高动作对象与尊敬听话人两层意思；一般用于自己或属于自己一方的人。
    formation: 动词ます形去“ます”；三类动词用“ご/お + 汉字部分 + いたします”
    constraints:
    - 因贬低主语动作主体，一般用于自己或己方的人
    contrasts:
    - お／ご～する
  - pattern: 迷惑をかける
    function_cn: 表示某种行为对他人不利或使他人不快；常以「ご迷惑をおかけしました」「ご迷惑をおかけして…」等形式表达致歉。
    formation: 名词「迷惑」+「をかける」；敬语搭配用「ご迷惑をおかけする」。
    constraints:
    - 与汉语“迷惑”含义不同，侧重给他人添麻烦、造成不快。
    contrasts: []
  - pattern: ～申し上げる
    function_cn: 动词「申し上げる」为「言う」的自谦语，抬高听话人（对方）地位；亦可用「お＋动词ます形去ます＋申し上げる」抬高动作接受者；接三类动词时用「ご／お＋三类动词汉字部分＋申し上げる」。
    formation: 「お＋[动词ます形去ます]＋申し上げる」；「ご／お＋三类动词汉字部分＋申し上げる」。
    constraints:
    - 与「お～する」相比，「お～申し上げる」的尊敬程度更高。
    contrasts:
    - 「お～申し上げる」 vs 「お～する」：前者尊敬程度更高。
  - pattern: この度
    function_cn: 表示“这次”“最近”，用于表达最近的过去、最近的将来或眼前发生的事情。
    formation: 副词性表达，置于句首修饰整个句子。
    constraints: []
    contrasts: []
  - pattern: 早速
    function_cn: 副词，表示根据上下文迅速着手做某件必要的事或开始实施某种行为，书信中常用。
    formation: 副词，修饰动词。
    constraints: []
    contrasts: []
  - pattern: なお
    function_cn: 用于需再叙述别的事情时，含有补充必要事项的语气。
    formation: 接续于句末或句间，作补充说明。
    constraints: []
    contrasts: []
  - pattern: ご不明の点
    function_cn: 名词性表达，指“不清楚的地方”，较郑重；“ご不明の点がございましたら、～”为“分からないところがあったら、～”的礼貌说法。
    formation: “不明”为名词，前接敬语“ご”，后接“の”连接名词。
    constraints: []
    contrasts:
    - 分からないところがあったら、～（较随意的对应表达）
  - pattern: お気軽に
    function_cn: 二类形容词“気軽”前接敬语“お”、后接“に”，表示“不必客气”，用于鼓励对方采取某种行为时的铺垫性表达。
    formation: お + 気軽 + に，修饰动词。
    constraints: []
    contrasts: []
  pragmatics:
  - 敬語の使い分け（「おっしゃいますと？」「召し上がっていただける」「お持ちしました」）
  - 委婉表达异议（「ちょっと難しいかもしれませんねえ」）
  - 为顾及对方感受，先接受对方意见再说自己看法
  - 句尾做模糊处理以委婉表达
  - 用程度副词降低否定/拒绝的强度
  - 对顾客一般使用特别礼貌的表达方式（商业敬语）
  - 「～でしょうか」比「～ですか」更客气、无强加感
  - 「とおっしゃいますと」为反问式，表示听清但需确认真正意思
  - 「弊社」为对自己公司的谦让说法，用于商务场合
  - 书信结构：日期、收件公司/部门/姓名（様）、拝啓、正文、敬具、署名（公司+事务所+姓名）
  - 敬语与谦让表达：差し上げる、お許しください、申し上げます、伺いました、お目にかかり、お電話いたします、お聞きできれば幸いです、ご検討くださいますようお願い申し上げます
  - 尊称（様/殿/御中/先生）的语用选择
  - 开头语『拝啓』的格式要求
  - 开头语与结束语需对应（拝啓↔敬具）
  - 信封封口处写「㊤」等固定格式
  - 尊他语「御社/貴社」与自谦语「当社/弊社」的对应使用
  - 「お＋形容词」的尊敬表达
  - 请求前使用「急な/勝手なお願い」+ 致歉句的礼貌策略
  - 一度お目にかかる 为自谦语，用于抬高对方。
  - 後日 为郑重表达，常用于书面语或商务活动。
  - 美化语（折/際/節）用于礼貌场合
  - 自谦语用于自己或己方动作主体
  - 「ご／お」的使用区别取决于是否为汉语词：汉语词前接「ご」，和语词前接「お」，但存在例外（如「お電話いたします」）。
  - 敬语“ご”“お”用于表示对对方的尊敬或客气
  - “お気軽に”“ご不明の点”属郑重/礼貌语域
