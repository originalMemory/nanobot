  communication_functions:
  - 使用图表的调查报告中的图表指示与数值、概数表达
  - 提示/引导读者思考某主题
  - 比较数值与基准、描述数值停滞
  grammar:
  - pattern: ～は～を示している／～を示したものである
    function_cn: 指示、说明图表所显示的内容（客观描述图表）
    formation: 名词（图表主题）＋は＋内容＋を示している／示したものである
    constraints:
    - 用于指示已存在的图或图表
    contrasts:
    - 与「～に～を示す」区分：后者用于作者自己制作的图表
  - pattern: ～に～を示す
    function_cn: 表示用某图/表来显示某内容（作者自制图表）
    formation: 图/表名＋に＋内容＋を示す
    constraints:
    - 用于表示作者自己制作的图或图表
    contrasts:
    - 与「～は～を示している」区分：前者强调作者用图来呈现
  - pattern: ～に満たない／～に達しない／～未満
    function_cn: 表示实际数值小于基准（X＜A）
    formation: 基准数值＋に満たない／に達しない／未満
    constraints:
    - 严格小于，不含基准值
    contrasts:
    - 与「～以下」区分：以下含基准值（X≤A）
  - pattern: ～以下
    function_cn: 表示实际数值小于或等于基准（X≤A）
    formation: 基准数值＋以下
    constraints:
    - 包含基准值
    contrasts:
    - 与「～に満たない」区分：以下含基准，満たない不含
  - pattern: ～以上
    function_cn: 表示实际数值大于或等于基准（X≥A）
    formation: 基准数值＋以上
    constraints:
    - 包含基准值
    contrasts:
    - 与「～を超える」区分：以上含基准，超る不含
  - pattern: ～を超える
    function_cn: 表示实际数值大于基准（X＞A）
    formation: 基准数值＋を超える
    constraints:
    - 严格大于，不含基准值
    contrasts:
    - 与「～以上」区分：超る不含基准，以上含
  - pattern: 約～／ほぼ～／およそ～／～ほど／～程度／～前後
    function_cn: 表示某项“大约”“大概”的概数
    formation: 约／ほぼ／およそ＋数值；数值＋ほど／程度／前後
    constraints:
    - 修饰数值以外的内容时只能使用「ほぼ」「およそ」
    contrasts:
    - 「約」可替换为「ほぼ」「およそ」；「前後」可替换为「ほど」「程度」
  - pattern: ～足らず / ～近く / ～弱
    function_cn: 表示实际数值X小于基准“～”；说话人内心认为数量较少时用“～足らず”，认为较多时用“～近く”；“～弱”为对事实的客观描述。
    formation: 接于数值之后
    constraints:
    - 用于实际数值低于基准值的情况
    - 语用色彩随说话人期望值变化（期望值高→足らず，期望值低→近く）
    contrasts:
    - 与“～あまり／～強”（实际数值稍大于基准）相对
  - pattern: ～あまり / ～強
    function_cn: 表示实际数值X比基准“～”稍大。
    formation: 接于数值之后
    constraints:
    - 用于实际数值略高于基准值的情况
    contrasts:
    - 与“～足らず／～近く／～弱”（实际数值低于基准）相对
  - pattern: ～にすぎない / わずか～ / ～にとどまる
    function_cn: 用于说话人认为数值较小的情况，强调“才不过／仅／仅仅”。
    formation: 接于数值之后（“～にすぎない”“～にとどまる”接于数值后）
    constraints:
    - 体现说话人对数值偏小的评价
    contrasts:
    - 与“～に上る／～に達する”（认为数值很大）相对
  - pattern: ～に上る / ～に達する
    function_cn: 用于说话人认为数值很大的情况，表示“高达／达到了”。
    formation: 接于数值之后
    constraints:
    - 体现说话人对数值偏大的评价
    contrasts:
    - 与“～にすぎない／わずか～／～にとどまる”（认为数值较小）相对
  - pattern: ～に届く
    function_cn: 表示终于达到基准，多与“ようやく”“やっと”等词语搭配使用。
    formation: 接于数值之后
    constraints:
    - 常与表示“终于/总算”的副词共现
    contrasts: []
  - pattern: ～を上回る
    function_cn: 用于认为数值超过某个基准；该基准可以是数字，也可以是非数字。
    formation: 接于基准（数值或非数值）之后
    constraints:
    - 基准不限于数字，可为时间、对象等非数值表达
    contrasts: []
  - pattern: ～を下回る
    function_cn: 表示数值低于某一基准（基准可为数字或非数字）
    formation: 动词下回る的连用形/补助用法，接于数值或基准之后
    constraints:
    - 用于比较数值低于基准的情形
    contrasts: []
  - pattern: 横ばい状態
    function_cn: 表示某数值或状况持续不变的状态
    formation: 名词性表达，常与続ける等搭配
    constraints:
    - 强调无变化、停滞
    contrasts: []
  - pattern: ～てみよう
    function_cn: 提示接下来要思考的课题，引导读者一同思考
    formation: “～てみる”＋劝诱形式句尾
    constraints:
    - 多用于论文、报告提示主题或教科书指导语
    - 正式报告中使用会给人傲慢感，需慎用
    contrasts:
    - ～てみたい
    - どのようになっているだろうか
  - pattern: ～だろうか
    function_cn: 说话人认为听话人不知答案时也可使用的疑问形式，用于提示主题、与读者共同思考
    formation: 动词/形容词连体形＋だろうか
    constraints:
    - 多用于论文等不要求读者回答、而引导思考的场合
    contrasts:
    - ～でしょうか（同义，用于提示主题）
  - pattern: ～あたり
    function_cn: 接在表示单位的名词后，表示在该单位范围内，相当于“每……”。
    formation: 表示单位的名词 + あたり
    constraints: []
    contrasts: []
  - pattern: ～につき
    function_cn: 与“～あたり”同义，表示“每……”。
    formation: 名词 + につき
    constraints: []
    contrasts:
    - 与～あたり同义
  - pattern: 助词“で”表单价（论个销售）
    function_cn: 论个销售时使用助词“で”表示单价；1个的情况则不使用“で”。
    formation: 数量 + で + 价格
    constraints:
    - 1个的情况不用“で”
    contrasts: []
  - pattern: ～のに対し
    function_cn: 针对某个事项，对比两种不同的情况时使用。
    formation: 小句（简体形式）+ の + に対し；名词/二类形容词肯定形式时用“名词/二类形容词 + である + の + に対し”或“名词/二类形容词 + な + の + に対し”；表示动作、感情、态度涉及对象时用“名词
      + に対し”。
    constraints:
    - 表示动作、感情、态度涉及对象时用名词+に対し
    contrasts: []
  - pattern: ～を余儀なくされる
    function_cn: 表示自己并不想这么做，但因各种原因不得不这么做（被迫、无奈）。
    formation: 动词他动/名词 + を余儀なくされる
    constraints: []
    contrasts: []
  - pattern: ～（よう）
    function_cn: 用意志形表示说话人的推测，主要用于书面语；也可用于委婉表达作者意见（如 うかがえる→うかがえよう／うかがえるだろうか 等）。
    formation: 动词意志形（～よう）
    constraints:
    - 书面语
    contrasts: []
  - pattern: ～を機に
    function_cn: 表示“以……为契机”，多用于就职、结婚、生育等人生重大事件；同义表达有 ～を契機にして／～を契機として。
    formation: 名词 + を機に；动词（简体形式）＋の＋を機に
    constraints: []
    contrasts:
    - ～を契機にして
    - ～を契機として
  - pattern: 理由として～がある／理由として～が挙げられる
    function_cn: 先说明前文状况，再明确提示导致该状况的多种原因中的一个。
    formation: 理由として + 名词/句子 + がある／が挙げられる
    constraints: []
    contrasts: []
  - pattern: ～を強いる
    function_cn: 表示强迫别人做某事；其被动形式「～を強いられる」表示被强制做某事。
    formation: 动词连用形（ます形去ます）＋を強いる；被动为「～を強いられる」。
    constraints: []
    contrasts: []
  - pattern: そのもの
    function_cn: 接在名词之后表示“其自身”；也可接在名词、二类形容词之后，强调该词本身的含义。
    formation: 名词／二类形容词＋そのもの。
    constraints: []
    contrasts: []
  - pattern: ～と～では
    function_cn: 用于对两项事物进行比较，并能发现较大差异的情况。
    formation: 名词A＋と＋名词B＋では。
    constraints: []
    contrasts: []
  pragmatics:
  - 数值表达的选择受说话人主观期望值影响：同一数值可因期望高低选用“足らず”或“近く”等不同形式。
  - ～てみよう 在正式报告中易显傲慢，需视文体慎用
  - ～だろうか 用于不期待对方作答、而共同思考的语境
