  similar_contrasts:
  - 与肯定条件“～と”相对，为否定条件形式。
  - “～といえば”与“～というのは”用法不同，不可互换。
  - あきません（礼貌形）
  - 聞く
  - 目にする（被动进入视野）
  - 与～おかげで相对，后者用于正面原因
  - 与～せいで相对，本形式用于正面原因或好处来源
  - ～だけけど／～だけど（简体，礼貌低，不用于尊长）
  - ～たが（意义相同但仅书面语）
  - ～ですけど
  - ～だけけど／～だけど（简体形式「だ」，礼貌较低，不用于尊长）
  - ～から（即「～ですから」，语气较直接）
  - 与「～いたす」「お/ご～する」相比更为礼貌；「～いたす」是「～する」的自谦语，只能用于三类动词，而「～させていただく」还可用于其他类型动词。
  - 与「～させていただく」相比，后者适用范围更广且更礼貌。
  - 異なる（正式、无错误义）
  - 違う（通用、可表错误）
  - 怒る：指明发火对象时，描述将怒气向对象直接表现，伴随大声吼叫或动手打对方等动作
  - しかる：面对做错事的人，指出其错误并予以纠正，不一定含强烈情感表现
  - 被动形式时，怒る 与 しかる 基本上没有区别
  - 与「注意する」意思相近，但しかる侧重纠正错误，注意する侧重提醒、警告
  - 与「しかる」意思相近，但注意する侧重提醒而非纠正
