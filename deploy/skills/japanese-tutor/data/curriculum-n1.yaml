  grammar:
  - pattern: お伺いしたいのですが／お聞きしたいのですが
    function_cn: 礼貌地引出自己想提问的内容，作为铺垫形式，后接具体提问内容
    formation: 用自谦语「お伺いする」「お聞きする」加上「～たいのですが」构成
    constraints:
    - 用于向对方提出询问前的缓冲表达，体现礼貌程度较高
    contrasts: []
  - pattern: 敬体（礼貌体）
    function_cn: 初次会话、拘谨郑重场合中双方使用礼貌程度较高的说法
    formation: 询问本身使用敬体即可
    constraints:
    - 适用于互不相识者初次会话及面试等郑重场景
    contrasts: []
  - pattern: ございます
    function_cn: 「あります」的郑重说法，用于表示存在或持有
    formation: 名词＋ございます
    constraints:
    - 用于郑重/敬语场合，如百货公司、商店等
    contrasts:
    - 与「あります」相比语气更郑重
  - pattern: ～でございます
    function_cn: 「～です」的郑重说法，用于判断或说明
    formation: 名词／形容词名词化＋でございます
    constraints:
    - 用于郑重/敬语场合
    contrasts:
    - 与「～です」相比语气更郑重
  - pattern: お手数をおかけしました
    function_cn: 电话结束时对对方付出劳动表示感谢/致歉的固定表达
    formation: 固定寒暄语
    constraints:
    - 用于结束电话时
    contrasts:
    - 与「ありがとうございました」相比，「すみません」含给对方添麻烦、表示歉意的语气
  - pattern: 面接の作法（敲门、入室、鞠躬、自我介绍、待允许后落座）
    function_cn: 面试时的交际/礼仪规则
    formation: 交际程序
    constraints:
    - 敲门两下，不敲三下以上
    - 开门说「失礼します」，进房后静静关门
    - 鞠躬并自我介绍，待考官允许后再就座
    contrasts: []
  - pattern: 尊他语／自谦语
    function_cn: 区分尊他语与自谦语，避免混淆或词形不当导致失礼；自信能用好时再使用。
    formation: 针对对方公司/动作与自身动作分别选用尊他或自谦表达。
    constraints:
    - 自报姓名用“○○と申します”，避免“○○と申し上げます”。
    - 叙述自身事情可用“おります”“～ております”替代“います”“～ています”，用“いたします”替代“します”。
    - “研修させていただいたことがあります”可简化为“研修したことがあります”，但不可说“研修いたしたことがあります”。
    contrasts:
    - 尊他语与自谦语不可混用。
  - pattern: 御社／貴社
    function_cn: 提及对方公司表敬意；“御社”用于口语及电子邮件，书面语用“貴社”。
    formation: 名词性称呼，置于公司相关表述前。
    constraints:
    - 书面语中改用“貴社”。
    contrasts:
    - 口语/邮件“御社” vs 书面“貴社”。
  - pattern: 交通費が出る／希望を出す
    function_cn: “交通費が出る”指交通费由公司支付；“希望を出す”指说出希望、提出要求；课文用可能形式“出せる”提问公司是否会考虑应聘者对岗位等的希望。
    formation: 动词“出る”的自动/他动用法及可能形“出せる”用于提问。
    constraints:
    - 提问公司是否考虑应聘者希望时使用可能形式。
    contrasts: []
  - pattern: ～が出る／～を出す
    function_cn: 表示产生、发生或得到钱物饮食等；与名词搭配有选择性，如『問題』『事故』等不可与『出る』搭配，需改用『起きる』『発生する』。
    formation: 名词＋が出る／出す
    constraints:
    - 表示『产生、发生』时搭配名词受限
    - 『問題が起きる』『事故が起きる／発生する』为正确搭配
    contrasts:
    - 『～が出る』与『～を出す』在『产生、发生』义项上搭配名词不同
  - pattern: ～が出る／～が入る
    function_cn: 自动词『出る』『入る』的惯用形式，分别表示得到钱物饮食、发生现象事态、卖得好；引进机械设备、冲泡好、获得钱物等。
    formation: 名词＋が出る／入る
    constraints:
    - 『出る』用于得到钱物饮食、发生现象、卖得好
    - 『入る』用于引进设备、冲泡好、获得钱物
    contrasts:
    - 『出る』与『入る』在『得到钱物』义项上方向相反
  - pattern: ～んですよね
    function_cn: 解释原因、理由；也可用于说话人确认自己应该如何行动（向对方确认是否必须做某事）
    formation: 名词/动词等 + ですね
    constraints:
    - 用于说明缘由或征询对方对自己行为的确认
    contrasts:
    - 与仅表解释的「～のです／～んです」相比，多含向对方确认、寻求认同的语气
  - pattern: お手数をおかけしました／お手数ですが
    function_cn: 表示做某事所需的动作、工作数量；用于请求对方协助或对对方的帮助表示感谢、致歉
    formation: お手数 + を + おかけする／おかけしました
    constraints:
    - 「手数がかかる」表示为他人做事花费精力和时间
    contrasts: []
  - pattern: 心臓が強い
    function_cn: 意为“不怯场”；用于他人时多表贬义
    formation: 心臓 + が + 強い
    constraints:
    - 「心臓が弱い」意为“胆小”；「心臓に毛が生えている」相当于“厚颜无耻”
    contrasts:
    - 「心臓が強い」与「心臓が弱い」意义相反
  - pattern: まずは～、さらに～、それに加えて～
    function_cn: 按先后顺序叙述多件事情的接续形式
    formation: 动词/形容词/名词谓语句后接续，依次递进
    constraints:
    - 用于回答或说明时按顺序列举步骤或要点
    contrasts:
    - まず～、次に～、さらに～
    - 第1に～、第2に～、第3に～
  - pattern: 経験を積む
    function_cn: 表示积累、增加某种经验或技能
    formation: 名词（経験・修業・トレーニング・研さん等）＋を積む
    constraints:
    - 积む含三义：在物品上再堆积；把货物装载到车上；花费较长时间增加、提高某种经验
    contrasts:
    - 経験を積む（积累经验）
    - 修業を積む（不断修炼）
    - トレーニングを積む（不断练习）
    - 研さんを積む（不断钻研）
  pragmatics:
  - 電話での自己紹介（私、徐と申しますが）
  - 丁寧な質問表現（お伺いしたく、～のでしょうか）
  - 相手の説明への確認（分かりました）
  - 面接での敬語・丁寧語の使用（お入りください、失礼します、よろしくお願いいたします）
  - 面接官と面接者の役割分担（星野＝面接官、徐＝面接者）
  - 面试结束时的礼貌致谢（ありがとうございます）
  - 面试官告知结果时间（今週末までにお知らせします）
  - 初次见面、拘谨郑重场合使用礼貌程度较高的说法
  - 打电话询问时先确认对象，再说明询问内容并请负责人接电话
  - 「ございます／でございます」用于郑重场合（百货公司、商店等）
  - 「すみません」在致谢语境中含歉意，区别于「ありがとうございました」
  - 面试敲门次数为两下，避免多敲
  - 尊他语与自谦语误用会弄巧成拙，建议自信时再用
  - 对方公司称呼的语体差异（御社/貴社）
  - 「心臓が強い」用于他人时多表示贬义
