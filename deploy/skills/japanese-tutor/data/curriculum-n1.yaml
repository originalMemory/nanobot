  similar_contrasts:
  - 与「AのほうがB」语义相近，后者强调B一方
  - 与「AよりB」可互换，语感侧重不同
  - 与「Aより～ない」语义接近
  - 与「最も」近义
  - 与「かなり」「ずっと」程度副词区分
  - 与句型2「のほうが」相比，本句型直接以名1为主语陈述其更具备某性质
  - 与句型1相比，本句型以「のほうが」结构突出被比较对象
  - 与肯定比较句型1、2相对，本句型表达程度不及
  - 参考项：当名1表示场所或时间时，不用「の中で」，而用「名词[场所/时间] で いちばん 一類形／二類形 名2 は 名3 です」的句型
  - 与语法点6（三者以上）相区别：本句型限定为两种事物。
  - 与语法点5相区别：本句型用于三者以上，疑问词随对象变化。
  - 与汉语“最近”可表将来的用法不同。
  - 与“～より…のほうが いいです”搭配可表比较偏好。
  - 与较正式的“やはり”语体不同。
