  grammar:
  - pattern: いらっしゃいませ / 何にしましょう / 何かお探しですか / どういったものをお探しですか
    function_cn: 商店欢迎与招呼用语，用于迎客并询问顾客需求
    formation: 固定寒暄与疑问表达
    constraints: []
    contrasts: []
  - pattern: よかったら～ませんか / よかったら～はいかがですか
    function_cn: 向顾客推荐商品或建议试穿、试吃的委婉建议表达
    formation: よかったら + 动词ます形否定疑问 / 名词 + はいかがですか
    constraints:
    - 用于顾客拿不定主意时
    contrasts: []
  - pattern: お～ください / ～ました（敬语表达）
    function_cn: 对顾客使用敬语表达，表示恭敬地请求或告知
    formation: 敬语动词 + ください / 敬语动词 + ました
    constraints:
    - 用于对顾客说话时
    contrasts: []
  - pattern: 安くしてください / 安くありませんか / けっこう高いですねえ / もう少し安くありませんか
    function_cn: 日本购物中讨价还价的直接/间接表达，间接表达希望再便宜一些
    formation: 形容词/动词 + てください / ませんか / ですねえ
    constraints:
    - 日本购物一般不讨价还价，多用于价格交涉
    contrasts: []
  - pattern: ～でどうでしょう / ～でいかがですか
    function_cn: 表达自己希望降低价格或提出其他优惠方式的委婉提议
    formation: 金额/条件 + でどうでしょう / でいかがですか
    constraints:
    - 用于不能接受顾客要价时做价格调节
    contrasts: []
  - pattern: ～なさいませんか
    function_cn: 邀请或劝诱的礼貌表达，用三类动词（する→なさる）的否定疑问句形式表示奉劝或邀请；对いらっしゃる、召し上がる等尊他动词同样以否定疑问句表示劝诱；亦可用敬语形式お／ご～なさる、お～になる。
    formation: 三类动词（する）→なさる→～なさいませんか；尊他动词（いらっしゃる／召し上がる）→否定疑问句；敬语：お／ご＋名词＋なさる／お～になる
    constraints:
    - 用于邀请、劝诱场合，比肯定形式更礼貌
    - 与初级第17课～ませんか形式相关，进一步礼貌化
    contrasts:
    - 肯定形式邀请 vs ～なさいませんか 否定疑问邀请（更礼貌）
  - pattern: 驚いた
    function_cn: 表示吃惊、惊讶的感叹；除单纯惊愕外，也可对极优秀的程度表示钦佩（自言自语脱口而出）
    formation: 感叹句，常独立使用或与「わあ」等感叹词连用
    constraints:
    - 与「びっくりする」含义相近
    contrasts: []
  - pattern: ぺらぺら
    function_cn: 拟声词，多义：褒义指非常流利地说外语的样子；贬义指喋喋不休、轻率地说话；另指纸张、布匹、木板等又薄又廉价，或书页被风吹得打卷翻动
    formation: 拟声/拟态词，可修饰动词或作谓语
    constraints:
    - 褒贬义需依语境判断，使用时需注意
    contrasts: []
  - pattern: 助词「で」
    function_cn: 表示动作的场所、手段、方法等多种语法意义；此处「独学（自学）」表示一种手段/方法
    formation: 接在名词后表手段、方法
    constraints:
    - 需与表场所、原因等其他用法区分
    contrasts: []
  - pattern: 本当に／本当だ／本当?
    function_cn: 「本当に」表确实、真的；句尾读升调时「本当?」表示确认或疑问（是这样吗?），也可单独使用「本当?」
    formation: 副词「本当に」修饰谓语；「本当だ」为断定；「本当?」为疑问
    constraints:
    - 「本当?」需靠句尾升调表示确认/疑问
    contrasts: []
  - pattern: 本当（语调变化）
    function_cn: 表示接受对方所说的新信息或确认；升调与降调语用不同，礼貌表达用「本当ですか」。
    formation: 感叹/确认语，可接「あっ」等感叹词。
    constraints:
    - 语调（升/降）决定是惊讶确认还是接受新信息。
    contrasts:
    - 「本当（↑）」与「本当（↓）」语用区别；礼貌形「本当ですか」。
  - pattern: ～（さ）せる（自动词使役代替他动词）
    function_cn: 在没有相应他动词时，用自动词的使役形式表示他动词用法。
    formation: 自动词使役形（～させる/～さる）。
    constraints:
    - 适用于无对应他动词的自动词（如「熟成する」→「お茶を熟成させる」）。
    - 译成汉语时使役含义有时可不译出。
    contrasts:
    - 与初级「～（さ）せる」使役的接续关系。
  - pattern: 味道表达词汇群
    function_cn: 表示食物整体味道与浓淡、油度等。
    formation: 形容词/な形容词；词尾「い」可换「み」作名词（甘み・辛み・苦み）。
    constraints:
    - 「おいしい」比「うまい」更郑重礼貌。
    - 浓淡用「濃い/薄い」，清淡用「淡白な/あっさりした/さっぱりした」，油重用「こってりした/濃厚な」。
    contrasts:
    - 「うまい/おいしい/まずい」语体与褒贬区别。
  - pattern: 香り vs におい
    function_cn: 区分芳香气味与一般散发气味。
    formation: 名词。
    constraints:
    - 「におい」指物品自身散发刺激嗅觉的气味；「香り」指物品具有的芳香气味。
    contrasts:
    - 「香り」与「におい」语义边界。
  - pattern: ～分
    function_cn: 表示两个事物之间的比例关系，前接小句（简体形式），后接结果或程度说明
    formation: 小句（简体形式）＋分
    constraints:
    - 小句部分可用指示词代替
    contrasts: []
  - pattern: ～（の）分
    function_cn: 表示分配、份额；用于“名词＋の分”表示某人所分得的部分，或固定搭配名词后直接加“分”表示该部分。
    formation: 名词＋の＋分；固定搭配名词＋分
    constraints:
    - 用于分配、份额语境
    - 固定搭配名词可直接加“分”
    contrasts: []
  - pattern: ～グラム
    function_cn: 表示重量单位“克”，用英文字母 g 表示。
    formation: 数量＋グラム（g）
    constraints:
    - 用于长度、重量单位语境，与メートル、キロメートル、キログラム等同属单位表达
    contrasts: []
  - pattern: ～ずつ
    function_cn: 表示某动作反复进行时一次动作所实现的数量或份量；与表示少量名词或副词连用时表示少量地、徐徐地进行。
    formation: 数量词＋ずつ；与“少し”“ちょっと”“わずか”等连用
    constraints:
    - 需与数量词一起使用
    - 与少量表达连用表示徐徐、少量地
    contrasts: []
  - pattern: 安くなりませんか
    function_cn: 委婉询问能否降价，关注“安くなる”事态能否发生，而非直接要求对方降价。
    formation: 安くなる＋ませんか
    constraints:
    - 用于避免直接表达对方意志的委婉询问
    contrasts:
    - 与直接请求“安くしてください”对比，更婉转
  - pattern: サービスします
    function_cn: 表示商店为满足顾客需求降价或奉送赠品；也表示为他人尽心尽力地做事。
    formation: サービス＋する
    constraints:
    - 用于商业让利或奉献语境
    contrasts: []
  - pattern: ～ようになる
    function_cn: 表示习惯、性质发生变化
    formation: 动词（基本形）+ ようになる；前面除非意志性动词基本形、ない形及意志性动词可能形式基本形、ない形外，也可用其他动词形式
    constraints: []
    contrasts: []
  - pattern: ～として知られている
    function_cn: 表示具备某种资格或处于某种状态而广为人知
    formation: 名词/动词连体形 + として + 知られている（广为人知）
    constraints: []
    contrasts: []
  - pattern: 必ずしも～ない
    function_cn: 部分否定或不强烈否定，含与预想不同、并非总是如此之意
    formation: 动词/形容词否定形；亦可用「小句（简体）＋（という）わけではない」「小句（简体）＋とは限らない」表部分否定
    constraints:
    - 表示并非全部、并非一定，而非完全否定
    contrasts:
    - 与完全否定「～ない」区分
  - pattern: ～をはじめ
    function_cn: 列举，列出最具代表性的要素
    formation: 名词＋を＋はじめ～；亦作「Aをはじめとして、B、C…」「～をはじめとする」「～をはじめとした」
    constraints:
    - 用于引出代表性例子后继续列举
    contrasts: []
  - pattern: ～に至るまで
    function_cn: 表示列举的结束，多用于列举极端事物
    formation: 加在列举最后一项后；动词「至る」含“到”之意；常与「～から～に至るまで」「～はもちろん、～に至るまで」呼应
    constraints:
    - 置于列举末尾，强调范围之广
    contrasts:
    - 与「～をはじめ」（列举开头）呼应使用
  - pattern: ルーツ
    function_cn: 名词，意为“根本”“根源”，源自英语 roots
    formation: 名词，常接「～のルーツ」
    constraints: []
    contrasts: []
  - pattern: ～といっても過言ではない
    function_cn: 表示不夸张、不过分，强调前项内容成立；同义表达「～といっても言い過ぎではない」
    formation: 小句（简体形式）+ といっても過言ではない
    constraints:
    - 「～」处为过分强调的说法或内容
    - 「過言」指过分夸大的表达
    contrasts:
    - 与「～といっても言い過ぎではない」意思相同
  - pattern: もっぱら
    function_cn: 副词，表示“专门”“完全”
    formation: 副词，修饰动词
    constraints:
    - 不太用于较为随便的日常口语
    contrasts: []
  - pattern: 本格的
    function_cn: 表示“认真地”“彻底地”“真正地”
    formation: 副词性形式「本格的に」修饰动词；亦可作连体词「本格的な」
    constraints:
    - 本课时以副词性形式「本格的に」修饰「飲まれる」
    contrasts: []
  pragmatics:
  - 店员使用敬语（お探しですか／お試しください／かしこまりました）
  - 顾客使用礼貌请求（～てくれませんか／～てくれますか／～ください）
  - 对顾客需恭敬地使用敬语表达方式
  - 日本购物一般不讨价还价，多用间接表达希望便宜
  - 收到顾客钱款与找零时需唱收唱付以示礼貌
  - 日本消费税制度：1989年4月起3%税率，2008年执行5%税率
  - 「驚いた」为自言自语脱口而出的感叹，含钦佩语用色彩
  - 「ぺらぺら」褒贬两义，语用色彩需依语境
  - 「本当」语调与礼貌形「本当ですか」的语体差异
  - 「うまい」与「おいしい」的郑重程度差异
  - 日语中多数情况下避免直接表达对方意志，改用关注事态能否发生的形式婉转询问
