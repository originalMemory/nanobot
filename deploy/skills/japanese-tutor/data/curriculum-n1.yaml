  grammar:
  - pattern: ～ていく
    function_cn: 表示状态或数量随时间逐渐变化、持续进行（向未来/远离说话人方向）
    formation: 动词て形＋いく
    constraints:
    - 强调变化过程或趋势，常与だんだん等搭配
    contrasts:
    - 与～てくる方向相反
  - pattern: ～てくる
    function_cn: 表示状态或数量随时间逐渐变化、开始或持续到说话人视角
    formation: 动词て形＋くる
    constraints:
    - 可表变化（如人数增加、眼睛疲劳）或动作开始（如下雨）
    contrasts:
    - 与～ていく方向相反
  - pattern: ～ので
    function_cn: 表示原因、理由（较客观、礼貌）
    formation: 动词/形容词/名词连用形＋ので
    constraints:
    - 多用于陈述事实性原因，语气比から柔和
    contrasts:
    - 与から相比更客观、书面
  - pattern: ～し、～し
    function_cn: 并列列举多个理由或特征
    formation: 动词/形容词/名词＋し
    constraints:
    - 理由通常未穷尽，后接结论或主张
    contrasts:
    - 与「～が、～が」并列不同，し侧重理由
  - pattern: ～ば～ほど
    function_cn: 表示程度递增的并列条件（越…越…）
    formation: 动词ば形/形容词ば形/名词＋（な）ば＋ほど
    constraints:
    - 前后两个分句需为同一方向的递增关系
    contrasts:
    - 与单一条件～ば不同，强调比例递增
  - pattern: ～ば（条件）
    function_cn: 表示假定条件（如果…）
    formation: 动词ば形/形容词ば形/名词＋（な）ば
    constraints:
    - 语气较书面、客观
    contrasts:
    - 与～たら、～と条件用法有别
  - pattern: ～と（条件）
    function_cn: 表示自然结果或习惯性条件（只要…就…）
    formation: 动词/形容词/名词＋と
    constraints:
    - 多用于客观规律或必然结果，不用于主观意志
    contrasts:
    - 与～ば相比更强调必然性
  - pattern: ～ても
    function_cn: 表示让步（即使…也…）
    formation: 动词て形/形容词た形/名词＋でも
    constraints:
    - 后接否定或转折结果
    contrasts:
    - 与～でも（名词）接续不同
  - pattern: ～ませんか
    function_cn: 邀请、提议对方一起做某事
    formation: 动词ます形去ます＋ませんか
    constraints:
    - 用于礼貌邀请
    contrasts:
    - 与疑问「～ますか」语用不同
  - pattern: ～たい
    function_cn: 表示说话人想要做某事
    formation: 动词ます形去ます＋たい
    constraints:
    - 表达主观愿望，接だ/です
    contrasts:
    - 与～てほしい（希望对方做）不同
  - pattern: 动词て形＋いきます／きました
    function_cn: 表示从基准时间观察的动作持续或性质、状态的变化；基准时间以前用～てきました，基准时间以后用～ていきます
    formation: 动词て形＋いきます／きました
    constraints:
    - 与第39课表示空间移动的用法相区别，此处表持续/变化
    contrasts:
    - 区别于空间移动用法（第39课）
  - pattern: 动词て形＋きました
    function_cn: 表示某种状态的出现或开始
    formation: 动词て形＋きました
    constraints:
    - 只限于前接非意志动词
    contrasts:
    - 区别于表持续/变化的～てきました
  - pattern: 小句1し、小句2し、小句3
    function_cn: 叙述并列的几个事项
    formation: 小句＋し、小句＋し、小句
    constraints:
    - し前面可接简体形或敬体形
    - 前两个小句的主语が多用も替换
    contrasts: []
  - pattern: 动词/一类形容词 ば + 动词/一类形容词 ほど + 小句
    function_cn: 表示某性质的程度与其相关动作或性质成正比例关系（越……越……）
    formation: 动词ば形＋动词基本形＋ほど＋小句；一类形容词ば形＋一类形容词＋ほど＋小句
    constraints:
    - 二类形容词可用该句型，接续为“二类形容词＋なら＋二类形容词＋な＋ほど”或“二类形容词＋であれば＋二类形容词＋な＋ほど”
    - 前者多用于口语，后者多用于书面语
    contrasts:
    - 与“～し、～し、～”的区别：①“て形”一般只用于连接形容词和名词，而“～し、～し”还可用于连接动词；②“～し、～し”一般用于陈述原因、理由，而“て形”可用于各种场合
  - pattern: “で／へ／から／まで／と”＋の
    function_cn: 上述助词除“は”以外还可后续“の”，用于修饰名词
    formation: 助词 で／へ／から／まで／と ＋ の ＋ 名词
    constraints:
    - 助词“に”没有后续“の”的用法
    contrasts:
    - 与第6课“に／で／へ／から／まで／と＋は”的用法相区别，此处为后续“の”
  - pattern: 交通の便がいい
    function_cn: 表示交通便利；修饰对象须为“交通”而非住宿等，反义为“交通の便が悪い”。
    formation: 名词“便”+形容词“いい/悪い”
    constraints:
    - 不能单说“ホテルの便がいい”
    contrasts:
    - 交通の便が悪い
  - pattern: ライトアップされています
    function_cn: 指夜间给建筑物或纪念碑等打上灯光、引人注目。
    formation: 外来词“ライトアップ”+“する”构成复合动词的被动形式
    constraints: []
    contrasts: []
  - pattern: 以前
    function_cn: 表示较近的过去，与汉语“以前”用法基本相同。
    formation: 时间名词，可接“に”但一般不用
    constraints:
    - 前面不能加修饰语（如×あなたが来る以前、×10年以前）
    contrasts:
    - 前に
  - pattern: なんか
    function_cn: 表示理由不明确的感觉或判断，口语形式，可译“总觉得/有点儿”。
    formation: 口语副词性表达
    constraints:
    - 比“なんだか”更随便
    contrasts:
    - なんだか
  - pattern: ～に似ています
    function_cn: 表示相似、相像；“に”表示相似的对象。
    formation: 动词“似ます”的活用形式，只能以“～ています”形式使用
    constraints:
    - 不能直接用“似ます”原形
    contrasts: []
  - pattern: アクセスがいい／悪い
    function_cn: 外来词「アクセス」用于交通与计算机领域，引申为“衔接、连接”；该表达表示前往某地交通是否便利，或连接网络、发送邮件是否顺畅。
    formation: 名词「アクセス」+ 形容词「いい／悪い」
    constraints:
    - 用于交通、计算机等“连接”语境
    - 可搭配「～までのアクセス」表示某区间交通状况
    contrasts: []
  - pattern: 軽い（饮食语境）
    function_cn: 饮食方面「軽い」有两义：味道清淡不油腻；分量少。
    formation: 形容词「軽い」修饰食物或表示分量
    constraints:
    - 用于饮食时表清淡或分量少
    contrasts:
    - 反义词「重い」不能用于饮食方面
