  communication_functions: []
  grammar:
  - pattern: ～とはいえ～
    function_cn: 承认前述事项的同时叙述与之相反的事项，相当于汉语“虽说……但是……”
    formation: 前句最后用简体形接续；也可单独用于句首
    constraints:
    - 书面语
    - 与「～というもののも～」含义相同，但「～とはいえ～」书面语色彩更浓
    contrasts:
    - 「～というもののも～」同为书面语，但书面语色彩较「～とはいえ～」淡
  - pattern: いかんなく
    function_cn: 把一切毫无保留地、淋漓尽致地
    formation: 多用于「～をいかんなく発揮する」形式，与动词「発揮する」一起使用
    constraints:
    - 「～」部分多为「能力」「才能」「経験」等
    contrasts: []
  - pattern: こんな(に)～ことはない
    function_cn: 表示程度非常高，相当于“没有比……再……的了”
    formation: “～”部分一般用表示情感的一类形容词、二类形容词以及动词
    constraints: []
    contrasts: []
  - pattern: ～ようによっては
    function_cn: 在动作及变化方面有两个意思：①方法，②样子
    formation: “よう”接在“动词ます形去掉‘ます’”的形式后
    constraints: []
    contrasts: []
  - pattern: ～三昧
    function_cn: 前接名词，相当于汉语“专心……”“尽情……”
    formation: 前接名词
    constraints:
    - 一般用于专注于读书等兴趣爱好，不用于工作、学习等社会性行为
    contrasts: []
  - pattern: 拙宅（自谦语）
    function_cn: 说话人说起自己家时的自谦说法；同类谦称自己物品的词语还有「拙著（拙著）」，以及「愚～」「小～」「弊～」等谦称前缀
    formation: 名词前缀式谦称，如 愚息／愚妻／愚考、小社／小店／小著／小文、弊社／弊店／弊誌
    constraints:
    - 用于自谦，不可用于他人
    - 「敝姓」一类仅汉语使用而日语无对应
    contrasts:
    - 与汉语谦称用法有相同处，但部分谦称（如敝姓）日语不存在
  - pattern: 倒装句（先心情后根据/条件）
    function_cn: 先描述自己的心情，之后再叙述其根据或条件，表强调
    formation: 将本应后置的条件/根据句（如 ～れば、～と）置于心情句之后
    constraints:
    - 用于加强语气、突出主观感受
    contrasts: []
  - pattern: たとえ～だけでも～
    function_cn: 表示“即使……也……”，让步限定
    formation: たとえ 与 ～でも／～でも 连用；可去掉「だけ」成为 たとえ～でも～
    constraints:
    - 「だけ」表限定，强调只有最少数量/程度
    contrasts:
    - たとえ～だけでも～ 比 たとえ～でも～ 多一层“哪怕仅如此”的限定强调
  - pattern: ～間もない
    function_cn: 相当于汉语“不久”，接在动词た形后，修饰其后名词，表示某事发生之后不久。
    formation: 动词た形＋間もない＋名词
    constraints:
    - 书面语
    - 相关表达有「間もなく」（初级第18课），用于广播、通知等郑重场合；日常口语一般用「もうすぐ」
    contrasts:
    - 「間もなく」用于郑重/公共场合，「もうすぐ」用于日常口语
  - pattern: ～ともなると，～
    function_cn: 表示时间或人、物处于区别于其他的特别状态，相当于“既然成为……就……”。
    formation: 名词＋ともなると，～
    constraints:
    - 书面语
    contrasts: []
  - pattern: ～をよそに，～
    function_cn: 意思相当于汉语“不顾……”，表示不顾及前项而进行后项动作。
    formation: 名词＋をよそに，～
    constraints:
    - 书面语
    contrasts: []
  - pattern: ～はおろか，～
    function_cn: 意思是“不用说的事情”“当然的事情”，强调后项事情程度，前项更不用说。
    formation: 名词／动词＋はおろか，～
    constraints:
    - 强调后项事情程度的表达方式，不用于论文等客观性文章
    - 客观性文章用「～は言うまでもなく」（中级第29课）、「～はもちろん（のこと）」
    contrasts:
    - 「～は言うまでもなく」「～はもちろん」用于客观性文章
  - pattern: ～が苦になる／～を苦にする
    function_cn: 表示“感到负担”“为……而苦恼”；“苦”相当于“苦恼”，なる为自动词、する为他动词
    formation: 接在名词或动词等后，构成“～が苦になる”或“～を苦にする”
    constraints: []
    contrasts: []
  - pattern: ～てもかまわない
    function_cn: 表示许可/没关系，与“～てもいい”意义大致相同但略正式；“～にかまわず～”相当于“别管……”
    formation: 动词“かまう”的“ない形”基础上构成“～てもかまわない”“～にかまわず～”
    constraints: []
    contrasts:
    - 与“～てもいい”相比略正式
  - pattern: ～てならない
    function_cn: 书面语，表示“那种情绪不可抑制”
    formation: 接在表示自发意义的动词及表示情感的一类形容词、二类形容词的词形后
    constraints:
    - 标注为书面语
    contrasts:
    - 同义表达：～てたまらない、～て仕方がない、～てしょうがない（较随便的口语）、～てやまない（前接动词与上述不同）
  - pattern: 動詞て形＋やまない
    function_cn: 表示强烈的愿望、信念或情感（如祝愿、坚信）
    formation: 动词て形 + やまない
    constraints:
    - 多与表示意志、愿望的动词（如願う、信じる）搭配
    contrasts: []
