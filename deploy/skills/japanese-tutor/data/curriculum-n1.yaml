  themes:
  - 9 トラブル
  - 生词表1
  - 语法与表达
  - 抗议
  - 敬语表达方式的用法
  - 2. 「～ば」与「～たら」
  - 3. 「～てある」「～ている」与「～ておく」
  - 拓展：「～ておく」与「～てある」
  jlpt_estimate:
    status: unverified
  communication_functions:
  - 向工作人员询问行李未到的情况
  - 描述行李特征（颜色、名牌）
  - 请求工作人员调查并催促
  - 在到达大厅询问航班乘客是否到达
  - 请求广播呼叫
  - 抗议/抱怨的逐步升级表达（委婉→说明损失→表达愤怒与请求）
  - 对意外反应的强烈不满表达
  - 礼貌铺垫后提出请求或建议
  - 询问对方意向或是否方便
  - 请求许可（郑重）
  - 告知稍后执行动作（敬语）
  - 尊他语表达对方动作/状态
  - 表格制作与阅读的简洁表达规则
  - 书面郑重表达（～にて）
  - 日记风格文章的时态选择
  grammar:
  - pattern: ～が / ～けど（句尾）
    function_cn: 抗议或抱怨的委婉开头：陈述情况后留白，等待对方回应
    formation: 接在陈述句尾，语气缓和
    constraints:
    - 用于抗议/抱怨的初始阶段，避免直接表达愤怒
    contrasts: []
  - pattern: ～のです
    function_cn: 向对方说明自己遭受损失的具体情况
    formation: 接在动词/形容词连体形后
    constraints:
    - 用于对方回应不充分时，进一步陈述受损状况
    contrasts: []
  - pattern: ～てほしい / ～てほしいんですか / ～ていただけませんか
    function_cn: 表达不便与愤怒、要求对方采取措施（含质问与委婉请求）
    formation: 动词て形 + ほしい / いただけませんか
    constraints:
    - 用于希望对方迅速回应、升级抗议水平时
    contrasts: []
  - pattern: そんな / 失礼な / ばかな
    function_cn: 对出乎意料的反应表示不满的叹词/感叹表达
    formation: 独立感叹使用
    constraints:
    - 用于对方反应出乎意料时，表达强烈不满
    contrasts: []
  - pattern: ～ば / ～たら
    function_cn: 条件与铺垫（前置说明）用法；本讲强调其作为礼貌铺垫、引出请求或询问的语用功能
    formation: 动词ば形／た形＋ら；形容词い形ば形等
    constraints:
    - 礼貌程度低于「よろしければ」
    - 可加「もし」构成「もしよかったら」等更委婉形式
    contrasts:
    - 「よろしければ」「よかったら」「よければ」意思相近但礼貌层级不同
  - pattern: ～てある / ～ている
    function_cn: 表示某种有目的行为所造成的结果仍在持续状态
    formation: 他动词て形＋ある／ている
    constraints:
    - 「～てある」总接他动词，隐含行为实施者，强调人为导致的结果
    - 「～ている」接自动词时不隐含实施者，表示自然形成状态
    contrasts:
    - 他动词＋てある 与 自动词＋ている 在状态描述上可对应，但语用焦点不同
  - pattern: ～ておく / ～てある
    function_cn: 「～ておく」表示说话人或某人有意实施某种行为，聚焦行为本身；「～てある」表示行为完成后对象所处的状态
    formation: 动词て形＋おく／ある
    constraints:
    - 「～てある」可用「が」提示动作对象，且后不能接表示请求的表达
    - 「～ておく」聚焦行为本身、不表示结果状态，不能用「が」提示对象，但可接请求表达
    contrasts:
    - 两者意思相近，区别在于是否强调有意实施与是否表示结果状态
  - pattern: ～どおり
    function_cn: 前接名词，表示与预定、预想、时间、言语等预定好的内容没有出入，相当于汉语“与～一样”“按照～那样”；可用“～とおり／～どおり”形式修饰谓语。
    formation: 名词 + どおり
    constraints:
    - 用于与预定/预想/时间/言语等一致的情形
    contrasts: []
  - pattern: ～が、～ / ～けど、～（句尾用法）
    function_cn: 助词“が”“けど”表示转折或铺垫等，用于句尾时省略其后内容；一般用于陈述难以启齿或不好意思请求的事情，通过不明确陈述句子后半部分来缓和语气。
    formation: 句子 + が／けど（后文省略）
    constraints:
    - 句尾省略后文，用于缓和语气或难以启齿的请求
    contrasts: []
  - pattern: お～しております
    function_cn: 自谦语，由“お～します”和“～ております”的自谦语组合而成；通过降低自己的行为从而相对抬高对方，是一种礼貌表达方式。
    formation: お + 动词连用形 + しております
    constraints:
    - 自谦语，用于降低自身行为以抬高对方
    contrasts: []
  - pattern: 助词“に”与“で”（动作场所）
    function_cn: 表示场所的助词有“に”和“で”；“に”用于存在的场所和移动动作的目的地，表示不含方向性的动作发生场所时使用“で”。
    formation: 场所 + に／で
    constraints:
    - 存在场所与移动目的地用“に”；不含方向性的动作发生场所用“で”
    contrasts:
    - に：存在/移动目的地
    - で：无方向性动作发生场所
  - pattern: 後ほど
    function_cn: 表示“稍过一些时间”，与“後で”同义但更礼貌郑重；反义词为“先ほど”。
    formation: 时间副词性表达，用于请求/告知稍后执行动作。
    constraints:
    - 比“後で”更郑重，用于敬语语境。
    contrasts:
    - 先ほど（相反义）
  - pattern: お＋名词（动作名词）
    function_cn: 尊他语结构，对对方动作的名词形式前加“お”构成敬语，如“お泊まり”“お急ぎ”“お困り”。
    formation: 由动词“泊まる”的尊他语“お＋泊まり＋になる”省略“になる”后的名词形式；可后续“です”构成谓语。
    constraints:
    - 后续名词（如“ホテル”）时须加助词“の”构成“お泊まりのホテル”。
    - 动作虽非对方所为，但与对方相关时也可使用（如“お呼び出し”“おことづけ”）。
    contrasts:
    - 泊まれている（另一种尊他语形式，较“お泊まりの”冗长）
  - pattern: ～よろしいでしょうか
    function_cn: 请求许可的郑重表达，由形容词“いい”的郑重形“よろしい”加“でしょうか”构成。
    formation: 形容词“いい”的郑重形“よろしい”＋“でしょうか”。
    constraints:
    - “～でしょうか”句尾语调一般读降调。
    contrasts:
    - 请求许可表达按礼貌程度由高到低：よろしいでしょうか／よろしいですか／いいでしょうか／いいですか。
  - pattern: ～にて
    function_cn: 与助词「で」意义相同，表方式、场所、范围、联系手段等，属较郑重的书面语说法
    formation: 名词＋にて
    constraints:
    - 主要用于书面语，语体较郑重
    contrasts:
    - 与口语助词「で」功能重叠，但语体更正式
  - pattern: 表格/日记中的名词化与省略
    function_cn: 为简洁表达，多用汉语词为主的名词形式，省略动词「する」及助动词「した」
    formation: 名词短语直接成句
    constraints:
    - 用于表格、日记等简洁文体
    contrasts:
    - 与完整动词句相比更简练
  - pattern: 日记中用现在形式记录过去感受
    function_cn: 以亲历视角写作，过去事件也用现在形式，以如实传达当时感受与心情
    formation: 现在时态动词
    constraints:
    - 用于日记风格文章，区别于过去形式的报告体
    contrasts:
    - 与过去形式的报告体相比更易体会作者当时心情
  - pattern: 动词“れる”（如期待する、実施する等三类动词）名词化后接助词“の”构成“～の”
    function_cn: 表示状态，相当于“～れている”；用于名词前修饰
    formation: 动词词干（れる）+ の + 名词
    constraints:
    - 适用于三类动词的汉字部分名词化
    - 表示持续/完成的状态
    contrasts:
    - 与“～ている”表示状态意义相当
  - pattern: 拟声词后续“する”构成动词
    function_cn: 表现心理活动或事物状态
    formation: 拟声词 + する
    constraints:
    - 一类描写外部可见的样子、形态
    - 另一类描写外部不可见的心理活动或心理状态
    - 瞬间心理震动用“～とする”，持续心理状态用“～する”
    - 描写状态可用“～ている”形式，或名词前用“～した”修饰
    contrasts:
    - 瞬间 vs 持续心理状态的区别
  - pattern: だれかと思ったら
    function_cn: 用「疑问词＋か＋と思ったら」表示意外发现或察觉到某物，后项用过去式「～た」；可与各种疑问词连用。
    formation: 疑问词＋か＋と思ったら＋过去式
    constraints:
    - 后项须为过去形式
    - 表达出乎意料的发现
    contrasts: []
  - pattern: 東洋人
    function_cn: 词语讲解：日语中意为「东方人／亚洲人」，与「西洋」相对；注意与汉语「东洋人特指日本人」的差别。
    formation: 名词
    constraints: []
    contrasts:
    - 与「西洋」相对
  - pattern: ～のだろうか
    function_cn: 表示说话人基于上下文信息或某种状况而得出的疑惑，区别于单纯疑问「～だろうか」。
    formation: 小句／形容词＋のだろうか
    constraints:
    - 需有上下文或状况依据
    contrasts:
    - ～だろうか：单纯疑问
  - pattern: ～なんて
    function_cn: 小句（基本形／简体）或一类形容词／名词＋（だ）なんて，后接评价词（如すごい、うらやましい、嫌だ等），表达出乎意料、不同寻常的心情；积极评价含赞叹语气，消极评价含轻视语气；也可用于以意外语气强烈否定某事。
    formation: 小句／形容词／名词＋（だ）なんて＋评价词
    constraints:
    - 陈述焦点在于评价
    - 过去事件也可用现在形式「～するなんて」
    contrasts: []
  - pattern: ～ばかり
    function_cn: 表示限定，同时含“无论哪一个，都……”语气，并暗示该事物数量众多；可与助词が/を/に/へ结合，有时省略助词。
    formation: 接于名词后，常与が・を・に・へ搭配
    constraints:
    - 与～だけ近似但～ばかり含数量众多语气，～だけ不含
    contrasts:
    - ～だけ
  - pattern: ～らしい
    function_cn: 表示推测、传闻，或表示典型事例；具体归属需依上下文判断。
    formation: 接于名词后
    constraints:
    - 推测义与典型事例义需据上下文区分
    contrasts: []
  - pattern: やり
    function_cn: 用于语气较正式的书面语，表示“果然、终究”；口语多用やっぱり，语气郑重时用やり。
    formation: 独立副词性用法
    constraints:
    - 书面正式语体
    contrasts:
    - やっぱり
  - pattern: 相通じる
    function_cn: 表示“理解、彼此明白”，另有“共通、相似”义；多用于书面语，并有相通ずる形式。
    formation: 动词，可作相通ずる
    constraints:
    - 书面语
    contrasts: []
  pragmatics:
  - 使用礼貌体向工作人员致歉与请求（申し訳ございません、よろしくお願いいたします）
  - 表达催促与不满（早くしてもらえませんか）
  - 抗议时通常认为一开始就表达愤怒情绪不太好，应逐步升级抗议水平
  - 企业和商店回应客人抱怨时，为缓和不满与怒气一般使用最高级别敬语（如申し訳ありません）
  - 敬语层级：「申し訳ございません」为最高级别敬语，用于郑重道歉
  - 礼貌程度排序：「よろしければ」＞「よかったら／よければ」
  - お～しております 通过自谦降低自身行为以抬高对方，属礼貌表达
  - 句尾“が／けど”省略后文以缓和语气、表达难以启齿的请求
  - 礼貌程度层级：よろしいでしょうか > よろしいですか > いいでしょうか > いいですか
  - “後ほど”比“後で”更郑重
  - 「朝・昼・夕」指早中晚餐；○含于旅游费内，×不含需自付餐费；「機」指机上用餐
