  grammar:
  - pattern: ～べき
    function_cn: 表示根据一般性的价值标准或道德准则做出判断（劝告、义务）。
    formation: 动词连体形/名词 + べき
    constraints:
    - 用于表达应然判断，常带劝告语气。
    contrasts: []
  - pattern: ～ほうがいい
    function_cn: 建议或劝说对方做某事；本页语境表示判断“要选的话，最好～”。
    formation: 动词辞书形/ない形/名词 + ほうがいい
    constraints:
    - 可用疑问形式 ～ほうがいいのではないか。
    contrasts:
    - 与 ～べき 相比语气较软，偏向建议而非义务。
  - pattern: ～たらどうだ
    function_cn: 建议对方采取某种行动。
    formation: 动词た形 + たらどうだ
    constraints:
    - 主语一般不是说话人。
    - 可省略 どうだ，只用 ～たら。
    contrasts: []
  - pattern: ～たらどうするんだ
    function_cn: 通过提出不好的后果来劝服对方。
    formation: 动词た形 + らどうするんだ
    constraints:
    - 用于以负面结果反推劝告。
    contrasts: []
  - pattern: 何だって？／信じられない！
    function_cn: 对不符合常情、无法理解的行为表示惊讶，随后进行说服
    formation: 疑问/感叹短句，独立使用
    constraints: []
    contrasts: []
  - pattern: 確かにそういう考えもあるだろう／君の考えは分かる
    function_cn: 说服前表示理解对方想法，避免全盘否定
    formation: 陈述句，作铺垫
    constraints: []
    contrasts: []
  - pattern: ～べきだ／～ほうがいい／～たらどうだ
    function_cn: 在表示理解后用于说服对方
    formation: 接续于动词/形容词等，构成建议或劝诱
    constraints: []
    contrasts: []
  - pattern: 何で～ないんだ
    function_cn: 直接否定对方想法并质问为何不采取某行动
    formation: 接续于动词否定形，疑问语气
    constraints:
    - 通常先表示理解对方行动或意见，再陈述自己观点
    contrasts: []
  - pattern: おれ／おまえ
    function_cn: 男性间关系亲近时的自称与对对方称呼
    formation: 代词，独立使用
    constraints:
    - 仅用于关系亲近的男性之间，语气随便
    contrasts: []
  - pattern: ～ぞ／～んだ／～じゃないか／～な
    function_cn: 男性间随便对话的句尾形式
    formation: 接续于句末，表断定、说明、劝诱或确认
    constraints:
    - 用于关系亲近者之间
    contrasts: []
  - pattern: 打招呼/应答用语（おい、ふうん、そうか 等）
    function_cn: 用于关系亲近者之间的招呼与回应
    formation: 独立寒暄语，非句型接续
    constraints:
    - 并非关系亲近即可随时使用，部分人认为不礼貌而避免使用
    contrasts: []
  - pattern: 大＋名词（大活躍）
    function_cn: 在表示积极活动、大显身手的活动类名词前加“大”表强调，意为非常积极地活动并取得很好成果
    formation: 大＋名词；可作“大活躍する”（“大活躍をする”省略“を”的形式，非动词）；“活躍”可接“する”作动词
    constraints:
    - 不仅用于人或动物，也常用于工具等表示经常被使用或比喻性用途广泛
    contrasts: []
  - pattern: ～てくれ
    function_cn: 用于请求对方做某事时比较随便的说法；也常用于表示引用命令句（如“～てくれと言う”）
    formation: 动词て形＋くれ
    constraints:
    - 限于关系亲近的男性之间、公司上司对下属、家庭中丈夫对妻子或孩子等场合
    contrasts: []
  - pattern: ～くせに
    function_cn: 表示A不具备进行B的必要条件，常带批评A的语气；也可用于陈述“比……不够……”表示破格待遇
    formation: 小句（简体形式）＋くせに；一类形容词＋なくせに；名词＋のくせに
    constraints: []
    contrasts: []
  - pattern: 何だって？
    function_cn: 口语反问，表“你说什么”；可表反问、感动或不满，常随叹词「えっ？」使用，后接陈述理由。
    formation: 「何だ」加表示引用的「って」构成的口语形式（何だと）。
    constraints:
    - 不单纯表示反问，还用于表示感动或不满
    contrasts: []
  - pattern: ～べきだ
    function_cn: 表示某种行为很妥当，用于劝说对方做事或表达说话人希望周围是某种状态；主语一般不是说话人；用于说话人自身可以决定是否实施某行为的情况。
    formation: 动词基本形＋べきだ；一类形容词去掉「い」＋くあるべきだ；名词/二类形容词＋であるべきだ。
    constraints:
    - 主语一般不是说话人
    - 用于说话人自身可决定是否实施某行为的情况
    contrasts:
    - 非做不可的行为用「～なければならない」
    - 「～はずだ」也表某种行为很妥当，但只表示说话人确信如此，不能用于劝说或愿望
  - pattern: 今さら
    function_cn: 表示“以前还有可能，但现在就算做了也来不及”，可单独使用省略后文；另可表示“现在重新”。
    formation: 副词性用法，置于句首或句中。
    constraints:
    - 与「今から」（仅描述时间顺序，不含“来不及”语气）区分。
    contrasts:
    - 今から
  - pattern: これがいい / これでいい
    function_cn: 二者均表选择；「これがいい」为积极选择（不是其他，就是这个好），「これでいい」为消极选择（虽更好但这就够了），后者还可表界限/范围（到这个范围为止没问题）。
    formation: 「これ」+「が/で」+「いい」。
    constraints:
    - 「これでいいですか」用于询问范围是否可接受。
    contrasts:
    - これがいい
    - これでいい
  - pattern: 頑固
    function_cn: 二类形容词，表性格固执、态度固执；用于工作/研究/理想/人生哲学等场合未必含贬义；另可表“粘上了分不开”。
    formation: 接「な」修饰名词，或「頑固な＋名词」。
    constraints:
    - 与汉语“顽固”义项对应，但含“粘附难除”义（如顽固な汚れ、頑固な風邪）。
    contrasts: []
  - pattern: ～ところがある
    function_cn: 描述人的性格、为人等，主要用于负面评价；用于正面时含“出乎意料”之意
    formation: 一类形容词词干＋ところがある；二类形容词词干＋ところがある
    constraints:
    - 多用于描述人的性格、为人
    - 正面用法含意外语气
    contrasts: []
  - pattern: こうなったら
    function_cn: 陈述自身或眼前出现的某种状况，后续说话人的判断或意志
    formation: こうなったら＋判断/意志句
    constraints: []
    contrasts: []
  - pattern: ～もんか／～ものか
    function_cn: 表示否定意志
    formation: 动词基本形／一类形容词词干＋ものか／もんか；二类形容词词干＋な＋ものか／もんか
    constraints:
    - 男性用语，说法较随便
    - 女性可用「～ものですか」
    contrasts: []
  - pattern: 発つ
    function_cn: 意为“出发”，词源古老，可变为敬语，常见于口语，一般不用于文章
    formation: 可接敬语形（如「発たれますか」）
    constraints:
    - 口语常见，文章少用
    contrasts: []
  - pattern: 戻る
    function_cn: 表示回到原来在的地方或出发点
    formation: 动词
    constraints: []
    contrasts:
    - 与「帰る」（指回家或回国）区分
  - pattern: ～んじゃないだろうな
    function_cn: 提出预想的情况并进行确认，表示理所当然应该如此；常与副词「まさか」搭配，多用于自言自语，主要为男性用语。
    formation: 否定推量「～んじゃない」+「だろうな」
    constraints:
    - 男性用语为主
    - 常用于自言自语
    - 常与「まさか」搭配
    contrasts: []
  - pattern: その「まさか」なんだよ
    function_cn: 承接对方「まさか～（ない）」的否定推测，表示正如对方推测那样，予以肯定。
    formation: その「まさか」+「なんだよ」
    constraints:
    - 需承接前文对方的否定推测
    contrasts: []
  - pattern: それで～だな
    function_cn: 表示理由的「～のだ／～んだ」加上表示确认的「な」，表示“因为这个原因才这么做的呀”；是「～のですね」的较随便说法，主要为男性使用。
    formation: 理由说明「～んだ」+「な」
    constraints:
    - 男性使用为主
    - 较随便的说法
    contrasts:
    - 与「～のですね」语体更随便
  - pattern: ～てやる
    function_cn: 表示说话人给予对方利益、恩惠；另有表示说话人强烈意志和决心的用法。
    formation: 动词て形 + 「やる」
    constraints:
    - 主要为男性使用
    - 使用场合仅限于关系亲近的人之间或上司对下属等
    contrasts: []
  - pattern: はるか
    function_cn: 副词，表示距离或时间相隔很远；现多用于书面语。
    formation: 副词，修饰动词/句子。
    constraints:
    - 书面语色彩较强。
    contrasts: []
  - pattern: 欲を出す
    function_cn: 惯用表达，表示显露出超出一般的欲望。
    formation: 名词「欲」+ 动词「出す」。
    constraints: []
    contrasts:
    - 欲が深い（欲壑难填）
    - 欲張り（贪得无厌）
  - pattern: ～となると／～とすれば／～とすると／～としたら
    function_cn: 表示假定条件，将某种情况特别提出，陈述该情况下的结果。
    formation: A（名词/动词等）+ となると／とすれば／とすると／としたら + B。
    constraints:
    - 用法一：把 A 作为实现可能性不明朗的事情看待，表示果真那样的话则结果为 B。
    - 用法二：把 A 作为肯定能够实现的事情看待，表示果真那样的话则结果为 B，多直接利用对方所说的话。
    contrasts:
    - ～とすれば／～とすると／～としたら 同样表示假定条件，兼具陈述假定情况与陈述现实情况两种用法。
  - pattern: ～とすると
    function_cn: 提出假设前提，表示“如果……的话”（本页仅见例句，讲解文字在前页）
    formation: 动词/形容词/名词 + とすると
    constraints: []
    contrasts: []
  - pattern: 自ら
    function_cn: 表示“自己本人”“亲自（做）”“自发地（做）”，强调非受强迫、主动为之
    formation: 可接助词「が」「を」，也可不用助词直接接续动词
    constraints:
    - 直接接动词时强调自发、主动
    contrasts: []
  - pattern: それもそのはず
    function_cn: 连接前文事实与后文理由，表示“之所以如此，看了后面的理由/事实便觉得理所当然”
    formation: 由「それも」+「そのはず」组合；可接助词「で」构成「それもそのはずで」
    constraints:
    - 前接事实/结果，后接理由或原因
    contrasts: []
  - pattern: ～倍
    function_cn: 表示倍数，不仅指两倍，可接数字后使倍数增大
    formation: 数字 + 倍；数字可用汉字或阿拉伯数字
    constraints:
    - 日语无“一倍”的说法，表示一倍时用「2倍」或直接用「倍」
    - 「数十倍」「数百倍」等概数表达中只用汉字，不用阿拉伯数字
    contrasts:
    - 汉语“一倍”与日语「2倍」可表同义，但日语无「1倍」
  - pattern: 同程度
    function_cn: 接在名词后，表示“相同的……”（如同时期、同種類）
    formation: 名词 + 同程度
    constraints: []
    contrasts: []
  - pattern: ～なされる
    function_cn: 三类动词する的古语形式なす的被动形式，构成被动句；一般不用于口语，常用于书面语
    formation: 动词なす（する的古语）的被动
    constraints:
    - 构成被动句时目的助词「を」变为「が」
    contrasts: []
  - pattern: 皆無
    function_cn: 名词，表示完全没有；多用于修饰抽象事物（如例、可能性、恐れ）
    formation: 名词，常作谓语或修饰抽象名词
    constraints:
    - 基本不用于表示具体物体的有无
    contrasts: []
  - pattern: しかも
    function_cn: 连词，表示补充性质相同或相近的信息
    formation: 用于句子中间，也可用于句首
    constraints: []
    contrasts:
    - 用法与「さらに」相同
  - pattern: 音读（音読み）的种类区分
    function_cn: 说明同一汉字因传入时期与来源方言不同而具有多种音读（吴音、汉音、唐宋音），并举例说明同一字在不同词语中读法不同
    formation: 吴音／汉音／唐宋音 三类音读对照
    constraints:
    - 部分字在吴音与汉音中读法相同，部分字在不同词语中读法不同
    - 加上唐宋音后，有的字音读可达三种
    contrasts:
    - 吴音 vs 汉音 vs 唐宋音 的读音差异
  - pattern: 连浊（促音/浊音化）
    function_cn: 说明日语汉语词中复合词结合时后部词语第一个音发生浊化的现象
    formation: 复合词结合处后部首音浊化
    constraints:
    - 外来词与汉语词（音读）结合构成复合词时不发生连浊
    contrasts:
    - 汉语词复合连浊 vs 外来词复合不连浊
  pragmatics:
  - 说服时先表示理解再陈述观点，避免全盘否定
  - 男性间亲近对话使用特定自称、对称与句尾形式
  - 打招呼用语的礼貌度与使用对象限制
  - ～てくれ 的性别与上下级使用限制
  - 「～もんか／～ものか」为男性用语，女性可用「～ものですか」
  - 多条表达标注为男性用语
  - 「～てやる」限于关系亲近者或上下级之间
