  jlpt_estimate:
    status: unverified
  communication_functions: []
  grammar:
  - pattern: 简体句与敬体句的区分
    function_cn: 说明文/条目式写法中句尾用简体，书信等用敬体；引用人物对话时可用敬体加引号
    formation: 动词、一类形容词用基本形/ない形/た形/なかった形；二类形容词和名词用～だ/～である/～ではない/～だった/～であった/～ではなかった
    constraints:
    - 一类形容词敬体为「早いです」，简体为「早い」，不可用「早いた」「早いである」
    contrasts: []
  - pattern: 条目式写法（说明操作步骤）
    function_cn: 用于说明烹调、服装制作、家具组装、器械操作等步骤，句子尽量简短易懂
    formation: ①动词ます形去掉ます接续；②句尾动词用基本形；③用「～こと。」表示需引起注意的内容
    constraints:
    - 第①②条也是简体文章常见特点
    contrasts: []
  - pattern: 思い浮かべる 及带「思い～」的复合动词
    function_cn: 「思い浮かべる」相当于汉语“想起”；同族复合动词有思い出す（想起来）、思いつく（想出、想到）、思い込む（误以为、深信不疑、固执地认为）、思いきる（毅然决然）
    formation: 复合动词结构「思い＋动词」
    constraints:
    - 「思いきる」多以「思いきって～」「思いきった～」形式使用
    contrasts:
    - 思い出す / 思いつく / 思い込む / 思いきる 语义侧重不同
  - pattern: 実は / 実際には
    function_cn: 均表“事实是”，但语用不同：「実は」用于说话人/书写人所提内容与读者或听者想象相悖时；「実際には」仅传达客观事实，不含与预想相反的含义，可与「実は」互换，而「実は」不可被「実際には」替换。口语中「実は」多用于提起难以启齿的话题或请求对方帮助前进入正题。
    formation: 副词性用法，置于句首或主语后
    constraints:
    - 「実は」隐含与听者/读者预想相反的信息
    - 「実際には」仅陈述事实，无相反预想含义
    contrasts:
    - 「実は」与「実際には」在“与预想相反”语义上的差异
  - pattern: ～風
    function_cn: 加在名词后表示“……的样子/风格”，多用「～風の～」「～風～」形式，表示外观上呈现的样子，常含“看似如此但不确定是否属实”的意味。
    formation: 名词 + 風（の）+ 名词
    constraints:
    - 强调外观呈现的样子，而非种类分类
    contrasts:
    - 「～式」按种类/形式分类（如洋式・和式・新式・旧式・正式・略式・記名式・無記名式），「～風」仅表外观样子
  - pattern: ～に限らず
    function_cn: 表示“不只限……”“不仅……”，主要用于书面语
    formation: 接在名词后
    constraints:
    - 主要用于书面语
    contrasts: []
  - pattern: もはや
    function_cn: “もう”的书面语，相当于汉语“已经”，常用于事物发生很大变化的上下文
    formation: 副词用法
    constraints:
    - 书面语
    contrasts:
    - 与口语的「もう」对应
  - pattern: ～といってもいい
    function_cn: 用于阐述近乎言过其实的见解，比「～といえる」更委婉
    formation: 接在句子后
    constraints:
    - 说话人不太自信，表达委婉
    contrasts:
    - 与「～といっても過言ではない」相同，用于阐述近乎言过其实的见解
    - 比「～といえる」委婉
    - 「～といってもいいのではないか」「～といってもいいのではないだろうか」更为委婉
  - pattern: ～由来の～
    function_cn: 表示“来自……的……”，后续名词
    formation: 「由来」作名词使用，后接「の」+名词
    constraints: []
    contrasts: []
  - pattern: 見える／見られる
    function_cn: 区分‘肉眼可见’与‘满足条件才可见／自然现象被动’两种含义，辨析主动与被动用法
    formation: 动词‘見える’与被动形‘見られる’
    constraints:
    - ‘見られる’除表示满足条件才可能看到外，还表示自然现象的被动
    - 自然现象被动用法中可用‘見える’或‘見かける’替换
    contrasts:
    - ‘見える’（可以看到/看得见）与‘見られる’（条件性可见/自然现象）
  - pattern: これほど～は、～ない
    function_cn: 承接已叙述内容后接否定句，表示程度非常高（‘这么……并不多见’）
    formation: これほど＋名词/形容词＋は＋否定
    constraints:
    - 口语中‘これほど’可改用‘こんなに’
    contrasts: []
  - pattern: さまざま（书面语）
    function_cn: 表示‘各不相同/各种各样’，书面语程度较高
    formation: 二类形容词，修饰名词时用‘さまざまな’；偶尔用‘さまざまな’‘いろいろな’形式
    constraints:
    - 可与‘いろいろ’替换，但语体更书面
    contrasts:
    - ‘さまざま’与‘いろいろ’（语体差异）
  - pattern: いろいろ／さまざま
    function_cn: 表示多种多样；可作谓语（さまざまだ／いろいろだ），也可作副词修饰动词
    formation: 接名词或作谓语；副词用法修饰动词
    constraints:
    - 「いろいろ」可作副词，「さまざま」不能作副词
    contrasts:
    - 「いろいろ」与「さまざま」在副词用法上的差异
  - pattern: そう（与否定句共现）
    function_cn: 相当于汉语“不很……”，表示程度不高
    formation: 与否定形式搭配使用
    constraints: []
    contrasts:
    - 可替换为「そんなに」「それほど」
  - pattern: ～のではないだろうか
    function_cn: 书面语，作者委婉阐述自己意见时使用的表达方式
    formation: 接在陈述句后
    constraints:
    - 标注为书面语
    contrasts: []
  - pattern: あと～もすると、～ことだろう
    function_cn: 相当于汉语“大约几十年后，恐怕……”，表示对未来的推测
    formation: 「あと」+时间量+「もすると」+「～ことだろう」
    constraints:
    - 「する」与时间表达搭配表示经历的时间时，仅限于「～すると～」「～すれば～」这种形式
    contrasts: []
  - pattern: 一旦（いったん）
    function_cn: 表示暂时中断或暂停
    formation: 接在动词/状态描述后，引出后续动作或状态变化
    constraints:
    - 用法①：暂时中断此前进行的事，待做完其他事后再回头继续做
    - 用法②：表示此前一直持续的状态暂时停止，过一段时间后又重新开始
    contrasts:
    - 与汉语“一旦”用法不同，需注意区分两种含义
  - pattern: ～も～ば，～も～
    function_cn: 并列两项，相当于汉语“又……又……”“也……也……”
    formation: 前项接“も～ば”，后项接“も～”
    constraints:
    - 可替换为“～も～し，～も～”
    contrasts:
    - 与“～も～し，～も～”功能相同，可互换
  - pattern: 日本造英语词／和製英語
    function_cn: 词汇主题：用片假名书写的日本造英语词
    formation: 由英语/法语等词素组合而成（如 after+service、gasoline+stand、gum+tape）
    constraints:
    - 除真正外来词、部分动植物名称、象声词外，还有一部分称“和製英語”
    - 此类词大多只在日语中流通，在英语世界不被承认
    contrasts:
    - 与真正的外来词相区别
  pragmatics:
  - 口语中「実は」用于提起难启齿话题或请求帮助前铺垫
  - 「～のではないだろうか」用于委婉表达作者意见，属语用层面的书面表达策略
