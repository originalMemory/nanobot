  grammar:
  - pattern: ～系
    function_cn: 接在名词后表示具有同一性质的集合体（如体育领域、文艺领域等）
    formation: 名词＋系
    constraints:
    - 用于表示某一类别、领域或血统/系统归属的集合概念
    contrasts:
    - 与单纯名词不同，强调同类事物的集合或系统归属
  - pattern: 文武両道
    function_cn: 表示学问（文）与武艺（武）两方面并重
    formation: 固定表达
    constraints:
    - 用于描述重视文武兼修的精神或传统
    contrasts: []
  - pattern: ～を数える
    function_cn: 合计数量为……，主要用于强调数量之多
    formation: 名词＋を数える
    constraints: []
    contrasts: []
  - pattern: 全国制覇
    function_cn: 相当于“夺冠”或“夺取冠军”，指在日本全国夺取第一名
    formation: 全国制覇する／全国制覇を成し遂げる
    constraints: []
    contrasts: []
  - pattern: ～に取り組む
    function_cn: 为实现心中的目标而努力奋斗
    formation: 名词＋に取り組む
    constraints:
    - 多用于个别、具体的目标（如某项研究、开发）
    contrasts:
    - 与～に励む相比，用于个别目标时优先使用
  - pattern: ～に励む
    function_cn: 与取り組む相似，表示努力、勉励
    formation: 名词＋に励む
    constraints:
    - 书面化程度更高
    contrasts:
    - 与～に取り組む均可用于练习、稽古、学业等一般性较高的词
  - pattern: 稽古
    function_cn: 练习，主要与特定道艺类词语一同使用
    formation: 稽古に励む／稽古に取り組む
    constraints:
    - 搭配对象：踊り、楽器、剣道、柔道、茶道、華道、書道等
    contrasts: []
  - pattern: ～の稽古／～の稽古をする
    function_cn: 表示传统演艺、武术等的练习，也用于钢琴、小提琴等；另有“稽古事”表示演艺但不含武术
    formation: 名词＋の稽古（する）
    constraints:
    - 用于练习、训练语境
    contrasts:
    - 稽古事：仅指演艺，不包括武术
  - pattern: ～に関係なく
    function_cn: 表示A对B的实现没有影响
    formation: 名词A＋に関係なく＋B
    constraints:
    - A须为名词
    contrasts: []
  - pattern: ～ない者はいない
    function_cn: 双重否定表肯定，意为“谁都……”
    formation: 否定表达＋名词＋否定表达
    constraints:
    - 双重否定结构
    contrasts: []
  - pattern: ～も～ない
    function_cn: 表示全面否定
    formation: 表示数量少的词语＋も＋后续否定表达
    constraints:
    - 前接数量少词语
    contrasts: []
  - pattern: ～であり、また～でもある
    function_cn: 相当于汉语“既……，又……”“既……，也……”
    formation: ～であり、また～でもある；亦可用“～でもあり、また～でもある”
    constraints:
    - “また”可省略
    contrasts: []
  - pattern: ～であり、～でもある
    function_cn: 并列说明，既……又……；主要用于书面语，口语中多用「～でもありますし、～でもあります」的形式。
    formation: 接在名词或形容词后，构成书面语并列结构。
    constraints:
    - 书面语色彩较强，口语中改用「～でもありますし、～でもあります」。
    contrasts: []
  - pattern: ～ないまでも、～
    function_cn: 让步，相当于汉语“即使不……，也……”。
    formation: 接在动词否定形（ない）或形容词否定形后，后接主句。
    constraints:
    - 表示退一步的让步，主句仍成立。
    contrasts: []
  - pattern: ～というより
    function_cn: 对比，意思是“比起……更确切地说……”。
    formation: 「名词＋というより」「小句（简体形式）＋というより」。
    constraints:
    - 用于修正或更准确地表述前项。
    contrasts: []
  - pattern: ～の代わりに／～に代わって
    function_cn: 替代，意思是“与……相抵”“代替……”。
    formation: 「名词＋の代わりに」「名词＋に代わって」。
    constraints:
    - 表示用后者取代前者。
    contrasts: []
  - pattern: ～に反して
    function_cn: 相反，意思是“与……相反”。
    formation: 「名词＋に反して」「小句（简体形式）＋に反して」。
    constraints:
    - 表示结果与预期或前项相反。
    contrasts: []
  - pattern: ～にひきかえ
    function_cn: 对比，意思是“与……完全不同”。
    formation: 「名词＋にひきかえ」「小句（简体形式）＋にひきかえ」。
    constraints:
    - 强调两者之间的差异或对照。
    contrasts: []
  - pattern: あえて
    function_cn: 副词用法，表示不顾困难而有意地、刻意地；常与「苦言を呈する」「危険を冒す」等搭配
    formation: 动词/名词前作副词修饰
    constraints: []
    contrasts: []
  - pattern: ～に由来している／～に由来する
    function_cn: 表示源自、来源于某事物
    formation: 名词＋に由来する／由来している；名词前用「～に由来する」或「～に由来した」
    constraints:
    - 与「～由来の～」形式对应
    contrasts: []
  - pattern: ～と並ぶ／～と並んで
    function_cn: 表示与……比肩、与……匹敌；前接比较对象，后接比较内容
    formation: 名词＋と並ぶ／と並んで＋名词
    constraints: []
    contrasts:
    - 可替换为「～に匹敵する」
  - pattern: ～抜く
    function_cn: 表示“……到底”或“彻底……/极其……”；与考える・苦しむ・耐える・戦う等动词结合，表示需要克服难关或必须十分努力。
    formation: 动词ます形去掉‘ます’＋抜く
    constraints:
    - 具体取“到底”还是“彻底/极其”由前接动词的意义决定。
    - 与～きる（程度达到最终阶段）区分：如“10分で短篇を読みきる”可说，而“10分で短篇を読み抜く”一般不说。
    contrasts:
    - ～きる
  - pattern: ～込む
    function_cn: 一般4个意思：①动作者本人“进入”（中心动词为自动词）；②作为动作的结果“进入”（中心动词为他动词）；③充分进行；④保持状态。
    formation: 动词ます形去掉‘ます’＋込む
    constraints:
    - “打ち込む”表示做某事很投入，最好作为一个单词理解；其对象以‘に’表示，多用作褒义。
    contrasts: []
