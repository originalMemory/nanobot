  grammar:
  - pattern: 称赞用语（すばらしい／すごい／最高 等）
    function_cn: 表达称赞、赞叹
    formation: 可加「本当に」等程度修饰语；通过声音高低变化增强情感
    constraints: []
    contrasts: []
  - pattern: 以感想表达称赞（感動する／言葉では表せない 等）
    function_cn: 通过表达自身感动、难以言表来间接称赞对方
    formation: 动词/形容词 + 感想表达
    constraints: []
    contrasts: []
  - pattern: 意外に／案外 等表示与预想不同的副词
    function_cn: 表示出乎意料
    formation: 副词 + 形容词/动词
    constraints:
    - 用于称赞时若暗示对方原本不如预期，会显得不礼貌
    contrasts:
    - かなり／相当／けっこう／なかなか 不表示最高程度，用于称赞时需留意
  - pattern: 对尊长的称赞转换（勉強になる 等）
    function_cn: 对长辈/尊长不直接评价对方，而转换到自身受益的角度
    formation: 直接评价对方（如「賢い」）→ 改为表达对自己的帮助
    constraints:
    - 直接评价尊长（如夸其聪明）属不礼貌
    contrasts: []
  - pattern: 谦虚回应（とんでもございません／まだまだです 等）
    function_cn: 受到称赞时以否定或自谦表达谦虚
    formation: 强烈否定 / 「まだまだです」等表示不值得称赞
    constraints:
    - 接受称赞时也可对赞扬之辞表示感谢
    contrasts: []
  - pattern: 省略主语
    function_cn: 依据前后文可理解时省略主语；主语内容多时用概括性、代表性词语或指示词（如「以上」「これ」「それ」）代替
    formation: 概括性名词/指示词 + 谓语
    constraints:
    - 需依赖上下文可推断主语
    contrasts: []
  - pattern: ～抜きで
    function_cn: 表示平常总伴随的东西不在一起；「お世辞抜きで」指不说应酬话、表示发自真心
    formation: 名词 + 抜き + で
    constraints:
    - 动词「抜く」名词化后接「で」
    contrasts:
    - 「～は抜きにして」与「～抜きで」意思相同
  - pattern: ほかにも
    function_cn: 表示除了话题中谈到的事物以外还有其他事物，即“除此之外，还……”
    formation: 副词性表达「ほかに」+ 后续助词「も」
    constraints: []
    contrasts: []
  - pattern: 確かに～でも～
    function_cn: 先认同对方所说内容，再用转折提出不同看法或补充对方忽略的前提
    formation: 「確かに」由二类形容词「確か」+「に」构成，可单独使用或修饰动词、接句子；后接「でも」「が」「しかし」等转折表达
    constraints:
    - 用于自己认同对方内容但需补充或转折的场合
    contrasts: []
  - pattern: 売り込む（复合动词）
    function_cn: 复合动词，前项动词结果中添加「込む」的“进入/深入”意义；「売り込む」指积极开展活动以促进产品销售
    formation: 由动词「売る」+「込む」构成；「込む」在他动词前表「入れる」，在自动词前表「入る」
    constraints:
    - 前项为他动词（如投げる/放る/持つ）时「込む」表「入れる」
    - 前项为自动词（如流れる/倒れる/落ちる）时「込む」表「入る」
    - 「売り込む」「申し込む」等词中“进入”意义不明显
    contrasts: []
  - pattern: ～の間
    function_cn: 表示空间、时间，或人与人之间的关系；用于说明在许多人当中
    formation: 说明二者关系时用「AとBの間（A和B之间）」形式
    constraints:
    - 一般用于表示空间和时间，也可用于人与人之间的关系
    contrasts: []
  - pattern: たいした
    function_cn: 直接修饰名词，表示事物程度很高；后接否定形式时表“不太重要/不太好”，常用于受称赞时的谦逊表达；“たいしたものです”形式表示非常出色、令人佩服。
    formation: たいした + 名词；たいした + 名词 + ではありません；たいしたものです
    constraints:
    - 多用于受到称赞时表谦逊
    - 否定形式弱化程度
    contrasts: []
  - pattern: 私ども
    function_cn: 与“私たち”同义，“ども”为自谦后缀，用于商业活动对自己一方表谦逊，也可指所属部门或公司整体；一般不用于自己以外的人。
    formation: 私ども + も + 动词
    constraints:
    - 自谦语，不用于指他人
    - 可指自己一方或所属公司/部门整体
    contrasts:
    - 私たち（普通第一人称复数）
  - pattern: 关联词语（初级/中级/高级层级对照）
    function_cn: 按初级—中级—高级三档对照的词汇主题：初级/中等/高等、低度/中度/高度、新人/中堅/ベテラン、アマチュア/プロフェッショナル、素人/玄人；以及基准/水準/段階、進歩する/上達する/達する等。
    formation: 词汇层级对照表
    constraints: []
    contrasts: []
  - pattern: カップル
    function_cn: 名词，指夫妻、情侣等男女二人组合，可作主语或宾语，用于外出、年配等搭配。
    formation: 名词，源自英语 couple。
    constraints:
    - 限定为二人组合
    contrasts: []
  - pattern: 家族連れ／親子連れ／子供連れ
    function_cn: “連れ”前接名词，表两人以上一起行动；本课指全家人一起旅游。
    formation: 名词＋連れ。
    constraints:
    - 除家族、親子、子供外不宜随意前接其他名词
    - 可前接表示人数的词（如2人、5人），但少用于人数较多、看不出具体人数的情况
    contrasts: []
  - pattern: 無数に
    function_cn: 名词“無数”加助词“に”修饰动词，表数量极多、数不清。
    formation: 無数＋に＋动词；“無数”加“の”修饰名词。
    constraints:
    - 意思与汉语“无数”相同
    contrasts: []
  - pattern: さかのぼる
    function_cn: 动词，本意朝河流上游逆流而行，引申为回到过去或原点，本课指追溯到约700年前。
    formation: 动词，常与“～まで”搭配表追溯到的时间点。
    constraints: []
    contrasts: []
  - pattern: 通る
    function_cn: 动词，原为通过的意思，也可用于“道が通る”表道路开通；本课指胡同通往住宅周边。
    formation: 动词，可作“道が通る”等表达。
    constraints:
    - 本课用于“胡同”而非“道”
    contrasts: []
  - pattern: 東西南北
    function_cn: 方位词在日语中的语序规则：表示方位时须颠倒汉语顺序（东南→南東、西北→北西等），表示地区时可用東南、東北等。
    formation: 方位名词，注意与汉语语序相反
    constraints:
    - 表示方位时不可用東西南北原序
    - 地区名（如東南アジア）可用原序
    contrasts:
    - 方位表达 vs 地区名表达
  - pattern: せいぜい
    function_cn: 表示“最多也……”“程度再高也不过……”，就整体而言数量少、程度不高；可后接程度等。
    formation: 副词，置于数量或程度前
    constraints:
    - 用于限定上限，含主观评价
    contrasts: []
  - pattern: ～とまでいわれた
    function_cn: 表示前面内容属于极端情况，相当于“甚至被说成……”；由～といわれる加极端程度词まで构成，有时用さえ代替まで。
    formation: 动词/形容词连体形 + とまでいわれる（被动/传闻）
    constraints:
    - 用于极端、夸张的评价
    contrasts:
    - ～といわれる（一般评价） vs ～とまでいわれる（极端评价）
  - pattern: ～ことに
    function_cn: 表示说话人对句子内容的主观评价（如遗憾、庆幸等），前接内容为评价对象。
    formation: 二类形容词+なことに / 一类形容词+ことに / 动词(た形)+ことに
    constraints:
    - 前接内容须为可被主观评价的事实
    contrasts: []
  - pattern: ～(よう)とする
    function_cn: 表示动作意图或尝试实现某动作；以～ようとしている形式表示事情即将发生时的状态
    formation: 动词意志形＋とする；变体含～ようとした、～ようとしている
    constraints:
    - 表示意图/尝试时，主语一般为具有意志的人或动物
    - 表示即将发生时，常与『今にも（眼看就要）』连用，多用于自然现象等无意志的动作
    - 主语为有意志的人或动物且用～ようとしている时，含尝试了某动作但尚未取得成功的语感
    contrasts:
    - 区分『意志/尝试』用法与『即将发生』用法，二者主语性质不同
  - pattern: 复合词（複合語）
    function_cn: 由两个词结合构成新词，包括复合动词、复合名词、复合形容词
    formation: 复合动词由两个动词结合，可附加表示‘体’的成分或表示方向的成分；复合名词由两个名词结合；复合形容词在词干后附加形容词基本形
    constraints: []
    contrasts: []
  - pattern: 复合词分类
    function_cn: 按前后词语意义关系分为三类
    formation: ①前词修饰后词；②前后词成对并列；③重复同一个词
    constraints: []
    contrasts: []
