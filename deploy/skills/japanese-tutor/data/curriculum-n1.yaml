  grammar:
  - pattern: ～から
    function_cn: 表示原因、理由（口语，前项为事实或状态）
    formation: 动词/形容词/名词（+は）+ から
    constraints:
    - 多用于口语，理由与结论之间逻辑较直接
    - 与「～ので」相比语气较随意
    contrasts:
    - ～ので
  - pattern: ～ので
    function_cn: 表示原因、理由（较礼貌、书面）
    formation: 动词/形容词/名词（+は）+ ので
    constraints:
    - 语气比「～から」委婉、正式
    contrasts:
    - ～から
  - pattern: ～と思う／～と思っています
    function_cn: 表达说话人的打算、计划、想法
    formation: 动词意志形/辞书形 + と思う／と思っています
    constraints:
    - 「～ています」表示已形成的计划或持续的想法
    - 常与意志形（～よう）搭配表达意图
    contrasts: []
  - pattern: ～てから
    function_cn: 表示前项动作完成后进行后项
    formation: 动词て形 + から
    constraints:
    - 强调时间先后顺序，前项先完成
    contrasts: []
  - pattern: そろそろ～よう
    function_cn: 提议/表示差不多该做某事
    formation: そろそろ + 动词意志形
    constraints:
    - 用于提醒或建议开始某事
    contrasts: []
  - pattern: 动词的意志形
    function_cn: 说话人当场表示自己的决心、意志；因相当于“～ましょう”的简体形，除表意志外还可表示提议。
    formation: 一类动词：基本形最后一个音变为相应“お”段上的长音；二类动词：基本形“る”变“よう”；三类动词：“来る”变“来よう”、“する”变“しよう”。
    constraints: []
    contrasts: []
  - pattern: 动（意志形）＋と思います
    function_cn: 说话人向听话人表示自己要做某事的意志，比单纯意志形更礼貌、温和。
    formation: 动词意志形后接“と思います”。
    constraints:
    - 向听话人表示自身意志时一般不单独使用意志形，而用此形式。
    contrasts:
    - 与单纯意志形相比语气更礼貌温和。
  - pattern: 动词意志形 + と思っています
    function_cn: 表示自己已把某种意志持续了一段时间
    formation: 动词意志形（～よう）+ と思っています
    constraints:
    - 用于意志已持续一段时间、尚未最终定型的语境
    contrasts:
    - 与单纯意志形（当场形成的意志）不同，后者不能接～ようと思います／～ようと思っています
    - 与～ようと思います相比，～ようと思っています因使用～ています形式，带有决心或意志尚未最后形成的语感
  - pattern: 小句1 + ので + 小句2
    function_cn: 表示原因、理由
    formation: 可接简体形后，也可接敬体形后，接简体形较多；二形容词小句和名词小句时把简体形“だ”变为“な”再加“ので”，构成“な＋ので”
    constraints:
    - 比～から更礼貌郑重，多用于正式场合
    - 口语中往往发成～んで
    - 当小句2表示提议时必须使用～から，不能用～ので
    contrasts:
    - ～ので 与 ～から 相比语感更郑重；～から 陈述理由的感觉更强烈
  - pattern: そろそろ
    function_cn: 表示做某事或某事态发生的时间渐渐迫近；用于做客时发觉该到回家时间而告辞；与「～ましょうか」或意志形「か」连用，表示随时间迫近提醒或催促对方与自己一起行动。
    formation: 副词性用法，置于句首或动词前；可接「～ましょうか」「意志形＋か」。
    constraints:
    - 用于时间临近的语境
    - 做客告辞场景常用「そろそろ失礼します」
    contrasts: []
  - pattern: '*それじゃ'
    function_cn: 「それでは（那么）」的较随便说法，用于口语，承接上文引出结论或转折。
    formation: 独立语/接续语，置于句首。
    constraints:
    - 口语体，较「それでは」随意
    contrasts:
    - それでは（较郑重）
  - pattern: '*まあ'
    function_cn: 表示不十分理想但还能过得去的程度，用于调控自己或对方的不满情绪，含勉强接受之意。
    formation: 感叹/语气副词，可独立或插入句中。
    constraints:
    - 用于缓和不满、勉强认可
    contrasts: []
  - pattern: 自言自语时的「な」
    function_cn: 自言自语时在简体形后接「な」表示感叹；「なあ」为「な」音拖长的说法，用于较强烈的感叹。
    formation: 简体形（形容词/动词/名词简体）＋な／なあ。
    constraints:
    - 用于自言自语，不用于敬体形
    contrasts:
    - 「な」与「なあ」感叹强度不同
  - pattern: 楽しみです
    function_cn: 表示盼望、期待的心情；也可指感到愉悦的事物、兴趣或娱乐等。
    formation: 名词性表达，常与「～にしています」搭配表示期待；用于指愉悦事物时直接作谓语。
    constraints:
    - 表示‘请你愉快地期待着’时需用「楽しみにしてください」形式。
    contrasts: []
  - pattern: 行楽地
    function_cn: 指众人去游览的名胜古迹、设有旅游及娱乐设施的场所（景点）。
    formation: 名词，作主语或宾语。
    constraints:
    - 用于描述樱花季、红叶季、黄金周等连休期间人山人海的场所。
    contrasts: []
  - pattern: ～でいっぱい
    function_cn: 表示某个场所或容器已达饱和状态，不可能再容纳更多的人或物。
    formation: 名词（场所/容器）＋で＋いっぱい（＋です/になります）。
    constraints:
    - 强调‘满、挤满、装满’的饱和状态。
    contrasts: []
  pragmatics:
  - 「ごめん」用于平辈间道歉
  - 「お疲れ様でした」用于工作结束时的寒暄
  - 「気をつけて」用于送别叮嘱
  - 意志形＋と思います比单纯意志形更礼貌、温和
  - ～ので 较礼貌郑重，多用于正式场合；～から 多用于口语且理由感更强
  - 「そろそろ失礼します」用于做客时礼貌告辞
  - 「まあ」用于缓和语气、表达勉强认可
  - 自言自语「な」不用于敬体
  - 「楽しみにしてください」用于邀请对方期待某事（如请对方来家做客并期待美食）。
  - 办公室内同事间较随意的提议语气（～んですが…）
  - 对迟到者的宽容回应（まあ、仕方ないな）
  - 面向第三人称的召集用语（～しようか）
