  grammar:
  - pattern: どういう〜 / どんな〜
    function_cn: 表示疑问；不明白对方所说内容时使用
    formation: 接名词；「どういう」询问内容，「どんな」询问性质或种类
    constraints:
    - 详细询问具体内容时只能用「どういう」
    - 「どんな」可替换为「どういう」用于询问种类/性质
    contrasts:
    - 「どういう＋名词」与「どんな＋名词」有时可互换，但具体内容限定用「どういう」
  - pattern: 〜ということですね / 〜ということですか
    function_cn: 把对方说的话用自己的语言重新表述并请求确认；或询问自己不太清楚的事情
    formation: 前接完整句子（陈述内容）
    constraints:
    - 请求对方确认用「〜ということですね」
    - 询问自己不太清楚的事情用「〜ということですか」
    contrasts:
    - 「〜ということですね」用于向对方确认，「〜ということですか」用于向自己/对方求证
  - pattern: 〜たっけ / 〜だっけ
    function_cn: 确认记不太清或之前听说过的事情；比较随便的口语表达
    formation: 前接动词、形容词、名词等做谓语的过去形式
    constraints:
    - 口语、随意语域
    contrasts: []
  - pattern: 〜ね / 〜でしょう
    function_cn: 进行确认；估计对方会认同时用「〜ね」加以确认
    formation: 复述对方所说内容后加「ですね」；简略谈话中可直接在谓语后续「ね」
    constraints:
    - 用于估计对方会认同的场合
    contrasts: []
  - pattern: ～ね
    function_cn: 表示确认；用于要确认的事情是彼此都知道、或对方比较清楚、且自己判断正确时；以对方熟知的事为话题时句尾加ね表示确认或征得对方同意
    formation: 句尾助词，接于陈述句后
    constraints:
    - 前提为双方已知或对方清楚，且说话人判断正确
    contrasts: []
  - pattern: ～でしょう（だろう）
    function_cn: 向对方确认；用于自己熟知但对方不甚清楚或持有不同意见时；或对方清楚但自己不清楚、自己做出判断并向对方确认时
    formation: 接于动词/形容词等后，括号内为口语形
    constraints:
    - 用于确认或征询，语气较～ね弱
    contrasts:
    - 与～ね相比，多用于对方未必清楚或意见可能不一致的情形
  - pattern: ～じゃないですか
    function_cn: 和听话人意见不一致时，迫使听话人重新确认自己已知道的事情，语气强硬
    formation: 接于动词/形容词否定形后
    constraints:
    - 语气强，带有质疑或反驳意味
    contrasts:
    - 与～よ相比，～じゃないですか更偏向迫使对方重新确认
  - pattern: ～よ
    function_cn: 表示自己的主张
    formation: 句尾助词
    constraints: []
    contrasts:
    - 与～じゃないですか相比，～よ更直接表达主张
  - pattern: 反问（上升语调复述对方词语）
    function_cn: 为确认或促使对方往下说而使用上升语调复述对方所说的词语；表示对所听到事情感到意外
    formation: 敬体在对方词语后加“ですか”；“对方说的话＋だって？”表意外，其敬体为“～ですって？”；常用叹词“えっ？”
    constraints:
    - 敬体与常体形式不同，需区分“ですか”与“ですって？”
    contrasts:
    - “～ですか”用于反问确认，“～だって？”用于表示意外
  - pattern: 文体（简体・敬体）
    function_cn: 说明口语中对同一对象说话时句尾形式应保持一致，不可混用；但在总结谈话或致辞、训话等正式场合，听众多时多用敬体，敬体与简体混用在此类场合被允许。
    formation: 句尾形式（～です／～ます 与 简体）的选择
    constraints:
    - 对同一对象说话时文体不能混用
    - 正式场合、听话人众多时大多使用敬体
    contrasts: []
  - pattern: 参考にする vs 参考になる
    function_cn: 区分主动与自动用法：前者表示做某项决定或思考时作为判断依据的材料；后者表示某事物具有参考价值。
    formation: 参考にする（他动/主动）；参考になる（自动）
    constraints: []
    contrasts:
    - 参考にする＝作为依据（主动）
    - 参考になる＝具有参考价值（自动）
  - pattern: ～だろうと思う
    function_cn: 委婉陈述个人意见、避免直接断定的表达方式，含推测语气。
    formation: 由陈述自己想法的「～と思います」与表示推测的「～でしょう」组合而成；「～だろう」是「～でしょう」的简体形式
    constraints:
    - 常与副词「きっと（一定）」「たぶん（大概）」一起使用
    - 用「きっと」能弱化推测意义而增强肯定性
    - 用「たぶん」则能增强推测意义而弱化肯定性
    contrasts: []
  - pattern: ああ
    function_cn: 用于对对方的提问或邀请给予肯定回答或随声应答；也可用于想起自己知道的某事等；本课中表示看到或听到某事从而获得信息，进而回想起自己记忆中的事情。
    formation: 感叹/应答语
    constraints: []
    contrasts: []
  - pattern: 評判の
    function_cn: 表示传言或社会上的评价；受好评时用「評判がいい／評判が高い」；「評判の＋名词」指受到好评的事物（如「評判のCM」）。
    formation: 名词「評判」＋「の」＋名词
    constraints:
    - 用于表达他人或社会的评价、口碑
    contrasts: []
  - pattern: はい
    function_cn: 作为随声应答的用法，表示自己在认真听对方说话，并含有接下来会积极回应的语气；也可表示「はい、そうです」（是的）。
    formation: 独立应答语
    constraints:
    - 不能代替「ええ」
    contrasts:
    - 与要求回答「はい（是）／いいえ（不是）」的疑问句回答不同
  - pattern: ～なら～
    function_cn: 表示假定（如果……的话）；可省略为「～なら＋名词」的简略说法；也可用「～だったら～」；并列形式「AならB，CならD」。
    formation: 名词／动词连体形／名词＋「なら」
    constraints:
    - 常用于旅游商品广告等场景，如「おみやげなら○○」
    contrasts:
    - 与「～だったら～」可互换
  - pattern: 話題になる
    function_cn: 表示吸引世人关注、成为话题或谈资；本课中特指被电视、报纸等新闻媒体报导后在社会上形成舆论、为世人瞩目。
    formation: 名词/动词连体形 + 話題になる；可接「～と思う」「～になっている」等。
    constraints: []
    contrasts: []
  - pattern: なるほど
    function_cn: 对对方所说之事表示赞同而做出的应答叹词；用于此前自己没想到或不知道等场合。
    formation: 独立叹词，置于句首或句间，后接逗号。
    constraints:
    - 前置：中级第6课已学过。
    contrasts: []
  - pattern: 取り上げる
    function_cn: 本义为“拿起”“举起”；本课中表示通过电视新闻等报道有舆论价值的重大事件或活动。
    formation: 他动词，可接「～てもらう」「～られていた」等。
    constraints: []
    contrasts: []
  - pattern: かね／わね／よね
    function_cn: 与助词「か」「わ」「よ」重叠使用（～かね／～わね／～よね），用于确认与对方共同拥有的知识和感觉。
    formation: 小句（简体形式）+ かね；～ですかね／～ますかね 等。
    constraints:
    - 「小句（简体形式）+ かね」与简体疑问句意思差不多，但主要是年长的男性使用。
    - 「～ですかね」「～ますかね」等与「～ですか」「～ますか」意思相近，但是一种比较亲切的询问方式，通常会把「ね」的发音稍微拉长些。
    contrasts:
    - 「～ですかね／～ますかね」 vs 「～ですか／～ますか」：前者更亲切、语气拉长。
  - pattern: ～わね
    function_cn: 与～ね意思相同，主要用于年长女性；可表达自身感想，但不能以复述方式确认对方所说的话
    formation: 接于句末，用于确认或感叹
    constraints:
    - 语用限制：主要为年长女性使用
    - 可用于表达自己的感想
    - 不得用于复述对方话语以作确认
    contrasts:
    - 与～ね 同义但语用色彩不同（～わね 偏年长女性）
  - pattern: ～のうえで(の)
    function_cn: 表示范围、状况；名词+のうえで(の)，名词部分多用日常常用词（如交往、工作、生活等）
    formation: 名词 + のうえで(の)
    constraints:
    - 名词部分宜用日常高频词
    - 与『～のメール』『～上のメール』等表达在含义上需区分
    contrasts: []
  - pattern: ～さえ～ば
    function_cn: 用于表示条件的小句中，表示后项成立的最低条件
    formation: 动词/名词 + さえ + ば
    constraints:
    - 用于条件句
    - 强调最低条件
    contrasts: []
  - pattern: ～さえ／～すら／～まで
    function_cn: 表示举出极端事例的助词；『すら』主要用于书面语；『まで』『すら』用于实际存在的事物，『さえ』还可用于想象的事物；『まで』含在众要素中达到极端水平的语气，因此很少用于否定句
    formation: 名词/动词 + さえ／すら／まで
    constraints:
    - 『まで』很少用于否定句
    - 『すら』偏书面语
    contrasts:
    - 肯定句三者皆可
    - 否定句『まで』不适用
    - 最低条件义中『さえ』可表想象事物
  - pattern: ～などという
    function_cn: 举出具有代表性的两个以上事例，暗示还有其他多个事例；也可用于引用或相当于引用的处理方式，将特殊事件或问题提示出来。
    formation: 名词/动词等 + などという
    constraints:
    - 与仅列举两个以上事例的「～など」不同，「～などという」还用于引用式提示。
    contrasts:
    - ～など
  - pattern: ～といい
    function_cn: 表示提议、建议，含做不做都可以的语气；语气比「～たほうがいい」更弱。
    formation: 动词基本形 + といい
    constraints:
    - 会话中常后续助词「よ」。
    - 礼貌表达可用「～するほうがいいです（よ）」。
    - 「いい」可替换为表示积极评价的词语（如「面白い」「役に立つ」）。
    contrasts:
    - ～たほうがいい
  - pattern: 条目式文体（书面语特点）
    function_cn: 书面语中为多项注意事项编序号、加小标题并分条说明，使读者一目了然；小标题可用动词或名词结尾，标题应简洁。
    formation: 序号 + 小标题 + 分条说明
    constraints: []
    contrasts: []
  - pattern: ～たらいい／～ばいい
    function_cn: 表示建议、劝告
    formation: 动词た形＋たらいい；动词ば形＋ばいい
    constraints:
    - 基本用法与～といい相同
    contrasts:
    - 与初级第35课出现的动词た形＋たらいい同型
  - pattern: ～ごとに
    function_cn: 表示事物有规则地反复时的间隔；另含“～する時にはいつも”之意
    formation: 接动词基本形
    constraints:
    - 接动词基本形时大多可替换为～たびに
    contrasts:
    - 与～たびに在“每次”义上可互换
  - pattern: 類義語（近义词）分类
    function_cn: 讲解意思近似的词语（類義語）的两大类别：指示对象完全相同而语感不同；指示对象存在细微差别。
    formation: 按语感差异与对象差异两类划分近义词。
    constraints:
    - 第一类（语感不同）细分为：口语与书面语（和语词偏口语、汉语词偏书面语）、旧时说法与现代说法（外来词渐成常用，原有词显陈旧）、非正式说法与正式说法（含普通词语与敬语词语）。
    - 第二类（对象细微差别）意思相近、多可互换，但受场景或句内内容约束时不可互换，需注意搭配限制。
    contrasts:
    - 口语 vs 书面语
    - 旧时说法 vs 现代说法
    - 非正式说法 vs 正式说法
    - 意思相近但搭配对象不同的近义词（如清洁/美丽、发放/散发）
  pragmatics:
  - 「〜たっけ」「〜だっけ」属较随便的口语语域
  - 「〜ね」用于估计对方会认同的确认
  - 根据双方对信息的掌握程度选择～ね、～でしょう、～じゃないですか等不同语气
  - 反问时通过语调与敬体/常体形式传达确认或意外
  - 敬体给人说话很正式的印象，即使对下属说话有的人也经常使用敬体
  - 「～だろうと思う」通过组合构成委婉陈述、避免直接断定的语用效果
  - 「はい」的应答语气含有积极回应的语用色彩
  - 「～ですかね」等比「～ですか」更亲切，「ね」发音稍拉长
  - 「小句+かね」多由年长男性使用
  - ～わね 的性别与年龄语用限制
  - 邮件件名应能单独反映内容，避免使用「こんにちは」「はじめまして」等无法体现用件的表达
  - 署名需包含公司名与部门名（如「～株式会社～部」），收件人姓名已知时在文首使用「○○様」
  - 邮件主题避免使用「こんにちは」「はじめまして」等不明内容的寒暄语
  - 「はいはい」「そうそう」等随声应答依场合可能失礼
  - 语体（口语/书面语、正式/非正式、敬语）选择影响语感
  - 近义词受使用场景与句内搭配约束，不可无条件互换
