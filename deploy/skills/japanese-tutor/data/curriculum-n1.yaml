  - 用句中“ね”的停顿引起听人注意、确认对方在听。
  - 用敬称“お宅”对对方/其公司表示轻微敬意。
  - 用“どういったこと”温和地要求对方说明情况。
  - 请求对方在限定范围内/按某种状态完成动作
