  - 用自谦语表达对他人的敬意（如替对方拿行李、回信、联系等场景的谦让表达）
  - 请求对方为自己做某事（礼貌/更礼貌）
  - 请求对方允许自己做某事（自谦）
  - 礼貌地表示存在或判断
