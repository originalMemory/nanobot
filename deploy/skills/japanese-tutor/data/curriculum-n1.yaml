  similar_contrasts:
  - ～ので
  - ～から
  - 与单纯意志形相比语气更礼貌温和。
  - 与单纯意志形（当场形成的意志）不同，后者不能接～ようと思います／～ようと思っています
  - 与～ようと思います相比，～ようと思っています因使用～ています形式，带有决心或意志尚未最后形成的语感
  - ～ので 与 ～から 相比语感更郑重；～から 陈述理由的感觉更强烈
  - それでは（较郑重）
  - 「な」与「なあ」感叹强度不同
