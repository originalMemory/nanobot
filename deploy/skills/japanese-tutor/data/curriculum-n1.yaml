  jlpt_estimate:
    status: unverified
  communication_functions:
  - 约定/请求对方配合（よろしくお願いします）
  - 提出日程安排与计划（予定を立てました）
  - 邀请/提议（～てみませんか）
  - 电话预订旅馆（予約をお願いしたい）
  - 电话预订旅馆/宾馆的意图表达
  - 预订内容（日期·人数·晚数）的确认与复述
  - 接受预订方的店名表明、致谢与日程确认
  - 向顾客说明费用时明确告知是单人单价还是全体总额，并用礼貌表达征询同意
  - 在询问姓名、联络方式前需先结束费用确认对话
  - 挂断电话前补充客套话（恭候光临）
  - 不能满足对方要求时用致歉表达并说明情况
  - 安排采访/参观行程
  - 对对方关照或表扬作谦逊回应
  - 表达关注、感兴趣
  - 礼貌请求与邀请
  - 自谦地表示能为对方提供帮助
  - 委婉表达断定/报价
  - 接受或拒绝邀请、劝告
  - 对说明/请求的郑重确认（かしこまりました）
  - 礼貌地提出后续请求（留下姓名与电话号码、稍候）
  grammar:
  - pattern: 電話予約の意図表明（敬体）
    function_cn: 电话预订时先明确告知对方是预订，使用敬体表达意图
    formation: 「予約をお願いした…」「予約をいたします」等敬体句式
    constraints:
    - 对不熟识对象（旅馆、酒店、航空公司等）须用正式/敬体说法
    - 避免「予約を頼む」「空いてる？」等随便说法
    contrasts:
    - 敬体正式表达 vs 随意的简体/省略说法
  - pattern: 予約内容の確認・復唱
    function_cn: 确认并复述日期、人数、住宿晚数等预订要求，确保无误
    formation: 「○月○日から○名で○泊」式的时间·人数·晚数组合
    constraints:
    - 接受方在对方陈述完要求后需复述确认
    contrasts: []
  - pattern: 予約受付けの応答（店名表明＋感謝＋日程確認）
    function_cn: 接受预订方先以敬语报出企业/店铺名称，再致谢并询问预订日期
    formation: 「～でございます」「ありがとうございます」「ご予定はいつになりますか」等
    constraints:
    - 报店名用「～でございます」敬体
    - 确认日程后用「少々お待ちください」等请对方稍候
    contrasts: []
  - pattern: ～よう
    function_cn: 表示目的
    formation: 动词（基本形／ない形）＋よう
    constraints:
    - 比“～ように”更正式，报纸、论文等书面语中一般用“～よう”而不用“～ように”
    - 工作等比较正式场合的谈话使用“～よう”，比较随便的交谈多用“～ように”
    - “～ようにする”不能改换成“～ようする”
    contrasts:
    - 与“～ように”（初级第38课）同样表示目的，但正式度不同
  - pattern: 予定を立てる／組む／入れる
    function_cn: 表示制定计划、安排日程；‘立てる’与‘組む’用于制定新计划，‘入れる’用于在特定时间段或日程中加入新安排
    formation: 予定を＋立てる／組む／入れる
    constraints: []
    contrasts:
    - 立てる／組む＝制定新计划
    - 入れる＝在既有日程中加入
  - pattern: とんでもありません
    function_cn: 强烈否定对方意见；在得到对方关照或表扬时以强烈否定方式表现客气、谦逊态度
    formation: 形容词‘とんでもない’的否定形式‘ありません’
    constraints:
    - 礼貌说法为‘とんでもございません’
    contrasts:
    - とんでもない（含出乎意料、不合理等消极语气的否定词）
  - pattern: 関心がある／関心のある
    function_cn: 指被某事吸引、关注某事；多用于对具有深刻内涵的事情或严重事态在理性上引起注意
    formation: 関心がある／関心を持つ／関心のある
    constraints:
    - 否定形式为‘関心がない’
    contrasts:
    - 興味がある（看起来有意思、令人愉快而在情绪上被吸引）
  - pattern: ～くらい／ぐらい
    function_cn: 接名词后，表概数、强调程度、最低限度；强调最低限度时加助词“は”构成“～ぐらいは”；与“に”等助词连用时“くらい”居后（～にくらい）
    formation: 名词＋くらい／ぐらい
    constraints:
    - 表最低限度时“～くらい”与“～ぐらい”皆可，一般用“～くらい”
    - 强调“～ぐらい”时添加助词“は”变为“～ぐらいは”
    contrasts:
    - 概数／强调程度／最低限度三种用法需依语境区分
  - pattern: ～様
    function_cn: 接人名表敬意；接人数数字后表敬意；接公司名或团体名表敬意
    formation: 人名／人数数字／公司名・团体名＋様
    constraints:
    - 人数“1人”“2人”前可加“お”（お1人様、お2人様），3人以上用“～名様”
    contrasts: []
  - pattern: ご＋汉字名词／お＋动词ます形去ます
    function_cn: 表尊敬：动词ます形去“ます”加“お”（如お泊まり、お急ぎ）；汉字名词前加“ご”（如ご1泊、ご予定、ご旅行、ご趣味）
    formation: 动词ます形去ます＋お／汉字名词＋ご
    constraints: []
    contrasts: []
  - pattern: ～ませ
    function_cn: 礼貌请求/邀请；～ます的命令形，用于问候语或惯用语，亦可用于书信
    formation: 动词ます形去ます＋ませ
    constraints:
    - 多用于固定问候语与惯用表达
    contrasts: []
  - pattern: ご～できる
    function_cn: 自谦表达，表示自己能为对方做某事（用意、協力、説明、お届け、お売り等）
    formation: 自谦语ご～する中的“する”变为可能形“できる”；接三类动词汉字部分，或其他动词ます形去ます
    constraints:
    - 用于自己对他人的动作，不用于对方的动作
    contrasts: []
  - pattern: ～になります
    function_cn: 原表变化或变化结果，现多代替～だ/～です表断定，语气含蓄委婉，零售、餐饮接待顾客时频繁使用
    formation: 名词/数量＋になります
    constraints:
    - 用于避免直接断定显得不礼貌的场合
    contrasts:
    - 与～です/～だ的断定用法对比
  - pattern: 結構です
    function_cn: 两种含义：肯定（好的/没关系）或拒绝邀请、劝告（不需要/不想做）
    formation: 固定表达
    constraints:
    - 因易混淆，日本人之间也常加はい/いいえ或もう結構です以明确意图
    contrasts:
    - 肯定义与拒绝义需靠上下文或附加词区分
  - pattern: かしこまりました
    function_cn: 对对方说明或请求的郑重应答，表示理解并接受对方所说的话；礼貌程度高于「分かりました」，与「承知しました」同级。
    formation: 动词/表达后独立使用，常接「それでは…」「少々お待ちくださいませ」等后续请求。
    constraints:
    - 用于应答对方已说明的内容，非主动陈述。
    contrasts:
    - 与「分かりました」相比更郑重；与「承知しました」礼貌度相当。
  - pattern: 副词表达（关联词语）
    function_cn: 一组用于修饰或连接句子的副词，涵盖频率/程度/转折/意外/时间等语义，如「一般に」「おそらく」「かってに」「偶然」「自然に」「いつのまにか」「ひとりでに」「たちまち」「ついに」「とっくに」「そっと」「それなのに」「わりに」「わざわざ」「あいにく」「いちいち」「ふと」「ひとまず」「めっきり」「ついでに」「よほど」「少なくとも」。
    formation: 多置于句首或动词前作状语。
    constraints: []
    contrasts: []
  - pattern: 延べ
    function_cn: 用于按“人次”计算（同一人多次利用计为多次），区别于按人数计算。
    formation: 接于数量/人数表达前，如「延べ＋数量」。
    constraints: []
    contrasts: []
  - pattern: のんびりする / リラックスする
    function_cn: 均表身心舒畅、轻松愉快；「のんびりする」用于较长时间处于轻松舒适状态，「リラックスする」用于从紧张状态中解脱出来。
    formation: 动词原形。
    constraints:
    - 「のんびりする」不用于仅指当时短暂状态（如劝人放松的场合）。
    contrasts:
    - 「リラックスする」可表从紧张中解脱，「のんびりする」强调长时间悠闲。
  - pattern: ～の多く / 多くの～
    function_cn: 一类形容词「多い」不能直接修饰名词，需变为「多く」；「～の多く」意为“～的大部分”，「多くの～」意为“大量的、许多的”。
    formation: 名词＋の＋多く；多くの＋名词。
    constraints:
    - 「多い」不可直接修饰名词。
    contrasts:
    - 「～の多く」侧重“大部分”，「多くの～」侧重“许多/大量”。
  - pattern: たっぷりの＋名词
    function_cn: 副词「たっぷり」后续助词「の」修饰名词，表“充足的、满满的”。
    formation: 副词＋の＋名词。
    constraints:
    - 并非所有副词都可这样使用。
    contrasts:
    - 类似用法还有「ぴったり」「つるつる」「だいたい」「ほとんど」等部分拟声词/副词。
  - pattern: ～による／～によって
    function_cn: 表示方法、手段、原因、情况差异、动作主体
    formation: 名词＋による／によって
    constraints:
    - 表示被动句的动作主体时，不能用助词“で”替换
    - 表示情况差异、方法手段、原因时，多可与助词“で”互换
    contrasts:
    - 与助词“で”在被动动作主体用法上不可互换
  - pattern: その数（指示词）
    function_cn: 指代前文已出现的具体名词（指示上下文内容）
    formation: 指示代词，替代前句名词
    constraints:
    - 指代句中名词时一般不用“あれ”“あの”
    contrasts:
    - 与“あれ”“あの”在指代句中名词时的使用限制不同
  - pattern: これ／この～ vs その vs それ／その
    function_cn: 指示代词的选择：提起对方不知道的话题用「これ／この～」；陈述与前文相反或对比的内容用「その」；「その」还可模糊指代，常指代后文即将出现的内容（如「その範囲」「その名前」「その数」）。
    formation: 指示词 + 名词（この～）；その + 名词（模糊限定）
    constraints:
    - 根据指代内容有时只能使用其中之一
    - 「その」模糊指代时通常指代后面即将出现的内容
    contrasts:
    - 「この」用于对方未知的新话题
    - 「その」用于对比或模糊指代后文
  - pattern: ちょっとした + 名词
    function_cn: 表示“一点点、稍微”，强调尽管数量少或事物小，却是不容忽视的要素；也可表示“相当的、出色的、难得的”。
    formation: ちょっとした + 名词
    constraints:
    - 通常以「ちょっとした + 名词」的形式使用
    contrasts:
    - 区别于表示“少的、轻微的”的用法，此处偏向“难得的、珍贵的”语感
  - pattern: エステ
    function_cn: 法语外来词「エステティック（全身美容）」的缩略形式，指以美容为目的的美容服务及设备，区别于以改善健康为目的的「マッサージ」。
    formation: 外来语缩略
    constraints:
    - 价格较高，非稀松平常的消费
    contrasts:
    - 「エステ」以美容为目的 vs 「マッサージ」以改善健康为目的
  - pattern: ～のだ
    function_cn: 表示理由或说明；含说明背景或叙述已定事实之意；亦用于文章或演讲中将到此为止的叙述换一种说法总结、陈述
    formation: “～のです”“～んです”的简体
    constraints: []
    contrasts:
    - 与“～のだろう”相比为直接断定，后者为委婉推测
  - pattern: ～のだろう
    function_cn: 表示理由时的推测形式；书面语中不用“～のだ”直接断定，而用此委婉推测表达
    formation: “～のだ”的推测形式
    constraints:
    - 尤用于书面语
    contrasts:
    - 与“～のだ”相比语气更委婉、带推测
  pragmatics:
  - 寒暄与致谢（こちらこそ、ありがとうございます）
  - 电话用语（お電話ありがとうございます、少々お待ちください）
  - 对不熟识对象使用正式敬体，避免随便说法
  - 客人一方一般也使用敬体
  - “お／ご～申し上げる”为自谦语表达方式
  - 致歉表达用于表示不能接受对方要求
  - ‘とんでもありません’用于客套、谦逊的否定回应
  - ‘とんでもございません’为更礼貌说法
  - “～様”“ご～”“お～”为敬语/尊敬表达，多用于接待客人的服务行业等场合
  - ～ませ用于问候语/惯用语体现礼貌
  - ご～できる限于自己对他人的动作
  - ～になります用于服务行业接待以显委婉
  - 結構です需加はい/いいえ或もう…です消除歧义
  - 「かしこまりました」用于服务/商务等需高礼貌度的应答场景。
