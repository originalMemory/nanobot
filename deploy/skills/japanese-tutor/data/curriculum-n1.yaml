  grammar:
  - pattern: 动词连体形＋名词（连体修饰）
    function_cn: 用动词短语作定语修饰后面的名词，表示该名词的用途、所属或特征
    formation: 动词连体形（ます形去ます／た形／ない形等）直接接名词
    constraints:
    - 修饰语与被修饰名词之间语义需相关（用途、动作对象、属性等）
    contrasts: []
  - pattern: 名词＋で＋使う
    function_cn: 表示某物在特定场合/用途中被使用
    formation: 场合名词＋で＋使う
    constraints: []
    contrasts: []
  - pattern: 名词＋が＋欲しい
    function_cn: 表示希望拥有某物
    formation: 对象名词＋が＋欲しい
    constraints: []
    contrasts: []
  - pattern: 名词＋を＋人＋に＋貸す
    function_cn: 表示把某物借给某人（借出）
    formation: 借出物＋を＋接受者＋に＋貸す
    constraints: []
    contrasts:
    - 与「借りる」（借入）方向相反，注意区分
  - pattern: 动（简体形）+ 名 / 小句（动词简体形）+ 名
    function_cn: 动词或动词小句修饰名词时，用动词简体形；表示习惯或将要发生的动作用基本形，表示动作已完成时用た形。
    formation: 动词简体形（基本形或た形）直接接名词作定语
    constraints:
    - 名词前不用敬体形
    - 名词前不能加「の」
    contrasts:
    - 基本形表习惯/将来动作
    - た形表已完成动作
  - pattern: 小句（动词简体形）+ 名 は 名／形 です
    function_cn: 动词小句修饰名词形成的名词短语常用作主语。
    formation: 动词小句+名词 作主语，后接 は 与 名/形+です
    constraints:
    - 日语名词前常带较长定语，可把多个短句概括为一个含长定语的句子
    contrasts:
    - 与汉语相比，日语定语位置在名词前且可较长
  - pattern: 动词小句（动词简体形）+ 名词 + を/に/から + 动词ます
    function_cn: 动词小句修饰名词形成的名词短语，除作主语外还可充当宾语、间接宾语等句子成分
    formation: 动词简体形直接修饰其后名词；该名词短语再带助词进入主句
    constraints:
    - 修饰名词的动词小句内部主语须用「が」标记，不能用「は」
    contrasts: []
  - pattern: 小句（一类形容词/二类形容词/名词）+ 名词
    function_cn: 形容词或名词小句修饰名词构成名词短语
    formation: 「名词+が+一类形容词+です」修饰名词时一类形容词取基本形；「名词+が+二类形容词+です」变为「二类形容词+な」；「名词1+が+名词2+です」变为「名词2+の」
    constraints:
    - 形容词修饰名词时不能加「の」（与汉语“的”不同）
    contrasts:
    - 与汉语定语加“的”的用法不同，日语形容词直接连用名词
  - pattern: ～のところ
    function_cn: 将本来不表示场所的名词转换为表示场所的词语
    formation: 名词 + のところ
    constraints:
    - 用于把非场所名词变为场所表达
    contrasts: []
  - pattern: これ／あれ（指人）
    function_cn: 指示代词用于指人，礼貌程度较低
    formation: 指示代词直接指人
    constraints:
    - 直接指人时限于介绍自己的家人或部下
    - 本人不在场或在远处听不到谈话时不受此限
    contrasts: []
  - pattern: ～でしたね
    function_cn: 表示确认（双方已知信息的核对）
    formation: 动词/形容词/名词的过去式 + でしたね
    constraints:
    - 可与副词たしか呼应使用
    - 对从前知道但记得不确切的事情进行确认时一般用～でしたね
    contrasts:
    - 助词ね单独也可表示确认，但确认记忆不确切事项时倾向用～でしたね
  - pattern: 大きな／小さな
    function_cn: 一类形容词，与大きい／小さい同义
    formation: 形容词 + な
    constraints:
    - 只能用于修饰名词
    - 不能用来结句
    contrasts:
    - 其他一类形容词没有这种限制
  - pattern: この／その／あの／どの ＋ あたり
    function_cn: 表示某一场所的周边、一带
    formation: 接在指示词（この/その/あの/どの）后面
    constraints:
    - 除接在指示词后外，还可接在表示具体场所的名词后面（名词＋の＋あたり）
    contrasts: []
