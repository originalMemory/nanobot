  grammar:
  - pattern: ～でしょう
    function_cn: 说话人基于常识或情境作出的推测、判断
    formation: 动词辞书形／形容词词干／名词＋（な）＋でしょう
    constraints: []
    contrasts: []
  - pattern: ～かもしれません
    function_cn: 表示可能性推测（也许……）
    formation: 动词辞书形／动词ない形／形容词词干／名词＋（な）＋かもしれません
    constraints: []
    contrasts: []
  - pattern: もしかしたら
    function_cn: 副词性表达，表示“也许、说不定”，引出推测
    formation: 独立使用，后接推测句
    constraints:
    - 多用于可能性较低的推测场合
    - 常与「～かもしれません」「～ではありませんか」搭配
    contrasts: []
  - pattern: 小句(动词简体形)+の+は+形容动词/二类形容词+です
    function_cn: 动词小句加「の」名词化表示“做某动作”，该名词化形式作主语、谓语为表示性质状态的形容动词或二类形容词时，主语用助词「は」。
    formation: 动词简体形小句 + の + は + 形（形容动词/二类形容词）+ です
    constraints:
    - 当名词化形式是「好きです」「嫌いです」「上手です」「下手です」等表示好恶、擅长不擅长的形容词的对象时，改用助词「が」。
    - 「好きです」等表示好恶的形容词的对象作为话题使用时，用助词「は」。
    contrasts:
    - 主语性质状态描述用「は」
    - 好恶/擅长对象用「が」
    - 好恶对象作话题用「は」
  - pattern: 小句(动词简体形)+の+を+动词
    function_cn: 动词小句加「の」的名词化形式作宾语。
    formation: 动词简体形小句 + の + を + 动词
    constraints:
    - 名词化形式作宾语时「の」与「こと」一般可互换。
    - 句尾动词为「知らせます（告诉）」「伝えます（转告）」「話します（说）」等表示语言行为的动词时，用「こと」不能用「の」。
    - 句尾动词为「見ます（看）」「聞きます（听）」等表示感知的动词，或「手伝います（帮忙）」「やめます（停止）」「防ぎます（防御）」等直接作用于动作对象的动词时，用「の」不能用「こと」。
    contrasts:
    - 语言行为动词接「こと」
    - 感知/直接作用动词接「の」
  - pattern: 小句(简体形)＋でしょう
    function_cn: 表示说话人对自己和听话人都不能断定的事情进行推测，常与“たぶん”呼应使用。
    formation: 动词小句和一类形容词小句用简体形后续“でしょう”；二类形容词小句和名词小句把简体形的“だ”换成“でしょう”。
    constraints:
    - 简体形为“～だろう”。
    contrasts: []
  - pattern: 小句(简体形)＋かもしれません
    function_cn: 表示有可能发生某事，其可能性一般为百分之五十左右。
    formation: 动词小句和一类形容词小句用简体形后续“かもしれません”；二类形容词小句和名词小句把简体形的“だ”换成“かもしれません”。
    constraints:
    - 与“～でしょう”相比，“～かもしれません”表示的概率较低。
    - 因概率约为百分之五十，可在同一动作的肯定形和否定形后面并列使用两个“かもしれません”。
    contrasts:
    - 与“～でしょう”相比概率较低。
  - pattern: それで
    function_cn: 表示前面句子所述事态为后面句子事态的原因、理由；在应用课文中可引对方叙述的事情为理由，说话人用其引出导致的结果。
    formation: 接续于句末，独立使用。
    constraints:
    - 语气较「だから」弱
    - 后面不能接表示祈使或推测的句子
    contrasts:
    - 「だから」语气较强，后面可接祈使或推测句，而「それで」不行
  - pattern: つい
    function_cn: 表示并非有意所为却形成了某种后果，含有对意想不到的后果感到不快、后悔的语感。
    formation: 副词，修饰动词。
    constraints:
    - 强调非本意、不知不觉地做出某事
    contrasts: []
  - pattern: あいさつ回り
    function_cn: 指到新单位或迁入新居后拜访有关单位或周围邻居的寒暄行为；名词形式可接「をします」「に行きます」
    formation: 名词形式，常与「する」「行く」搭配
    constraints: []
    contrasts: []
  - pattern: 寒暄时的动作（鞠躬）
    function_cn: 说明日本人初次见面或熟人见面时一边说「はじめまして」「こんにちは」一边鞠躬，较少握手拥抱等身体接触
    formation: 语用/动作说明
    constraints:
    - 与中国人、欧美人握手习惯对比
    contrasts: []
  - pattern: 公司常用寒暄语（道歉/感谢/告别/问候/请多关照等）
    function_cn: 列举职场寒暄功能类别：道歉、感谢、打扰、告辞、辛苦了、请多关照、承蒙关照、好久不见、久疏问候、请保重、托您的福
    formation: 寒暄语功能分类
    constraints: []
    contrasts: []
  pragmatics:
  - 日本人与中国人、欧美人在寒暄动作（鞠躬 vs 握手）上的文化差异
  - 森对中国寒暄方式不太适应的语用背景
  - 日本以鞠躬（お辞儀）为主，握手非普遍习惯
  - 中国以握手为普通寒暄方式
  - 面向对方提醒下次握手不要忘记
