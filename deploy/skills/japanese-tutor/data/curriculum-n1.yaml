  - 时间副词
  - 动词（寄、借、教、打、胖、做等）
  - 车站相关：切符売り場、電車、急行、東京、円
  - 交通/铁路：新干线、名古屋、京都、吸烟席、禁烟席、终电、下一站
  - 食べ物（主食・料理・デザート・飲料）
  - 日本料理（盖饭、套餐、酱汤、米饭、炒面、煎饼、火锅、刺身、寿司、天麸罗、炸猪排、汤面、荞麦面、鳗鱼饭、拉面等）
  - 饮品（咖啡、牛奶、绿茶、日本酒、啤酒、威士忌、葡萄酒）
  - 烹饪方法（烧烤、煮炖熬煨焖、炒、炸、蒸、煮烫焯）
  - 中餐菜名（饺子、肉包子、炒饭、烧麦、八宝菜、青椒肉丝）
  - 交通与公共设施标识（最高速度、一時停止、横断禁止、駐車場、禁煙、非常口）
  similar_contrasts:
  - 与「送る」区别：送る强调寄送动作，あげる强调当面给予
  - 与「に」标记对象区分
  - 与「あげる／もらう」的「に」功能相同但动词不同
  - 与表示交通工具的「で」区分：此处强调手段与材料。
  - 与「もらいます」方向相反：「あげます」为向外给予。
  - 与「あげます」方向相反：「もらいます」为向内接受。
  - 与「あげる・くれる」的给予方向相反
  - 「に」与「から」在给予方为个人时均可，组织团体倾向「から」
  - 「あげます」直陈 vs 「どうぞ／どうですか」更得体
  - 「たった今（刚刚）」比「さっき（刚才）」时间更近
  - 接收用「もらう」，发出用「かける／送る／出す」
  - 「～の件」较郑重 vs 普通名词直接表述
  - 与汉语“明白了”相比，日语还可用于承诺/应答
  - 汉语一般说“……和……都……”，不逐项加“也”
  - 与第4课表示位置的「前」用法区分
