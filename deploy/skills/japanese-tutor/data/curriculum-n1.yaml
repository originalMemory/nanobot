  communication_functions:
  - 询问并回答购买过的土产/物品
  - 询问并评价某地（城市）的印象与状态
  - 询问并描述某城市的性质特征
  - 询问并描述过去某地的天气
  - 询问对方意见或感想
  - 劝诱对方做某动作
  - 表示吃惊/意外
  - 转换话题
  - 描述自然现象
  - 表示范围与期间
  - 询问商品规格并请求更换（如电脑尺寸）
  - 询问对方经历与感受（どうでしたか）
  - 描述过去状态与评价（～でした／～ませんでした）
  - 说明原因与现状（～ので／～です）
  - 确认与附和（そうですね／そうですか）
  - 询问场所内事物（～には どんな～がありますか）
  grammar:
  - pattern: 名词／な形容词＋です
    function_cn: 对事物性质、状态作判断（肯定）
    formation: 名词或な形容词词干直接接「です」
    constraints:
    - な形容词作谓语时去「な」接「です」
    - 名词前不加「な」
    contrasts:
    - 与「ではありません」构成肯定/否定对
    - 过去形为「でした」
  - pattern: 名词／な形容词＋ではありません
    function_cn: 否定判断
    formation: 名词或な形容词词干＋「ではありません」
    constraints:
    - 用于否定「です」判断
    contrasts:
    - 肯定形「です」／过去否定「ではありませんでした」
  - pattern: 名词／な形容词＋でした
    function_cn: 过去时判断
    formation: 名词或な形容词词干＋「でした」
    constraints:
    - 表示过去状态
    contrasts:
    - 现在形「です」
  - pattern: どんな＋名词
    function_cn: 询问事物的性质、种类或特征
    formation: 「どんな」直接修饰名词
    constraints:
    - 后接名词，不接动词
    contrasts:
    - 与「どう」（询问状态/评价）区分
  - pattern: どう＋ですか／どうでしたか
    function_cn: 询问整体状态或评价
    formation: 「どう」＋「ですか／でしたか」
    constraints:
    - 用于询问感受、状况
    contrasts:
    - 与「どんな＋名词」区分
  - pattern: 动词ます形过去（～ました／～ましたか）
    function_cn: 表示已完成的动作或询问过去动作
    formation: 动词ます形去「ます」加「ました」
    constraints:
    - 用于过去叙述与疑问
    contrasts:
    - 现在/将来「ます」
  - pattern: そして／でも
    function_cn: 连接分句：「そして」表并列递进，「でも」表转折
    formation: 句末或句间连接词
    constraints:
    - 语用层面连接语义
    contrasts:
    - 「そして」并列 vs「でも」转折
  - pattern: 名は 二类形容词 です／でした
    function_cn: 二类形容词（な形容词）做谓语的肯定形式，后接です；过去式接でした。
    formation: 二类形容词 + です／でした
    constraints:
    - 二类形容词指不以い结尾的形容词
    - 做谓语时须加です
    contrasts: []
  - pattern: 名は 二类形容词 では ありません／では ありませんでした
    function_cn: 二类形容词做谓语的否定形式；过去否定接では ありませんでした。
    formation: 二类形容词 + では ありません／では ありませんでした
    constraints:
    - 口语中では一般说成じゃ
    contrasts:
    - 书面では vs 口语じゃ
  - pattern: 名は 二类形容词 な 名 です
    function_cn: 二类形容词修饰名词时的接续形式。
    formation: 二类形容词 + な + 名词
    constraints:
    - 修饰名词时须加な
    contrasts: []
  - pattern: 名 でした
    function_cn: 名词做谓语的过去形式；否定为名词 + では（じゃ）ありませんでした。
    formation: 名词 + でした／では（じゃ）ありませんでした
    constraints:
    - 口语中では说成じゃ
    contrasts:
    - 书面では vs 口语じゃ
  - pattern: どんな 名
    function_cn: 询问人或事物的性质，相当于汉语“什么样的”。
    formation: どんな + 名词
    constraints:
    - 用于询问性质/特征
    contrasts: []
  - pattern: 何の / どんな
    function_cn: 区分两类疑问词：「何の」用于询问内容或材料；「どんな」用于询问性质或种类。
    formation: 何の + 名词；どんな + 名词
    constraints:
    - 「何の」兼有询问内容与询问材料两种用法
    - 「どんな」只用于询问性质
    contrasts:
    - 「何の」与「どんな」不可互换，前者偏内容/材料，后者偏性质
  - pattern: どうですか / どうでしたか
    function_cn: 询问对方对某状态的意见或感想；也可用于劝诱对方进行某动作。
    formation: 名词/状态 + は + どうですか（现在/未来）；どうでしたか（过去）
    constraints:
    - 询问现在或未来事情用「どうですか」
    - 询问过去事情用「どうでしたか」
    - 可兼作劝诱表达
    contrasts:
    - 时态选择决定用「どうですか」还是「どうでしたか」
  - pattern: でも / そして
    function_cn: 区分两类连词：「でも」表示转折关系；「そして」表示并列关系。
    formation: 句末 + でも / そして + 下一句
    constraints:
    - 「でも」一般只用于口语，不用于正式书面语
    contrasts:
    - 「でも」表转折，「そして」表并列，二者功能不同
  - pattern: きれいです（二类形容词）
    function_cn: 区分一类形容词与二类形容词：一类形容词词尾「い」需用假名书写，二类形容词「きれい」的「い」是汉字读音的一部分，修饰名词时用「きれいな」而非「きれい」
    formation: 二类形容词 + です / 二类形容词 + な + 名词
    constraints:
    - 不可将二类形容词「きれい」误作一类形容词直接接名词
    contrasts:
    - 一类形容词（热い/高い/安い）词尾「い」用假名
    - 二类形容词「きれい」的「い」为汉字读音一部分
  - pattern: 雨です／雪です（名词句表自然现象）
    function_cn: 表示下雨、下雪等自然现象时，日语常用名词句形式而非动词句
    formation: 自然现象名词 + です
    constraints:
    - 用于天气等自然现象描述
    contrasts: []
  - pattern: あれえ（叹词）
    function_cn: 表示吃惊或意外时情不自禁发出的声音，由「あれ」音变而来，读升调
    formation: 独立叹词，句首使用
    constraints:
    - 用于对出乎意料之事表示惊讶
    contrasts: []
  - pattern: ところで
    function_cn: 转换话题时使用，常附在对方话语之后引出新话题
    formation: 独立接续词，置于新话题句首
    constraints:
    - 用于话题转换
    contrasts: []
  - pattern: '[场所]+中／[时间/期间]+中'
    function_cn: 「场所+中」表示该场所范围内的全部；「时间/期间+中」用「一～中」形式表示在某期间一直
    formation: 场所名词+中；时间/期间名词+中（如一日中、一晩中、一年中）
    constraints:
    - 场所+中表范围全部
    - 时间+中表期间持续
    contrasts:
    - 场所范围 vs 时间期间两种用法
  - pattern: 形容词+の
    function_cn: 用助词「の」代替已提及的名词，避免重复，使句子更简洁
    formation: 一类形容词 + の（代替后文名词）
    constraints:
    - 前文已交代名词时可用「の」代指
    contrasts: []
  - pattern: 二类形容词（な形容词）+ な + の
    function_cn: 将二类形容词名词化，作定语修饰名词
    formation: 二类形容词词干 + な + の
    constraints:
    - 仅适用于二类（な）形容词，一类形容词直接加「の」
    contrasts:
    - 与一类形容词+の 的接续区别
  pragmatics:
  - 「でも」口语色彩，正式书面语中避免使用
  - 叹词「あれえ」的升调发音与语用场景
  - 使用礼貌体（です・ます）进行采访式对话
  - 用「えっ？」「あれえ」表达惊讶与确认
