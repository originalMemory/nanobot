  communication_functions: []
  grammar:
  - pattern: ～てからというもの
    function_cn: 表示完成某个行为、发生某种变化后一直持续的某种状态
    formation: 动词て形＋からというもの
    constraints: []
    contrasts: []
  - pattern: ～前に
    function_cn: 表示在某动作发生前进行了其他动作，前后动作存在时间先后顺序，用于做某动作之前先考虑好后面做什么的情形
    formation: 动词基本形＋前に／名词＋の前に
    constraints: []
    contrasts: []
  - pattern: ～てから
    function_cn: 表示两个以上动作相继进行，用于表达顺序关系
    formation: 动词て形＋から
    constraints: []
    contrasts: []
  - pattern: ～後で
    function_cn: 表示在前面的动作之后发生了后面的动作
    formation: 动词て形＋後で／名词＋の後で
    constraints: []
    contrasts: []
  - pattern: ～て
    function_cn: 表示动作顺序，也可表示因果关系；与仅表顺序的「～てから」「～後で」区分
    formation: 动词て形＋后续句
    constraints:
    - 可表因果，而「～てから」「～後で」只表顺序
    contrasts:
    - ～てから
    - ～後で
  - pattern: ～以来／～以降／～以後
    function_cn: 表示从某时间点开始持续到现在；「～以降」「～以後」可表过去或将来
    formation: 动词て形＋以来／名词＋以来；～以降／～以後
    constraints:
    - 「～以来」不能用于将来事物
    - 「～以降」重点在含某时间点之后的过程
    - 「～以後」更强调时间本身
    contrasts:
    - ～以降
    - ～以後
  - pattern: ～うえで
    function_cn: 表示把前面动作完成后再进行后面动作，强调按顺序行事；「动词基本形＋うえで」表示“在做某事的时候”，用于说明注意事项
    formation: 动词て形＋うえで／名词＋のうえで／动词基本形＋うえで
    constraints:
    - 用于表示意志的动词或名词
    - 基本形＋うえで 用于说明做某事时需注意的事项
    contrasts: []
  - pattern: ～に先立って
    function_cn: 表示后面的动作在之前的动作之前进行，多用于仪式等被赋予社会意义的活动，非日常动作
    formation: 名词＋に先立って
    constraints:
    - 一般用于仪式性、社会意义活动
    contrasts: []
  - pattern: ながら
    function_cn: 与「まるで」一样表示比喻，意为“正如……”（本页仅见开头，讲解未完）
    formation: （接续未在本页完整呈现）
    constraints: []
    contrasts:
    - まるで
  - pattern: ～といったところだ
    function_cn: 表示“可以表达为……”，用于某种比喻或改换一种更通俗的说法
    formation: “～”处一般为名词；多与“ながら”及“まるで”等副词搭配使用
    constraints: []
    contrasts: []
  - pattern: どうやら
    function_cn: 表示“不太确定但总觉得……”，即虽不确定但从某种状况来看可如此判断
    formation: 多用“どうやら～らしい”“どうやら～ようだ”的形式
    constraints: []
    contrasts: []
  - pattern: こうだ／これだ
    function_cn: “コ”系列指示表达，表示将要叙述的内容
    formation: “これだ”指名词，“こうだ”指事情；表示多件事情时用“こうだ”
    constraints: []
    contrasts: []
  - pattern: ～がたい
    function_cn: 难以施行某种动作
    formation: 动词ます形去掉「ます」＋がたい
    constraints: []
    contrasts: []
  - pattern: ～かねる
    function_cn: 不能
    formation: 动词ます形去掉「ます」＋かねる
    constraints: []
    contrasts: []
  - pattern: ～（よ）うにも～ない
    function_cn: 即使想做也做不到
    formation: 动词意志形＋にも＋动词ない形／动词意志形＋にも＋动词可能形式的ない形
    constraints: []
    contrasts: []
  - pattern: ～ようがない
    function_cn: 想做也没有办法做
    formation: 动词ます形去掉「ます」＋ようがない
    constraints: []
    contrasts: []
  - pattern: もっとも／ただし
    function_cn: 对前述内容补充条件、例外情况及说明，不改变整个句子的表达方向，只表述局部例外
    formation: 用于连接分句，「ただし」稍显正式，多用于表示规则、条件等的句子
    constraints: []
    contrasts:
    - 「もっとも」与「ただし」相比，「ただし」稍显正式
  - pattern: ～てこそ
    function_cn: 强调“排除其他”，用于肯定后项内容；名词＋でこそ 表示“只有这样才……”；动词て形＋こそ、动词可能形て形＋こそ 后接正面评价，表示“因做了某事才有意义、才产生好的结果”，多用于常理或未来事情。
    formation: 动词て形＋こそ；名词＋でこそ；动词可能形て形＋こそ
    constraints:
    - 后项多为正面评价或肯定内容
    - 名词形式需加「で」
    contrasts: []
  - pattern: ～と思いきや
    function_cn: 表示“以为……但实际不是”，与预想相反，强调结果太出乎意料，为惯用表达形式。
    formation: 名词＋と思いきや；小句（简体形式）＋と思いきや
    constraints:
    - 前项为名词或小句简体形式
    - 后项为与预想相反的实际结果
    contrasts: []
