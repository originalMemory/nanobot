  - 表达强烈意愿（ぜひ）
  - 限定时间范围（～中に）
  grammar:
  - pattern: ～たいです
    function_cn: 表达说话人自身想做某事（愿望）
    formation: 动词ます形去ます + たいです
    constraints:
    - 主语通常为第一人称
    - 与「～が欲しいです」区分：前者接动作，后者接名词
    contrasts:
    - ～が欲しいです
  - pattern: ～が欲しいです
    function_cn: 表达想要某物（愿望）
    formation: 名词 + が + 欲しいです
    constraints:
    - 对象为名词（物）
    - 与「～たいです」区分：后者接动作
    contrasts:
    - ～たいです
  - pattern: ～ませんか / ～ましょう / ～どうですか
    function_cn: 邀请、提议对方共同行动
    formation: 动词ます形去ます + ませんか / ましょう / ますどうですか
    constraints:
    - 用于向对方发出邀请或建议
    - 「どうですか」前接动词ます形
    contrasts: []
  - pattern: 名が欲しいです
    function_cn: 表示对某物的愿望/想要某物
    formation: 名词（愿望对象）+ が + 欲しいです；主语为愿望主体，陈述句常为第一人称、疑问句常为第二人称，主语多省略
    constraints:
    - 愿望对象必须用助词「が」标记，不能用「を」
    contrasts:
    - 与「～たいです」区别：「欲しい」的对象只能用「が」
  - pattern: 名を動たいです
    function_cn: 表示“想（做某事）”的愿望
    formation: 动词ます形去「ます」+ たいです；对象名词可用「を」或「が」标记；主语规则同「欲しい」（陈述第一人称、疑问第二人称，常省略）
    constraints:
    - 「たい」前接动词ます形去ます的形式
    - 对象助词「を」与「が」可互换，但「欲しい」对象只能用「が」
    contrasts:
    - 全面否定“名词+に/から/と+动词”时，助词后加「も」构成“疑问词+にも/からも/とも+动词否定”
    - 全面否定“名词+へ+动词”时，可用“疑问词+も+否定”或“疑问词+へも+否定”
  - pattern: 動ませんか
    function_cn: 表示提议/邀请
    formation: 动词否定形式「～ません」+ 疑问助词「か」
    constraints:
    - 表面为疑问形式，实际语法功能为提议
    contrasts: []
  - pattern: 动词ましょう
    function_cn: 表示提议、邀请对方一起做某事
    formation: 将动词ます形的「ます」替换为「ましょう」
    constraints:
    - 礼貌程度低于「～ませんか」
    contrasts: []
  - pattern: 疑问词＋でも
    function_cn: 表示在任何情况下事态都相同（无论谁/无论何时/无论什么）
    formation: 疑问词（何、いつ、だれ等）后接「でも」
    constraints:
    - 肯定句用「疑问词＋でも」，否定句须改用「疑问词＋も」，二者不可混用
    contrasts:
    - 「いつも」表示常常、经常；「いつでも」表示不论任何时候、随时，二者语义不同
  - pattern: ね②
    function_cn: 缓和语气，舒缓自己的心情或想法并将其传达给对方（区别于表示确认的「ね」）
    formation: 句末接「ね」
    constraints: []
    contrasts:
    - 与第4课表示确认的「ね」用法不同
  - pattern: ～たいです／～たいですか／～ませんか／～ましょう
    function_cn: 表达愿望、希望与邀请；～たいです表自身愿望，～たいですか直接询问对方愿望，～ませんか用于邀请，～ましょう用于提议或回应邀请（含一起、共同做某事含义）
    formation: 动词ます形去ます＋たい；动词ます形＋ません＋か；动词ます形＋ましょう
    constraints:
    - 直接询问他人愿望（～たいですか）适用于朋友、父母对孩子、教师对学生等关系；对长辈、上级或不熟的人显得不够礼貌，应改用どうですか或～ませんか等委婉表达
    - 别人邀请自己参加活动时可用～ましょう回答
    contrasts:
    - ～たいですか（直接询问愿望）与～ませんか（邀请）在语用礼貌度上的差异
  - pattern: ～中に
    function_cn: 表示该期间结束之前的意思（在……之内/之前）
    formation: 接在表示未来某一特定时间的词后，如今日、明日、今週、来週、今年等
    constraints:
    - 今日、明日、今年后接～中に时，～中に读作～じゅうに
    - ～週、～月后接～中に时，～中に读作～ちゅうに
    contrasts: []
  - pattern: ぜひ
    function_cn: 表示“一定”“必定”，表达强烈愿望、意志、提议
    formation: 后续～たい、～てください、～ましょう等
    constraints: []
    contrasts: []
  - pattern: お汁粉
    function_cn: 词汇：把小豆煮熟后用糖调制而成的羹，有时里面放年糕一起煮了吃
    formation: 名词
    constraints: []
    contrasts: []
  pragmatics:
  - 「ぜひ」表示强烈意愿（一定）
  - 「何でも」表示不限对象（什么都行）
  - 陈述句愿望主语多为第一人称、疑问句多为第二人称，因可从上下文判断而常省略
  - 「～ましょう」与「～ませんか」的礼貌程度差异
  - 对长辈、上级及不熟的人询问愿望时应使用どうですか或～ませんか等委婉表达，避免直接使用～たいですか
  - ぜひ用于加强愿望、意志或提议的语气
