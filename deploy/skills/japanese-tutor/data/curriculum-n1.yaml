  - 转述/听说对方习惯动作
  - 确认对方已完成某事（如用餐、确定日程）
  - 劝说对方做有益之事
  - 礼貌地请求对方执行动作（请坐、请利用电梯、请从某门进入）
  - 以尊他语询问或陈述对方的动作（吃、看、来、去、说、给、办理手续等）
  - 随意应答/确认
