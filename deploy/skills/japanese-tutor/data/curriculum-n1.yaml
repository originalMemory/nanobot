  communication_functions:
  - 进店：说明来店人数及期望座位种类、请服务员带位
  - 领位：服务员引导至座位
  - 点菜：浏览菜单、询问饭菜内容、点菜、询问推荐、指定人数用火锅
  - 招呼：向服务员要水等
  - 结账：在座位或收银台结账、AA制、请客
  - 离店：顾客与店家互致寒暄
  - 招呼与提议
  - 指代方向/场所
