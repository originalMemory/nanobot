  grammar:
  - pattern: ～のではないか／～ではないだろうか／～ではないでしょうか
    function_cn: 委婉地提出自己的意见或推测，避免直接断定；句尾读升调。
    formation: 小句（简体形式）+ のではないか／ではないだろうか／ではないでしょうか；二形形容词、名词 + ではないか／ではないだろうか／ではないでしょうか。
    constraints:
    - 「～（の）ではないか」主要用于书面语。
    - 口语中按礼貌程度由高到低有多种变化形式（如 ～（の）ではありませんか、～（の）ではないですか、～（ん）じゃありませんか、～（ん）じゃないですか 等）。
    contrasts: []
  - pattern: ～気がする
    function_cn: 表示对过去某事记忆模糊、没有把握但认为是那样；也用于陈述意见，表示信心不足或不想强烈主张。
    formation: 小句（简体形式）+（ような）気がする；二形形容词 + な + 気がする；名词 + の + 気がする。
    constraints: []
    contrasts: []
  - pattern: ～と思う／～と思える／～と思われる
    function_cn: 表明说话人陈述的是自己的主观意见或判断，避免表明自己断定的意见。
    formation: 小句 + と思う／と思える／と思われる。
    constraints:
    - 使用「～と思われる」时，表明是“自然而然地这样考虑”，而非专断的意见。
    contrasts: []
  - pattern: ～はずです
    function_cn: 陈述基于说话人自己的推论或记忆等能作为判断依据的信息，认为理所当然会成立的事情。
    formation: 小句 + はずです。
    constraints: []
    contrasts: []
  - pattern: ～ようだ / ～らしい
    function_cn: 基于某种根据做出的判断，常用于避免明确断定的情形
    formation: 接于名词、小句等之后
    constraints: []
    contrasts: []
  - pattern: ～のところ
    function_cn: 表示“现在这个时刻”“此刻”，含今后可能发生某种变化的语气
    formation: 接于名词（如“今”“現在”）之后构成“今/現在のところ”
    constraints: []
    contrasts:
    - 与“今”“現在”相比，后者仅表“现在”，前者含变化可能语气
  - pattern: ～見込みです
    function_cn: 表示“很可能”“有希望”，陈述未来变成某种状态的可能性非常高
    formation: 小句（简体形式）+見込みです；名词+の見込みです；前接动词时使用动词的现在将来形式
    constraints: []
    contrasts:
    - 与～はずです在表示不确定上相似，但～はず表示逻辑上存在那样认为的理由，～見込み则客观陈述某种可能性很高
  - pattern: ～でも
    function_cn: 助词“で”后续表示主题或对比的“は”构成“では”；“で”后续“も”构成“でも”，表示存在其他选项
    formation: “で”+“は”→“では”；“で”+“も”→“でも”
    constraints:
    - 该用法与“～でも～でも”用法不同
    contrasts:
    - 与表示范围的“で”后续对比的“は”构成的“では”用法相同
  - pattern: ～でも～でも／～にしても，～にしても
    function_cn: 表示前提范围内的所有选项、某种条件下的每个选项，意为“无论A还是B”；A、B为名词，须同范畴或相互对立；～にしても还可前接小句（简体形式）
    formation: 名词＋でも／にしても；小句（简体）＋にしても
    constraints:
    - A与B须为名词且同范畴或对立
    - ～にしても可接小句简体形式
    contrasts: []
  - pattern: 当たる
    function_cn: 原意为事情与期待完全吻合，引申为“成功”；多用于工作策划或安排得到很多人支持的情形
    formation: 动词（他动词/自动词用法，此处为自动词“当る”）
    constraints: []
    contrasts: []
  - pattern: そうそう
    function_cn: 表示突然想起某事（与“そういえば”同义）；也用作随声应答表示赞成对方
    formation: 常与“あっ”连用，如“あっ、そうそう”
    constraints:
    - 仅用于会话，不用于书面语
    - 作随声应答时只用于关系密切者之间，对不熟者使用显得不礼貌
    contrasts:
    - そういえば
  - pattern: 形容词去“い”＋まる（自动词）／＋める（他动词）
    function_cn: 表示状态变化（自动）或使状态变化（他动）
    formation: 形容词词干＋まる／める
    constraints:
    - 仅适用于部分形容词，如広まる/広める、強まる/強める、弱まる/弱める
    - 不适用于大きい、小さい、いい、悪い等形容词
    - “～まる”“～める”为古代日语残留形式
    contrasts:
    - 自动词表自身变化（高くなる）
    - 他动词表使变化（高くする）
  - pattern: ～わけではない
    function_cn: 对依据某种情况附带推测出来的情况作否定；与全部/みんな/全く/すべて连用时表部分否定
    formation: 小句（简体）＋わけではない；二类形容词＋ナ＋わけではない；名词＋である（であった）＋わけではない；亦可用～というわけではない
    constraints:
    - 前接二类形容词与名词时接续形式不同
    - 与全部/みんな/全く/すべて连用时表示“虽然部分情况如此，但并非完全如此”
    contrasts:
    - 与“全く～ない”（完全否定）相对，本句型可表部分否定
  - pattern: うーん（支吾语）
    function_cn: 表示对对方提问不能立刻回答、正在考虑当中
    formation: 独立支吾语
    constraints: []
    contrasts:
    - 与“ええと”区别：后者表示已想到答案、正考虑如何组织表达
  - pattern: 同音異義語（同音异义词）
    function_cn: 指发音相同但意思不同的词语；日语中音节少的词多，故同音异义词常见。
    formation: 按音节数（二、三、四、五音节）区分同音异义项；两音节词可用不同声调区分。
    constraints:
    - 口語中無法以書寫方式分辨，需依上下文判斷意思
    - 部分詞（如「私立/市立」「科学/化学」）需改変読法以示區別
    contrasts:
    - 「あめ」雨 vs 飴
    - 「はし」橋 vs 箸
    - 「こうそく」高速 vs 拘束 vs 校則 vs 光速
  - pattern: ～に夢中になる
    function_cn: 表示被某事物吸引而专心致志投入其中的状态；兼含“拼命地”“努力地”之意
    formation: 名词/动词连用形＋に夢中になる；常以“～に夢中になって～する”形式出现
    constraints:
    - “夢中”本身为名词，故可构成“～に夢中だ”的用法，此时被吸引的对象用助词“に”提示
    - “～に夢中”变为“～に夢中で”的形式时可修饰动词
    contrasts: []
  - pattern: ～という
    function_cn: 表示引用；用于句尾表示传闻
    formation: 名词/动词/形容词＋という；句尾传闻形式为“～ということだ”
    constraints:
    - 以“～ということだ”形式用于句尾时，与“～そうだ”相同，表示传闻
    - 在文章中，有时以“～という”形式直接用于句尾表示传闻
    contrasts:
    - 与“～そうだ”在句尾传闻用法上相同
  - pattern: ～向け
    function_cn: 表示“适合的”“恰当的”，指某事物在策划、制作之初即设定了目标对象
    formation: 由动词“向けます”衍化而来的名词；句尾用“～向けです”；后续名词用“向けの～”
    constraints:
    - 用于某事物的策划、制作从一开始就设定好了目标对象的情况
    contrasts:
    - 与“～向き”意思大致相同但使用上有微妙差异：“～向き”表示一开始并未特意设定目标对象，但从结果来看被限定在某些对象范围；“～向き”由动词“向きます”衍化而来，句尾用“～向きです”，后续名词用“向きの～”
  - pattern: ～に～（向けに～／向きに～）
    function_cn: 表示对象、面向、针对某类人
    formation: 接与人相关的名词，有时也接其他名词
    constraints:
    - 一般接与人相关的名词
    contrasts: []
  - pattern: ～に関する
    function_cn: 表示“～について（关于）”“～に関連して（与……相关连）”
    formation: 名词＋に関する；后接名词时用“～に関する＋名词”
    constraints:
    - 比“～に関して”更为郑重
    contrasts:
    - ～に関して（可换说成“～について”，但较不郑重）
  - pattern: ～にしか
    function_cn: 表示限定，后接否定表达，意为“仅限……”
    formation: 限定助词“しか”与助词“に”结合构成“～にしか”
    constraints:
    - “しか”前接助词“が”“を”时省略为“が”“を”
    - 前接“に”“と”“で”“から”等助词时一般不能省略
    contrasts: []
  - pattern: ～だけで(は)なく～も
    function_cn: 表示'除了A之外B也……'，含递进、不尽限于前项程度的语气
    formation: 小句（简体形式）+だけで(は)なく～も；名词+だけで(は)なく～も
    constraints:
    - 有时用'まで'代替'も'
    - 与'～(の)ほか'区别：后者为单纯补充，本句型含'不止于该程度'的语气
    - 书面语中可用'～のみならず～も'形式
    contrasts:
    - ～(の)ほか（单纯补充）
  - pattern: ～うえ(に), ～
    function_cn: 表示相同倾向事情的累积，强调程度递进，后项包含比前项程度深得多的内容
    formation: 小句（简体形式／た形）+うえ(に)
    constraints:
    - 一般不能前接名词
    - 有时省略'に'
    - 比'～だけで(は)なく'强调程度更强
    - 可用连词'そのうえ'将句子分成两部分
    contrasts:
    - ～ほかに（仅表'此外还有'的单纯补充）
  - pattern: ～とは比べものにならない
    function_cn: 表示“相差很大”的惯用表达方式；使用助词“と”时必须明示比较对象；若前面句子已出现比较表达，为强调该比较有时可单独使用。
    formation: AはBとは比べものにならない
    constraints:
    - 必须用助词“と”明示比较对象
    - 可单独使用以强调比较
    contrasts: []
  - pattern: その後
    function_cn: 表示“以后／后来／其后”；一般只用于句首，不能用于句中；句中表达类似意思时用“～た後”；当前半句用“～て”或“ます形”去掉“ます”以及表示转折的“～けど／～が”等表达方式时，也可在其后的句中使用；较多用于书面语。
    formation: 句首使用；句中类似意思用“～た後”
    constraints:
    - 一般只用于句首，不用于句中
    - 较多用于书面语
    - 读法有“そのご”与“そのあと”两种
    - “その後”多用于指示历经较长时间、书面语；“そのあと”表示具体动作在很短时间之后发生、主要用于口语
    contrasts:
    - “その後”（较长时间、书面）与“そのあと”（短时间、口语）
  - pattern: ～とともに、～
    function_cn: 两种用法：①A是原因，随着A的动作、变化，B的动作、变化也同步进行；②A与B同时进行。
    formation: 动词（基本形）／名词＋とともに
    constraints:
    - 用法①表伴随原因/同步变化
    - 用法②表同时进行
    contrasts: []
  - pattern: 高～
    function_cn: 接在名词前表示程度高、位置高、地位高等含义；可构成『高画質』『高成績』『高評価』等表达。
    formation: 高＋名词
    constraints: []
    contrasts: []
  - pattern: いきいきとした
    function_cn: 表示动植物等生机勃勃的样子，须后接名词；惯用形式『いきいきとしている』；『いきいきと』也可直接修饰其他动词。
    formation: いきいきと＋た＋名词／いきいきと＋动词
    constraints:
    - 须后续名词（た形接续时）
    contrasts: []
  - pattern: 生み出す
    function_cn: 原义为分娩，现多指新制作出来、产生新物品或新想法；常用于书面语。
    formation: 动词（他动）
    constraints:
    - 书面语倾向
    contrasts: []
  - pattern: やがて
    function_cn: 表示某事物或状况出现变化或发展，从而出现别的状况或新局面；时间不限，可几分钟也可几年。
    formation: 副词
    constraints: []
    contrasts: []
  - pattern: ～性
    function_cn: 接名词，表示具有该名词的性质或属性
    formation: 名词＋性
    constraints:
    - 与汉语“性”用法相同
    contrasts: []
  - pattern: 次々
    function_cn: 副词，表示“接下来”“一个接一个”，修饰后面的动词
    formation: 次々に／次々と
    constraints:
    - 比“次々に”语气稍显正式，多用于书面语
    contrasts:
    - 次々に（较口语）
  - pattern: ～力
    function_cn: 接名词，表示能够做某事的能力或“～的力量/能力”
    formation: 名词＋力
    constraints:
    - 通常前接表示动作的词语，也可前接事物名词
    contrasts: []
  pragmatics:
  - 通过升调与委婉句型降低断言强度，体现礼貌与留有余地的语用策略。
  - そうそう作应答时限于关系密切者，对不熟者不礼貌
