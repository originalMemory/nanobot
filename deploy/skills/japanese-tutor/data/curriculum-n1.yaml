  - 请求对方许可自己执行某动作
  grammar:
  - pattern: ～たらどうですか／～てはどうですか／～たいかですか／～たいかでしょうか／～てはいかがですか／～てはいかがでしょうか
    function_cn: 征求对方意见的提议，建议对方采取某种行动
    formation: 动词た形／て形／形容词・形容动词・名词＋たいか／てはいかが
    constraints:
    - 用「いかが」比「どう」更郑重礼貌；「～でしょうか」比「～ですか」更礼貌、无强加感
    - 「～ては」比「～たら」稍显礼貌
    - 表疑问的句尾助词「か」有时可省略
    - 适用于对方不知道该怎么做等场合；若对方已知办法，用「～たらどうですか」会带斥责语气、失礼
    contrasts:
    - 「どう」vs「いかが」：后者更郑重
    - 「～ですか」vs「～でしょうか」：后者更礼貌
    - 「～たら」vs「～ては」：后者稍礼貌
  - pattern: ～ませんか／～ましょう／～ましょうよ／～てはいかがですか
    function_cn: 就行为提建议，提议对方与自己一起做某事
    formation: 动词ます形去ます＋ませんか／ましょう；动词て形＋はいかがですか
    constraints:
    - 估计对方会赞同自己的提议时用「～ましょう」
    - 加「よ」成「～ましょうよ」表强烈建议
    - 为不强加对方、在对方尚未想到时，可用「～てはいかがですか」等客气谨慎说法
    contrasts:
    - 「～ませんか」vs「～ましょう」：后者用于预计对方会同意
    - 「～ましょう」vs「～ましょうよ」：后者语气更强
  - pattern: いいですね／なるほど／いいかもしれませんね／～んです／ちょっと…
    function_cn: 回应提议：赞成或委婉不赞成
    formation: 固定寒暄/接续表达
    constraints:
    - 赞成时用「いいですね」；自己之前没想到则说「なるほど」
    - 目前不太清楚但有赞同可能时用「いいかもしれませんね」，或重复对方意见后接「それもいいかもしれませんね」
    - 不赞成时可用「～んです」陈述理由或说明自身情况
    - 也可不明确回答，用「ちょっと…」委婉表示不赞成
    contrasts:
    - 「いいですね」vs「いいかもしれませんね」：后者保留余地
    - 明确拒绝 vs「ちょっと…」委婉拒绝
  - pattern: そのとおりです
    function_cn: 表示对方所言正确、表示赞同的应答表达；更礼貌的说法为「おっしゃるとおりです」。
    formation: 用于回应前文陈述，确认其内容属实。
    constraints:
    - 用于赞同对方观点，非因果或补充关系。
    contrasts: []
  - pattern: それで
    function_cn: 连词，陈述某事实后，作为该事实的自然发展趋势引出接下来将出现的情况；也可用于承接前面话题同时转换话题。
    formation: 接在陈述句后，后接后续说明或提议。
    constraints:
    - 虽表因果，但不如「だから」那样表示强烈理由。
    - 后面不能使用命令或意志的表达方式。
    - 较随便的说法有「で、～」。
    contrasts:
    - 与「だから」相比语气较弱，不强调强烈理由。
  - pattern: さらに
    function_cn: 用于陈述某件事情后补充另外（并列/递进）的事情，对内容进行补充。
    formation: 接在已陈述内容后，追加同类或递进信息。
    constraints:
    - 用于对内容的补充，而非按时间顺序的补充。
    contrasts:
    - 与「それから」不同：「さらに」用于内容补充，「それから」用于按时间顺序补充。
  - pattern: それから
    function_cn: 用于按时间顺序补充陈述；也可用作补充话题的标志。
    formation: 接在已陈述内容后，按时间或话题顺序追加。
    constraints:
    - 用作补充话题标志时，不能使用「さらに」。
    contrasts:
    - 与「さらに」不同：「それから」用于时间顺序补充或话题标志。
  - pattern: うん
    function_cn: 表示认同、随声应答或自言自语；非敬语，使用需注意场合
    formation: 独立感叹/应答词
    constraints:
    - 不用于很恭敬的表达
    - 可表‘是’或认同对方话语
    contrasts: []
  - pattern: ほう
    function_cn: 对对方话语表示吃惊的应答方式，男性较常用；可拉长发音为‘ほうー’
    formation: 独立应答词
    constraints:
    - 多用于对对方话语感兴趣的场合
    contrasts: []
  - pattern: ～について
    function_cn: 表示话题或主题等对象，相当于‘关于～’
    formation: 名词＋について；郑重形式为～につきましても；后续名词时用～について＋の＋名词
    constraints: []
    contrasts: []
  - pattern: ご覧ください
    function_cn: ‘见てください’的礼貌说法，请求对方观看
    formation: 与敬语特殊形式‘ご覧になる’的请求形式‘ご覧になってください’意思相同
    constraints: []
    contrasts: []
  - pattern: 可能形式（～られる）
    function_cn: 表示可能、尊敬、被动三种用法；动词类型不同则可能形式也不同
    formation: 二类动词后续‘られる’；用‘が’或‘は’提示动作主体时表可能或尊敬，提示动作对象时表被动
    constraints:
    - 需根据助词区分可能/尊敬/被动
    contrasts:
    - 可能 vs 尊敬 vs 被动 的助词区分
  - pattern: ～ことができる
    function_cn: 表示可能，可替换任意动词的可能表达
    formation: 动词＋ことができる
    constraints:
    - 表示可能时，无论何种动词均可用此形式替换
    contrasts: []
  - pattern: でも／が／しかし／けれども
    function_cn: 表示转折，相当于汉语“可是”“但是”
    formation: 连接小句或句子
    constraints:
    - でも 不用于书面语
    - が 在口语中很少使用
    - しかし 语气更为正式
    - が、けれども 表示转折时在小句之间和句子之间都可使用
    - 作为连接两个句子的连词时，前后两个句子的文体必须一致
    contrasts:
    - 书面语与口语适用性不同
    - 正式程度：しかし 较正式
  - pattern: ～（さ）せてください
    function_cn: 请求许可的表达方式，说话人是动作行为的实施者
    formation: 动词使役形式＋～てください
    constraints:
    - 更为礼貌的表达为 ～（さ）せていただけますか
    contrasts: []
  - pattern: ～だけで
    function_cn: 表示少量的某事或某物引发后项事件；接在表示量的表达后可表示满足某种行为所需的量（如把所有东西都带来）。
    formation: 小句（简体形式）+だけで；名词+だけで
    constraints:
    - 用于表达引发后项事件所需的最小量或条件
    contrasts: []
  - pattern: ～だけだ
    function_cn: 用于句尾表示断定，意为该行为带来的影响不大或该事件没有除此之外更深的含义；否定形表示除此之外还有重大事件；接数字时表示不超过该数量、意为很少。
    formation: 小句（简体形式）+だけだ；否定形 ～だけではない；可接数字
    constraints:
    - 句尾断定用法
    contrasts:
    - ～だけではない 表示除此之外还有更深/更重要的内容
  - pattern: ～だけではすまない／～だけですね
    function_cn: 表示影响或意义不可能在某种水平以下，多用于不好的事情、表示影响严重；～だけですね 则意思刚好相反，表示影响轻微。
    formation: 小句（简体形式）+だけではすまない／だけですね
    constraints:
    - ～だけではすまない 多用于负面、影响严重的情形
    contrasts:
    - ～だけですね 表示影响轻微，与 ～だけではすまない 相反
  - pattern: すると
    function_cn: 表示紧接着前项事件发生了某事，常用于观察某事物时发现意外事情的情况
    formation: 前接过去形式「～た」，句末一般也用过去形式「～た」
    constraints: []
    contrasts: []
  - pattern: ～代わりに～／～代わって／～に代わる～
    function_cn: 表示“替代、代替”，相当于汉语“不是～而是～”；“代わる”本为“替代、代替”之意，“代わりに”是其名词形式
    formation: 「代わりに」前接小句谓语简体形式或「名词＋の」；另有「名词＋に代わって～」与之意思相近；相同表达还有「～ないで、～」「～ずに、～」（后两者前接动词小句）；后接名词用法为「名词＋に代わる＋名词」，表示由另外人物担当本应由某人担当的角色，略书面化，相近还有「～の代わりに～」
    constraints:
    - 「～ないで、～」「～ずに、～」前接动词小句
    - 「名词＋に代わる＋名词」用法略书面化
    contrasts:
    - 「名词＋の代わりに～」与「名词＋に代わって～」意思相近
    - 「～代わりに～」与「～ないで、～」「～ずに、～」意思相同
  - pattern: ～(ら)れるようにしなければならない
    function_cn: 表示必须使某事处于可被实现/可被做的状态，强调必要性
    formation: 动词可能形(～(ら)れる) + ようにする + なければならない；可替换为～なければならない、～ないといけない、～なくてはならない、～なくてはいけない等
    constraints:
    - 前接动词可能形
    - 用于表达‘必须做到使……成为可能’
    contrasts:
    - 与单纯～なければならない的区别在于含‘使之成为某种状态’的意味
  - pattern: ～、～、～、～と
    function_cn: 列举三个以上名词或名词句，表示‘……等’
    formation: 由‘～というように’省略‘いうように’而来；各项用逗号隔开，最后一项加‘と’
    constraints:
    - 用于列举三个以上项目
    contrasts: []
  - pattern: 工夫
    function_cn: 指多方考虑后获得的好办法、好主意
    formation: 名词，常与‘～工夫の末’搭配
    constraints:
    - 与汉语‘工夫’不同，不含‘时间’含义
    contrasts:
    - 区别于汉语‘工夫’的时间义
  - pattern: ～末
    function_cn: 表示经历某个过程之后最终取得某种结果或成功
    formation: 名词+の+末、动词(た形)+末；可前接小句，用‘～た末(に)+谓语’‘～た末の+名词’表示最终结果
    constraints:
    - 常与‘ようやく’‘やっと’等副词连用，强调经多方反复思考、想尽办法后的结果
    contrasts:
    - ‘工夫の末’特指想尽办法后的结果
  - pattern: ～あぐ(に)
    function_cn: 表示经过某过程后达到某种结果，前项多为消极/非积极意义，强调结果来之不易；常与“ようやく”“やっと”连用；与“～末(に)”近似但前后项不构成因果关系。
    formation: 动词(た形)+あぐ(に)
    constraints:
    - 前项陈述事态过程，后项陈述事态发展的结果
    - 前项过程大多不是积极意义的
    - 可与“ようやく”“やっと”等一起使用以强调结果来之不易
    contrasts:
    - 与“动词(た形)+末(に)”表达方式非常近似，但“～あぐ(に)”前后项不构成因果关系
  - pattern: ～た結果
    function_cn: 表示结果，前后项为因果关系，前项是引发后项的原因；也可用于没有经历特别过程、一次就得出结果的情况。
    formation: 动词(た形)+結果
    constraints:
    - 前后项是因果关系，前项的结果是引发后项的原因
    - 可用于一次就得出结果的情况
    contrasts:
    - 与“～あぐ(に)”不同，本表达前后项为因果关系
  - pattern: 今では
    function_cn: 与“今”意思相同，但用于现在的状况与以前相比有显著变化的情形，包含从过去到现在变化的过程，含有变化很大的语气。
    formation: 副词性表达，置于句中
    constraints:
    - 用于现在与以前相比有显著变化的情形
    - 包含从过去到现在变化的过程
    contrasts:
    - “今”“現在”只表示现在的意思，使用范围更广
    - 与表示从以前一直持续到现在的“今でも”“今も”意思正好相反
  pragmatics:
  - 商务敬语与礼貌表达（先日の話では、～と思います、ご覧ください）
  - 称呼与角色：王风（JC策划公司）与佐藤（龙虎酒业公司上海事务所）
  - 礼貌度层级：どう<いかが、ですか<でしょうか、たら<ては
  - 避免强加于人的语用策略（～ましょうよ、ちょっと…）
  - 对已知办法者使用提议句型的失礼风险
  - 「そのとおりです」的礼貌升级形式为「おっしゃるとおりです」。
  - 「それで」后接命令/意志表达受限，较随便说法为「で、～」。
  - ‘うん’非敬语，需注意使用场合
  - ‘ほう’男性较常用
  - 礼貌度层级：～（さ）せてください 低于 ～（さ）せていただけますか
