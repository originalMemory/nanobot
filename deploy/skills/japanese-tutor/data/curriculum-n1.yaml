    formation: 动词ない形 + でください
    constraints: []
    contrasts: []
  - pattern: ～なければなりません
    function_cn: 表示义务、必须做某事
    formation: 动词辞书形 + なければなりません
    constraints: []
    contrasts:
    - 与～なくてもいいです（不必）相对
  - pattern: ～なくてもいいです
    function_cn: 表示允许不做、不必做某事
    formation: 动词ない形 + てもいいです
    constraints: []
    contrasts:
    - 与～なければなりません（必须）相对
  - pattern: ～です
    function_cn: 判断/自我介绍（用于确认对方身份）
    formation: 名词 + です
    constraints: []
    contrasts: []
  - pattern: 动词的「ない形」
    function_cn: 动词否定形的构成规则，作为后续否定句型的接续基础
    formation: 一类动词：将「ます形」去掉「ます」后，末音变为相应「あ段」音再加「ない」；末音为「い」时变为「わ」再加「ない」（不可变为「あ」）。二类动词：去掉「ます」后加「ない」。三类动词：「来ます」→「来ない」、「します」→「しない」。
    constraints:
    - 一类动词「い」音结尾需变「わ」而非「あ」
    - 三类动词为不规则变化
    contrasts:
    - 与第14课动词「て形」接续方式不同
  - pattern: 动词「ないで ください」
    function_cn: 表示否定的命令/请求，即“请不要做某事”
    formation: 「ない形」＋で＋ください
    constraints:
    - 用于否定命令，区别于肯定命令「～てください」
    contrasts:
    - 肯定命令「～てください」的否定形式
  - pattern: 动词「なければ なりません」
    function_cn: 表示必须、不得不
    formation: 将动词「ない形」中的「ない」换成「なければ なりません」
    constraints:
    - 可用「ないと けません」形式代替
    contrasts:
    - 「ないと けません」为同义替代表达
  - pattern: ～なければなりません／～ないと いかせません
    function_cn: 表示必须做某事（义务/必要）
    formation: 动词ます形去ます＋なければなりません；动词ます形去ます＋ないと いかせません
    constraints:
    - 本页为上一页该句型的延续例句，未给出完整规则说明
    contrasts: []
  - pattern: 動なくても ぃぃです
    function_cn: 表示不做某事也可以（许可/不必做某事）
    formation: 动词ない形去掉『ない』换成『なくても ぃぃです』
    constraints:
    - 相当于『～なければ なりません』的否定
    contrasts:
    - 与『～なければなりません』构成正反对照
  - pattern: 名1が 名2です／名2は 名1です
    function_cn: 区分新旧信息：旧信息用『は』提示话题，新信息做主语用『が』
    formation: 作为话题的名词用『は』，新信息主语用『が』＋です
    constraints:
    - 叙述直接观察到的事物、新信息做主语时用『[名词]が[动词]』
    - 疑问词（何・だれ・どこ・いつ）做主语时不能用『は』，只能用『が』，因其不能表示旧信息
    contrasts:
    - 『は』提示旧信息话题 vs 『が』标记新信息主语
  - pattern: ～なければなりません / ～ないと（いけません）
    function_cn: 表示义务、必要性；前者较正式、多用于书面语，后者用于口语，其省略形“～ないと”在口语中常用
    formation: 动词否定形（～ない）＋ ければなりません / ないと（いけません）
    constraints:
    - 两者均表义务/必要性，语体正式度不同
    contrasts:
    - ～なければなりません（书面/正式） vs ～ないと（いけません）（口语）
  - pattern: 初心者 / 上級者
    function_cn: 表示技能等级；日语描述人的技能、技术用“上級”而非“高級”
    formation: 名词（等级称谓）
    constraints:
    - “高級”仅用于表示高质量物品，不用于人的技能/技术
    contrasts:
    - 上級（人的技能等级） vs 高級（物品质量）
  - pattern: 何＋量词＋も＋肯定形式
    function_cn: 表示数量多
    formation: 何＋量词＋も＋肯定谓语
    constraints:
    - 需接肯定形式
    contrasts: []
  - pattern: だいぶ
    function_cn: 表示程度相当高的副词，用于“～になりました”等变化句型中强调变化程度
    formation: 副词，修饰谓语
    constraints:
    - 常用于表示变化的句型
    contrasts: []
  - pattern: 大丈夫です
    function_cn: 意为“没问题/可以”；依上下文可表“我保证（不…）”等
    formation: 名词＋です
    constraints:
    - 含义随上下文变化，需结合语境理解
    contrasts:
    - 与汉语“大丈夫”汉字相同但意思不同
  pragmatics:
  - 用「～ないでください」进行礼貌劝阻
  - 用「～なければなりません」说明义务以婉拒邀请
  - 用「～ですが…」进行自我介绍时的谦让/缓冲
  - 使用敬体（です・ます）进行同伴间礼貌交流
