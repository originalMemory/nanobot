  similar_contrasts:
  - 与自动词/自然现象被动区分
  - 与一般他动词被动语感相近，但施事为自然现象
  - 与口语中用「に」引出施事者相比更书面
  - 被动形『助けられました』为客观叙述、不表受益；『助けてもらいました』表示受益
  - 与「名は名に動(ら)れます」区分：特定主体用「によって」，非特定/受害语境用「に」。
  - 与口语词汇选择相对
  - 口语多用敬体「～ます」「～です」
  - 口语用「て形」
  - 口语用日语固有简单助词
  - 口语较少用事物作被动主语
  - 书面语通常多用汉字词和日语固有词
