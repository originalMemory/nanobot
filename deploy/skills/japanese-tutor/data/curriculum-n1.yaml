  similar_contrasts:
  - すみません（较轻） vs 申し訳ありません vs 申し訳ございません（最郑重）
  - 与句末“ね”（中级第6课）用法不同。
  - “どういうことですか”语气更强、含质问（中级第7课）。
  - ～のうち
  - ～てください
  - ～ないようにしてください
  - 与～たら、すぐに意义相近
  - 与“よ”“なんで”连用语气转为不满、愤怒
  - わざと
  - 与「苦情を言う」「苦情を述べる」并列，但「寄せる」强调通过信件/电话向某处投诉
  - 与「～ている」相比，「～つつある」只表示进行中，不表示变化结果的状态；与瞬间变化动词搭配时不能与「～ている」互换
  - 与助词「と」列举形式「AとBとCと…Xと」相区别。
  - 与『～の原料になる』相比更口语化
  - 与表示同时进行的『～ながら』等区别
  - ～ているながら～（不表同时进行）
  - 小句（简体）＋一方で（表对比）
