  themes:
  - 28 病院
  - 语法与表达
  - （挂念・探视病人）
  - 探视病人
  - 接受探视
  - 1. いや、～
  - 2. ～もんで
  - 3. ついでに
  jlpt_estimate:
    status: unverified
  communication_functions:
  - 去医院探视病人时的铺垫与寒暄（顺路探望、未能探望的致歉、得知住院的惊讶）
  - 询问对方身体状况与康复情况
  - 对病人表示挂念、鼓励与保重
  - 接受探视时说明自身身体状况
  - 否定与惊讶的轻语气表达
  - 口语中说明理由
  - 顺带做另一件事
  - 自谦与减轻对方负担的回应
  - 对他人行为或结果表示谅解、不在意（だったらいいんです）
  - 对活动结果作成功/失败的总结评价（大成功に終わる）
  - 鼓励对方鼓起勇气
  - 请对方不必客气地提出需求或意见
  - 丧礼场景的慰问与哀悼寒暄（愁傷様、ご冥福をお祈り、お悔やみ）
  - 寒暄与致谢/用餐前固定表达
  grammar:
  - pattern: いや
    function_cn: 否定表达，语气比「いいえ」轻微；也可用于否定自己刚说的话或表示惊讶；多用于男性，「いいえ」较有礼貌、男女通用。
    formation: 独立感叹/应答语
    constraints:
    - 语用：男性使用较多
    - 可表惊讶
    contrasts:
    - 与「いいえ」相比语气更轻、礼貌度较低
  - pattern: ～もんで
    function_cn: 表示理由的口语说法，与「～ものだから」「～ものですから」同义。
    formation: 小句（简体形式）＋もんで；二类形容词／名词＋なもんで
    constraints:
    - 口语体
    contrasts:
    - 与「～ものだから」「～ものですから」意义相同
  - pattern: ついでに
    function_cn: 表示做某事的同时也做其他事情。
    formation: 可作副词，或前接动词简体形式
    constraints: []
    contrasts: []
  - pattern: 照顾对方心理的表达方式
    function_cn: 受人称赞时使用自谦表达；被别人感谢时使用相应表达以减轻对方心理负担。
    formation: 语用/交际规则
    constraints:
    - 语用层面
    contrasts: []
  - pattern: 台無し
    function_cn: 表示本来没有问题或非常重要的东西变得很脏、很破或没有用处；不仅用于物品，也可用于机会、评价等抽象事物。
    formation: 名词/动词等 + 台無しになる
    constraints: []
    contrasts: []
  - pattern: 大成功のうちに終わる / 大成功に終わる
    function_cn: 用于活动或计划等结束之后，下结论说取得了成功的情况。
    formation: 大成功 + のうちに終わる / に終わる
    constraints: []
    contrasts:
    - 失败时用「(大)失敗に終わる」
  - pattern: だったらいいんです / ならいいんです
    function_cn: 基于对方的发言或当时状况来陈述自己的想法，向对方传达“没关系”“没有意见”等意思；用于自己挂念的事情在听了对方话之后。
    formation: 动词/形容词过去式 + だったらいいんです；名词 + ならいいんです
    constraints: []
    contrasts:
    - 与「～ならいいんです」意思相同
  - pattern: ～だけには
    function_cn: 限定提示某事物的说法，表示“除了…之外”的限定含义。
    formation: 名词 + だけには
    constraints: []
    contrasts: []
  - pattern: いつか
    function_cn: 表示过去或将来的某个时刻；用于想起某事的过去语境时可用いつだったか
    formation: 疑问词いつ＋か
    constraints:
    - 表示过去时刻时多用于想起某事的语境
    contrasts: []
  - pattern: 勇気づける
    function_cn: 直接或间接地鼓励某人鼓起勇气
    formation: 动词使役/鼓励型（～づける）
    constraints: []
    contrasts:
    - 元気づける（使振作）
    - 活気づける（使兴旺、使充满活力）
  - pattern: 遠慮なく
    function_cn: 意为“不用客气”，用于请对方不必拘谨地提出需求或意见
    formation: 后接动词；口语中可省略后面部分；可加ご构成尊他表达
    constraints:
    - 本课中后接动词，口语可省略后部
    contrasts: []
  - pattern: 変わった
    function_cn: 动词「変わる」的た形作定语修饰名词，表示与众不同、奇怪；作谓语时需用「変わっている」，「変わった」本身不能表示该谓语含义。
    formation: 変わる→変わった（定语）／変わっている（谓语）
    constraints:
    - 修饰名词时表‘怪、与众不同’
    - 谓语含义须用「変わっている」
    contrasts:
    - 「彼は変わった。」表‘变了、不同于以前’，与‘怪’义不同
  - pattern: 喝采を浴びる
    function_cn: 惯用表达，指在舞台等地方受到赞赏、喝彩。
    formation: 「浴びる」（淋、照、晒）＋「喝采」
    constraints:
    - 用于受到赞赏、喝彩的语境
    contrasts: []
  - pattern: ～に反して／～に反する／～に反した
    function_cn: 表示与某事物相对或相反，常与想法、思考相关的名词搭配。
    formation: 名词＋に反して／に反する／に反した
    constraints:
    - 常与「予想」「期待」「意志」等名词搭配
    contrasts: []
  - pattern: それらとは別に
    function_cn: 「それ（ら）」指代前述内容，「それとは別に」表示与所指代内容不同，用于补充与前文不同的信息。
    formation: それ（ら）＋とは別に
    constraints:
    - 与「一方」等表达方式作用相同，补充不同信息
    contrasts:
    - 与「一方」功能相近
  - pattern: あるいは
    function_cn: 连词，以「A あるいは B」形式表示“或者”其中之一；书面、郑重表达，与「または」「もしくは」同义。
    formation: 名词／句末＋あるいは＋名词／句末
    constraints: []
    contrasts:
    - または
    - もしくは
  - pattern: 万一
    function_cn: 表示极低可能性变成现实的情况，用于不希望发生的事（灾难、病情恶化等）；与「もしも」意思基本相同但用于可能性更低的情形。
    formation: 常见搭配「万一の時」「万が一の時」
    constraints: []
    contrasts:
    - もしも
  - pattern: ～中（で）、～
    function_cn: 表示时间位置“在～的时候／在～过程中”（区别于地点位置用法）。
    formation: 动词基本形／一类形容词＋中で；名词＋の中で
    constraints:
    - 是否使用助词「で」需根据后续句子内容而定
    contrasts: []
  - pattern: A の生みの親
    function_cn: 指 A 的亲生父母；引申为创造、发明 A 的人或事物（如某单词、某产品的创造者）。
    formation: 名词 A + の + 生みの親
    constraints: []
    contrasts: []
  - pattern: 慣用語の固定搭配
    function_cn: 惯用语中词与词的结合紧密，存在搭配制约；部分惯用语制约较弱，各词取其多种义项中的某一义项结合。
    formation: 名词/抽象词 + 固定动词（如「～を取る」「～を立てる」「～を見る」「～をかける」「～を浴びる」等），组合固定不可替换动词。
    constraints:
    - 搭配中的动词不可随意更换（如「予定を立てる」不可说成「予定を作る」）。
    - 部分惯用语含比喻义：拟人化（如「時間に追われる」）或将抽象事物具体化（如「喝采を浴びる」）。
    contrasts:
    - 与自由组合的普通词组相对，惯用语组合固定不变。
  - pattern: 固定寒暄語
    function_cn: 习惯上比较固定的寒暄语及固定表达方式。
    formation: 独立使用的固定短语（如「お疲れ様です」「こんばんは」「たいしたもんだ」「いただきます」）。
    constraints:
    - 属语用/交际固定表达，非语法句型。
    contrasts: []
  pragmatics:
  - 探视时先以顺路、非特意前来等说法减轻对方负担
  - 对病人使用保重、休息、不要硬撑等关心表达
  - 日本探病送剪好的鲜花而非盆栽的文化习惯
  - 「いや」与「いいえ」的礼貌度与性别使用差异
  - 自谦表达用于回应称赞与感谢
  - 遠慮なく可加ご变为尊他表达
  - 惯用语的比喻义与拟人化用法
