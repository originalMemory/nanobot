  - 强调否定
  - 话题转换/提起新话题
  - 向对方确认并估计其同意
  - 邀请/提议一起做某事
  - 礼貌地提出建议或推荐
  - 思考、犹豫时的随声应答
  - 表示惊讶/难以置信（名词重复+?!）
  - 按人计量食物份数（～人前）
  - 味觉/口感描写
  - 用疑问句引发思考而非直接陈述
  - 用「決して～ない」强调否定判断
  grammar:
  - pattern: こっち／そっち／あっち／どっち
    function_cn: 表示方向；本课因让对方来自己所在方向用「こっち」，指远离自己方向用「そっち」「あっち」
    formation: 指代词（近/中/远/疑问）
    constraints:
    - 礼貌语为「こちら」「そちら」，「こっち」「そっち」为其较随便说法
    contrasts:
    - 「こっち/そっち」与「こちら/そちら」的语体差异
  - pattern: やあ／ねえ／よし
    function_cn: 招呼、提议、认同或自言自语等交际用语
    formation: 感叹/招呼语
    constraints:
    - 「やあ」用于遇见朋友打招呼，多为男性使用（有时用「よう」）
    - 「ねえ」用于提议，多见于关系密切者，女性较常用，可重复为「ねえねえ」
    - 「よし」表示认同对方所说或当场做决定，男性常用，也可作自言自语
    - 对关系不密切者改用「あのう」等表达
    contrasts:
    - 「やあ」「ねえ」「よし」在性别、关系密切度与交际功能上的差异
  - pattern: ～そうだ／～ようだ
    function_cn: 由样子判断内容：「～そうだ」表样态/印象，「～ようだ」表基于征兆的推测
    formation: 形容词/动词连体形＋そうだ；～ようだ
    constraints:
    - 「～そうだ」可表外表看上去的样子及对将发生之事的印象
    - 「～ようだ」用于对基本不清楚之事从征兆推测真相
    contrasts:
    - 「～そうだ」与「～ようだ」在样态与推测上的易混区别
  - pattern: 元気そうね
    function_cn: 口语中省略「そうだね」「そうだよ」的「だ」；「～わ」「～わね」「～だわ」「～かしら」属女性用语，「～かい」「～かね」一般限于男性使用。
    formation: 形容词/形容动词连用形＋そう＋ね/よ（省略だ）
    constraints:
    - 女性用语倾向
    - 口语
    contrasts:
    - ～わ/～わね/～だわ/～かしら（女性）
    - ～かい/～かね（男性）
  - pattern: ちっとも～ない
    function_cn: 与否定搭配，强调否定语气；仅用于较随意口语。
    formation: ちっとも＋否定形
    constraints:
    - 仅口语
    - 必须接否定
    contrasts:
    - 少しも～ない
    - 全然～ない
    - 全く～ない（可用于书面语）
  - pattern: それはそうと
    function_cn: 结束此前谈话、提起新话题或转换话题谈突然想起的事；主要用于口语。
    formation: 固定表达
    constraints:
    - 口语
    contrasts: []
  - pattern: ～でしょ
    function_cn: 向对方确认某事，比「～でしょう？」随意；句尾读升调用于估计对方会同意时的询问。
    formation: 动词/形容词/名词＋でしょ
    constraints:
    - 口语
    - 升调表估计对方同意
    contrasts:
    - ～だろう
    - ～だろ（主要为男性用语，女性很少使用）
  - pattern: ～ましょうよ
    function_cn: 邀请对方一起做某事，句尾「よ」带积极推进某事的语气，句尾读降调
    formation: 动词ます形去ます＋ましょう＋よ
    constraints:
    - 用于邀请/提议，含说话人希望积极推进的语气
    contrasts: []
  - pattern: そうだなあ
    function_cn: 「そうですね…」的较随便说法，用于不能立刻回答、边思考边随声应答；后续「なあ」形式含自言自语语气
    formation: そう＋だ＋なあ
    constraints:
    - 用于思考、犹豫或自言自语的应答
    contrasts:
    - そうですね…（较正式）
  - pattern: ～でしたら
    function_cn: 「～だったら」的礼貌表达，后常接「～がいい」「～をすすめます」等推荐/建议表达
    formation: 名词/动词た形＋でしたら
    constraints:
    - 用于服务/礼貌场合对客人提出建议
    contrasts:
    - ～だったら（较随意）
  - pattern: ～人前
    function_cn: 表示分给一个人的“量”（份数），与汉语“～份儿”相近但日语用“皿”等单位表示；可接数字+人前表示份数。
    formation: 数字 + 人前
    constraints:
    - 用于表示按人计量的食物份数，区别于按容器（皿/碗）计量的表达。
    contrasts:
    - 与汉语“份儿”有时仅表示“一盘/一碗”的用法不同，日语“人前”明确以人为计量单位。
  - pattern: 名词重复 + ?!
    function_cn: 对所见所闻出乎意料而吃惊时，重复对话中的名词并以名词直接终止句子，表示惊讶/难以置信；特别强调时声调变化幅度较大。
    formation: （前文名词）+ ?!
    constraints:
    - 用于惊讶、意外的语用场景，非疑问句。
    contrasts: []
  - pattern: 味道/口感形容词词汇主题
    function_cn: 描述食物味道的形容词集合（酸甜、咸甜、咸、酸、醇厚、清淡、油腻、油、芳香、鲜嫩多汁、味涩等），用于味觉表达。
    formation: 形容词（い形容词为主）
    constraints:
    - 属词汇主题而非句型，用于味觉描写。
    contrasts: []
  - pattern: これもまた（～もまた）
    function_cn: 在已述事物基础上追加同类事物，表示“这也同样……”；由助词「も」与「また」组合构成。
    formation: 名词/名词短语 + もまた + 述语
    constraints:
    - 用于前文已列举或叙述某类事物后，补充说明另一同类对象也具备相同性质。
    contrasts: []
  - pattern: 席に着く
    function_cn: 表示走向自己的座位坐下，含“为做某事而落座”之意；用于就餐、上课、开会、乘坐交通工具等场合。
    formation: 动词短语（他动/自动搭配「着く」）
    constraints:
    - 强调落座这一动作及其目的性。
    contrasts:
    - 「席に座る」仅单纯表示坐在座位上；「着席する」多用于典礼等公开场合。
  - pattern: おしぼり
    function_cn: 指饭店等供客人擦手擦脸的湿巾；可区分布制与一次性，并按季节提供冷/热两种。
    formation: 名词
    constraints: []
    contrasts: []
  - pattern: 助词「で」（名词+で）
    function_cn: 表示某种状况的助词「で」修饰主体动作的状况；“名词+で”可表示动作进行的场所、手段/工具/材料等。
    formation: 名词 + で + 动词
    constraints:
    - 本条为对助词「で」多种用法的复习小结。
    contrasts: []
  - pattern: 名词＋で
    function_cn: 表示原因或理由、主体或对象的状况、数量单位的集合、限定范围等多种用法
    formation: 名词直接接「で」
    constraints:
    - 原因/理由：如因病、因违法、因股票等
    - 主体或对象状况：如一人、免费、穿凉鞋、交白卷等状态
    - 数量单位集合：如『5個で100円』『3人で1組』
    - 限定范围：如『この辺りで』『世界で』『3時間で』
    contrasts: []
  - pattern: ～ことから
    function_cn: 说明事由，所表示的因果关系是说话人自己认为的或是一般看法（区别于他人认定的因果）
    formation: 名词／小句＋ことから
    constraints:
    - 用于陈述感冒等事由时，表示说话人自身或一般看法的因果
    - 有时可替换为「～ところから」
    contrasts:
    - 与表示他人认定因果的用法区分
  - pattern: ～によって
    function_cn: 表示原因（拓展项）
    formation: 名词＋によって
    constraints: []
    contrasts: []
  - pattern: ～ために／～ための／～ゆえに／～ゆえの
    function_cn: 表示原因（拓展项）
    formation: 「～ために」可用『名词＋のために』与『小句（简体形式）＋ために』两种形式
    constraints:
    - 「～ために」接续受名词/小句限制
    contrasts: []
  - pattern: ～ゆえ / ～ゆえの
    function_cn: 表示原因（因～原因引起/导致），书面语，口语中不用
    formation: 直接接名词，不能前接动词等谓语；与「～ため」意思相同但接续受限
    constraints:
    - 「名词＋ゆえの」＝「名词＋のための」
    - 与「～ため」对比：～ため可接动词等，～ゆえ仅接名词
    contrasts:
    - ～ため
  - pattern: ～だろうか
    function_cn: 疑问/推测，用于提出问题或自问，引发读者思考
    formation: 接在句子后表疑问
    constraints:
    - 语用功能：不立即解释而作为问题提出，加深印象
    contrasts: []
  - pattern: 決して～ない
    function_cn: 强调否定，意为“绝对不是这样”“绝对不那样做”
    formation: 副词「決して」与后面的否定表达搭配使用
    constraints:
    - 表示否定的判断，一般不用于观察事实
    contrasts: []
  - pattern: 好物
    function_cn: 词汇：通常指喜欢吃的或喝的东西
    formation: 名词；非常喜欢时用「大好物」
    constraints:
    - 与「好きなもの（喜欢的东西）」对比：后者所指对象范围更广，不限于吃喝方面
    contrasts:
    - 好きなもの
    - 大好物
  pragmatics:
  - 敬语/礼貌表达（いらっしゃいませ、お会計をお願いします、ありがとうございます 等）
  - AA制（お割り勘）与请客（おごる）的语用区分
  - 性别与关系密切度对招呼语选择的影响
  - 礼貌语与随便语的语体区分
  - 女性用语与男性用语的区分（～わ/～かしら 对 ～かい/～かね；～でしょ 对 ～だろ）
  - 口语与书面语的使用界限（ちっとも～ない 仅口语）
  - 「～ましょうよ」句尾读降调以体现积极推进语气
  - 「～でしたら」用于饭店服务员对客人的礼貌表达
  - 名词重复+?! 在特别强调时声调变化幅度较大，属语用强调手段。
  - 「～ゆえ」为书面语，口语中不用
  - 「決して～ない」一般不用于观察事实
