  communication_functions: []
  grammar:
  - pattern: ～に～を重ねる
    function_cn: 反复做某事、为完成某事而反复努力
    formation: サ变动词词干＋に＋同一词干＋を重ねる
    constraints:
    - 前后使用同一サ变动词词干
    - 后接该行为所造成的结果
    contrasts: []
  - pattern: ～を誇る
    function_cn: 以……为荣、强调拥有某种长处
    formation: 名词＋を誇る
    constraints:
    - 名词为向他人夸示的具体内容
    - 可用～という／～の修饰
    contrasts: []
  - pattern: ～をめぐる
    function_cn: 以……为中心、与……相关联
    formation: 名词＋をめぐる（接名词时用～をめぐる～）
    constraints: []
    contrasts: []
  - pattern: 注目を浴びる
    function_cn: 引人注目、短时间大量接受（目光/批评等）
    formation: 注目／批判＋を浴びる；～から注目を浴びる
    constraints: []
    contrasts: []
  - pattern: 敬称的省略（～さん／～先生／～氏 的取舍）
    function_cn: 对无直接关系的著名演艺、体育界人士或历史人物不用敬称，用「谷村新司が～」形式；对在职官员或著名学者在姓名后加官称（知事、総理、教授）或「さん」，否则含轻蔑意味；对关系亲近者有时用「～先生」。
    formation: 人名＋敬称/官称 的语用规则
    constraints:
    - 一般不用敬语
    - 不加官称/さん 时含轻蔑意味
    contrasts:
    - 无直接关系者 vs 在职官员/著名学者 vs 关系亲近者
  - pattern: 世に送り出す
    function_cn: ①学校等机构向社会输送毕业生；②向社会奉献出好作品。
    formation: 「世に」可替换为「社会」「実業界」「学界」等；常以「多くの卒業生を世に送り出す」复数形式用于介绍学校传统。
    constraints:
    - 搭配「卒業生を輩出する」等同义表达
    contrasts:
    - ①输送毕业生 vs ②奉献作品
  - pattern: ～を不動のものにする
    function_cn: 「不動」含“已经不可动摇”的积极意义；「その名を不動のものにする」意为博得好评价、成为名人。
    formation: 与「不動」搭配的名词除「名」外，常见「地位」「勝利」「人気」等。
    constraints:
    - 用于积极意义
    contrasts: []
  - pattern: ～はもとより
    function_cn: 列举事项时先举理所当然者再推而广之，表示列举、例示；书面语。
    formation: 名词/动词等 + はもとより
    constraints:
    - 与「～をはじめ」（中级第21课）、「～はもちろんです」（中级第25课）区分：前者表众多事物中的代表，后者含不容置疑之意。
    contrasts:
    - ～をはじめ
    - ～はもちろんです
  - pattern: ～に及ぶ
    function_cn: 谈到事态影响及程度之大时使用，主要用在数字后面，有时用于广度、大小等具体内容。
    formation: 名词/数字 + に及ぶ
    constraints:
    - 多接于数字或表示范围、程度之后。
    contrasts: []
  - pattern: ～に焦点を当てる
    function_cn: 把……作为焦点（人们的关心、注意点）。
    formation: 名词 + に焦点を当てる
    constraints:
    - 反义表达：焦点がぼやける（焦点模糊）、焦点がずれる（焦点错位）。
    contrasts:
    - 焦点がぼやける
    - 焦点がずれる
  - pattern: ～ならでは～
    function_cn: 表示“非它不可的……”“唯有……才……”；接否定形～ならでは～ない时表“除非……不……”
    formation: 名词＋ならでは～；名词＋ならでは～ない
    constraints: []
    contrasts: []
  - pattern: 姿を現す
    function_cn: 人或物显现出来；现原形
    formation: 惯用表达，常与“正体を現す”等并列
    constraints: []
    contrasts: []
  - pattern: 思わず
    function_cn: 情不自禁、不知不觉地
    formation: 副词性用法，修饰动词
    constraints: []
    contrasts: []
  - pattern: 驚きの声を上げる
    function_cn: 发出惊呼声；～の声进行常与惊奇、高兴等感情色彩词共现
    formation: 名词（感情）＋の声＋を上げる
    constraints: []
    contrasts: []
  - pattern: 果たして～だろうか
    function_cn: 与疑问表达呼应，表示强烈的质疑
    formation: 果たして＋～だろうか
    constraints: []
    contrasts: []
  - pattern: ～と化する
    function_cn: 表示发生某些变化，属较古老说法，多用于与以前状态相比发生很大变化
    formation: 动词た形＋と化する
    constraints:
    - 用于描述状态由前到后的显著转变
    contrasts: []
  - pattern: ～ずくめ
    function_cn: 表示类似情况有很多、没有例外，用于有特点或不一般的场合
    formation: 名词＋ずくめ（だ）
    constraints:
    - 强调整体由同类事物构成、毫无例外
    contrasts: []
