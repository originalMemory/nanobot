  grammar:
  - pattern: 礼貌请求的语用结构
    function_cn: 请求别人做某事时，先打招呼/致歉，再陈述理由或铺垫，最后提出请求，避免单刀直入
    formation: 打招呼·问候 → 陈述理由或铺垫 → 提出请求
    constraints:
    - 尚未开始交谈时需先打招呼；已在交谈中则无需再打招呼
    - 请求前用铺垫语让对方有心理准备
    contrasts: []
  - pattern: ～てくれますか／～ていただけますか／～てくださいませんか／～てもらえませんか／～ていただけませんか
    function_cn: 以请求表达方式询问对方意向，礼貌地请对方做某事
    formation: 动词て形＋くれますか／いただけますか／くださいませんか／もらえませんか／いただけませんか
    constraints:
    - 语气由较随意到较客气分层，用于请求对方做某事
    - 含应答应允的语气的说法用于较客气场合
    contrasts:
    - ～ていただけませんか 比 ～ていただけますか 更含应答应允语气
    - 否定疑问句形式（～ていただけないでしょうか）便于对方拒绝，更委婉
  - pattern: ～ていただければありがたい
    function_cn: 在更为礼貌郑重的场合表达请求
    formation: 动词て形＋いただければありがたい
    constraints:
    - 用于比 ～ていただけますか 更郑重礼貌的场合
    contrasts: []
  - pattern: ～ていただけばありがたいのですが…／よろしくお願いします／よろしくお願いいたします
    function_cn: 礼貌地提出请求，结尾追加恳请语以缓和语气
    formation: 动词て形＋いただけばありがたいのですが…；句末接よろしくお願いします／よろしくお願いいたします
    constraints:
    - 用于希望对方接受自己请求的场合，常在最后再说一次恳请语
    contrasts: []
  - pattern: ～てくれない？／～て頼んでいい？
    function_cn: 礼貌程度较低的请求，带疑问语气
    formation: 动词て形＋くれない？／动词て形＋頼んでいい？
    constraints:
    - 用于关系密切、无需过于客气的人
    contrasts: []
  - pattern: （すまないけど，）～てちょうだい
    function_cn: 委婉的命令，倾向表示对方本来就该这么做
    formation: （すまないけど，）＋动词て形＋ちょうだい
    constraints:
    - 用于关系密切的人，语气较随意
    contrasts: []
  - pattern: 敬体／平体（うん代替はい；どうしたの；何だい；君）
    function_cn: 关系密切者之间的措辞规则：可用平体，用“うん”代替“はい”，“どうしたの”比“どうしたんだ”柔和；“何だい”为疑问词＋だ＋い的男性用语；“君”用于关系密切者，对尊长使用不礼貌
    formation: 平体句末；疑问词＋だ＋い；称呼“君”
    constraints:
    - 关系密切者之间一般不用敬体，但为保持距离有时用敬体
    - “何だい”“君”主要为男性用语，年轻人近年很少使用“何だい”
    - 对尊长使用“君”会很不礼貌，需特别注意
    contrasts:
    - どうしたの（柔和） vs どうしたんだ（含责备语气）
  - pattern: 折り入って／実は
    function_cn: 铺垫性词语，用于诚心诚意提出重大恳求或秘密之前，提示接下来内容重要
    formation: 副词性表达，置于请求句前（如 折り入ってお願いしたいことがある／折り入ってお話したいのですが）
    constraints:
    - 听话人据此可推测接下来内容非常重要
    contrasts: []
  - pattern: 改まって
    function_cn: 形容语言、态度与平时不同而认真规矩，也可形容着装；多用于「改まって」或「改まった＋名词」形式，表示郑重其事。
    formation: 改まって／改まった＋名词
    constraints: []
    contrasts: []
  - pattern: 思まして
    function_cn: 用「て形」把话说一半，表现说话人提出请求理由时有所顾虑的心情；需读降调。
    formation: 动词て形＋思まして
    constraints:
    - 读降调
    contrasts: []
  - pattern: 引き受けるか
    function_cn: 助词「か」用于句尾表示当场确定态度，意为正在犹豫是否接受、现确定接受；可自言自语，非询问对方。
    formation: 动词＋か
    constraints:
    - 多用于上级对下级或自言自语
    contrasts:
    - 与「なるほど」用法相同，确认本人决定，句尾读降调
  - pattern: もしかして
    function_cn: 用于不能确定但认为应该是那样，或提出疑问等场合，表示推测。
    formation: もしかして＋疑问句
    constraints:
    - 常与否定或疑问搭配，表达说话人带有不确定性的猜测
    contrasts:
    - 与「もしかすると」「もしかしたら」近似，但后两者少用于疑问句
  - pattern: どうしても～ない
    function_cn: 表示尽管采用了各种各样的方法还是不能做成某事
    formation: “どうしても”与否定形“～ない”搭配使用
    constraints:
    - 必须与否定形式连用，强调主观努力后仍无法实现
    contrasts: []
  - pattern: ～てくれることになりました
    function_cn: 表示受益的“～てくれる”与表决定的“～ことになりました”组合，含感激之情及受多种因素影响才作出决定的语气
    formation: 动词て形＋くれる＋ことになりました
    constraints:
    - 用于表达对方为自己做某事已确定，含感谢与受外部因素影响的语感
    - 区别于单纯用“～します”，后者给人仅凭自己意愿决定的印象
    contrasts:
    - ～てくれる（受益）
    - ～ことになりました（决定）
  - pattern: 出会う
    function_cn: 表示偶然遇见，可用于人或事物，表示了解到某事物的存在；含“会面”之意
    formation: 动词，有名词形“出会い”
    constraints:
    - 强调偶然性，对象可为人或物
    contrasts:
    - “会う”无名词形式，而“出会う”有名词形“出会い”
  - pattern: 思い出の場所
    function_cn: 指与以前经历有关系、能够唤起回忆的地方，即令人怀念的事情发生的场所
    formation: 名词短语，可作定语修饰“場所”
    constraints:
    - 强调该场所与个人过往经历及回忆的关联
    contrasts: []
  - pattern: ～一方だ
    function_cn: 表示朝着一个方向不断发展
    formation: 动词基本形＋一方だ
    constraints:
    - 可用于好的或坏的变化方向
    contrasts:
    - 与「～ばかりだ」相比，「～一方だ」可用于好的事情，「～ばかりだ」通常用于不好的事情
  - pattern: ～ばかりだ
    function_cn: 表示变化不断发展，通常用于不好的事情
    formation: 动词基本形＋ばかりだ
    constraints:
    - 多用于负面变化
    contrasts:
    - 与「～一方だ」意思相似，但语用倾向不同
  - pattern: ～の一途をたどる
    function_cn: 表示沿着某条线一直前进（书面语）
    formation: 三类动词的汉字部分＋の一途をたどる
    constraints:
    - 书面语
    contrasts:
    - 与「动词基本形＋一方だ」意思相同
  - pattern: ～始めている
    function_cn: 表示现在也处于开始某变化的状态
    formation: 动词て形＋始めている
    constraints:
    - 表示变化发生后一直在持续
    contrasts:
    - 「～始めた」表示过去某时刻开始；「～た」表示变化完成后的结果
  - pattern: ～には～がある
    function_cn: 指出存在某种因素；B 取“背景／原因／長所／短所”等名词，C 取表示情况的名词
    formation: A の B には C がある；可改写为 A の B には C ということがある
    constraints:
    - 与「A の背景は C だ」（背景限定为 C）及「A の背景に C がある」（除 C 外还有其他背景）语用范围不同
    contrasts:
    - 「～は C だ」限定 vs 「～に C がある」非限定
  - pattern: ～に対する～
    function_cn: 表示动作、感情、态度所针对的对象；A 为对象，B 为动作／感情／态度
    formation: A に対する B；后续名词用「～に対しての＋名词」，后续谓语用「～に対して＋谓语」
    constraints:
    - 通常可替换表示对象的助词「に」，但很少能替换「を」
    - 后续名词时常用「～に対する＋名词」表达「～を」的语意关系
    contrasts:
    - 「～に対する」与助词「に」「を」的可替换性差异
  - pattern: ～に対して / ～にとって / ～について
    function_cn: 三者均表对象，但语用不同：～に対して与～にとって可表“对（于）～”，～にとって侧重“从那个角度来看”；～について表“关于～／就～”，后多接理性词语（如提意见、陈述意见）。
    formation: 名词＋に対して／にとって／について
    constraints:
    - ～に対して用于对某人/某事采取态度或行为（如使用礼貌语言）
    - ～にとって用于从该对象立场/角度评价
    - ～について用于提示话题内容，后接理性表达
    contrasts:
    - ～に対して vs ～にとって vs ～について 的对象/角度/话题区分
  - pattern: 年々（及重复符号「々」）
    function_cn: 「々」重复前一字，读作ねんねん，表“每经过一年就出现那样状态”，与毎年、年ごとに同义；后字可浊音化（如日々、月々）。
    formation: 名词（年/日/月等）＋々
    constraints:
    - 重复读前字，读音随前字变化
    - 表逐年/逐日/逐月递进变化
    contrasts:
    - 年々 vs 毎年 vs 年ごとに
  - pattern: ～ており（～ております）
    function_cn: ～ていて的郑重说法，多用于书面语；当动词为～ています时，需改为～ており再连接后句。
    formation: 动词て形＋おり（＋ます）
    constraints:
    - 用于书面语/郑重语体
    - 替代～ていて连接后续句子
    contrasts:
    - ～ており vs ～ていて
  - pattern: ～わけがない
    function_cn: 表“没有理由那样考虑”，强烈否定；わけ表理由。
    formation: 动词/形容词否定或肯定形＋わけがない
    constraints:
    - 语气强烈，表逻辑上不可能/不应如此
    contrasts:
    - ～わけがない vs ～はずがない（后者基于逻辑依据得出结论，语气相对）
  - pattern: ～わけはない／～はずはない
    function_cn: 表示从逻辑上考虑没有那样的可能性，语气强烈，与用“が”的否定说法含义相同
    formation: 名词／形容词／动词连体形＋わけはない／はずはない
    constraints:
    - 表达强烈否定语气，强调逻辑上不可能
    contrasts:
    - 与～わけではない形式相似但语气不同：～わけはない为强烈否定，～わけではない为对推定内容的否定
  - pattern: ～わけではない
    function_cn: 对从某前提推定出来的内容进行否定，语气较缓和
    formation: 名词／形容词／动词连体形＋わけではない
    constraints:
    - 用于否定由前文推定得出的结论，而非绝对否定
    contrasts:
    - 与～わけはない易混：后者为强烈否定，前者为对推定的否定
  - pattern: ～までには
    function_cn: 表示某种行为、事情发生或完成的期限；加助词“は”后与后面分句有区别含义，用于表示在特定时刻发生某种行为；含“至少在……之前”的最低条件含义
    formation: 动词连体形／名词＋までには
    constraints:
    - 与～までに基本相同，但加“は”后强调期限内的特定行为或最低条件
    contrasts:
    - 与～までに相比，～までには带有“少なくとも～までには”的最低条件含义
  pragmatics:
  - 上司への丁寧な依頼（お忙しいところ申し訳ありませんが／折り返してお願いしたいことがあるんですが）
  - 依頼の受諾（引き受けるか）
  - 感謝（ありがとうございます）
  - 请求时需注意措辞与神情举止，给对方留下礼貌印象
  - 根据人际关系及具体事情选择客气程度不同的说法
  - 使用便于对方拒绝的否定疑问句或只说一半的表达以减轻对方负担
  - 敬体与平体的关系距离选择
  - 男性用语与对尊长的称呼禁忌
  - 「思まして」需读降调以表现顾虑
  - 「引き受けるか」句尾读降调，表示确认本人决定
  - 「思まして」之后对方回应可用升调表示惊讶确认
