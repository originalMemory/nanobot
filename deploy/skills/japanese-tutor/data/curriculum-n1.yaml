  similar_contrasts:
  - 与“今”“現在”相比，后者仅表“现在”，前者含变化可能语气
  - 与～はずです在表示不确定上相似，但～はず表示逻辑上存在那样认为的理由，～見込み则客观陈述某种可能性很高
  - 与表示范围的“で”后续对比的“は”构成的“では”用法相同
  - そういえば
  - 自动词表自身变化（高くなる）
  - 他动词表使变化（高くする）
  - 与“全く～ない”（完全否定）相对，本句型可表部分否定
  - 与“ええと”区别：后者表示已想到答案、正考虑如何组织表达
  - 「あめ」雨 vs 飴
  - 「はし」橋 vs 箸
  - 「こうそく」高速 vs 拘束 vs 校則 vs 光速
  - 与“～そうだ”在句尾传闻用法上相同
  - 与“～向き”意思大致相同但使用上有微妙差异：“～向き”表示一开始并未特意设定目标对象，但从结果来看被限定在某些对象范围；“～向き”由动词“向きます”衍化而来，句尾用“～向きです”，后续名词用“向きの～”
  - ～に関して（可换说成“～について”，但较不郑重）
  - ～(の)ほか（单纯补充）
  - ～ほかに（仅表'此外还有'的单纯补充）
  - “その後”（较长时间、书面）与“そのあと”（短时间、口语）
  - 次々に（较口语）
