  grammar:
  - pattern: ～つもりです
    function_cn: 表示说话人自己的打算、计划（主观意图）
    formation: 动词辞书形 / 动词ます形去ます / 形容词・形容动词词干 + つもりです
    constraints:
    - 主语通常为第一人称，表示本人意图
    - 用于尚未实现的将来计划
    contrasts:
    - 与「～ことにしました」（已做出决定）相比，「つもり」更强调主观打算
  - pattern: ～ことにしました
    function_cn: 表示自己经过考虑后决定做某事
    formation: 动词辞书形 + ことにしました
    constraints:
    - 强调决定这一动作由说话人做出
    contrasts:
    - 与「～ことになりました」相比，前者为主动决定，后者为经商量或客观形成
  - pattern: ～ことになりました
    function_cn: 表示经商量、安排或客观情况而成为/决定某事
    formation: 动词辞书形 + ことになりました
    constraints:
    - 多用于他人决定、双方约定或客观结果
    contrasts:
    - 与「～ことにしました」相对，主语常非第一人称主动意志
  - pattern: ～そうです
    function_cn: 表示传闻、听说（转述他人信息）
    formation: 动词辞书形 / 形容词・形容动词词干 + そうです
    constraints:
    - 此处为传闻用法，非推测义「～そうだ」
    contrasts:
    - 传闻「～そうです」与推测「～そうだ」形式相同但语义不同，需依语境区分
  - pattern: 動詞（基本形／ない形）＋つもりです
    function_cn: 表示说话之前已经形成的意志、打算
    formation: 接动词基本形或ない形
    constraints:
    - 与“动词意志形＋と思っています”意思相同
    - 对长辈或上级用“～つもりですか”直接提问不太礼貌
    - “～ようと思います”和“～ようと思っています”也不可用于向长辈或上级提问
    contrasts:
    - 动词意志形＋と思っています
  - pattern: 動詞（基本形／ない形）＋ことにします／ことにしました
    function_cn: 表示说话人自己决定实施某种行为
    formation: 接动词基本形或ない形
    constraints:
    - 其中的“こと”不能用“の”来代替
    contrasts:
    - ～ことになりました
  - pattern: 動詞（基本形／ない形）＋ことになりました
    function_cn: 表示由于某种外在的原因导致形成了某种决定
    formation: 接动词基本形或ない形
    constraints:
    - 其中的“こと”不能用“の”来代替
    - 也可用于婉转地表述根据自己的意志决定的事情
    contrasts:
    - ～ことにします
  - pattern: 小句（简体形）＋そうです
    function_cn: 传闻：表示某信息非源于说话人直接感知，而是从他人处听到；提示消息来源时用「～によると」
    formation: 接小句简体形（形容词、动词、な形容词、い形容词等简体）
    constraints:
    - 没有过去、否定和疑问的形式
    - 否定表达用「～ではないそうです」，不可用「～そうではありません」
    contrasts:
    - 与直接感知/推测的「～そうだ」区分，此处为传闻义
  - pattern: 今度
    function_cn: 时间副词，语义范围比汉语“这次”广，可指说话时间之后的某次（相当于“下次”），如“今度の日曜日”指之后的星期天。
    formation: 副词，修饰名词或句子
    constraints: []
    contrasts:
    - 与汉语“这次”语义范围不同
  - pattern: ずっと
    function_cn: 副词，表示在某一期限内动作、状态一直持续（如“连休期间一直～”）。
    formation: 接在动词/形容词连体形或名词前，常与“～中”“～から”搭配
    constraints:
    - 与第12课表示程度差异很大的“ずっと”区分
    contrasts:
    - 程度差异用法 vs 期间持续用法
  - pattern: ～がある（メール／電話／手紙／ファックス）
    function_cn: 表示收到邮件、电话、信件、传真等（“～があった”为过去式）。
    formation: 名词＋がある／があった
    constraints:
    - 用于表示收到对方发来的信息
    contrasts: []
  - pattern: お邪魔します／お邪魔しました
    function_cn: 拜访寒暄：进门时说“お邪魔します（打扰您了）”，告辞时说“お邪魔しました（打扰您了）”。
    formation: 敬语表达，用于到别人家拜访场景
    constraints:
    - 原意“妨碍别人做某事”，此处为拜访客套话
    contrasts: []
  - pattern: ～てほしい
    function_cn: 表示对他人愿望，即希望别人去做某事
    formation: 动词て形＋ほしい
    constraints:
    - 礼貌程度较低，不能对长辈或上级直接使用
    - 与表示说话人自己想做某事的～たい相区分
    contrasts:
    - ～たい（自身愿望）
  - pattern: ～って
    function_cn: 表示传闻、引用，是“～と言います”“～と思います”中“～と”以及“～という人は”等的缩略形式
    formation: 引用内容＋って
    constraints:
    - 用于很随便的对话
    - 促音脱落现象：前接以ん结尾的音节时发～んって较困难，脱落为～って（如 太田さん→太田さんって）
    - 何と言いますか 的缩略 何て言いますか 基于同样理由
    contrasts:
    - ～と言います／～と思います（完整引用形式）
  pragmatics:
  - 对长辈或上级避免用“～つもりですか”“～ようと思います”“～ようと思っています”直接提问
  - お邪魔します/しました 用于拜访别人家时的进门与告辞礼貌表达
  - ～てほしい 的敬语层级限制（不可对长辈/上级）
  - ～って 的口语随意语域
  - 办公室同事间半正式对话，使用です/ます体
  - 通过「〜そうです」「〜そうですよ」转述邮件与预报信息
  - 职场上下级间的关心与致谢（課長／鈴木）
  - 同事间探望病人的邀请与婉拒（佐々木／王）
  - 病人对探望者的告知与感谢（鈴木／王）
