  grammar:
  - pattern: 他动词的被动形（受身形）「～られる／～れる／～される」
    function_cn: 表示主语承受某动作；常用「に」引出施事者，多含不愉快、受害或受影响的语感
    formation: 五段动词词干 u 段→a 段＋れる；一段动词去「る」＋れる；サ变动词＋される；カ变动词＋かれる
    constraints:
    - 施事者用助词「に」标记
    - 他动词被动后常保留原宾语（用「を」）
    contrasts:
    - 与自动词/自然现象被动区分
  - pattern: 自然现象的被动（自然被动）
    function_cn: 表示受天气、自然现象等影响而处于不利状态
    formation: 自然现象名词＋に＋动词被动形（如「雨に降られて」）
    constraints:
    - 主语通常为受影响的人
    contrasts:
    - 与一般他动词被动语感相近，但施事为自然现象
  - pattern: 「～によって」表示被动施事者
    function_cn: 在被动句中引出动作的执行者，多用于书面语及设计、创作、制作等语境
    formation: 名词＋によって＋动词被动形
    constraints:
    - 常用于较正式或客观叙述
    contrasts:
    - 与口语中用「に」引出施事者相比更书面
  - pattern: 被动形式（被动态）
    function_cn: 表示主语的人或事物承受某种动作或影响
    formation: 一类动词：ない形去『ない』加『れる』；二类动词：ない形去『ない』加『られる』；三类动词：『来る』→『こられる』、『する』→『される』
    constraints:
    - 『（ら）れます』的活用方式与二类动词相同
    contrasts: []
  - pattern: 名は（名に）動（ら）れます
    function_cn: 被动句：动作对象作主语，动作主体用助词『に』表示
    formation: 主语（动作对象）＋は＋动作主体＋に＋动词被动形
    constraints:
    - 表示受益时通常改用『～てもらいます』形式，而非被动形
    contrasts:
    - 被动形『助けられました』为客观叙述、不表受益；『助けてもらいました』表示受益
  - pattern: 名は名に名を動（ら）れます
    function_cn: 物主做主语的被动句：某事物拥有者在被动句中作主语，该事物仍充当宾语，一般表示拥有者遭受某种麻烦或损失
    formation: 拥有者＋は＋动作主体＋に＋宾语（事物）＋を＋动词被动形
    constraints: []
    contrasts: []
  - pattern: 名は名に動(ら)れます
    function_cn: 受害被动：主语间接承受某事的影响（非直接承受动作）。
    formation: 他动词或自动词的被动形（～(ら)れます）；动作发出者用助词「に」提示。
    constraints:
    - 他动词与自动词均可用于此被动句。
    - 一般不具有否定形式。
    - 「に」前多为人或动物；也可用「雪」「雨」，但此时动词须为「降ります」。
    contrasts: []
  - pattern: 名が／は動(ら)れます
    function_cn: 以事物为主语的被动句，动作主体为某一不确定的人群。
    formation: 事物作主语（が／は），动词用被动形（～(ら)れます）。
    constraints:
    - 动作主体一般不在句中明确出现。
    contrasts: []
  - pattern: 名は名によって動(ら)れます
    function_cn: 事物主语被动句中动作主体为特定对象时的提示方式。
    formation: 特定动作主体用「によって」提示，动词用被动形（～(ら)れます）。
    constraints:
    - 「によって」不能用「に」替换。
    contrasts:
    - 与「名は名に動(ら)れます」区分：特定主体用「によって」，非特定/受害语境用「に」。
  - pattern: ～とも
    function_cn: 接在数量词后，表示该数量的全部（都）
    formation: 数量词 + とも
    constraints:
    - 数量词一般在10以内
    contrasts: []
  - pattern: いやぁ
    function_cn: 叹词，表示感到不好意思或情绪激动等
    formation: 独立使用
    constraints:
    - 主要为男性使用
    contrasts: []
  - pattern: 参りました
    function_cn: 用于遇到困难或麻烦而感到苦恼
    formation: 独立使用
    constraints: []
    contrasts: []
  - pattern: 巻き込まれて
    function_cn: 表示说话人被卷进某种不好的事情当中而受到了影响
    formation: 动词巻き込む的被动形式，前面消极事态用助词「に」表示
    constraints:
    - 多以被动形式使用
    contrasts: []
  - pattern: 正式的书面语
    function_cn: 写报告、文章时使用书面语，注意与口语在词汇和语法方面的区别
    formation: 文体层面规则
    constraints: []
    contrasts: []
  - pattern: 书面语词汇特征
    function_cn: 书面语多使用汉字词，对应口语中的固有词或常用表达
    formation: 汉字词 vs 口语固有词
    constraints:
    - 用于正式书面语
    - 公文、文章类文体
    contrasts:
    - 与口语词汇选择相对
  - pattern: 书面语句尾形式
    function_cn: 书面语一般用简体形，公文及名词、二类形容词用正规简体形「～である」
    formation: 简体形 / 正规简体形「～である」
    constraints:
    - 公文、正式书面语
    - 区别于口语「～ます」「～です」敬体
    contrasts:
    - 口语多用敬体「～ます」「～です」
  - pattern: 书面语句中停顿
    function_cn: 句内短暂停顿时，动词用「ます形」去「ます」，一类形容词用「～く」，二类形容词和名词用「～で」或「～であり」
    formation: 动词去「ます」形 / 一类形容词「～く」/ 二类形容词·名词「～で」「～であり」
    constraints:
    - 用于书面语
    - 区别于口语「て形」
    contrasts:
    - 口语用「て形」
  - pattern: 书面语助词
    function_cn: 书面语常用受古汉语影响形成的复合词，如口语「～まで」在书面语中作「～にいたる」
    formation: 复合助词（古汉语影响）
    constraints:
    - 用于书面语
    contrasts:
    - 口语用日语固有简单助词
  - pattern: 书面语被动形式
    function_cn: 书面语较频繁出现以事物为主语的被动句
    formation: 事物主语 + 被动形
    constraints:
    - 用于书面语
    contrasts:
    - 口语较少用事物作被动主语
  - pattern: 外来词使用
    function_cn: 外来词一部分由外语单词转写，一部分由两个外语词拼合；书面语中有意使用外来词可营造轻松、含蓄、新颖的语感，片假名书写夹杂于汉字·平假名中给人耳目一新印象
    formation: 片假名转写 / 外语词拼合
    constraints:
    - 用于特定表达效果
    - 书面语中有意使用
    contrasts:
    - 书面语通常多用汉字词和日语固有词
  pragmatics:
  - 被动形多用于表达不愉快或受害经历（被训、被咬、被雨淋）
  - 「いやぁ」主要为男性使用，用于感到不好意思或情绪激动等场合
  - 书信、电子邮件等写给特定个人的文章类文体，与口语一样使用「～です」「～ます」敬体形
