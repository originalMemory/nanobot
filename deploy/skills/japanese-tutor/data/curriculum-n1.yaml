  similar_contrasts:
  - 与 ～べき 相比语气较软，偏向建议而非义务。
  - 非做不可的行为用「～なければならない」
  - 「～はずだ」也表某种行为很妥当，但只表示说话人确信如此，不能用于劝说或愿望
  - 今から
  - これがいい
  - これでいい
  - 与「帰る」（指回家或回国）区分
  - 与「～のですね」语体更随便
  - 欲が深い（欲壑难填）
  - 欲張り（贪得无厌）
  - ～とすれば／～とすると／～としたら 同样表示假定条件，兼具陈述假定情况与陈述现实情况两种用法。
  - 汉语“一倍”与日语「2倍」可表同义，但日语无「1倍」
  - 用法与「さらに」相同
  - 吴音 vs 汉音 vs 唐宋音 的读音差异
  - 汉语词复合连浊 vs 外来词复合不连浊
