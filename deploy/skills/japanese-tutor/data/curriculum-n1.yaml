  grammar:
  - pattern: ～たら
    function_cn: 条件（如果……就……）
    formation: 动词た形＋ら；名词／い形容词＋なら；な形容词／副词＋なら
    constraints:
    - 表示假设条件，可指过去、现在或将来
    - 与「～ば」「～と」等条件表达在语感上有所区别
    contrasts:
    - ～ば
    - ～と
  - pattern: ～しか～ない
    function_cn: 限定范围（只、仅仅）
    formation: 数量词／名词＋しか＋否定谓语
    constraints:
    - 必须与否定形式搭配使用
    - 强调范围限定，常含不足或不满语气
    contrasts:
    - だけ
  - pattern: ～ても
    function_cn: 让步条件（即使……也……）
    formation: 动词て形／名词＋でも／い形容词＋くても／な形容词＋でも＋も
    constraints:
    - 表示假设让步，前项条件成立但后项结果不变
    contrasts:
    - ～たら
  - pattern: ～たい
    function_cn: 愿望（想要……）
    formation: 动词ます形去ます＋たい；名词＋が＋欲しい
    constraints:
    - 表达说话人主观愿望
    - 对他人愿望可用「～たいようです」等间接表达
    contrasts: []
  - pattern: ～ことができる
    function_cn: 能力／可能（能够……）
    formation: 动词字典形＋ことができる
    constraints:
    - 表示能力或客观可能
    - 与「～られる」在语感上略有差异
    contrasts:
    - ～られる
  - pattern: 小句1 たら，小句2
    function_cn: 表示假定条件（如果……就……）
    formation: 将动词/形容词/名词的过去形式中的“た”替换为“たら”；二类形容词与名词的过去否定“～ではなかった”后续时去掉“は”变为“～でなかったら”
    constraints:
    - 礼貌体中“～ます”“～です”后续时分别变为“～ましたら”“～でしたら”
    - 一类形容词后续“たら”时不使用敬体形（如“寒かったですら”为错误形式）
    contrasts: []
  - pattern: 小句1 ても，小句2
    function_cn: 表示让步/逆接，即“小句1”成立时“小句2”理应成立但事实上未成立，强调无论发生何事结果不变；也可用于已发生的情况
    formation: 将“て形”中的“て”“で”替换为“ても”“でも”
    constraints:
    - 除假定情况外，还可用于表示已经发生的情况
    contrasts: []
  - pattern: 名＋だけ
    function_cn: 限定，表示“这就是全部，不再有其他”
    formation: 名词后接「だけ」
    constraints:
    - 「だけ」后面的助词「が」「を」有时可省略
    contrasts:
    - 与「しか＋否定」意思基本相同，但「だけ」只表示客观限定
  - pattern: 名＋しか＋否定形式
    function_cn: 限定，表示“除了举出的一项外，其他都不是这样”
    formation: 名词后接「しか」，谓语用否定形式
    constraints:
    - 与数量词连用时，带有说话人主观觉得数量太少/不足的感情色彩
    contrasts:
    - 与「だけ＋肯定」相比，「しか～ない」带一定主观感情色彩，「だけ」为客观限定
  - pattern: 名＋でも
    function_cn: 提示极端例子，表示“即便如此，其结果也一样”
    formation: 名词后接「でも」
    constraints: []
    contrasts: []
  - pattern: 何かあった
    function_cn: 表示发生了某种事情（此处“あった”不表物体存在，而表事件发生）
    formation: 何か＋ある（过去形）
    constraints: []
    contrasts: []
  - pattern: あと～
    function_cn: 表示只要再有一点量即可完成某事或使某事态成立
    formation: あと＋数量词（如“少し”“1人”“1つ”“3日”等）
    constraints:
    - 除“少し”外还可接数量词
    contrasts: []
  - pattern: どの＋名词＋でも
    function_cn: 表示“哪家都/每家都”等，与“どこの＋名词＋でも”同义
    formation: どの＋表示事物的名词（如“会社”“果物”）＋でも
    constraints:
    - 指“人”时不用“×どの人も”而用“だれでも”
    - 指时间时不用“×どの時も”而用“いつでも”
    - 日语中无“×每家”“×每人”的说法
    contrasts:
    - どの＋名词＋でも vs だれでも（人）/ いつでも（时间）
  - pattern: ～のとおりに
    function_cn: 固定说法，表示“～那样”；“本のとおりに”意为“书上说的那样”
    formation: 名词＋の＋とおりに
    constraints: []
    contrasts: []
  - pattern: なかなか＋否定
    function_cn: 表示事态的发展并不如所期待的那样简单，或不能轻易实现；与否定形式呼应使用。
    formation: 副词「なかなか」修饰否定谓语（如～できない、～なりません）。
    constraints:
    - 须与否定形式呼应，不用于肯定句表达程度。
    contrasts:
    - 与第14课已学的表示程度的副词「なかなか」用法相衔接，本页补充其否定呼应用法。
  - pattern: だんだん＋变化表达
    function_cn: 表示事物逐渐发生变化，用于变化程度不显著的状况。
    formation: 常与「～なります」等表示变化的表达方式呼应使用。
    constraints:
    - 强调渐进、程度不显著的变化，而非突变。
    contrasts: []
  - pattern: 数量词＋は＋肯定
    function_cn: 助词「は」接在数量词后与肯定形式呼应时，表示该数量为最低限度（至少）。
    formation: 数量词（如 30 個、10 日）＋は＋肯定谓语。
    constraints:
    - 「は」在此起提示最低限度的作用，区别于一般主题提示。
    contrasts: []
  pragmatics:
  - 「～てください」用于礼貌请求
  - 「すみません」用于致歉与请求宽限
  - 第8条为文化/语用说明：日本住宅状况下邀请客人需收拾房间，主人招待时考虑客人需求（如续茶需先征询），进门脱鞋等习惯，并与中国待客方式对比。
