  similar_contrasts:
  - 与单纯“～てくれる”相比，加“よく”后感谢/感叹语气更明确
  - 比“遠慮しないで”更正式一些
  - 与敬体（です・ます）相对，条目式文体倾向用简体
  - ～だ（简体）vs ～である（书面正式）
  - ～であります vs ～です
  - 无敬体对应形式，区别于です・ます体系
  - ～こと（书面语）
  - ～時（可替换，较不正式）
  - 与“～てから～”近似但语感不同
  - 不用于“多い/大量”等大量表达
  - 「少しでも～ように」用于目的小句；「少しでも～ましょう／～してください」用于意愿、命令句。
