  grammar:
  - pattern: 名词＋が＋好きです
    function_cn: 表达喜好
    formation: 主题名词后用が提示所喜欢的对象，接形容词性谓语好きです
    constraints: []
    contrasts: []
  - pattern: 名词＋が＋分かります
    function_cn: 表示理解、掌握（语言等）
    formation: 对象名词后用が，接动词分かります
    constraints: []
    contrasts:
    - 与できます（能力）区分：分かります偏重理解/懂，できます偏重会做
  - pattern: 名词＋が＋できます
    function_cn: 表示能力、会做某事
    formation: 对象名词后用が，接动词できます
    constraints: []
    contrasts: []
  - pattern: 名词＋へ＋行きます
    function_cn: 表示移动方向、去某地
    formation: 目的地名词后接助词へ，接动词行きます
    constraints: []
    contrasts: []
  - pattern: 频度副词（よく／時々／たまに）
    function_cn: 表示动作发生的频率
    formation: 置于动词前作状语
    constraints: []
    contrasts:
    - よく（经常）＞時々（有时）＞たまに（偶尔）
  - pattern: 名1は 名2が 一類形／二類形 です
    function_cn: 表达情感（喜欢、讨厌、害怕等）
    formation: 情感主体（名1）用「は」，情感对象（名2）用「が」，后接表达情感的形容词（一類形／二類形）＋です
    constraints:
    - 适用于好き、嫌い、怖い等表达情感的形容词
    - 「名1」表示情感主体，「名2」表示情感对象
    contrasts: []
  - pattern: 名1は 名2が 分かります／できます
    function_cn: 表达能力（懂、会、擅长、不擅长等）
    formation: 主体（名1）用「は」，对象（名2）用「が」，后接能力相关动词ます形或形容词＋です
    constraints:
    - 适用于分かります、できます、上手です、下手です、苦手です等有关能力的词语
    contrasts: []
  - pattern: 名 や 名
    function_cn: 列举部分项目（相当于汉语“～呀～什么的”）
    formation: 助词「や」连接名词，常与「など」呼应构成「～や～など」
    constraints:
    - 「や」用于只列举许多项目中的部分项目
    contrasts:
    - 「と」用于列举所有项目，「や」用于列举部分项目
  - pattern: ～から ／ *だから
    function_cn: 说明原因、理由
    formation: 助词「から」接在陈述原因、理由的小句句尾，构成复句
    constraints:
    - 可先陈述原因再陈述结论，也可先陈述结论再说明原因
    - 「から」须接在表示原因、理由小句的句尾
    contrasts: []
  - pattern: だから／ですから
    function_cn: 表示原因、理由的连词，相当于汉语“所以”；接在结果句之前。礼貌说法为“ですから”。助词“から”构成原因小句的一部分，连词“だから”独立使用。
    formation: 原因小句 + だから／ですから + 结果句
    constraints:
    - 礼貌形为ですから
    contrasts:
    - 助词から（小句内）与连词だから（独立用于结果句前）的区别
  - pattern: 频率副词：いつも／よく／時々／たまに／あまり／全然
    function_cn: 表示动作或状态发生的频率，频率由高到低大致为：いつも＞よく＞時々＞たまに＞あまり～ません／全然～ません。
    formation: 副词置于谓语前修饰动词
    constraints:
    - “あまり”“全然”后面须接否定形式
    contrasts:
    - 肯定频率副词（いつも、よく、時々、たまに）与须接否定的副词（あまり、全然）的用法差异
  - pattern: '*どうしてですか'
    function_cn: 询问事由/原因，相当于汉语“为什么”。
    formation: 回答时在谓语后面加“から”说明原因
    constraints:
    - 回答用…から结构
    contrasts: []
  - pattern: ぼく
    function_cn: 男性对关系较密切的人自称时使用的第一人称代词；女性不用。
    formation: 独立代词，作主语时接「は」。
    constraints:
    - 仅限男性使用
    - 用于关系较密切的场合
    contrasts: []
  - pattern: '[场所]で [事件名词]が あります'
    function_cn: 表示在某处发生某事（如展览、联欢会、会议等事件名词）。
    formation: 场所名词＋で＋事件名词＋が＋あります。
    constraints:
    - 「物」替换为表示事件的名词
    - 场所用「で」表示
    contrasts:
    - 与第4课「[场所]に[物]が あります」相对，此处为事件发生而非物品存在
  - pattern: ～は どうですか／いかいですか
    function_cn: 向对方提出建议或推荐某物，征询意见，语气委婉、不强行。
    formation: 名词＋は＋どうですか／いかいですか。
    constraints:
    - 「いかいですか」为「どうですか」的礼貌表达，对长辈或上级使用
    contrasts:
    - 比直接说「これが いいですよ」更委婉
    - 拒绝时避免直接用「いいえ」，可用「今は 結構です」「さっき 飲みましたから…」等委婉表达
  - pattern: そうですね
    function_cn: 表示同意对方提议；也可用在疑问句后表示说话人在思考接下来要说的内容。
    formation: 独立表达，可接「…」「とても…です」等后续内容。
    constraints:
    - 前可加「うーん」表示在考虑怎样回答
    contrasts:
    - 与第7课表示同意的用法并列，此处扩展为思考停顿功能
  - pattern: 迷います
    function_cn: 表示犹豫、难以立即做出选择；亦可表示“迷路”之义。
    formation: 动词「迷う」的礼貌体。
    constraints:
    - 用于难以立即做出选择的场合
    - 可引申为在场所中迷路
    contrasts: []
  - pattern: 気に入りました
    function_cn: 表示初次见到某事物而感到中意、喜欢。
    formation: 动词「気に入る」的过去礼貌体；对象用助词「が」标记。
    constraints:
    - 仅用于第一次见到某物而中意，不表示原有/持续性爱好
    - 只能用于朋友或熟人之间，对长辈不能使用
    contrasts:
    - 「好きです」用于持续性爱好，而「気に入りました」不能表示这种持续性爱好
  - pattern: 省略（避免重复谓语的回答方式）
    function_cn: 回答对方提问时，尽量不重复对方的话，而采取省略谓语的方式作答。
    formation: 在肯定/感叹性回答中省略前文已出现的谓语部分。
    constraints:
    - 适用于回答对方提问的语境
    contrasts: []
  pragmatics:
  - だから与ですから的礼貌度差异
  - ぼく 的性别与亲疏限制
  - いかいですか 的敬语层级与对象
  - 拒绝建议时的委婉策略
  - 「気に入りました」的敬语/称呼限制：限于朋友或熟人，不可对长辈使用
  - 礼貌体（です/ます）日常会话
