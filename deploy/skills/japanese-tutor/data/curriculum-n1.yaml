  similar_contrasts:
  - 与「～に～を示す」区分：后者用于作者自己制作的图表
  - 与「～は～を示している」区分：前者强调作者用图来呈现
  - 与「～以下」区分：以下含基准值（X≤A）
  - 与「～に満たない」区分：以下含基准，満たない不含
  - 与「～を超える」区分：以上含基准，超る不含
  - 与「～以上」区分：超る不含基准，以上含
  - 「約」可替换为「ほぼ」「およそ」；「前後」可替换为「ほど」「程度」
  - 与“～あまり／～強”（实际数值稍大于基准）相对
  - 与“～足らず／～近く／～弱”（实际数值低于基准）相对
  - 与“～に上る／～に達する”（认为数值很大）相对
  - 与“～にすぎない／わずか～／～にとどまる”（认为数值较小）相对
  - ～てみたい
  - どのようになっているだろうか
  - ～でしょうか（同义，用于提示主题）
  - 与～あたり同义
  - ～を契機にして
  - ～を契機として
