  grammar:
  - pattern: ～ましょうか
    function_cn: 自己主动提议做某事／向遇到困难者提供帮助
    formation: 动词ます形去ます＋ましょうか
    constraints:
    - 用于主动提出帮忙或提议共同行动
    - 教材标注关联初级第21课
    contrasts: []
  - pattern: ～ます／～ましょう
    function_cn: 有人寻求帮助时，表示愿意承担（算一个）
    formation: 动词ます形／ましょう
    constraints:
    - 用于回应他人求助、主动揽下任务
    contrasts: []
  - pattern: ～て（も）いいですか
    function_cn: 请求许可，兼作建议询问可否为对方提供帮助
    formation: 动词て形＋（も）いいですか
    constraints:
    - 教材标注关联初级第15课
    contrasts:
    - 与～ましょうか同用于协助提议语境
  - pattern: ～（さ）せてください
    function_cn: 请求许可，用于建议由自己来做某事
    formation: 动词て形＋（さ）せてください
    constraints:
    - 教材标注关联初级第43课
    contrasts: []
  - pattern: 何かお手伝いできることはありますか
    function_cn: 询问对方是否需要帮助
    formation: 固定表达
    constraints:
    - 用于希望对方告知需要帮忙之事
    contrasts: []
  - pattern: ありがとうございます。でも、こちらは大丈夫です。
    function_cn: 接受提议时先致谢，再婉拒／表示无需麻烦
    formation: 致谢＋转折＋自谦/客套表达
    constraints:
    - 用于回应他人主动帮忙的提议
    contrasts: []
  - pattern: ～だけあって
    function_cn: 表示“正因为A，B也顺理成章”，A多为积极评价词；“さすがAだけあってB”“さすがAだけにB”特别强调A。
    formation: 动词(简体)／一类形容词(简体)／名词＋だけあって／二类形容词＋なだけあって；也可用“～だけに”的形式。
    constraints: []
    contrasts: []
  - pattern: こう見ても
    function_cn: 惯用口语表达方式，用于实际状况与外观不相符时；与指示词“これ”“あれ”相对应，可用“こう見ても”“ああ見ても”。
    formation: 与指示词对应使用。
    constraints: []
    contrasts: []
  - pattern: 喜んで
    function_cn: 欣然允诺的应答方式，相当于省略“お手伝いします”的答应表达
    formation: 用于答应对方请求时的应答
    constraints: []
    contrasts: []
  - pattern: 重役
    function_cn: 私营企业中董事、监察人员的总称；称呼规则
    formation: 直接称呼对方时不能单独使用，需加职务（如専務、部長）
    constraints:
    - 直接称呼对方时不能单独使用
    contrasts: []
  - pattern: 何で
    function_cn: 询问理由，比“どうして”更随便，不用于文章
    formation: 用于口语询问原因
    constraints:
    - 不用于文章
    contrasts:
    - どうして（初级第11课）
    - なぜ（比前两者略正式，多用于正式会话或文章）
  - pattern: だって
    function_cn: 诉说理由，较随便；也用于反驳或辩解
    formation: 用于说明理由或反驳、辩解
    constraints:
    - 不宜用在正式场合
    contrasts:
    - でも（可表达反驳/辩解，但“だって”更随便）
  - pattern: じれったい
    function_cn: 事情进展缓慢或不顺利、自己又不能直接解决问题而感到着急
    formation: 形容着急、焦躁的心情
    constraints: []
    contrasts: []
  - pattern: そういうことですか
    function_cn: 听到或看到某事、弄懂某种情形或谈话内容时，表示“原来是这样啊”的反应表达。
    formation: 固定表达，句尾使用。
    constraints: []
    contrasts: []
  - pattern: ～ったら
    function_cn: 表示特别提出某对象并以其为话题，多带说话人轻微责难态度，或把某行为作为话题提出。
    formation: 动词て形／名词＋ったら。
    constraints:
    - 口语用法。
    contrasts:
    - 同义说法～ってば，二者均为口语。
  - pattern: 鈍い
    function_cn: 形容人的性质，指感觉迟钝、不能理解他人心情。
    formation: い形容词，可作谓语或修饰名词。
    constraints: []
    contrasts:
    - 与鈍感（感觉迟钝）意思相同。
  - pattern: ～んだから
    function_cn: 原用于表示理由、后续结果；用于句尾时可省略“困る（觉得为难）”“大変だ（不得了）”等结果表达，带惊讶、困惑语气；也可省略表示要求、主张的部分。
    formation: 动词た形／名词＋んだから。
    constraints:
    - 句尾用法带惊讶、困惑语气。
    contrasts:
    - 与表示理由的～んだから（后续结果）区分。
  - pattern: ここ～年／この～年
    function_cn: 表示“近～年”，包含现在的时间；与“これまでの～年”（迄今、不含现在）相区分；“で”表示一段时间的范围。
    formation: ここ／この＋数字＋年＋で
    constraints:
    - 与これまでの～年 在是否包含现在时间上不同
    contrasts:
    - これまでの～年
  - pattern: ～でも／～で
    function_cn: 二者可互换，但强调重点不同：～でも 强调前者的最低/最高值本身，～で 强调后项。
    formation: 最低／最高＋でも／で＋数值
    constraints:
    - 位置不同导致强调点不同
    contrasts:
    - ～で
  - pattern: 出る
    function_cn: 多义动词：出现（月が出る、顔に出る）、参加某种活动（レースに出る、会議に出る）、由内向外移动（部屋を出す、大学を出す）、发生某种情况（被害が出る）。
    formation: 动词，依语境取不同义项
    constraints:
    - 需按上下文区分义项
    contrasts: []
  - pattern: ～ざるをえない／～しかない
    function_cn: 表示从常识或目前状况判断别无选择；“～ざるをえない”一般用于书面语。
    formation: 动词ない形去掉ない＋ざるをえない；三类动词将～する变为～せざるをえない；动词基本形＋しかない
    constraints:
    - 三类动词需将～する变为～せざるをえない
    contrasts:
    - ～しかない
  - pattern: なぜ～のだろうか
    function_cn: 在文章中就问题的原因向读者设问，先就内容向读者确认再询问，以拉近读者参与共同思考；比单纯疑问句更完整，可换用语气较强的「どうして」
    formation: 「なぜ」+ 内容 + 「のだろうか」
    constraints:
    - 用于文章设问，非日常对话
    - 「～のだ」起确认作用，「～だろうか」起询问作用
    contrasts:
    - 与单纯疑问句「なぜ～か」相比，后者缺少确认与询问，显得不够完整
  - pattern: 影響を及ぼす
    function_cn: 他动词，表示及至、达到，用于「给……带来影响」，较正式的书面语；另有「Aに危険を及ぼす」表示使A处于危险境地
    formation: 名词 + 「に」+ 影響を及ぼす
    constraints:
    - 对象用「に」提示
    - 对应自动词为「及ぶ」
    contrasts:
    - 「影響する」「影響を与える」意思相近但语气较缓和
  - pattern: ～なければならないほど
    function_cn: 表示随着A的进展B也相应的变化（程度递进）
    formation: 「AになればAになるほど」「AすればAするほど」，可省略其中一部分；一类形容词词尾「い」变「く」+「なければならないほど」，二类形容词+「な」+「なければならないほど」，三类动词「ば形」+「するほど」
    constraints:
    - 需按词类变化接续形式
    contrasts: []
  - pattern: ～ば～ほど
    function_cn: 表示程度随条件递增（越……越……）
    formation: 动词ば形/形容词ば形 + するほど 等
    constraints:
    - 页面顶部为上一条目延续例句，未在本页给出完整规则说明
    contrasts: []
  - pattern: （それは）～ということだ
    function_cn: 书面表达，表示按常理出现某种结局理所当然；亦可表示传闻
    formation: 小句（简体形式）+ということだ；二类形容词/名词+だということだ
    constraints:
    - 需依上下文区分‘理所当然’与‘传闻’两种用法
    contrasts: []
  - pattern: 省エネ
    function_cn: 词汇，‘省エネルギー’的缩略，表示节省能耗
    formation: 可作定语修饰名词（如省エネタイプ）
    constraints: []
    contrasts: []
  - pattern: ～にもかかわらず
    function_cn: 书面表达，表示尽管前项成立，后项仍成立（转折/让步）
    formation: 小句（简体形式）+にもかかわらず；二类形容词+であるにもかかわらず
    constraints:
    - 语义与‘AのにB’相同，但为书面语
    contrasts:
    - 与‘AのにB’语体不同（书面 vs 一般）
  - pattern: ～どころか
    function_cn: 举出成为话题的事件后，强调比该事件更难以想象、更极端的事例；后续内容有时与前者截然相反。
    formation: 动词基本形＋どころか；名词／形容词＋どころか
    constraints: []
    contrasts: []
  - pattern: 対策を講じる
    function_cn: 表示根据具体问题采取解决方法；讲じる含考虑方法手段并采取行动之意。
    formation: 对策（名词）＋を＋講じる
    constraints:
    - 略显正式的文章用语；稍随便的说法为「対策を取る」
    contrasts:
    - 対策を取る（较随便）
  - pattern: ～に（も）なかなえない
    function_cn: 表示有可能发生不好的事情，含义与「～になるかもしれない」相同。
    formation: 名词＋に（も）なかなえない；亦可用「～ことになかなえない」形式
    constraints:
    - 多用于书面语
    contrasts:
    - ～になるかもしれない
  pragmatics:
  - 提议与接受提议的礼貌层级
