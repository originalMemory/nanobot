  grammar:
  - pattern: すみません，～／あのう，すみません。～／ちょっと，すみません。～／あのう，失礼ですが，～
    function_cn: 与陌生人搭话、引起注意的开场寒暄；「すみません」本为道歉，也用于搭话与感谢；初次见面可用「はじめまして」
    formation: 句首插入语＋「すみません」或「失礼ですが」
    constraints:
    - 听到陌生人说「すみません」时以「はい？」「何でしょうか？」「あっ、どうも。」回应
    contrasts: []
  - pattern: あのう／ちょっと
    function_cn: 「あのう」表支吾、欲言又止，用于交谈起始以引起注意；「ちょっと」用于招呼店员等
    formation: 句首插入语
    constraints:
    - 对初次见面的尊长使用「ちょっと」很失礼，需特别注意
    contrasts:
    - 对方正与别人说话时用「すみません」或「あのう」搭话
  - pattern: 失礼ですが，～
    function_cn: 与曾见过面、有点印象的人打招呼并确认其姓名
    formation: 「失礼ですが」或「あのう，失礼ですが」＋确认句
    constraints: []
    contrasts: []
  - pattern: 打招呼时的称呼规则（汉语与日语差异）
    function_cn: 日语打招呼时不一定叫称谓；社会地位高者用头衔（先生、部長等），很熟悉者用名字（田中さん、山田さん等），接待客人时用「お～」
    formation: 称呼＋「～」
    constraints:
    - 汉语习惯叫对方称谓（老师、先生），日语不尽然
    contrasts: []
  - pattern: 自动词 vs 他动词
    function_cn: 陈述焦点落在主语（掉落的东西）时用自动词；强调施事者或行为时用他动词；自然发生的事宜用自动词，无生命物体不能充当他动词主语。
    formation: 自动词形 / 他动词形（如 落ちます / 落とします）
    constraints:
    - 无生命物体作主语时优先自动词
    - 有对应自动词时不用无生命物体作他动词主语
    contrasts:
    - 自动词焦点在事物本身，他动词焦点在施事者/行为
  - pattern: 先ほど
    function_cn: “刚才”的礼貌说法，与“さっき”同义；“さっき”仅用于口语，“先ほど”可用于书面语。
    formation: 副词，独立使用
    constraints:
    - 语体差异：口语 vs 书面/礼貌
    contrasts:
    - 先ほど（礼貌/书面） vs さっき（口语）
  - pattern: 名词 + の + 名词（省略动词）
    function_cn: 助词“の”除表领属外，可连接两个名词以省略中间动词，表示“做过某事的人/物”。
    formation: 名词 + の + 名词（如 昨日の料理、先ほどの方）
    constraints:
    - 动词可直接接“方”时省略“の”；名词作修饰语时需加“の”再接“方”
    contrasts:
    - 领属义 vs 省略动词义
  - pattern: 助かります
    function_cn: “助けます（帮助）”的自动词形式，表示“对～有帮助”。
    formation: 自动词形
    constraints:
    - 用于表达受益或致谢，前接部分说明原因
    contrasts:
    - 助かります（自动） vs 助けます（他动）
  - pattern: ～感じします
    function_cn: 表示有那样的感觉、那样的印象。
    formation: 前接形容词（如難しい、変な）或「～という～」等表示感觉内容的表达
    constraints:
    - 多表示留有某种印象
    contrasts:
    - 感じます 多表示直接的感受；感じします 多表示留有某种印象
  - pattern: 助词「は」与「が」「を」「へ」「と」「から」的接续
    function_cn: 助词「は」有表示主题、添加对比意义等功能；当「が」「を」「へ」「と」「から」等后续「は」时，需按规则变形。
    formation: 「が」+「は」→は；「を」+「は」→は；「へ」+「は」→は／へは；「と」+「は」→とは；「から」+「は」→からは
    constraints:
    - 「へ」后续「は」时，「へ」可省略也可不省略
    - 「に」「で」「と」「から」「より」等后续「は」时，成为「には」「では」「とは」「からは」「よりは」等形式
    contrasts: []
  - pattern: ～になる
    function_cn: 表示非出于本人意愿，而是由他人推动或命令才变成那样；用于转调工作等由公司决定的情形，比 ～します 更常用。
    formation: 动词/名词 + になる
    constraints:
    - 强调被动、非自愿的变化，区别于主动的 ～します
    contrasts:
    - ～になる vs ～します：前者含非本人意愿/外部决定，后者为主动
  - pattern: すっかり
    function_cn: 副词，表示变化的程度，用于综合性、整体性的变化；可修饰形容词或动词，表示状态发生整体性变化。
    formation: 副词 + 形容词/动词
    constraints:
    - 表示整体变成某种状态，不能表示动作的量
    contrasts:
    - すっかり vs ずいぶん：整体状态变化用 すっかり，动作的量/程度用 ずいぶん
  - pattern: ずいぶん
    function_cn: 副词，表示动作的量或程度，可修饰形容词或动词。
    formation: 副词 + 形容词/动词
    constraints:
    - 不能用于表示整体变成某种状态
    contrasts:
    - ずいぶん vs すっかり：动作量/程度用 ずいぶん，整体状态变化用 すっかり
  - pattern: ついていけない
    function_cn: 本义为“跟不上脚步”，引申为难以有相同的想法或行动；本课指因变化太快而难以应对。
    formation: 动词“ついていきます”的可能形式“ついていけます”的否定“ついていけません”的简体形式
    constraints:
    - 由可能形否定再简体化而来
    contrasts: []
  - pattern: ～くらい／～ぐらい
    function_cn: 表示大概的数量，或强调某种状态达到何种程度。
    formation: 小句(简体形式)+くらい/ぐらい；～くらい/ぐらい+名词；小句(简体形式)+くらい/ぐらいです
    constraints:
    - 用于强调程度或表示大概数量
    contrasts: []
  - pattern: ～くらい
    function_cn: 表示程度，多用于口语；本页为上一栏例句的延续。
    formation: 小句（简体形式）＋くらい／ぐらい
    constraints:
    - 与～ほど意思大致相同，但语体偏口语。
    contrasts:
    - ～ほど（书面语）
  - pattern: ～ほど
    function_cn: 表示程度，多用于书面语；可接在简体句后强调程度。
    formation: 小句（简体形式）＋ほど
    constraints:
    - 语体偏书面，与～くらい形成语体对比。
    contrasts:
    - ～くらい（口语）
  - pattern: ～てきました
    function_cn: 表示变化的开始，或不断朝着某个结果进展的状态（逐渐变化）。
    formation: 动词て形／形容词变化＋てきました
    constraints:
    - 强调过程性、渐进性。
    contrasts:
    - ～た（单纯确认结果/状态，不含变化过程）
  - pattern: ～た（对比项）
    function_cn: 单纯确认是否达成某结果或状态，重点不在变化过程。
    formation: 动词た形／形容词过去式
    constraints:
    - 与～てきました相比，不强调渐进变化。
    contrasts:
    - ～てきました（强调逐渐变化）
  - pattern: ～とは
    function_cn: 提出某个名称并对其进行说明或询问；亦用于下定义（～とは～ことです）。
    formation: 接名词后；定义式接名词＋ことです。
    constraints:
    - 为『～というのは』的省略形式。
    contrasts:
    - 与『～というもの／～ということ』区分：前者前接事物名词说明本质特征，后者前接行动动词说明行为本质或性质，亦可前接小句据事件推测原因或归纳逻辑结果。
  - pattern: ～的（てき）
    function_cn: 接抽象意义汉语词后作二类形容词，表场所范围、性质倾向或某种状态。
    formation: 接抽象名词后。
    constraints:
    - 需后接抽象意义汉语词。
    contrasts: []
  - pattern: ～は～の1つです
    function_cn: 表示 A 属于 B 范围当中的一种
    formation: 名词A＋は＋名词B＋の1つです
    constraints: []
    contrasts: []
  - pattern: 結ぶ
    function_cn: 本意“结绳”，引申为连结、建立关系，可用于场所、事情、人际关系等；用于句尾时用“結んでいます”表示状态
    formation: 动词，他动用法，可接宾语表示连接对象
    constraints:
    - 句尾表状态时用てい形
    contrasts: []
  - pattern: どんどん
    function_cn: 表示样子的副词，拟态词作副词使用，表示事物发展无阻碍、进展十分顺利
    formation: 副词，修饰动词
    constraints: []
    contrasts: []
  - pattern: 大～
    function_cn: 加在某些词前表示巨大、优越、排位靠前、程度高
    formation: 前缀＋名词/形容词
    constraints:
    - 读法有だいたい、たい、おお三种，依后续词而定
    - 读だいたい时后续词一般为两字汉语词
    - 读たい时“大”已成词的一部分不可分离
    - 读おお时后续词一般为日语固有词
    - 并非所有名词前都可加“大”
    - “大規模”为二类形容词，常用“大規模な”修饰名词，一般不用“大規模だ”形式
    contrasts: []
  - pattern: だい～／おお～（大事件・大規模・大感激・大風・大昔・大笑い）
    function_cn: 前缀，加在名词前表示程度大或时间久远等
    formation: だい／おお + 名词
    constraints: []
    contrasts: []
  - pattern: また
    function_cn: 并列连词，用于句首，在前后添加新的内容或新的观点
    formation: 句首接续
    constraints: []
    contrasts: []
  - pattern: もの
    function_cn: 代替前文出现的名词以避免重复，可指代具体事物或较广泛概念（如企业组织、团体）
    formation: 名词位置
    constraints:
    - 指代抽象/确认语气时不能替换为「の」
    - 指代具体事物时可替换为「の」
    contrasts:
    - もの vs の 的可替换性
  - pattern: ～化
    function_cn: 表示改变成该名词表示的状态，含变化意味
    formation: 名词（多汉语词或外来词）+ 化
    constraints:
    - 可作名词，也可接「する」用作三类动词
    contrasts: []
  - pattern: 上り／下り
    function_cn: 「上ります／下ります」去掉ます的名词形式，表示从低处往高处／高处往低处移动
    formation: 动词名词化
    constraints: []
    contrasts: []
  - pattern: 「上り」「下り」
    function_cn: 表示方向/移动的名词用法；反映以东京为高点的观念，往东京方向称「上り」，离开东京称「下り」
    formation: 动词「上ります」「下ります」去掉「ます」作名词；部分动词ます形去ます后作名词（如「行き」「雨降り」「通行止め」），仅适用于少数动词
    constraints:
    - 名词化用法并非所有动词都适用
    contrasts: []
  - pattern: 「そこで」
    function_cn: 连词，用于补充某场景或状况出现之后产生的情况，常补充新出现的必要情况
    formation: 接在前述内容之后，引出其后内容
    constraints:
    - 以前述内容为前提，提出新情况进行介绍
    contrasts:
    - 「それで」表示前述内容是后述内容的原因或理由；「そこで」表示出现某事或某种状况后陈述与该状况密切相关的
  - pattern: 「こんな」
    function_cn: 指示词，「このような」的较随便说法，用于指示后述内容
    formation: 指示后述内容时使用以「こ」开头的指示词（如「この」「これらの」）
    constraints:
    - 通常指示词多用于指示前述词语或内容，此处用于指示后述句子内容
    contrasts: []
  pragmatics:
  - 「ちょっと」对初次见面尊长失礼
  - 「すみません」兼具道歉与感谢功能
  - 称呼随社会地位与熟悉度变化
  - 与陌生人搭话避免使用“あなた”，可用“田中さん”等姓氏称呼
  - 避免“おじさん/お姉さん”等称呼
