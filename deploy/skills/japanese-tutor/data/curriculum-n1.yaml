  grammar:
  - pattern: ～ています
    function_cn: 表示动作正在进行或状态持续（礼貌体）
    formation: 动词ます形去ます＋ています
    constraints: []
    contrasts: []
  - pattern: ～てもいいですか
    function_cn: 请求许可（做某事是否可以）
    formation: 动词て形＋も＋いいですか
    constraints: []
    contrasts: []
  - pattern: ～てはいけません
    function_cn: 表示禁止（不可以做某事）
    formation: 动词て形＋は＋いけません
    constraints: []
    contrasts:
    - 与～てもいいですか（许可）相对
  - pattern: ～ました
    function_cn: 表示过去时（礼貌体）
    formation: 动词ます形去ます＋ました
    constraints: []
    contrasts: []
  - pattern: 动词て形＋います
    function_cn: 表示动作或变化正在进行（正在进行）
    formation: 动词て形＋います
    constraints: []
    contrasts: []
  - pattern: 动词て形＋も＋いいです
    function_cn: 表示许可；答句可简略为「はい、いいです」；句尾加「よ」使语气柔和，「よ」须读升调
    formation: 动词て形＋も＋いいです
    constraints:
    - 这种表达方式一般不用于尊长，因为那样显得很傲慢
    contrasts: []
  - pattern: 动词て形＋は＋いけません
    function_cn: 表示禁止
    formation: 动词て形＋は＋いけません
    constraints:
    - 对尊长一般不用「～てはいけません」而使用「～ないでください」
    contrasts:
    - 对尊长改用「～ないでください」
  - pattern: 名词[附着点]＋に＋动词
    function_cn: 表示人或物体的附着点，即人或物体停留在交通工具或椅子上等时，附着点用助词「に」表示
    formation: 名词[附着点]＋に＋动词
    constraints: []
    contrasts: []
  - pattern: 名[目的地]＋に＋移动动词
    function_cn: 表示移动行为的目的地
    formation: 名词（目的地）＋助词「に」＋移动动词（如行く・来る・帰る等）
    constraints:
    - 表示典型移动动词的目的地时，「に」与「へ」可通用
    - 「に」还可表示存在场所、时间、动作对象、移动目的、附着点等，这些用法不可用「へ」替换
    contrasts:
    - 「に」与「へ」在移动目的地上的可替换性，以及「に」独有而「へ」不可用的其他语义功能
  - pattern: 名＋に＋附着/放置类动词
    function_cn: 表示附着点或放置位置（如坐于某处、放入某处）
    formation: 名词（附着/放置处）＋助词「に」＋动词
    constraints:
    - 此类附着/放置对象必须用「に」标记，不能用「を」表示
    contrasts:
    - 「に」与「を」在附着点/放置位置标记上的区别
  - pattern: 名词＋禁止/厳禁/止/禁帯出
    function_cn: 构成公共场所禁止标志语（禁止事项表达）
    formation: 行为/对象名词＋禁止类后缀（禁止・厳禁・通行止・折止・止まれ・禁帯出等）
    constraints:
    - 用于标识禁止行为或禁止区域，属固定标志语搭配
    contrasts: []
  - pattern: ～ても いいですか
    function_cn: 请求许可（做某事是否可以）
    formation: 动词て形 + も + いいですか
    constraints: []
    contrasts: []
  - pattern: 肯定回答：どうぞ / かまいません / いいですよ / 大丈夫です
    function_cn: 表示许可；区分个人判断（どうぞ、かまいません）与社会惯例/公共准则（いいですよ、大丈夫です）
    formation: 交际应答表达
    constraints: []
    contrasts: []
  - pattern: 否定回答：いいえ、ちょっと… / すみません、～から / いいえ、いけません / だめです
    function_cn: 婉言拒绝或陈述理由拒绝；区分个人心情/判断与法律规章/社会惯例的判断
    formation: 交际应答表达
    constraints: []
    contrasts: []
  - pattern: ～に 乗ります
    function_cn: 乘坐交通工具（如坐船、划船）
    formation: 名词 + に + 乗る
    constraints: []
    contrasts: []
  - pattern: もちろんです
    function_cn: 表示「当然可以」，可省略后续「～ても いいです」部分
    formation: 省略形式
    constraints: []
    contrasts: []
  - pattern: 無理を しては いけませんよ
    function_cn: 劝告/禁止勉强（行为超出体力或经济能力界限）
    formation: 無理をする + 禁止形（～ては いけません）
    constraints: []
    contrasts: []
  - pattern: ゆっくり
    function_cn: 表示动作速度慢，或“好好儿地”的意思
    formation: 副词用法，修饰动词
    constraints: []
    contrasts: []
  - pattern: 薬を出す
    function_cn: 医生在医院或诊所给患者开药方
    formation: 动词「出す」的敬体「出します」
    constraints:
    - 不能用于表示卖药或给药
    contrasts:
    - 「薬を売ります」(卖药)
    - 「薬をあげます」(给药)
  - pattern: お大事に
    function_cn: 对生病或受伤的人表示关心，用于看望病人告辞时或听说别人身体欠佳时
    formation: 「どうぞお大事にしてください」的省略形式
    constraints:
    - 不能对身体健康的人使用
    contrasts: []
  - pattern: 打电话的开场与确认流程
    function_cn: 电话第一句用「もしもし」，随后说明自己姓名及身份，再说明要找的人；礼貌郑重场合需先确认对方姓名或公司名称
    formation: 交际流程：开场→自报姓名/身份→确认对方→说明要找的人→接电话后谈事
    constraints:
    - 更礼貌郑重的场合应在说明要找的人之前确认对方姓名或公司名称
    contrasts: []
