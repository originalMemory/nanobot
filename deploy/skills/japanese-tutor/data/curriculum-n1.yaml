  grammar:
  - pattern: Nへ 行きます／来ます／帰ります
    function_cn: 表示移动的方向或目的地，用助词「へ」标记去向。
    formation: 地点名词 + へ + 移动动词（行きます／来ます／帰ります）
    constraints:
    - 「行きます」为离说话人而去，「来ます」为向说话人而来，「帰ります」为返回原籍或家。
    - 「へ」可替换为「に」，但「へ」更强调方向。
    contrasts:
    - 行きます vs 来ます vs 帰ります 的视角差异
  - pattern: Nから Nまで 移動手段で 行きます
    function_cn: 表示移动的起点、终点及所用交通工具。
    formation: 起点 + から + 终点 + まで + 交通工具 + で + 移动动词
    constraints:
    - 「で」标记移动所乘的交通工具（新幹線、飛行機、フェリー、自転車等）。
    contrasts:
    - 「へ」表方向 vs 「で」表手段
  - pattern: Nと 行きます／帰ります
    function_cn: 表示移动时同行的人。
    formation: 人 + と + 移动动词
    constraints:
    - 「と」标记共同行动的对象。
    contrasts: []
  - pattern: 时间名词 + に 行きます／来ます
    function_cn: 表示移动发生的时间点或月份。
    formation: 来月／先月／10月 + に + 移动动词
    constraints:
    - 「来月」表下月，「先月」表上月，作时间状语时多用「に」。
    contrasts: []
  - pattern: 名[场所]へ 动
    function_cn: 表示移动行为的目的地
    formation: 场所名词 + へ + 移动动词（如 行きます、帰ります）
    constraints:
    - 助词「へ」在此读作「え」
    - 用于表示移动方向的目的地
    contrasts: []
  - pattern: 名[场所]から 动
    function_cn: 表示移动的起点
    formation: 场所名词 + から + 移动动词
    constraints:
    - 与表示时间起点的「から」为同一助词
    contrasts: []
  - pattern: 名[人]と 动
    function_cn: 表示共同做某事的对象
    formation: 人/对象名词 + と + 动词
    constraints: []
    contrasts: []
  - pattern: 名[交通工具]で 动
    function_cn: 表示交通手段
    formation: 交通工具名词 + で + 动词
    constraints:
    - 不使用交通工具而步行时用「歩いて」
    contrasts: []
  - pattern: 名[场所]から 名[场所]まで 动
    function_cn: 表示移动的范围（起点到终点）
    formation: 起点场所 + から + 终点场所 + まで + 动词
    constraints:
    - 范围起点用「から」，终点用「まで」
    contrasts: []
  - pattern: に／で／へ／から／まで／と ＋ は
    function_cn: 助词“は”表示对比/限定主题；既可单独使用，也可接在“に”“で”“へ”“から”“まで”“と”之后构成复合形式，用于在多个对象中突出或对比其中一项。
    formation: 上述方位/范围/并列助词后直接加“は”
    constraints:
    - 用于对比或限定话题，常与另一未加“は”的对象形成对照
    contrasts:
    - 与单纯陈述句（无“は”）相对，强调“是…而不是…”的对比语气
  - pattern: たしか～
    function_cn: 表示不完全有把握的记忆，凭自己的记忆应是～
    formation: 接在名词或句子前作副词性修饰
    constraints: []
    contrasts: []
  - pattern: ～です（省略动词的简洁叙述）
    function_cn: 用「～です」替代动词，简洁叙述某种手段或目的地
    formation: 名词（手段/目的地）＋です，替代「～ました」
    constraints:
    - 用于问答中省略已知动词的简洁表达
    contrasts: []
  - pattern: 家（いえ）／うち
    function_cn: 均表“（我）家”；指建筑物时用「家」，着重指家人时用「うち」
    formation: 「うち」本身即含“我家”义；用「家」时需加「わたしの」
    constraints:
    - 「家」前需限定词（如わたしの、スミスさんの）
    contrasts:
    - 家＝建筑物 vs うち＝家人/家庭
  - pattern: まっすぐ＋帰る
    function_cn: 「まっすぐ」本意“笔直”，与「帰ります」呼应表示不绕路、径直
    formation: 副词「まっすぐ」＋动词
    constraints: []
    contrasts: []
  - pattern: それ（指代前文叙述）
    function_cn: 此处「それ」不指眼前事物，而指代前面叙述的某件事
    formation: 指示代词，指代前文已述内容
    constraints:
    - 区别于第2课指眼前事物的「それ」
    contrasts:
    - 指眼前事物 vs 指代前文叙述
  - pattern: お疲れ様でした
    function_cn: 寒暄语：同伴之间体谅、安慰对方；也用于公司工作结束后，先离开者对仍在工作者表示对一整天辛苦的安慰
    formation: 固定寒暄表达，常与「お先に失礼します」搭配使用
    constraints:
    - 用于工作结束场景或同伴间安慰
    - 先离开者说「お先に失礼します」，留下者用「お疲れ様でした」回应
    contrasts: []
  - pattern: 月份表达（1月〜12月、何月）
    function_cn: 月份读音规则；提问月份用「何月ですか」
    formation: 数字+「がつ」
    constraints:
    - 4月（しがつ）、7月（しちがつ）、9月（くがつ）读音需特别注意，与4/7/9的普通读法不同
    contrasts: []
  pragmatics:
  - 「お疲れ様でした」的语用场景：先离开者 vs 留下者的分工表达
