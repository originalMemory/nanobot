  grammar:
  - pattern: ～といわれています
    function_cn: 叙述某个定论、传闻或公认说法
    formation: 名词/动词连体形 + といわれています
    constraints:
    - 用于表达客观定论或历史说法，非说话人主观断言
    contrasts: []
  - pattern: ～のです
    function_cn: 说明理由、原因或解释
    formation: 动词/形容词/名词 + なのです/んです
    constraints:
    - 用于向对方解释、说明缘由
    contrasts: []
  - pattern: 指示词（これ/あれ/こちら/あちら/そちら）
    function_cn: 指代说话人与听话人眼前事物的远近与方向
    formation: 近用これ、较远用あれ；方向用こちら/あちら/そちら
    constraints:
    - 「それ」用于指代距离听话人较近的物
    - 「右手」「左手」分别表示右方/左方，为观光导游常用说法
    contrasts: []
  - pattern: 句尾「よ」
    function_cn: 友好、亲密地介绍时附加，含提醒、告知对方含义
    formation: 句末 + よ
    constraints:
    - 用于提醒或告诉对方某事
    contrasts: []
  - pattern: まるで～ようです / まるで～ようです
    function_cn: 比喻，表示“就像……一样”
    formation: まるで/まるで + 动词/名词 + ようです/です
    constraints:
    - 名词形式为「まるで～+名词+です」
    contrasts: []
  - pattern: ～てください / ご遠慮ください（禁止的礼貌表达）
    function_cn: 提醒对方注意或禁止某行为的礼貌说法
    formation: 动词て形＋ください；ご遠慮ください用于禁止
    constraints:
    - 提醒对方时一般用～てください
    - 「ご遠慮ください」是禁止的表达方式，「するな」的礼貌说法
    contrasts:
    - 「～てください」用于请求/提醒，「ご遠慮ください」用于禁止
  - pattern: ～てはいけませんか / ～ましょうか（请求许可/主动提议）
    function_cn: 请求对方帮忙（如拍照按快门）或主动提出帮忙
    formation: 动词て形＋はいけませんか；动词ます形去ます＋ましょうか
    constraints:
    - 用于请人帮忙或主动提议帮忙的礼貌表达
    contrasts: []
  - pattern: ～ですね / ～ですよ（说明、强调、介绍）
    function_cn: 在景点、商店、讲解中介绍特产、推荐、说明景色与历史
    formation: 名词/形容词＋ですね；名词/动词＋ですよ
    constraints:
    - 用于向对方说明、推荐或强调某事
    contrasts: []
  - pattern: ～以来
    function_cn: 表示某个事情之后一直……；强调现在的这种事态自何时开始。
    formation: 动词（て形）＋以来；表示过去时间的名词＋以来。
    constraints:
    - 与～以降含义近似但视点不同：以降侧重以某时间为分界线发生的变化，也可用于非过去事态；以来侧重现在事态的起始。
    - 用于非过去事态时与以降不可互换（教材以×标记错误用法）。
    contrasts:
    - ～以降
  - pattern: ～だからこそ
    function_cn: 用于强调理由或原因，带说话人强烈的‘不是别的，正是因为如此’的感情；一般用于好的事情。
    formation: 名词／二类形容词＋だからこそ；动词／一类形容词＋からこそ。
    constraints:
    - 句尾经常使用～のだ／～んです。
    - 不用于客观地表示某种因果关系（教材以×标记错误用法）。
    contrasts:
    - ～から（客观因果）
  - pattern: ～もの間
    function_cn: 表示数量比预想的要多，对数量加以强调，有‘长时间的’之意。
    formation: 表示数量的表达＋もの＋間。
    constraints:
    - 与不带‘も’的‘～の間’相比，因用‘も’加以强调而含‘长达……’的语感。
    contrasts:
    - ～の間
  - pattern: まさか
    function_cn: 与否定形式连用，表示可能性极低、预想不到的否定推测
    formation: 接于否定句前，如「まさか～とは思わなかった」「まさか～ないだろう」
    constraints:
    - 须与否定形式搭配使用
    contrasts: []
  - pattern: ～てもみない
    function_cn: 强调说话人丝毫没往那方面想、没做某事，语气强烈
    formation: 动词て形＋みる＋も＋ない；多以「～てもみなかった」形式出现
    constraints:
    - 使用的动词非常有限，常见惯用搭配如「考えてもみなかった」「試してもみなかった」「思ってもみなかった」
    - 「思ってもみなかった」用于实际已成为某种状态之后，表示之前丝毫没想到的意思
    contrasts:
    - 与「～てみる」（试着做某事）相关，但加「も」及否定「ない」后转为强调未尝试
  - pattern: ～関係
    function_cn: 名词，本表示事物间联系，此处特别用于表示“工作方面”的意思
    formation: 前接工作或业界相关词语，如「酒造関係」「漁業関係」「金融関係」
    constraints:
    - 前面一般会出现工作或业界的词语
    contrasts: []
  - pattern: でしたら、～
    function_cn: 用于承接前项，并以此为条件连接后项
    formation: 本源为「それでしたら」，由「～でしたら、～」接续形式发展而来；简体形式为「だったら」，会话中用较礼貌的「でしたら」
    constraints:
    - 会话中用比较礼貌的说法「でしたら」
    contrasts:
    - 与简体「だったら」对应，后者较随意
  - pattern: ～に面した
    function_cn: 表示与名词（场所）相对、面对面或面向该场所；可修饰名词，也可用『～に面して＋动词』形式。
    formation: 名词（场所）＋に面した／に面して＋动词
    constraints:
    - 用于叙述建筑物或场所的位置
    - 可与『～を前にした』『～を前にする』区分：后者多就人体或脸部位置等状况叙述
    contrasts:
    - ～を前にした
    - ～を前にする
  - pattern: ～から～にかけて
    function_cn: 表示时间或场所的大致范围，多用于较大的单位
    formation: 名词（时间/场所）＋から＋名词＋にかけて
    constraints:
    - 与「～から～まで」相比，「かけて」表示大致而非精确范围
    - 与「～から～にわたって」相比，后者范围通常更大
    contrasts:
    - ～から～まで
    - ～から～にわたって
  - pattern: ～を通じて
    function_cn: 表示某段时期，强调在该时段内持续的状态或变化
    formation: 时间名词＋を通じて
    constraints:
    - 所接时间名词通常为相对集中的一段时间（如全年、四季、一周、一生、在校期间等）
    contrasts: []
  - pattern: 初春（はつはる／しょしゅん）
    function_cn: 词汇讲解：两种读法对应两种含义，并引申「初～／晚～」表示季节的早期与晚期
    formation: 名词（季节词）
    constraints:
    - 「はつはる」为特殊读法，指“新年”；表“早春”时读「しょしゅん」
    - 「初～」可用于春天以外的季节，「晚～」表示该季节晚期
    contrasts:
    - 初～
    - 晚～
  - pattern: ひとときわ
    function_cn: 副词，表示“突出”“显著”；书面语，一般不用于口语
    formation: 作副词修饰谓语
    constraints:
    - 书面语
    - 口语中少用
    contrasts: []
  - pattern: ～ならでは（の）
    function_cn: 表示“除此以外体验不到、无法实现”；用于好事、有价值的事情；较老、固定的表达
    formation: 名词+ならでは；修饰名词用“ならでは（の）～”，作谓语用“～ならではです”
    constraints:
    - 用于正面、有价值的事物
    - 较老固定表达
    contrasts: []
  - pattern: 延々と
    function_cn: 表示事物延绵不绝、不知何时终止；可表示道路连绵不断，也用于会议或人的讲话
    formation: 多与“と”一起使用（如“延々と続く”“延々と続いた”）
    constraints:
    - 常与“と”搭配
    contrasts:
    - 同类可加“と”作副词的词：統々、もうもう 等
  - pattern: 必見だ
    function_cn: 名词，意思为必看、绝对值得一看；用于简洁表述打动人的宣传或电视广告
    formation: 名词+だ
    constraints:
    - 多用于宣传、广告等简洁表述
    contrasts: []
  - pattern: 人気が高い
    function_cn: 表示受欢迎程度高；语气郑重，评价高于「人気がある」「人気の」「人気だ」。
    formation: 名词「人気」＋「が」＋「高い」
    constraints: []
    contrasts:
    - 人気がある
    - 人気の
    - 人気だ
  - pattern: ぜひとこ
    function_cn: 副词，表“一定、务必”，后接强烈愿望或提议内容；比「ぜひ」更强调愿望。
    formation: 副词，修饰动词/句
    constraints: []
    contrasts:
    - ぜひ
  - pattern: 施される
    function_cn: 「施す」的被动形；原义给别人物品，引申为加工、装饰、涂抹；用于「彫刻」「加工」「化粧」等，较特殊，不用于口语。
    formation: 动词「施す」＋「される」
    constraints:
    - 不用于口语
    contrasts: []
  - pattern: ～にわたる
    function_cn: 接在期间/区间词语后，表示数量之多、强调持续时间；加「も」为「～にもわたる」进一步强调；范围更大用「～から～にわたる」。
    formation: 期间/区间名词＋「にわたる」
    constraints: []
    contrasts:
    - ～間（的）
  - pattern: 目を見張る
    function_cn: 表示吃惊时睁大眼睛的样子，含惊讶、钦佩、正面评价义；不用于因坏事而吃惊；表示吃惊的理由用「に」引出。
    formation: 固定表达
    constraints:
    - 不用于负面/坏事引起的吃惊
    - 理由用「に」表示
    contrasts: []
  - pattern: 見どころ
    function_cn: 指「見るべきところ」，即值得一看的地方；用于名胜古迹或电视剧、电影中的高潮片段。
    formation: 名词
    constraints: []
    contrasts: []
  - pattern: 見飽きる
    function_cn: 复合动词，由「見る（看）」与「飽きる（腻烦、厌烦）」结合，意为看厌烦、看够了；「見飽きない」为比喻表达，指怎么看都看不够；本课中表美丽得让人百看不厌。
    formation: 复合动词（見る＋飽きる）
    constraints: []
    contrasts:
    - 同型复合动词：食べ飽きる（吃腻）、聞き飽きる（听腻）
  - pattern: ～ことがない
    function_cn: 动词基本形＋ことがない，强调某种事态不存在，无表示意志的用法；表示从不会有某种情况时使用。
    formation: 动词基本形＋ことがない
    constraints:
    - 不表意志
    contrasts:
    - 与「～ことはない」（强调区别时）区分
    - 勿与前接过去形式的「～たことがない（ある）」（表有无某种经历）混淆
  - pattern: ～ことはない（拓展用法）
    function_cn: 强调不存在某种情况；表示没必要进行某种行为或没有经历过某事；双重否定表示存在某种情况
    formation: ①名词＋なんてことはない；②动词基本形／た形＋ことはない；③动词ない形＋ことはない
    constraints:
    - ②中动词た形接续表示未经历某事
    - ③为双重否定，语气比肯定弱，表示‘有这种情况’
    contrasts:
    - ①强调不存在；②表没必要/未经历；③表存在（双重否定）
  - pattern: 色濃く
    function_cn: 表示整体中某种特征或要素较浓厚、浓郁
    formation: 名词‘色’＋形容词‘濃い’结合，常以副词形式使用
    constraints:
    - ‘色’不仅指色彩，也指某种特征或要素
    contrasts: []
  pragmatics:
  - 导游对顾客的敬语服务用语（ご案内しましょうか）
  - 顾客接受推荐的表达（ぜひ行ってみたいです）
  - 导游/接待场景中的礼貌表达与指代方向
  - 提醒对方时使用～てください而非命令形
  - 「ご遠慮ください」为禁止的礼貌说法
  vocabulary_domains:
  - 绍兴、乌篷船、绍兴酒、鉴湖的水、酒造会社
