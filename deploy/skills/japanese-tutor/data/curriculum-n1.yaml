  grammar:
  - pattern: i形容词「く」连用形连接（～くて）
    function_cn: 并列连接两个 i 形容词，描述同一主体的多个性质
    formation: i 形容词词干 + くて + 形容词/です
    constraints:
    - 仅用于 i 形容词之间的并列
    - 与 na 形容词/名词的「で」连接相区别
    contrasts:
    - na 形容词/名词用「で」连接（如 簡単で 便利）
  - pattern: na 形容词/名词「で」连接（～で）
    function_cn: 并列连接 na 形容词或名词谓语
    formation: na 形容词/名词 + で + 形容词/名词/です
    constraints:
    - 用于 na 形容词与名词，不用于 i 形容词
    contrasts:
    - i 形容词用「くて」连接
  - pattern: 动词「～ています」表状态
    function_cn: 表示持有、居住等持续状态
    formation: 动词ます形去ます + ています
    constraints:
    - 用于表示状态而非进行动作时，语义为'处于…状态'
    contrasts:
    - 与动作进行的「～ています」语义区分
  - pattern: 一类形容词て形 ＋ 一类形容词（并列①）
    function_cn: 两个以上一类形容词并列使用，表示又…又…
    formation: 一类形容词词尾「い」变为「くて」后接下一形容词
    constraints:
    - 仅用于一类形容词之间的并列
    - 该「て形」结构也可用于修饰名词
    contrasts:
    - 与二类形容词并列（用「で」）相区别
  - pattern: 二类形容词で ＋ 二类形容词（并列②）
    function_cn: 两个以上二类形容词并列使用，表示又…又…
    formation: 二类形容词后接「で」再连下一形容词
    constraints:
    - 用于二类形容词之间的并列
    - 一类形容词与二类形容词也可连接使用
    contrasts:
    - 与一类形容词并列（用「くて」）相区别
  - pattern: 名词1で ＋ 名词2（并列③）
    function_cn: 两个以上名词并列使用，表示身份/属性的叠加
    formation: 名词1后接「で」再连名词2
    constraints:
    - 用于名词之间的并列
    contrasts:
    - 与形容词并列结构相区别
  - pattern: 动词て形＋います
    function_cn: 表示动作结束后留下的结果状态（区别于进行体）
    formation: 动词て形＋います
    constraints:
    - 对结果状态提问的否定回答用「～ていません」
    - 「知っていますか」的否定回答必须用「知りません」，不可用「知っていません」
    contrasts:
    - 与表示进行体的「～ています」区分
  - pattern: 小句＋が＋小句
    function_cn: 表示两个小句的转折关系，相当于汉语“但是”“可是”
    formation: 小句（动词/形容词/な形容词连体形）＋が＋小句
    constraints: []
    contrasts: []
  - pattern: まだ＋动词否定
    function_cn: 表示还没达到所询问内容的程度，相当于汉语“还没（有）”
    formation: まだ＋动词否定形
    constraints:
    - 对用「もう」提问的句子做否定回答时，使用「まだ～ていません」的表达形式
    contrasts:
    - 与「もう」的肯定/否定对应关系
  - pattern: あります／います（所有）
    function_cn: 表示拥有；所有者为人时，被拥有对象为人用「います」，非人用「あります」；否定形为「ありません」。
    formation: 名词＋が＋数量词＋あります／います
    constraints:
    - 对象是人时用「います」，否则用「あります」
    contrasts:
    - 「あります」表存在／发生（前课已学）与本课表所有用法区分
  - pattern: 外来词字母缩略词
    function_cn: 外来词传统用片假名书写；近年以英语首字母组合的缩略词增多，字母部分按日语发音朗读。
    formation: 英语字母组合＋片假名（如 ID＋カード、IT＋産業）
    constraints:
    - 字母部分读日语音，不读英语原音
    contrasts: []
  - pattern: '*ちゃんと'
    function_cn: 副词，口语，表示“没错”或“处于正常状态”
    formation: 接于动词连体形/句末等，用于口语
    constraints:
    - 仅用于口语
    contrasts: []
  - pattern: '*ほら'
    function_cn: 感叹/提醒语，意为“你看！”，用于提醒别人注意
    formation: 独立使用，置于句首或句中提示
    constraints: []
    contrasts: []
  - pattern: '*ずいぶん'
    function_cn: 表示程度的副词，程度大幅度超过说话人自身或一般评判标准，内容上无论好坏
    formation: 接于形容词/形容动词/名词谓语句前
    constraints:
    - 表示程度高，超出一般标准
    contrasts: []
  - pattern: '*派手'
    function_cn: 形容色彩鲜艳、形状奇特，含“耀眼、花哨”义；反义词为*地味（朴素、质朴）
    formation: 形容动词，接于「です/ですね」等
    constraints:
    - 传统上日本人一般不太欣赏过分鲜艳或奇特之物
    contrasts:
    - '*地味'
  - pattern: '*嫌いじゃありません'
    function_cn: 表示并不十分喜欢但也并不讨厌；形式为否定，语义为正面、肯定的评价
    formation: 「嫌い」+「じゃありません」否定形式
    constraints:
    - 形式否定、语义肯定
    contrasts: []
  pragmatics:
  - '*ちゃんと 仅用于口语'
  - '*派手 与 *地味 构成反义对照，反映审美偏好'
  - 使用「～ですね」寻求对方认同
  - 使用「安心してください」安慰对方
  - 使用敬体（～ます／～ください）与出租车司机交流
