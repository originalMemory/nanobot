  grammar:
  - pattern: ～で済ます
    function_cn: 表示把某问题草草解决、敷衍了事；～部分一般为名词。可用“～で済ませる”形式，意思相同。
    formation: 名词＋で＋済ます／済ませる
    constraints:
    - ～部分一般为名词
    contrasts:
    - 与“～で済む”（事态在恶化前获得解决）意义方向不同
  - pattern: ～で（は）済まされない
    function_cn: “～で済ます”的被动否定形式，表示不能草草了事、不能敷衍过去。
    formation: 名词＋で＋（は）＋済まされない
    constraints: []
    contrasts: []
  - pattern: ～ないで済ます／～ずに済ます（及～ませる形式）
    function_cn: 表示①该行为的终止；②采用另一种替代做法，权且算是做了某事。
    formation: 动词ないで／动词ず＋済ます／済ませる
    constraints: []
    contrasts: []
  - pattern: ～で済む
    function_cn: 表示在事态恶化之前获得解决。
    formation: 名词＋で＋済む
    constraints: []
    contrasts:
    - 与“～で済ます”（主动草草了事）方向相反
  - pattern: ～で（は）済まない
    function_cn: 表示……还不算完，事态继续恶化以致酿成重大恶果。
    formation: 名词＋で＋（は）＋済まない
    constraints: []
    contrasts:
    - 与表示道歉/谢意的“すみません”含义相关但用法不同
  - pattern: 済まない（自动词“済む”的否定形式）
    function_cn: 与表示道歉或感谢的“すみません”含义相关，可用“自己心里过不去”的说法表达歉意或谢意；也可作郑重方式招呼别人，招呼远离自己的人时拖长发音。
    formation: 済む→済まない
    constraints: []
    contrasts:
    - 与“すみません”在道歉/致谢功能上相关
  - pattern: ～とも
    function_cn: 书面语逆接假定条件，与「～ても」同义；一类形容词用词尾「い」变「く」＋「とも」，动词用「～なくとも」
    formation: 动词/形容词/名词＋とも（一类形容词く＋とも，动词なくとも）
    constraints:
    - 标注为书面语
    - 与初级「～ても」功能相同
    contrasts:
    - ～ても（口语逆接假定）
  - pattern: さらす
    function_cn: 使某物暴露于某种状态（暴晒、晒干、浸泡等），引申为把丑事置于人目光下、置身危险
    formation: 他动词，名词＋を＋さらす
    constraints:
    - 核心义为无保护地直接暴露于某状态
    contrasts: []
  - pattern: ～を怠る
    function_cn: 疏忽、不做自己必须做的事（如准备、检查、养护）
    formation: 名词＋を＋怠る
    constraints:
    - 接名词
    contrasts: []
  - pattern: 死に至るおそれ
    function_cn: 表示可能导致死亡这一最坏状态的可能性/危险
    formation: 「死に至る」（到达死亡状态）+「おそれ」（担心、估计会出现不好的情况）
    constraints: []
    contrasts: []
  - pattern: 表格中的「あり／なし」「有／無」「○／×」「同上」
    function_cn: 在表格中表示某事项有无或栏位内容相同时的填写方式
    formation: 「○」表符合、「×」表不符合；与上栏相同可填「同上」；「√」在日本不太使用
    constraints:
    - 用于表格语境
    contrasts:
    - 「√」在日本不常用
  - pattern: 一口に～といっても，～
    function_cn: 表示所提词语含义深广，内部存在差异
    formation: 名词 + 一口に～といっても，＋后接说明差异的句子
    constraints: []
    contrasts: []
  - pattern: ヒト（生物学上の「人」）
    function_cn: 表示生物学意义上的人类；动植物名称用片假名书写
    formation: 汉字「人」表人类，生物学义用片假名「ヒト」；动植物名用片假名（如ウシ、イヌ、サクラ、ウメ）
    constraints: []
    contrasts: []
  - pattern: ～に対応する
    function_cn: 根据状况的变化及对象采取相应的行动
    formation: 名词＋に対応する；对象用「に」表示
    constraints: []
    contrasts: []
  - pattern: ～法
    function_cn: 表示方法；「予防法」=预防的方法
    formation: サ变动词词干＋法；一类/二类动词表方法时用ます形去ます＋方（食べ方、読み方、見方）；サ变动词后接「～の仕方」（予防の仕方、勉強の仕方）；非サ变动词汉字词＋法（健康法）
    constraints:
    - 不能说「予防仕方」「勉強仕方」
    - 部分サ变动词（如謝罪）只能用「～の仕方」而不能用「～法」
    contrasts:
    - ～法 vs ～の仕方
  - pattern: ～法 / ～の仕方 / ～方
    function_cn: 将动词或汉字词名词化，表示“…的方法/读法/吃法”等；具体接续与意义随前接词词类（一类动词、二类动词、サ变动词、汉字词）而异，部分组合不成立（表中以×标示）。
    formation: 一类动词、二类动词多接～方（如読み方、食べ方）；サ变动词可接～法或～の仕方（如予防法、予防の仕方）；汉字词接～法（如健康法）。
    constraints:
    - 一类动词、二类动词一般不接～法与～の仕方
    - 部分サ变动词（如謝罪する）不接～法，仅接～の仕方
    - 汉字词一般不接～の仕方与～方
    contrasts:
    - ～法 与 ～の仕方 在サ变动词前均可表“方法”，但适用词项不同
  - pattern: なぜなら～からである / その理由は～からである / その理由として～が挙げられる
    function_cn: 表达根据/理由：先提示某种现象，再叙述其根据或原因。
    formation: 前句陈述现象，后句用上述任一句型引出原因或可列举的理由。
    constraints:
    - 用于书面或较正式的因果说明
    contrasts:
    - 三种表达均可表“因为…”，语体与强调点略有差异
  - pattern: ～にかかる
    function_cn: 惯用表达，表示责任/担忧/处理/赏识等落在某处或某人身上（如 医者にかかる、肩にかかる、気にかかる、手にかかる、鼻にかかる、目にかかる）
    formation: 名词＋にかかる
    constraints:
    - 与「～にかける」语义方向不同，需按搭配区分
    contrasts:
    - 「～にかける」
  - pattern: ～にかける
    function_cn: 惯用表达，表示把担忧/记挂/精力/炫耀/关照投向某对象（如 気にかける、心にかける、手塩にかける、鼻にかける、目にかける）
    formation: 名词＋にかける
    constraints:
    - 多含主动施加、倾注之意，与「～にかかる」的被动/归属义相对
    contrasts:
    - 「～にかかる」
