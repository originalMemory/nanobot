  - 询问对方在日本的生活感受
  - 确认是否已告知父母归国日期
  - 询问归国后的计划（休息、旅行、会友、用餐）
  grammar:
  - pattern: 動詞た形／形容詞だ／名詞＋たり、～たりする
    function_cn: 列举同类动作或状态中的部分项目，表示“有时…有时…”“一会儿…一会儿…”
    formation: 动词た形、形容词だ、名词＋たり，后接「する」或过去式「した」
    constraints:
    - 列举项通常不超过两项，且非穷尽列举
    - 可与「～によって」搭配表示随条件变化而列举不同状态
    contrasts:
    - 与「～たり～たりする」强调部分列举，区别于「～たりも～たりも」等强调形式
  - pattern: 疑問詞＋か＋どうかわからない
    function_cn: 表示对某事是否成立、何时发生等不确定，意为“不知道是否…”
    formation: 疑问词（か、どこ、いつ等）＋か＋どうかわからない
    constraints:
    - 用于表达说话人对事实的不确定，常与「教えてください」等请求搭配
    contrasts: []
  - pattern: 动たり 动たり します
    function_cn: 列举若干种有代表性的动作（非穷尽列举）
    formation: 将动词た形中的「た」变为「たり」，后接「します」
    constraints:
    - 用于列举代表性动作，不表示全部动作
    contrasts: []
  - pattern: 一类形かったり／二类形だったり／名だったり（可加です）
    function_cn: 表示状态或状况有多种可能
    formation: 将一类形容词、二类形容词、名词的过去简体形「～かった」「～だった」中的「た」变为「たり」
    constraints:
    - 一类、二类形容词所列举的状态一般为反义关系
    contrasts: []
  - pattern: 小句＋か
    function_cn: 表示某种不确定的内容
    formation: 小句后接「か」
    constraints: []
    contrasts: []
  - pattern: 小句＋か どうか
    function_cn: 将不含疑问词的疑问句作为长句的一部分嵌入
    formation: 将动词、一类形容词的敬体形变为简体形，后加「か どうか」
    constraints:
    - 仅用于不含疑问词的疑问句嵌入长句
    contrasts: []
  - pattern: 动词基本形／形容词词干 + か どうか + 知りません／分かりません／聞いてください
    function_cn: 表达“不知道是否……”“问一下是否……”等不确定或转述疑问
    formation: 将是非疑问句的谓语改为基本形（动词原形、い形容词词干、な形容词词干）后接 か どうか，再连接表示认知或请求的谓语
    constraints:
    - 名词或二类形容词后直接接 か どうか，中间不加“だ”
    - 该小句内部主语必须用“が”，不能用“は”
    contrasts:
    - 可与“动词基本形 + か + 否定形（ない形）+ 知りません／分かりません”互换，含义相同
  - pattern: 疑问词小句 + か
    function_cn: 将含 何・だれ・どこ 等疑问词的小句作为长句的一部分（间接疑问）
    formation: 疑问词小句中的动词、一类形容词由敬体变为简体形，再加 か
    constraints:
    - か 前出现名词或二类形容词时，直接接在名词或二类形容词后，中间不加“だ”
    contrasts:
    - 与“～か どうか”结构在名词／二类形容词后的接续规则一致
  - pattern: ～によって
    function_cn: 表示根据某一条件（季节、国家、时间等）结果或情况不同，相当于汉语“根据……（不同）”；句尾可用「～によります」形式。
    formation: 名词 + に + よって / によります
    constraints:
    - 用于说明随条件变化而变化的结果
    - 句中可灵活翻译，不固定为“根据”
    contrasts: []
  - pattern: ～たり～たり（する／ある／違う）
    function_cn: 列举多种情况或动作，表示“有时……有时……”“有……有……”。
    formation: 动词た形／一类形容词た形／二类形容词だ形／名词だ + たり + 列举 + 句尾动词（如 いろいろあります、毎回違います、日に よって 違います）
    constraints:
    - 句尾并非总接「です」，可接续其他谓语形式
    - 用于表示不固定、多样的情况
    contrasts: []
  - pattern: あっ、そうだ
    function_cn: 自言自语时突然想到或想起某事的表达，相当于“啊，对了”“啊，想起来了”。
    formation: 独立感叹 + そうだ（简体）
    constraints:
    - 因属自言自语，使用简体「そうだ」而非「そうです」
    contrasts: []
  pragmatics:
  - 「あっ、そうだ」用于自言自语场景，故用简体形式
  - 使用「～ましたか」「～ですか」等礼貌疑问句进行送别场合的寒暄与确认
  - 用「～ますよ」表示主动承担（如自己制作礼物）
