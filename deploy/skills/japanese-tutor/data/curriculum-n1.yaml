  jlpt_estimate:
    status: unverified
  communication_functions:
  - 做说明／演讲时的礼貌开头与自谦表达
  - 提问前的铺垫（同感、感谢、自谦）
  - 接受提问时的铺垫（感谢提问、回答后确认）
  - 确认对方意图
  - 确认对方言外之意
  - 以升调表达批评或质疑
  - 以自言自语方式加深理解
  - 表示吃惊
  - 表示担心
  - 用身体部位相关惯用语表达悲伤、喜悦、决心、恐惧等情感
  grammar:
  - pattern: ～させていただきます
    function_cn: 用于开始说明或演讲时的开头；原为征求许可的表达，现被普遍用作礼貌表达方式
    formation: 动词ます形去ます＋させていただきます
    constraints: []
    contrasts: []
  - pattern: ～いたします
    function_cn: 自谦语，替代～します，使表达更加礼貌
    formation: 动词ます形去ます＋いたします
    constraints: []
    contrasts:
    - 替代～します
  - pattern: ～てまいります
    function_cn: 自谦语，替代～てきます／～ていきます，使表达更加礼貌
    formation: 动词て形＋まいります
    constraints: []
    contrasts:
    - 替代～てきます／～ていきます
  - pattern: ～ております
    function_cn: 自谦语，替代～ています，使表达更加礼貌
    formation: 动词て形＋おります
    constraints: []
    contrasts:
    - 替代～ています
  - pattern: メリット
    function_cn: 外来词，意为“利点（优点）／長所（长处）”；公司说明会上常用；不足之处用“デメリット”，意为“短所（短处）”
    formation: 名词
    constraints: []
    contrasts:
    - デメリット＝短所／短处
  - pattern: ～ということですか（↗）／～というわけですか（↗）
    function_cn: 在不完全明白对方意见或提问意图时，用上升调确认对方意图
    formation: 接在名词或句子后，句尾用ですか，语调上升
    constraints:
    - 用于确认对方意图，非真正疑问
    - 可替换为语气较随便的～ってことですか、～ってことですか、～っていうわけですか、～ってわけですか
    contrasts:
    - 正式说法～ということですか／～というわけですか 与 随便说法～ってことですか／～ってわけですか 的语体差异
  - pattern: 提问前铺垫 / 回答前铺垫（语用功能）
    function_cn: 提问前先表示同感、感谢或自谦理解不足；回答前先感谢提问，回答后确认对方是否接受
    formation: 交际策略性表达，非固定句型
    constraints:
    - 提问前避免单刀直入，先对对方意见表示同感/感谢/自谦
    - 回答后需确认回答是否切合提问意图，必要时请求多包涵
    contrasts: []
  - pattern: ～ということですか／～というわけですか
    function_cn: 听了对方意见后让对方意识到自己已理解其话意；用于确认对方意思
    formation: 接在名词或句子后
    constraints:
    - 使用上升语调（↗）时含有相当强烈的批评、质疑语气
    - 使用降调（↘）时表示确认理解
    contrasts:
    - 与较随便的表达「～っていうわけか」（降调，自言自语式加深理解）相对
  - pattern: ～っていうわけか
    function_cn: 较随便的表达，用于自言自语、加深理解
    formation: 接在句子后
    constraints:
    - 语调为降调（↘）
    contrasts:
    - 与「～ということですか／～というわけですか」的正式/批评语气相对
  - pattern: ～ということですね（ね）
    function_cn: 做出某种程度推测、想确认其是否正确时使用
    formation: 句尾使用「ね」，语调为升调
    constraints:
    - 「ね」的用法参见中级第7课
    contrasts: []
  - pattern: ～済み
    function_cn: 表示动作已经完成、已处理完毕
    formation: サ变动词词干＋済み
    constraints:
    - 并非所有サ变动词都可搭配，一般多与特定动词（如使用、解決、証明、登録、回答、対応、連絡、決済、注文、提出等）连用
    contrasts: []
  - pattern: ～（よ）うというものだ
    function_cn: 表示以……为目的、为想出某物/某事
    formation: 动词意志形＋というものだ
    constraints: []
    contrasts: []
  - pattern: まかなう
    function_cn: 想方设法筹措金钱或物品
    formation: 动词，他动用法
    constraints: []
    contrasts: []
  - pattern: ～が見込める
    function_cn: 表示预测、推算；为「～が見込む」的可能形式。
    formation: 动词连用形/名词 + が見込める
    constraints:
    - 「～が見込める」不用于不好的事情。
    - 被动形式「～が見込まれる」表示“自然地成为那样的状态”，可用于不好的事。
    contrasts:
    - 「～が見込める」与「～が見込まれる」在褒贬适用上的区别
  - pattern: ご覧に入れる
    function_cn: 「見せる」的自谦表达，意思与「お目にかける」相同。
    formation: 名词 + を + ご覧に入れる
    constraints:
    - 相关表达「ご覧になる」是「見る」的尊敬表达。
    contrasts:
    - 「ご覧に入れる」（自谦）与「ご覧になる」（尊敬）
  - pattern: ～には～の側面がある
    function_cn: 表示某事物含有几个不同的方面；「側面」指各种性质或特点当中的一种。
    formation: 名词 + には + 名词/数字 + の側面がある
    constraints:
    - 「～の側面」中的「～」部分除数字外，还可以是具体内容。
    contrasts: []
  - pattern: いまいち
    function_cn: 口语表达，本为副词，表示水平或结果不令人满足、与期待稍有差距；用作名词时表示未达到令人满足的程度。
    formation: 副词／名词
    constraints: []
    contrasts: []
  - pattern: 切っても切れない
    function_cn: 惯用表达，表示某些事物之间的联系非常紧密、即使想分割也无法分割。
    formation: 动词て形＋も＋否定形
    constraints: []
    contrasts: []
  - pattern: 感情を表す慣用表現（表示吃惊）
    function_cn: 用惯用表达表示出乎意料、惊讶、目瞪口呆等情绪
    formation: 惯用语＋だ／である／～た 等，多作谓语或修饰
    constraints: []
    contrasts: []
  - pattern: 感情を表す慣用表現（表示担心）
    function_cn: 用惯用表达表示因某事而烦恼、内心焦虑不安
    formation: 惯用语＋で／で～て 等，常与结果状态连用
    constraints: []
    contrasts: []
  - pattern: 胸が張り裂ける／胸を痛める
    function_cn: 表示极度悲伤、心痛不已
    formation: 身体部位名词（胸）＋动词/形容词构成的惯用表达
    constraints: []
    contrasts: []
  - pattern: 満面の笑みを浮かべる／喜び勇む
    function_cn: 表示喜悦、笑逐颜开、欢呼雀跃
    formation: 身体/表情相关名词＋动词的惯用表达
    constraints: []
    contrasts: []
  - pattern: 肝を据える／ほぞを固める
    function_cn: 表示鼓起勇气、下定决心
    formation: 身体部位名词（肝、ほぞ）＋动词的惯用表达
    constraints: []
    contrasts: []
  - pattern: 足がすくむ／肝を冷やす／身の毛がよだつ
    function_cn: 表示恐惧、手足无措、惊出冷汗、毛骨悚然
    formation: 身体部位名词（足、肝、身の毛）＋动词/形容词的惯用表达
    constraints: []
    contrasts: []
  pragmatics:
  - 心身堂一方多用自谦语介绍工厂；相关项目负责人作为访客提问时可用非敬语
  - 提问时不直接发问，先铺垫以示礼貌
  - 回答后确认对方是否满意，避免答非所问
  - 「～ということですか」「～というわけですか」用上升语调时含强烈批评语气
  - 降调用于让对方意识到自己已理解其话意
  - 「ご覧に入れる」「ご覧になる」属于敬语（自谦/尊敬）表达，用于对老师、客户等场合。
