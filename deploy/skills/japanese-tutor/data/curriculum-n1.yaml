  themes:
  - 29 イベント打ち上げ
  - 语法与表达
  - （表达情感）
  - 表达喜悦的心情
  - 表达遗憾的心情
  - 〜ようだ 与 〜みたいだ
  - 〜までもない
  - 〜ぶり
  jlpt_estimate:
    status: unverified
  communication_functions:
  - 表达喜悦
  - 表达遗憾/失望
  - 迂回表达感谢与喜悦
  - 表达遗憾、惋惜（如「残念です」「寂しくなります」等表达感情的表达方式）
  - 提议干杯
  - 表达担心/致歉（让大家担心）
  - 表达必要性（必须）
  - 回避回答/表示无特别
  - 当场决定/提议
  - 提议（～ましょうか 句尾读降调或升调）
  - 祝贺晋升
  - 口语否定与纠正
  - 对客观情况或经验判断下的断言（～に決まっている）
  - 对努力/行为结果的肯定或否定评价（～かいがある／～かいがない）
  - 祝贺、寒暄（おめでとう／おめでとうございます）
  - 表达真正着手做某事或按他人意见考虑（その気になる）
  - 解释食物名称（肉じゃが、いなり寿司、たこ焼き）的构成与做法
  - 说明表达「人気を博す」与「人気がある」同义，限正式书面语、不用于口语
  grammar:
  - pattern: うれしいです / よかったです / うれしいくて仕方がありません
    function_cn: 直接表达喜悦心情
    formation: 形容词/动词过去式等直接陈述
    constraints:
    - 多用于朋友或家人之间，对使用场合有一定限制
    contrasts: []
  - pattern: 残念です / がっかりしました
    function_cn: 表达遗憾、失望的心情
    formation: 形容词/动词过去式等直接陈述
    constraints: []
    contrasts: []
  - pattern: 间接表达喜悦/感谢（如提及对方受益、周围人高兴）
    function_cn: 日常会话中省略直接喜悦表达，改说一半或表达周围人喜悦/感谢，避免直白
    formation: 叙述他人状态或自身感受的迂回说法
    constraints:
    - 用于避免直接表达自己喜悦心情的语用策略
    contrasts: []
  - pattern: 〜ようだ / 〜みたいだ
    function_cn: 推测表达，多用于描述不确定事情，有时也用于确定事情；相比断定式给人更委婉的印象，属习惯性委婉表达
    formation: 接于动词过去式等后（如「そろったようだ」）；名词后可接「みたいだ」（如「休業みたいだ」）
    constraints:
    - 与断定式相比语气更委婉
    contrasts:
    - 与断定式（如「そろいましたね」）相比更委婉
  - pattern: 〜までもない
    function_cn: 表示没必要做某事，且更明确强调没必要的理由
    formation: 动词基本形＋までもない
    constraints:
    - 强调没必要的理由
    contrasts:
    - 与「动词基本形＋必要がない」意思相同，但前者更强调理由
    - 与「动词基本形＋に及ばない／名词＋に及ばない」相比，后者仅表示没必要做某事且语气更正式
  - pattern: 〜ぶり
    function_cn: 表示样态，构成「活躍ぶり」「男ぶり」「話しぶり」等表达；常与评价性词语搭配
    formation: 前接部分名词或动词
    constraints:
    - 常与「すばらしい」「早い」「遅い」「うまい」「下手」等评价词搭配
    - 前接表示时间段的名词时不属此类用法
    contrasts: []
  - pattern: ～っぷり
    function_cn: 表示偏离正常水准的样子/状态
    formation: 口语中接动词，如“食べっぷり”“飲みっぷり”
    constraints: []
    contrasts: []
  - pattern: 提议干杯（乾杯）
    function_cn: 日式宴会中由客人或资格较老者提议干杯
    formation: 用“乾杯”表达提议
    constraints:
    - 语用：由客人或资历较深者发起
    contrasts: []
  - pattern: 心配をかける
    function_cn: 让……担心/操心
    formation: 心配为名词，心配する为动词；“～に心配をかける”表示使对方担心
    constraints:
    - “かける”表示给对方带来不良影响
    contrasts:
    - 与“迷惑をかける”意思相同
  - pattern: ～ないと
    function_cn: 必须（义务/必要）
    formation: “～ないといけない”省略“いけない”的形式
    constraints:
    - 常用于对话，后常省略“いけない”“困ります”等
    contrasts: []
  - pattern: 別に
    function_cn: 副词，表示“没有什么特别的”；用于应答或不愿回答时
    formation: 多与否定搭配“別に～ない”；可单独用于应答
    constraints:
    - 针对别人询问不愿回答时可用，但可能给人不礼貌的感觉
    contrasts: []
  - pattern: ～ましょうか
    function_cn: 句尾，除表疑问外还有当场做出决定的用法，表示说话人意志
    formation: 接在动词ます形去ます后
    constraints: []
    contrasts: []
  - pattern: 栄転
    function_cn: 指异地晋升；用于他人时前面加敬语前缀构成敬语表达；同义还有“出世”，但“栄転”为美化语，“出世”另含在社会中取得成功之意。
    formation: 名词，敬语形式为“ご栄転”
    constraints:
    - 用于同事等关系时可不加敬语前缀
    - 与“出世”语体色彩不同
    contrasts:
    - 出世
  - pattern: ～じゃないです
    function_cn: 口语否定表达，语气较为随便，不用于书面语。
    formation: 名词＋じゃないです／名词＋ではありません／名词＋じゃありません／名词＋ではありません
    constraints:
    - 仅限口语
    - 语气随便
    contrasts:
    - 名词＋ではありません（较正式）
  - pattern: たった
    function_cn: 副词，后接表示数量的词，强调该数量少；常与“だけ”搭配强调数量极少。
    formation: たった＋数量词／たった＋これだけ・それだけ・あれだけ
    constraints:
    - 后接数量词或“だけ”类词语
    contrasts: []
  - pattern: 業績を上げる
    function_cn: 表示工作或学术研究上取得成果；“上げる”表示取得成果，可搭配“成果”“実績”等。
    formation: 名词（業績／成果／実績）＋を上げる
    constraints:
    - “業績”指成就、业绩
    contrasts:
    - 成果を上げる
    - 実績を上げる
  - pattern: ～に決まっている
    function_cn: 表示说话人根据经验或客观情况的判断，对未直接确认的事情下断言。
    formation: 小句（简体形式）+に決まっている；二类形容词／名词+に決まっている
    constraints: []
    contrasts: []
  - pattern: ～かいがある
    function_cn: 表示获得与行为、努力相称的结果；否定形～かいがない表示白费、无效果。
    formation: 动词（简体形式）+かいがある；名词+のかいがある
    constraints:
    - 「かい」前面多为努力或行为的内容
    contrasts:
    - ～かいがない（相反，表示无效果）
  - pattern: おめでとう
    function_cn: 表示“值得庆祝”“很令人高兴”等意思；用于寒暄时的敬语表达为「おめでとうございます」。
    formation: 在一类形容词「めでたい」前加「お」而来
    constraints: []
    contrasts: []
  - pattern: その気になる
    function_cn: 表示真正有着手做某事的想法，含集中精力认真处理的语气；此外还有“按照别人说的去考虑”的意思。
    formation: 「その気」表示想真正做某事的想法，后接「になる」
    constraints: []
    contrasts: []
  - pattern: ～うえで
    function_cn: 表示目的/先后顺序：前接动词基本形表示“为了A，在此之前先做B”；前接动词“た”形表示先做A然后做B。含意志性、有准备含义，语气较正式，多用于书面语。
    formation: 动词基本形／动词た形 ＋ うえで
    constraints:
    - 与“AをしてからB”相比更正式、有意志性
    - 多用于书面语
    contrasts:
    - AをしてからB
  - pattern: 非常に
    function_cn: 表示程度的副词，意为“非常、相当”，起强调后面词语的作用，属较正式说法。
    formation: 副词，修饰形容词/动词
    constraints:
    - 较正式
    contrasts:
    - たいへん
    - とても
    - 実に
    - 本当に
  - pattern: 何でもない
    function_cn: 表示“没什么特别的”“不是什么大问题”，用于淡化某事的重要性。
    formation: 何でもない（固定表达）
    constraints: []
    contrasts: []
  - pattern: そう～ではない
    function_cn: 表示“并非如此/并不～”，对前文所述情况进行否定或转折。
    formation: そう＋二类形容词＋ではない；そう＋一类形容词词尾“い”变“く”的形式＋な…（接续在页面底部被截断）
    constraints: []
    contrasts: []
  - pattern: ～とはいうものの
    function_cn: 表示转折关系，意为“虽说如此、尽管如此”；与表示转折的“～が”意思相同，但更偏书面语；还可作为连词独立用于句首。
    formation: 小句（简体形式）＋とはいうものの；二类形容词／名词＋なもの＋の（与“小句（简体形式）＋＋ものの”意思基本相同）。
    constraints:
    - 比“～が”更常用于书面语
    - 可独立用于句首作连词
    contrasts:
    - 与“～が”（初级第16课）意思相同，但语体更书面
  - pattern: ～が望ましい
    function_cn: 表示“希望……”“最好……”，是正式的书面用语，可用于委婉的命令。
    formation: 一般前接助词“が”，使用“～が望ましい”的形式。
    constraints:
    - 正式书面用语
    - 用于委婉命令
    contrasts: []
  - pattern: 何しろ～（な）ので
    function_cn: “何しろ”为副词，意思是不必考虑其他，用于强调原因、理由等场合。
    formation: 何しろ＋小句（简体形式）＋ので；何しろ＋二类形容词／名词＋なので；何しろ＋小句（简体形式）＋から；何しろ＋二类形容词／名词＋だから。
    constraints:
    - 用于强调原因、理由
    contrasts: []
  - pattern: いつまでも
    function_cn: 副词，表示没有时间限制，即无论何时；与「どこまでも」（无空间限制，无论到哪里）对照使用。
    formation: 副词，独立使用，常修饰动词或形容词。
    constraints: []
    contrasts:
    - どこまでも
  - pattern: 飛び散る
    function_cn: 复合动词，表示四处飞散。
    formation: 由动词「飛ぶ」与「散る」构成的复合动词。
    constraints: []
    contrasts: []
  - pattern: びっしり
    function_cn: 副词，表示很多东西很紧密地排放在一起，没有空隙。
    formation: 副词，常与「詰まる」「詰まっている」等搭配。
    constraints: []
    contrasts: []
  - pattern: ～でもすれば
    function_cn: 表示仅举出一个极端事例，含“万一……”之意，用于假设某种极端情况发生后的后果。
    formation: 多用于三类动词；偶尔用于第一、二类动词，此时「でも」前接动词「ます形」去掉「ます」的形式。
    constraints:
    - 主要接三类动词
    - 第一二类动词时接ます形去ます
    contrasts: []
  - pattern: ～にすら
    function_cn: 举出极端例子，表达说话人意外心情；与「さえ」意思相同，但「すら」主要用于书面语
    formation: 前接名词或“名词＋助词”的形式
    constraints:
    - 与助词连用时的合并形式：が＋すら＝すら、を＋すら＝すら、に＋すら＝にすら、と＋すら＝とすら、へ＋すら＝へすら、から＋すら＝からすら
    contrasts:
    - 与「さえ」同义，但语体偏书面
  - pattern: ～にあって
    function_cn: 表示“在……之际……”
    formation: 一般使用“动词（基本形）＋にあって”“名词＋にあって”的形式
    constraints: []
    contrasts: []
  pragmatics:
  - 直接喜悦表达限于亲密关系场合
  - 日常会话倾向省略或半截式表达
  - 「〜ようだ／〜みたいだ」用于给听话人更委婉的印象，属习惯性委婉表达
  - “別に”用于应答时可能显得不礼貌
  - 提议干杯由客人或资历较深者发起
  - “～ましょうか”表提议时句尾可升调或降调
  - “～じゃないです”语气随便，限口语
  - 「おめでとう」用于寒暄时改用敬语「おめでとうございます」
  - 「人気を博す」用于正式书面语，不用于口语
