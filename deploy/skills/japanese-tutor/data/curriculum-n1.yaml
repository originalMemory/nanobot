  grammar:
  - pattern: 使役态（动词使役形 + せる／させる）
    function_cn: 表示让/使某人做某事；可用于使役请求（～させてください）、使役建议（～させましょうか）及使役进行（～させている）
    formation: 一段动词去ます形词干＋せます／させます；五段动词 u→o 段＋せます／させます；サ变动词 させます
    constraints:
    - 使役者为主语，被使役者用「を」标记
    - 与自発态、可能态在语义上需区分
    contrasts:
    - 使役态 vs 自発态（～てしまう／～てしまう 等）
    - 使役态 vs 可能态（～られる）
  - pattern: ～やすい（容易做某事）
    function_cn: 表示某事容易进行、做起来方便
    formation: 动词ます形词干＋やすい（如 書きやすい）
    constraints:
    - 多用于描述动作的难易程度
    contrasts:
    - ～やすい vs ～にくい（难以做某事）
  - pattern: 使役形式（使役形）
    function_cn: 表示使役主体强制或指示动作主体进行动作，也可表示对动作主体行为的许可或放任
    formation: 一类动词：把ない形的「ない」变为「せる」；二类动词：把「ない」变为「させる」；三类动词：「来る」→「来させる」、「する」→「させる」
    constraints:
    - 「（さ）せます」与二类动词活用方式相同
    contrasts: []
  - pattern: 名は名を 自动（さ）せます
    function_cn: 使役句中使役主体作主语，动词为自动词时动作主体用助词「を」表示
    formation: 使役主体＋は＋动作主体＋を＋自动词使役形
    constraints: []
    contrasts: []
  - pattern: 名は名に名を 他动（さ）せます
    function_cn: 使役句中使役主体作主语，动词为他动词时动作主体用助词「に」表示
    formation: 使役主体＋は＋动作主体＋に＋宾语＋を＋他动词使役形
    constraints:
    - 动作主体用「に」而非「を」，因日语一般避免同句重复使用「を」
    contrasts: []
  - pattern: 使役被动形式（使役形式＋被动形式）
    function_cn: 表示一种被迫性的动作
    formation: 一类动词：把ない形的ない变成される；二类动词：把ない形的ない变成させられる；三类动词：把来る变成こさせられる、把する变成させられる
    constraints:
    - 由使役形式加被动形式构成
    contrasts: []
  - pattern: 动(さ)せてください
    function_cn: 请求别人允许自己做某事
    formation: 动词使役形＋てください
    constraints:
    - 说话人一般不出现
    - 需特别强调时可用わたしを／わたしに的形式
    contrasts: []
  - pattern: 动やすいです／にくいです
    function_cn: 表示事物的某种性质；やすい表示易于，にくい表示难于
    formation: 动词ます形去掉ます加やすいです／にくいです
    constraints: []
    contrasts:
    - やすい＝易于～
    - にくい＝难于～
  - pattern: お＋動詞ます形（去ます）
    function_cn: 动词转换为名词，前接敬语前缀「お」构成名词
    formation: ます形去「ます」后加「お」
    constraints:
    - 仅部分动词的ます形去ます后可作名词使用
    contrasts: []
  - pattern: ～てもらいます vs 使役形（～させます）
    function_cn: 两者功能相近，均涉及让他人做某事
    formation: ～てもらいます 表委托；使役形 表使令
    constraints:
    - 使役形为直接命令，语气强硬
    - ～てもらいます 为委托，语气柔和
    contrasts:
    - 使役形（直接命令、强硬）与 ～てもらいます（委托、柔和）的语气差异
  - pattern: ～のではないですか
    function_cn: 婉转陈述意见，表达委婉的肯定
    formation: ～＋の＋ではない＋ですか（否定＋疑问）
    constraints:
    - 相当于「～と思います」但更委婉
    - 句尾读降调
    contrasts:
    - 比「～と思います」更委婉
  - pattern: ぐっと
    function_cn: 拟声词，本意动作急促、力度大，引申为变化幅度大或动作迅猛
    formation: 拟声词
    constraints: []
    contrasts: []
  - pattern: 正式口语体 vs 非正式口语体（语用层级对比）
    function_cn: 区分正式与随便的口语表达层级，用于商务、学术发表等正式场合与日常随意场合的对应替换
    formation: 正式：言うまでもなく／～のではないですか／やはり／など；非正式：もちろん／～んじゃない？／やっぱり／なんか
    constraints:
    - 正式口语体多用于商务、学术发表等场合
    - 非正式口语体用于随意场合
    contrasts:
    - 言うまでもなく ↔ もちろん
    - ～のではないですか ↔ ～んじゃない？
    - やはり ↔ やっぱり
    - など ↔ なんか
  pragmatics:
  - 使役请求中用「～させてください」表达礼貌请求
  - 使役建议中用「～させましょうか」表达主动提议
  - 使役被动含被迫、被要求语感
  - 请求允许句型中说话人默认省略，强调时显性出现
  - 敬语前缀「お」表尊敬
  - 否定加疑问构成委婉肯定，句尾降调
  - 口语体自身分正式与随便，正式口语体除商务外多用于学术发表等场合
  - 职场会议中向对方公司说明方案的礼貌表达
  - 使用「～ほうがいい」「～と思います」委婉表达建议与看法
