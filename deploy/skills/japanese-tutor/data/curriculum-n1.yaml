  - 天气与活动取消
  - 宾馆/酒店：房间类型（单人房、双人房、套间等）、入住/退房、前台、迎宾、接送、小费、送餐/叫醒服务、房号/住宿单位
  - 再会（重逢）
  - 着きます（到达）
  - スーツケース（旅行箱）
  - 小物（小东西）
  - トランク（后备箱）
  - 運転手（司机）
  - 穿戴服饰
  - 家居与电器状态
  - 日常物品与动作（伞、钥匙、T恤、书）
  - 工作/团队（团队、输、工资、社长、忙）
  - 感官与状态（热、辣、有精神、好吃）
  - 衣物穿着
  - 家居/电器
  - 饮食
  - 日常动作
  - 旅行与行李（スーツケース、トランク、スーツ、ズボン、Tシャツ、サンダル、帽子、腕時計、小物、運転手）
  - 运动与团队（運動会、チーム、最後、再会、久しぶり）
  - 动作与状态动词（やむ、建ちます、並びます、着きます、かぶります、はきます、飼います、消えます、掛けます、落ちます、割れます、建てます、負けます、汚れます、閉まります、壊します、割ります、付けます、掛かります、汚します）
  - 形容词与副词（偉い、楽、残念、急に、全部、相変わらず、うっかり）
  - 连词与寒暄（それにしても、お久しぶりです）
  similar_contrasts:
  - 自动词表自身变化/状态，他动词表使动/施加动作
  - 与“自动词た形”对比：た形偏重变化完成，～ています偏重变化完成后的结果状态
  - 与表示传闻的そうです（动词た形／形容词＋そうです）区分，本页为样态／推测用法
  - 自动词强调‘已经定下来/开始了’的结果，他动词促使听话人意识到决定/开始主体
  - 与～かな语义相近，但～かしら多为女性使用
  - 与「お久しぶりです」相比语感更亲切、略随意
