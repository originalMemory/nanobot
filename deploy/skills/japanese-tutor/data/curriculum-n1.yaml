  communication_functions:
  - 婚礼致辞（結婚披露宴でのスピーチ）
  - 祝贺新婚（ご結婚おめでとうございます）
  - 自我介绍与说明关系（自己紹介・関係の説明）
  - 致谢与回应致辞（スピーチへの礼・感想）
  - 致辞的开头（客套话、自谦表达、自我介绍）
  - 致辞的中心内容（回忆、实际体验、轶闻趣事穿插，引用谚语或名言）
  - 致辞结束语中的客套话（如婚礼「どうかお幸せに」、入学典礼「頑張ってください」）
  - 提议干杯的客套话（致辞最后提议，先确认是否所有人都已举杯）
  - 致辞中郑重表达「この度」「本日」，以及避免不吉利用语（如「切る」「別れる」「終わる」，改用「お開きにする」）
  - 事先向他人转达信息
  - 为某人预先做好某事（如调节室温）
  - 会食/交流会开场致辞
  - 对出席客人致谢
  - 答谢宴请
  - 提议干杯（祝健康与兴旺）
  - 闭会致辞与致谢
  - 介绍新成员
  - 新成员初次见面客套
  grammar:
  - pattern: ありがとうございます／おめでとうございます
    function_cn: 致辞开头的主要客套话（感谢／祝贺）
    formation: 句末敬语，置于致辞起始
    constraints:
    - 用于婚礼、欢送会、欢迎会等致辞开头
    contrasts: []
  - pattern: ご指名により／僭越ながら／ひと言ごあいさつを申し上げます
    function_cn: 客套话的自谦表达，表示谦逊态度
    formation: 自谦短语＋「申し上げます」等
    constraints:
    - 用于请允许我简单说两句等谦辞
    contrasts: []
  - pattern: ～と申します
    function_cn: 自我介绍姓名与工作单位
    formation: 名词＋「と申します」
    constraints:
    - 婚礼等场合需表明与致辞对象的关系时使用
    contrasts: []
  - pattern: ～という言葉があります
    function_cn: 引用谚语或名言表达祝福心情
    formation: 引用内容＋「という言葉があります」
    constraints:
    - 引用名言时的常用表达方式
    contrasts: []
  - pattern: ご／お＋动词（ます形去ます）＋いただく／いただきます
    function_cn: 抬高实施动作的人的表达方式，表示说话人从动作实施者那里得到好处（敬语）。
    formation: 动词为和语词时前面加「お」；为「汉字名词＋する／します」的动词时使用「ご＋汉字名词＋いただく」的形式。
    constraints:
    - 用于表达从对方动作中受益的敬语场合
    contrasts: []
  - pattern: ともに／～とも
    function_cn: 「ともに」表示「いっしょに（～する）」（一起做～）或「どちらも（～になる）」（哪方都成为～）；「～とも」表示「全部、都」。
    formation: 「～」部分一般使用数量词（如「3人とも」）或表示组合的词语（如「夫婦とも」「両親とも」「親子とも」）。
    constraints:
    - 「～とも」的「～」需接数量词或组合名词
    contrasts:
    - 「ともに」与「～とも」用法不同：前者表共同/双方，后者表全部
  - pattern: ～ておく
    function_cn: 为了某事而事先特意实施某动作，以备后用
    formation: 动词て形＋おく
    constraints:
    - 与单纯使用动词ます形相比，强调动作是为后续目的而预先完成
    - 与「～てあります」搭配时，主语为所传达/所处理的内容，表示动作完成后的状态
    contrasts:
    - 「～ます」侧重动作本身、含立即执行的语气；「～ておく」侧重事先预备、之后生效
  - pattern: ～からといって～とは限らない
    function_cn: 部分否定，说明理由与结果之间不一定成立、存在例外情况
    formation: 接小句（简体形式）+ とは限らない
    constraints:
    - 用于否定前项作为后项充分理由的因果关系
    - 与『全員合格しなかった』（全部否定）不同，本式仅否定『必然如此』，保留其他可能性
    contrasts:
    - 与『～から～ない』区分：本式否定理由与结果的关系，后者给出做出否定判断的理由
  - pattern: ～からといって～ない／～から～ない
    function_cn: 前者表示『作为理由不一定成立』，否定理由与结果之间的关系；后者表示说话人做出『～ない』判断的理由，结果中含否定
    formation: 小句（简体形式）+ からといって～ない／小句（简体形式）+ から + 含『ない』的否定表达
    constraints:
    - 『～から～ない』后接包含『ない』的否定表达，表示结果中含否定
    contrasts:
    - 与『～からといって～とは限らない』区分：本组强调理由与结果关系是否成立，而非单纯部分否定
  - pattern: 好み
    function_cn: 表示个人的喜好或偏好；『人+好み』表示某人的喜好
    formation: 名词，可作『～の好み』修饰或『人+好み』表所属喜好
    constraints:
    - 『好み』读作『このみ』
    contrasts: []
  - pattern: ある+名词
    function_cn: 表示不特定的人、事物、场所或时间等，作模糊/不指代表达
    formation: ある + 名词
    constraints:
    - 用于说话人知道具体情况但故意不明说
    - 用于说话人不十分清楚具体情况时采用的模糊表达
    contrasts: []
  - pattern: 行った
    function_cn: 表示“做、干”等意义的郑重表达方式；与「する」相比，用于所做之事及其顺序都很具体、清楚的情况；意思近似的词还有「実施する」。
    formation: 动词「行う」的过去式；可读作「いった」或「おこなった」。
    constraints:
    - 需根据前后文意思判断是「行く」还是「行う」的意思。
    contrasts:
    - する
    - 実施する
  - pattern: これを見ると
    function_cn: 指示图表（图表分析出来的内容紧接其后）。
    formation: 「これ」+「を見ると」，后接通过图表/资料分析得出的结论。
    constraints:
    - 「これ」在本课中指示图表。
    contrasts: []
  - pattern: ～が分かる
    function_cn: 表示“可以看到”或“可见”的意思（非“理解了”）；主要用于报告或论文中，阐述通过分析之后新发现的信息。
    formation: 常与表示信息来源的表达一起使用，如「～と」「～ということから」「～より」。
    constraints:
    - 用于说明所发现的信息时搭配信息来源表达。
    contrasts: []
  - pattern: ～のに対して
    function_cn: 表示以某事物与另外一事物做对比。
    formation: 小句（简体形式）+「のに対して」。
    constraints: []
    contrasts: []
  - pattern: ～のに対して（て）
    function_cn: 表示对比（与……相对/相反）
    formation: 小句（简体形式）+のに対して；二类形容词小句用二类形容词+のに対して；名词小句用名词+なのに対して／名词+であるのに対して；前接数量时可用「～であるのに対して（て）」或直接用「に対して（て）」接数量词
    constraints:
    - 属书面语
    - 用于对比两类事物或情况
    contrasts:
    - 与「～一方、～」在前后主语相同时语义不同（后者表“同时做某事”）
  - pattern: ～一方、～
    function_cn: 表示对比，或表示“同时做某事”
    formation: 小句（简体形式）+一方、～；或 小句（简体形式）+一方で、～
    constraints:
    - 用于连接小句
    - “一方”前后主语相同时表示“同时做某事”
    - 表示独立内容时“一方”可作连词使用
    contrasts:
    - 与「～のに対して（て）」在前后主语相同时语义不同
  - pattern: ～である～
    function_cn: 名词A、B的表达方式“Aが（は）Bである”可改写成“BであるA”的形式
    formation: 名词+である+名词
    constraints:
    - 本页仅起始说明，完整规则需结合后续页
    contrasts: []
  - pattern: Bである / BのA
    function_cn: 注释性地添加信息“Bである”与限定修饰“BのA”两种形式的区别
    formation: 名词/动词等 + である；B + の + A
    constraints:
    - 表示注释性追加信息时用“Bである”
    - 表示限定修饰时一般用“BのA”
    contrasts:
    - 注释性添加 vs 限定修饰
  - pattern: ～ら（同僚）
    function_cn: 接表示人的名词或代词，表示复数
    formation: 表示人的名词/代词 + ら
    constraints:
    - 第三人称“彼”“彼女”只能接“～ら”
    contrasts:
    - 与“～たち”“～がた”意义相同
    - “～がた”含敬意
    - “～たち”比“～ら”更礼貌
  - pattern: ～を占めていた
    function_cn: 表示某人或某事物在整体当中所占的数量比例
    formation: 数量词 + を占める（过去/持续态占めていた）
    constraints:
    - 需与表示整体的“全体”等搭配说明比例
    contrasts: []
  - pattern: 惯用句（惯用语）
    function_cn: 两个以上词语组合产生新义的固定说法，整体表达派生性、比喻性含义，不能逐词理解
    formation: 固定搭配，形式与用法受限，不能随意替换其中词语、改变否定/肯定形式或在中间插入其他词语
    constraints:
    - 形式固定，不可用其他词语随意替换
    - 不可随意改变否定或肯定形式
    - 不可改变语序或插入其他词语
    contrasts:
    - 正确惯用形式 vs 错误替换/否定/语序变化（如 気に食わない 不可改为 気に食う／気に食べない）
  - pattern: 身体部位词语构成的惯用句
    function_cn: 用目・耳・口・鼻・手・足・胸・腹等身体部位词表达感觉或心情
    formation: 身体部位名词 + 动词/形容词构成的固定惯用表达
    constraints: []
    contrasts: []
  pragmatics:
  - 致辞中的敬语与谦让表达
  - 引用中国俗语「白頭偕老」作祝福
  - 小规模聚会可全体成员分别说几句，或指定某人在开始、干杯、结束等环节致辞
  - 其他人员不知自己与致辞对象关系时需表明关系
  - 日本一般没有为表示谦逊而将自己的杯子放低一些的习惯
  - 婚礼致辞中最好避免说「切る」「別れる」等不吉利的话
  - 使用敬语（～させていただきます、～いたしました、～ください）表达正式场合的礼貌
  - 介绍他人时使用「～です」并附称呼「さん」
