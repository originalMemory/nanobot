  grammar:
  - pattern: ～に～が～あります
    function_cn: 表示某处存在某物（无生命存在句）
    formation: 场所＋に＋存在物＋が＋数量＋あります
    constraints:
    - 用于无生命事物的存在；有生命用 います
    - 存在物用 が 提示
    contrasts:
    - ～に～が～います（有生命存在）
  - pattern: 数量表达（～冊／～時間／～回／～枚／～か月）
    function_cn: 用助数词表示数量、时长、次数、张数、月数
    formation: 数词＋助数词
    constraints:
    - 助数词需与名词类别匹配（本→冊、明信片→枚、时间→時間、次数→回、月→か月）
    contrasts: []
  - pattern: 频率表达（毎日／1週間に2回／1か月に2回ぐらい）
    function_cn: 表示动作发生的频率与大致次数
    formation: 时间范围＋に＋回数＋（ぐらい）
    constraints:
    - ぐらい 表示约数
    contrasts: []
  - pattern: ～に～がかかります
    function_cn: 表示花费时间
    formation: （手段/范围）＋に＋时长＋ぐらい＋かかります
    constraints:
    - 主语为所花费的时间
    contrasts: []
  - pattern: ～に～に行く／来る（目的表达）
    function_cn: 表示为某目的而去/来
    formation: 目的地＋へ＋目的动词＋に＋行く/来る
    constraints:
    - 目的用动词连体形＋に
    contrasts: []
  - pattern: 名[数量]+动
    function_cn: 数量词（助数词）置于动词前，修饰名词以表示数量；量词须按所修饰名词的类别选择。
    formation: 名词 + 数量词 + 动词（如 食べます／買いました／飲みました／います／あります）
    constraints:
    - 量词因名词种类而异，不可混用。
    - 询问数量时在「何」后接量词，如「何個」「何本」「何冊」，此时「何」须读作「なん」。
    - 指动物时大动物用「頭」、小动物用「匹」，无汉语「条」「只」等对应。
    - 「～つ」用于1～9岁年龄、立体物、抽象事物，不用于10以上的数字。
    contrasts:
    - 日语量词搭配范围比汉语更广泛，用法相对简单。
  - pattern: 量词分类表
    function_cn: 按名词类别选用对应量词。
    formation: ～人（人）／～台（机械车辆）／～枚（薄平物）／～冊（书册）／～歳（年龄）／～回（次数）／*～着（衣服）／～個（立体物、空容器、抽象概念）／～本（细长物）／～杯（容器内饮料）／～匹（小动物）／～頭（大动物）／*～羽（鸟、兔）／*～番（顺序）／*～足（成对物）／*～つ（1～9岁年龄、立体物、抽象事物）
    constraints:
    - 带星号项为扩展或较难量词。
    - 「～つ」不用于10以上的数字。
    contrasts: []
  - pattern: 名[时间]＋動
    function_cn: 表示动作、状态的持续时间
    formation: 表示时间数量的词语直接接动词
    constraints:
    - 时间数量词后不能加「に」
    contrasts: []
  - pattern: 名[时间]に＋名[次数]＋動
    function_cn: 表示在一定时间内进行若干次动作
    formation: 时间名词加「に」，再接次数名词与动词
    constraints: []
    contrasts: []
  - pattern: 动词的「ます形」
    function_cn: 动词「ます形」去掉「ます」后的形式，用于后续各种句型接续
    formation: 如「働き」「休み」「起き」「寝」
    constraints: []
    contrasts: []
  - pattern: 名[场所]へ＋動に＋行きます／来ます
    function_cn: 表示移动行为的目的
    formation: 场所名词加「へ」，动词用「ます形」去掉「ます」的形式加「に」，再接「行きます／来ます」
    constraints:
    - 句型中名词须为表示场所的名词
    contrasts: []
  - pattern: 名[数量]＋で
    function_cn: 用于不称重量而以数个计数的售物
    formation: 数量名词加「で」
    constraints:
    - 数量为1个时不加「で」
    contrasts: []
  - pattern: 数词＋量词搭配
    function_cn: 日语计数时数词与量词组合，读音依量词类型与数字组合发生变化
    formation: 数词（汉字音或日本固有数法）＋量词（～つ/～人/～台/～個/～本/～杯 等）
    constraints:
    - ～台/～枚/～番 等量词与数字组合时读音不变
    - ～個/～階/～回 等与 1、6、8、10 组合时数字发生促音变
    - ～本/～杯/～匹 与 1、3、6、8、10 组合时数字与量词读音均变化
    - 7 人 可作 ななにん 或 しちにん
    contrasts:
    - 汉字音数法（いち、に、さん…）与日本固有数法（ひと、ふた、みっ…）的适用量词不同
  - pattern: 期間に 回数（～に ～回）
    function_cn: 以一定期间为基准表示频率
    formation: 期间名词（日/月/年/週）＋に＋回数
    constraints:
    - 完整形为「1 週間に 2 回」，常省略数字 1 与「間」，变为「週に ～回」
    - 1 日に→日に、1 か月に→月に、1 年に→年に
    contrasts: []
  - pattern: 省略量词直接计数
    function_cn: 口语中省略量词，直接用固有数词或「数字＋個」计数
    formation: ひとつ/ふたつ… 或 1 個/2 個…
    constraints:
    - 用于较随意的计数场合
    contrasts: []
  - pattern: くらい／ぐらい
    function_cn: 接在表示数量的词后，表示大概的数量；可与副词 だいたい 同时使用；询问时使用 どのぐらい（也说 どれぐらい）。
    formation: 数量词 + くらい／ぐらい
    constraints:
    - 与 だいたい 同义，可并用
    - 询问形式为 どのぐらい／どれぐらい
    contrasts:
    - くらい 与 ぐらい 意思相同
  - pattern: どのぐらい かかりますか
    function_cn: かかります 用于时间和钱，相当于汉语的“需要、花费”；询问所需时间或费用。
    formation: （时间／金钱）+ どのぐらい + かかりますか
    constraints:
    - かかります 限定用于时间与金钱
    contrasts: []
  - pattern: のみに いきます
    function_cn: 不指明具体饮品（如 お茶、ジュース）而只说 飲みに行く 时，指“去喝酒”。
    formation: 飲む + に + 行く
    constraints:
    - 省略具体宾语时默认指饮酒
    contrasts: []
  - pattern: とりあえず
    function_cn: 从具有可能性的几种动作或事项中暂且选择一种先做，暗示其他动作或事项等一会儿还会随后进行；在饭店点菜时常用，表示先点容易决定的部分。
    formation: 副词，置于句首或动词前
    constraints:
    - 暗示其余事项随后进行
    contrasts: []
  pragmatics:
  - 请求用 ください（礼貌请求）
  - 应答用 はい
  - とりあえず 用于点菜场景，让店家先上易决定的菜，其余稍后再点
