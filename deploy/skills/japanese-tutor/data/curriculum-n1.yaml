  grammar:
  - pattern: ～の時
    function_cn: 表示某一动作或状态发生的时间点或时期，作时间状语
    formation: 动词连体形／名词／い形容词词干／な形容词词干＋の時
    constraints:
    - 后接主句描述该时段的动作或状态
    - 可与过去时、现在时搭配
    contrasts: []
  - pattern: ～ながら
    function_cn: 表示两个动作同时进行，前项为伴随动作
    formation: 动词ます形去ます＋ながら
    constraints:
    - 前后动作主体通常一致
    - 前项多为持续或伴随性动作
    contrasts: []
  - pattern: ～ましょう
    function_cn: 表示向对方提议共同做某事
    formation: 动词ます形去ます＋ましょう
    constraints:
    - 用于邀请、建议，常以疑问或陈述语气出现
    contrasts: []
  - pattern: 小句(简体形) + 時
    function_cn: 表示时间的名词短语，前项为后项动作进行的时间
    formation: 动词小句分两种：基本形+時表示后项动作实现时前项动作尚未完成；た形+時表示前项动作已完成。一类形容词小句用简体形直接连接時；二类形容词小句用二类形容词+な+時；名词小句用名词+の+時
    constraints:
    - 只有名词做修饰语时才在名词与時之间加の，其他词语做修饰语一律不加の（如不能说『～するの時』『～忙しいの時』）
    - 表示一次性、个别的情况时，可在時后加に，用～時に的形式
    contrasts:
    - 基本形+時（前项未完成）与た形+時（前项已完成）的时态区别
  - pattern: 动词 + ながら
    function_cn: 表示同一主体同时进行两个动作，其中后面的动作是主要动作
    formation: 动词ます形去掉ます加ながら
    constraints: []
    contrasts: []
  - pattern: 小句(简体形) + でしょう？
    function_cn: 表示确认
    formation: 小句简体形后接でしょう
    constraints:
    - 用法一：确认对方比自己更为熟悉的事情，含请听话人告知某种信息的语感，读升调
    - 用法二：用于对方和自己意见不同，或叮问对方时，读降调
    contrasts:
    - 升调（请对方告知信息）与降调（意见不同或叮问）的语用区别
  - pattern: ～ね / ～でしょう
    function_cn: 向对方确认；～ね用于说话人认为双方意见一致的情况，～でしょう用于双方意见不一致时；确认大体一致的意见时用～ね更礼貌
    formation: 句末助词ね / 助动词でしょう
    constraints:
    - 确认双方意见大体一致时宜用～ね，用～でしょう可能显得不礼貌
    contrasts:
    - ～ね 与 ～でしょう 在确认语境下的礼貌度差异
  - pattern: 動詞て形＋います
    function_cn: 表示反复或习惯性动作；表示习惯时可用动词ます形代替
    formation: 动词て形＋います
    constraints:
    - 句中出现表示时间起点的形式（如“先月から”）时，一般不用“～ます”而用“～ています”
    contrasts:
    - ～ています 与 ～ます 在习惯性动作中的可替换性及时间起点限制
  - pattern: 職業名詞＋を＋しています
    function_cn: 表示现在正在从事的工作
    formation: 表示职业的名词＋を＋しています
    constraints: []
    contrasts: []
  - pattern: 名詞＋で
    function_cn: 助词“で”加在名词后表示原因、理由
    formation: 名词＋で
    constraints: []
    contrasts: []
  - pattern: 名詞＋と会います
    function_cn: 表示互动行为的动词（如结婚、吵架等）进行同一动作的另一方用“と”表示；“会います”可用“に”也可用“と”，用“と”时含互动语感
    formation: 名词＋と＋会います
    constraints:
    - 表示互动行为的动词另一方只能用“と”
    contrasts:
    - “に”与“と”在“会います”中的语感差异（“と”含互动）
  - pattern: 甲は乙と～ / 甲と乙とが～
    function_cn: 前者中甲是主语；后者中甲乙双方都是主语，第二个“と”有时省略不用
    formation: 甲は乙と～ / 甲と乙とが～
    constraints:
    - “甲と乙とが～”中第二个“と”可省略
    contrasts:
    - 两种表达形式中主语归属的差异
  - pattern: アルバイト
    function_cn: 词汇：打工；日语中多指学生利用课外时间工作的情形。
    formation: 名词
    constraints: []
    contrasts: []
  - pattern: ～に通っています
    function_cn: 表示定期来往返于同一场所，与表目的地的「に」搭配。
    formation: 动词「通う」的持续/习惯态，接「に」表目的地
    constraints:
    - 含往返含义
    contrasts:
    - 「～に行きます」仅表从一地移动到另一地，无往返含义
  - pattern: 大勢
    function_cn: 表示人多，可修饰名词或动词。
    formation: 副词性/连体修饰，如「大勢の人」「人が大勢いる」
    constraints:
    - 一般不能直接做谓语（如「人が大勢です」不自然）
    - 只用于人
    contrasts:
    - 「たくさん」可表人多，也可用于人以外事物
  - pattern: お年寄り
    function_cn: 带敬意与亲切感的「老人」说法（「年寄り」前加敬语「お」）。
    formation: 名词
    constraints:
    - 不能直接用来称呼对方
    contrasts:
    - 直接称呼对方时用「おじさん」「おばあさん」等
  - pattern: そう言えば
    function_cn: 由正在进行的对话或现场某种情况联想到另外一些情况时使用（说起来、这么一说）。
    formation: 接续在话题转换处
    constraints: []
    contrasts: []
  - pattern: へえ
    function_cn: 叹词，用于对听到的信息表示惊讶或钦佩
    formation: 独立感叹语，置于句首回应对方陈述
    constraints: []
    contrasts: []
  pragmatics:
  - 使用敬体（です／ます）进行日常会话
  - 用「～てください」表达礼貌请求
  - 用「～のです／～んです」解释说明原因
  - でしょう的两种确认用法通过语调（升调/降调）区分语用功能
  - ～ね 与 ～でしょう 在确认对方意见时的礼貌度选择
  - 「お年寄り」含敬意与亲切感，但不可直接称呼对方，直接称呼需改用「おじさん／おばあさん」等。
