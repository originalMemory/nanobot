  jlpt_estimate:
    status: unverified
  communication_functions:
  - 表达感谢
  - 转达谢意/问候
  - 公开致谢
  - 归因于对方恩惠
  - 以歉意表达谢意
  - 致谢与致歉
  - 回应他人感谢（谦让）
  - 场景化告别感谢（住宿/乘车/用餐）
  - 表达成功后的感慨
  grammar:
  - pattern: 表达感谢的固定表达
    function_cn: 表示感谢、致谢，含向不在场者转达谢意、公开致谢等语用层次
    formation: 固定短语/敬语表达，如感谢、承蒙照顾、转达问候、衷心感谢等说法
    constraints:
    - 向不在场的人表达谢意时使用转达问候的说法
    - 公开致谢时使用更郑重的感谢表达
    contrasts: []
  - pattern: 表明从对方得到恩惠的表达
    function_cn: 表示受到对方照顾并表达谢意，强调成果源于对方帮助
    formation: ～のおかげ、～あってこそ、おかげさままで 等接续形式
    constraints:
    - 用于归因于对方帮助/恩惠的语境
    contrasts: []
  - pattern: 以歉意表达谢意
    function_cn: 因从对方得到恩惠而给对方添麻烦，用道歉方式表达谢意
    formation: すみませんでした、申し訳ありませんでした 等道歉表达
    constraints:
    - 用于给对方添不必要负担而道歉，并非做了不好的事
    contrasts: []
  - pattern: 感谢/致歉的礼貌表达（承蒙多方协助、给您添了不少麻烦）
    function_cn: 向对方表达感谢与歉意，属正式寒暄/致谢语
    formation: 敬语致谢句 + 致歉句，可独立使用
    constraints:
    - 用于正式场合或书面致谢
    contrasts: []
  - pattern: 特别举出对方为自己所做的事情 + 致谢
    function_cn: 通过具体列举对方所为来表达更礼貌的谢意，或表示惊讶于对方如此帮忙
    formation: 具体事项 + 感叹/疑问句，可与『ありがとう』等并用
    constraints:
    - 需先点明对方具体行为再致谢
    contrasts: []
  - pattern: 回应感谢：夸奖对方行为 / 『とんでもない』等
    function_cn: 当对方致谢时，借夸奖对方或表示『没那么回事』来回应，表示己方未做什么
    formation: 『いいえ』+ 归功对方 + 自谦；或『とんでもありません』
    constraints:
    - 用于被感谢时的谦让回应
    contrasts: []
  - pattern: 旅馆退房/下车/用餐后的感谢表达（お世話様でした、お世話になりました、ごちそうさまでした）
    function_cn: 在特定场景（退房、下车、用餐后）表示感谢与告别
    formation: 固定寒暄语，可替代『ありがとうございました』
    constraints:
    - 场景限定：住宿、乘车、用餐结束
    contrasts:
    - 『ありがとうございました』为通用致谢，上述为场景专用
  - pattern: 表示动作的名词 + の + 名词（如『出席の予定』『努力の結果』『勉強の成果』）
    function_cn: 名词组合，除『～する』外可用『の』连接
    formation: 动作名词 + の + 名词
    constraints:
    - 适用于『出席』『努力』等表示动作的名词
    contrasts:
    - 与『～する』动词化用法并列可选
  - pattern: 『やった』
    function_cn: 取得成功时表感慨，也可用于听到他人成功消息时
    formation: 独立感叹语
    constraints:
    - 用于成功/达成目标的情境
    contrasts: []
  - pattern: ついに
    function_cn: 表示花费时间或经过艰苦努力终于完成或实现某事；与「やっと」区分（「やっと」侧重期待之事终于实现，「ついに」侧重实现的结果）；「ついに～なかった」表示“到最后（仍）……”。
    formation: 副词用法，置于动词前
    constraints: []
    contrasts:
    - やっと
  - pattern: ここまで
    function_cn: 表示时间等抽象范围，指进展到某一阶段；区别于表示具体空间范围的用法。
    formation: 「ここ」+「まで」
    constraints: []
    contrasts:
    - ここ（具体空间）
  - pattern: ～ぞ
    function_cn: 男性用语，表示说话人强烈的感情或意志，多用于自言自语；用于强烈告知对方时不礼貌。
    formation: 接于句末
    constraints:
    - 不能接在命令句及疑问句后面
    contrasts: []
  - pattern: ～といい、～といい
    function_cn: 从众多事物中选出两个最具代表性的事例加以叙述，暗含除所举事例外还有很多；与「～も、～も」意思相同。
    formation: 名词＋といい、名词＋といい
    constraints: []
    contrasts:
    - ～も、～も
  - pattern: ～を surpass
    function_cn: 表示超过某一数量，多用于书面语；可修饰名词，也可作谓语
    formation: 名词/数量词 + を + surpass
    constraints:
    - 与‘～を surpass’意思相同，但‘～を surpass’多用于书面语
    - 用于超过某个较大数字，区别于‘～以上’（后者与数字大小无关）
    contrasts:
    - ‘～以上’与数字大小无关，可说‘1回以上’；‘～を surpass’用于超过较大数字
  - pattern: ～といったもの / ～なんていうもの
    function_cn: 从诸多事物中举例说明；也可表示说话人认为没有多少价值的事物
    formation: 名词 + といったもの / なんていうもの
    constraints:
    - ‘～なんていうもの’为口语中较随意的表达，书面语用‘～などというもの’
    - ‘～や～といったもの’‘～といったものや、～なんていうもの’等形式可举两个以上例子
    - 形式中的‘もの’有时可替换为‘こと’‘ところ’
    contrasts:
    - 口语‘～なんていうもの’ vs 书面‘～などというもの’
  - pattern: よく
    function_cn: 副词，本条小结其四种常用用法：表频率、表程度、表意外或感叹、以“よくも”表惊讶或憎恶；本页重点为第三种（意外/感叹）。
    formation: 副词，修饰动词或句子。
    constraints:
    - “よくも”形式用于表达惊讶或憎恶。
    contrasts: []
  - pattern: 押さえる
    function_cn: 本义为用手或工具“将……固定”；本页为派生用法，表示把某事物当作自己的东西抓住、把握或掌控。
    formation: 动词，可接“～ておく”等。
    constraints:
    - 派生义用于抽象事物（如会场、公式、票）的把握/掌控。
    contrasts: []
  - pattern: ～はもちろん
    function_cn: 接在名词后，表示“当然”“不用说”“自不待言”。
    formation: 名词＋はもちろん。
    constraints:
    - 书面语中使用“～は無論（のこと）”的形式。
    contrasts:
    - 口语“～はもちろん”与书面“～は無論（のこと）”对应。
  - pattern: 大きい（派生用法）
    function_cn: 表示对某种结果、成果影响很大，可用于正反两方面结果，常用于口语
    formation: 名词/名词短语＋が大きい
    constraints:
    - 此处非形容词“大”的本义，而是派生用法
    contrasts: []
  - pattern: 助词“の”（同位）
    function_cn: 表示同位关系，与“～である”意思相同
    formation: 名词＋の＋名词（＝である）
    constraints:
    - 所举事例较多时可用“などの”形式
    contrasts: []
  - pattern: 数（数字前缀）
    function_cn: 表示2～6数值较小的数字；“数百人”一般表示200～600人
    formation: 数＋量词（人/日/か月/本等）
    constraints:
    - 可后续其他量词，如数日、数か月、数本
    contrasts: []
  - pattern: 足を運ぶ
    function_cn: 惯用表达，表示为了某种目的特意去某处
    formation: 足を運ぶ（＋动词/句）
    constraints:
    - 仅表示“去”的意思时不能使用此表达
    contrasts: []
  - pattern: ～きれない
    function_cn: 表示动作、事件彻底完成（肯定形～きる）；其否定形～きれない表示动作或行为不能完成
    formation: 动词ます形去掉ます + きる / きれない
    constraints:
    - 用于动作实现起来有困难或比较重要的场合
    contrasts: []
  - pattern: ～通す
    function_cn: 表示不放弃、不改变想法，把某一动作坚持做到最后
    formation: 动词ます形去ます + 通す
    constraints:
    - 与～きる不同，不包含完成某个连贯性动作、行为的意思
    contrasts:
    - ～きる
  - pattern: 巻き寿司 / 握り寿司
    function_cn: 两类寿司的区分：用紫菜卷成筒状为巻き寿司，捏成一口饭团加配料为握り寿司
    formation: 词汇/文化主题
    constraints: []
    contrasts: []
  - pattern: 生の魚 / 生魚
    function_cn: 二者意思相同但读音不同：加「の」读なまのさかな，复合词读なまざかな
    formation: 复合词读音变化（促音/连音）
    constraints:
    - 并非所有复合词都发生此类读音变化
    contrasts: []
  - pattern: ～に応じた / ～に応じて
    function_cn: 表示因具体情况而异
    formation: 名词＋に応じた＋名词 / 名词＋に応じて＋动词
    constraints: []
    contrasts: []
  - pattern: ～から見ると
    function_cn: 表示从某种立场上审视、考虑问题
    formation: 名词＋から見ると
    constraints:
    - 可换用～から見れば、～から見て等形式
    contrasts: []
  - pattern: ～からいうと／～からいえば／～からいって
    function_cn: 用于从不同的立场、观点进行说明
    formation: 名词＋からいうと
    constraints:
    - 不能直接接在表示人的名词后
    contrasts:
    - 与名词＋から見ると用法相似，但后者可直接接表示人的名词
  - pattern: ～からすると／～からすれば／～からして／～からしても
    function_cn: 表示从不同立场来看
    formation: 名词＋からすると／からすれば／からして／からしても
    constraints: []
    contrasts: []
  - pattern: 助词「で」
    function_cn: 表示主体行为对象的状态（如以某种形式/方式普及、提交、出售）
    formation: 名词/动词连体形 + で
    constraints: []
    contrasts: []
  - pattern: ～もあれば～もある
    function_cn: 表示从众多例子中仅举其中两例（既有…也有…）
    formation: 名词/句子 + もあれば + 名词/句子 + もある
    constraints:
    - 常与「～もいれば～もいる」对应使用
    contrasts: []
  - pattern: 副词「こってり」
    function_cn: 表示味道浓厚、油腻；常用「こってりとした」形式
    formation: 副词，可修饰动词或构成「～とした」
    constraints: []
    contrasts:
    - 反义：「あっさり」（清淡）
  - pattern: ～に即した／～に即して
    function_cn: 表示依据、对应某种事态或状态而采取相应做法，语义接近「～に応じた／～に応じて」。
    formation: 名词＋に即した＋名词；名词＋に即して＋动词。
    constraints:
    - 只能接在表示事态、状态的名词后面
    - 可接在「法律」「計画」等作为判断、处理依据的名词后面
    contrasts:
    - ～に応じた／～に応じて（意思类似）
  - pattern: ～ならぬ
    function_cn: 表示否定、排除，意思同「～ではない」，属较旧说法，主要用于书面语。
    formation: 名词＋ならぬ。
    constraints:
    - 可与「～ではない」互换。
    contrasts:
    - ～ではない
  pragmatics:
  - 区分一般感谢、郑重感谢、向第三方转达谢意、以道歉形式致谢的语用层次
  - 正式场合致谢需更礼貌，可列举对方具体帮助
  - 被感谢时应谦让、归功对方
  - 「～ぞ」为男性用语，语用色彩强烈，非礼貌表达
  - 「うまい」作「おいしい」义使用时属较随便的说法。
