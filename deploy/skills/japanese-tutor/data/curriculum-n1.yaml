  grammar:
  - pattern: ～ます／～ません
    function_cn: 敬体肯定与否定，用于陈述日常动作与习惯
    formation: 动词ます形／ます形去ます加ません
    constraints:
    - 用于礼貌陈述，区别于简体
    contrasts:
    - 与简体「～る／～ない」语体不同
  - pattern: ～ました／～ませんでした
    function_cn: 敬体过去肯定与否定，用于询问或陈述已发生的动作
    formation: ます形去ます加ました／ませんでした
    constraints:
    - 用于过去时态的礼貌表达
    contrasts:
    - 与现在时「～ます」时态不同
  - pattern: ～ますか
    function_cn: 敬体疑问，用于询问对方是否做某事或做什么
    formation: ます形加か
    constraints:
    - 句末加か表疑问
    contrasts: []
  - pattern: 助词「を」
    function_cn: 标记动作的宾语（对象）
    formation: 接在名词后
    constraints:
    - 用于他动词的宾语
    contrasts:
    - 与「で」表场所、「と」表并列、「か」表选择功能不同
  - pattern: 助词「で」
    function_cn: 标记动作发生的场所
    formation: 接在表示场所的名词后
    constraints:
    - 用于表示动作地点
    contrasts:
    - 与「を」宾语标记不同
  - pattern: 助词「と」
    function_cn: 并列连接两个名词（和、与）
    formation: 接在名词后连接同类项
    constraints:
    - 用于并列宾语或对象
    contrasts:
    - 与「か」选择、「で」场所不同
  - pattern: 助词「か」
    function_cn: 在名词间表示选择（或）
    formation: 接在名词后
    constraints:
    - 用于二选一的对象
    contrasts:
    - 与「と」并列不同
  - pattern: ～ください
    function_cn: 请求对方给予某物或做某事（给我）
    formation: 名词加を加ください
    constraints:
    - 用于礼貌请求
    contrasts: []
  - pattern: いらっしゃいませ
    function_cn: 商业/服务场合的迎客寒暄（欢迎光临）
    formation: 固定寒暄语
    constraints:
    - 用于接待顾客
    contrasts: []
  - pattern: 名を動
    function_cn: 用助词「を」标记动作的对象（宾语），「を」读作「お」。
    formation: 名词 + を + 动词
    constraints:
    - 用于表示动作所作用的对象
    contrasts: []
  - pattern: 名[场所]で動
    function_cn: 用助词「で」表示动作进行的场所。
    formation: 名词（场所）+ で + 动词
    constraints:
    - 表示动作发生的地点
    contrasts:
    - 存在场所用「に」，动作进行场所用「で」；汉语两者都用“在”，日语需区分
  - pattern: 名か名
    function_cn: 在若干名词之间进行选择时，名词间加「か」，相当于汉语“或者”。
    formation: 名词 + か + 名词
    constraints:
    - 用于名词之间的选择/列举
    contrasts: []
  - pattern: 名をください
    function_cn: 买东西或在餐厅点菜时的请求形式，既可用于花钱购物，也可用于不花钱的索取。
    formation: 名词 + を + ください
    constraints:
    - 用于购物、点菜或索取物品
    contrasts: []
  - pattern: 何（なに／なん）
    function_cn: 疑问代词“何”的读音随后续助词变化：基本读“なに”，在助词“の”及量词前读“なん”，在“で”前两种读法皆可。
    formation: 何 + と／が／を／で／の／时刻・星期等
    constraints:
    - 助词“の”前必须读“なん”
    - 量词前读“なん”
    - “で”前“なに”“なん”均可
    contrasts:
    - “なに”与“なん”的分布差异
  - pattern: そうですか
    function_cn: 应答表达；句尾降调表示理解所听到的新信息，升调表示对对方所说内容持疑问。
    formation: 独立应答语
    constraints:
    - 语调（降调/升调）决定语用含义
    contrasts:
    - 降调=确认理解 vs 升调=表示疑惑
  - pattern: そうですね
    function_cn: 用于同意对方的提议；“ね”的发音不能拉长，拉长后语意变化。
    formation: 独立应答语
    constraints:
    - “ね”须短促，不可拉长
    contrasts:
    - 短“ね”=同意 vs 拉长“ね”=语意改变
  - pattern: じゃあ
    function_cn: 接过别人话题发表自己看法，或中断谈话时使用，相当于“那么”；属较随便的说法，正式场合用“では”。
    formation: 独立接续语
    constraints:
    - 语体偏随意，正式场合应替换为“では”
    contrasts:
    - じゃあ（随意） vs では（正式）
  - pattern: 失礼します／失礼しました
    function_cn: 寒暄语；向长辈或上司道别时使用，进别人房间有时也用；离开别人房间时可用“失礼しました”或“失礼します”。
    formation: 独立寒暄语
    constraints:
    - 用于对长辈/上司或进出他人房间场景
    contrasts:
    - “失礼します”（道别/进入） vs “失礼しました”（离开时）
  - pattern: いってらっしゃい / いってまいります・いってきます
    function_cn: 外出寒暄：离开者说“我走了”，对方以“去吧”回应并含盼早归之情；区分郑重与随便说法
    formation: 动词て形＋まいります／きます 的寒暄化用法
    constraints:
    - 以还会返回该处为前提
    - いってきます 为较随便说法
    contrasts:
    - いってまいります（郑重） vs いってきます（随便）
  - pattern: ただいま / お帰りなさい
    function_cn: 归家寒暄：回来者说“我回来了”，在家者说“你回来啦”
    formation: 固定寒暄对句
    constraints:
    - 用于回家或回单位场景
    contrasts: []
  - pattern: いらっしゃいませ / かしこまりました
    function_cn: 迎送寒暄：店员对顾客说“欢迎光临”“明白了”；省略“ませ”的“いらっしゃい”语气随便，用于亲友来家做客
    formation: 敬语寒暄语；かしこまりました 表郑重领诺
    constraints:
    - かしこまりました 语气郑重，多为店员对顾客
    - いらっしゃい 省略“ませ”，用于亲近对象
    contrasts:
    - いらっしゃいませ（郑重） vs いらっしゃい（随便）
  - pattern: すみません
    function_cn: 多功能表达：除道歉外，用于向别人搭话、请求、劳驾，或向不相识者开口
    formation: 固定寒暄/请求用语
    constraints:
    - 可用于对人有请求或向陌生人开口搭话
    contrasts:
    - 道歉义 vs 搭话/劳驾义
