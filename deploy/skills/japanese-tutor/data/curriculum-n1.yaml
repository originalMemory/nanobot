  grammar:
  - pattern: ～てある／～てあります
    function_cn: 表示人为动作完成后所留下的状态存续（他动词的结果状态）。
    formation: 他动词て形＋ある／あります
    constraints:
    - 强调动作的结果状态而非动作本身
    - 主语通常为动作的受事或相关事物，用が提示
    contrasts:
    - 与「～ている」（自然状态或动作进行中）区分
  - pattern: ～ておく／～ておきます
    function_cn: 预先做某事以备后用或为后续做准备。
    formation: 动词て形＋おく／おきます
    constraints:
    - 动作发生在参照时间之前
    - 可表请求（～ておいてください）
    contrasts:
    - 与单纯「～ます」区分，强调提前准备
  - pattern: ～てみる／～てみます
    function_cn: 尝试做某事。
    formation: 动词て形＋みる／みます
    constraints:
    - 可表请求对方尝试（～てみてください）
    contrasts: []
  - pattern: 他动词て形＋あります
    function_cn: 表示有意进行的动作结果的存续状态；句中不出现动作主体，只以が标记动作对象。
    formation: 他动词て形＋あります
    constraints:
    - 仅用于他动词
    - 主体不出现，对象用が提示
    contrasts:
    - 与「動ておきます」区别：前者强调结果存续且无主体，后者强调为准备而有意识留存
  - pattern: 动词て形＋おきます
    function_cn: 表示为做某种准备或有某种目的而有意识地进行动作，并将动作的结果或效果留存下来；可构成请求「ておいてください」。
    formation: 动词て形＋おきます
    constraints:
    - 强调有意识、有目的的预备性动作
    contrasts:
    - 与「動てあります」区别：后者多用于他动词结果存续且无主体
  - pattern: 动词て形＋みます
    function_cn: 表示尝试做某事。
    formation: 动词て形＋みます
    constraints:
    - 用于试探、尝试性动作
    contrasts: []
  - pattern: ～ために
    function_cn: 表示目的
    formation: 小句1（基本形）＋ために＋小句2；名词＋の＋ために＋小句
    constraints:
    - 前后两个小句的主语相同
    contrasts: []
  - pattern: とっておきの＋名词
    function_cn: 表示为某种场合或用途而特别留着的东西或场所
    formation: とっておきの 修饰名词
    constraints: []
    contrasts: []
  - pattern: うわあ
    function_cn: 感叹词，表示看到某事物时产生的感动或惊讶，可作褒义（赞美）也可用于对不好的事情感到惊讶
    formation: 独立感叹词
    constraints: []
    contrasts: []
  - pattern: しっかり
    function_cn: 副词，多种含义：①充分、充足；②扎实、踏实、认真
    formation: 副词，修饰动词
    constraints: []
    contrasts: []
  - pattern: ハードスケジュール
    function_cn: 外来词（源自 hard schedule），表示计划要做的事情很多、实施起来很困难，日程紧张
    formation: 名词，常与 ～で 连接表原因/状态
    constraints: []
    contrasts: []
  - pattern: あちこち
    function_cn: 表示多种场所或多个方向
    formation: 本来形式为「あちらこちら」，会话中一般短缩为「あちこち」或「あっちこっち」
    constraints:
    - 日语中只存在“那”在前“这”在后的说法，不存在“这”在前“那”在后的形式（如「こちあち」「こっちあっち」等不成立）
    contrasts: []
  - pattern: もったいない
    function_cn: 表示没有做到物尽其用、人尽其能而感到非常遗憾、可惜
    formation: 可作谓语或接「ので」等构成原因说明
    constraints: []
    contrasts: []
  - pattern: 日本用餐习惯（语用/礼仪规则）
    function_cn: 说明在日本做客或餐厅就餐时的礼仪规范
    formation: 文化/语用规则说明，非句型
    constraints:
    - 吃米饭时用左手端起碗来吃
    - 嘴里有饭时不说话
    - 鱼刺、菜根等放在预先准备好的空盘里，不放在桌上
    - 分食大盘菜时先夹到个人小碟再吃，用公筷或把自己的筷子倒过来使用
    contrasts:
    - 与中国习惯对比：中国剩菜无妨，日本客人习惯把主人准备的食物全部吃光，否则主人会担心饭菜不合口味
  pragmatics:
  - 「いただきます」用于进食前的礼貌表达
  - 「もったいない」用于对未充分利用资源或人才表示惋惜
  - 日本餐桌礼仪中客人应吃光食物，若吃不完宜从一开始对部分菜不动筷子
