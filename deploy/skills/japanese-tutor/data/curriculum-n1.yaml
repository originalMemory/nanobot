  similar_contrasts:
  - 「〜のです / 〜んです」与「〜からです」：前者语气较强、偏说明情况，后者明确解释原因。
  - 「〜のではありません」用于否定原因/方法等修饰成分，区别于普通否定。
  - ～んですが（更礼貌的提示主题）
  - ～んだけど（更随意）
  - 後輩
  - 与「那」类指示词区分
  - 主语强调用「が」
  - 同意 vs 否认 vs 吃惊 vs 保留意见 的语用区分
  - 「ね」高短促 vs 「ねえ」拉长尾音
  - 与‘～から’区别：‘～から’是明确说明理由时才使用，‘～し’可并列或暗示未尽理由
  - 与‘～てしまう’正式形对应，‘～ちゃって’为其缩略口语形
  - 省略 vs 保留助词：保留「は」「が」会产生强调/对比语感
  - 「～のこと」 vs 「～が」：非人名词接好き/嫌い时只能用「が」
  - 与初级第26课“そうかもしれないね”意思相同。
  - 和 vs 洋
  - れんげ vs おわん vs 茶わん
  - 与“形が～”“～形だ”等意思相同
  - ～とされている
  - 本当に
  - 実は（形态近似但意思完全不同，注意不要混淆）
