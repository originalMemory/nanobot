  grammar:
  - pattern: ～に＋あります／います
    function_cn: 表示某处存在某物（无生命用あります，有生命用います）
    formation: 场所名词＋に＋存在物＋が＋あります／います
    constraints:
    - 存在物用が提示
    - 无生命物接あります，有生命物接います
    contrasts:
    - あります（无生命）与います（有生命）的区分
  - pattern: ～の＋场所
    function_cn: 表示所属或相对位置关系（某物的某处／某处的某侧）
    formation: 名词＋の＋场所名词
    constraints:
    - の前后均为名词
    contrasts: []
  - pattern: ～と～
    function_cn: 并列连接两个名词（和、与）
    formation: 名词＋と＋名词
    constraints:
    - 用于连接同类并列项
    contrasts: []
  - pattern: ～はどこにありますか／～に何が／だれが～ますか
    function_cn: 询问存在物的位置、内容或人物
    formation: 疑问词＋に＋が＋あります／います＋か
    constraints:
    - 否定形式用だれも～ません
    contrasts: []
  - pattern: 名[场所]に 名[物/人]が あります／います
    function_cn: 表示存在，相当于汉语“～有～”
    formation: 场所名词＋に＋存在主体名词＋が＋あります/います
    constraints:
    - あります用于花、草、桌子等不具意志的事物
    - います用于具意志的人、动物或昆虫
    contrasts:
    - あります（无意志物）与います（有意志人/动物）的区分
  - pattern: 名[物/人]は 名[场所]に あります／います
    function_cn: 表示位置，相当于汉语“～在～”
    formation: 存在主体名词＋は＋场所名词＋に＋あります/います
    constraints:
    - 同样按意志性区分あります与います
    contrasts:
    - 与句型(1)的语序差异：主体用は且前置，场所用に后置
  - pattern: ～は どこに ありますか／いますか
    function_cn: 询问某物/某人所在地点，可替代“～は どこですか”
    formation: 主体＋は＋どこに＋あります/いますか
    constraints:
    - 承接第3课“～は どこですか”的用法，按意志性选あります/います
    contrasts:
    - “どこですか”与“どこに あります/いますか”的等价替换
  - pattern: 名と名
    function_cn: 并列两个名词，相当于汉语“和”
    formation: 名词＋と＋名词
    constraints:
    - 助词“と”连接两个名词表示并列
    contrasts: []
  - pattern: 名词＋の＋上／下／前／後ろ／隣／中／外
    function_cn: 表示具体位置关系（某物在某物的上、下、前、后、旁边、里面、外面）
    formation: 名词后接助词「の」，再接方位名词，整体后接「に」表示存在处所
    constraints:
    - 助词「の」不可省略（与汉语“椅子上”“桌子下”不同，日语必须说“いすの上”“机の下”）
    contrasts:
    - 与汉语位置表达对比：汉语可省略“的”，日语「の」不能省略
  - pattern: 句尾助词「ね」
    function_cn: 说话人就某事征求听话人的同意、确认，读升调
    formation: 置于句末，用于陈述句或疑问句尾
    constraints:
    - 语调为升调，表确认/寻求认同
    contrasts: []
  - pattern: 疑问词＋も＋动词否定形
    function_cn: 表示全面否定（谁也没有、什么也没有）
    formation: 疑问代词（だれ、何 等）后接「も」，谓语用否定形
    constraints:
    - 谓语必须为否定形式
    contrasts: []
  - pattern: 上（うえ）的范围限制
    function_cn: 日语“上”仅表垂直上方范围，比汉语“上”窄；墙壁表面等附着面不用“～の上に”而用“～に”。
    formation: 名词＋に（附着面）／名词＋の＋上に（垂直上方）
    constraints:
    - 墙壁表面用“壁に”，不用“壁の上に”
    contrasts:
    - 汉语“墙上”=墙壁表面；日语“壁の上”=墙壁上方的天棚
  - pattern: ええと
    function_cn: 被问及某事、思考该如何回答时使用的填充/迟疑语。
    formation: 独立插入语
    constraints: []
    contrasts: []
  - pattern: ご＋亲属名词（ご家族／ご兄弟／ご両親）
    function_cn: 提及对方亲属时的礼貌说法；指自己家人时用普通名词（家族等）。
    formation: ご＋家族／兄弟／両親
    constraints:
    - 并非所有名词前都可加“ご”
    contrasts:
    - “ご家族”指对方家人，“家族”指自己家人
  - pattern: 兄弟（きょうだい）
    function_cn: 指同一父母的人，也用于同父或同母；不限于男性兄弟，兄妹、姐弟、姐妹皆可称“きょうだい”。
    formation: 名词，可加“ご”表礼貌
    constraints:
    - 汉字写作“兄弟”但涵盖兄弟姐妹
    contrasts: []
  - pattern: JR／地下鉄（词汇主题）
    function_cn: JR 原为国营“国铁”，1987年民营化后为 Japan Railways 简称；远途多用 JR，近途除 JR 外也用私铁；大城市圈有地铁。
    formation: 专有名词/交通词汇
    constraints: []
    contrasts:
    - JR（国营改民营）vs 私铁（私营）vs 地下鉄（地铁）
  pragmatics:
  - 「ね」用于寻求听话人认同，语调上升
  - 礼貌语言④：对他人亲属加“ご”以示尊敬
  - 对他人亲属使用敬语称谓：ご家族、ご両親、ご兄弟
  - 购物场景中的礼貌寒暄与致谢
  - 使用敬语（ご趣味・お仕事・ご出身）体现礼貌
  - 以『失礼ですが』缓冲直接提问
