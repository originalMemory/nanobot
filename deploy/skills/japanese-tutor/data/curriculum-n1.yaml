  grammar:
  - pattern: ～と
    function_cn: 表示条件，前项动作/状态发生后自然产生后项结果（客观、规律性）
    formation: 动词ます形去ます＋と／名词＋と
    constraints:
    - 后项多为客观结果或自然现象，一般不用意志、命令、请求
    - 与「～ば」「～たら」在主观/假设条件上易混
    contrasts:
    - ～ば
    - ～たら
  - pattern: ～ことがある
    function_cn: 表示某事曾经发生或偶尔发生（经验/频率）
    formation: 动词辞书形／ます形去ます＋ない＋ことがある
    constraints:
    - 常与「たまに」「よく」等频率副词搭配
    - 肯定表曾经做过，否定表曾经没做过
    contrasts:
    - ～ことがある（经验）与「～ことがある（可能性）」语义区分
  - pattern: ～ましょう
    function_cn: 提议、邀请对方一起做某事
    formation: 动词ます形＋ましょう
    constraints:
    - 用于说话人与听话人共同行动
    - 与单纯意志「～ます」区分
    contrasts:
    - ～ます（意志/将来）
  - pattern: ～でしょうか
    function_cn: 礼貌地推测或委婉询问对方意见/确认
    formation: 动词ます形／形容词＋でしょうか
    constraints:
    - 比「～か」更委婉、礼貌
    - 可用于推测（…吧？）或征询（…好吗？）
    contrasts:
    - ～か
  - pattern: 小句1（动词基本形／ない形）＋と，小句2
    function_cn: 表示恒常性状态、真理、反复性状态、习惯等，小句1为小句2的条件；也可表示因某种行为而发现新情况
    formation: 前接动词基本形或ない形，后接逗号与小句2
    constraints:
    - 小句2不能表达说话人自己的意志、愿望，也不能向听话人提出要求或劝诱
    contrasts: []
  - pattern: 动词（基本形／ない形）＋ことがあります
    function_cn: 表示有时会发生某种事态，常与“たまに”“時々”等副词呼应
    formation: 动词基本形或ない形后接“ことがあります”
    constraints: []
    contrasts:
    - 与第21课“～たことがあります”为两种完全不同的句型，需区分
  - pattern: 形容词的副词性用法
    function_cn: 形容词像副词一样修饰动词
    formation: 一类形容词词尾“い”变为“く”；二类形容词后加“に”
    constraints:
    - 列举了如「うまく／おいしく／早く／遅く／長く／短く／大きく／小さく／高く／楽しく」以及「上手に／静かに／簡単に／元気に／きれいに／にぎやかに」等用法
    contrasts: []
  - pattern: 小句（简体形）＋でましょうか
    function_cn: 表示疑问，礼貌程度较高，比「ますか」高一些
    formation: 动词小句与一类形容词小句以简体形后续「でましょうか」；二类形容词小句与名词小句将简体形的「だ」替换为「でましょうか」
    constraints:
    - 用于疑问句尾
    - 礼貌度高于「ますか」
    contrasts:
    - 「来るでしましょうか」与「来ますか」意思相同，但前者礼貌程度更高
  - pattern: きちんと
    function_cn: 副词，表示正确、无误、恰当、彻底地做某事
    formation: 接在动词前作状语
    constraints: []
    contrasts: []
  - pattern: Aですか？Bで？（连续短问）
    function_cn: 吃惊、意外时把完整问句拆成两个连续短问，先问最关心的部分
    formation: 正常语序为「BでAするんですか」，吃惊时省略为「Aですか？Bで？」
    constraints:
    - 用于表达惊讶、难以置信的语用场景
    contrasts: []
  - pattern: ～でできた～
    function_cn: 表示「用～做成的～」，指材料/原料
    formation: 材料名词＋でできた＋名词
    constraints:
    - 表示成品材料时一般用「～でできた～」而非「～で作った～」
    contrasts:
    - ～で作った～（强调制作动作）
  - pattern: 数量词＋ほど／数量词＋ぐらい
    function_cn: 均表示大致的数量或分量
    formation: 数量词后接ほど或ぐらい
    constraints:
    - 表示某序列中的一点（如第几个、第几岁）时只能用ぐらい，不能用ほど
    contrasts:
    - ほど：不可用于序列中的某一点
    - ぐらい：可用于序列中的某一点
  - pattern: ぐらい
    function_cn: 表示程度/大概；可接在指示词（この／その／あの／どの）之后
    formation: 接在名词或指示词后
    constraints:
    - 可接在「この／その／あの／どの」后面
    - 与「ほど」不同：「ほど」不能接在这些指示词后
    contrasts:
    - 「ぐらい」可接指示词，「ほど」不可
  - pattern: ただし
    function_cn: 在基本肯定前句内容的基础上，附加条件、限制或补充例外情况
    formation: 接在肯定句后，作补充/限制
    constraints:
    - 只能表示对前句内容的部分限制或补充，不能接完全相反的内容
    contrasts:
    - 与「しかし」相似，但「しかし」可接续与前句完全相反的内容，「ただし」仅用于部分限制或补充
  pragmatics:
  - 礼貌询问使用「すみません」起头
  - 感谢使用「ありがとうございます」
  - 「でましょうか」用于疑问时比「ますか」更礼貌
  - 吃惊时抛开正常语序，先问最关心部分
  - 使用「～んです」向对方解释说明情况
  - 使用「～ましょう／～ないといけない」提议与提醒
