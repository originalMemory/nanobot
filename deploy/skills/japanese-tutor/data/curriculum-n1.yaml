  grammar:
  - pattern: 使われている（不明确指出主体的句子②）
    function_cn: 用他动词的被动形式隐去动作主体，使读者专注于客观事实；也可改用自动词表达事物状态
    formation: 他动词被动形（～される）或对应自动词
    constraints:
    - 用于不指明动作主体的说明性句子
    - 他动词被动化后动作主体被隐去
    contrasts:
    - 他动词主动形会暗示动作主体存在，易被误解为作者
  - pattern: 呼ばれる（他动词的被动形式）
    function_cn: 当把动作对象（宾语）作为主语时，他动词须变为被动形式
    formation: 他动词被动形（～られる／～される）
    constraints:
    - 仅适用于他动词，且主语为动作对象
    contrasts:
    - 汉语无自动词/他动词之分，不可照搬汉语主动式表达
  - pattern: 点灯させる（自动词的使役形式）
    function_cn: 自动词的使役形式，表示使某事物发生该动作/状态
    formation: 自动词使役形（～させる）
    constraints:
    - 由自动词（如 点灯する）构成使役
    contrasts: []
  - pattern: 使役形（～させる）
    function_cn: 使役；让他人做某事，或用于自身能动的机械等
    formation: 動詞連用形＋させる；自動詞・他動詞の使い分け
    constraints:
    - 他動詞が存在しない場合（例：接触する・安定する・死滅する・自滅する・繁栄する）は、自動詞の使役形が他動詞の機能を代替する
    contrasts:
    - 自動詞使役＝自然にそうなる／他動詞＝外力でそうさせる
  - pattern: ～べき～
    function_cn: 应当、有那样做的价值；惯用表达表『令人恐怖的』『应有的、相応的』
    formation: 動詞基本形＋べき＋名詞；サ変動詞は詞干＋すべき＋名詞（やや旧式的な表現も）
    constraints:
    - 恐るべき・然るべき などの慣用表現を含む
    contrasts: []
  - pattern: ～ばかりがない
    function_cn: 没有极限、没完没了（＝きりがない）
    formation: 動詞連用形＋ばかりがない
    constraints:
    - 「きり」＝极限、「きりがない」＝没有极限
    contrasts: []
  - pattern: ～ばきりがない / ～たりきりがない
    function_cn: 表示要做的事太多、无法穷尽，含“根本做不完”的语感
    formation: 接在动词条件形（ば形、た形等）后
    constraints:
    - 用于否定或抱怨语境，强调事项繁多
    contrasts: []
  - pattern: ～は～（は）欠かせない
    function_cn: 表示“B需要A”“A是B不可缺少的”，强调必要性
    formation: “Bに（は）Aが欠かせない”或“Bに（は）Aを欠くことができない”
    constraints:
    - “欠く”表“应该有的却没有”，“欠かせない”以可能形否定表“必要”
    contrasts: []
  - pattern: ～える / ～うる / ～えない
    function_cn: 表示“有充分的可能性”
    formation: 接在动词ます形去掉“ます”的形式后；肯定形式可为“～うる”或“～える”，否定形式只能用“～えない”
    constraints:
    - “える”汉字写作“得る”，原读“うる”，受否定形“えない”影响肯定形近读“える”
    - “ありうる”多用于书面语
    contrasts:
    - 肯定形～うる/～える 与 否定形～えない 的读音不对称
  - pattern: 露地物
    function_cn: 名词，指非温室栽培、直接种在露天土地上的蔬菜或水果，与“工場野菜”相对；与“ハウス栽培（温室栽培）”相对应。
    formation: 名词
    constraints: []
    contrasts:
    - ハウス栽培（温室栽培）
    - 工場野菜
  - pattern: ～に優しい
    function_cn: 表示温和对待，引申出比喻不会产生不良影响的用法；对象用“に”表示。
    formation: 名词＋に＋い形容词（優しい）
    constraints:
    - 对象用「に」表示
    contrasts: []
  - pattern: ～に＋一类形容词
    function_cn: 表示性质或特征适宜与否（如大小、宽窄、合适程度）；表示性质或特征成立的范围（如熟悉/不熟悉某领域）。
    formation: 名词＋に＋一类形容词（大きい/狭い/ちょうどいい/詳しい/疎い等）
    constraints:
    - 表示成立范围时也可用「～に関して＋一类形容词」的形式
    contrasts:
    - ～に関して＋一类形容词
  - pattern: ～に厳しい／～に甘い
    function_cn: 表示将性质或特征成立的范围作为对象看待；可用“～に対して＋一类形容词”的形式。
    formation: 名词＋に＋一类形容词（厳しい／甘い）
    constraints:
    - 形容词须为一类形容词
    - 可替换为“～に対して＋一类形容词”
    contrasts:
    - 厳しい（严厉）与甘い（迁就）语义相反，接续相同
  - pattern: ～にきつい
    function_cn: 表示性质或特征成立的范围与某人相关；可用“～にとって＋一类形容词”的形式。
    formation: 名词＋に＋一类形容词（きつい）
    constraints:
    - 形容词须为一类形容词
    - 可替换为“～にとって＋一类形容词”
    contrasts:
    - 与“～に厳しい”区别：きつい 强调对某人而言吃力/困难，对象多为人
  - pattern: その分
    function_cn: 表示与其相应的程度，在上下文中表示二者关系成正比或成反比。
    formation: 独立副词性表达，承接前文
    constraints:
    - 需依赖上下文成对出现（前项与后项对应）
    contrasts: []
  - pattern: ～にしても
    function_cn: 表示“从某一角度考虑问题也……”，即把某事物作为前提/角度来谈。
    formation: 名词＋にしても
    constraints:
    - “～”部分须为名词
    contrasts:
    - 与“～にしても～にしても”连用表示列举所有前提范围
  - pattern: ～にしても～にしても／～にしたって～にしたって
    function_cn: 用于提示“作为前提的所有范围”，即无论……还是……都……（拓展栏目，标注对应中级第11课）。
    formation: 名词＋にしても＋名词＋にしても；或名词＋にしたって＋名词＋にしたって
    constraints:
    - 各“～”部分须为名词
    - 用于穷举前提范围
    contrasts:
    - “にしても”与“にしたって”可互换，语感相近
  - pattern: ～であれ～であれ／～であろうと～であろうと／～だろうが～だろうが
    function_cn: 表示无论哪种情况，后面出现的是事态维持原样不变的内容；“～”处为名词
    formation: 接名词
    constraints: []
    contrasts: []
  - pattern: ～（よ）うが～（よ）うが
    function_cn: 列出意思相反的或相似的情况，表示“无论何种情况都……”
    formation: 与动词意志形一同使用
    constraints: []
    contrasts: []
  - pattern: 覚悟（覚悟を決める／～は覚悟のうえだ）
    function_cn: 预测到不好的结果而有所准备；与汉语“觉悟”意思不同
    formation: “覚悟のうえだ”前面多用表示不好结果的词语（如危険・非難・失敗・退学・解雇等）
    constraints: []
    contrasts: []
  - pattern: 遅かれ早かれ／多かれ少なかれ／大なり小なり
    function_cn: 将反义词组合起来的用法，相当于汉语“早晚”“迟早”“或多或少”“不论大小”
    formation: 反义词组合
    constraints:
    - 不说“早かれ遅かれ”“少なかれ多かれ”“小なり大なり”
    contrasts: []
