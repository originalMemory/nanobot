  grammar:
  - pattern: 使役形式＋てください
    function_cn: 直接请求对方允许
    formation: 动词使役形＋てください
    constraints:
    - 礼貌程度低于委婉请求允许形式
    contrasts:
    - 与使役形式＋てもらっていいですか／ていただいてよろしいですか 相比更直接
  - pattern: 使役形式＋てもらっていいですか／ていただいてよろしいですか
    function_cn: 委婉请求对方允许
    formation: 动词使役形＋てもらっていいですか／ていただいてよろしいですか
    constraints:
    - ていただいてよろしいですか 的礼貌程度最高
    contrasts:
    - 比使役形式＋てください 更委婉
  - pattern: 使役形式＋させていたく（申します／なります等）
    function_cn: 表示因某事受到恩惠的事实或心情，礼貌程度高
    formation: 动词使役形＋させていたく＋申します／なります等
    constraints:
    - 即使不需要对方允许也常使用
    contrasts:
    - 与请求允许形式不同，侧重表达受恩惠的心情
  - pattern: 反对、赞成的表达方式
    function_cn: 会话中反对对方意见时的表达
    formation: 本页仅引出，具体表达列于续页表格
    constraints:
    - 本页未给出完整表达内容
    contrasts: []
  - pattern: ～に過ぎる
    function_cn: 表示“过于……”，与“～すぎる”意思相同，但多与有限词语组成惯用表达
    formation: 接在名词/形容动词性词语后，构成惯用搭配
    constraints:
    - 用于惯用表达，如安易に過ぎる、性急に過ぎる、拙速に過ぎる、早計に過ぎる
    contrasts:
    - 与“～すぎる”语义相同，但“～に過ぎる”限于特定惯用搭配
  - pattern: 对对方意见表示怀疑的委婉表达
    function_cn: 以疑问或保留语气表示不完全接受对方意见，避免直接反对
    formation: 使用“～ですかね”“～かもしれません”“～難しいですね”等委婉句式
    constraints:
    - 日语中避免使用明确反对的直接表达，倾向用疑问方式表示不赞成
    contrasts: []
  - pattern: 提出不同方案以示反对
    function_cn: 通过提出替代方案使协商向建设性方向发展
    formation: 先以“～と思うんですが…”引出己方考虑
    constraints: []
    contrasts: []
  - pattern: 先表示同意或反感，再指出问题
    function_cn: 表明反对意见时先肯定对方，再以婉转方式指出问题
    formation: 用“～よく分かるんですが”“～違う側面があるのではないか”等委婉说法
    constraints:
    - 避免断言“問題があります”“違う側面があります”，改用较婉转说法
    contrasts: []
  - pattern: 赞成/暗示赞成
    function_cn: 会话中赞成对方意见，可明确或省略“思います/賛成です”等
    formation: 明确：「～思います」「～賛成です」；暗示：省略谓语仅说“そうですね。やっぱり…”
    constraints: []
    contrasts: []
  - pattern: またの＋名词
    function_cn: 表示别的、下次、其他的意思
    formation: 副词また＋の＋名词
    constraints: []
    contrasts: []
  - pattern: 逆に
    function_cn: 用作副词，表示与预想或期待的相反
    formation: 名词逆＋に
    constraints: []
    contrasts: []
  - pattern: 演讲表达结构
    function_cn: 演讲流程：问候并说明姓名身份现状；用～についてお話ししたいと思います／まず、～からお話ししたいと思います交代主题；结尾致谢
    formation: 交际功能框架
    constraints: []
    contrasts: []
  - pattern: ～ていきました／～ようになっていました／～ようになりました
    function_cn: 心情变化的表达方式：表示习惯养成、看法或状态随时间逐渐变化、最终形成某种认识。
    formation: 动词て形／名词＋に／形容词等＋ていきました；～よう（に）なって（いました）／～よう（に）なりました
    constraints:
    - 强调变化过程与结果，多用于描述学习、感受、想法的渐进转变。
    contrasts: []
  - pattern: ～といってもいいかもしれません／～といえるでしょう／～ようと思います／～ような気がします／～と思います
    function_cn: 提出自己观点的表达方式：在阐述观点时避免断言，用委婉、留有余地的说法表达看法。
    formation: 动词／形容词／名词＋て（い）もいいかもしれません／＋いえるでしょう／＋ようと思います／＋ような気がします／＋と思います
    constraints:
    - 用于演讲或论述中表达个人立场，语气较柔和、不绝对。
    contrasts: []
  - pattern: どうにか／何とか
    function_cn: 词语讲解：两者多可互换，但「どうにかする」侧重处理问题（结果尚不讨论），「何とかする」侧重想办法解决问题、重视结果。
    formation: 动词形「どうにかする／何とかする」
    constraints:
    - 在必须解决、强调结果的情境下宜用「何とかする」，「どうにかする」不合适。
    contrasts:
    - どうにかする vs 何とかする：处理 vs 设法解决（含对结果的重视）。
  - pattern: 名词谓语句的时态
    function_cn: 说明名词谓语句在叙述过去事件时，原则上用过去形式，但也可用现在将来形式叙述过去，用于该性质/事实直到现在仍未消失的情形，多使用名词形式的谓语。
    formation: 名词谓语 + だ/です（现在将来）或 だった/でした（过去）
    constraints:
    - 过去的事一般用过去形式，现在或将来的事用现在将来形式
    - 用现在将来形式叙述过去时，限用于性质/事实至今未消失的情形，且多使用名词形式的谓语
    contrasts:
    - 现在将来形式叙述过去 vs 过去形式叙述过去：前者强调该性质/事实至今未改变
  - pattern: 社会に出る
    function_cn: 表示在社会上有了工作或某种角色；“社会”此处指工作场所而非学校那样的学习场所，也可表示“实社会”；“社会人”指在社会上工作的人。
    formation: 社会 + に + 出る
    constraints:
    - “社会”在此语境指工作场所/社会角色，非学习场所
    contrasts:
    - 社会（工作场所/实社会） vs 学校（学习场所）
  - pattern: 欲が出る
    function_cn: 表示自然产生想拥有很多东西的欲望，多含积极意义；与「意欲」用法相近。
    formation: 名词「欲」+ 助词「が」+ 动词「出る」（出现、产生）。
    constraints:
    - 与「欲を出す」区分：后者指把欲望以表情等表现出来，多用于贬义。
    contrasts:
    - 「欲が出る」（自然产生，积极） vs 「欲を出す」（外显表现，贬义）
  - pattern: ～を図る
    function_cn: 表示计划、努力实现某个动作或行为；「コミュニケーションを図る」指通过努力实现交流、沟通。
    formation: 名词 + 助词「を」+ 动词「図る」。
    constraints:
    - 常与「便宜」「自殺」等特定词语搭配，如「便宜を図る」「自殺を図る」。
    contrasts: []
  - pattern: 気が合う
    function_cn: 表示两个事物很好地融合、相性合得来；用于人之间指性格相投。
    formation: 名词「気」+ 助词「が」+ 动词「合う」。
    constraints:
    - 「合う」核心义为两物契合，如尺寸合适、搭配合适。
    contrasts: []
  - pattern: ～に～が多い理由
    function_cn: 表示“作为A的一部分，B多的理由”；「に」表范围，A与B关系为 A＞B。
    formation: 名词A + 助词「に」+ 名词B + 「が多い理由」。
    constraints:
    - 「に」表示范围，A 包含 B（A＞B）。
    contrasts: []
  - pattern: ～とは思ってもみなかった／～なんて考えてもみなかった
    function_cn: 表示对已经形成的实际状态以前完全没有想到。
    formation: 动词／一类形容词（简体形式）＋とは思ってもみなかった／なんて考えてもみなかった；名词／二类形容词＋だ＋とは思ってもみなかった／なんて考えてもみなかった
    constraints: []
    contrasts: []
  - pattern: そこには
    function_cn: 表示场所；另有“行为A。そこには～”形式，以动词基本形或名词提示行为A，再提示该行为中所含要素。
    formation: 行为A（动词基本形／名词）。そこには～
    constraints: []
    contrasts: []
  - pattern: AにBが～（主题化为「には」）
    function_cn: 作为句子使用时一般把「に」主题化为「には」；常与「多い」「少ない」等一类形容词搭配，名词化可用「わけ」「の」等。
    formation: AにはBが＋多い／少ない等
    constraints: []
    contrasts: []
  - pattern: ～という面があり、一方で、～という面もある
    function_cn: 表示一个事物具有两个侧面/方面；当 A、B 为动词小句时用「という」构成，「一方で」可替换为「一方で」；也可用「～にはA面だけでなく、B面もある」表示一般认为只有 A 面但实际也有
      B 面。
    formation: 名词/动词小句＋という面があり、一方で、～という面もある
    constraints:
    - A、B 为动词小句时多用「という」构成
    - 「一方で」可替换为「一方で」
    contrasts: []
  - pattern: ～ばこそ
    function_cn: 强调理由（正因为……才……），句尾多伴随「～のだ」；同义可用「小句（简体形式）＋からこそ＋こそ」表达。
    formation: 动词ば形＋こそ
    constraints:
    - 强调理由
    - 句尾多伴随「～のだ」
    contrasts:
    - 小句（简体形式）＋からこそ＋こそ
  - pattern: はかる（同音异义动词的汉字义项区分）
    function_cn: 讲解「はかる」在不同汉字写法下的语义分工：図る（企图、安排）、謀る（图谋不轨、欺骗）、諮る（向他人咨询）、計る（计时）、量る（计量重量/容积）、測る（测量大小/长度/高度/深度/体温/血压等）
    formation: 动词，各义项以不同汉字表记，读音相同
    constraints:
    - 各义项语义领域不同，需按语境选择对应汉字写法
    contrasts:
    - 図る vs 謀る：前者中性/积极（安排、企图），后者含贬义（图谋不轨、欺骗）
    - 計る（时间）vs 量る（重量/容积）vs 測る（尺寸/深度/体温等物理量）
  pragmatics:
  - 同一公司内不同部门之间关系不一定亲密，故使用敬体
  - 本课名“フィランソロピー”指企业对社会的公益活动（仁爱、博爱、慈善）
  - 日语交际中倾向用疑问、保留语气代替直接反对，以维持礼貌与协商氛围
  - 论述中避免断言、留有余地的表达策略
  vocabulary_domains:
  - スピーチコンテスト
  - 応募
  - 選考
  - 本選
  - 人名/专有名词（入江、竹内京香、大泽直人、东艾丽佳、郭莲莲、东京白饭店等）
  - 动作/过程（过程、支付、刷新、添上、滚动、谈论、姿势等）
  - 状态/评价（要点、规定、格式、同感、不愉快、开朗等）
  - 拟声拟态（嘎嘎、哒哒哒、咕隆咕隆、嗡嗡、咚咚等）
  - 惯用/表达（某种、倾听、投缘、指手画脚、亲身、好歹等）
  - 社会公益活动（フィランソロピー、メセナ）
  - どうにか／何とか 的语用区别
  - はかる 的多个汉字义项（図る/謀る/諮る/計る/量る/測る）
  - 情感与安慰
  - 社会与现实
  - 自然与灾害
  - 感官与评价
  - スピーチコンテスト（準備会・本選・選考の流れ）
  - ボランティア活動の義務化
  similar_contrasts:
  - 与使役形式＋てもらっていいですか／ていただいてよろしいですか 相比更直接
  - 比使役形式＋てください 更委婉
  - 与请求允许形式不同，侧重表达受恩惠的心情
  - 与“～すぎる”语义相同，但“～に過ぎる”限于特定惯用搭配
  - どうにかする vs 何とかする：处理 vs 设法解决（含对结果的重视）。
  - 现在将来形式叙述过去 vs 过去形式叙述过去：前者强调该性质/事实至今未改变
  - 社会（工作场所/实社会） vs 学校（学习场所）
  - 「欲が出る」（自然产生，积极） vs 「欲を出す」（外显表现，贬义）
  - 小句（简体形式）＋からこそ＋こそ
  - 図る vs 謀る：前者中性/积极（安排、企图），后者含贬义（图谋不轨、欺骗）
  - 計る（时间）vs 量る（重量/容积）vs 測る（尺寸/深度/体温等物理量）
