  similar_contrasts:
  - ～ということでした／～とのことでした 除一般叙述句外，还可接表示请求或提议的过去形式（如“来てください”“行きましょう”的过去形）
  - 句尾用过去形式“た”可表示以前听说过的事情
  - ～ということでした 语感较弱，仅确认从别人那里听来的事情，很少用于转述一般知识
  - 与～そうです／～ということでした 不同，～と言っていました 表示直接引述听到的信息
  - 与较正式的传闻表达（～そうです 等）语体不同
  - 传闻接简体小句，样态接特定词形，二者不可混用
  - ～以上に（更正式、程度更强）
  - 失礼ですが（同为铺垫表达）
  - ～てもらいます／～てくれます（表示受益）
  - 与「～てくれる」主语视角不同
  - 与「～てもらう」主语视角不同
  - 汉语省略频率低于日语
  - 需明确指出单一理由时用『～から』『～ので』。
  - 区别于仅表示『理解』的『分かりました』，此处含同意/接受之意。
  - 与“当然”“もちろん”意思相近，但“当たり前”不能置于句首
  - 与～ていきます（从现在开始持续下去）方向相反
  - 与～てきました（过去至现在）方向相反
  - また仅表单纯并列，无补充新内容功能
  - 今まで
  - だいたい（大体、大概）
  - 「見えます」指能够实际映入眼帘的状况，与「見られます」的“经常能观察到/现象增多”不同
  - 与「あ」系指示词区分
  - そのような / あのように / どのように（无连词功能）
  - 指示前文内容的「これ」
  - 「生活を送る」偏书面 vs 「暮らしする」偏口语
  - Uターン：往返/返回型 vs Iターン：单向型
