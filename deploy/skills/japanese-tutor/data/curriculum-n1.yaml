  grammar:
  - pattern: ～時に
    function_cn: 表示动作发生的具体时间点（某点整）
    formation: 动词ます形前接「～時に」
    constraints: []
    contrasts: []
  - pattern: ～時から～時まで
    function_cn: 表示动作持续的时间区间（从某点到某点）
    formation: 「～時から」与「～時まで」搭配
    constraints: []
    contrasts: []
  - pattern: ～ました
    function_cn: 过去时肯定形式
    formation: 动词ます形去ます加ました
    constraints: []
    contrasts:
    - 与～ませんでした构成肯定/否定对立
  - pattern: ～ませんでした
    function_cn: 过去时否定形式
    formation: 动词ます形去ます加ませんでした
    constraints: []
    contrasts:
    - 与～ました构成肯定/否定对立
  - pattern: 今／昨日／先週／来週
    function_cn: 时间名词，分别表示现在、昨天、上周、下周
    formation: 作时间状语
    constraints: []
    contrasts: []
  - pattern: いつ／何時
    function_cn: 疑问词，分别询问什么时候、几点
    formation: 作疑问状语
    constraints: []
    contrasts: []
  - pattern: 今 ～時 ～分です
    function_cn: 表示现在的具体时间；双方明确在讲现在时间时可省略「今」；询问具体时间用「何時」；「30分」可用「半」替代；具体时间词前可加「午前」或「午後」
    formation: 时间词（時/分/半）+ です
    constraints:
    - 用于陈述当前时刻
    - 疑问形式将时间词替换为「何時」并加「ですか」
    contrasts:
    - 「半」与「30分」可互换
    - 「午前/午後」用于区分上下午
  - pattern: 動ます／動ません／動ました／動ませんでした
    function_cn: 礼貌体四种基本形式：肯定现在/习惯性/未来、否定现在/习惯性/未来、肯定过去、否定过去
    formation: 动词ます形（ます/ません/ました/ませんでした）
    constraints:
    - 肯定叙述现在习惯性动作、状态及未来动作状态用「～ます」
    - 否定形式为「～ません」
    - 肯定叙述过去动作时「ます」变为「ました」
    - 过去否定形式为「ませんでした」
    - 疑问句在句尾加「か」
    contrasts:
    - 汉语仅用「昨天」即可表过去，日语任何情况下都必须把句尾变为「ました」或「ませんでした」
  - pattern: 名[时间]＋に＋動詞
    function_cn: 表示动作发生的具体时间，在具体时间词语后加助词「に」。
    formation: 时间名词（如「3時」「9時」）后接「に」，再接动词。
    constraints:
    - 叙述包含数字的时间时后续助词「に」，如「3月14日に」「2008年に」。
    - 「今」「昨日」「今日」「明日」「毎日」「去年」「来年」等词后不能加「に」。
    - 星期后一般加「に」（如「日曜日に」），但也可以不加。
    contrasts: []
  - pattern: 名[时间]＋から＋名[时间]＋まで＋動詞
    function_cn: 表示某动作发生在某个期间，用「～から～まで」。
    formation: 起点时间＋「から」＋终点时间＋「まで」＋动词。
    constraints:
    - 「～から」和「～まで」也可以分别单独使用，分别表示起点与终点。
    contrasts: []
  - pattern: いつ＋動詞＋ますか
    function_cn: 询问某动作或事态进行的时间；询问具体时间时，在时间词语后加「に」，句尾加「か」变「ますか」。
    formation: 「いつ」或具体时间词（「何時に」「何曜日に」「何日に」）＋动词「ますか」。
    constraints:
    - 询问持续性动作或事态的起点或终点时，用「いつから」「何曜日まで」等。
    contrasts: []
  - pattern: は（对比）
    function_cn: 助词「は」除提示主题外，还可表示对比；对比时「は」要略微发重。
    formation: 被对比项后接「は」。
    constraints: []
    contrasts:
    - 与提示主题的「は」区分：对比用法需重读。
  - pattern: 工作单位中的称呼规则
    function_cn: 在公司内称呼上司时可直接用职务或姓+职务；谈及对方单位的人时，在对方职务后加「さん」以示敬意
    formation: 职务 / 姓+职务 / 姓+さん
    constraints:
    - 内部对上司可用职务或姓+职务，也可亲昵直呼姓名+さん
    - 对外单位人员职务后须加「さん」
    contrasts: []
  - pattern: 「～です」的省略回答
    function_cn: 当回答内容已明确、无需重复时，可用「～です」简洁作答
    formation: （已明确的主语/谓语省略）+ 时间/数量 + です
    constraints:
    - 用于回答他人提问且上下文已明确时
    contrasts: []
  - pattern: 时间名词连用与「の」
    function_cn: 两个时间名词连用时，前项含「毎」则中间不加「の」；不含「毎」时可加可不加「の」
    formation: 毎+时间词 + 时间词（不加の） / 非毎时间词 + の + 时间词（可加可不加）
    constraints:
    - 含「毎」时禁止加「の」
    contrasts: []
  - pattern: 「～ごろ」
    function_cn: 接在表示时间的词语后，表示大致时间范围
    formation: ～分 / ～時 / ～日 / ～曜日 / ～月 / ～年 + ごろ
    constraints:
    - 「ごろ」后一般不加「に」
    contrasts: []
  - pattern: 询问与陈述当前时刻
    function_cn: 询问现在几点，并用「～時～分です」回答
    formation: 数字＋時＋数字＋分＋です
    constraints:
    - 「分」依前接数字读作「ふん」或「ぷん」
    contrasts: []
  pragmatics:
  - 四种动词形式均为礼貌表达形式
  - 对比用法中助词「は」需略微发重以体现对比语气
  - 职场上下级称呼的敬语层级
  - 对外单位人员的敬称
  - 口语中星期可省略「び」，如「げつよう」「かよう」
  - 「明日」亦读作「あす」
  - 对上级使用礼貌体并加称呼（課長）
  - 迟到时先道歉再说明原因
