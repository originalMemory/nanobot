  similar_contrasts:
  - ～といいます（较普通）
  - ～と申し上げます（误用）
  - ～年間経ちました（误用）
  - ～を含めて（含）
  - ～ほか（另加）
  - 人（普通）
  - 名（庄重）
  - 主に（接动词）
  - 主な（接名词）
  - 主として（接动词，不可接名词）
  - よろしくお願いします（较普通）
  - よろしくお願いいたします（更礼貌）
  - お願い申し上げます（最礼貌）
  - 与表示观点的「～にとって」不同
  - 「わたしとしては」强调立场，区别于「わたしは」
  - 与表转折的用法区分：本条强调无转折义的铺垫用法
  - 今も 与 今でも 同义，但 今も 稍正式
  - 与 今でも、今も 的语体差异
  - 与 今も～ています 的语义差异（是否包含“现已停止”）
  - 与「～ば、～」语义相同但更正式
  - 与「～することができない」（没有……的能力）不同
  - ～わけにもいきません：语气较弱，含‘可以考虑选择……但常识上那样做很困难’之意，同样不能接过去式
  - 倒装句 vs 正常语序：侧重点（原因 vs 结果）不同
  - 「～以上」与「～以下」均含本数
  - 「～を上回る」≈「～を超える」
  - 「～を下回る」与「～を超える」相反
