  communication_functions:
  - 感叹、赞叹、惊讶的表达
  - 感叹程度之深（自言自语）
  - 听到信息后表示同意/恍然大悟
  - 以否定疑问形式表达希望某事实现
  - 委婉提出否定疑问或请求
  - 表达某人/某物不可被排除在外
  - 描述事物高度吻合、合适
