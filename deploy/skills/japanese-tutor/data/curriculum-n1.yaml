  - 打电话·转达口信的整体流程（自报→请求转接→在场/不在场分支→结束寒暄）
  - 自报姓名与寒暄
  - 请求转接电话
  - 确认并接电话
  - 道歉并陈述理由代为回应
  - 请对方转达口信 / 接受口信
  - 结束电话时的寒暄
  - 传达口信（留言请求与确认）
  - 对方不在/录音电话提示音的应对
  - 电话中听不清楚时的表达
  - 应答与确认新信息的语用区分
  - 表达未来计划与已决定事项
  - 向传达/送东西的人表示敬意（自谦语）
  - 口语中追加补充话题
  grammar:
  - pattern: 会社名／自分の名前でございます
    function_cn: 接电话时自报公司名或自己姓名（寒暄开场）
    formation: 名词 + でございます（敬语自报）
    constraints:
    - 用于公司电话接话一方开场
    - 私人电话有时仅用「はい」「もしもし」而不自报姓名
    contrasts: []
  - pattern: いつもお世話になっております／こんにちは
    function_cn: 承蒙关照／您好（寒暄）
    formation: 固定寒暄语
    constraints: []
    contrasts: []
  - pattern: 話したい人の名前さんはいらっしゃいますか
    function_cn: 请求转接电话（询问所找人在场与否）
    formation: 目标人姓名 + さんはいらっしゃいますか
    constraints:
    - 用于打电话一方请求转接
    contrasts: []
  - pattern: 相手の名前様ですね。少々お待ちくださいませ
    function_cn: 确认对方姓名并请其稍候（接电话一方）
    formation: 对方姓名 + 様ですね + 少々お待ちくださいませ
    constraints:
    - 用于要找的人在场的确认·接电话场景
    contrasts: []
  - pattern: 申し訳ございません。ただ今席を外しております
    function_cn: 道歉并陈述理由（要找人不在场时代为回应）
    formation: 道歉 + 理由陈述（席を外しております）
    constraints:
    - 用于要找人不在场的代为回应
    contrasts: []
  - pattern: 折り返しご連絡いたします
    function_cn: 承诺对方回来后让其回电联系
    formation: 折り返し + ご連絡いたします
    constraints: []
    contrasts: []
  - pattern: 电话中敬语的使用方法（自谦语与尊敬语的区分）
    function_cn: 对本人行为用自谦语（如申す、いたす、おる、伺う），对他人行为用尊敬语（如お～になる、～される），对本公司内的人与对外人表述同一事实时敬语层级不同
    formation: 自谦：动词自谦形/お＋动词＋になる；尊敬：お＋动词＋になる／动词＋される
    constraints:
    - 对本人不用敬语，对他人用尊敬语
    - 对本公司内的人与对外人表述同一事实时敬语层级不同
    contrasts:
    - 自谦语（申す/いたす/おる/伺う）与尊敬语（お～になる/～される）的区分
  - pattern: 電話が遠い
    function_cn: 表示电话听不清楚（非指距离远）；同义表达“耳が遠い”指耳朵背、听不清
    formation: 名词+が+遠い
    constraints: []
    contrasts: []
  - pattern: そうなんですか / そうですか
    function_cn: “～んです”带说明理由/情况功能；“そうなんですか”用于向对方说明自己已理解理由情况；“そうですか”用于应答表示已获知新信息
    formation: そう+なんですか / そうですか
    constraints: []
    contrasts:
    - そうなんですか（说明/确认理由）
    - そうですか（应答/确认新信息）
  - pattern: ～予定だ
    function_cn: 表示未来的计划
    formation: 动词基本形+予定だ / 表示事件名词+の予定だ / 动词基本形+予定になっています
    constraints:
    - “～ことになる”的进行时态“～ことになっています”表示已决定好的事情
    contrasts:
    - 明日帰る予定です
    - 明日帰ることになっています（意思相同）
  - pattern: ～にも
    function_cn: “未来时间名词+に”后接强调助词“も”，表示“说不好确切时间，如果快的话……”，语气正式，常见于报纸标题或新闻
    formation: 未来时间名词+にも
    constraints:
    - “明日”“来週”等词后一般不加“に”，但加“も”则用“にも”形式
    contrasts:
    - 表示未来时间名词+助词“は”提示时用“时间名词+には”，含“最迟”义
  - pattern: お／ご＋動詞ます形（ます去掉）＋いただく
    function_cn: 自谦语，表示因对方行为而自己获益，向传达或送东西的人表示敬意；相当于「～てもらう」的自谦表达
    formation: お／ご＋动词ます形去ます＋いただく
    constraints:
    - 用于向传达者（お伝えいただく）或送东西者（お届けいただく）表示敬意
    - 「お～いただく」形式（如おいでいただく、お越しいただく）将对方动作变为尊他语，提高敬意
    contrasts:
    - 与「～てもらう」相对，后者为普通表达，前者为自谦/敬语
  - pattern: あと
    function_cn: 口语中追加忘说的事情或话题，意为“以后”“此外”“还有”
    formation: 独立接续词，用于句中追加内容
    constraints:
    - 用于口语追加说明
    contrasts:
    - 与「それから」用法大致相同
  - pattern: ～ながら（も）
    function_cn: 表示两动作/状态同时进行，或表示转折（让步）；转折义时多用「～ながらも」形式。
    formation: 动词「ます形」去掉「ます」＋ながら；形容词＋ながら。
    constraints:
    - 表示转折时多接在「ある」「いる」「～ている」之后，或接表示认识、态度的动词（如「聞く」「言う」「認め」等）。
    - 比同样表转折的「～が、～」语气更正式。
    contrasts:
    - 与「～が、～」相比更正式；与「～つつ」功能相近但接续与语体有别。
  - pattern: ～つつ
    function_cn: 表示两动作同时进行，或表示转折（让步）。
    formation: 动词「ます形」去掉「ます」＋つつ。
    constraints:
    - 前接一般动作动词且前后主语相同时，表同时进行。
    - 前接表示状态的谓语，或前后项动作主语不一致时，表转折，此时用「～つつも」。
    - 语气比「～ながら」更正式。
    contrasts:
    - 与「～ながら」功能相同（同时进行＋转折），但语体更正式。
  - pattern: ～ながら（も）～／～つつ（も）～
    function_cn: 表示转折，同时含“同时进行”的含义；前项成立的同时后项也成立。
    formation: 接在动词连用形等后（本页为上一页该用法的例句延续）。
    constraints:
    - 既可表转折，也可表同时进行，需依语境区分。
    contrasts:
    - 与单纯表同时进行的用法相比，此处强调前后项的转折关系。
  - pattern: ～型
    function_cn: 表示某种类型、大小、种类或具备某种性质。
    formation: 接在名词、形容词及数字后。
    constraints:
    - 用于强调类别或规格（如血型、型号、机型等）。
    contrasts: []
  - pattern: 楽々
    function_cn: 副词，表示不紧张、随便的样子，或可简便地完成某事的样子；置于句尾可增强亲切感。
    formation: 由二类形容词“楽”发展而来的副词用法。
    constraints:
    - 口语色彩较强，常用于强调操作简便、轻松。
    contrasts: []
  - pattern: 迫力の
    function_cn: 名词修饰，表示具有强烈冲击力、夺人魂魄；由『～がある』转换为『～の』的现在式说法
    formation: 名词 + の
    constraints:
    - 用于修饰名词，表达强烈印象或冲击力
    contrasts:
    - 『～がある』→『～の』『～だ』的同类转换（如『人気がある』→『人気の』）
  - pattern: ～ままに
    function_cn: 表示顺从该动作或意志、按原样进行
    formation: 动词基本形 / 表示动作或意志的名词 + のままに
    constraints:
    - 语气比较正式
    contrasts:
    - 与『～どおりに』意思相同但语体更正式
  - pattern: ～なしで
    function_cn: 表示在不具备本来该有或必须物品的状态下做某事
    formation: 名词 + なしで
    constraints:
    - 叙述附带、不太重要的态度时，如『冗談』『お世辞』不能用『～なしに』『～なしで』
    contrasts:
    - 与『～抜きで』意思相近
  - pattern: 可能となりました
    function_cn: 表示“成为可能”；比“～になりました”更常用于书面语
    formation: 名词后接“と”或“に”均可（如“可能となる”“先生となる”）
    constraints:
    - 书面语倾向更强
    contrasts:
    - 与“～になりました”语体差异
  - pattern: 搭載しており
    function_cn: 强调所具备的功能十分强大（夸张表达）
    formation: 动词“搭載する”的“て”形接续
    constraints:
    - 此处“搭載する”与汉语“搭载”意思完全不同，需注意
    contrasts:
    - 与汉语“搭载”语义差异
  - pattern: ～に加えて
    function_cn: 表示添加、附加；与“～だけでは（は）なく～も”意思相同但语气更正式
    formation: “名词＋に加えて”或“小句＋の／こと＋に加えて”；后项常出现“～も”
    constraints:
    - 语气较正式
    contrasts:
    - 与“～だけでは（は）なく～も”语体差异
  - pattern: ～時
    function_cn: 表示“做该事时”
    formation: 前接表示活动的汉语词
    constraints:
    - 读作“じ”，不读“とき”
    contrasts: []
  - pattern: ～たびに
    function_cn: 表示“如果发生某件事，就会出现另一件事”或“某个时刻总会发生某事”
    formation: “动词（基本形）＋たびに”或“名词＋のたびに”
    constraints: []
    contrasts: []
  - pattern: ～たびに 的同义/近义表达
    function_cn: 表示反复发生的动作或状态，与「～たびに」意思相近
    formation: 动词基本形／一类形容词＋いつも；动词简体形式／一类形容词＋時はいつも；动词基本形／名词＋ごとに
    constraints:
    - 「～時はいつも」可接形容词或表示状态的谓语；「～いつも」一般接动词谓语，但也可接形容词或表示状态的谓语
    - 「～たびに」「～ごとに」一般只用于陈述事件的发生
    - 前接动词基本形时，「たびに」与「ごとに」可互换
    - 「～ごとに」通常用于强调每一次的动作或变化，且该动作或变化是重复的
    contrasts:
    - ～たびに
    - ～ごとに
    - ～いつも
    - ～時はいつも
  - pattern: こだわり
    function_cn: 动词「こだわる」的名词形式，本意为对无聊事情费神（含贬义），现也用作褒义表示留意、追求细微、精益求精；可修饰名词
    formation: 名词，可作「～の＋名词」修饰形式
    constraints:
    - 「こだわる」一般用「～にこだわる」的形式
    contrasts: []
  - pattern: ～次第で
    function_cn: 表示“随名词而变化、与各种状况相适应”；亦表“取决于……”
    formation: 名词＋次第で
    constraints:
    - 动词ます形去掉ます＋次第で 表示“一旦发生某事就马上……”，与“名词＋次第で”含义不同，属易混项
    contrasts:
    - 名词＋次第で（随……变化/取决于……） vs 动词ます形去ます＋次第で（一……就……）
  - pattern: 電器中使用的外来词（词汇主题）
    function_cn: 电器说明中多用外来词（如 ボディ、シーン、モード、スタイリッシュ、コンパクトサイズ 等），以给人美好、时髦的印象，区别于原有日语表达（如 本体、場面、様式、格好がいい）
    formation: 词汇主题，非句型
    constraints:
    - 外来词用于营造印象，而非仅说明功能或机身
    contrasts:
    - 外来词（ボディ/シーン/モード/スタイリッシュ） vs 原有日语表达（本体/場面/様式/格好がいい）
  pragmatics:
  - 電話での丁寧な名乗り（～と申します）
  - 不在時の言い訳・伝言のお願い
  - 区分打电话一方与接电话一方的角色用语
  - 区分要找的人在场与不在场的应对分支
  - 公司电话与私人电话在自报姓名上的差异
  - 电话交际中敬语层级随听话人身份（本公司内/外）变化
  - “～にも”语气正式，多用于新闻/标题
  - “～には”含“最迟”提示义
  - 「お～いただく」通过将对方动作尊他化来提高敬意
