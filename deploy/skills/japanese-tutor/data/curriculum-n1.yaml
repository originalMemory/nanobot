  grammar:
  - pattern: ところで
    function_cn: 转换话题时最常用的连词，表示“不过”，用于在话题A后引入话题B
    formation: 话题A ⇒ ところで ⇒ 话题B
    constraints:
    - 用于话题含有计划性的场合
    contrasts: []
  - pattern: 話が変わりますが／話が変わりますが
    function_cn: 从一个话题转换到相差较大或完全不同的话题时，表示“改换话题／跳过这个话题”
    formation: 话题A ⇒ 話が変わりますが／話が変わりますが ⇒ 话题B
    constraints:
    - 前面常加舒缓语气的“あのう”等词作为铺垫
    contrasts: []
  - pattern: '*さて'
    function_cn: 进入正题或返回正题时使用，表示“那么”
    formation: 话题A ⇒ *さて ⇒ 话题B
    constraints:
    - 只能是把握谈话进程的人才使用
    contrasts: []
  - pattern: '*けれども／でも'
    function_cn: 将话题转移到自己脑子里的某个话题上来，且该话题与之前谈话无任何关联时使用，表示“不过／但是”
    formation: 话题A ⇒ *けれども／でも ⇒ 话题B
    constraints:
    - 用于话题原本不是计划好的内容的场合
    contrasts: []
  - pattern: あ、それから／*あと
    function_cn: 追加想说的内容时使用，表示“对了，另外／另外”
    formation: 话题A ⇒ あ、それから／*あと ⇒ 话题B
    constraints: []
    contrasts: []
  - pattern: それで／*で
    function_cn: 转到可以预想的下一个话题上来时使用，表示“那么”
    formation: 话题A ⇒ それで／*で ⇒ 话题B
    constraints: []
    contrasts: []
  - pattern: '*それでは／では'
    function_cn: 表明转移到新的内容或话题场景时使用，表示“那么，（次的话题に行きましょう）”
    formation: 话题A ⇒ *それでは／では ⇒ 话题B
    constraints: []
    contrasts: []
  - pattern: 最～
    function_cn: 构词前缀，表示“最”，用于构成最高级表达（如最大、最小、最高、最低、最適、最愛等）
    formation: 修饰名词时后续“の”（如“最高の”“最愛の”），也可构成二类形容词（如“最適”）
    constraints:
    - 这些词不能随意直接后续名词，需后续“の”或构成形容词
    - 直接后续名词的用法（如“最高賞”）属特殊用法
    contrasts: []
  - pattern: ～をきっかけにして
    function_cn: 表示引起某事发生的事或机会（契机）
    formation: “～を＋特定名词＋に＋して”的形式，有时可省略“して”
    constraints:
    - 需接特定名词
    contrasts:
    - ～を手がかりにして（以～为线索）
    - ～を頼りにして（借助～）
  - pattern: 助词“も”
    function_cn: 表示并列；或虽未明说但暗示存在其他对象
    formation: 接在名词后表示“也/亦”
    constraints:
    - 数字后接“も”的用法与上述不同，表示数目多
    contrasts: []
  - pattern: ～に受ける
    function_cn: 表示“某人”对此很中意、评价好、喜欢等意思
    formation: 表示人的名词＋に受ける
    constraints: []
    contrasts: []
  - pattern: が／の 的变换
    function_cn: 修饰名词的小句内部，表示一般性质时多用“の”，陈述发生的特定事件时多用“が”
    formation: 修饰名词的小句内部，将“が”改成“の”或反之
    constraints:
    - 表示一般性质时用“の”
    - 陈述特定事件时用“が”
    contrasts:
    - が：特定事件
    - の：一般性质
  - pattern: ～と／～ば（假定条件）
    function_cn: 均含“（～的话），就～”的意思；～と常用于以前项为线索推测后项结果，后项不用命令句；～ば常用于向后项交待情况、说明后项成立的条件，后项多为积极事物
    formation: 动词/形容词条件形＋と／ば
    constraints:
    - ～と后项不用命令句
    - ～ば后项多为积极事物
    - 后项为命令或意志时～たら比～ば用得多
    contrasts:
    - ～と：推测结果
    - ～ば：交待条件
    - ～たら：命令/意志后项更常用
  - pattern: 力士／相撲取り／選手／横綱／金星をあげる
    function_cn: 相扑相关术语与表达：以相扑为职业者称“力士”，取“相撲を取る人”之意又称“相撲取り”；其他运动项目一般称“～選手”，但无“相撲選手”说法；等级最高为“横綱”，一旦成为只要不退休就一直拥有该地位
    formation: 名词/术语
    constraints:
    - 无“相撲選手”的说法
    contrasts:
    - 力士＝相撲取り
    - 其他运动用～選手，相扑不用
  - pattern: ～ということからきた～
    function_cn: 说明某词语或表达方式由原来的意思转变为另一意思的来源解释；用于句尾，常以～てきました的形式出现。
    formation: 名词/表达＋ということからきた（＋言葉です）
    constraints:
    - 用于解释词语的词源或语义演变
    - 相近表达有～に由来した～（～来源于～）
    contrasts:
    - 与～に由来した～近义，均表来源
  - pattern: ～って
    function_cn: 会话中～と／～とは／～という人は等的缩略形式；用于提及对方说过的词语，或只知名称而不知含义等情形；也可突然引入谈话中没有的话题。
    formation: 名词＋って
    constraints:
    - 口语缩略，因不便用～と而使用
    contrasts:
    - 与～と／～とは／～という人は等意义相近，但更口语化
  - pattern: ボトル
    function_cn: 外来词，指瓶子/酒瓶；相比“瓶”更能促使读者想象瓶身别致的设计。
    formation: 外来词（名词）
    constraints:
    - 用于威士忌、葡萄酒等容器时可用
    contrasts:
    - 与“瓶（びん）”近义，但语感更强调外形设计
  - pattern: すてき
    function_cn: 表示有魅力、吸引人的样子；会话中女性常用；多用于从某人服装或携带物品等表现出的外观上的时髦、优雅和魅力。
    formation: 形容词性（～です／～な人です）
    constraints:
    - 侧重外观上的时髦优雅
    contrasts:
    - 与“すばらしい”相比，后者意思更广泛
  - pattern: 人気がある
    function_cn: 表示评价好、受大众欢迎；「人気」为名词，「人気がある」表示评价好
    formation: 名词「人気」＋ある
    constraints: []
    contrasts: []
  - pattern: ～のは間違いない
    function_cn: 表示说话人持有某种依据，做出确信不疑的判断
    formation: 动词简体形式＋のは間違いない（「の」使前接动词名词化）；「の」可用「こと」替代，即「～ことは間違いない」；另有「～ことに間違いない」
    constraints:
    - 不能与「きっと」「たぶん」等推测副词连用
    contrasts:
    - 与「～に違いない／～に相違ない」相比，本式表示确信判断而非推测
  - pattern: ～に違いない／～に相違ない
    function_cn: 表示推测；「相違ない」可单独使用表示认定（所说正确），用于书面语
    formation: 小句（简体形式）＋に違いない／に相違ない；前接二类形容词或名词时用「二类形容词/名词＋に違いない/に相違ない」
    constraints:
    - 可与「きっと」「たぶん」等副词连用
    - 「～に相違ない」只用于书面语
    contrasts:
    - 与「～のは間違いない」相比，本式表示推测而非确信判断，且可与推测副词连用
  - pattern: 指示词「それ／その」与「これ／この」的语用区分
    function_cn: 「それ」系指示对方所及范围内或对方提到的事物；「これ」系用于说明自己即将陈述或对方尚不知道的事情。
    formation: 指示代词/连体词，按说话人与所指对象的距离及信息新旧选择。
    constraints:
    - 对话中提及对方已知/对方所说内容时用「それ」系
    - 引出自己新陈述或对方未知信息时用「これ」系
    contrasts:
    - 「それ」系 vs 「これ」系：信息归属与新旧之别
  - pattern: 汉字音读（音読み）与训读（訓読み）
    function_cn: 音读仿汉语发音，训读配日语固有发音；活用词训读需加假名表活用。
    formation: 音读+音读、训读+训读、重箱読み（音训）、湯桶読み（训音）、熟字訓（整词惯用读）。
    constraints:
    - 重箱読み：音读在前、训读在后
    - 湯桶読み：训读在前、音读在后
    - 熟字訓：读音不对应单字而对应词整体
    contrasts:
    - 音读 vs 训读
    - 重箱読み vs 湯桶読み
  - pattern: ～という点から
    function_cn: 从某一观点、方面进行判断、分类或推断；与「～という点で」搭配表示依据某性质判断
    formation: 名词/动词连体形＋という点から／で
    constraints:
    - 「点」表示观点、方面，可与「こと」互换
    - 助词「から」表起点，推断起点亦用「から」
    contrasts:
    - ～という点で（依据～性质判断）
  - pattern: もともと
    function_cn: 表示某事、某人或某种状况起始时的样子
    formation: 副词，修饰动词/形容词
    constraints:
    - 语气比「元来」「本来」郑重而正式
    contrasts:
    - 元来
    - 本来
  - pattern: 音读和训读
    function_cn: 同形汉字采用音读与训读时意义不同（如「金星」音读指行星，训读指成就功绩）
    formation: 词汇读音区分
    constraints:
    - 需结合上下文判断读音与词义
    contrasts: []
  - pattern: ～に基づいた
    function_cn: 依据某种判断或消息来源实施某种行为
    formation: 名词＋に基づいた
    constraints:
    - 「基」意为“基点”
    contrasts: []
  - pattern: ～に基づいて＋谓语 / ～に基づく＋名词 / ～に基づいた～
    function_cn: 表示依据、根据；句尾一般用“～に基づいています”形式；前接名词时“基づく”与“基づいた”意思相同，多用于书面语，前接名词主要为表示信息内容的词。
    formation: 名词＋に基づいて／に基づく／に基づいた
    constraints:
    - 书面语倾向
    - 前接名词多为信息内容类名词
    contrasts:
    - ～に基づいた～ 与 ～を基にした～ 意思相同
  - pattern: ～を中心とした～ / ～を中心とする～
    function_cn: 举出主要要素、中心要素或代表性事例；后续谓语动词时用“～を中心に＋动词”“～を中心として＋动词”；“中心”有时表示空间位置关系。
    formation: 名词＋を中心とした＋名词 / 名词＋を中心とする＋名词 / 名词＋を中心に＋动词
    constraints:
    - 表示代表性事例或中心要素
    - 可表空间位置
    contrasts:
    - ～を中心とした～ 与 ～を中心とする～ 意思相同
  - pattern: ～のうち
    function_cn: 相当于“在……当中”，用于从两个以上要素中选出一个；也可用于组织或团体等名词。
    formation: 名词／名词列举＋のうち
    constraints:
    - 用于从多个要素中选取其一
    - 可接组织、团体类名词
    contrasts: []
  - pattern: ～を～と呼ぶ
    function_cn: 表示用别的名称B来命名A，为读者或听话人说明陌生词语；书面语中使用该形式。
    formation: 名词A＋を＋名词B＋と呼ぶ
    constraints:
    - 书面语
    - 用于命名或定义说明
    contrasts:
    - 口语对应形式为“AをBという”
  - pattern: たいてい
    function_cn: 表示“大部分、大多数”；作副词时虽非总是那样但频率很高、一般具有那样倾向；与 ほとんど、だいたい 同义，可后续助词「の」。
    formation: 副词／名词，可接「の」修饰名词
    constraints:
    - 原为表示频率的副词，作名词使用时与 ほとんど 同义为“大部分”
    contrasts:
    - ほとんど（基本上）、大部分（大部分）等也表示数量所占比例很大
  - pattern: ～ような～／～ように～
    function_cn: 表示“像（是）～的、类似～的”；可表示具体内容或举出具体事例；后续谓语成分时用 ～のように 形式。
    formation: 名词＋の＋ような～；二类形容词＋な＋ような～；小句（简体形式）＋ような～；后续谓语成分用 ～のように
    constraints:
    - 有时表示具体内容（如“死人事故”），有时举出具体事例（如“类似去年发生过的那样事故”）
    contrasts: []
  - pattern: ～というような／～というように／～といったような／～といったように
    function_cn: 表示存在类似事物或列举部分例子；「～という」+「ような」构成，列举多个例子时用「～といったような」；跟谓语后变为「～というように」；仅列举一个例子时用「～のような」，不可用「～というような」「～といったような」「～といった」。
    formation: 「～という」+「ような／ように」；多例时「～といったような」
    constraints:
    - 单例列举须用「～のような」，禁用「～というような」「～といったような」「～いった」
    - 谓语后接「～というように」
    contrasts:
    - ～というような vs ～といったような（后者含从多个例子中举出部分例子的语气）
  - pattern: ～というふうな／～というふうに
    function_cn: 由表示引用的「～という」与表示情况、样子的「～ふう」组合，用于列举多个具体事例、陈述处理办法或顺序；也可用于引述情况或样子。
    formation: 「～という」+「～ふうな／～ふうに」
    constraints:
    - 语体略口语化
    - 因原本表示引用，可兼用于引述情况或样子
    contrasts:
    - 与「～というように／～のような」功能相近，但「～というふうに／～ふうな」更口语化
  pragmatics:
  - 把握谈话进程者方可使用 *さて
  - 改换大相径庭话题时常用“あのう”等铺垫
  - すてき在会话中女性常用
  - ～って用于不便用～と的口语场合
  - 指示词选择体现信息的新旧与归属（对方已知 vs 自己新提出）
  - 同一汉字词在汉语与和语读法下意义不同（如「生物」）
  - 汉语词与外来语在语感/意象上的差异（如「旅館」与「ホテル」）
