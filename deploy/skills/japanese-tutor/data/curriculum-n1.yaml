  grammar:
  - pattern: 拜访人家的招呼与欢迎寒暄表达
    function_cn: 来访者敲门招呼、主人表示欢迎的固定寒暄语
    formation: 固定寒暄语，无特定接续
    constraints: []
    contrasts: []
  - pattern: 催促对方动作的邀请表达（どうぞ 类）
    function_cn: 招呼对方进屋、引导方向的邀请语
    formation: 动词/方向词 + どうぞ
    constraints: []
    contrasts: []
  - pattern: 久别重逢的问候表达
    function_cn: 来访者初次问候、表示好久不见
    formation: 固定问候语
    constraints: []
    contrasts: []
  - pattern: 进入屋内前的致歉/打扰表达
    function_cn: 受邀进屋前表示失礼、打扰的谦让语
    formation: 固定谦让表达
    constraints: []
    contrasts: []
  - pattern: 赠送礼物时的自谦语与收受礼物时的意外/感谢表达
    function_cn: 送礼时用自谦语淡化礼物价值，收礼时表达意外与感谢
    formation: 自谦语 + 委婉省略句式
    constraints:
    - 送礼时多用不把话说完的委婉方式
    contrasts: []
  - pattern: 告辞时的谦让表达与挽留客套
    function_cn: 客人表示告辞、主人出于礼节挽留的客套语
    formation: 固定告辞/挽留表达
    constraints: []
    contrasts: []
  - pattern: よく～てくれる
    function_cn: 在表示别人为自己做了某事的“～てくれる”基础上加副词“よく”，更清楚地表露感谢心情；也可用于对实现困难之事的人或结果的幸运表示感叹。
    formation: 动词て形 + くれる；敬体对应“よく～てくださりました”。
    constraints:
    - 动作主体为自己的下级或晚辈时用“よく～てくれた”
    - 尊长或关系不够密切的人用“よく～てくださりました”
    contrasts:
    - 与单纯“～てくれる”相比，加“よく”后感谢/感叹语气更明确
  - pattern: せっかくの～
    function_cn: 副词，修饰动词时表示“特意”“好不容易”；也可像名词一样使用。
    formation: 修饰动词；或“せっかく+の+[表示物的名词]”“せっかくだから”“せっかくだけど”等。
    constraints: []
    contrasts: []
  - pattern: まあ、まあ
    function_cn: 句首使用，用于打断对方顾虑或客气话使谈话向前进展，或平息对方怒气；含有“这样的客套话可以不用说了”的语气。
    formation: 置于句首的感叹/缓和表达。
    constraints: []
    contrasts: []
  - pattern: 後にして
    function_cn: 表示将必须做的事往后推迟、现在不用做；也可表示离开某地
    formation: 动词/名词 + 後にして
    constraints:
    - 兼具“推迟”与“离开”两种语用含义
    contrasts: []
  - pattern: とにかく
    function_cn: 表示“不管怎样、无论如何”“反正、总之”，用于强调或陈述重要事物
    formation: 副词性接续，置于谓语前
    constraints:
    - 用于强调先行动或先做某事
    contrasts: []
  - pattern: これ、つまらないものですが…
    function_cn: 赠送礼物时的自谦表达，话说一半不说完以示谦逊
    formation: これ + つまらないものですが + 省略（完整形为 よかったら受け取ってください）
    constraints:
    - “は”通常省略；只说半句以表谦逊
    contrasts: []
  - pattern: ～のに
    function_cn: 表示在A状况下发生的B不合常理，或结果与说话人想法相反；可省略“のに”之后部分
    formation: A（状况/预期）+ のに + B（相反结果）
    constraints:
    - 本页标注为复习（復習）
    contrasts: []
  - pattern: 遠慮なく
    function_cn: 表示在对方面前不客气地做某事，用于口语
    formation: 远慮なく + 动词
    constraints:
    - 意思与“遠慮しないで+动词”相同
    contrasts:
    - 比“遠慮しないで”更正式一些
  - pattern: やりがい
    function_cn: 表示实施某种行为时感受到的满足感或值得那样做的价值
    formation: 动词「ます形」去掉「ます」+「がい」；同类表达如「働きがい」「生きがい」
    constraints: []
    contrasts: []
  - pattern: ～かい
    function_cn: 表示轻微的疑问；读作降调时表示同意的应答，读作升调时表示对对方所说内容持疑问、确认是否真实或表示接受对方所说的话
    formation: 疑问助词「か」后续「い」组合成「～かい」
    constraints:
    - 简体形式，只能对关系密切的人使用
    - 主要是上了年纪的男性使用，年轻男性和女性很少这样说
    contrasts: []
  - pattern: も
    function_cn: 表示并列、除此之外还有；在陈述某事的同时表达打扰对方较长时间、对方已到就寝时间等理由，起缓和语气的作用
    formation: 助词「も」
    constraints: []
    contrasts: []
  - pattern: ～によろしく
    function_cn: 表示请将我的好意传达给那个（些）人，即请代我问候某人
    formation: 完整说法为「名词(人)+によろしくお伝えください」
    constraints: []
    contrasts: []
  - pattern: 条目式文体（书面语特点）
    function_cn: 书面语中只需写出必要事项；向对方传达信息时可用敬体，但学校或公共机关的招贴公告一般用简体形式（～する／～である），不用敬体。
    formation: 动词/形容词/名词的简体形式（～だ、～である）
    constraints:
    - 用于书面语、公告、条目式文体
    - 区别于口语敬体（です・ます）
    contrasts:
    - 与敬体（です・ます）相对，条目式文体倾向用简体
  - pattern: ～である
    function_cn: 书面语中比～だ更正式，用于论文、评论文等；过去式为～であった，礼貌表达为～であります（比～です更正式）。
    formation: 名词/形容词词干＋である；动词用ます形去ます＋である（如読む→読めである类形式，教材以动词简体对应）
    constraints:
    - 用于书面语、正式文章
    - 礼貌式～であります比～です正式
    contrasts:
    - ～だ（简体）vs ～である（书面正式）
    - ～であります vs ～です
  - pattern: ～こと
    function_cn: 向对方吩咐必要事情或书写注意事项；用于书面语或正式文章、条目式文体；书写告示、贴条时句尾统一用～こと并标注序号，使内容简洁。
    formation: 动词基本形／ない形＋こと
    constraints:
    - 没有～しますこと这样的敬体形式
    - 用于书面语、正式文章、条目式文体
    contrasts:
    - 无敬体对应形式，区别于です・ます体系
  - pattern: ～ことだ
    function_cn: 用于口语中表示忠告、建议或委婉命令，陈述某种理想状况或好的情形；与书面语「～こと」相对，礼貌表达为「～ことです」。
    formation: 动词基本形／ない形＋ことだ
    constraints:
    - 口语用法，区别于书面语「～こと」
    - 礼貌形式为「～ことです」
    contrasts:
    - ～こと（书面语）
  - pattern: ～際
    function_cn: 表示在某一时机／场合，比「～時」更正式，并增添机会、机遇等语气。
    formation: 小句（简体形式）＋際／名词＋の＋際
    constraints:
    - 可后接「の」「に」「は」等助词
    - 比「～時」正式
    contrasts:
    - ～時（可替换，较不正式）
  - pattern: ～を問わず
    function_cn: 表示「不论～」，通常用作书面语；招聘广告中常见「性別は問わず」等说法。
    formation: 名词＋を問わず
    constraints:
    - 「を」前大多使用正反义成对的词语（如男女、昼夜）
    - 书面语
    contrasts: []
  - pattern: ～て初めて
    function_cn: 表示某事项成立之后，与之关联的下一阶段事项才会发生；用于注意到以前未注意之事或完成以前无法完成之事等情形，含强烈愿望义，多用于判断、断定句，其后不接命令句。
    formation: 动词て形＋初めて
    constraints:
    - 后接判断/断定句
    - 不接命令句
    contrasts:
    - 与“～てから～”近似但语感不同
  - pattern: ごく＋名词
    function_cn: 强调后续词语，表“极其/非常”，多用于范围小或数量少（如ごく一部、ごくわずか、ごく少量、ごく微量）；强调量小或量少，故不说“ごく多い/ごく大量”。
    formation: ごく＋名词
    constraints:
    - 用于量小/量少语境
    contrasts:
    - 不用于“多い/大量”等大量表达
  - pattern: 少しでも～
    function_cn: 修饰谓语，表示“尽可能～、越早/越多越好”；较随便的说法为「ちょっとでも～」。
    formation: 接在谓语前作状语修饰；可进入目的小句（～ように）、意愿/命令句（～ましょう／～してください）。
    constraints:
    - 一般不用于表示单纯过去发生的事情。
    contrasts:
    - 「少しでも～ように」用于目的小句；「少しでも～ましょう／～してください」用于意愿、命令句。
  pragmatics:
  - 赠送礼物时使用自谦语，常采用不把话说完的方式
  - 收受礼物时表现出意外心情，可表示不必带来礼物或让对方费心不好意思
  - 告辞时表达给对方添麻烦的歉意与谦逊态度，接待方常以礼节性挽留回应
  - 根据对方身份（下级/晚辈 vs 尊长/关系不密切）选择“よく～てくれた”或“よく～てくださりました”
  - “つまらないものですが…”故意只说半句以表谦逊
  - “遠慮なく”与“遠慮しないで”语域差异：前者更正式
  - 「～かい」为简体，限关系密切者，且以年长男性使用为主
  - 「も」用于缓和语气，避免直接陈述显得生硬
  - 敬体与简体的文体区分
  - 正式度层级：～だ < ～である；～です < ～であります
