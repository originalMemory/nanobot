  communication_functions:
  - 对物品质感/外观进行比喻式评价
  - 评价某人言行符合其身份特征
  - 询问并约定文件/物品的发送截止时间
  - 说明购买计划与打工打算
  - 婉转陈述意见/看法
  - 商定/确认事务安排（今日中に候補地を探す）
  - 提出建议与商量选址（ここ、いいんじゃないですか／ここにしましょうか）
  - 描述场所特征（広くて、明るくて、交通の便もいい）
  - 表达遗憾/不满（ちょっとうるさかったですね）
  - 介绍地点与文化背景（外灘、古い建物が多い）
  - 提议顺路前往某地（どこかちょっと寄りませんか／南京路へ行きましょう）
  grammar:
  - pattern: まるで～のようです／まるで～みたい
    function_cn: 比喻，表示“简直像……一样”，强调相似程度高
    formation: 名词／名词短语＋まるで＋のようです／みたい
    constraints:
    - 用于主观比喻，常带感叹或赞叹语气
    contrasts:
    - ～ようです（一般推测/听说）
  - pattern: いかにも～らしい
    function_cn: 表示“典型地……、很符合……的特征”
    formation: いかにも＋名词／形容动词词干＋らしい
    constraints:
    - 多用于评价某人/某物符合其身份或类别的典型特征
    contrasts:
    - ～らしい（单纯表示‘像……的’）
  - pattern: ～までに
    function_cn: 表示动作完成的时间下限“在……之前（含该时点）”
    formation: 时间名词＋までに
    constraints:
    - 强调在该时间点前完成某事
    contrasts:
    - ～まで（持续到某时点）
  - pattern: ～ている間に
    function_cn: 表示“在……（持续）期间”，另一事件发生或状态变化
    formation: 动词て形＋いる間に
    constraints:
    - 主句常为变化或完成的结果
    contrasts:
    - ～ながら（同时做两事）
  - pattern: ～なければならない
    function_cn: 表示客观或主观上的“必须、不得不”
    formation: 动词辞书形＋なければならない
    constraints:
    - 语气较强，含义务/必要
    contrasts:
    - ～たい（想要）
  - pattern: ～つもりだ
    function_cn: 表示“打算、准备（做某事）”
    formation: 动词辞书形／名词＋つもりだ
    constraints:
    - 表示说话人主观意图
    contrasts:
    - ～つもりがない（没打算）
  - pattern: 名+の／动(简体形)＋ようです；名／动(简体形)＋みたいです
    function_cn: 表示比喻（区别于第44课表示推测的用法），常与副词“まるで”呼应使用
    formation: 名词或动词简体形后接ようです／みたいです
    constraints:
    - 用于句尾表示比喻
    - 修饰名词、动词或形容词时改用～ような／みたいな+名词 或 ～ように／みたいに+动词/形容词
    contrasts:
    - 与第44课表示推测的ようです／みたいです区分
  - pattern: 名1＋らしい＋名2
    function_cn: 表示典型性，即名2具有名1的典型特征，常与副词“いかにも”呼应使用
    formation: 名词1后接らしい再接名词2
    constraints:
    - 当名词1与名词2为同一名词时，表示“真正意义上的～／像样的～”
    contrasts:
    - 与第44课表示推测的～らしい区分
  - pattern: 名[时间]＋までに
    function_cn: 表示某种事态发生或完成的期间的终点（截止时间）
    formation: 时间名词后接までに
    constraints: []
    contrasts:
    - 与“时间+まで”（动作持续的最后时间）区分：までに强调完成/发生的截止点，まで强调持续终点
  - pattern: 名+の／动(简体形)+間／間に
    function_cn: 表示某种行为或事态持续的时间段（～間）或发生/完成的时间范围（～間に）
    formation: 名词接「の」，动词用简体形，后接「間」或「間に」
    constraints:
    - 「～間」多与副词「ずっと」连用，强调持续状态
    - 「～間に」侧重该时间段内某行为发生或完成
    contrasts:
    - 「間」表持续 vs「間に」表范围内发生/完成
  - pattern: 名のような味／においがします
    function_cn: 表示感觉到某种（比喻性的）味道或气味
    formation: 在「味／においがします（有味道/气味）」前加比喻表达「～ようです」构成
    constraints:
    - 除「味／におい」外，听觉「声／音」、感觉「感じ」也用「～がします」
    - 表示身体状况的词（如頭痛、寒気）也可置于「～がします」前
    contrasts:
    - 此处「～します」不可替换为「～あります」（如「においがあります」为误用）
  - pattern: 済ませたい／済ませます
    function_cn: 他动词，表示“结束某件事”；与自动词“済み”（事情结束）对应
    formation: 他动词“済ませる”的意志形“済ませたい”及礼貌形“済ませます”
    constraints:
    - 他动词需带宾语（如“準備を済ませる”“食事を済ませる”）
    - 对应自动词“済み”表示事情自然结束，无需宾语
    contrasts:
    - 他动词“済ませる”（主动结束某事） vs 自动词“済み”（事情结束）
  - pattern: ～んじゃないですか
    function_cn: 婉转陈述意见的表达②，与“～のではないのでしょうか”意思基本相同
    formation: 形容词/动词简体形 + んじゃないですか
    constraints:
    - 礼貌程度比“～のではないのでしょうか”略低
    contrasts:
    - ～んじゃないですか（较随意） vs ～のではないのでしょうか（更礼貌）
  - pattern: いかにも
    function_cn: 表示特别像某种样子或浓厚地具有某种性质，多与“～らしい”呼应使用，表示典型性
    formation: 副词“いかにも” + 名词/形容词 + らしい
    constraints:
    - 与“～らしい”呼应使用时只能表示典型性，不能表示推测
    contrasts:
    - “～らしい”单独使用可表推测或典型性；与“いかにも”搭配时仅表典型性
  pragmatics:
  - “～んじゃないですか”比“～のではないのでしょうか”礼貌程度略低，用于较随意的意见表达
  - 使用敬体（です/ます）进行商务场合的商量与提议
  - 用「～んじゃないですか」委婉提出建议
