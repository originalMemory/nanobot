  jlpt_estimate:
    status: unverified
  communication_functions: []
  grammar:
  - pattern: ～（よ）うにも～ない
    function_cn: 表示尽管有某种必要或意愿，却因客观条件而无法办到、做不到。
    formation: 动词意志形＋にも＋动词可能形式的ない形
    constraints:
    - 前后动词需形成意愿与可能/现实的对照关系
    contrasts: []
  - pattern: ～たきり
    function_cn: 表示在实施前一动作、行为以后，没有实施下一步的相应行为或动作，状态持续未变。
    formation: 动词た形＋きり
    constraints:
    - 强调前一动作完成后后续动作缺失、停滞
    contrasts: []
  - pattern: ～極まらない
    function_cn: 表示“极为……”“无以复加……”，多用于特别有意外性的词语，常表示不好的意思，也可用于与价值高低无关的场合。
    formation: 一般前接名词或二类形容词；多与～なんて、～とは等搭配使用
    constraints:
    - 使用～極まる形式时前接二类形容词，表示“无以复加……”“无比……”
    - ～極まる～与～極まらない～可表示同样意思
    contrasts:
    - 相关表达还有～といったらない、～といったらない、～といったらない（多用于……）
  - pattern: ～といったらない
    function_cn: 接一类形容词，表示程度极高、令人难以忍受，主要用于口语。
    formation: 一类形容词＋といったらない
    constraints:
    - 主要用于口语
    - 前接一类形容词
    contrasts: []
  - pattern: ～途中で
    function_cn: 表示移动的出发点与目的地之间的场所，或开始与结束之间的时间点/时间段；表示某行为正在进行期间发生了别的动作。
    formation: 名词＋の＋途中で；动词基本形＋途中で
    constraints:
    - 「途中の駅」指从起点向目的地移动中间的车站（中途站）
    contrasts: []
  - pattern: 「うち」与「間」的区别
    function_cn: 「間」表示时间段，可与「～から～まで」连用；「うち」表示“赶在某种变化发生之前”，该用法不能用「間」替换。两者均可使用时，「間」指从开始到结束的整个期间，「うち」只把开始或结束的那一刻作为着眼点（着眼点在开始则结束部分不在视野内，反之亦然）。
    formation: 「～から～までの間」可用；「～から～までのうち」不可用
    constraints:
    - 「うち」表“变化发生之前”时不可用「間」替换
    contrasts:
    - 「間」= 整个期间
    - 「うち」= 以开始或结束某一刻为着眼点
  - pattern: ～ている間に／～ているうちに
    function_cn: 表示动作进行过程中发生另一事；「間に」强调中途（事后仍持续），「うちに」强调逐渐/不知不觉地发生
    formation: 动词て形＋いる＋間／うち＋に
    constraints:
    - 两者语义侧重不同，不可互换
    contrasts:
    - 間 vs うち
  - pattern: ～の間／～のうち
    function_cn: 表示时间范围；「間に」指该期间内完成，「うちに」指以该时间为期限前完成
    formation: 名词（时间）＋の間／のうち
    constraints:
    - 「1日の間でも」自然，「1日のうちでも」不自然
    contrasts:
    - 間 vs うち
  - pattern: 反面，～
    function_cn: 表示同一事物存在不同两个方面，多用于陈述事物性质
    formation: 句中：小句（简体形）＋反面；也可用于句首
    constraints:
    - 用于同一主体的两面性对照
    contrasts:
    - 反面 vs 他方
  - pattern: 他方，～／一方～，他方～
    function_cn: 对照两方面情况，多数情况下前后主语不同；叙述主语相同的两个方面时可用「また一方」
    formation: 一方＋～，他方＋～；或单用「他方」
    constraints:
    - 与「反面」区别：他方多用于不同主语或不同主体的对照
    contrasts:
    - 他方 vs 反面
    - 他方 vs また一方
  - pattern: ～に向けて
    function_cn: 表示“面对某个方向或对象”，朝某方向、以某对象或目标
    formation: 名词＋に向けて
    constraints:
    - 表示目标时不能替换为 ～に向かって
    contrasts:
    - ～に向かって：朝某目标，表示动作的方向或对象；表示方向或对象时两者可互换
  - pattern: ～を～として位置づける
    function_cn: 表示定位，把A作为B，给予一定评价
    formation: AをBとして位置づける
    constraints:
    - 被动形式 ～として位置づけられる 用法较多见
    contrasts: []
  - pattern: ～に伴い
    function_cn: 表示由于一方面变化，另一方面也发生变化
    formation: 名词＋に伴い / 动词基本形＋に伴い / 动词基本形＋の＋に伴い
    constraints: []
    contrasts:
    - 与 ～に伴って 相同
  - pattern: ～について／～につぐ
    function_cn: 表示顺序、紧随其后、仅次于某事物（排名或程度上的第二、第三等）
    formation: 名词＋について／につぐ
    constraints:
    - 用于表达先后顺序或等级次序，强调紧接在前一项之后
    contrasts: []
  pragmatics: []
