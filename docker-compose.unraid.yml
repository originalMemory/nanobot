# Standalone deployment: docker compose -f docker-compose.unraid.yml ...
x-unraid-icon: &unraid-icon
  net.unraid.docker.icon: "https://nanobot.wiki/assets/nanobot_icon.png"

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    target: unraid
    args:
      NANOBOT_CHANNELS: qq,telegram,websocket,weixin
  user: "99:100"
  group_add: ["281"]
  environment:
    PUID: "99"
    PGID: "100"
    TZ: Asia/Shanghai
    HTTP_PROXY: "http://192.168.31.73:7890"
    HTTPS_PROXY: "http://192.168.31.73:7890"
    NO_PROXY: "localhost,127.0.0.1,192.168.31.73,nanobot-gateway,nanobot-api"
    OAUTH_CLI_KIT_TOKEN_PATH: "/home/nanobot/.nanobot/auth/codex.json"
    PYTHONPATH: "/home/nanobot/src"
  working_dir: /home/nanobot/src
  volumes:
    - .:/home/nanobot/src
    - ./.nanobot:/home/nanobot/.nanobot
    - ./.nanobot/.ssh:/home/nanobot/.ssh
    - /mnt/cache/ssd/note:/home/nanobot/note
    - /mnt/cache/ssd:/nas/ssd
    - /mnt/cache/appdata:/nas/appdata
    - /mnt/cache/clouddrive:/clouddrive
    - /mnt/user/hdd:/nas/hdd
    - /var/run/docker.sock:/var/run/docker.sock
  # Preserve the existing NAS bubblewrap and Docker-socket access.
  cap_drop: [ALL]
  cap_add: [SYS_ADMIN]
  security_opt: [apparmor=unconfined, seccomp=unconfined]

services:
  nanobot-gateway:
    <<: *common-config
    container_name: nanobot-gateway
    command: [gateway]
    restart: unless-stopped
    ports: ["18790:18790", "8765:8765"]
    labels:
      <<: *unraid-icon
  nanobot-api:
    <<: *common-config
    container_name: nanobot-api
    profiles: [api]
    command: [serve, --host, 0.0.0.0, -w, /home/nanobot/.nanobot/api-workspace]
    restart: unless-stopped
    ports: ["127.0.0.1:8900:8900"]
    labels:
      <<: *unraid-icon
  nanobot-cli:
    <<: *common-config
    profiles: [cli]
    command: [status]
    stdin_open: true
    tty: true
    labels:
      <<: *unraid-icon
